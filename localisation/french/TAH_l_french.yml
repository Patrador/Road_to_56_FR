 TAH_mangoes_desc:0 "Peut-être qu'une vie de criminel n'en valait pas la peine après tout. Qui n'aime pas les mangues ?"
 TAH_god_damn_plan:0 "Le plan néerlandais est terminé..."
 tahiti.plan.1.t:0 "Un étranger mystérieux arrive"
 tahiti.plan.1.d:0 "A small yet rather strange group of people have arrived on our shores via steamboat from an unknown location within the United States. Their leader, a well dressed man, has already charmed his way into favor with [ROOT.GetLeader] and has convinced them to grant them asylum, along with their fortune in cash and gold that they \"obtained\" several decades prior. He claims that this was his entire plan all along, and that now they will reside in our nation and start a mango-harvesting business on a newly-acquired plantation, though it is not clear through which ways they were able to obtain it at this point in time..."
 tahiti.plan.1.a:0 "Tout se déroule selon le putain de plan !"
