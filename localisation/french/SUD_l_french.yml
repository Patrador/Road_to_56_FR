 SUD_jihad_against_british:0 "A Second [SUD.GetAdjective]-[ENG.GetAdjective] War"
 r56_sudan.1.t:0 "[FROM.GetNameDefCap] Proposes Peace Solution"
 r56_sudan.1.desc:0 "[FROM.GetNameDefCap] recently sent us a telegram, proposing an ultimate solution to the war between our two nations. After the loss of our Eastern African holdings by the hands of [FROM.GetNonIdeologyName], they are now demanding their holdings in exchange for peace."
 r56_sudan.2.t:0 "[FROM.GetNameDefCap] Accepts Peace"
 r56_sudan.2.desc:0 "[FROM.GetNameDefCap] has recently capitulated to our demands, and has allowed us to continue our occupation of our East African holdings until further notice. We have brought glory to our nation at last!"
