 SUD_unstable_nation:0 "Nation divisée"
 SUD_unstable_nation_desc:0 "[ROOT.GetAdjective] La politique est loin d'être stable, en raison de facteurs tels que les conditions de vie précaires et les conflits ethniques, il est extrêmement difficile pour tout gouvernement fort de s'établir."
