 SUD_strike_against_the_opressors:0 "Grève contre les oppresseurs"
 SUD_strike_against_the_opressors_desc:0 "Le temps est venu. [EGY.GetNameDefCap] ont passé des décennies à tenter de supprimer notre destin, il est maintenant temps de riposter et de leur donner un avant-goût de leur propre médecine."
 SUD_unite_the_opposition:0 "Unir l'opposition"
 SUD_unite_the_opposition_desc:0 "The government of [ROOT.GetLeader] has proven to be corrupt and undesireable for the people of [ROOT.GetNonIdeologyName]. We must form a united front against the tyrannical government and topple the regime once and for all!"
