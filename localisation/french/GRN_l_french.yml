 GRN_the_carrier_which_came_in_from_the_cold:0 "Le Porte-avions qui Vint du Froid"
 GRN_the_carrier_which_came_in_from_the_cold_desc:0 "Notre situation géographique nous permet de développer un porte-avions géant basé sur la glace. Cela nous permettrait de dominer partout où brille l’aurore boréale et de soutenir le débarquement pour atteindre la « cuisine » où certains d’entre eux se cachent."