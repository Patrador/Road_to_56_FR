l_french:
 is_circassia_tt:0 "A formé §YCircassie§!"
 form_circassia_category:0 "La Marche pour la Circassie"
 form_circassia_category_desc:0 "Avec la bataille de Qbaada mettant fin à la guerre russo‑circassienne centenaire en 1864, la fin brutale et sanglante de la Circassie fut accomplie. Ce qui suivit fut presque un siècle d’oppression et de tyrannie, conduisant à la revitalisation de l’idée nationale circassienne. Désunis et divisés, nous avons prouvé être une proie facile pour les Russes… plus maintenant, proclamons‑nous, l’honneur au‑dessus de la vie !"
 KBK_form_circassia:0 "Déclarer la survie de la Circassie"
 KBK_form_circassia_desc:0 "Avec les anciennes terres natales des tribus désormais entre les mains de notre gouvernement, la souveraineté restaurée de toute la Circassie peut être annoncée au monde."
 r56_circassia.1.t:0 "La restauration de la Circassie"
 r56_circassia.1.desc:0 "Nouvelle surprenante du Caucase du Nord — l’ex‑[KBK.GetOldName], après sa conquête de territoires s’étendant jusqu’à la mer Noire, a proclamé la renaissance du pays tribal déchu qu’était la Circassie. Aujourd’hui, [KBK.GetLeader] a annoncé le « début d’une ère glorieuse » alors que [KBK.GetNameDef] se tient de nouveau en tant qu’État.\nBeaucoup dans la diaspora préparent déjà leur retour vers la patrie ancestrale. Le gouvernement [KBK.GetAdjective] s’y attendait et est pleinement déterminé à en accueillir les retours."
 r56_circassia.1.a:0 "Les Circassiens sont vivants ! Adyge Xabze est vivant !"
 r56_circassia.1.b:0 "De retour du bord du gouffre"
 r56_circassia.1.c:0 "Cela ne doit pas être toléré !"