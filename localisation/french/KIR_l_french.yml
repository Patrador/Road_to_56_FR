l_french:
 USA_contest_canton_island:0 "Occuper l'île de Canton"
 KIR_tekinaiti:0 "Tekinaiti"
 KIR_taburimai:0 "Taburimai"
 KIR_kaiea_ii:0 "Kaiea II"
 canton_island.1.t:0 "[USA.getNameDefCap] occupe île Canton"
 canton_island.1.d:0 "Récemment, un convoi de scientifiques américains a été envoyé vers les îles pour superviser l’éclipse solaire en cours. Bien que leur mission initiale fût seulement d’observer l’éclipse, ils ont décidé d’aller plus loin et d’occuper les îles."
 canton_island.1.a:0 "Nous avons des préoccupations plus urgentes à régler…"
 USA_contest_canton_island_desc:0 "La position stratégique de l'île Canton nous permet d’y mener des recherches sur l’île et ses environs, tout en en faisant une base militaire utile pour tout conflit potentiel à venir."