l_french:
 TAN_Industrial_Start:0 "Commencer l'accumulation industrielle"
 TAN_Industrial_Start_desc:0 "Une ère de changement s'annonce. Les investissements arrivent, les machines s'inventent et notre pays doit s'adapter pour faire face à ces évolutions."
 TAN_Futher_Investments:0 "Encourager les investisseurs étrangers"
 TAN_Futher_Investments_desc:0 "Les puissances étrangères ont une industrie beaucoup plus grande que la nôtre, nous devons donc nous fier à leur savoir."
 TAN_Civilian_One:0 "Développer les fabrications civiles"
 TAN_Civilian_One_desc:0 "De nouvelles usines sont essentielles pour un pays moderne."
 TAN_Civilian_Two:0 "Améliorer la capacité de l'industrie civile"
 TAN_Civilian_Two_desc:0 "Notre industrie doit être modernisée pour répondre aux exigences de notre époque."
 TAN_Research:0 "Nouvelles écoles et enseignement moderne"
 TAN_Research_desc:0 "L'instruction est la base de la science et la clé pour s'adapter au monde actuel."
 TAN_Excavation:0 "Révéler la richesse minérale"
 TAN_Excavation_desc:0 "Les richesses nécessaires à la guerre peuvent être cachées profondément sous notre sol et il est de notre devoir de les révéler."
 TAN_Refinery:0 "Concentration sur le traitement synthétique"
 TAN_Refinery_desc:0 "La fabrication de pétrole et de caoutchouc à partir du charbon permet de s'affranchir de la nécessité d'importer du pétrole ou de contrôler des gisements pétroliers. Ce pétrole synthétique est cependant beaucoup plus polluant et coûteux à produire."
 TAN_Autarky:0 "Réformer les impôts"
 TAN_Autarky_desc:0 "Avec un pouvoir administratif plus organisé, l'État sera mieux équipé pour faire face aux difficultés actuelles."
 TAN_Military_Buildup:0 "Augmenter la capacité militaire"
 TAN_Military_Buildup_desc:0 "L'armée a besoin de grandes quantités de nouveaux équipements. La construction de quelques usines satisfera sûrement leurs besoins."
 TAN_Invite_American:0 "Inviter des investisseurs américains"
 TAN_Invite_American_desc:0 "Les grandes puissances de l'hémisphère occidental sont toujours intéressées à exercer leurs valeurs d'influence et de liberté dans le monde entier. Nous pouvons profiter de leurs bonnes relations avec nous et faire appel à quelques humbles investissements."
 TAN_American_Air:0 "Expansion de l'industrie aéronautique américaine"
 TAN_American_Air_desc:0 "Les avions sont l'avenir du commerce, du tourisme et de la guerre. Sous la direction des États-Unis, nous pouvons ouvrir encore plus de nouvelles usines"
 TAN_Invite_Soviets:0 "Inviter des planificateurs soviétiques"
 TAN_Invite_Soviets_desc:0 "L'architecture et l'urbanisme soviétiques uniques sont certainement applicables à de nombreuses installations dans notre propre pays. La construction d'un tout nouveau complexe industriel devrait être une première étape dans notre coopération."
 TAN_Soviet_Heavy_Industry:0 "Industrie lourde communiste"
 TAN_Soviet_Heavy_Industry_desc:0 "Nos amis communistes suggèrent une expansion coordonnée de notre industrie lourde."
 TAN_Automobile:0 "Industrie automobile"
 TAN_Automobile_tt:0 "Gagnez une petite quantité d'§Héquipement motorisé§! auprès des entreprises invitées."
 TAN_Automobile_desc:0 "Les constructeurs automobiles locaux sont actuellement encouragés à se coordonner avec leurs collègues étrangers."
 TAN_Licences:0 "Acheter des licences étrangères"
 TAN_Licences_EXPL:0 "Débloquez les décisions §Hachat d'armures étrangères§!."
 TAN_Licences_desc:0 "Comme nous sommes désormais capables de produire des équipements modernes, nous pouvons acheter les modèles les plus modernes auprès d'autres pays. Même s'il faut payer un certain prix, cela en vaudra sûrement la peine."
 TAN_State_Matter:0 "Concentrez-vous sur les questions internes"
 TAN_State_Matter_desc:0 "The political metamorphosis Tuva has undergone since the coup of 1929, now supervised by General Secretary Salchak Toka, is by design one that favors Moscow. Yet there still remains the left–right division in the Tuvan People's Revolutionary Party that resulted in it, a factor that may spell further political tumult. Tuva, freshly out of the last Khemchik rebellion, needs delicate guidance more than ever."
 TAN_Collectivist_Ethos:0 "Éthos collectiviste"
 TAN_Collectivist_Ethos_desc:0 "Un État puissant est un État à parti unique. Faire taire toute opposition démocratique ne fera que renforcer le régime des autorités."
 TAN_Organise_Youth:0 "Organiser la jeunesse"
 TAN_Organise_Youth_desc:0 "Des voix de jeunes louant le régime actuel peuvent être entendues partout dans notre pays. Leur soutien commun peut être utilisé pour renforcer la croyance du peuple en notre cause."
 TAN_Com_Generals:0 "Agrandir le commandement militaire communiste"
 TAN_Com_Generals_desc:0 "De nombreux paysans et ouvriers instruits rejoignent volontiers l'armée pour combler le manque d'officiers."
 TAN_Collectivist_Propaganda:0 "La culture ouvrière"
 TAN_Collectivist_Propaganda_desc:0 "La richesse redistribuée est utilisée avec succès pour améliorer le fonctionnement des usines et augmenter la production."
 TAN_Conquer:0 "Politique expansive"
 TAN_Conquer_desc:0 "La force et la puissance militaires de notre régime, associées à la faiblesse et à l'incompétence des gouvernements de nos voisins, ne nous laissent d'autre choix que de leur imposer la bonne règle."
 TAN_Intervene:0 "Politique interférente"
 TAN_Intervene_desc:0 "Notre cause peut être promue dans le monde entier grâce à de petites brigades qui assisteront le régime des autorités en place par l'éducation idéologique, la planification du personnel et le soutien militaire."
 TAN_Isolated:0 "État isolé"
 TAN_Isolated_desc:0 "Notre règne sera associé à la stabilité politique et à la prospérité nationale. Mais si quelqu'un ne tient pas compte de notre neutralité, il paiera cher pour cela !"
 TAN_Forced_Conscription:0 "Loi sur la conscription"
 TAN_Forced_Conscription_desc:0 "Si nous voulons survivre dans la poudrière qu'est devenue le monde, nous aurions besoin de beaucoup plus de soldats pour défendre nos valeurs."
 TAN_Fanaticism:0 "Fanatisme idéologique"
 TAN_Fanaticism_desc:0 "Il n'existe aucune mesure pour limiter nos efforts de propagande. Si des gens sont prêts à mourir pour notre cause, pourquoi devrions-nous les empêcher de le faire ?"
 TAN_Liberty_Ethos:0 "Éthos de la liberté"
 TAN_Liberty_Ethos_desc:0 "Un nouveau gouvernement fonctionnera plus efficacement s'il écoute la volonté de tous les groupes de population et ignore toute division fondée sur le sexe, la race ou l'affiliation politique."
 TAN_Strenghten_Democracy:0 "Renforcer la démocratie"
 TAN_Strenghten_Democracy_desc:0 "La confiance des peuples et leur dévouement à notre cause sont indéniables : la nouvelle législature apportera aux masses des valeurs encore plus libérales !"
 TAN_Defence_Act:0 "Loi sur la sécurité nationale"
 TAN_Defence_Act_desc:0 "La promotion d'experts loyaux en matière de police, d'armée et de renseignement améliorera la position du gouvernement et protégera l'appareil législatif de toute influence étrangère."
 TAN_Brigades:0 "Former des brigades internationales"
 TAN_Brigades_desc:0 "Si nous voulons que nos capacités militaires soient prises au sérieux à l'échelle mondiale, nous devrions accroître notre présence de volontaires dans le monde entier."
 TAN_Military_Build:0 "Les armes protègent la nation"
 TAN_Military_Build_desc:0 "La sécurité extérieure d'une nation est associée à la taille de son armée. Si nous voulons répondre aux demandes croissantes de nos soldats, une expansion militaro-industrielle est indispensable !"
 TAN_Anti_Invasion:0 "Les forts protègent la nation"
 TAN_Anti_Invasion_desc:0 "A defence of key industrial and research centres will be more effective if the most vulnerable locations can be fortified and their garrison extended."
 TAN_adopt_nichirenist_principles:0 "Adopter les principes nichirénistes"
 TAN_adopt_nichirenist_principles_desc:0 "Le moine japonais sert de figure d’ancrage pour les nationalistes japonais prêts à mener une guerre sainte contre les ennemis du bouddhisme. L’histoire récente a montré que notre clergé a été poussé au bord de la mort. Nous pourrions encore être dans une telle précarité, aussi il n’est peut-être pas déraisonnable d’importer ces méthodes pour rallier le peuple et faire de Touva la nation capable qu’elle doit être."
 TAN_mobilize_for_a_holy_war:0 "Mobilisez-vous pour une guerre sainte"
 TAN_mobilize_for_a_holy_war_desc:0 "It is time to prepare our population for the Holy War, a final struggle for the purification of the world. It will be a great challenge, but we know that there is no more noble reason to wage war than that."
 TAN_gold_mining:0 "Exploitation minière d'or"
 TAN_gold_mining_desc:0 "The gold reserves of Tuva are what brought the Russians to our country in the first place. This tradition is still present to this day."
 TAN_assimilate_altai:0 "Assimiler l’Altaï"
 TAN_increase_sedentarization:0 "Augmenter la sédentarisation"
 TAN_increase_sedentarization_desc:0 "Notre population nomade n’est pas aussi productive économiquement et nous devons la sédentariser si nous voulons stimuler notre industrialisation."
 TAN_Invite_Japanese:0 "Inviter les investisseurs japonais"
 TAN_Invite_Japanese_desc:0 "De nombreuses entreprises japonaises souhaitent étendre leur influence et leur présence dans le monde. Nous pouvons profiter de leurs bonnes relations avec nous et attirer quelques modestes investissements."
 TAN_Japanese_Heavy:0 "Expansion de l'industrie lourde japonaise"
 TAN_Japanese_Heavy_desc:0 "Une coopération industrielle stable avec nos alliés japonais nous aide à moderniser l’industrie lourde"
 TAN_tuvan_nationalism:0 "Nationalisme touva"
 TAN_tuvan_nationalism_desc:0 "Les Soviétiques ont tenté de nous mettre sous leurs bottes. Dans le passé, les Chinois ont également tenté de nous contrôler. Il est temps de nous affirmer en tant que nation opposée aux puissances étrangères."
 TAN_rehabilitate_pre_revolutionary_practices:0 "Réhabiliter les pratiques d'Uriankhai"
 TAN_restore_monastic_prerogatives:0 "Restaurer les prérogatives monastiques"
 TAN_restore_monastic_prerogatives_desc:0 "While the 'right wing' faction of the TPRP was supportive of Buddhism, the 1929 coup that put the Moscow loyalist traitors in charge set our country on the path of the most reprehensible state atheism. Now, the monasteries barely hold on, but fortunately there are still people sympathetic to our nation's faith who can return them to their rightful place."
 TAN_call_for_army_readiness:0 "Appel à la préparation de l'armée"
 TAN_call_for_army_readiness_desc:0 "We need to awaken to the certainly disturbing possibility that an hostile army could reach our country in the heart of Asia. Tuvans have been passive while occupiers have changed over the centuries, but under our leadership, we will finally be able to decide who owns this land!"
 TAN_cavalry_tradition:0 "Tradition de cavalerie"
 TAN_cavalry_tradition_desc:0 "Horseback riding has been the only way for our people to travel and control our herds. The [TAN.GetAdjective] traditional lifestyle offers the army a valuable strength."
 TAN_establish_the_ministry_of_war:0 "Établir le ministère de la Guerre"
 TAN_establish_the_ministry_of_war_desc:0 "Pour développer davantage notre armée, nous devrons créer un ministère pour la gérer."
 TAN_improve_officer_training_formation:0 "Améliorer la formation des officiers"
 TAN_improve_officer_training_formation_desc:0 "Seuls des officiers bien entraînés peuvent diriger correctement leurs hommes au combat."
 TAN_uphold_the_cavalry_primacy:0 "Maintenir la primauté de la cavalerie"
 TAN_uphold_the_cavalry_primacy_desc:0 "Nous devons perfectionner notre maîtrise du cheval si nous voulons combattre efficacement dans la steppe."
 TAN_scavenge_battlefield_equipment:0 "Récupérer l'équipement du champ de bataille"
 TAN_scavenge_battlefield_equipment_desc:0 "Capturing equipment on the battlefield, despite its unreliability as a source, would relieve a bit of pressure from our military industry."
 TAN_exploit_the_ulugh_khem_coal_basin:0 "Exploiter le bassin houiller d'Ulugh-Khem"
 TAN_exploit_the_ulugh_khem_coal_basin_desc:0 "Outre l’or, le deuxième trésor qui se trouve sous nos pieds est une immense quantité de charbon. Son extraction et son utilisation seront essentielles pour alimenter notre industrialisation."
 TAN_coal_based_industry:0 "Coal–Based Industry"
 TAN_coal_based_industry_desc:0 "Avec l’exploitation de nos réserves de charbon, nous pourrions alimenter un programme d’industrialisation massif."
 SIB_unified_tt:0 "Création de l'État sibérien"
 TAN_disorganized_military:0 "Militaire désorganisée"
 TAN_disorganized_military_2:0 "Militaire désorganisée"
 TAN_bank_of_tuva:0 "Banque commerciale et industrielle touvaine"
 kamby_lama:0 "Le Kamby Lama"
 TAN_salchak_toka:0 "Salchak Toka"
 TAN_sat_churmit_dazhy:0 "Sat Churmit-Dazhy"
 TAN_kamby_lama:0 "Kamby Lama"
 TAN_kenden_khomushku:0 "Kenden Khomushku"
 TAN_seren_kuzhuget:0 "Seren Kuzhuget"
 TAN_m_bayyskylan:0 "Mongush Bayyskylan"
 TAN_amelchenko:0 "Timofey Amelchenko"
 TAN_kuular_davaa_sambuu:0 "Kuular Davaa-Sambuu"
 TAN_kidispey_choodu:0 "Kidispey Choodu"
 TAN_mongush_suwaku:0 "Mongush Suvak"
 TAN_lakpa_oyun:0 "Oyun Lakpa"
 TAN_khertek_anchimaa_toka:0 "Khertek Anchimaa"
 TAN_sat_bazyr_ool_oglu_lopsan:0 "Sat Lopsan"
 TAN_oiun_danchai:0 "Oyun Danchay"
 TAN_polat_oyun:0 "Oyun Polat"
 TAN_saryg_donggak_chymba:0 "Saryg-Donggak Chymba"
 TAN_nikolay_comrade:0 "Nikolay Tovarishchtay"
 TAN_red_army:0 "Armée révolutionnaire populaire touvaine"
 TAN_red_army_desc:0 "Sous la commandement de l’État se trouve l’Armée révolutionnaire populaire touvaine, une force vaillante de soldats qui combattent et se sacrifient pour notre révolution. Ils sont véritablement dignes du souvenir de toutes les générations à venir."
 TAN_rehabilitate_pre_revolutionary_practices_desc:0 "Les politiques mises en œuvre par le Parti révolutionnaire populaire touvain ont décimé l’essence de la nation touvaine. Mais qu’il soit su que nous ne sommes pas une extension du sans-cœur « Soviet Union », produit d’une idéologie et non d’une culture ; nous sommes les fiers Tьвalar, fils et filles de nos puissantes montagnes et de nos rivières sereines !"
 TAN_appropriate_the_gokturks:0 "S’approprier les Göktürks"
 TAN_appropriate_the_gokturks_desc:0 "Nous devons établir une nouvelle hégémonie couvrant la Steppe et au-delà. Nous seuls portons les idéaux justes à promouvoir ; nous seuls méritons d’hériter de l’héritage des grands empires d’antan."
 TAN_true_heirs_of_the_gokturks_idea:0 "Les vrais héritiers des Göktürks"
 TAN_true_heirs_of_the_gokturks_idea_desc:0 "Nous avons puisé dans l’héritage éternel de nos lointains ancêtres — nul autre que les Turcs célestes. Le monde assiste à l’émergence d’un Türük el moderne, rendu possible par l’esprit incomparablement fort de notre nation !"
 TAN_saaya_ala:0 "Saaya Ala"
 TAN_naval_preparatory_committee:0 "Comité préparatoire naval"
 TAN_case_of_the_nine:0 "Case of the Nine"
 TAN_case_of_the_nine_desc:0 "Mongush Buyan-Badyrgy and Donduk Kuular have both been executed for their sympathy to the old, un-socialist ways, but there still exist too many in the party that stand opposed to Salchak Toka's lead. The reason for this is obvious: the meddling of [JAP.GetNameDef]! These counterrevolutionaries, snakes that hatched in the clergy and nobility, have to be removed with haste!"
 TAN_gather_the_party_opposition:0 "Gather the Party Opposition"
 TAN_gather_the_party_opposition_desc:0 "The TPRP has come under the rule of Stalinists who seek to undermine our country's society and draw it closer to the Russians, perhaps to the point of annexation. Before any purges could happen, the politicians that still care for Tuva should unite under Sat Churmit-Dazhy to initiate a coup d'état. Then, the undoing of harsh policies and the recovery of Buddhism can be arranged."
 TAN_the_fifth_constitution:0 "The Fifth Constitution"
 TAN_the_fifth_constitution_desc:0 "With Salchak Toka securing his authority over the party, a need to reorganize the state is apparent. The time is right to inaugurate a new constitution that is more aligned to our ideology than any of its predecessors."
 TAN_sovietization:0 "Sovietization"
 TAN_sovietization_desc:0 "Comrade Toka once said that 'the accession of the Arat people to the people of the great Soviet Union' was his dream. The pro-[JAP.GetAdjective] Danchayite traitors have been crushed and our ties to [SOV.GetNameDef] have never been closer. We can finally begin with this process. Social and economic overhaul, the changing of state symbols, and the adoption of Cyrillic are on the agenda!"
 TAN_restore_our_ways:0 "Restore our Ways"
 TAN_restore_our_ways_desc:0 "If we stayed complacent as Salchak Toka continued his vile rule, our nation would have lost its soul. Thankfully, he is gone, and now we can govern in a more moderate fashion that continues our revolution, but without abandoning our livelihoods.\n\nWe will make Chairman Buyan-Badyrgy proud!"
 TAN_the_basis_of_the_economy:0 "The Basis of the Economy"
 TAN_the_basis_of_the_economy_desc:0 "Churmit-Dazhy intends for our economic policies to focus on [TAN.GetNameDef]'s established strengths—cattle breeding being the most important one, in his eyes. However, he also has plans for the production of other goods, such as textiles, which can be exported. This is much more suitable for our country than what could have been forced upon us."
 TAN_rectify_the_darkhad_valley_transfer:0 "Rectify the Darkhad Valley Transfer"
 TAN_rectify_the_darkhad_valley_transfer_desc:0 "The southern border dispute that [MON.GetNameDef] keeps maintaining has been a headache. Though we finally control our valued Dus-Dag mountain, for the sake of securing our position completely it is high time to go further by doing what the pathetic leader Oyun Kombu-Dorzhu could not by bowing to the Bogd Khan: returning the lost eastern lands to our fold!"
 TAN_carry_the_altai_torch:0 "Carry the Altai Torch"
 TAN_carry_the_altai_torch_desc:0 "Our democratic reforms may give hope for the whole of South–Central Siberia. The Altai once tried to carve out a state for themselves in the Russian Civil War, the Confederated Republic of Altai. It did not last, but voicing our support for [ALT.GetAdjective] separation in this day, perhaps as part of a wider, stronger state of our own, could be the way to stand up against [SOV.GetNameDef]."
 TAN_bolster_altai_economy:0 "Bolster Altai Economy"
 TAN_bolster_altai_economy_desc:0 "Our newly acquired Oyrot region has been rural and economically unproductive for the longest time. We cannot let this region be neglected, lest the Altai people turn their back on us. Investing in the area will not only please the people, proving that we are better custodians of the land than the [SOV.GetAdjective]s, but it will have positive effects for the statewide economy."
 TAN_refuge_for_the_tofalar:0 "Refuge for the Tofalar"
 TAN_refuge_for_the_tofalar_desc:0 "The small–numbered Tofalar, a fellow Turkic ethnicity living in the region of Tofalaria north of our kozhuun of Tozhu, have, much like ourselves, been forced to concede their customs at the hands of the communists. It may be possible to relocate them to [TAN.GetNameDef], which could protect them from further destruction and assimilation."
 TAN_1941_flag_change_tt:0 "Change the flag to the 1941 Soviet–resembling one."
 TAN_1943_flag_change_tt:0 "Change the flag to the 1943 Soviet–resembling one."
 TAN_1921_flag_change_tt:0 "Change the name back to 'Tannu-Tuva People's Republic', and the flag to the original 1921 government and party flag without the Mongolian script text."
 TAN_altai_war_tt:0 "An option to make peace will be given after Altai is under [TAN.GetAdjective] control. The AI will be guaranteed to accept it."
 TAN_fifth_constitution_enshrinements:0 "Fifth Constitution Enshrinements"
 TAN_fifth_constitution_enshrinements_desc:0 "The state has been defined by a strict and paramount definition: it is an independent state of the Arats, Workers and Intelligentsia based on non–capitalist development."
 TAN_support_our_soviet_comrades:0 "Support our Soviet Comrades!"
 TAN_support_our_soviet_comrades_desc:0 "'The Tuvan people, led by the entire revolutionary party and government, not sparing their lives, are ready by any means to participate in the struggle of the Soviet Union against the fascist aggressor until their final victory over it.'"
 TAN_coexistence_of_socialism_and_buddhism:0 "Co–existence of Socialism and Buddhism"
 TAN_coexistence_of_socialism_and_buddhism_desc:0 "The wishes of the TPR's founders have been fulfilled as the revolutionary principles of communism now work in harmony with the Tibetan Buddhist faith."
 TAN_scavenge_battlefield_equipment_idea:0 "Scavenge Battlefield Equipment"
 TAN_defender_of_peoples:0 "Defender of Peoples"
 TAN_defender_of_peoples_desc:0 "Our recent actions have given us the image of a protector of the numerous Turkic ethnic groups indigenous to South–Central Siberia."
 TAN_bank_of_tuva_desc:0 "Tuvinbank, as it is known for short, was created in 1925 with Soviet assistance, and has played a considerable role in Tuva's economic development ever since."
 TAN_mining_directorate:0 "Main Directorate of the Mining Industry"
 TAN_mining_directorate_desc:0 "Since the beginning of Oyun Shagdyr-Syuryun's administration in 1935, the Main Directorate of the Mining Industry of [TAN.GetNameDef] has been met with reports of exceptional performance at the gold mines."
 TAN_voice_of_restraint_communist:0 "Voice of Restraint"
 TAN_adyg_tulush_khemchik_ool:0 "Adyg-Tyulyush Khemchik-ool"
 TAN_adyg_tulush_khemchik_ool_desc:0 "Adyg-Tyulyush Khemchik-ool Oldukai oglu described his Arat upbringing in Iyi-Tal as one marked by feudal oppression, but despite how it seemed then, he has risen far. An active communist in the 1920s, his importance rose drastically after the empowerment of the left wing of the TPRP as he was not one of the noble and clerical party members. He has held many positions; his most powerful one yet, the Chairman of the Presidum of the Little Khural, was granted to him in 1933. Khemchik-ool offers skills proven by his contribution to the 1930 constitution and work as editor-in-chief of the newspaper Shyn, although his factional alignment appears to be with what is left of the right wing."
 TAN_sat_churmit_dazhy_desc:0 "Outcry against Tuvan communism itself has managed to sway even Sat Churmit-Dazhy, at the cost of his position as head of government. The fight is on against Toka!"
 TAN_sat_churmit_dazhy_leader_desc:0 "Sat Churmit-Dazhy Sany-Shiri oglu, one of the Tuvan communists of noble background, has worked in the Tuvan People's Revolutionary Party since 1923. While he may have become the head of government after the certainly anti-religious 1929 coup d'état, Chairman Churmit-Dazhy kept convictions against harsh collectivization and state atheist polices that would align him closer to those who held power in the TPR before 1929. Outside of party factionalism, he is notable for overseeing development of the country with an agrarian vision differing from that of Moscow, which included the creation of an asbestos mining town in Khemchik that he is the namesake of.\n\nChurmit-Dazhy, recognizing the Stalinist agitation his actions likely would have caused, decided to make alliances with like-minded TPRP politicians and oust General Secretary Salchak Toka, a counter-coup justified as a preemptive move for the protection of Tuvan culture and the Tibetan Buddhist faith in the country. When geopolitics is considered, it seems even bolder of an action as it will certainly return the past rifts between Kyzyl and Moscow. All while he has to continue his statecraft and clean the mess collectivization made, the new party leader and his Buddhist Socialist government, one that one can be certain was made as a last-ditch dare, will be tested."
 TAN_liktan_surun:0 "Liktan-Surun"
 TAN_liktan_surun_desc:0 "Liktan-Surun Kombu-Dorzhu oglu is the brother of the last Ambyn-Noyan of Uryankhay Krai, Oyun Kombu-Dorzhu oglu Sodunam-Balchyr, representing the continuation of a lineage of Ambyn-Noyans that governed Tannu Uriankhai as far back as 1787."
 TAN_kamby_lama_desc:0 "The end of Buddhism's oppression has brought about the re-emergence of the Kamby Lama, the highest position in Tuva's clergy."
 TAN_mongush_suwaku_desc:0 "Mongush Suvak volunteered for the Tuva Arat Red Army in October 1930 and participated in the clampdown of the major anti-communist rebellion taking place in Khemchik at the time. Following that ordeal, he studied with success in Tambov, even being gifted a saber by Semyon Budyonny upon his graduation in 1935."
 TAN_lakpa_oyun_desc:0 "Oyun Kezhege oglu Lakpa was the first Tuvan graduate of the M. V. Frunze Military Academy."
 TAN_khertek_anchimaa_toka_desc:0 "Khertek Amyrbit kyzy Anchimaa, having been born during Uryankhay's brief independence, was soon introduced to Tuvan socialism, joining the Revolutionary Youth Union in 1918 and being one of the first to learn the Tuvan alphabet. After graduating from the Communist University of the Toilers of the East, she worked in the Barun-Khemchiksky kozhuun government, and the party took note of her success and vigor. Having her in the government could provide a dedicated representative of the women of Tuva."
 TAN_sat_bazyr_ool_oglu_lopsan_desc:0 "Sat Bazyr-ool oglu Lopsan is the Minister of Trade and Industry, who has found himself aligned with the right wing of the Tuvan People's Revolutionary Party."
 TAN_oiun_danchai_desc:0 "Danchay Chirandai oglu Oyun, who had already served as Tuva's first Minister of Finance, took charge of Tuvinbank as its manager following the 1934 reform that abolished the board. He has been a vocal and direct critic of collectivization under Salchak Toka; the clock ticks down on this timebomb of a relationship."
 TAN_kuular_sungar_ool:0 "Kuular Sungar-ool"
 TAN_kuular_sungar_ool_desc:0 "Kuular Sungar-ool Tovunak oglu is known for his intellect. Born of a shaman, he studied the Mongolian script on his own and rose to become Ambassador to Mongolia."
 TAN_polat_oyun_desc:0 "Oyun Oyun oglu Polat's good education transformed his life from that of a poor shepherd to one of great political prominence. He became both the Minister of Livestock and Agriculture and Deputy Chairman of the Presidum of the Little Khural with the help of Salchak Toka, who knew him from their time studying in Moscow, in 1933. Firmly in the left wing faction of the TPRP, Polat, as Minister of Internal Affairs, would prove an important ally to Toka in the event of a purge of the conservative opposition."
 TAN_saryg_donggak_chymba_desc:0 "Saryg-Dongak Chirik-Manygy oglu Chymba is somewhat of a newcomer to the TPRP, having fought the rebels in Khemchik in 1930 and joining the party in 1935 following his graduation from the Communist University of the Toilers of the East. He presently serves as the director of Kyzyl's hospital, but his ties with Salchak Toka - who in fact had Chymba's age adjusted by two years so he could enter the KUTV - may result in the advancement of his career."
 TAN_saaya_ala_desc:0 "Engineer platoon commander of the Tuvan People's Revolutionary Army's cavalry regiment."
 TAN_naval_preparatory_committee_desc:0 "A group of anyone remotely qualified to manage the construction of Tuva's first ever navy was hastily arranged."
 TAN_mongush_lopsan_chimit:0 "Mongush Lopsan-Chimit"
 TAN_ondar_bair:0 "Ondar Bair"
 TAN_ondar_bair_desc:0 "Ondar Khuren-ool oglu Bair's participation in Tuvan communism has largely consisted of propaganda work directed at the civilian populace, notably through the Revolutionary Youth Union. He also assisted in handling the last rebellion in Khemchik. He vehemently opposed what he called \"feudal-theocrats\", that is the TPRP's right wing, making him an ally and even personal friend of General Secretary Salchak Toka."
 TAN_fascist_leader_desc:0 "An unprecidented far-right force has taken over Tuva. Not long ago, ideas all too familiar to the observers of the rise of fascism in Europe began to spread rapidly in what once was the Tuvan People's Revolutionary Army. Young soldiers turned against the socialist order and united to oust Toka's regime, installing Tyulyush Kechil-ool as dictator of a nationalist government unlike any that had come before it.\n\nToka denounced their principles as unnaturally injected by foreign states, but the Tuvan fascist movement considers them to be a reaction to suppression of Tuvan heritage and a vehicle of national rejuvenation. Antagonism with the Comintern is a cornerstone of the new state ideology, but what will become of it when it is a small rural nation against a great power?"
 TAN_kechir_ool_desc:0 "Hailing from Khayyrakan, Ulugh-Khem, Tyulyush Baldan oglu Kechil-ool was raised as a shepherd, studied at a monastery and then enrolled in the Tambov Higher Cavalry School."
 TAN_homushku_churguj_ool_desc:0 "Churguy-ool Khomushku"
 TAN_tanchak_shoma_desc:0 "Semyon Shoma"
 TAN_i_p_rugalinskij_desc:0 "I.P. Rugalinskiy"
 tuva.1.t:0 "Events in Kyzyl"
 tuva.1.d:0 "The leader of [TAN.GetNameDef], [TAN.GetLeader], after recieving a delegation of ours instructing him to do so, has concluded the trials and executions of his political adversaries, including but not limited to the Chairman of the Council of Ministers Sat Churmit-Dazhy, Chairman of the Presidium of the Little Khural Adyg-Tyulyush Khemchik-ool, and Manager of Tuvinbank Oyun Danchay. These individuals, among others, came from noble and clerical backgrounds and formed what remained of the right wing of the Tuvan People's Revolutionary Party, which was more lenient towards the country's Buddhist faith and nomadic way of life. Their disposal has ensured the loyalty of [TAN.GetNameDef] and its party towards us, as no true opposition to Toka remains and he is dedicated to following our example."
 tuva.1.a:0 "Tuva won't be straying away again any time soon."
 tuva.2.t:0 "Salchak Toka Overthrown in Tuva"
 tuva.2.d:0 "The regime of Salchak Toka in the largely unrecognised [TAN.GetName] has fallen apart. The Tuvan People's Revolutionary Party's 'right wing' faction, which continues the original Buddhist vision of their country's early politicians, has united to overthrow the percieved threat of the Stalinist elements that were in power.\n\nWhile Toka was the state's de facto head, Sat Churmit-Dazhy, the orchestrator of the coup, was the nominal head of government. With a record of support for monasteries and moderatist economic plans, he has expressed determination to consolidate Tuva as an agrarian, Buddhist socialist state. However, this will undoubtedly strain [TAN.GetAdjective]-[SOV.GetAdjective] relations, as similar governance to this did before."
 tuva.2.a:0 "Back and forth."
 tuva.2.b:0 "A victory for the rights of the arats!"
 tuva.2.c:0 "These 'Buddhist socialists' are like cockroaches!"
 tuva.3.t:0 "[TAN.GetNameDefCap] Pushes for Oyrot Cession"
 tuva.3.d:0 "The recently established democratic government in [TAN.GetNameDef] has made calls for unity among its regions' ethnicities. Citing percieved unjust rule on our part in the Oyrot region, they have officially demanded we transfer it to their administration 'for the good of the Altai nation'..."
 tuva.3.a:0 "That place has no use for us."
 tuva.3.b:0 "Our territory will not be chipped away from. Especially not by a puny splinter state."
 tuva.4.t:0 "Oyrot Region Ceded"
 tuva.4.d:0 "Despite the many doubts, our demands for the Oyrot region's transfer have proven fruitful. Now, the Altai people can know they have a future."
 tuva.4.a:0 "Two nations, one brotherhood."
 tuva.5.t:0 "Diplomatic Failure over Oyrot"
 tuva.5.d:0 "Our diplomats have returned, having not signed any treaty. Perhaps this was an ill-considered venture..."
 tuva.5.a:0 "It probably was."
 tuva.5.b:0 "The Altai need this. At any cost."
 tuva.6.t:0 "[TAN.GetNameDefCap] Proposes Unification"
 tuva.6.d:0 "We have been approached with a proposal to unify our country with [TAN.GetNameDef]. Our neighbour promises a larger joint state based upon Tuvan-Altai cultural closeness would come with many benefits."
 tuva.6.a:0 "This can be done."
 tuva.6.b:0 "We won't be made into a junior partner."
 tuva.7.t:0 "The Unification of Tuva and Altai"
 tuva.7.d:0 "Our idea of a greater state has been realised. [ALT.GetNameDefCap]'s government has understood our calls for unity."
 tuva.7.a:0 "Two nations, one brotherhood."
 tuva.8.t:0 "Unification Offer Declined"
 tuva.8.d:0 "[ALT.GetNameDefCap] has strongly refused our proposal for unity. They are inadvertedly choosing to waste away as a weak state and be eventually preyed upon by outsiders!"
 tuva.8.a:0 "What a shame."
 tuva.8.b:0 "They don't know what's best for them, but we do!"
 tuva.9.t:0 "Ending the Altai War"
 tuva.9.d:0 "Altai is seized! Our war aims are met, and now we have the chance to end the offensive war."
 tuva.9.a:0 "Bring our men home, celebrations await them!"
 tuva.9.b:0 "We are not content; the war shall continue."
 tuva.10.t:0 "[TAN.GetAdjective] Peace Offer"
 tuva.10.d:0 "Now in control over the territory they have disputed, we have been approached with a peace treaty by diplomats of [TAN.GetNameDef]."
 tuva.10.a:0 "This distraction should end."
 tuva.10.b:0 "Beware, [TAN.GetAdjective] soldier; an unforgiving counter-offensive comes!"
 tuva.11.t:0 "[TAN.GetNameDefCap] Demands the Khövsgöl Region"
 tuva.11.d:0 "Our [TAN.GetAdjective] neighbors, justifying such a move with former control of the Darkhad Valley and the presence of the related Dukha ethnicity, have ordered us to relinquish control of the Khövsgöl area to them."
 tuva.11.a:0 "War with the Tuvans is not something we can afford. Very well."
 tuva.11.b:0 "Oh, our men will be in [329.GetCapitalVictoryPointName] within the blink of an eye."
 tuva.12.t:0 "[MON.GetNameDefCap] Concedes"
 tuva.12.d:0 "The demand for Khövsgöl has been accepted. War has been averted, and now the process of integrating it is underway. The Mongol residents' reception of the annexation has been poor while our Dukha relatives rejoice at the abolition of the border."
 tuva.12.a:0 "Glory to Tuva!"
 tuva.13.t:0 "[MON.GetNameDefCap] Refuses"
 tuva.13.d:0 "The [MON.GetAdjective] government is defiant. Opinions within the Khural are divided; should we back down while we can or invade as we threatened?"
 tuva.13.a:0 "We cannot be caught bluffing. We ride east!"
 tuva.13.b:0 "What were we thinking?"
 TAN_great_khural_party:0 "Deedi Xural"
 TAN_great_khural_party_long:0 "Deedi Xural"