 PLY_UNIFIED_polynesian_unifacation:0 "Unification polynésienne accomplie"
 PLY_UNIFIED_polynesian_unifacation_desc:0 "Après une lutte acharnée contre les puissances coloniales en Polynésie, nous sommes capables d’unir définitivement la région !"
 PLY_UNIFIED_connect_the_villages:0 "Connecter les villages"
 PLY_UNIFIED_connect_the_villages_desc:0 "La plupart de nos îles sont sous-développées et manquent d’infrastructures suffisantes. Il est dans notre intérêt de remédier à cela."
 PLY_UNIFIED_first_steps_towards_modernisation:0 "Pas vers l’industrialisation"
 PLY_UNIFIED_first_steps_towards_modernisation_desc:0 "Notre pays accuse un grand retard en matière d’industrialisation, nous rendant incapables de rivaliser avec nos voisins. Mais nous pouvons changer cela en lançant un programme d’industrialisation visant à moderniser nos industries."
 PLY_UNIFIED_connect_the_islands:0 "Développer nos îles"
 PLY_UNIFIED_connect_the_islands_desc:0 "Afin de faciliter les exportations et importations pour nos partenaires commerciaux, nous devons prendre des mesures pour construire des ports sur nos îles et garantir que le commerce puisse entrer et sortir de notre pays en toute sécurité."
 PLY_UNIFIED_develop_taiwan:0 "Développer [524.GetName]"
 PLY_UNIFIED_develop_taiwan_desc:0 ""
 PLY_UNIFIED_exploit_the_fijian_goldmines:0 "Exploiter les mines d’or des Fidji"
 PLY_UNIFIED_exploit_the_fijian_goldmines_desc:0 "Les Fidji possèdent d’importants gisements d’or que nous pourrions potentiellement utiliser à notre avantage et pour développer notre économie."
 PLY_UNIFIED_exploit_the_nauruan_phosphate_mines:0 "Exploiter les mines de phosphate de Nauru"
 PLY_UNIFIED_exploit_the_nauruan_phosphate_mines_desc:0 "Nauru possède une grande quantité de phosphate sur son île, reconnu comme étant de la plus haute qualité au monde. Il serait dommage de ne pas utiliser ce phosphate à notre profit."
 PLY_UNIFIED_seize_japanese_assets:0 "Saisir les avoirs japonais"
 PLY_UNIFIED_seize_japanese_assets_desc:0 "Suite à la saisie des îles de Micronésie, les Japonais ont laissé leurs actifs sans protection. Nous pourrions saisir ces actifs et développer notre économie."
 PLY_UNIFIED_educational_reform:0 "Réforme du système éducatif"
 PLY_UNIFIED_educational_reform_desc:0 "Une grande partie de notre population souffre d’un déficit éducatif en raison de la négligence de leurs anciens maîtres européens. Nous devons leur fournir ce qui leur a manqué et veiller à ce que les générations actuelles et futures de notre pays soient bien éduquées."