 TON_salote_tupou_iii:0 "Sālote Tupou III"
 TON_salote_tupou_iii_desc:0 "Sālote Mafile'o Pilolevu est née en 1900 de King George Tupou II et de son épouse, Lavinia Veiongo. Ayant grandi en Nouvelle-Zélande en raison des dangers dans son pays natal, elle a reçu une éducation de style occidental qui a profondément influencé sa vision du monde, un atout précieux pour les années à venir. Elle fut ensuite rappelée à Tonga par les chefs tongiens, où elle devint l’héritière présomptive jusqu’au décès de son père des suites de la tuberculose.\n\nEn 1917, juste avant sa mort, cherchant à assurer le trône à sa fille, le père de Sālote arrangea un mariage entre Sālote et l’un des chefs les plus puissants de Tonga à l’époque, Viliami Tungī Mailefihi, qui deviendrait plus tard le bras droit de la Reine. Après le décès de son père, elle monta sur le trône et devint officiellement la Reine du Royaume de Tonga, alors qu’elle n’avait que 18 ans.\n\nSa personnalité charismatique et gracieuse fit d’elle une figure aimée tant à l’intérieur qu’à l’extérieur du pays. Diplomate habile représentant Tonga sur la scène mondiale, elle modernisa et guida son pays en des temps difficiles. Malgré la pression des puissances étrangères, elle réussit à préserver l’indépendance de son pays et devint finalement le visage du Royaume de Tonga."
 TON_sioape_kaho:0 "Sioape Kaho"
 TON_the_eternal_kingdom_desc:0 "[ROOT.GetNameDefCap] existe depuis des siècles en tant qu’entité indépendante, n’étant récemment passée sous la protection des Britanniques. Cette souveraineté de longue date a inculqué un profond sentiment de fierté au peuple tongien, formant une identité culturelle forte et une loyauté envers leurs traditions et la monarchie."
