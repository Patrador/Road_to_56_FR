 SWA_sobhuza_ii:0 "Sobhuza II"
 SWA_sobhuza_ii_desc:0 "Nkhotfotjeni Mona était le fils unique du roi Ngwane V, né en 1899 dans le village de Zombodze. Il perdit son père à un très jeune âge. À la suite du décès inattendu de son père, le conseil royal nomma Nkhotfotjeni roi du Swaziland à l'âge de seulement 4 mois. En signe de distinction, Nkhotfotjeni reçut le nom de Sobhuza II.\n\nEn raison du jeune âge de Sobhuza, ses proches parents assumèrent le rôle de régents jusqu'à sa majorité, fin 1921, date à laquelle ses proches lui transférèrent le pouvoir, marquant officiellement le début du règne de Sobhuza sur le Swaziland.\n\nDès le début de son règne, lui et une délégation de ressortissants swazis ont demandé au roi George IV de restituer au royaume du Swaziland les anciennes terres swazis perdues au profit des Britanniques. Bien que les Britanniques aient conservé le contrôle de ces territoires, cette position affirmée lui a valu le soutien de son peuple. Des changements internes ont également été observés et ressentis. Sachant que la domination coloniale au Swaziland prendrait fin un jour, Sobhuza a préparé son peuple à travers l'éducation, s'assurant que la population soit prête à assumer la responsabilité de prendre soin et de gouverner la nation.\n\nAlors que les tensions mondiales continuent de s'intensifier, Sobhuza cherche à maintenir la neutralité du Swaziland et à le préserver de toute implication dans des conflits au-delà de ses frontières en adoptant une diplomatie axée sur le non-alignement."