l_french:
 cyprus_tree: "Priorités nationales chypriote"
 CYP_shortcut_industry: "Développement urbain / rural"
 CYP_shortcut_army: "L'armée"
 CYP_begin_urbanisation_efforts: "Commencer les efforts d’urbanisation"
 CYP_begin_urbanisation_efforts_desc: "Nous voyons chaque pays autour de nous nous dépasser en production industrielle ; nous devons suivre leur exemple pour ne pas être laissés pour compte."
 CYP_continue_farming_reliance: "Poursuivre la dépendance à l’agriculture"
 CYP_continue_farming_reliance_desc: "En ne changeant pas nos habitudes, nous pouvons utiliser notre expertise locale et créer une économie prospère."
 CYP_railways: "importer des chemins de fer"
 CYP_railways_desc: "Bien que nous manquions des moyens pour construire nous-mêmes un réseau ferroviaire, nous pouvons importer les matériaux nécessaires et construire la première ligne de chemin de fer de cette île."
 CYP_urban_investments: "Investissements urbains"
 CYP_urban_investments_desc: "Accélérer l’urbanisation est crucial pour la poursuite de notre politique économique. À ce titre, les investissements constituent une étape logique."
 CYP_coastal_investments: "Développer notre littoral"
 CYP_coastal_investments_desc: "En tant qu’île, [183.GetName] a besoin d’un littoral développé pour être connecté au reste du monde, tout en facilitant les déplacements autour de l’île elle-même."
 CYP_subsidise_fruit_farming: "Subventionner la culture fruitière"
 CYP_subsidise_fruit_farming_desc: "Notre climat méditerranéen est parfait pour cultiver différents types de fruits. Ils peuvent devenir un produit d’exportation important si nous subventionnons leur production."
 CYP_mining_effort: "Effort minier"
 CYP_mining_effort_desc: "Malgré notre concentration sur l’agriculture, nous devons rester compétitifs dans la production de matières premières."
 CYP_construct_power_plants: "Construire des centrales électriques"
 CYP_construct_power_plants_desc: "Pour soutenir les secteurs urbains et les usines en expansion, une extension de notre réseau électrique est nécessaire."
 CYP_link_the_cities: "Connecter les villes"
 CYP_link_the_cities_desc: "Une économie n’est que la somme de ses parties si une interconnexion appropriée existe. Cela doit être facilité par un réseau routier solide."
 CYP_national_industries: "Industries nationales"
 CYP_national_industries_desc: "Pour contrôler l’économie et éviter la mauvaise gestion, nous pouvons établir des industries nationales."
 CYP_natural_build_up: "Prioriser la croissance naturelle"
 CYP_natural_build_up_desc: "Si nous influençons trop l’économie, nous risquons un effondrement économique. Nous devons garantir une croissance plus naturelle et graduelle pour éviter un tel désastre."
 CYP_water_infrastructure: "Construire des infrastructures hydrauliques"
 CYP_water_infrastructure_desc: "Le climat de l’île rend un réseau d’eau solide presque obligatoire pour éviter que les cultures ne se dessèchent."
 CYP_rural_infrastructure: "Fournir des infrastructures rurales"
 CYP_rural_infrastructure_desc: "Les communautés rurales sont souvent très difficiles d’accès. Pour y remédier, nous devons construire des routes jusqu’aux villages les plus isolés."
 CYP_resource_prospecting: "Prospection de ressources"
 CYP_resource_prospecting_desc: "Nous n’avons pas exploré toutes les ressources disponibles sur [183.GetName]. Cela sera désormais corrigé."
 CYP_construct_argaka_dam: "Construire le barrage d’Argaka"
 CYP_construct_argaka_dam_desc: "Nous avons identifié un site approprié pour un grand barrage. La construction prendra du temps, mais elle en vaudra la peine."
 CYP_develop_heavy_industry: "Développer l’industrie lourde"
 CYP_develop_heavy_industry_desc: "Nous ne pouvons pas construire une économie uniquement sur les services et le raffinage ; développer une industrie lourde créera des emplois et un nouveau secteur."
 CYP_trade_port: "Établir un port commercial"
 CYP_trade_port_desc: "Avec notre position en mer Méditerranée, nous avons un grand potentiel commercial. Nous devrions construire un port commercial pour exploiter ce potentiel."
 CYP_utilise_stengths: "Exploiter nos forces"
 CYP_utilise_stengths_desc: "En continuant ce que nous faisons depuis des millénaires, notre nation peut atteindre une véritable prospérité."
 CYP_education_effort: "Effort éducatif"
 CYP_education_effort_desc: "L’éducation de notre population doit toujours être une priorité. Sous les occupations passées, cela a été négligé, nous devons donc lancer une campagne éducative."
 CYP_research_sector: "Établir un secteur de recherche"
 CYP_research_sector_desc: "Nous disposons des fonds pour créer un secteur de recherche dédié qui pourrait transformer notre nation en une économie et un pays avancés."
 CYP_trade_economy: "Économie commerciale"
 CYP_trade_economy_desc: "Le commerce a fait des merveilles pour notre économie ; nous devrions amplifier son effet en nous appuyant davantage sur le commerce."
 CYP_educated_nation: "Une nation instruite"
 CYP_educated_nation_desc: "Nos efforts ont porté leurs fruits et l’analphabétisme présent est désormais presque totalement éliminé. Nous nous sommes transformés avec succès en une nation moderne et instruite."
 CYP_arms_for_nation_tt: "§HCet esprit national sera supprimé une fois que nous aurons deux usines militaires.§!"
 CYP_professional_army_training_tt: "Combiner §HSpécialisation invasion navale§!, §H[ROOT.GetAdjectiveCap] Marine Corp§! et §HÉtat-major agressif§! dans l’esprit national §HArmée professionnelle§!."
 CYP_found_army: "Fonder l’armée"
 CYP_found_army_desc: "Ayant obtenu récemment notre indépendance, il est nécessaire de disposer d’une armée pour défendre cette terre nouvellement libre."
 CYP_across_sea: "De l'autre côté de la mer"
 CYP_across_sea_desc: "Entourés par la mer, nous devons la franchir pour mener nos batailles."
 CYP_island_defense: "Préparer la défense de l'île"
 CYP_island_defense_desc: "Le moment venu, nous devons préparer la défense de notre précieuse île."
 CYP_general_staff_attack: "État‑major axé sur l’attaque"
 CYP_general_staff_attack_desc: "Comme la plupart de nos combats se dérouleront outre‑mer, nous avons peu de défense à assurer, ce qui permet à nos tacticiens de se concentrer sur le développement de stratégies offensives."
 CYP_marine_corp: "Établir un corps de marines"
 CYP_marine_corp_desc: "Un débarquement naval n’est rarement l’affaire du soldat de base. Ce type d’opération doit être conduit par des forces expéditionnaires entraînées, spécialisées dans les assauts maritimes."
 CYP_war_mobilisation: "Mobiliser pour la guerre"
 CYP_war_mobilisation_desc: "La guerre venant vers [ROOT.GetNameDef], nous devons mobiliser tout homme apte au combat !"
 CYP_equipment_modernisation: "Moderniser l’équipement"
 CYP_equipment_modernisation_desc: "La majorité de notre matériel provient des restes de l’occupation britannique. Nous devrions acheter de nouvelles armes et développer nos propres armements."
 CYP_grand_defense_plan: "Élaborer un grand plan de défense"
 CYP_grand_defense_plan_desc: "En cas d’invasion étrangère, chaque détail du combat doit être prévu et une contre‑mesure déjà préparée."
 CYP_trench_warfare: "Utiliser la guerre de tranchées"
 CYP_trench_warfare_desc: "Les horreurs de la Grande Guerre n’ont guère apporté au monde, mais elles ont montré que pour une défense solide, il faut creuser des tranchées."
 CYP_professional_army_training: "Entraînement d’armée professionnelle"
 CYP_professional_army_training_desc: "Notre armée inexpérimentée doit s’entraîner régulièrement pour avoir une chance au combat ouvert."
 CYP_invasion_plans: "Établir des plans d’invasion"
 CYP_invasion_plans_desc: "Lorsque l’invasion inévitable de [183.GetName] se produira, sa population devra défendre son territoire afin que nous puissions préparer une défense adéquate."
 CYP_prepare_coastal_defenses: "Préparer les défenses côtières"
 CYP_prepare_coastal_defenses_desc: "Notre littoral doit être protégé à tout prix. Une fois tombées, il ne restera plus grand‑chose pour empêcher les forces ennemies d’avancer."
 CYP_arms_for_nation: "Armes pour la nation"
 CYP_arms_for_nation_desc: "Nous, en tant que nation, devons nous armer !"
 CYP_adopt_british_guns: "Adopter les armes britanniques"
 CYP_adopt_british_guns_desc: "Bien qu’elles symbolisent l’occupation, les nombreuses armes britanniques laissées derrière doivent être utilisées."
 CYP_create_armoured_corp: "Créer un corps blindé"
 CYP_create_armoured_corp_desc: "Une armée moderne utilise divers véhicules blindés, principalement des chars, pour manœuvrer et supplanter tout adversaire."
 CYP_deep_defense: "Défense en profondeur"
 CYP_deep_defense_desc: "Une approche en profondeur de la défense est une solution innovante pour la protection de [183.GetName]."
 CYP_war_lessons: "Leçons de la Guerre"
 CYP_war_lessons_desc: "Le meilleur enseignant est la guerre. Nous pouvons beaucoup en apprendre."
 CYP_guerilla_war: "Utiliser la guérilla"
 CYP_guerilla_war_desc: "Comment vaincre un ennemi qui est partout, n’apparaît que lorsqu’il a tendu un piège et disparaît sans laisser de trace ? On ne peut pas, ce qui fait de cette méthode un bon moyen de défendre nos terres."
 CYP_support_equipment: "Équipement de soutien [ROOT.GetAdjectiveCap]"
 CYP_support_equipment_desc: "De nos jours, la guerre ne se fait pas uniquement avec des armes, mais aussi avec des radios, des tentes et des pelles."
 CYP_motorisation_drive: "Programme de motorisation"
 CYP_motorisation_drive_desc: "Les voitures peuvent servir au transport des troupes, au transport de fournitures et parfois même comme véhicules de combat. Les camions jouent un rôle de plus en plus important dans la guerre moderne."
 CYP_develop_tank_variants: "Développer des variantes de chars"
 CYP_develop_tank_variants_desc: "Les chars sont efficaces autant que polyvalents. Avec seulement des modifications relativement mineures, ils peuvent être utilisés contre les avions, pour le soutien de l’infanterie et même comme véhicules de génie."
 CYP_island_fortress: "Une forteresse insulaire"
 CYP_island_fortress_desc: "Avec une construction défensive appropriée, [183.GetName] peut être transformée en une forteresse imprenable capable de tenir à distance même les ennemis les plus puissants."
 CYP_create_nicosia_arsenal: "Créer l’arsenal de Nicosie"
 CYP_create_nicosia_arsenal_desc: "Avec les armes stockées dans la capitale, elles sont facilement accessibles et situées au lieu le plus important du pays."
 r56_CYP_aftermath_october_events: "Conséquences des événements d’octobre"
 r56_CYP_aftermath_october_events_desc: "En octobre 1931, l’île de [183.GetName] a été secouée par une importante révolte menée par un groupe mixte de Chypriotes grecs réclamant §HEnosis§!. Le gouverneur de l’époque, Ronald Storrs, a réprimé ces activités, ce qui a provoqué une brève période de conflits entre les manifestants et la police locale. Cela a entraîné la mort de plusieurs civils, divers blessés et des sanctions pénales pour les manifestants. De plus, dix d’entre eux ont été exilés.\n\nL’administration britannique a imputé l’instigation de la révolte à Aléxis Kýrou, conseiller général à Limassol envoyé par le gouvernement grec. Il avait effectivement créé une opposition clandestine à la domination britannique, mais le gouvernement grec a nié toute implication dans ses activités. Il a donc été affecté à un autre poste comme secrétaire de la délégation grecque en Allemagne, mettant à profit son expertise en politique étrangère.\n\nLes conséquences de cette révolte se font encore sentir sur l’île, le gouverneur récemment nommé de [183.GetName], Richmond Palmer, ayant dirigé une période de régime autocratique, également connue sous le nom de « Palmerokratía » ou « Palmerocracy ». Bien qu’il ait contribué à réduire le risque de famine après deux années de sécheresse et à agrandir le port de Famagouste, son règne était strict et a efficacement mis fin à tous les appels directs pour §HEnosis§!.\n\n§HPour supprimer cette idée nationale, soit satisfaire les demandes pour Enosis, soit former une autre identité nationale.§!"
 r56_CYP_orthodox_church_idea: "Influence de l’Église orthodoxe"
 r56_CYP_orthodox_church_idea_desc: "La foi chrétienne orthodoxe fait partie de l’histoire chypriote depuis le Ier siècle après J.-C., [183.GetName] étant devenue l’un des premiers pays dirigés par un chef chrétien. La religion s’est étendue vers la fin du IVe siècle après J.-C. et au fil des millénaires elle s’est imposée comme un élément clé de l’île.\n\nAujourd’hui, elle joue un rôle important dans l’identité locale et la plupart des habitants s’y réfèrent pour leur orientation. Lors de l’occupation britannique, le clergé local a commencé à jouer un rôle actif en politique chypriote. En 1931, l’évêque de Kition a appelé à la désobéissance civile jusqu’à ce que §HEnosis§! soit atteint, déclenchant les événements d’octobre quelques jours plus tard. Actuellement, le siège de l’archevêque de [183.GetName] est vacant, puisque presque tous les évêques de l’île ont été expulsés pour avoir été instigateurs de la révolte. Comme seul évêque restant, [CYP.CYP_leontios.GetName] occupe la fonction d’archevêque par intérim jusqu’à l’élection d’un nouveau."
 r56_CYP_ideological_turmoil: "Troubles idéologiques"
 r56_CYP_ideological_turmoil_desc: "Bien qu’à peu près unis dans la recherche de §HEnosis§!, la population chypriote est loin d’être solidaire. De nombreuses idées politiques coexistent et très peu s’accordent entre elles. Cela a conduit à une lutte idéologique sur l’île.\n\nBien que le KKK interdit ait accumulé des années d’expérience clandestine et que ses idées se soient répandues sur l’île, il est loin d’être majoritaire. Comme l’Église orthodoxe exerce une influence considérable sur la population, son soutien au gouvernement démocratique est également le plus répandu. Cependant, la longue et difficile occupation britannique a radicalisé de nombreuses personnes. Cela a renforcé les groupes nationalistes prêts à placer §HEnosis§! au-dessus de tout."
 r56_CYP_ethno_religious_conflict: "Conflit ethno-religieux"
 r56_CYP_ethno_religious_conflict_desc: "[183.GetName] a longtemps été le foyer de nombreux habitants, pour la plupart des Grecs orthodoxes, mais la longue domination de l’Empire ottoman et la proximité de la péninsule anatolienne ont également donné à l’île une minorité turque notable, principalement musulmane. Comme ils sont presque dix fois moins nombreux, la population turque reste majoritairement dans ses propres communautés.\n\nLa relation presque antagoniste entre la Grèce et la Turquie et les événements de la dernière décennie ont rendu une vie harmonieuse presque impossible. L’appel fort pour §HEnosis§! par la population grecque est perçu comme un désastre par la minorité turque, tandis que les nationalistes considèrent l’île comme une patrie grecque et les autres peuples comme des intrus. Ce conflit a entraîné des affrontements réguliers entre Turcs et Grecs qui se terminent rarement pacifiquement."
 r56_CYP_urbanisation_campaign: "Campagne d’urbanisation"
 r56_CYP_urbanisation_campaign_desc: "En tant qu’île dominée par son secteur agricole, il est temps de faire évoluer l’industrie vers un état plus développé."
 r56_CYP_hydroelectricity: "Hydroélectricité"
 r56_CYP_hydroelectricity_desc: "[ROOT.GetNonIdeologyName] dispose d’un grand potentiel pour l’hydroélectricité grâce à sa géographie."
 r56_CYP_naval_industry: "Industrie navale [ROOT.GetAdjectiveCap]"
 r56_CYP_naval_industry_desc: "Comme c’est le seul moyen d’exporter de grandes quantités de marchandises, l’industrie navale de [ROOT.GetNonIdeologyName] est vitale pour le pays dans son ensemble."
 r56_CYP_national_industries: "Plusieurs entreprises importantes de [ROOT.GetName] ont été nationalisées ou fondées par l’État."
 r56_CYP_growing_economy: "Économie en croissance"
 r56_CYP_growing_economy_desc: "À mesure que [ROOt.GetName] développe son industrie, l’économie connaît une longue période de croissance."
 r56_CYP_trade_hub: "Centre commercial méditerranéen"
 r56_CYP_trade_hub_desc: "[183.GetName] est stratégiquement située sur une route commerciale majeure vers l’Asie. Ce trafic peut être exploité."
 r56_CYP_farming_focus: "Priorité à l’agriculture"
 r56_CYP_farming_focus_desc: "Avec la majorité de la population employée dans le secteur primaire, l’agriculture reste la priorité de [ROOT.GetName]."
 r56_CYP_mine_expansion: "Expansion minière"
 r56_CYP_mine_expansion_desc: "[183.GetName] est riche en ressources ; il ne reste plus qu’à les exploiter."
 r56_CYP_dyn_mod_accessible_countryside: "Campagne rurale accessible"
 r56_CYP_dyn_mod_accessible_countryside_desc: "Grâce à des efforts étendus pour relier les communautés isolées au reste de l’île, se déplacer sur [183.GetName] n’a jamais été aussi facile."
 r56_CYP_agrarian_economy: "Économie agraire"
 r56_CYP_agrarian_economy_desc: "L’accent mis sur l’agriculture et la base économique de [ROOT.GetNonIdeologyName] a conduit à un secteur agraire florissant, préparant le terrain à un boom économique."
 r56_CYP_education_initiative: "Initiative d'éducation"
 r56_CYP_education_initiative_desc: "La population nécessite une éducation appropriée pour travailler à pleine capacité, et un haut niveau d’instruction est également le signe d’un développement avancé. Ces points seront améliorés grâce à une initiative éducative."
 r56_CYP_dyn_mod_national_guard: "Garde nationale [ROOT.GetAdjectiveCap]"
 r56_CYP_dyn_mod_national_guard_desc: "La Garde nationale est une institution militaire chargée de défendre [ROOT.GetNonIdeologyName] et peut se spécialiser dans ce domaine."
 CYP_naval_invasion_specialisation: "Spécialisation invasion navale"
 CYP_naval_invasion_specialisation_desc: "Les forces armées [ROOT.GetAdjectiveCap] se sont spécialisées dans les invasions outre-mer, ce qui en fait un adversaire redoutable en Méditerranée orientale."
 CYP_war_mobilisation_i: "Mobilisation"
 CYP_war_mobilisation_i_desc: "La guerre a frappé [ROOT.GetNameDef]. Toute préparation pour la victoire doit être réalisée afin que le pays puisse perdurer."
 CYP_marine_corp_i: "Corps de marines [ROOT.GetAdjectiveCap]"
 CYP_marine_corp_i_desc: "Les forces spéciales maritimes de [ROOT.GetNameDef] sont hautement entraînées aux assauts navals et peuvent débarquer sur presque n’importe quel littoral avec facilité."
 CYP_war_industrialisation: "Industrialisation militaire"
 CYP_war_industrialisation_desc: "Une nation doit être protégée et, comme chacun le sait, les armes protègent la nation. Par conséquent, une industrie militaire est non seulement vitale pour la défense nationale, mais aussi pour une plus grande liberté en politique étrangère.\n\n§HCet esprit national sera supprimé une fois que nous aurons deux usines militaires.§!"
 CYP_equipment_modernisation_i: "Effort de modernisation de l’équipement"
 CYP_equipment_modernisation_i_desc: "Aucune guerre ne peut être menée avec du matériel obsolète !"
 CYP_general_staff_attack_i: "État-major agressif"
 CYP_general_staff_attack_i_desc: "Alors que certains disent que « Une bonne défense est une bonne attaque » n’est pas une bonne façon de défendre un pays, l’État-major [ROOT.GetAdjectiveCap] a adopté ce paradigme."
 CYP_professional_army: "Armée professionnelle"
 CYP_professional_army_desc: "Les forces armées [ROOT.GetAdjectiveCap] se sont entraînées longuement pour atteindre leur niveau actuel de discipline. Elles excellent dans divers domaines de combat, principalement les invasions amphibies."
 r56_CYP_dyn_mod_coastal_defense_preparations: "Préparations pour la défense côtière"
 r56_CYP_dyn_mod_coastal_defense_preparations_desc: "Face à une invasion potentielle, [ROOT.GetAdjectiveCap] sera renforcée pour rendre un débarquement plus favorable à la défense."
 CYP_homeland_defense: "Défense de la patrie"
 CYP_homeland_defense_desc: "Tout homme apte devrait contribuer à la défense de notre nation bien-aimée, soit par le service militaire, soit en soutenant la défense nationale."
 r56_CYP_dyn_mod_island_fortress: "Forteresse insulaire"
 r56_CYP_dyn_mod_island_fortress_desc: "L’île de [183.GetName] a été fortifiée à un point où il est quasi impossible d’y débarquer des troupes et encore moins d’y mener une bataille terrestre."
 r56_CYP_mining_corporation: "Compagnie minière [183.GetName]"
 r56_CYP_mining_corporation_desc: "Fondée par l’Américain Charles G. Gunther en 1914, cette compagnie extrait de grandes quantités de cuivre et les vend dans le monde entier."
 r56_CYP_aetk: "Archís Esoterikón Tilepikoinonión Kýprou"
 r56_CYP_aetk_desc: "L’AETK ou Autorité chypriote des télécommunications intérieures est la première entreprise de télécommunications du pays. En tant qu’entreprise semi-gouvernementale, elle est responsable de la connexion de Chypre au reste du monde."
 r56_CYP_jp_ltd: "Ioannou & Paraskevaides Ltd."
 CYP_ioannis_kliridis: "Ioánnis Klirídis"
 CYP_giannis_papangelou: "Giánnis Papangélou"
 CYP_themistoklis_dervis: "Themistoklís Dérvis"
 CYP_mehmet_ozkan: "Mehmet Necati Özkan"
 CYP_richmond_palmer: "Richmond Palmer"
 CYP_christodoulos_hadjipavlou: "Christódoulos Chatzipávlou"
 CYP_konstantinos_spyridakis: "Konstantínos Spyridákis"
 CYP_christofis_economides: "Christofís Oikonomídis"
 CYP_leontios: "Antónios Leontíou"
 CYP_dimitrios_dimitriou: "Dimítrios Dimitríou"
 CYP_nikos_christoforou: "Níkos Pattíchis Christofórou"
 CYP_andrea_pavlou: "Andréa Pávlou"
 CYP_ploutis_servas: "Ploutís Sérvas"
 CYP_adam_adamos: "Adám Adámantos Adámos"
 CYP_zinon_rossidis: "Zínon Rossídis"
 CYP_achilleas_aimilianidis: "Achilléas Aimilianídis"
 CYP_savvas_christis: "Sávvas Chrístis"
 CYP_fazil_kucuk: "Fazıl Küçük"
 CYP_ihsan_ali: "Ali Ihsan"
 CYP_ulviye_mithat: "Ulviye Mithat"