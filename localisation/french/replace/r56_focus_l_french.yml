l_french:
 wuw_HUN_stage_an_uprising_in_leitha_desc: "Le soulèvement contre les Autrichiens dans le Lajtabánság en 1921 a prouvé que les habitants de [1086.GetName] souhaitaient faire partie de notre grande nation. Nous devrions envoyer des agents pour tenter la même chose une deuxième fois, en leur offrant immédiatement une protection et en nous déplaçant pour occuper la région."
 wuw_HUN_stage_an_uprising_in_leitha_tt: "§RCela pourrait conduire à une guerre avec le propriétaire de [1086.GetName] !§!"
 SWE_revoke_anti_militia_laws: "Révoquer les lois anti-milices"
 SWE_hemvarnet: "Hemvärnet"
 SWE_hemvarnet_desc: "L'idée de la garde nationale, ou Hemvärnet, doit être développée. Si nous sommes attaqués, nous devons être en mesure de mobiliser rapidement une armée plus importante pour aider à repousser les envahisseurs."
 SWE_rationing: "Rationnement"
 SWE_rationing_desc: "L'idée de devoir rationner sa nourriture et son eau n'est peut-être pas la plus excitante qui soit, mais il est vital que chacun sache comment se rationner correctement si nous sommes attaqués et que notre accès aux échanges avec le monde extérieur est coupé."
 NORDIC_nuclear_research: "Recherche nucléaire"
 SMB_navy_default: "Renew Naval Production\"  #rewrite - was called \"Navy"
 CHL_expand_the_forestry_decision_tt: "Unlocks decisions to §YExpand the Forestry§! in §Y[1063.GetName]§! and §Y[279.GetName]§!. \n"
 CHL_found_national_steelworks_tt: "Unlocks the decision §Y$CHL_expand_araucanian_steelworks_decision$§! to gain more §YSteel§! in §Y[1063.GetName]§!"
 CHL_propose_closer_cooperation_desc: "The communist states in our surroundings may share our ideology, but they are scattered strategically and have no coordination. We should bring them under our wings, and help better guide them."
 CHL_align_with_the_russian_soviet: "Align with the [SOV.GetAdjective]s"
 CHL_enforce_the_chilean_identity_tt: "When the national spirit §Y$CHL_ancestral_mapuche_resistance$§! is removed, regain the core on [1063.GetName]."
 BRA_anaue_tt: "Unlock decisions to recruit Integralist militia divisions in states after completing rallies there. \nRecruits a new general with the §Y$militias_officer$§! trait: \n Militia Defense §G+5%§! \n Militia Speed §G+5%§! \n Militia Organization §G+5%§!"
 ARG_maintain_neutrality: "Maintenir la neutralité"
 ARG_end_operation_bolivar_desc: "Nous avons découvert un flux continu de missions d'espionnage acheminées dans le pays depuis le [GER.GetName]. Elles ont été baptisées avec humour \"Opération Bolivar\". C'est inacceptable et nous devons immédiatement mettre un terme à toutes les opérations de [GER.GetAdjective] dans [ARG.GetName]."
 ARG_conquer_paraguay: "Conquer [PAR.GetName]"
 ARG_reach_out_to_the_soviet_union: "Reach Out to the [SOV.GetAdjective]s"
 ARG_reach_out_to_the_soviet_union_tt: "Taking this focus will unlock the §YVanguardia Socialista§! division template when the §Ycivil war§! breaks out and will recruit §Yfive§! Vanguardia Socialista units in §Y[1067.GetName]§!."
 ARG_unite_the_workers_of_argentina_desc: "If we are to change [ARG.GetNameDef] for the better, we have to convince the proletariat of our nation that radical improvements are necessary to end their suffering. Let us unite the workers from all vocations and show the government that status quo needs to end!"
 ARG_a_red_south_america: "A Red South America"
 ARG_unify_south_america: "Unify South America"
 GUAY_rekindle_old_gripes_ARG_PAR_tt: "Si nous contrôlons §Y[1069.GetName]§! dans un délai de §Y365 jours§! à partir du déclenchement de la guerre, [ARG.GetName] devra accepter une paix blanche ou subir une perte de moral catastrophique."
 GUAY_national_academy_of_sciences_3: "Des universités pour tous à travers le continent"
 PAR_request_weapons: "Request [USA.GetAdjective] Weaponry"
 PAR_purge_the_military_of_dissent: "Purge the Military of Dissent"
 URG_brou: "Banco de la República Oriental del Uruguay"
 URG_pluna_desc: "Primeras Líneas Uruguayas de Navegación Aérea"
 URG_establish_the_german_uruguayan_cultural_center: "Empower the [GER.GetAdjective]-[URG.GetAdjective] Cultural Center"
 URG_break_diplomatic_relations_with_the_axis_desc: "Despite declaring neutrality, it has become clear that the Axis can no longer be tolerated. The winds of the war are strictly in favor of the Allies, and it does not behoove us to be on the losing side."
 URG_legacy_of_batlle_desc: "The shadow of José Batlle y Ordóñez's presidency continues to loom over Uruguay, and shape both its internal and exteral politics. As the architect of sweeping social and economic reforms, Batlle laid the groundwork for a modern welfare state, fostering a culture of progressivism and state intervention. Yet, his legacy is not without controversy. While many champion his vision of a democratic and egalitarian Uruguay, others view his policies as a source of economic stagnation and political instability..."
 URG_statism_desc: "A clear and strong state with centralized control over social and economic affairs is a must in these times."
 MEX_focus_royal_dutch_shell_desc: "Royal Dutch Shell is a British and Dutch firm holding 60% of Mexican oil concessions. By compromising with the foreign oil companies on the matter of labor disputes, we can come to an accommodation that is beneficial to us both."
 MEX_focus_purchase_belize_desc: "This small territory was long claimed by the Spanish crown in colonial times, though never settled by peninsulares. After the loss of Spain's colonial empire during the Napoleonic Wars, Britain gradually solidified a hold on the territory, culminating in the creation of the colony of British Honduras in 1862. The territory ought to be turned over to Mexico as a gesture of good faith."
 MEX_focus_triumph_over_the_cristeros: "Triumph Over the Cristeros"
 MEX_focus_depoliticised_army_desc: "The generals have no right to the allegiance of their soldiers. The ultimate source of legitimacy is the Mexican state. We should prevent the generals entertaining any thoughts of rebellion by rotating them between provinces so that they cannot build up patronage networks or secure the personal loyalty of their soldiers."
 MEX_focus_the_gold_shirts_desc: "General Nicolás Rodríguez Carrasco formed the Gold Shirts in 1933 to defeat communist traitors working against the government. The paramilitary group should become a wing of the government as their goal is admirable and their methods necessary."
 ENG_withdraw_from_contested_territories_desc: "Un certain nombre de territoires à travers le monde, considérés comme faisant partie des Territoires britanniques d’outre-mer, sont revendiqués par des États voisins. Cela provoque des tensions diplomatiques, et il pourrait donc être préférable de réévaluer leur statut sous juridiction du Royaume-Uni."
 ENG_bermuda_invasion_launch_point_desc:1 "Une invasion de l’Amérique du Nord ne sera pas une tâche facile. Nous devons renforcer nos possessions aux Bermudes afin de pouvoir accueillir la force d’invasion pendant toute la durée nécessaire, avant de pouvoir l’envoyer répandre la Révolution directement sur les côtes américaines."
 HOL_finish_the_noordoostpolder_desc: "Starting in 1936, the process of polderizing the area of the IJsselmeer next to the Overijssel province is finally close to completion. But when the process is completed, it will still be unused land that needs to be settled and exploited."
 HOL_pre_empt_venezuelan_aggression: "Pre-empt Venezuelan Aggression"
 HOL_overturn_military_budget_cuts_desc: "The economy has begun recovering surprisingly quickly after we abandoned the Gold Standard... The military budget cuts we were forced to implement to keep the Guilder from devaluing can now be overturned."
 HOL_volk_en_vaderland: "Popularize the \"Volk en Vaderland\""
 HOL_de_jeugdstorm: "Begin De Jeugdstorm Recruitment"
 HOL_placate_the_japanese: "Concessions to [JAP.GetNameDef]"
 HOL_placate_the_japanese_desc: "It is known that the [JAP.GetAdjective] have designs on our prosperous colonies in the East. Our armed forces would not be able to fend off this threat. Perhaps we could establish a favorable agreement."
 HOL_taking_back_french_flanders: "Taking Back [29.controller.GetAdjective] Flanders"
 HOL_taking_back_french_flanders_desc: "The historical extent of the low countries have since been partitioned by the major powers surrounding it. Of these, [29.controller.GetNameDef] still holds a sizeable amount of land that is considered a part of historical Flanders. We are now strong enough to take it back, and so we should."
 HOL_pre_empt_western_intervention: "Pre-empt Western Intervention"
 HOL_oranje_boven: "Back to Oranje Boven!"
 HOL_go_with_britain: "Go With Britain"
 HOL_de_vaarplicht: "Reintroduce De Vaarplicht"
 HOL_lead_the_minor_democracies_desc: "As the major powers of our day seem hell-bent on another war, it is left to the small democracies of Europe to keep the world from burning, like a crowd keeping two fighters from each other. We shall lead the others in forming a bloc of neutrality against the warmongers."
 china_warlord_focus: "Chinese Warlord Focus Tree"
 china_nationalist_focus: "Republic of China National Focus"
 CHI_labor_reform_desc:1 "The methods and customs of working in China have developed over millennia. It is time to move them into the modern age."
 CHI_complete_horgos_hami_road: "Complete Hargos-Hami Road"
 CHI_complete_horgos_hami_road_desc: "Industrial development of our country is halted by the its underdeveloped infrastructure. Connecting Western industrial areas with backwater regions of the East will allow goods and people to travel freely through the country."
 CHI_give_falkenhausen_citizenship_desc: "The German advisors have rendered stellar service in rebuilding and modernizing our military. We should ensure that they can stay here, no matter how the political situation might change."
 CHI_chinese_general_staff_desc: "A well-organized General Staff is the key to planning complex operations. We should learn from the German example and create a similar organization."
 CHI_experimental_mechanised_unit: "Experimental Mechanized Unit"
 CHI_combined_arms_warfare_desc: "While trucks are good enough for the initial experimentation in modern mechanized warfare, their poor cross-country performance and lack of armor makes them ill-suited for front-line work."
 CHI_elite_mountaineers_desc: "Alpine Warfare is an entirely different beast than combat in the plains. We should train specialized divisions in this art to make the best use of our terrain."
 CHI_integrate_tibet_desc: "The experiment of [TIV.GetAdjective] independence is over. A military invasion is an option, but we should try and bring them back into the fold by peaceful means."
 CHI_imperial_legacy_desc: "China has stood as the dominant force in the East for millennia, guaranteeing peace and stability in the region. It is time we reclaim our former position."
 CHI_naval_aviation_desc: "The future of naval warfare is the aircraft carrier. We will never be considered a true naval power unless we possess carriers of our own."
 CHI_modern_submarines_desc: "The Japanese are unwilling to provide us with the technical knowledge to challenge their fleet in open combat, but they consider submarine warfare an auxiliary arm. We, of course, do not necessarily need to share that opinion."
 CHI_coastal_patrol_planes_desc: "Our long coast lines can only effectively be patrolled from the air. Modern naval bombers will allow us to defend our coasts without expending to many resources."
 CHI_refugee_resettlement_desc: "The millions of desperate and homeless refugees created by the war need to be settled somewhere. Giving them shelter in our territory means we can keep them as a recruiting pool for our army and the economy."
 CHI_rural_schooling_desc: "A well-educated population is the key to modernizing a nation. We can not rely on a small handful of educated administrators, but need to carry the spirit of knowledge and science into every village."
 CHI_inter_party_coordination_council_desc: "A first step to turning our country into a functioning multi-party democracy and ending the necessary tutelage of the people will be an organization that allows other interested parties to have their say in policy making."
 CHI_judicial_yuan_desc: "Dr. Sun Yat-Sen envisioned a modern republic with a separation of powers. Our judiciary needs to be independent of outside influence and decide cases based on the law, and the law alone."
 CHI_control_yuan_desc: "Corruption is inevitable in any government. Effective government requires an effort to keep it in check. We will create a separate branch of government, equal to the legislative, executive and judiciary branches."
 CHI_examination_yuan_desc: "For thousands of years, Chinese bureaucrats were selected in stringent examinations. While the necessary texts may have changed, the principle remains the same."
 CHI_foreign_threats_desc: "A few years ago, the Japanese wrenched Manchuria away from us and created a puppet state. They will not stop until they have subjugated all of China. We must be ready to face them, even if it means making deals with local strongmen."
 CHI_unified_industrial_planning_desc: "Our aggressive program of industrialization must not be delayed."
 CHI_expand_the_academica_sinica_desc: "For millennia, China has led the world in development of the arts and sciences. Increased funding for our universities is just the first step to reclaim that position."
 PRC_strengthen_the_central_secretariat_desc: "Après la Longue Marche, nous devons réorganiser notre organisation politique pour créer un État capable de rivaliser avec les nationalistes."
 PRC_soviet_economic_aid_desc: "Sans aide extérieure, il faudra des générations pour surmonter les ravages de la Longue Marche. Nous devrions approcher les Soviétiques pour leur demander une assistance économique."
 PRC_internationalism_desc: "Les travailleurs et les paysans du monde entier doivent s'unir pour se débarrasser de leurs chaînes. Épaule contre épaule, nous construirons un avenir meilleur."
 PRC_agrarian_socialism_desc: "La Chine n'est pas comme les nations industrialisées du monde. S'attendre à une révolution communiste telle que Marx l'a imaginée, c'est mal comprendre la situation dans laquelle se trouve notre pays."
 PRC_socialism_with_chinese_characteristics: "Socialisme aux caractéristiques chinoises"
 GER_improve_the_logistics_system: "Améliorer le système logistique"
 ETH_african_central_bank_2_tt:0 "$MODIFIER_STABILITY_FACTOR$: §R-5%§! \n$modifier_production_speed_industrial_complex_factor$: §R-10%§! \n$modifier_production_speed_infrastructure_factor$: §R-10%§!"
 ITA_balkan_ambition:0 "Revendications sur la Yougoslavie"
 ITA_setting_course:0 "Setting Course"
 ITA_mafia_abroad:0 "Mafia Abroad"
 ITA_liberate_the_workers_of_africa:0 "Liberate the Workers of Africa"
 SWI_national_redoubt_desc:0 "Henri Guisan propose une manière différente de défendre [ROOT.GetName]. Plutôt que d’essayer de défendre les frontières de notre pays à n’importe quel prix, nous pouvons céder stratégiquement le Plateau suisse et nous replier dans les Alpes, où nous pourrons rendre coûteuse pour l’ennemi notre occupation."
 SWI_adopt_romansh_desc:0 "[ROOT.GetName] n’est pas un pays formé par des régions [GER.GetAdjective], [FRA.GetAdjective] et [ITA.GetAdjective] destinées à être revendiquées par nos voisins cupides. [ROOT.GetName] est une nation unique et indivisible, multiculturelle. L’adoption du romanche (Rumantsch), une langue parlée seulement dans les montagnes de nos Alpes [ROOT.GetAdjective], montrera que notre culture et nos valeurs sont distinctes des leurs, indépendamment de la langue."
 SWI_ortswehren_desc:0 "La guerre totale signifie que chaque citoyen [ROOT.GetAdjective] doit être prêt à défendre sa région, mais tout le monde n’est pas en mesure de rejoindre nos milices. Nous pouvons mettre en place des gardes locaux qui serviront de colonne vertébrale sur laquelle les milices pourront s’appuyer pour les soutenir dans leurs efforts pour défendre [ROOT.GetNameDef]."
 SWI_citizen_supply_mandate_desc:0 "Nous ne savons pas comment se déroulerait une invasion, et même si nous pouvions compter sur un réseau d’approvisionnement centralisé, cela n’est pas compatible avec notre structure de commandement. C’est pourquoi chaque foyer [ROOt.GetAdjective] doit stocker au moins deux mois de provisions à son domicile, à la fois pour eux-mêmes et pour leurs milices locales."
 SWI_take_a_stance_desc:0 "Le fasciste [?SWI_biggest_fascist.GetNonIdeologyName] incarne le système politique le plus répugnant et misérable. [?SWI_biggest_fascist.GetNameDefCap] est l’ennemi mortel du nouveau [ROOT.GetName] ; c’est pourquoi nous devons tenir bon et défendre notre démocratie par tous les moyens."
 GRE_open_foreign_subsidized_factories_tt:0 "One §YMilitary Factory§! and one §YCivilian Factory§! will be added for each of the following countries that §Yis not in a civil war§! and has an §Yopinion§! of §YGreece§! greater than §G80§!: \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§!, and §Y[SOV.GetNameDef]§!."
 GRE_bedrock_of_balkan_financial_stability_tt:0 "We will receive one off-map §YCivilian Factory§! for every starting country in the §YWestern Balkans§!, the §YEastern Balkans§!, and the §YNorthern Balkans§! that has more than §Y50§! §Yopinion§! of us. This applies also to §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, and §Y[TUR.GetNameDef]§!."