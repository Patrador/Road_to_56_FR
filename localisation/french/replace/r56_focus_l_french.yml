l_french:
 wuw_HUN_stage_an_uprising_in_leitha_desc: "Le soulèvement contre les Autrichiens dans le Lajtabánság en 1921 a prouvé que les habitants de [1086.GetName] souhaitaient faire partie de notre grande nation. Nous devrions envoyer des agents pour tenter la même chose une deuxième fois, en leur offrant immédiatement une protection et en nous déplaçant pour occuper la région."
 wuw_HUN_stage_an_uprising_in_leitha_tt: "§RCela pourrait conduire à une guerre avec le propriétaire de [1086.GetName] !§!"
 SWE_revoke_anti_militia_laws: "Révoquer les lois anti-milices"
 SWE_hemvarnet: "Hemvärnet"
 SWE_hemvarnet_desc: "L'idée de la garde nationale, ou Hemvärnet, doit être développée. Si nous sommes attaqués, nous devons être en mesure de mobiliser rapidement une armée plus importante pour aider à repousser les envahisseurs."
 SWE_rationing: "Rationnement"
 SWE_rationing_desc: "L'idée de devoir rationner sa nourriture et son eau n'est peut-être pas la plus excitante qui soit, mais il est vital que chacun sache comment se rationner correctement si nous sommes attaqués et que notre accès aux échanges avec le monde extérieur est coupé."
 NORDIC_nuclear_research: "Recherche nucléaire"
 SMB_navy_default: "Production Navale\" #réécriture – s’appelait \"Marine"
 CHL_expand_the_forestry_decision_tt: "Débloque des décisions pour §YÉtendre l’exploitation forestière§! dans §Y[1063.GetName]§! et §Y[279.GetName]§!. \n"
 CHL_found_national_steelworks_tt: "Débloque la décision §Y$CHL_expand_araucanian_steelworks_decision$§! pour obtenir plus d’§YAcier§! dans §Y[1063.GetName]§!."
 CHL_propose_closer_cooperation_desc: "Les États communistes qui nous entourent partagent peut-être notre idéologie, mais ils sont dispersés stratégiquement et manquent de coordination. Nous devrions les prendre sous notre aile afin de les aider dans leur combat."
 CHL_align_with_the_russian_soviet: "S’aligner avec les [SOV.GetAdjective]."
 CHL_enforce_the_chilean_identity_tt: "Lorsque l'esprit national §Y$CHL_ancestral_mapuche_resistance$§! est retiré, regagnez l'État national : [1063.GetName]."
 BRA_anaue_tt: "Débloque des décisions pour recruter des divisions de milice intégraliste dans les États après y avoir mené des rassemblements. \nRecrute un nouveau général avec le trait §Y$militias_officer$§! : \n Défense de la milice §G+5%§! \n Vitesse de la milice §G+5%§! \n Organisation de la milice §G+5%§!."
 ARG_maintain_neutrality: "Maintenir la neutralité"
 ARG_end_operation_bolivar_desc: "Nous avons découvert un flux continu de missions d'espionnage acheminées dans le pays depuis le [GER.GetName]. Elles ont été baptisées avec humour \"Opération Bolivar\". C'est inacceptable et nous devons immédiatement mettre un terme à toutes les opérations de [GER.GetAdjective] dans [ARG.GetName]."
 ARG_conquer_paraguay: "Conquête : [PAR.GetName]"
 ARG_reach_out_to_the_soviet_union: "Tendre la main aux [SOV.GetAdjective]."
 ARG_reach_out_to_the_soviet_union_tt: "Prendre cet axe débloquera le modèle de division §YVanguardia Socialista§! lorsque la §Yguerre civile§! éclatera et recrutera §Ycinq§! unités de Vanguardia Socialista dans §Y[1067.GetName]§!."
 ARG_unite_the_workers_of_argentina_desc: "Si nous voulons changer [ARG.GetNameDef] pour le mieux, nous devons convaincre le prolétariat de notre nation que des améliorations radicales sont nécessaires pour mettre fin à leurs souffrances. Unissons les travailleurs de toutes les professions et montrons au gouvernement que le statu quo doit cesser !"
 ARG_a_red_south_america: "Une Amérique du Sud Rouge"
 ARG_unify_south_america: "Unifier l’Amérique du Sud"
 GUAY_rekindle_old_gripes_ARG_PAR_tt: "Si nous contrôlons §Y[1069.GetName]§! dans un délai de §Y365 jours§! à partir du déclenchement de la guerre, [ARG.GetName] devra accepter une paix blanche ou subir une perte de moral catastrophique."
 GUAY_national_academy_of_sciences_3: "Des universités pour tous à travers le continent"
 PAR_request_weapons: "Demander des armes [USA.GetAdjective]."
 PAR_purge_the_military_of_dissent: "Purger l'armée des dissidents"
 URG_brou: "Banque de la République orientale de l’Uruguay"
 URG_pluna_desc: "Premières lignes aériennes uruguayennes"
 URG_establish_the_german_uruguayan_cultural_center: "Renforcer le centre culturel [GER.GetAdjective]-[URG.GetAdjective]."
 URG_break_diplomatic_relations_with_the_axis_desc: "Bien qu’ayant déclaré la neutralité, il est devenu clair que l’Axe ne peut plus être toléré. Les vents de la guerre soufflent clairement en faveur des Alliés, et il ne nous sied guère d’être du côté des perdants."
 URG_legacy_of_batlle_desc: "L'ombre de la présidence de José Batlle y Ordóñez continue de planer sur le pays FrançaisL'Uruguay et façonne sa politique intérieure et extérieure. En tant qu'architecte de réformes sociales et économiques radicales, Batlle a posé les bases d'un État-providence moderne, favorisant une culture du progressisme et de l'intervention de l'État. Pourtant, son héritage n'est pas sans controverse. Alors que beaucoup défendent sa vision d'un Uruguay démocratique et égalitaire, d'autres voient sa politique comme une source de stagnation économique et d'instabilité politique..."
 URG_statism_desc: "Un État défini et fort, exerçant un contrôle centralisé sur les affaires sociales et économiques, est indispensable aujourd'hui."
 MEX_focus_royal_dutch_shell_desc: "Royal Dutch Shell est une entreprise britannique et néerlandaise détenant 60 % des concessions pétrolières mexicaines. En trouvant un compromis avec les compagnies pétrolières étrangères sur la question des conflits sociaux, nous pouvons parvenir à un accord bénéfique pour les deux parties."
 MEX_focus_purchase_belize_desc: "Ce petit territoire fut longtemps revendiqué par la couronne espagnole à l’époque coloniale, bien qu’il n’ait jamais été peuplé de péninsulaires. Après la perte de l’empire colonial espagnol durant les guerres napoléoniennes, la Grande-Bretagne consolida progressivement son emprise sur la région, aboutissant à la création de la colonie du Honduras britannique en 1862. Ce territoire devrait être remis au Mexique en signe de bonne volonté."
 MEX_focus_triumph_over_the_cristeros: "Triomphe sur les Cristeros"
 MEX_focus_depoliticised_army_desc: "Les généraux n’ont aucun droit sur l’allégeance de leurs soldats. La source ultime de légitimité est l’État mexicain. Nous devrions empêcher les généraux de nourrir des idées de rébellion en les faisant tourner entre les provinces afin qu’ils ne puissent pas établir de réseaux de clientèle ou obtenir la loyauté personnelle de leurs soldats."
 MEX_focus_the_gold_shirts_desc: "Le général Nicolás Rodríguez Carrasco a formé les Chemises Dorées en 1933 pour vaincre les traîtres communistes agissant contre le gouvernement. Le groupe paramilitaire devrait devenir une branche du gouvernement puisque leur objectif est admirable et leurs méthodes nécessaires."
 ENG_withdraw_from_contested_territories_desc: "Un certain nombre de territoires à travers le monde, considérés comme faisant partie des Territoires britanniques d’outre-mer, sont revendiqués par des États voisins. Cela provoque des tensions diplomatiques, et il pourrait donc être préférable de réévaluer leur statut sous juridiction du Royaume-Uni."
 ENG_bermuda_invasion_launch_point_desc:1 "Une invasion de l’Amérique du Nord ne sera pas une tâche facile. Nous devons renforcer nos possessions aux Bermudes afin de pouvoir accueillir la force d’invasion pendant toute la durée nécessaire, avant de pouvoir l’envoyer répandre la Révolution directement sur les côtes américaines."
 HOL_finish_the_noordoostpolder_desc: "À partir de 1936, le processus de poldérisation de la zone de l'IJsselmeer, près de la province d’Overijssel, est enfin proche de son achèvement. Mais une fois terminé, ce sera toujours une terre inutilisée nécessitant d’être colonisée et exploitée."
 HOL_pre_empt_venezuelan_aggression: "Anticiper l’agression vénézuélienne"
 HOL_overturn_military_budget_cuts_desc: "L’économie a commencé à se redresser étonnamment vite après que nous avons abandonné l’étalon-or… Les coupes dans le budget militaire que nous avons dû appliquer pour empêcher la dévaluation du florin peuvent désormais être annulées."
 HOL_volk_en_vaderland: "Populariser le “Volk en Vaderland”"
 HOL_de_jeugdstorm: "Commencer le recrutement de De Jeugdstorm"
 HOL_placate_the_japanese: "Concessions envers [JAP.GetNameDef]"
 HOL_placate_the_japanese_desc: "Il est connu que les [JAP.GetAdjective] convoitent nos prospères colonies d’Orient. Nos forces armées ne pourraient repousser cette menace. Peut-être pourrions-nous établir un accord avantageux."
 HOL_taking_back_french_flanders: "Reprendre la Flandre [29.controller.GetAdjective]"
 HOL_taking_back_french_flanders_desc: "L’étendue historique des Pays-Bas a depuis été partitionnée par les grandes puissances environnantes. Parmi celles-ci, [29.controller.GetNameDef] détient encore une portion importante du territoire considéré comme faisant partie de la Flandre historique. Nous sommes désormais assez forts pour la reprendre, et nous le devrions."
 HOL_pre_empt_western_intervention: "Anticiper l’intervention occidentale"
 HOL_oranje_boven: "Retour à Oranje Boven !"
 HOL_go_with_britain: "Se rapprocher des Britanniques"
 HOL_de_vaarplicht: "Réintroduire De Vaarplicht"
 HOL_lead_the_minor_democracies_desc: "Alors que les grandes puissances de notre époque semblent tout faire pour déclencher un nouveau conflit, c'est aux démocraties européennes de second ordre qu'il revient d'empêcher le monde de s'embraser à nouveau, tout comme une foule sépare deux personnes qui voudraient se battre. Les Pays-Bas doivent donc pousser les autres démocrates à former un bloc neutre face aux bellicistes."
 china_warlord_focus: "Arbre de priorités des seigneurs de guerre chinois"
 china_nationalist_focus: "Priorité nationale de la République de Chine"
 CHI_labor_reform_desc:1 "En Chine, les méthodes de travail et les coutumes qui les entourent ont une histoire millénaire. Il est temps maintenant de les faire évoluer pour entrer dans l'ère moderne."
 CHI_complete_horgos_hami_road: "Terminer la route Hargos–Hami"
 CHI_complete_horgos_hami_road_desc: "Le développement industriel de notre pays est freiné par son infrastructure sous-développée. Relier les zones industrielles de l’Ouest aux régions reculées de l’Est permettra aux marchandises et aux personnes de circuler librement dans tout le pays."
 CHI_give_falkenhausen_citizenship_desc: "Les conseillers allemands ont rendu d'énormes services pour la reconstitution et la modernisation de l'armée. Nous devrions nous assurer qu'ils restent chez nous, quelle que soit la façon dont la situation politique pourra évoluer à l'avenir."
 CHI_chinese_general_staff_desc: "Un État-major bien organisé est essentiel pour planifier des opérations complexes. Nous devrions tirer parti de l'exemple allemand en mettant sur pied une organisation similaire."
 CHI_experimental_mechanised_unit: "Unité mécanisée expérimentale"
 CHI_combined_arms_warfare_desc: "Si les camions suffisent aux premières expérimentations de guerre mécanisée, leurs faiblesses en tout-terrain et leur manque de blindage les rendent en fait inaptes à monter sur le front."
 CHI_elite_mountaineers_desc: "La guerre en montagne est bien différente des combats dans les plaines. Nous devrions entraîner des divisions spécialisées dans cet art pour faire le meilleur usage du terrain."
 CHI_integrate_tibet_desc: "L'expérience de l'indépendance tibétaine est arrivée à son terme. Une invasion militaire serait une possibilité ; mais nous devrions tenter de le ramener dans notre giron de façon plus pacifique."
 CHI_imperial_legacy_desc: "La Chine a été la puissance dominante de l'Extrême-Orient pendant des millénaires, garantissant la paix et la stabilité de toute la région. Le moment est venu de reprendre cette position qui est la nôtre."
 CHI_naval_aviation_desc: "L'avenir de la guerre en mer, c'est le porte-avions. Nous ne pourrons jamais être considérés comme une véritable puissance maritime si nous n'en possédons pas nous-mêmes."
 CHI_modern_submarines_desc: "Les Japonais ne sont guère disposés à partager avec nous les connaissances techniques qui nous donneraient les moyens de nous opposer à leur flotte. Ils semblent toutefois ne considérer le sous-marin que comme une arme secondaire. Nous ne sommes pas nécessairement obligés de partager cette opinion..."
 CHI_coastal_patrol_planes_desc: "Notre littoral étiré ne peut être patrouillé avec efficacité que depuis les airs. Les bombardiers navals modernes devraient permettre une défense efficace des côtes sans avoir à trop dépenser de ressources."
 CHI_refugee_resettlement_desc: "Les millions de réfugiés désespérés et sans-abri fuyant la guerre doivent être installés quelque part. Leur offrir un abri sur nos territoires en ferait un réservoir dans lequel recruter des soldats et des travailleurs."
 CHI_rural_schooling_desc: "Il est crucial, pour assurer la modernisation d'un pays, que sa population soit bien éduquée. Nous ne pouvons nous appuyer que sur une poignée d'administrateurs éduqués, mais devons au contraire porter jusque dans chaque village l'esprit de la connaissance et des sciences."
 CHI_inter_party_coordination_council_desc: "Une première étape pour faire du pays une démocratie multipartite qui fonctionne et pourrait renoncer dorénavant à mettre le peuple sous tutelle serait d'établir une organisation permettant à tous les autres partis intéressés d'avoir leur mot à dire dans le processus de la prise de décision politique."
 CHI_judicial_yuan_desc: "Sun Yat-sen a imaginé une république moderne, où les pouvoirs seraient séparés. La branche judiciaire doit être indépendante de toute influence extérieure et trancher les cas qui lui sont soumis en fonction de la loi, et de la loi seule."
 CHI_control_yuan_desc: "Au sein de tout régime politique, la corruption est inévitable – or pour être efficace une gouvernance doit pouvoir tout contrôler. Nous devons donc créer une branche séparée au sein du gouvernement, qui soit l'égale des branches législative, exécutive et judiciaire."
 CHI_examination_yuan_desc: "Durant des milliers d'années, les membres de l'administration chinoise ont été recrutés par le biais d'examens très stricts. Si les savoirs ont nécessairement évolué, le principe doit toutefois rester le même aujourd'hui."
 CHI_foreign_threats_desc: "Il y a quelques années, les Japonais nous ont dépouillés de la Mandchourie pour y créer un État fantoche – et ils n'ont nullement l'intention de s'arrêter là tant qu'ils n'auront pas soumis le reste de la Chine. Nous devons nous tenir prêts à leur faire face, même si cela implique de conclure des accords avec quelques puissants dans les régions."
 CHI_unified_industrial_planning_desc: "Notre programme d'industrialisation volontariste ne doit en aucun cas être retardé."
 CHI_expand_the_academica_sinica_desc: "Durant des millénaires, la Chine a été en avance sur le monde entier dans le domaine des arts et des sciences. Allouer plus de fonds pour financer les universités serait une première étape pour retrouver notre position."
 PRC_strengthen_the_central_secretariat_desc: "Après la Longue Marche, nous devons réorganiser notre organisation politique pour créer un État capable de rivaliser avec les nationalistes."
 PRC_soviet_economic_aid_desc: "Sans aide extérieure, il faudra des générations pour surmonter les ravages de la Longue Marche. Nous devrions approcher les Soviétiques pour leur demander une assistance économique."
 PRC_internationalism_desc: "Les travailleurs et les paysans du monde entier doivent s'unir pour se débarrasser de leurs chaînes. Épaule contre épaule, nous construirons un avenir meilleur."
 PRC_agrarian_socialism_desc: "La Chine n'est pas comme les nations industrialisées du monde. S'attendre à une révolution communiste telle que Marx l'a imaginée, c'est mal comprendre la situation dans laquelle se trouve notre pays."
 PRC_socialism_with_chinese_characteristics: "Socialisme aux caractéristiques chinoises"
 GER_improve_the_logistics_system: "Améliorer le système logistique"
 ETH_african_central_bank_2_tt:0 "$MODIFIER_STABILITY_FACTOR$: §R-5%§!\n$modifier_production_speed_industrial_complex_factor$: §R-10%§!\n$modifier_production_speed_infrastructure_factor$: §R-10%§!"
 ITA_balkan_ambition:0 "Revendications sur la Yougoslavie"
 ITA_setting_course:0 "Décider de l'avenir"
 ITA_mafia_abroad:0 "Mafia à l'étranger"
 ITA_liberate_the_workers_of_africa:0 "Libérer les travailleurs d'Afrique"
 SWI_national_redoubt_desc:0 "Henri Guisan propose une manière différente de défendre [ROOT.GetName]. Plutôt que d’essayer de défendre les frontières de notre pays à n’importe quel prix, nous pouvons céder stratégiquement le Plateau suisse et nous replier dans les Alpes, où nous pourrons rendre coûteuse pour l’ennemi notre occupation."
 SWI_adopt_romansh_desc:0 "[ROOT.GetName] n’est pas un pays formé par des régions [GER.GetAdjective], [FRA.GetAdjective] et [ITA.GetAdjective] destinées à être revendiquées par nos voisins cupides. [ROOT.GetName] est une nation unique et indivisible, multiculturelle. L’adoption du romanche (Rumantsch), une langue parlée seulement dans les montagnes de nos Alpes [ROOT.GetAdjective], montrera que notre culture et nos valeurs sont distinctes des leurs, indépendamment de la langue."
 SWI_ortswehren_desc:0 "La guerre totale signifie que chaque citoyen [ROOT.GetAdjective] doit être prêt à défendre sa région, mais tout le monde n’est pas en mesure de rejoindre nos milices. Nous pouvons mettre en place des gardes locaux qui serviront de colonne vertébrale sur laquelle les milices pourront s’appuyer pour les soutenir dans leurs efforts pour défendre [ROOT.GetNameDef]."
 SWI_citizen_supply_mandate_desc:0 "Nous ne savons pas comment se déroulerait une invasion, et même si nous pouvions compter sur un réseau d’approvisionnement centralisé, cela n’est pas compatible avec notre structure de commandement. C’est pourquoi chaque foyer [ROOt.GetAdjective] doit stocker au moins deux mois de provisions à son domicile, à la fois pour eux-mêmes et pour leurs milices locales."
 SWI_take_a_stance_desc:0 "Le fasciste [?SWI_biggest_fascist.GetNonIdeologyName] incarne le système politique le plus répugnant et misérable. [?SWI_biggest_fascist.GetNameDefCap] est l’ennemi mortel du nouveau [ROOT.GetName] ; c’est pourquoi nous devons tenir bon et défendre notre démocratie par tous les moyens."
 GRE_open_foreign_subsidized_factories_tt:0 "Une §YUsine militaire§! et une §YUsine civile§! seront ajoutées pour chacun des pays suivants qui §Yn’est pas en guerre civile§! et possède une §Yopinion§! de §YGreece§! supérieure à §G80§! : \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§!, et §Y[SOV.GetNameDef]§!."
 GRE_bedrock_of_balkan_financial_stability_tt:0 "Nous recevrons une §YUsine civile§! hors-carte pour chaque pays de départ dans les §YBalkans occidentaux§!, les §YBalkans orientaux§! et les §YBalkans septentrionaux§! qui possède plus de §Y50§! d’§Yopinion§! envers nous. Cela s’applique aussi à §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§! et §Y[TUR.GetNameDef]§!."
 HUN_the_balkan_pact:0 "The Danubian Pact"
 HUN_the_balkan_pact_desc:0 "The democracies of the West are too far away to aid us, and so we must seek allies closer to home. As the leader of the Danubian Pact, we will offer them our protection and lead them to victory!"
 HUN_announce_the_gyor_program:0 "Announce the Györ Program"
 HUN_assault_gun_focus_desc:0 "Rather than focus on full-fledged tanks, we will instead rely on assault guns to air our infantry in affecting breakthroughs, as a more cost-effective alternative."
 HUN_submarines_desc:0 "Submarines came close to beating the most powerful navy on the planet in the last war. We can not be taken seriously as a modern navy if we do not possess submarines of our own."
 YUG_limited_self_government:0 "Devolution"
 ROM_balkans_dominance_desc:0 "The key to a prosperous Romanian future lies not with the revolutionaries of the East, or the democracies or fascists of the West, but with Romanian dominance of the Balkans."
 ROM_divide_yugoslavia_desc:0 "The current arrangement of the Balkan states making up Yugoslavia is not maintainable. We will issue an ultimatum requiring a restructuring of their component states, under Romanian leadership."
 ROM_secure_the_bosporus_desc:0 "Our naval access is, for now, limited to the Black Sea. Turkey, straddling the Bosporus Strait, could block our access to the Mediterranean in the case of war, and so we must ensure free passage for when we have need of it."
 ROM_appoint_german_friendly_government_tooltip:0 "Removes §YConstitutional Guarantees§! and §YSecuritate§!\n"
 ROM_appoint_allied_friendly_government_tooltip:0 "Removes §YIron Guard§! and §YSecuritate§!\n"
 ROM_appoint_soviet_friendly_government_tooltip:0 "Removes §YConstitutional Guarantees§! and §YIron Guard§!\n"
 ROM_handle_the_king_desc:0 "Legislation must be put in place to curtail the King's exuberant lifestyle. The national treasury may no longer be appropriated for his personal expenses."
 ROM_the_armored_division_tt:0 "Gain a unit with §Y4 Medium Armor§! and §Y4 Motorized§! battalions.\n"
 YUG_invite_turkey_desc:0 "The Turkish people were freed from their Caliph over a decade ago, they have still yet to be freed from their bourgeoise masters. Though the Republican People's Party of Turkey claims to be a \"social-democracy\", in truth, they have failed utterly to break the chains of their people and it is only with a direct Yugoslavian intervention that we may truly liberate all of the workers of the Balkans."
 YUG_dissolve_serbia_desc:0 "The region we consider \"Serbia\" is actually home to many people who do not consider themselves Serbs. Macedonians, Albanians, and Montenegrins all inhabit areas we claim to be Serbian. We must not allow ourselves to be perceived as invaders of their culture and we must rethink what we consider to be rightfully Serbian."
 YUG_surrender_macedonia_desc:0 "Bulgaria too has reason to rival us; claiming regions of southern Serbia and Macedonia for themselves. By ceding their claims to them, we will both silence the threat on our southern border and make Macedonian nationalism Bulgaria's problem."
 YUG_defence_army_of_yugoslavia_desc:0 "To fight for our union is a difficult thing to ask of the average citizen, but to fight for one's own home is every man's duty. With the promise of independence on the horizon, our union is overflowing with men willing to fight our enemy; all they need is government support."
 YUG_modern_tanks_desc:1 "By adding large-caliber main weaponry, armored technology has developed well beyond the simple intention of safely transporting forces from point A to point B. We must build our version of modern tanks to compete with our neighbors."
 YUG_mountain_brigades_desc:1 "Large parts of our nation consist of mountains, requiring the formation of special brigades specialized in combat in this type of terrain."
 YUG_artillery_regiments_desc:1 "By introducing powerful artillery regiments to our divisions, their overall fighting strength will significantly increase."
 YUG_naval_bombers_desc:1 "The Adriatic is long but narrow, making it easily accessible to airplanes based in our airfields. Developing dedicated naval bomber models could significantly improve the chances of our navy against more powerful adversaries."
 YUG_crush_ustasa_desc:0 "The government's decision to crack down on the fascist Ustasa group has agitated supporters of Croatian independence and the Ustasa are rapidly preparing for an armed uprising against the government. If we fail to dismantle this fascist organization in a timely manner, the Ustasa may well overpower the local Croatian government and raise their flag in rebellion against our state."
 YUG_local_self_management:0 "Local Self-Management"
 YUG_rogozarski:0 "Rogožarski"
 YUG_invite_greece_desc:0 "While Greece is not a slavic country in any way, it's an important partner in the region and we must not push them in the arms of the Soviets."
 PRC_unlock_border_defense_raids_tt: "Unlocks §Y$raid_type_PRC_probe_border_defenses_raid$§! Raids against §Y$STATE_615$§! and §Y$STATE_1124$§!"
 ARG_reach_out_to_chile_2_tt: "If they §Yaccept§!, then we will give §Y[1066.GetName]§! and §Y[1065.GetName]§! to them."
 MAN_bolster_nationalism_desc: "For too long, people have considered Manchukuo an artificial construct made up by the Japanese. But every nation was once just an idea. We need to establish a sense of Manchu identity in the people and turn the idea into reality."
 PRC_usurp_control_over_yanan_tt: "If [ROOT.GetName] is §Yin a faction§! with §Y[CHI.GetName]§! and another country controls §Y[1111.GetName]§!, and either of §Y[744.GetName]§! and §Y[283.GetName]§!:"