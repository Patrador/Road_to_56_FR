l_french:
 RESEARCH_REPLACE_TRANSFER:0 "\n$SAVED|H0$ jour(s) de recherche précédemment enregistrés seront transférés vers la nouvelle technologie."
 RESEARCH_TECH_UNUSED:1 "§GCliquez pour rechercher§!\nDans un délai de 56 jours, vous pouvez choisir un nouveau domaine de recherche sans perdre le temps déjà consacré à la recherche."
 tech_recon4_desc:0 "Des opérations de reconnaissance approfondie, alliant espionnage, actions de guérilla et entraînement commando, nous aideront à orienter nos choix tactiques et nous permettront d'adapter rapidement notre prise de décision."
 air_techs_folder_desc:0 "Avion."
 rangers_tech_desc:0 "En nous spécialisant dans le combat en forêt et en entraînant notre infanterie légère à s'adapter au terrain et à la végétation, nous pouvons tenir certaines zones du front avec moins de troupes, voire percer les lignes ennemies là où elles s'y attendent le moins."
 radio_detection:0 "Détection radio"
 modern_oil_processing_desc:1 "Nos raffineries de pétrole peuvent être encore améliorées grâce à de nouvelles méthodes avancées de traitement du pétrole, telles que l'hydrocraquage, l'alkylation, l'oxydation des mercaptans et l'isomérisation."
 advanced_rubber_processing_desc:1 "Une formulation de caoutchouc synthétique à usage général, intégrant des procédés améliorés tels que l'utilisation de modifiants de polymérisation à base de dodécylmercaptan, nous permettra d'accroître notre production de caoutchouc synthétique."
 miniature_fighters_desc: "Grâce à des chasseurs plus petits, nous pourrons en embarquer davantage au combat sans trop sacrifier la puissance de feu, tout en allégeant la charge du vaisseau-mère."
 basic_encryption:1 "Cryptage - Chiffrements polyalphabétiques"
 improved_decryption_desc:0 "Le développement d'ordinateurs plus performants permet de nouvelles applications des méthodes de cryptanalyse, telles que la méthode de la différence, qui, associées à de nouvelles techniques manuelles de décryptage, peuvent servir à déchiffrer des codes complexes."
 carrier_battlegroups_desc:0 "Les porte-avions sont capables de frapper l'ennemi à une distance bien plus grande que n'importe quel canon naval, et grâce à nos moyens de surveillance aérienne, nous ne serons jamais pris au dépourvu. Un groupe important de porte-avions constitue une force avec laquelle il faut compter."
 DESPERATE_DEFENSE_LABEL:0 "STRUCTURE FLEXIBLE"
 DESPERATE_DEFENSE_LABEL_TT:0 "Les subordonnés bénéficient d'un accompagnement adapté et sont formés pour agir de manière autonome."
 BATTLEFIELD_SUPPORT_DESC:1 "En améliorant la coordination entre l'appui aérien rapproché et les divisions, nous pourrons anéantir les divisions ennemies grâce à un soutien optimal."
 OPERATIONAL_INTEGRITY_DESC:0 "Les bombardiers tactiques sont polyvalents et peuvent assurer à la fois un appui au sol et des missions de bombardement classiques."
 cl_tech:1 "Modèles de croiseurs légers"
 ca_tech:1 "Modèles de croiseurs lourds"
 JET_ENGINES_RESEARCHED:0 "Permet de mener des recherches sur les technologies nécessitant des moteurs à réaction, telles que les avions à réaction"
 degaussing_desc:0 "En installant de puissantes bobines électromagnétiques, il est possible de réduire considérablement la signature magnétique d'un navire, ce qui le rend beaucoup moins vulnérable aux mines magnétiques."
 homing_torpedo_desc:0 "Équipée d'un détecteur acoustique, la torpille peut se diriger vers la source de bruit la plus importante qui se trouve devant elle - généralement la cible."