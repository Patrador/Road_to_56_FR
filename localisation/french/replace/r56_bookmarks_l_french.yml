 FE_HISTORICAL:0 "Priorités historiques de l'IA"
 FE_HISTORICAL_TOOLTIP:0 "L'IA choisira ses §Ypriorités nationales§! dans l'ordre historique, tout en faisant des choix historiques dans les §Yévénements§! et les §Ydécisions§!. Sélectionnez cette option si vous souhaitez que les autres pays suivent plus fidèlement leur trajectoire historique."
 ACHIEVEMENTS_NOT_OK:1 "§RThe Road to 56 ne prend pas en charge les succès.§!"
 AUS_GATHERING_STORM_DESC:2 "La Première République est terminée. Le 20 mai 1933, dans une loi d'habilitation étrangement similaire à celle qu'Adolf Hitler avait utilisée pour prendre le pouvoir en Allemagne quelques mois auparavant, le chancelier Engelbert Dolfuss proclame l'État fédéral d'Autriche, transformant la république autrefois libre et démocratique en une dictature fasciste.\nL'année suivante, deux guerres civiles éclateront, l'une avec les socialistes, l'autre avec les nazis, qui se termineront par l'assassinat de Dolfuss.\nAujourd'hui, le chancelier Kurt Schuschnigg se retrouve à la tête d'une nation instable, dans une tempête qui se prépare, et confronté à un choix : choisir une voie, ou faire face à une destruction certaine."
 POR_GATHERING_STORM_DESC:0 "Après deux décennies d'une république définie par une intervention ruineuse de la Grande Guerre et des révoltes armées contre de nombreuses formes de gouvernement, le très estimé général Óscar Carmona a participé à un coup d'État militaire en 1926, pour finalement prendre la tête d'une dictature nationaliste de droite.\n\nLe jeune économiste António de Oliveira Salazar, d'abord humble mais puissant ministre des finances de Carmona, s'est orienté vers l'austérité et contre la Grande Dépression, unissant la droite dans son Estado Novo corporatiste, où il occupe le poste de président du Conseil des ministres. Son régime pourra-t-il survivre à la tempête qui s'annonce dans la péninsule ibérique ?"
 r56_AFG_GATHERING_STORM_DESC:0 "Né sur les cendres de la sanglante troisième guerre anglo-afghane, l'Afghanistan a été un champ de bataille pour les empires pendant des siècles. Ce petit pays fragile souffre encore des cicatrices de la guerre civile de 1929, qui a déchiré cette nation pauvre et entraîné un déclin brutal de l'économie afghane.\n\nDepuis l'assassinat brutal de Nadir Shah en 1933, le pays est dirigé de facto par le Conseil de régence qui supervise les actions du jeune Mohammad Zaher Shah. Cependant, avec les nuages sombres qui se profilent à l'horizon, l'avenir de l'Afghanistan reste incertain..."
 BUL_GATHERING_STORM_DESC:0 "Après la chute du régime militaire de Kimon Georgiev par le tsar Boris, la Bulgarie est devenue de plus en plus absolutiste, loin de ce que garantissait sa constitution adoptée au moment de l'indépendance. Après avoir été entourée d'anciens ennemis et avoir vu sa taille considérablement réduite à la suite des défaites successives lors de la deuxième guerre balkanique et de la Grande Guerre, les idéologies revanchardes n'ont cessé de gagner en popularité. Elles pourraient bien ramener la Bulgarie sur le chemin de la guerre."
 CHI_GATHERING_STORM_DESC:0 "Autrefois la nation la plus puissante de la planète, la Chine a été affaiblie par près d'un siècle d'impérialisme occidental et de conflits internes.\n\nTchang Kaï-chek et le Kuomintang, le gouvernement central de la Chine, sont désormais menacés à la fois par l'Empire japonais, qui a déjà annexé une grande partie de la Chine, et par les communistes de Mao, qui se terrent dans les collines du Shaanxi. Entouré de toutes parts, Tchang prépare la Chine à une guerre comme le pays n'en a jamais connue."
 CHL_GATHERING_STORM_DESC:0 "L'histoire récente du Chili a été marquée par des coups d'État, des troubles civils et des hommes forts. Cependant, de nombreux cercles politiques chiliens espèrent que le pays peut retrouver la démocratie et la stabilité politique. Cette tâche n'est pas facile pour la coalition démocratique qui se fait appeler le « Front populaire ». Parmi les rivaux de la coalition figure l'actuel dirigeant et dictateur chilien, Arturo Alessandri. Ce dernier ne souhaite rien d'autre que la disparition de la coalition. Les syndicats radicaux cherchent à s'approprier le « Front populaire » et à lui donner une orientation marxiste. Dans le même temps, le mouvement fasciste de la Nacista gagne chaque jour de nouveaux sympathisants."
 EGY_GATHERING_STORM_DESC:0 "Le royaume d'Égypte est toujours dans l'impasse. Près de 15 ans se sont écoulés depuis la déclaration unilatérale d'indépendance vis-à-vis de l'Empire britannique, mais ce dernier est toujours aussi déterminé à conserver le pays comme base militaire permanente afin de sauvegarder son empire mondial. L'Italie toujours plus belliqueuse à l'ouest ne fait que renforcer cette idée.\n\nL'objectif principal de l'Égypte a toujours été d'obtenir une indépendance totale et de s'imposer comme la puissance dominante de la région. Peut-être le moment est-il venu de concrétiser une fois pour toutes ces rêves ?"
 FRI_GATHERING_STORM_DESC:0 "Perle de l'empire colonial français, l'Indochine est la colonie française la plus rentable. Destinée principalement à l'exploitation économique de ses nombreuses matières premières, la présence française est relativement faible. L'administration s'appuie principalement sur le soutien des élites indigènes, soutenues par les célèbres tirailleurs indochinois.\n\nLa présence française est constamment contestée, le dernier soulèvement en date étant la mutinerie de Yên Bái en 1930. La dévastation économique causée par la Grande Dépression pourrait bien conduire à une nouvelle vague de protestation."
 GUA_GATHERING_STORM_DESC:0 "Après sa victoire à une élection où il était le seul candidat, Jorge Ubico est devenu le maître du Guatemala, caractérisé par la militarisation d'un grand nombre d'institutions, dont la poste, et le placement de militaires à des postes élevés, tout en adoptant une politique de plus en plus pro-américaine et en renforçant la United Fruit Company, qui contrôlait une grande partie des terres, l'unique chemin de fer et la production d'électricité.\n\nCependant, son admiration pour Napoléon pourrait conduire Ubico à revoir sa politique pro-américaine et pro-statu quo pour développer une politique plus nationaliste et pan-centraméricaine."
 INS_GATHERING_STORM_DESC:0 "L'Indonésie peut sembler être une colonie stable pour l'observateur inattentif, mais la situation est beaucoup plus tendue pour ceux qui y vivent. Le régime colonial se maintient par un mélange de répression des indigènes et de liens étroits avec leur aristocratie. Mais depuis le début du siècle, des organisations nationalistes ont commencé à apparaître et à revendiquer plus d'autonomie et de droits. La plupart des radicaux réclament la fin du régime colonial et cherchent un soutien par le biais d'idéologies révolutionnaires."
 LIE_GATHERING_STORM_DESC:0 "Le Liechtenstein a soigneusement géré une politique de neutralité depuis 1868, restant à l'écart de la Grande Guerre. Cependant, la nation a été fortement affectée par ses échos, ce qui a conduit à une modeste révolution en 1918 et à l'introduction d'une nouvelle constitution avec un alignement politique sur la Suisse.\n\nCependant, les menaces pour le Liechtenstein augmentent à nouveau, à la fois à l'intérieur et à l'extérieur. Les périodes de turbulences pourraient représenter un risque grave pour le pays, qui devra s'engager sur une pente glissante pour ne pas devenir une simple note de bas de page de l'histoire."
 MEN_GATHERING_STORM_DESC:0 "Lorsque les tambours de la guerre se sont tus sur les collines de Mandchourie, les ambitions impériales du Japon ont été définitivement inscrites dans le marbre, menaçant la survie future de tout État chinois. Des années de conflit et de lutte pour l'influence sur la Mongolie intérieure n'ont fait que renforcer l'emprise du Japon, l'armée du Kwantung étant le fer de lance de l'influence japonaise.\n\nAinsi, pendant des années, l'anarchie politique et le désordre ont régné sur la nation, entraînant des décisions largement impopulaires et l'indécision politique... S'il n'y avait qu'une étincelle, la Mongolie intérieure s'enflammerait..."
 MEX_GATHERING_STORM_DESC:0 "\n\nLe Mexique vit les derniers jours du Maximato, période pendant laquelle l'ancien président Plutarco Elias Calles détenait le véritable pouvoir au Mexique en s'appuyant sur des loyalistes de droite, tant dans la politique que dans l'armée. Depuis 1934, Lázaro Cárdenas del Río a mené une guerre politique pour mettre fin au contrôle de Plutarco sur le pays et mettre en œuvre ses propres réformes de gauche. Le Mexique se trouve à la croisée des chemins alors que le monde se prépare à la guerre, que la gauche et la droite se disputent le contrôle de l'avenir du pays et sa place dans le nouvel ordre mondial qui s'annonce."
 MON_GATHERING_STORM_DESC:0 "Au carrefour des mondes, la Mongolie a trouvé sa place depuis la proclamation de son indépendance de l'empire Qing en 1911. L'aide soviétique a transformé le pays en une République populaire qui a connu d'importants changements gouvernementaux et économiques au cours des dernières années.\n\nMais avec la nouvelle menace qui se profile à l'Est, la guerre civile chinoise qui dure au Sud et la détérioration des relations avec l'URSS, le pays pourrait devenir une nouvelle frontière si l'équilibre des forces bascule du mauvais côté..."
 MPL_GATHERING_STORM_DESC:0 "Depuis la création du mandat pour la Palestine en 1923, l'instabilité est la norme.\nAvec l'immigration juive massive dans le pays à la suite de la déclaration Balfour, plusieurs gouvernements locaux des deux camps se disputent le contrôle de la région, chacun ayant ses propres organisations paramilitaires qui dépassent largement en nombre la minuscule garnison britannique stationnée dans le pays.\nAlors que les tensions sont à leur comble suite à une série d'incidents, la question reste posée : les Britanniques peuvent-ils tenir bon ? La région va-t-elle sombrer dans de nouveaux affrontements ? Ou peut-être une solution inattendue se présentera-t-elle ?"
 NIC_GATHERING_STORM_DESC:0 "Les cicatrices de la rébellion d'Augusto Caesar Sandino contre le gouvernement et les troupes d'occupation américaines sont encore visibles dans la société et la politique nicaraguayennes, encore plus depuis l'effondrement de l'économie, principalement basée sur les exportations de café, à la suite de la Grande Dépression.\n\nJuan Bautista Sacasa, devenu président en 1933, a vu et est en partie responsable de la montée en puissance du chef de la garde nationale, Anastasio Somoza García, qui avait pris en charge l'assassinat de Sandino en 1934.\n\nIl semble que la chute de Sacasa soit proche..."
 NOR_GATHERING_STORM_DESC:0 "Le début des années 1900 a été un véritable âge d'or pour la Norvège. Avec l'indépendance, la croissance économique, l'exploration polaire et l'expansion des territoires aux deux extrémités du globe, le Royaume de Norvège a marqué le monde de son empreinte. Tout n'a cependant pas été rose : la marine marchande norvégienne, neutre, a subi des pertes pendant la Grande Guerre et, plus récemment, la Grande Dépression a quelque peu freiné l'économie.\n\nAlors que les politiques sociales du gouvernement travailliste ont cherché à atténuer les problèmes, cette politique de « l'arme cassée », avec des dépenses de défense réduites, a laissé la Norvège dans une situation de risque..."
 PRC_GATHERING_STORM_DESC:0 "Le parti communiste chinois est au bord de la destruction. Après une révolution ratée, les armées communistes ont été brisées sur tous les fronts par le KMT, les communistes ont fui leurs bases du sud de la Chine pour se réfugier dans leur nouvelle base de Shaanxi. De cette catastrophe est né un nouveau leader pour le parti : Mao Zedong.\n\nMao apporte avec lui une vision radicalement nouvelle du communisme et une nouvelle stratégie de survie et d'expansion. Peut-être les communistes pourraient-ils s'allier à leurs anciens ennemis contre un plus grand..."
 PRU_GATHERING_STORM_DESC:0 "Après la mort du leader nationaliste Sanchez Cerro en 1933, la République du Pérou est entrée dans une profonde crise politique interne et externe, et le chef des forces armées, Oscar Benavides, a été mis à sa place.\nLa grande crise qui sévit dans le pays a conduit l'économie à une stagnation jamais vue auparavant et à une grave crise économique aux portes des élections démocratiques de 1936, bien qu'il soit connu dans certains cercles conspirationnistes que Benavides a le désir de rester au pouvoir."
 r56_ROM_GATHERING_STORM_DESC:0 "Au crépuscule de la Grande Guerre, alors que les empires russe, ottoman et austro-hongrois s'effondrent, la Roumanie, qui s'est battue du côté de l'Entente, est désormais l'hégémon incontesté des Balkans.\nToutefois, tout ne va pas pour le mieux dans la nation. La fragile démocratie du pays est en lutte de pouvoir avec le roi Carol depuis le début de son règne, la Garde de fer de Codreanu attendant l'occasion de frapper.\nMaintenant, avec une Allemagne résurgente qui cherche à étendre son influence dans les Balkans, et une nouvelle menace communiste à l'Est qui lorgne sur ses anciens territoires, la Roumanie doit choisir ses amis avec soin, de peur qu'un vieil ennemi ne vienne frapper à sa porte."
 SPR_GATHERING_STORM_DESC:0 "La République espagnole n'a que cinq ans, mais elle a été confrontée à l'instabilité des deux côtés de l'échiquier politique. L'échec du soulèvement asturien de 1934 a laissé de nombreuses traces dans la société espagnole, et la corruption du gouvernement d'Alejandro Lerroux n'a fait que renforcer la perte de confiance de la population, conduisant à une radicalisation de celle-ci.\n\nÀ gauche, le Front populaire, uni dans son antifascisme et sa volonté de réformer la république, tandis qu'à droite, la CEDA se rapproche de plus en plus de l'autoritarisme et du corporatisme et la Phalange se fait de plus en plus menaçante."
 URG_GATHERING_STORM_DESC:0 "Alors que l'Uruguay était l'un des pays les plus stables d'Amérique du Sud, le coup d'État de Gabriel Terra a été un choc pour la petite nation. Les persécutions engendrées par le régime ont poussé de nombreux hommes politiques et intellectuels à fuir, notamment vers l'Argentine.\n\nCependant, la dictature est loin d'être enracinée, avec une première tentative de coup d'État révolutionnaire en 1935, qui pourrait bien ne pas être la dernière."
 VEN_GATHERING_STORM_DESC:0 "La mort du dictateur Juan Vicente Gómez à la fin de l'année 1935 a déclenché une lutte de pouvoir sans précédent pour désigner son successeur, même si les élections à venir ne permettent pas encore d'y voir clair.\n\nDans un pays où la corruption est très répandue et qui dépend largement des exportations de pétrole, les États-Unis du Venezuela pourraient avoir du mal à trouver leur place alors que les tensions montent dans le monde entier."
 MEX_BLITZKRIEG_DESC:0 "\n\nLe Maximato est terminé et Calles est parti, mais la bataille entre l'aile gauche et l'aile droite fait toujours rage. Enhardie par les difficultés économiques causées par les embargos de PEMEX, l'aile droite s'est polarisée et se trouve aujourd'hui dans un état de guerre civile politique pour savoir qui sera le candidat de l'aile droite à la présidence l'année prochaine. Le PRI, qui domine le pays, doit maintenant choisir entre compromettre ses idéaux avec le candidat modéré Camacho ou s'appuyer sur le candidat de gauche Mugica."
 NOR_BLITZKRIEG_DESC:0 "Le début des années 1900 a été un véritable âge d'or pour la Norvège. Avec l'indépendance, la croissance économique, l'exploration polaire et l'expansion des territoires aux deux extrémités du globe, le Royaume de Norvège a marqué le monde de son empreinte. Tout n'a cependant pas été rose : la marine marchande norvégienne, neutre, a subi des pertes pendant la Grande Guerre et, plus récemment, la Grande Dépression a quelque peu freiné l'économie.\n\nAlors que les politiques sociales du gouvernement travailliste ont cherché à atténuer les problèmes, cette politique de « l'arme cassée », avec des dépenses de défense réduites, a laissé la Norvège dans une situation de risque..."