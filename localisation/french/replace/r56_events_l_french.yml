 mtg_news.3.t:0 "US Congress Passes Neutrality Act"
 mtg_news.4.t:0 "[USA.GetNameDefCap] Pursues Interventionist Policies"
 mtg_news.5.t:0 "[USA.GetNameDefCap] Passes the War Powers Act"
 mtg_news.6.desc:0 "\nAfter months of bloodshed and untold thousands of casualties, the Second American Civil War has come to an end. The attempt by the southern states to secede has failed. Many observers point to the parallels to the first American Civil War. Once again, the industrial might of the northern states has proven superior over southern determination. \n\nThe government of [USA.GetLeader] now faces the difficult task of reintegrating the breakaway states back into [USA.GetNameDef]. With two uprisings only some 80 years apart, many in the government are pushing for much harsher punishments on the rebels than after the first war."
 mtg_britain.82.t:0 "The [GetYear] Imperial Conference"
 panay_incident.2.e.tt:0 "With war support building, pulling out of [CHI.GetName] now would damage our efforts to justify military action in the future, although reassuring the public of our desire for peace should help domestic stability.\n\n"
 panay_incident.3.t:0 "The [USA.GetName] demand apology and compensation"
 mtg_netherlands.6.b:0 "Well, the Venezuelans will not get it anyhow!"
 mtg_netherlands.11.b:0 "Giving them access to the local resources might keep our empire safe."
 mtg_netherlands.14.a:0 "Gerbandy is the best chose to lead."
 mtg_netherlands.19.d:0 "[HOL.GetAdjective] representatives have contacted us with a proposal for a close-knit cooperation between the nations making up the Low Countries. They now wish to have our official support for this project."
 mtg_netherlands.20.d:0 "[HOL.GetAdjective] representatives have contacted us with a proposal for a close-knit cooperation between the democratic minor powers of Europe. They now wish to have our official support for this project."
 mtg_netherlands.60.d:0 "[HOL.getAdjective] authorities have escalated the diplomatic row, demanding in quite hostile terms that we issue a full apology."
 MTG_naval_treaty.6.a:0 "If they will not talk, we will let our weapons speak."
 MTG_naval_treaty.6.b:0 "They called the bluff."
 SEA_PRC_faction_events.1.t: "[FROM.GetNameDefCap] Demands [1111.GetName]"
 SEA_PRC_border_war_events.5.t: "[PRC.GetNameDefCap] Conquers [1111.GetName]"
 SEA_PRC_border_war_events.5.desc: "Following the border skirmishes along the border of [1111.GetName], [PRC.GetNameDef] managed to penetrate the defensive lines and push their enemy out. [PRC.GetNameDefCap] now claim the state their own."
 SEA_PRC_border_war_events.6.t: "[PRC.GetNameDefCap] withdraws from [1111.GetName]"
 SEA_PRC_border_war_events.6.desc: "Following the border skirmishes along the border of [1111.GetName], [PRC.GetNameDef] failed to penetrate the defensive lines and push their enemy out. [PRC.GetNameDefCap] did manage to capture some artillery, however."
 SEA_warlords.54.t: "[FROM.GetLeader] Withdraws Troops out of [1111.GetName]"
 SEA_warlords.100.desc: "An urgent report has come from [XIC.GetNameDef] stating that [XIC.GetLeader] has withdrawn his troops from [1111.GetName], letting [PRC.GetNameDef] forces pour into the region and claiming it as their own. The entire purpose of [XIC.GetName] was to keep [PRC.GetName] in check and to eradicate them - not help them."
 tsr_manchukuo_border_war.1.t: "[MAN.GetNameDefCap] Conquers [1118.GetName]"
 tsr_manchukuo_border_war.1.desc: "Following a swift campaign in [1118.GetName], the [MAN.GetAdjective] army has seized Kalgan and declared the area under their control."
 tsr_manchukuo_border_war.2.t: "[MAN.GetNameDefCap] withdraws from [1118.GetName]"
