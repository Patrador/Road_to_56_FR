 mtg_news.47.t:0 "[From.GetNonIdeologyName] Continues Zuiderzee Works"
 MUN_czech.1056.t: "[FROM.GetName] Demands [1086.GetName]"
 MUN_czech.1056.d: "Just like once proposed in the Paris Peace Conference after the Great War, [CZE.GetNameDef] has announced it deems a corridor to its ally, [YUG.GetNameDef], necessary for their alliance's safety. In order to achieve that goal, [FROM.GetAdjective] representatives have delivered an ultimatum that demands we cede [1086.GetName]."