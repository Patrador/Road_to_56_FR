l_french:
 wtt_germany.641.t:0 "[GER.GetNameDefCap] réintégr[GER.GetEEntNP] Eupen-Malmedy"
 wtt_germany.63.desc:0 "Le gouvernement [GER.GetAdjMS] a publié une législation stipulant la réintégration de l'Alsace-Lorraine, du Luxembourg et d'Eupen-Malmedy [GER.GetAuEnANP] [GER.GetName]. Le recrutement massif de notre population a déjà commencé."
 CHL_political_events.4.t: "Occupation [CHL.GetAdjFS]\nde [1065.GetName]"
 CHL_political_events.4.desc: "\nLes troupes de l'État [CHL.GetAdjMS] ont commencé à franchir les frontières établies de [1065.GetName]. Leurs forces aériennes et navales sont également mobilisées. De toute évidence, ils ont l'intention de prendre le contrôle de l'île, et il n'est pas certain que nous puissions y mettre un terme par la médiation. Comment allons-nous répondre ?"
 CHL_political_events.5.t: "Retrait [ARG.GetAdjMS]\nde [1065.GetName]"
 CHL_political_events.5.desc: "\nLes [ARG.GetHabitants] ont compris qu'ils n'avaient aucune chance de conserver [1065.GetName] face à notre puissance militaire, puisqu'ils ont été aperçus en train de retirer leurs troupes de la province. La zone contestée est donc pour la première fois entre nos mains. Ne tardons pas à lancer les campagnes d'intégration."
 CHL_political_events.6.t: "Les [ARG.GetHabitants]\nne bougent pas de [1065.GetName]"
 CHL_political_events.52.t: "Les [CHL.GetHabitants]\nexigent [1061.GetName]"
 CHL_political_events.52.desc: "\nSuite à la récente mobilisation générale à notre frontière et les manifestations du peuple [CHL.GetAdjMS] tout au long de la semaine, [CHL.GetLeader] a annoncé qu'il était grand temps que son pays reprenne le contrôle du territoire de [1061.GetName], cédé par le traité de Lima qu'il déclare aujourd'hui nul et non avenu."
 CHL_political_events.53.desc: "\nLe gouvernement [FROM.GetAdjMS] est faible, nous le savons tous. Il était évident qu'ils ne pourraient pas nous affronter, eux-mêmes l'ont compris. C'est pourquoi ils ont signé aujourd'hui un nouvel accord, nous cédant officiellement le territoire de [1061.GetName] !"
 CHL_political_events.54.desc: "\nLe gouvernement [FROM.GetAdjMS] s'accroche obstinément au traité illégitime de Lima et refuse de nous rendre le territoire de [1061.GetName]. Nous allons devoir recourir à la force et leur arracher des mains s'il le faut..."
 CHL_political_events.55.t: "Les [CHL.GetHabitants]\nexigent [1065.GetName]"
 CHL_political_events.55.desc: "\nSuite à la récente mobilisation générale à notre frontière et les manifestations du peuple [CHL.GetAdjMS] tout au long de la semaine, [CHL.GetLeader] a annoncé qu'il était grand temps que son pays occupe le territoire de [1065.GetName]. Allons-nous l'arrêter ?"
 WW_hungary.8.t: "[HUN.GetLeLaLNPCap] [HUN.GetName]\néchang[HUN.GetEEntNP] sa protection contre le [1086.GetName]"
 WW_hungary.8.desc: "\n[HUN.GetLeader], le dirigeant [HUN.GetAdjMS], vient de nous faire une offre singulière : si nous acceptons de rendre à son pays le [1086.GetName], le Lajtabánság comme ils le nomment, ils sont prêts à garantir notre indépendance et à nous défendre face aux [GER.GetHabitants] s'ils venaient à nous envahir. Qu'allons-nous lui répondre ?"
 WW_hungary.8.a: "Toute aide est la bienvenue."
 WW_hungary.8.b: "Leur garantie ne vaut rien !"
 WW_hungary.9.t: "[FROM.GetLeLaLNPCap] [FROM.GetName]\nnous rend[FROM.GetXEntNP] le [1086.GetName] contre notre garantie"
 WW_hungary.9.desc: "\nLe gouvernement [FROM.GetAdjMS] vient de prendre une sage décision en acceptant notre offre. Ils sont en train d'entamer le transfert de contrôle du [1086.GetName]. Quant à nous, nous préparons nos garanties pour leur indépendance. En plus de gagner du terrain, nous ravivons notre amitié avec les [FROM.GetHabitants]."
 WW_hungary.83.t: "[FROM.GetLeLaLNPCap] [FROM.GetName]\nachèt[FROM.GetEEntNP] le [1086.GetName]"
 WW_hungary.83.desc: "\nLe gouvernement [HUN.GetAdjMS] a toujours considéré le [1086.GetName] comme une région intégrante de son territoire, puisqu'elle a appartenu au pays à l'époque de l'empire. Il espèce pouvoir le gagner de nouveau en nous l'achetant : leur offre est d'ailleurs plutôt satisfaisante."
 WW_hungary.83.b: "[1086.GetName] est [ROOT.GetAdjMS] !"
 WW_hungary.84.t: "[FROM.GetLeLaLNPCap] [FROM.GetName]\naccept[FROM.GetEEntNP] de nous vendre le [1086.GetName]"
 WW_hungary.84.desc: "\n[FROM.GetLeader] et les [FROM.GetHabitants] ont accepté de nous vendre le [1086.GetName]. La transaction a déjà été effectuée. C'est un jour de gloire pour le peuple [ROOT.GetAdjMS] !"
 WW_hungary.85.desc: "\nIl fallait s'y attendre, [FROM.GetLeader] et ses imbéciles de [FROM.GetHabitants] ont refusé notre offre. Leur dernier diplomate nous a également confié que le [1086.GetName] ne sera jamais cédé."
 WW_hungary.86.t: "[FROM.GetLeLaLNPCap] [FROM.GetName]\nfoment[FROM.GetEEntNP] un soulèvement au [1086.GetName]"
 WW_hungary.86.desc: "\nDes membres de diverses organisations paramilitaires [FROM.GetAdjFP] occupent actuellement des bâtiments majeurs dans la région du [1086.GetName]. Ils y ont tenu un référendum truqué à la hâte pour masquer une annexion. Nos troupes sont en alerte, prêtes à intervenir. Nous devons analyser la situation et déterminer si une intervention serait la meilleure approche."
 germany.4.d:0 "Les soulèvements répétés en [AUS.getNameDef] montrent clairement que le peuple là-bas aspire à être uni à notre nation. Il est maintenant temps d’agir et de permettre à la volonté du peuple de se manifester. \n\nCar ce qui fut interdit par le Traité de Saint-Germain comme par le Traité de Versailles doit maintenant être révélé au monde comme la volonté finale et incontestable de nos deux nations : l’union [GER.getAdjective]-[AUS.getAdjective] sera accomplie, et constituera la première étape visant à unir l’ensemble des peuples germaniques sous un seul État-nation !"
 germany.4.a:0 "Comment quelqu’un peut-il dire que l’Autriche n’est pas [GER.getAdjective] ?"
 germany.5.d:1 "La rhétorique continue de [GER.getNameDef] et de sa direction, visant à établir un front uni contre la propagation de la menace rouge, a atteint les cabinets des installations gouvernementales les plus isolées de notre nation. \n\nNos responsables ont déjà reçu de nombreuses propositions joyeuses et quelques demandes inquiètes concernant un tel alignement avec [GER.getNameDef]. \n\nLe télégramme secret a été livré ce matin, dans lequel [GER.getLeader] propose que nous signions un pacte pour répondre à l’objectif du Komintern de répandre le communisme dans le monde par la subversion et la violence. En signant ce pacte, nous acceptons de partager des renseignements sur la menace communiste et d’agir en étroite coopération contre cette menace. \n\nD’un autre côté, la proposition ne comporte que le partage des renseignements et mentionne très brièvement la possibilité d’une alliance militaire conjointe ou de toute forme de coopération de défense mutuelle. En résistant à la participation officielle au pacte, nous détériorerons nos relations avec [GER.getNameDef], mais cela pourrait nous éviter l’isolement et les représailles de [SOV.getNameDef]."
 germany.6.d:0 "Les signataires considèrent comme condition préalable à une paix durable que toutes les nations du monde reçoivent chacune leur place légitime, et ont décidé de se soutenir et de coopérer dans leurs efforts en Asie orientale et dans les régions d’Europe où leur objectif principal est d’établir et de maintenir un nouvel ordre destiné à promouvoir la prospérité mutuelle et le bien-être des peuples concernés."
 germany.11.d:0 "Le ministère des Affaires étrangères [GER.getAdjective] a proposé un pacte de non-agression entre nos deux nations. Ce traité augmentera considérablement notre commerce mutuel tout en fournissant aux installations de recherche [SOV.getAdjective] les spécialistes manquants et les avancées technologiques de [GER.getNameDef]. \nUn protocole secret supplémentaire suggère la division de l’Europe de l’Est en sphères d’influence [GER.getAdjective] et [SOV.getAdjective]. \n\nBien que les [GER.GetRulingIdeology]s à Berlin ne soient pas dignes de confiance pour des raisons évidentes, ce pacte nous permettra de traiter avec [FIN.getNameDef], les États baltes et [ROM.getNameDef] sans craindre une intervention extérieure. Les territoires orientaux de [POL.getNameDef] nous reviendront également en cas d’effondrement [POL.getAdjective]."
 germany.11.a.tt:0 "§RPendant la durée du pacte, la politique commerciale d’économie fermée sera indisponible.\nL’objectif Guerre contre l’Allemagne sera indisponible pendant deux ans.§!\n"
 germany.11.b:0 "Aucun accord avec les [GER.GetRulingIdeology]s !"
 germany.12.d:0 "La réponse officielle des représentants de [SOV.getNameDef] a été reçue relativement tard, étant donné la longueur et l’importance de l’accord que nous avions proposé, l’ambassadeur officiel [SOV.getAdjective] à Berlin ayant remis la copie signée du document au diplomate [GER.getAdjective] concerné.\n\nLa note indiquait que [SOV.getNameDef], sous la direction de [SOV.getLeader], avait accepté de signer notre pacte de non-agression et suivrait les stipulations du traité jusqu’à ses derniers mots et conformément à tous les protocoles officiels mentionnés dans le document.\n\nCela signifie que nous sommes libres d’agir sans risque d’intervention [SOV.getAdjective] et que les ressources [SOV.getAdjective] seront disponibles pour notre usage si nous lançons une quelconque campagne militaire ou civile.\n\nMalheureusement, certains de nos amis remettent maintenant en question l’engagement de [GER.getNameDef] envers la destruction ultime du communisme. Une fois les affaires avec [POL.getNameDef] et [FRA.getNameDef] réglées, nous pourrions avoir besoin de revoir ce traité, mais cela est une discussion pour une autre fois..."
 germany.13.d:0 "Un message récent de nos espions à Moscou et dans ses environs suggère que [SOV.getNameDef] a refusé de signer notre pacte de non-agression. \n\nDe plus, [SOV.getLeader] a prononcé un discours officiel ce matin à la population du pays, dans lequel il a dénoncé notre proposition de paix et de prospérité en Europe de l’Est comme « ...un effort inférieur d’une pitoyable direction [GER.getAdjective] visant à gagner la confiance du peuple [SOV.getAdjective] seulement pour nous trahir dès que notre aide ne sera plus nécessaire... ». \n\nEn lisant le rapport, [GER.getLeader] est devenu livide, les mains tremblantes, en murmurant quelque chose comme « Verräter... Verräter ». \nCela complique les choses, car nous ne pouvons pas agir de manière décisive contre [POL.getNameDef] ou [FRA.getNameDef] sans risquer une implication des [SOV.getAdjective]s."
 germany.14.c:0 "Les [SOV.GetAdjective]s seront indemnisés avec la Lituanie"
 germany.14.d:0 "Nous suivrons les stipulations du traité original."
 germany.15.t:0 "[GER.getNameDefCap] honore le pacte"
 germany.15.d:0 "Conformément au pacte Molotov-Ribbentrop, les forces [GER.GetAdjective] ont évacué la Pologne orientale et nos propres troupes sont entrées pour occuper le territoire."
 germany.16.t:0 "[GER.getNameDefCap] trahit le pacte"
 germany.16.d:0 "[GER.getNameDefCap] a refusé de partager la Pologne avec nous, en violation flagrante du pacte Molotov-Ribbentrop ! Cette trahison a rendu notre traité avec eux nul et non avenu !"
 germany.16.a:0 "Nous avons été idiots de faire confiance aux [GER.GetRulingIdeology]s !"
 germany.20.d:0 "Reconnaissant qu’un nouvel ordre a été établi en Europe, nous avons été sollicités par [HUN.getNameDef] et [ROM.getNameDef] pour arbitrer un différend territorial entre les deux pays. La Transylvanie a été prise à [HUN.getNameDef] et intégrée à [ROM.getNameDef] dans l’un des nombreux changements mal conçus imposés au monde à Versailles. La Transylvanie du Nord doit-elle être rendue au contrôle [HUN.getAdjective] ?"
 germany.20.a:0 "Donner la Transylvanie du Nord à [HUN.getNameDef]."
 germany.20.b:0 "Donner toute la Transylvanie à [HUN.getNameDef]."
 germany.20.c:0 "La Transylvanie restera dans [ROM.getNameDef]."
 germany.21.t:0 "[ROM.getNameDefCap] rejette notre verdict"
 germany.21.d:0 "[ROM.getNameDefCap] a refusé de se conformer à la décision que nous avons rendue dans le deuxième arbitrage de Vienne ! Leur délégation a été rappelée à Bucarest, et aucun territoire n’a été cédé à [HUN.getNameDef]."
 germany.21.a:0 "La volonté de [GER.getNameDef] doit être obéie !"
 germany.22.t:0 "Memel – [188.controller.getNameDef] cède"
 germany.22.d:0 "Le gouvernement [188.controller.getAdjective] a accepté nos exigences, et Memel sera réintégré à la Prusse-Orientale. Une autre province volée illégalement a été rendue à la nation [GER.getAdjective] !"
 germany.23.t:0 "Memel – [188.controller.GetNameDef] refuse l’exigence"
 germany.23.d:0 "Le gouvernement [188.controller.getAdjective] a refusé nos exigences ! Ils se cachent derrière la convention de Klaipeda, affirmant que [GER.getNameDef] n’a aucun droit légal sur le territoire de Memel. Nous devrons leur expliquer notre position par d’autres moyens..."
 germany.24.t:0 "[GER.getNameDefCap] mission militaire en Chine"
 germany.24.d:0 "[GER.getNameDefCap] entretient de bonnes relations avec la Chine depuis la fin du précédent Weltkrieg, malgré la perte de nos possessions chinoises. Une mission militaire [GER.getAdjective] est présente en Chine depuis plusieurs années, et Alexander von Falkenhausen a accompli de grands progrès dans la réforme de certaines parties de l’armée du Kuomintang. \n\nCela inquiète naturellement les [JAP.getAdjective], étant donné leur guerre actuelle contre la Chine. Ils exigent le retrait immédiat de tout soutien [GER.getAdjective] aux [CHI.getAdjective]."
 germany.24.c:0 "Non, nos conseillers resteront, comme nous l’avons promis aux [CHI.getAdjective]."
 germany.28.t:0 "Anschluss"
 germany.28.d:0 "C’est arrivé.\n\nPersonne ne doutait que ce moment viendrait, mais un choc s’est tout de même répandu dans toute la nation.\n\nPlus tôt aujourd’hui, [GER.GetLeader] a envoyé à notre gouvernement une liste d’exigences qui, en pratique, annexeraient notre nation à la leur. Des émeutes soutenant l’Anschluss ont éclaté partout dans le pays, et notre armée connaît des désertions vers les nazis.\n\nAlors que l’échéance expire et que les troupes nazies sont prêtes à entrer sur notre territoire, nous devons prendre une décision immédiatement.\n\nL’Autriche indépendante n’est-elle qu’une création artificielle, ou quelque chose de plus grand ?"
 germany.28.a:0 "Nous avons été laissés seuls..."
 germany.28.b:0 "Nous ne nous laisserons pas piétiner si facilement ! Rouge Blanc Rouge jusqu’à la mort !"
 germany.28.c:0 "Nous ne nous laisserons pas piétiner si facilement ! Noir sur Jaune jusqu’à la mort !"
 germany.29.t:0 "[AUS.getNameDef] refuse l’Anschluss !"
 germany.29.b:0 "Il vaudrait peut-être mieux ne pas aller plus loin."
 germany.51.d:0 "La Tchécoslovaquie est une tumeur cancéreuse au cœur de l’Europe, et les Allemands ont enfin décidé d’agir de manière décisive contre elle. Les Sudètes ont déjà été cédés à l’Allemagne, et maintenant, en conséquence de l’accord de Munich, le territoire tchécoslovaque qui appartient légitimement à la Hongrie doit nous être rendu."
 germany.70.d:0 "Estimant qu’Hitler a poussé l’Allemagne dans une situation irréparable, un groupe d’officiers supérieurs de la Wehrmacht a lancé un coup d’État ! Il semble que celui-ci ait été orchestré par le colonel Hans Oster de l’Abwehr, mais les généraux Beck, von Brauchitsch, Halder et l’amiral Canaris ont également été confirmés comme impliqués !\n\nDes hommes lourdement armés, embusqués dans plusieurs appartements berlinois, ont convergé vers les bâtiments gouvernementaux clés et entendent renverser le régime actuel. De violents combats font rage. La situation actuelle du Führer est incertaine, mais des unités loyales se battent pour le contrôle de Berlin."
 germany.71.d:0 "Les troupes SS et les unités loyales ont réussi à tuer ou capturer tous les commandos traîtres et ont pu contenir totalement la situation. Cependant, le Führer a été retrouvé mort, assassiné par les conspirateurs !\n\nLes conspirateurs survivants seront jugés pour leur crime odieux, mais pour l’instant un nouveau leader est nécessaire. Qui sera le prochain Führer ?"
 germany.72.d:0 "Les troupes SS et les unités loyales ont réussi à tuer ou capturer tous les commandos traîtres, et la situation est désormais considérée comme totalement sous contrôle. Hitler lui-même a dirigé l’opération de nettoyage avec son fidèle Luger.\n\nLes conspirateurs survivants paieront cher leur déloyauté, et Hitler est maintenant encore plus déterminé à assurer le succès allemand !"
 germany.73.d:0 "Les combats intenses à Berlin ont réduit la capitale à une ruine en flammes. Malgré un grand nombre de soldats SS et d’unités loyales combattant, des unités de l’armée loyales aux conspirateurs se sont jointes à la bataille et ont été décisives. Le Führer a été confirmé mort, et les conspirateurs ont réussi à prendre tous les bâtiments gouvernementaux de Berlin.\n\nUne grande partie de la Wehrmacht est passée de l’autre côté, mais de nombreux officiers restent fidèles au NSDAP. Qui devrait les diriger ?"
 germany.75.t:0 "Traité [GER.GetAdjective]-[SOV.GetAdjective]"
 germany.76.t:0 "[SOV.GetLeader] accepte le traité germano-[SOV.GetAdjective]"
 germany.77.t:0 "[SOV.GetLeader] rejette le traité germano-[SOV.GetAdjective]"
 germany.79.d:0 "Avec la Grèce sous le joug de l’Allemagne, [From.GetLeader] a fait pression sur notre gouvernement pour que nous rejoignions leurs rangs. L’alliance [SOV.GetAdjective]-allemande nous place dans une position où la neutralité n’est plus une option, et un ultimatum vient d’arriver de Berlin nous exigeant de céder nos territoires orientaux à leurs alliés soviétiques et de les rejoindre dans le pacte même qu’ils utilisent pour nous forcer la main.\n\nBien que nous ne puissions pas maintenir la neutralité, d’autres options existent. Chercher le soutien de la Grande-Bretagne en est une, tenir notre position en est une autre. Aucune, toutefois, ne peut garantir l’avenir de la république avec certitude."
 china.101.d:0 "Des rapports récents de la frontière nord [CHI.GetAdjective]-[JAP.GetAdjective] indiquent que le conflit houleux concernant la zone démilitarisée et les droits territoriaux des deux pays autour de Pékin a débouché sur un conflit armé ouvert entre les deux nations. \n\nDans son récent discours, [CHI.GetLeader] a appelé tous les citoyens chinois de l’ancien royaume impérial à s’unir pour combattre les forces japonaises envahissantes. Si nous voulons garantir un avenir à la Chine telle qu’elle est, nous devons mettre de côté les querelles mesquines et nous battre comme une Chine forte et unie ! \n\nLes Japonais, quant à eux, affirment que ce sont les [CHI.GetAdjective] qui ont déclenché et aggravé l’incident. De leur point de vue, [CHI.GetName] cherchera sûrement à nous détruire et à anéantir notre État encore fragile dès qu’ils en auront l’occasion. Nous pouvons prendre notre temps et observer l’évolution de la situation. \n\n Quelle sera la décision de [Root.GetLeader] ?"
 china.101.c:0 "Pour l’instant, nous sommes mieux seuls."
 china.103.d:0 "[From.GetNameDefCap] a choisi de nous rejoindre dans la lutte contre les Japonais. Unis, nous repousserons l’envahisseur."
 china.104_PRC_SOV_reinforcements:0 "Recevra 10 divisions de [SOV.GetNameDef]."
 china.104.tt:0 "\nLa Chine du Nord et la Mandchourie peuvent maintenant être libérées au nom de [Root.GetNameDef].\n"
 china.106.d:0 "[From.GetNameDefCap] a rejoint [Root.GetFactionName] et est prêt à se battre."
 china.108.d:0 "Notre rôle dans la lutte contre les chiens japonais détestés a donné beaucoup de prestige au PCC. De plus en plus de gens voient que nous sommes l’avenir de la Chine, surtout en comparaison avec le Kuomintang corrompu. Les cadres du Parti organisent déjà ces personnes en une nouvelle armée qui nagera dans la mer paysanne."
 china.111.d:0 "[Root.GetFactionName] a rempli son objectif. Il n’y a plus d’ennemi contre lequel rester unis. Nous avons utilisé ce temps à bon escient pour renforcer notre soutien à travers le nord de la Chine et la Mandchourie et il est maintenant temps de formaliser notre contrôle dans cette région."
 spain.10.d:0 "Après que le chef de la Confederación Española de Derechas Autónomas, le principal parti de droite qui avait auparavant coopéré avec le gouvernement centriste d’Alejandro Lerroux, José María Gil-Robles y Quiñones, a cherché le poste de Premier ministre, ce qui aurait renforcé le contrôle de la CEDA sur le gouvernement espagnol, le président Niceto Alcalá-Zamora a décidé de dissoudre les Cortes puisqu’il avait toujours été hostile à la CEDA et à son chef. De nouvelles élections sont prévues pour février, et en attendant, Manuel Portela restera Premier ministre."
 spain.4.a.tt:0 "[From.GetNameDefCap] nous serait reconnaissant si nous organisions un prêt-bail pendant la guerre."
 france.17.b:0 "[Root.GetNameDefCap] suit sa propre voie."
 france.18.t:0 "[From.GetNameDefCap] Rejoint la faction française"
 france.19.t:0 "[From.GetNameDefCap] Refuse l’alliance française"
 france.35.title:0 "Les communistes dominent le Front populaire"
 france.35.desc:0 "Le paysage politique de [FRA.GetNameDef] a considérablement changé maintenant que les communistes ont remporté l’élection. L’alliance de gauche avait auparavant un rôle limité pour les communistes, qui n’occupaient aucun poste gouvernemental, mais cela changera sans aucun doute avec leur montée."
 france.35.a:0 "Ils ont intérêt à suivre les règles."
 france.35.b:0 "Le peuple de France a fait un choix judicieux."
 france.35.c:0 "Pouvons-nous encore leur faire confiance ?"
 soviet.4.t:0 "[78.controller.GetNameDefCap] Cède la Bessarabie"
 soviet.4.d:0 "Les [78.controller.getAdjective]s ont sagement cédé à nos exigences avec leur ambassadeur à Moscou remettant ce matin la note d’excuses pour leur réponse tardive à nos officiels. \n\nNos patrouilles frontalières renforcées signalent le retrait des forces [78.controller.getAdjective] sur l’intégralité de la frontière bessarabienne. Certains soldats aventureux ont déjà occupé quelques avant-postes de l’autre côté du Dniestr. \n\nNous incorporerons le territoire dans [SOV.getNameDef] en offrant aux [MOL.getAdjective]s l’autonomie souhaitée au sein de notre État. La Bucovine devrait être réintégrée dans l’État [UKR.getAdjective] afin que sa population puisse désormais profiter des avantages de l’unification avec ses frères et sœurs."
 soviet.5.t:0 "[78.Owner.getNameDefCap] Refuse nos exigences"
 soviet.5.d:0 "Les [78.Owner.getAdjective]s ont refusé de céder à nos exigences ! Il semble que nous devions expulser leurs forces occupantes de Bessarabie par la force."
 soviet.6.t:0 "[EST.getNameDefCap] Se soumet"
 soviet.6.d:0 "[EST.getNameDefCap] a cédé à nos exigences. Nous avons remplacé le gouvernement décadent de Tallinn par un gouvernement pro-[SOV.getAdjective], qui a voté à l’unanimité pour demander aux officiels de [SOV.getNameDef] la réintégration de leur État dans le nôtre. Après « beaucoup » d’hésitation, le Suprême [SOV.getAdjective] a décidé d’accepter cette requête."
 soviet.6.a:0 "Bienvenue dans la Mère Patrie."
 soviet.7.t:0 "[EST.getNameDefCap] Refuse notre offre"
 soviet.7.d:0 "[EST.getNameDefCap] a scandaleusement décidé de refuser notre généreuse offre de pacte d’assistance mutuelle ! Les dirigeants bellicistes et rebelles de Tallinn ont en plus eu l’audace d’émettre une déclaration exigeant que nous respections l’intégrité territoriale de leur nation !"
 soviet.7.a:0 "Nous devons protéger les [EST.getAdjective]s d’eux-mêmes"
 soviet.8.t:0 "[LAT.getNameDefCap] Se soumet"
 soviet.8.d:0 "Le gouvernement [LAT.getAdjective] à Riga a accepté nos exigences, et nous avons remplacé leur régime corrompu par un régime moins réticent et ouvert à d’autres propositions. Cet organisme a voté à l’unanimité pour demander l’adhésion à notre grande union en tant que partie intégrante de notre État. Nous avons gracieusement accepté cette demande."
 soviet.8.a:0 "Vous êtes désormais dans notre sphère !"
 soviet.9.t:0 "[LAT.getNameDefCap] Refuse notre offre"
 soviet.9.d:0 "Les oppresseurs et tyrans qui dirigent [LAT.getNameDef] ont choisi d’abandonner toute raison. Ils ont rejeté notre généreux pacte d’assistance mutuelle et exigent le retrait immédiat de toutes les forces [SOV.getAdjective] prétendument « massées » le long de leur frontière."
 soviet.9.a:0 "Le peuple [LAT.getAdjective] doit être libéré."
 soviet.10.t:0 "[LIT.getNameDefCap] Se soumet"
 soviet.10.d:0 "Notre demande de bases militaires dans [LIT.getNameDef] a été acceptée, mais malheureusement leur gouvernement s’est effondré. Nous avons établi un nouveau Parlement pour éviter l’anarchie, et celui-ci a voté à l’unanimité pour demander l’adhésion au Suprême [SOV.getAdjective] à notre union. Cette demande a été acceptée."
 soviet.10.a:0 "Nous vous sauverons d’un autre désastre politique."
 soviet.11.t:0 "[LIT.getNameDefCap] Refuse notre offre"
 soviet.11.d:0 "[LIT.getNameDefCap] semble déterminé à l’autodestruction, et les idiots de leur gouvernement refusent l’accès de nos forces à leur pays. Pensent-ils être mieux sous la domination des [GER.getAdjective]s ? Leurs dirigeants égoïstes commettent un crime contre le peuple en refusant à leurs citoyens leur véritable volonté."
 soviet.11.a:0 "Le peuple [LIT.getAdjective] a assez souffert."
 soviet.12.t:0 "[FROM.getNameDefCap] Accepte nos exigences"
 soviet.12.d:0 "Les forces écrasantes que nous avons massées le long de leur frontière ont convaincu le gouvernement [FROM.getAdjective] d’accepter notre modeste demande de révision de leurs frontières. Nous avons pris le contrôle des régions stratégiques qui seront incorporées dans la région administrative [KAR.getAdjective], et la position de notre frontière nord est maintenant beaucoup plus sûre."
 soviet.13.t:0 "[FROM.getNameDefCap] Rejette nos exigences"
 soviet.13.d:0 "Le gouvernement [FROM.getAdjective] a rejeté nos demandes, mais cela était à prévoir. Si nous voulons la Carélie, nous devrons la prendre par la force. Il est temps d’enseigner aux idiots têtus une leçon qu’ils n’oublieront pas !"
 japan.3.t:0 "Escarmouche frontalière : Victoire [SOV.GetAdjective]"
 romania.1.t:1 "[FROM.GetNameDefCap] Demande la Bessarabie"
 baltic.5.a:0 "Notre avenir est mieux assuré si nous devenons véritablement unis avec la Mère Patrie."
 bulgaria.2.d:0 "Le gouvernement roumain a refusé notre offre de mettre fin à tous les différends ! Ils affirment que la Dobroudja méridionale forme désormais une partie intégrante de leur nation qu’ils n’abandonneront jamais."
 italy.1.t:0 "[ALB.GetNameDefCap] Cède"
 italy.1.d:0 "Les autorités [ALB.getAdjective] ont accepté nos exigences, et [ALB.GetLeader] a été contraint de signer la pétition qui intégrera officiellement [ALB.GetNameDef] comme région protégée de [ITA.GetNameDef]. \n\nDésormais et jusqu’à la fin des temps, [ITA.GetNameDef] sécurisera ses positions sur la mer Adriatique !"
 italy.2.t:0 "[ALB.GetLeader] Refuse l’ultimatum"
 italy.2.d:0 "Défiant jusqu’au bout, [ALB.GetLeader] a rejeté notre ultimatum. Lui et ses conseillers tentent maintenant de rassembler les maigres défenses que [ALB.GetNameDef] peut réunir. Nous devons occuper Tirana et mettre fin à cette farce !"
 italy.2.a:0 "Nous aurions pu faire ça facilement, toi !"
 italy.3.t:0 "Ultimatum [ITA.getAdjective]"
 italy.3.d:0 "Les diplomates [ITA.getAdjective] nous ont présenté un ultimatum exigeant que nous nous soumettions à leur occupation ! [ALB.GetNameDefCap] doit être gouverné en union personnelle sous le roi [ITA.getAdjective] !"
 italy.3.b:0 "Cela n’arrivera pas ! Rassemblez-vous autour de [ALB.GetLeader] !"
 news.1.d:0 "De fortes tensions frontalières entre les forces [JAP.getAdjective] et [CHI.getAdjective] ont conduit à des coups de feu après qu’un soldat [JAP.getAdjective] aurait prétendument omis de répondre au commandant de régiment et que l’équipe d’enquête a exigé la fouille du fort Wanping. Après l’échec des négociations, les deux camps se sont affrontés sans conclusion autour du stratégique pont Marco Polo situé juste au sud-ouest de Pékin. \n\n[CHI.GetNameDefCap] a rejeté les exigences de [JAP.GetNameDef] pour des excuses et des concessions territoriales, affirmant que le « point de rupture » de l’agression japonaise avait été atteint. \n\nLes diplomates craignent que la situation volatile ne débouche sur une guerre à tout moment."
 news.5.d:0 "Profitant de la faiblesse [FRA.getAdjective] à la lumière de la lutte en Europe et de leur faible emprise sur leurs possessions coloniales dans le monde, [JAP.GetNameDef] a contraint le nouveau gouvernement à céder le contrôle de leur colonie en Indochine ! \n\nLes troupes [JAP.getAdjective] ont déjà commencé à occuper toutes les principales bases de la région, y compris les installations stratégiques autour du Tonkin et de Saïgon. Le manque de communication a entraîné des escarmouches autour de Dong-Dang, Lang-Son et Haiphong qui ont duré plusieurs jours. \n\nLes experts craignent que la colonie puisse être utilisée comme point de lancement pour de futures expéditions militaires."
 news.6.d:0 "Tentant de profiter de la faiblesse de la France à la lumière de sa défaite en Europe, [JAP.GetNameDef] a récemment émis une demande au nouveau gouvernement français pour un accès complet à leurs bases en Indochine. \n\nCela reviendrait effectivement à transférer le contrôle de toute la colonie au Japon, ce que les Français ne pouvaient accepter. Avec l’échec des négociations, les deux camps rassemblent des troupes dans la région. L’administration coloniale [FRA.getAdjective] a déjà instauré la loi martiale et déclaré la mobilisation générale ! \n\nLes experts considèrent probable que cette décision entraîne des représailles militaires japonaises."
 news.7.t:0 "[SOV.GetAdjective] - Escarmouche avec les Japonais"
 news.7.d:0 "Les forces [SOV.GetAdjective] et japonaises se sont récemment affrontées dans une importante escarmouche le long de la frontière mandchoue. \n\nUne importante force de raid [SOV.GetAdjective] soutenue par la cavalerie mongole aurait pris les Japonais par surprise, infligeant de lourdes pertes. \n\nL’ambiance à Tokyo serait tendue, mais il est trop tôt pour dire si le conflit va dégénérer en guerre ouverte."
 news.7.c:0 "Nous avons envoyé un message au monde."
 news.8.d:0 "Les forces [SOV.GetAdjective] et japonaises se sont récemment affrontées dans une importante escarmouche le long de la frontière mandchoue. \n\nLes récits de la bataille indiquent que les Japonais ont pris les Soviétiques dans un mouvement en tenaille lorsqu’ils ont attaqué à travers la frontière, forçant les survivants à se replier en désordre. \n\nCet incident poussera-t-il Moscou à envoyer davantage de forces en Extrême-Orient russe ?"
 news.9.t:0 "Retrait [SOV.GetAdjective]"
 news.9.d:0 "Après un renforcement des forces japonaises en Mandchourie, [SOV.GetNameDef] semble avoir retiré de manière inattendue des unités stationnées juste le long de la frontière. \n\nCela pourrait être une tentative de Moscou pour éviter une future confrontation avec le Japon, peut-être déclenchée par le souvenir cuisant de la défaite subie lors de la guerre russo-japonaise."
 news.10.t:0 "[SOV.GetNameDefCap] Revendique la Bessarabie"
 news.10.d:0 "\nAprès avoir massé des forces le long de la frontière roumaine, [SOV.GetNameDef] a émis un ultimatum au gouvernement de Bucarest pour le transfert immédiat de la Bessarabie sous leur contrôle. \n\nPendant la guerre civile russe, les autorités locales déclarèrent leur indépendance et exprimèrent leur désir d’être intégrées à la Roumanie, ce que [SOV.GetNameDef] considère comme une base légale insuffisante, affirmant également que « les voix de la minorité ukrainienne n’ont pas été considérées ».\n\nLa Roumanie a déclaré qu’elle n’avait pas d’autre choix que d’accepter, et ses forces se sont retirées de la Bessarabie et du nord de la Bucovine."
 news.11.t:0 "[78.controller.GetNameDefCap] Rejette les exigences [SOV.GetAdjective]"
 news.11.d:0 "[SOV.GetNameDefCap] a concentré des forces importantes le long de sa frontière avec [78.controller.GetNameDef], et aujourd’hui Moscou a émis un ultimatum au gouvernement [78.controller.GetAdjective], appelant au transfert immédiat de la Bessarabie sous leur contrôle. La région appartenait autrefois à l’Empire russe, ce que [SOV.GetNameDef] considère comme une base légale suffisante pour ses revendications.\n\nDans un geste défiant, les autorités locales ont choisi de rejeter toutes les revendications territoriales [SOV.GetAdjective], et la mobilisation générale a été ordonnée. \n\nLes observateurs internationaux s’attendent à ce que les forces [SOV.GetAdjective] franchissent la frontière d’un moment à l’autre."
 news.12.t:0 "[146.controller.GetNameDefCap] Rejette les exigences [SOV.GetAdjective]"
 news.12.d:0 "\nLes diplomates [SOV.GetAdjective] ont présenté un ultimatum au gouvernement de [146.controller.GetNameDef], exigeant des ajustements frontaliers dans la région de Carélie, la location de la péninsule de Hanko pour les 30 prochaines années et la cession de quelques îles dans le golfe de Finlande en échange des établissements de Repola et Porajärvi en Carélie orientale. \n\nMalgré un important renforcement des forces soviétiques à la frontière, Helsinki a rejeté ces demandes, déclarant que « pas un seul pied de terre finlandaise ne sera donné volontairement aux agresseurs russes ». \n\nLes observateurs internationaux craignent qu’une invasion [SOV.GetAdjective] soit imminente."
 news.13.t:0 "[FIN.GetNameDefCap] Accepte les exigences [SOV.GetAdjective]"
 news.13.d:0 "Après de nombreux débats, le gouvernement de [FIN.GetNameDef] a décidé d’accepter les exigences [SOV.GetAdjective] pour des ajustements frontaliers dans la région de Carélie. \n\n[SOV.GetNameDefCap] a invoqué la nécessité de créer une zone tampon pour améliorer la sécurité de Leningrad, située à seulement 30 kilomètres de l’ancienne frontière finlandaise. \n\nDe nombreux observateurs craignaient qu’une invasion soviétique à grande échelle de la Finlande soit imminente, mais cette solution diplomatique devrait apaiser ces craintes."
 news.14.d:0 "Dans un communiqué de presse plus tôt aujourd’hui, Moscou a annoncé l’annexion officielle de [TAN.GetNameDef] et son incorporation comme Oblast autonome touvain dans l’URSS. \n\nLe Suprême [SOV.GetAdjective] a accepté une demande du nouveau Comité central réformé du TPRP pour l’adhésion à l’URSS. \n\nLe petit [TAN.GetName], qui n’avait été officiellement reconnu que par [SOV.GetNameDef] et la Mongolie, a développé des liens administratifs, militaires et économiques toujours plus étroits avec le grand frère [SOV.getAdjective] ces dernières années."
 news.19.d:0 "Avec les forces allemandes prêtes à attaquer à leur frontière, [188.controller.GetNameDef] a cédé à un ultimatum [GER.GetAdjective] exigeant la reddition du vieux territoire prussien de Memel.\n\nMemel appartenait autrefois à la Prusse orientale et devint un mandat officiel de la Société des Nations après le traité de Versailles, avant d’être annexé par la Lituanie en 1923 après que des révoltés de Klaipeda prirent le contrôle de la région. Le territoire acquis doit être réintégré dans la région d’Ostpreussen. \n\nAvons-nous atteint les limites des ambitions territoriales allemandes en Europe ? Les experts en doutent…"
 news.20.t:0 "[188.controller.GetNameDefCap] Rejette les exigences allemandes"
 news.20.d:0 "\nMême avec des forces allemandes alignées à leur frontière, [188.controller.GetNameDef] a rejeté un ultimatum émis par Berlin pour le retour du territoire de Memel. \n\nMemel appartenait autrefois à la Prusse orientale, et les [GER.GetAdjective] y voient une base légitime pour leurs revendications. C’était l’intégrité du traité, disait [188.controller.GetLeader], qu’il fallait protéger lorsque le gouvernement [188.controller.GetAdjective] annonça son refus.\n\nLes observateurs internationaux s’attendent maintenant à ce que l’Allemagne tente de reprendre le territoire par la force…"
 news.22.t:0 "[ALB.getLeader] Se soumet à l’Italie"
 news.22.d:0 "Il y a quelques jours, un ultimatum a été remis au gouvernement [ALB.getAdjective] par des diplomates [ITA.getAdjective], exigeant leur soumission à une occupation militaire complète. \n\nCe matin, toutes les stations de radio [ALB.getAdjective] diffusaient un message dans lequel [ALB.getLeader] ordonnait à l’armée de déposer les armes après avoir réalisé la futilité de la résistance, puisque [ALB.getName] sera désormais gouverné en union personnelle sous [ITA.getLeader]. Des avions [ITA.getAdjective] ont été aperçus patrouillant le ciel tandis que des navires de transport de la Regia Marina débarquent déjà les premiers soldats [ITA.getAdjective] sur le sol [ALB.getAdjective]. \n\n[ITA.GetNameDefCap] tourne son regard vers les Balkans..."
 news.22.a:0 "Une autre victime des ambitions de [ITA.getLeader]."
 news.23.t:0 "[ALB.getLeader] Défiant"
 news.23.d:0 "Des diplomates de [ITA.GetNameDef] ont remis un ultimatum à [ALB.GetNameDef], exigeant l’annexion de ce dernier dans la Grande Italie. \n\nDans un acte courageux de leadership national, [ALB.getLeader] a refusé de céder aux exigences [ITA.getAdjective], exhortant le peuple [ALB.getAdjective] à résister à la pression de [ITA.GetNameDef]. \n\nNéanmoins, les experts militaires étrangers conviennent que [ALB.GetNameDef] a peu de chances de résister à une invasion."
 news.23.c:0 "Vive [ALB.getLeader] !"
 news.25.d:0 "L’Allemagne a stationné 20 000 soldats de la Wehrmacht dans le territoire de la Rhénanie, près des frontières française et belge, en violation claire du traité de Versailles et des accords de Locarno. \n\nLa population locale a acclamé les soldats allemands et des célébrations effrénées ont été organisées dans tout le pays. Un référendum national allemand devrait avoir lieu la semaine suivante sur l’approbation générale de la remilitarisation par le public. \n\nLes réactions diplomatiques de la France et de la Grande-Bretagne ont jusqu’ici été modérées. « Ce ne sont que les Allemands entrant dans leur propre arrière-cour », a observé un commentateur politique britannique."
 news.28.t:0 "Himmler prend la tête du parti !"
 news.28.d:0 "Après la mort d’Adolf Hitler, beaucoup se demandaient qui dirigerait la nation sur ses traces. Nous avons maintenant la réponse, car plus tôt ce matin Heinrich Himmler a été investi comme nouveau Führer du Reich allemand. \n\nDans un discours devant le Reichstag, Himmler a accusé la Grande-Bretagne et la France d’avoir orchestré l’assassinat de Hitler et a déclaré l’engagement sans équivoque de l’Allemagne à la destruction totale des deux nations."
 news.29.t:0 "Göring prend la tête du parti !"
 news.29.d:0 "Après la mort d’Adolf Hitler, beaucoup se demandaient qui dirigerait la nation sur ses traces. Nous avons maintenant la réponse, car plus tôt ce matin Hermann Göring a été investi comme nouveau Führer du Reich allemand. \n\nDans un discours devant le Reichstag, Göring a accusé la Grande-Bretagne et la France d’avoir orchestré l’assassinat de Hitler et a déclaré l’engagement sans équivoque de l’Allemagne à la destruction totale des deux nations."
 news.30.d:0 "Un groupe d’officiers de la Wehrmacht opposés au régime actuel a lancé un coup d’État contre Hitler à Berlin. Un groupe non identifié d’hommes armés a pris d’assaut des bâtiments gouvernementaux clés, mais ils ont été repoussés par des membres de la SS et d’autres unités militaires loyales.\nLes agents de la Gestapo ont arrêté tous les conspirateurs, parmi lesquels des officiers de haut rang tels que Ludwig Beck et Wilhelm Canaris. \n\nDans un discours devant le Reichstag, Hitler a juré vengeance contre la France et la Grande-Bretagne pour avoir orchestré cette « tentative sournoise » contre sa vie."
 news.31.d:0 "Un groupe d’officiers de la Wehrmacht opposés à la situation actuelle dans [GER.GetNameDef] a lancé un coup d’État contre les nazis à Berlin.\n\nLes conspirateurs ont réussi à prendre le contrôle de la majeure partie de Berlin, et de nombreuses unités de la Wehrmacht ont rejoint leur camp. Les forces encore loyales aux nazis se sont ralliées sous une nouvelle direction et ont juré de purger l’Allemagne des « dissidents communistes et agents étrangers occupant actuellement Berlin »."
 news.33.t:0 "Les forces armées [SOV.GetAdjective] occupent la Pologne orientale"
 news.33.d:0 "Les troupes [SOV.GetAdjective] ont occupé la Pologne orientale, officiellement dans le but de protéger les minorités biélorusses et ukrainiennes du chaos qui a suivi l’effondrement du gouvernement [POL.GetAdjective]. \n\nLes forces [GER.GetAdjective] se sont retirées de ces zones en bon ordre, entraînant la partition effective de la Pologne entre les deux puissances. De nombreux experts n’ont pas tardé à qualifier cela de « quatrième partition de la Pologne », exprimant de sérieux doutes quant à l’existence de l’État indépendant [POL.getAdjective] dans un avenir proche. \n\nSeul le temps dira combien de temps ce nouvel ordre mondial durera…"
 news.37.d:0 "Léon Trotsky, autrefois le principal lieutenant et héritier présomptif de Vladimir Ilitch Lénine, est mort aujourd’hui dans un hôpital de Mexico. Il a été attaqué chez lui avec un piolet par un ressortissant espagnol que l’on pense avoir été employé par le NKVD.\n\nAprès une lutte de pouvoir infructueuse contre $SOV_iosif_stalin$ et ses alliés pour le contrôle du Parti communiste de l’Union soviétique, Trotsky a passé les années 1930 en exil, vivant en Turquie, en France et en Norvège avant de s’installer finalement au Mexique. \n\nIl est resté un critique constant de Staline et de « l’État ouvrier dégénéré » de l’Union soviétique."
 news.101.d:0 "Alors que les combats font rage ailleurs dans [FRA.GetNameDef], des rapports indiquent que des troupes [ROOT.GetAdjective] entrent dans Paris. \n\nLa capitale a été déclarée ville ouverte par les forces françaises quelques instants avant que leurs dernières unités ne se retirent. Plusieurs colonnes de troupes allemandes ont recréé le défilé de la victoire prussienne de 1871 en descendant les Champs-Élysées sous le regard médusé des Parisiens. \n\nLes experts militaires prévoient que l’effondrement de [FRA.GetNameDef] est imminent."
 news.101.a:0 "[ROOT.GetNameDefCap] semble inarrêtable !"
 news.103.d:0 "[195.GetCapitalVictoryPointName], berceau de la Révolution russe, est tombée aux mains des forces allemandes en progression. \n\nDes combats sporadiques peuvent encore être entendus dans certains faubourgs, mais un étrange calme semble s’être installé sur le reste de la ville en ruines.\n\nPlus tôt aujourd’hui, des colonnes de soldats allemands ont défilé devant la cathédrale Saint-Isaac, dont le grand dôme a été peint en gris par les ingénieurs de l’Armée rouge pour éviter l’attention des bombardiers de la Luftwaffe en maraude. \nMalgré ces efforts, elle est criblée de trous de balle et d’impacts d’éclats."
 news.113.d:0 "Des soldats italiens jubilants sont entrés au Caire aujourd’hui, quelques instants après la retraite des dernières unités britanniques de la ville. \n\nUn défilé de la victoire a été immédiatement organisé, et les soldats italiens ont afflué vers les grandes pyramides de Gizeh pour se faire photographier devant les célèbres monuments.\n\nAvec Le Caire sous son contrôle, [ITA.GetLeader] se rapproche d’un pas de plus de relier l’Afrique orientale italienne à la Libye italienne et de former une colonie continue en Afrique."
 news.158.t:0 "[From.From.GetNamedefCap] Intervient dans la guerre [From.GetAdjective]"
 news.158.d:0 "Il y a quelques jours, [From.GetNamedef] a déclaré la guerre à [From.From.From.GetNamedef]. Peu après, [From.From.GetNameDef] a émis un ultimatum indiquant qu’il entrerait en guerre contre [From.GetNameDef] s’ils ne cessaient pas toute agression et n’acceptaient pas un accord de paix. [From.GetLeader] affirme que leurs raisons de guerre étaient justes, mais a choisi de se démobiliser et d’accepter la paix."
 news.159.t:0 "L’Aube du [From.GetFactionName]"
 news.159.d_01:0 "[From.GetLeader] a annoncé aujourd’hui que [From.GetNamedef] a proposé de former une nouvelle alliance. Les pays liés par le [From.GetFactionName] ont rendu publique leur intention de coopérer en cas de guerre.\n\nBien que de grandes coalitions puissent dissuader l’agression, nous avons vu les conséquences qu’elles entraînent lorsque le conflit éclate. Les intentions des différents partis rejoignant cette nouvelle alliance restent discutables, mais le but qu’elle pourrait finir par servir est peut-être inconnu même de ses instigateurs."
 news.159.d_03:0 "Même [From.GetNamedef], célèbre pour sa foi dans la force et la supériorité de son peuple et de sa nation, n’est pas au-dessus de former des alliances avec ceux qu’il respecte. [From.GetLeader] a annoncé aujourd’hui que les accords finaux avaient été conclus concernant le [From.GetFactionName], une coalition militaire prétendant n’avoir de place que pour des nations honorables destinées à la grandeur.\n\nQue cette grandeur doive venir de la construction de la société idéale à l’intérieur de leurs frontières respectives ou d’une coopération pour s’étendre au-delà, le monde pourrait ne pas le savoir avant qu’il ne soit trop tard."
 news.185.t:0 "[From.GetNameDefCap] Recherche un Pacte Militaire Étendu"
 news.185.a:0 "[From.GetNameDefCap] montre la voie !"
 news.187.a:0 "Sûrement que [GRE.GetName] partage nos intérêts."
 news.188.t:0 "[ITA.GetNameDefCap] Recherche la Réconciliation avec [TUR.GetName]"
 news.188.a:0 "L’influence de [ITA.GetNameDefCap] grandit."
 news.194.t:0 "La Pologne orientale a cédée à [From.GetNameDef]"
 news.194.d:0 "\nÀ travers d’obscures manœuvres politiques, la direction de [From.GetNameDef] a cédé ses régions orientales à [From.GetName]. \n\nOn ignore encore quelles promesses ou menaces ont été faites par [From.GetName] pour obtenir cette victoire politique. Nous ne le saurons peut-être jamais, car [Poland.GetLeader] n’a rien dit de plus que l’annonce de l’accord."
 news.194.a:0 "[From.GetNameDefCap] reconnaît la force de la [From.GetFactionName] !"
 news.194.b:0 "[From.GetNameDefCap] dévore tout sur son passage."
 news.194.c:0 "[POL.GetNameDefCap] n’a dû avoir aucun autre choix."
 news.195.t:0 "[From.GetNameDefCap] accorde l’Allemagne orientale"
 news.195.d:0 "À la suite de l’occupation de l’Allemagne par les [SOV.GetAdjective], [SOV.GetNameDef] s’est vu attribuer la majeure partie de l’Allemagne orientale, y compris le territoire contesté de l’Ostpreussen.\nIl semble que cela résulte d’une clause secrète du traité soviéto-polonais. La Pologne reçoit des terres allemandes en compensation de ce qu’elle a été forcée de céder aux [Soviet.GetName].\n\nLa Pologne a joué gros, et si beaucoup a été perdu, beaucoup a aussi été gagné."
 news.195.a:0 "[SOV.GetNameDefCap] honore ses traités."
 news.197.t:0 "[From.GetNameDefCap] cède face à l’ultimatum [Soviet.GetAdjective]"
 news.197.d:0 "[From.GetNameDefCap] a cédé face à un ultimatum [Soviet.GetAdjective], et a remis le contrôle des îles Égéennes à [Soviet.GetNameDef].\n\nAvec cela, [Soviet.GetNameDef] renforce sa présence en Méditerranée et s’affirme comme une puissance navale dans la région."
 news.198.d:0 "[From.GetName] a refusé les exigences d’un ultimatum [SOV.GetAdjective] qui leur a été adressé concernant les îles Égéennes. Alors que [SOV.GetNameDef] exerce une influence grandissante sur la région, [From.GetLeader] a proclamé que céder une seule île dans l’Égée se terminerait par la prise de toute la Méditerranée.\n\nL’ultimatum refusé, [From.GetName] est au bord de la guerre, et ne peut qu’attendre que [SOV.GetNameDef] presse la détente."
 news.199.t:0 "[bessarabia_ultimatum_victim.GetNameDefCap] cède la Bessarabie à [From.GetNameDef]"
 news.199.d:0 "\n\n[bessarabia_ultimatum_victim.GetNameDef] a été forcé de céder à un ultimatum de [78.controller.GetNameDef]. Les territoires de Bessarabie sont passés sous contrôle [From.GetAdjective], et l’État [bessarabia_ultimatum_victim.GetAdjective] se retrouve avec des frontières réduites.\n\nIl reste à voir comment [bessarabia_ultimatum_victim.GetAdjective] évitera de nouvelles pertes."
 news.199.c:0 "[bessarabia_ultimatum_victim.GetNameDefCap] est dans une position regrettable."
 news.204.d:0 "Compte tenu des exigences, cela semblait inévitable. \n\n[From.GetNameDefCap] serait forcé de céder Dantzig à l’Allemagne, et un plénipotentiaire polonais serait envoyé à Berlin pour négocier d’autres termes. [From.GetLeader] a rappelé les actions récentes de [GER.GetNameDef] en affirmant qu’il était évident que l’Allemagne ne se satisferait pas de Dantzig seul.\n\nLes forces allemandes et polonaises se préparent à la guerre, et des rapports de heurts à la frontière arrivent déjà. Une fois encore, la guerre revient en Europe."
 news.249.d:0 "Les politiciens [USA.GetAdjective] se sont réveillés ce matin face à une nouvelle inquiétante : [CAN.GetNameDef] et [MEX.GetNameDef] ont annoncé un nouveau pacte défensif, visant à « contrer et contenir les menaces immédiates pesant sur la souveraineté de nos deux pays ». La menace à peine voilée dissimule difficilement l’intention de gêner les efforts militaires de [USA.GetNameDef] sur le continent américain et peut-être au-delà.\n\nLes commentateurs politiques comparent la situation à celle de l’Europe avant la Grande Guerre : deux camps ayant tout à perdre, sans moyen d’apaiser les tensions. La question semble moins être de savoir qui menace le plus l’autre, mais plutôt lequel frappera le premier de manière préventive."
 news.254.d:0 "[AST.GetNameDefCap], affirmant son indépendance totale, a commencé à étendre son influence dans le Pacifique Sud. Dans ce cadre, le gouvernement [AST.GetAdjective] a exigé que tous les anciens États coloniaux d’Océanie soient placés sous son autorité.\n\nNaturellement réticents, les gouvernements [ENG.GetAdjective] et néo-zélandais ont d’abord opposé une résistance diplomatique. Cependant, n’ayant plus de base pour projeter l’autorité de l’Empire dans la région — un rôle auparavant rempli par l’Australie — il n’était qu’une question de temps avant que [AST.GetNameDef] ne présente un ultimatum soutenu par la force.\nLa Nouvelle-Zélande est désormais la province la plus orientale de [AST.GetNameDef]."
 ace_promoted.1.d:0 "Peu de gens prennent autant de risques que les courageux pilotes de l’aviation [Root.GetAdjective]. [From.GetNameDefCap] [From.GetSurname], un pilote expérimenté connu sous l’indicatif [From.GetCallsign], s’est distingué en [From.GetHerselfHimself] non seulement en revenant vivant de la récente mission au-dessus de [From.GetMissionRegion], mais aussi en survivant à d’importantes victoires dans de nombreux affrontements critiques.\n\nÉrigée en exemple éclatant du courage [Root.GetAdjective], la récente promotion de [From.GetName] a été largement médiatisée. Bien que la population voie la guerre davantage comme l’enfer que comme la gloire, beaucoup sont heureux de constater qu’il existe encore des héros à soutenir."
 ace_promoted.1.d_major:0 "Peu de gens prennent autant de risques que les courageux pilotes de l’aviation [Root.GetAdjective]. [From.GetNameDefCap] [From.GetSurname], un pilote expérimenté connu sous l’indicatif [From.GetCallsign], s’est distingué en [From.GetHerselfHimself] non seulement en revenant vivant, mais aussi en pilotant [From.GetHerHis] [From.GetWing] avec une immense maîtrise. Récemment, [From.GetName] était en mission au-dessus de [From.GetMissionRegion] et a joué un rôle déterminant dans la réussite de cet affrontement crucial.\n\nÉrigée en exemple éclatant du courage [Root.GetAdjective], la récente promotion de [From.GetName] a été largement médiatisée. Bien que la population voie la guerre davantage comme l’enfer que comme la gloire, beaucoup sont heureux de constater qu’il existe encore des héros à soutenir."
 ace_died.1.d:0 "Un des [From.Owner.GetNameDef] [From.GetAceType] les plus célèbres, [From.GetFullName], est tombé en flammes au cours d’une mission au-dessus de [From.GetMissionRegion]. Malheureusement, puisque [From.GetSheHe] était déjà une figure publique, la mort de [From.GetCallsign] est particulièrement démoralisante pour les nombreuses personnes qui admiraient [From.GetHerHim].\n\nBien que nous souhaiterions pouvoir cacher cet événement au peuple, l’absence de [From.GetName] dans les apparitions publiques aurait rapidement suscité des soupçons. En fin de compte, la mort de [From.GetHerHis] fait partie d’une légende qui, espérons-le, perdurera bien au-delà de nos problèmes actuels."
 ace_died.1.d_major:0 "Un des [From.Owner.GetNameDef] [From.GetAceType] les plus célèbres, [From.GetFullName], est tombé au combat. Les pilotes revenant de la mission ont signalé avoir vu [From.GetHerHis] [From.GetWingShort] tomber en flammes au-dessus de [From.GetMissionRegion] après avoir subi de lourds tirs ennemis. Malheureusement, puisque [From.GetSheHe] était déjà une figure publique, la mort de [From.GetCallsign] est particulièrement démoralisante pour les nombreuses personnes qui admiraient [From.GetHerHim].\n\nBien que nous souhaiterions pouvoir cacher cet événement au peuple, l’absence de [From.GetName] dans les apparitions publiques aurait rapidement suscité des soupçons. En fin de compte, la mort de [From.GetHerHis] fait partie d’une légende qui, espérons-le, perdurera bien au-delà de nos problèmes actuels."
 election.3.d:0 "La guerre qui se rapproche de nos frontières a influencé les prochaines élections, de nombreux électeurs craignant que [Root.GetNameDef] ne soit pas préparé à ce conflit ou à toute éventualité. Ils demandent que nous renforcions nos précautions et que nous préparions la nation à la guerre. Bien que la majorité soutienne encore [Root.GetRulingParty], nous risquons de les perdre au profit d’éléments plus radicaux si nous ne rassurons pas la population."
 election.4.d:1 "Un sentiment nationaliste agressif s’est développé dans [Root.GetNameDef], donnant naissance à plusieurs partis promouvant des idéaux fascistes : un État imposant son pouvoir par la force. L’un d’eux a particulièrement gagné du terrain lors des élections actuelles, entraînant des débats au sein de [Root.GetRulingParty] sur la nécessité ou non de coopérer avec eux pour former le gouvernement. Bien qu’ils rejettent ouvertement les idéaux démocratiques, le fait qu’ils participent aux élections leur confère une certaine légitimité et peut empêcher des actions violentes."
 election.5.d:0 "Le mouvement communiste dans [Root.GetNameDef], alimenté par le mécontentement général de la classe ouvrière et les tendances radicales des universitaires, a suffisamment grandi pour former plusieurs partis. Après que l’un d’eux ait obtenu un soutien considérable aux élections actuelles, les politiciens de [Root.GetRulingParty] ont commencé à débattre de la possibilité de solliciter leur soutien pour former un gouvernement. Bien qu’ils considèrent nos institutions démocratiques comme une tyrannie bourgeoise, ils semblent désireux de coopérer avec le gouvernement plutôt que de le renverser."
 election.6.d:0 "La politique dans [Root.GetNameDef] s’est radicalisée. Là où il y avait autrefois un large soutien pour les partis favorables aux idéaux démocratiques et aux institutions représentatives de [Root.GetNameDef], de plus en plus d’électeurs se tournent vers les extrêmes politiques. Les partis du centre, même s’ils mettent de côté leurs différences, ne forment plus la majorité. Pour éviter un gouvernement minoritaire faible, nous n’avons d’autre choix que de coopérer avec les fascistes ou les communistes."
 election.6.a:0 "Nous travaillerons avec les fascistes pour renforcer [Root.GetNameDef]."
 election.8.b:0 "Dans cette voie se trouve la dissolution même de [Root.GetNameDef]."
 election.11.a:0 "C’est un jour sombre pour [Root.GetNameDef], mais le peuple a parlé."
 election.13.b:0 "Nous ne pouvons pas compter sur les fascistes pour développer et protéger [Root.GetNameDef]."
 election.14.d:0 "[Root.GetNameDefCap] est en état de guerre. Normalement, une élection aurait lieu à cette période, mais étant au milieu d’un conflit important, beaucoup soutiennent que nous ne pouvons pas nous permettre de perdre du temps en campagnes politiques ou en changement de direction. D’autres affirment que déclarer la guerre en cours comme motif de suspension des élections est le premier pas vers l’érosion de la démocratie [Root.GetAdjective]. Après tout, laisser les affaires militaires primer sur l’influence du peuple est une pente glissante."
 election.15.d:0 "Avec l’élection à venir, les citoyens commencent à douter de la capacité de l’administration actuelle à poursuivre la guerre en cours. [Root.GetNameDefCap] a beaucoup souffert et l’opinion publique s’est retournée contre ceux qui semblent mener la nation à la défaite. Bien que le peuple soit déterminé à voir la guerre jusqu’au bout, il préférerait un autre gouvernement pour y mettre fin."
 political.1.d:0 "« Alors que les travailleurs se soulèvent contre leurs oppresseurs dans le monde, ceux qui prétendent avoir atteint la conscience de classe dans [Root.GetNameDef] restent inactifs et attendent que le changement vienne d’un système politique si corrompu, seule une révolution pourrait nous en sauver ! »\n\nTelles sont les paroles des nouvelles voix du mouvement communiste [Root.GetAdjective]. Qualifiant le gouvernement de [Root.GetRulingParty] de dictature bourgeoise, ils appellent à le renverser par tous les moyens nécessaires. Qu’ils viennent de l’intérieur ou de l’extérieur reste à voir."
 political.15.a:0 "Le mouvement semble croître naturellement en l’absence de répression."
 britain.8.d:0 "[From.GetNameDefCap] a rejeté notre demande qu’ils cessent de commercer avec l’Allemagne."
 germany.93.d:0 "Notre proposition pour une résolution pacifique du problème [SLV.GetAdjective] incluait une rencontre avec des représentants [ENG.GetAdjective], [FRA.GetAdjective] et [ITA.GetAdjective]. Et bien que [ITA.GetNameDef] ait été globalement favorable à l’apaisement de la rhétorique agressive et du régime oppressif du gouvernement [YUG.GetAdjective], il est devenu évident que les puissances victorieuses de la Grande Guerre ne partagent pas cette opinion sur la question. \n\nLes invitations envoyées à Paris et Londres ont été déchirées par les officiels des deux pays, déclarant que « L’intégrité de [YUG.GetNameDef] ne sera remise en question ni au sein de la Société des Nations, ni dans quelque discussion privée que ce soit, par qui que ce soit ! ». Les deux pays ont annoncé le retrait de leurs délégations de notre territoire, indiquant clairement que leurs responsables sont prêts à toute action que nous pourrions entreprendre pour obtenir le territoire demandé. \n\nD’importants mouvements de la flotte [ENG.GetAdjective] ont été repérés en haute mer, des avions de reconnaissance [FRA.GetAdjective] violent l’espace aérien de la Rhénanie et les garnisons des fortifications de la ligne Maginot semblent renforcées et prêtes pour ce qui ressemble à une attaque en tenaille contre nos bunkers de la ligne Sigfried. \n\nLa guerre approche, mais est‑ce vraiment une option dans de telles circonstances ?"
 germany.93.d_FRA_abandoned_yugoslavia:0 "La Conférence de Londres aurait pu être considérée comme un succès pour nos diplomates si un petit incident n’était pas survenu après le deuxième jour de négociations. Avec les responsables [FRA.GetAdjective] renonçant à leurs engagements de la Petite Entente avec [YUG.GetNameDef], la délégation [ENG.GetAdjective] a soulevé une question concernant la politique de défense des Balkans.\n\nLa dite politique, introduite dans leur dernière proposition à la Société des Nations, semble favoriser l’intégrité territoriale des Balkans sous la protection [ENG.GetAdjective]. Abandonnées par [FRA.GetNameDef], les autorités [YUG.GetAdjective] ont été plus que ravies de pouvoir compter sur un pacte de protection mutuelle récemment signé avec [ENG.GetNameDef].\n\nLes problèmes diplomatiques peuvent être facilement résolus par la force militaire, et nous devrons utiliser nos avantages avant que quelqu’un d’autre ne se proclame « Protecteur des Balkans »."
 germany.94.d:0 "Une excellente manœuvre diplomatique et une rhétorique pacifiste de notre délégation ont convaincu les principaux acteurs de la Conférence de Londres des Quatre que notre annexion de [AUS.GetNameDef] n’était qu’un geste de libre volonté entre nos deux pays. Notre agenda politique pour la réunification avec les territoires allemands légitimes de Carniola n’a fait que renforcer cette conviction. \n\nLes discussions se sont conclues ce matin avec [ENG.GetNameDef], [FRA.GetNameDef] et [ITA.GetNameDef], qui ont soutenu l’intégration pacifique de la partie allemande de la Slovénie dans [GER.GetNameDef]. \n\nLe gouvernement [YUG.GetAdjective] dirigé par [YUG.GetLeader] a protesté vigoureusement car il a été invité à la conférence seulement pour signer la nouvelle résolution. Les troupes [YUG.GetAdjective] ont déjà abandonné leurs fortifications frontalières et se sont retirées sur les territoires [CRO.GetAdjective]. \n\nDans un autre triomphe de l’audace et de l’action, la Slovénie, bientôt renommée Carniola, a été rendue à sa maison légitime dans [GER.GetNameDef]. Le peuple [SLV.GetAdjective] a acclamé nos troupes lors des célébrations organisées à Ljubljana et Maribor !"
 germany.94.a:0 "Intégrer ces états directement !"
 germany.94.b:0 "Nous protégerons la Slovénie dorénavant !"
 germany.95.t:0 "[YUG.GetNameDefCap] refuse"
 germany.95.d:0 "Nos espions en [YUG.GetNameDef] ont rapporté que les officiels du gouvernement ont reçu les résultats de la Conférence de Londres des Quatre ainsi que notre demande de céder la Slovénie la veille. Le problème [SLV.GetAdjective] devait être résolu sous 24 heures, car la désobéissance plongerait nos deux pays dans la guerre. \n\nDeux heures avant minuit, avant l’expiration de l’ultimatum, [YUG.GetLeader] a diffusé une émission d’urgence sur toutes les radios du pays déclarant que « [YUG.GetNameDefCap] est pleinement conscient des ambitions belliqueuses de [GER.GetNameDef] et ne tolérera pas une telle attitude agressive de la part des dirigeants [GER.GetAdjective] ». \n\nL’ordre de mobilisation générale a été émis à travers le pays et l’armée [YUG.GetAdjective] a reçu l’instruction claire de tirer à volonté. Quelques patrouilles frontalières ont déjà été attaquées alors qu’elles surveillaient la ligne de démarcation entre l’Autriche allemande [GER.GetAdjective] et la Slovénie [YUG.GetAdjective]. \n\nLes tensions montent alors que l’armée de l’air [YUG.GetAdjective] viole l’espace aérien [GER.GetAdjective] et que davantage de troupes [YUG.GetAdjective] renforcent les fortifications frontalières [SLV.GetAdjective]. \n\nLa guerre approche, mais sommes-nous prêts pour elle ?"
 germany.95.b:0 "Nous ne sommes pas des fauteurs de guerre, laissons-les tranquilles"
 germany.96.d:0 "Lors de la Conférence de Londres des Quatre, nos diplomates ont eu le plaisir de tenir des discussions amicales avec les délégations [ENG.GetAdjective] et [FRA.GetAdjective] alors que l’atmosphère semblait favorable à une solution pacifique du problème [SLV.GetAdjective]. \n\nLe troisième jour de la conférence, cependant, nos relations diplomatiques avec [ITA.GetNameDef] ont subi un revers sévère, car leur ministre des affaires étrangères a insulté notre délégation et a posé la question de « savoir si les ambitions balkaniques de [GER.GetNameDef] s’arrêteront en Slovénie ou continueront vers le Sud, menaçant l’intégrité territoriale de [ITA.GetNameDef] », plongeant la salle dans un silence complet. \n\nNos diplomates insultés ont quitté la conférence avec [ENG.GetAdjective] et [FRA.GetAdjective], car une telle provocation ne pouvait être tolérée par un pays respectable. \n\nComme prochaine manœuvre diplomatique, [ITA.GetNameDef] et [YUG.GetNameDef] ont signé un traité d’assistance mutuelle et ont délivré un ultimatum exigeant le retrait de nos troupes du Tyrol et la démilitarisation de l’Autriche allemande. \n\nL’attitude sans précédent des autorités [ITA.GetAdjective] ne peut être tolérée à aucun prix ! Notre état-major général nous assure que ces agaçants [ITA.GetAdjective] défient notre volonté pour la dernière fois."
 germany.97.d:0 "Notre intervention dans les affaires [YUG.GetAdjective] a été fortement contestée par les officiels [FRA.GetAdjective], qui ont invoqué les anciens accords de la Petite Entente avec les nations balkaniques comme pierre angulaire de leur politique de sécurité. \n\nLes officiels [ENG.GetAdjective] et [ITA.GetAdjective] ont déjà dénoncé la manœuvre diplomatique de [FRA.GetNameDef], la qualifiant de « … ambitions impériales comparables à celles de Charlemagne ou Napoléon ». \n\nLa conférence s’est brusquement terminée, car il est devenu évident que les autorités [FRA.GetAdjective] tentaient de gagner du temps pour que leur armée se renforce et se retranche sur la ligne Maginot, tout en menant des discussions avec l’état-major [YUG.GetAdjective] à notre insu pour une frappe simultanée dans les territoires industriels d’Autriche [GER.GetAdjective] et notre zone du Rhin. \n\nL’ordre de mobilisation générale est émis dans tout le pays et toutes les unités sont prêtes pour la tempête qui s’annonce en Europe. Croient-ils vraiment que leurs menaces vides nous impressionnent ?"
 germany.98.d:1 "Nous avons toujours su que l’État yougoslave, taillé dans l’Empire Habsbourg, était un pays artificiel destiné à ne jamais durer. Le ressentiment ethnique latent a explosé et l’État s’effondre. Nous devons intervenir pour rectifier la situation."
 germany.99.t:0 "Démembrer la Grèce"
 germany.99.d:0 "Avec notre influence croissante dans les Balkans, nous pourrions accorder à l’Italie certaines terres qu’elle revendique en Grèce sans déclencher de guerre."
 germany.99.a:0 "Nous devrions renforcer notre partenariat"
 germany.99.b:0 "Nous avons d’autres plans pour ces terres"
 germany.100.t:0 "Démembrer la Grèce"
 germany.101.t:0 "Démembrer la Grèce"
 germany.106.d_second_vienna_accepted_all:0 "Avec le gain de la Transylvanie par la Hongrie, la Bulgarie nous a rappelé leur vieux différend frontalier avec la Roumanie concernant la Dobroudja du Sud, saisie par la Roumanie en 1913."
 war_justification.1.t:0 "[Root.GetLeader] s’exprime contre [From.GetNameDef]"
 war_justification.1.d:0 "« [From.GetNameDef] appartient-elle aux [From.GetAdjective] ? Posons-nous plutôt une meilleure question : l’avenir appartient-il aux [From.GetAdjective] ou à [ROOT.GetNameDef] ? »\n\nLe discours de [ROOT.GetLeader] aujourd’hui suggère que [ROOT.GetName] se dirige vers la guerre. Les tensions politiques se sont accumulées au cours du dernier mois et il semble que le peuple [ROOT.GetAdjective] accepte que la guerre soit inévitable."
 war_justification.1.a:0 "L’avenir appartient à [Root.GetNameDef] !"
 war_justification.2.a:0 "[Root.GetNameDefCap] reste uni sous [Root.GetLeader]."
 war_justification.4.t:0 "[Root.GetNameDefCap] se prépare à une grande lutte"
 war_justification.5.t:0 "[ROOT.GetLeader] apporte la révolution à [From.GetNameDefCap]"
 war_justification.5.d:0 "« Alors que nous avons consolidé la société socialiste en [ROOT.GetNameDefCap], de nombreuses nations souffrent encore sous les despotes d’autrefois. Les travailleurs de [From.GetNameDefCap] n’ont ni voix, ni moyens de s’organiser, et toute tentative d’instaurer le socialisme serait sauvagement écrasée par le régime de [From.GetLeader]. Nous ne pouvons pas attendre que les rouages de la révolution internationale tournent pour le peuple [From.GetAdjective]. Avec la révolution, nous avons prouvé que nous pouvions écraser les oppresseurs capitalistes ici, et nous écraserons aussi les oppresseurs à [From.Capital.GetNameDefCap] ! »\n\n[ROOT.GetLeader] a abandonné toute tentative de rhétorique diplomatique envers le [From.GetRulingParty] qui contrôle [From.GetNameDefCap]. La quête d’éradiquer toutes les frontières se concentre désormais strictement sur l’éradication de leurs frontières."
 war_justification.8.d:0 "« Y a‑t‑il une société plus répugnante pour l’avenir de la révolution, plus étrangère à la condition du travailleur, que le régime fasciste de [From.GetNameDef] ? En appelant le peuple à se consacrer fanatiquement à l’institution décrépite de l’État‑nation, ils ont habillé de vieilles formes de barbarie d’un costume moderne, essayant de se présenter comme un avenir alternatif à la victoire internationale inévitable de la classe ouvrière. Ce n’est qu’une question de temps avant qu’ils ne frappent contre nous ou nos alliés. Frappons les premiers. »\n\nPersonne n’attendait moins qu’un mépris mutuel entre nous et les [From.GetAdjective], mais l’animosité s’est intensifiée récemment. Il semble désormais que le conflit surgira plutôt tôt que tard."
 war_justification.9.t:0 "La Diplomatie avec [From.GetNameDef] S’effondre"
 war_justification.9.d:0 "« Malgré nos tentatives de trouver une solution diplomatique à notre conflit avec [From.GetNameDef], les négociations se sont une nouvelle fois effondrées, nous laissant des options limitées. Le régime autoritaire de [From.GetLeader] a affiché l’approche déraisonnable typique des dirigeants qui ne rendent de comptes à personne. À moins d’un revirement total dans les politiques de la direction [From.GetAdjective], nous n’aurons d’autre choix que de nous battre. »\n\nL’intervention [ROOT.GetAdjective] en [From.GetName] a été un sujet brûlant, certains politiciens de l’opposition affirmant que le [ROOT.GetRulingParty] a adopté une politique belliciste dès le départ. Quelle que soit leur intention initiale, une future guerre semble désormais très réelle et inévitable."
 war_justification.10.t:0 "[ROOT.GetLeader] Appelle à une Intervention en [From.GetNameDef]"
 war_justification.10.d:0 "« C’est le cœur lourd que nous devons affronter la réalité de notre situation : une invasion de [From.GetNameDef] peut être notre seule solution. L’avantage stratégique est trop grand pour envisager une autre option. Bien que nous croyions que ni le peuple [ROOT.GetAdjective] ni le peuple [From.GetAdjective] ne souhaite la guerre, l’histoire nous a menés à ce point et nos options sont limitées. Nous ne pouvons qu’espérer qu’en affirmant notre puissance militaire, nous éviterons davantage d’effusion de sang. »\n\nBien qu’une théorie populaire affirme que les démocraties ne se font pas la guerre entre elles, les développements récents semblent indiquer une future invasion [ROOT.GetAdjective] de [From.GetNameDef]. L’histoire pourrait encore nous surprendre."
 war_justification.10.a:0 "[From.GetNameDef] est une démocratie douteuse de toute façon."
 war_justification.11.d:0 "« Sans aucun doute, le communisme de [From.GetNameDef] est l’une des plus grandes menaces pour la liberté et l’ordre à notre époque. Implacable et impitoyable, il menace de dévorer non seulement l’espoir du peuple [From.GetAdjective] d’une société prospère et démocratique, mais aussi celui de ses voisins. Si nous n’agissons pas maintenant, nous verrons peut‑être ce premier domino tomber trop tard, entraînant d’autres expériences sociales ratées dans son sillage. Combien doivent encore mourir avant que nous intervenions ? »\n\nLa menace d’activités subversives sapant notre démocratie, alimentée par les ambitions [From.GetAdjective], est récemment devenue un sujet très débattu. Alors que les représentants de l’opposition qualifient cela de peur rouge visant à justifier une guerre contre [From.GetNameDef], la rhétorique du [ROOT.GetRulingParty] a été très efficace jusqu’ici."
 war_justification.12.d:0 "« Dans l’histoire moderne, peut‑être même dans toute l’histoire, il n’y a pas eu de tyrannie pire que la poigne de fer dans laquelle le [From.GetRulingParty] tient désormais [From.GetNameDef]. Certains diront que nous ne devrions pas provoquer le conflit, que nous devrions faire confiance à [From.GetLeader] pour respecter ses traités et promesses, mais ces gens ne voient pas que les traités signés sous un régime fasciste sont inutiles. Pour ces menteurs déshonorants, seul le pouvoir compte, et le papier sur lequel un accord est écrit brûle aussi facilement que les livres de leurs détracteurs. »\n\nLes personnes ayant longtemps espéré éviter une confrontation directe avec [From.GetName] s’opposent désormais fortement à [ROOT.GetLeader], qui affirme qu’en termes machiavéliques, nous ne faisons que reporter la guerre à l’avantage de l’ennemi. À ce rythme, nous pourrions frapper les premiers."
 war_justification.13.t:0 "[ROOT.GetLeader] Appelle à la Guerre Contre [From.GetNameDef]"
 war_justification.14.d:0 "« [From.GetNameDef] peut se croire plus moderne et avancé que nous, mais la vérité est que leur nation n’a pas été mise à l’épreuve comme la nôtre, ni préparée aux menaces qui se profilent clairement à l’horizon. Par leur mépris envers nous, et en nous empêchant de saisir ce qui nous revient de droit, ils ont fait de nous une menace pour eux. Leur nation faible et divisée résistera à peine à nos revendications. »\n\nL’opinion méprisante envers [From.GetNameDef] longtemps cultivée par le [ROOT.GetRulingParty] est passée de la critique à l’hostilité. Bien que l’opinion populaire soit que le peuple [From.GetAdjective] souhaite éviter la guerre, [ROOT.GetLeader] affirme que leurs dirigeants élus l’ont provoquée par arrogance."
 war_justification.15.t:0 "[ROOT.GetLeader] Veut Rétablir l’Ordre en [From.GetNameDef]"
 war_justification.15.d:0 "« Le sentiment national [ROOT.GetAdjective] est fort, mais toutes les nations n’ont pas cette chance. [From.GetName] a vu ses traditions détruites et ses dirigeants légitimes assassinés et enterrés depuis longtemps, tout cela au nom de l’idée de la grande révolution marxiste. C’est notre devoir de rétablir l’ordre dans ce monde égaré par des usurpateurs sanguinaires et d’affirmer la force de [ROOT.GetNameDef] contre cette menace. »\n\nAlors que le [ROOT.GetRulingParty] s’est toujours opposé au communisme, [From.GetNameDef] a été une cible particulièrement attaquée dans les discours récents. Que l’attaque des communistes contre la nation [ROOT.GetAdjective] soit une menace réelle ou non, l’attaque préventive contre le communisme [From.GetAdjective] est déjà en préparation."
 war_justification.16.d:0 "« Mes opposants voudraient vous faire croire que mon règne est semblable à celui du [From.GetRulingParty] en [From.GetNameDef]. Ils ne pourraient pas avoir plus tort. Alors que les succès de [From.GetLeader] résultent d’une mode récente, un mouvement destructeur visant à intimider d’autres nations, le [ROOT.GetRulingParty] s’y oppose comme ceux qui ne se soumettront pas. Je suis prêt à faire tout ce qui est nécessaire pour éliminer cette menace, même si cela signifie la guerre. »\n\nLe régime de [ROOT.GetLeader] a adopté une politique hostile envers la nation [From.GetAdjective]. Quels que soient les noms donnés à nos dirigeants, « fasciste » est un terme réservé à nos ennemis."
 war_justification.17.d:0 "« Qui détermine les frontières d’une nation et comment sont‑elles déterminées ? Quelles que soient les justifications trouvées par le passé pour déterminer où finit [ROOT.GetNameDef] et où commence [From.GetNameDef], nous vivons dans une nouvelle ère. L’importance stratégique de cette frontière ne peut être exagérée, et nous sommes dans notre droit de la déplacer pour garantir la sécurité de notre peuple. »\n\nEn écoutant les discours récents de [ROOT.GetLeader], une invasion de [From.GetNameDef] semble imminente. Des voix dissidentes s’y opposent, mais le soutien populaire à la guerre augmente."
 war_justification.18.t:0 "[ROOT.GetLeader] Remet en Question les Intentions de [From.GetNameDef]"
 war_justification.18.d:0 "« Il ne fait aucun doute que [From.GetNameDef] se prépare à la guerre. Les changements dans la politique économique montrent clairement que les [From.GetAdjective] ne sont pas un peuple de paix, mais plutôt en attente de l’opportunité de frapper contre nous. Allons‑nous rester les bras croisés en les regardant s’armer tandis que [ROOT.GetName] reste sans défense ? Ou désarmerons‑nous cette menace avant qu’elle ne dépasse notre pouvoir ? »\n\nLes faucons du [ROOT.GetRulingParty] ont tourné leurs yeux vers [From.GetName], arguant que l’attaque est la meilleure défense. Leur point de vue gagne du terrain et [ROOT.GetName] se prépare à la guerre."
 war_justification.19.d:0 "« Ces citoyens naïfs de [ROOT.GetNameDef] qui imaginent les [From.GetAdjective] comme un peuple de paix sont complètement déconnectés de la réalité. Ceux qui vivent à notre frontière n’ont pas le luxe de telles illusions, voyant leurs troupes se masser juste de l’autre côté. C’est une menace à laquelle nous ne pouvons pas ne pas répondre. Chaque jour, [From.GetName] se prépare à la guerre. Ce serait de la folie de ne pas faire de même. »\n\nLa présence militaire [From.GetAdjective] proche de notre territoire a suscité des inquiétudes croissantes, car cette nation semble de plus en plus être l’ennemi du [ROOT.GetRulingParty]. Qu’il s’agisse de la cause ou de la conséquence de leur rhétorique reste sujet à débat."
 war_justification.20.t:0 "[ROOT.GetLeader] Prône l’invasion de [From.GetNameDef]"
 war_justification.20.d:0 "« Si nous voulons avoir l’avantage stratégique dans la guerre prévisible — pour ne pas dire inévitable — avec [From.GetNameDef], nous n’avons aucune marge pour hésiter. Il s’agit de protéger l’avenir de nos enfants et d’assurer que [ROOT.GetName] ait une place dans le monde de demain. C’est une question de dévotion à notre cause et aux idéaux que nous tenons pour acquis. Il est temps d’agir. »\n\nUne série de discours enflammés des dirigeants du [ROOT.GetRulingParty], notamment de [ROOT.GetLeader], appelle le public à soutenir une invasion de [From.GetName]. Les motivations géopolitiques derrière l’invasion sont moins mises en avant que les sentiments patriotiques, mais cette campagne semble extrêmement efficace pour convaincre le public de sa nécessité."
 war_justification.201.t:0 "[From.GetLeader] S’exprime contre [ROOT.GetNameDef]"
 war_justification.201.d:1 "« Le [ROOT.GetNameDef] appartient‑il aux [ROOT.GetAdjective] ? Posons-nous plutôt une meilleure question : l’avenir appartient‑il aux [ROOT.GetAdjective] ou appartient‑il à [From.GetName] ? »\n\nLe discours de [From.GetLeader] aujourd’hui suggère que [From.GetName] est sur la voie de la guerre. Les tensions politiques ont augmenté au cours du dernier mois et il semble que le peuple [From.GetAdjective] ait accepté que la guerre soit inévitable. [ROOT.GetName] doit également se préparer."
 war_justification.204.t:0 "[From.GetNameDefCap] Se Prépare à la Grande Lutte"
 war_justification.205.t:0 "[From.GetLeader] Apporte la Révolution à [ROOT.GetNameDef]"
 war_justification.205.d:0 "« Alors que nous avons consolidé la société socialiste à [From.GetNameDef], de nombreuses nations souffrent encore sous les despotes d’autrefois. Les travailleurs de [ROOT.GetNameDef] n’ont ni voix, ni moyens de s’organiser, et toute tentative d’instaurer le socialisme serait sauvagement écrasée par le régime de [ROOT.GetLeader]. Nous ne pouvons pas attendre que les rouages de la révolution internationale tournent pour le peuple [ROOT.GetAdjective]. Nous avons prouvé que nous pouvions écraser les oppresseurs capitalistes ici, et nous écraserons également les oppresseurs à [ROOT.Capital.GetName] ! »\n\n[From.GetLeader] a abandonné toute tentative de diplomatie avec notre gouvernement. La tâche communiste d’éradiquer toutes les frontières se concentre désormais strictement sur l’éradication de nos frontières."
 war_justification.208.d:0 "« Existe‑t‑il une société plus répugnante pour l’avenir de la révolution, plus étrangère à la condition des travailleurs, que le régime fasciste de [ROOT.GetNameDef] ? En appelant le peuple à se consacrer fanatiquement à l’institution décrépite de l’État‑nation, ils ont habillé de vieilles formes de sauvagerie d’un costume moderne, essayant de se présenter comme une alternative à l’inévitable victoire internationale de la classe ouvrière. Ce n’est qu’une question de temps avant qu’ils ne frappent contre nous ou nos alliés. Frappions les premiers. »\n\nPersonne ne s’attendait à autre chose qu’un mépris mutuel entre nous et les [ROOT.GetAdjective], mais l’animosité s’est intensifiée récemment. En entendant [From.GetLeader], il semble que le conflit surgira tôt ou tard."
 war_justification.209.t:0 "La Diplomatie avec [ROOT.GetNameDef] S’effondre"
 war_justification.209.d:0 "«Malgré nos tentatives de trouver une solution diplomatique à notre conflit avec [ROOT.GetNameDef], les négociations se sont une fois de plus effondrées, nous laissant avec des options limitées. Le régime autoritaire de [ROOT.GetLeader] a montré l’approche déraisonnable typique des dirigeants qui ne rendent pas de comptes à leur peuple. À moins d’un retournement complet dans les politiques du leadership [ROOT.GetAdjective], nous n’aurons d’autre recours que de nous battre.»\n\nL’intervention [From.GetAdjective] dans nos affaires intérieures a été un sujet brûlant, certains politiciens de l’opposition affirmant que [From.GetRulingParty] a suivi une politique belliciste dès le départ. Quelle que soit leur intention initiale, une guerre future semble soudain très réelle et inévitable."
 war_justification.210.t:0 "[From.GetLeader] Appels à intervention dans [ROOT.GetNameDef]"
 war_justification.210.d:0 "«C’est le cœur lourd que nous devons affronter la réalité de notre situation : une invasion de [ROOT.GetNameDef] peut être notre seul recours. C’est un avantage stratégique trop important pour tenter toute autre solution dans notre situation actuelle. Bien que nous ayons confiance que ni les [From.GetAdjective] ni les [ROOT.GetAdjective] ne souhaitent la guerre, l’histoire nous a menés à ce point et nos options sont limitées. Nous ne pouvons qu’espérer qu’à travers cette affirmation de notre puissance militaire, nous pourrons éviter de nouveaux effusions de sang à l’avenir.»\n\nBien qu’il soit populaire de penser que les démocraties ne se font pas la guerre entre elles, les développements récents semblent indiquer une future invasion [From.GetAdjective] de [ROOT.GetName]. L’histoire peut encore nous surprendre."
 war_justification.210.a:0 "[From.GetNameDef] est de toute façon une démocratie douteuse, poursuivant de telles actions agressives."
 war_justification.211.d:0 "«Sans aucun doute, le communisme [ROOT.GetNameDef] est l’une des plus grandes menaces pour la liberté et l’ordre de cette époque. Implacable et impitoyable, il menace de dévorer non seulement l’espoir du peuple [ROOT.GetAdjective] d’une société prospère et démocratique, mais aussi celui de ses voisins. Si nous n’agissons pas maintenant, nous pourrions voir ce premier domino tomber trop tard, laissant derrière lui d’autres expériences sociales ratées. Combien doivent encore mourir avant que nous intervenions ?»\n\nLe mouvement ouvrier naissant a intimidé les dirigeants [From.GetAdjective]. Tandis que des représentants de leur opposition qualifient cela de “panique rouge” destinée à justifier une guerre contre nous, la rhétorique du [From.GetRulingParty] a jusqu’ici rencontré un franc succès."
 war_justification.212.d:0 "«Dans l’histoire moderne, peut-être même dans l’histoire tout court, il n’y a pas eu de pire tyrannie que la poigne de fer avec laquelle [ROOT.GetRulingParty] tient désormais [ROOT.GetNameDef]. Certains affirment que nous ne devrions pas provoquer un conflit, que nous devrions faire confiance à [ROOT.GetLeader] pour respecter les traités et promesses à l’avenir, mais ces gens ne voient pas que les traités signés sous le règne du fascisme sont inutiles. Pour ces menteurs déshonorés, la force fait le droit, et le papier sur lequel un accord est écrit brûle aussi facilement que les livres de leurs détracteurs.»\n\nJaloux de la société glorieuse que nous construisons et de l’héritage sur lequel elle repose, les [From.GetAdjective] semblent prêts à déclencher une guerre pour la détruire. Tant pis pour leurs prétentions de paix."
 war_justification.213.t:0 "[From.GetLeader] Appelle à la Guerre contre [ROOT.GetNameDef]"
 war_justification.214.d:0 "«[ROOT.GetNameDefCap] peut penser être plus moderne et avancé que nous, mais la vérité est que leur nation n’a pas été mise à l’épreuve comme la nôtre, ni préparée aux menaces désormais visibles à l’horizon. Par leur mépris envers nous, et en nous empêchant de saisir ce qui nous revient de droit, ils ont fait de nous l’une de ces menaces pour eux-mêmes. Leur nation faible et divisée résistera à peine à nos revendications.»\n\nL’opinion méprisante du [ROOT.GetName] depuis longtemps entretenue par le [From.GetRulingParty] est passée de la critique à l’hostilité. Bien que l’opinion publique pense que le peuple [ROOT.GetAdjective] veut éviter la guerre, [From.GetLeader] affirme que nos dirigeants élus l’ont provoquée par leur arrogance."
 war_justification.215.t:0 "[From.GetLeader] Veut Restaurer l’Ordre dans [ROOT.GetNameDef]"
 war_justification.215.d:0 "«L’esprit national [From.GetAdjective] est fort, mais toutes les nations ne sont pas aussi chanceuses. [ROOT.GetNameDefCap] a vu ses traditions détruites et ses dirigeants légitimes assassinés puis enterrés depuis longtemps, tout cela au nom de la grande révolution marxiste. Il est de notre devoir de restaurer l’ordre dans ce monde égaré par des usurpateurs assoiffés de sang et d’affirmer la force de [From.GetName] face à cette menace.»\n\nTandis que le [From.GetRulingParty] s’est toujours opposé au communisme, [ROOT.GetName] a été une cible particulièrement attaquée dans les discours récents. Craignant le progrès inévitable de leur nation vers la prochaine étape de l’histoire, une attaque préventive contre le communisme [ROOT.GetAdjective] est déjà en préparation."
 war_justification.216.d:0 "«Mes opposants voudraient vous faire croire que mon règne est semblable à celui du [ROOT.GetRulingParty] à [ROOT.GetNameDef]. Ils ne pourraient pas être plus dans l’erreur. Tandis que les succès de [ROOT.GetLeader] sont le résultat d’une mode récente, un mouvement de masse destructeur visant à intimider les autres nations, le [From.GetRulingParty] se tient en opposition à ce mouvement en tant que ceux qui ne se soumettront pas. Je suis prêt à faire tout ce qui est nécessaire pour éliminer cette menace, même si cela signifie la guerre.»\n\nLe régime de [From.GetLeader] a adopté une politique hostile envers la nation [ROOT.GetAdjective]. Nos plans visionnaires pour une grandeur future ont ridiculisé leur nation, et sans surprise, ils se sentent menacés."
 war_justification.217.d:0 "«Qui détermine les frontières d’une nation et comment sont-elles déterminées ? Quelle que soit la manière dont les gens ont justifié autrefois où [From.GetNameDef] s’arrête et où [ROOT.GetName] commence, nous vivons dans une nouvelle ère. L’importance stratégique de cette frontière ne peut être exagérée, et nous sommes pleinement dans notre droit de la déplacer pour garantir la sécurité continue de notre peuple.»\n\nEn écoutant les récents discours de [From.GetLeader], une invasion de [ROOT.GetName] semble imminente. Des voix dissidentes se sont opposées, mais le soutien public à la guerre ne cesse de croître."
 war_justification.218.t:0 "[From.GetLeader] Met en Question les Motivations de [ROOT.GetNameDef]"
 war_justification.218.d:0 "«Il ne fait aucun doute que [ROOT.GetNameDef] se prépare à la guerre. Les changements dans leur politique économique montrent clairement que les [ROOT.GetAdjective] ne sont pas un peuple de paix, mais plutôt qu’ils attendent la bonne occasion pour nous frapper. Allons-nous rester les bras croisés et les regarder s’armer pendant que [From.GetName] reste sans défense ? Ou allons-nous désarmer cette menace avant qu’elle ne grandisse au-delà de notre pouvoir ?»\n\nLes faucons du [From.GetRulingParty] ont tourné leurs yeux vers [ROOT.GetName], arguant que l’attaque est la meilleure défense. Leur point de vue gagne en traction, et [From.GetName] se prépare à la guerre."
 war_justification.219.d:0 "«Ces citoyens naïfs de [From.GetNameDef] qui imaginent les [ROOT.GetAdjective] comme un peuple de paix sont complètement déconnectés de la réalité. Ceux qui vivent à notre frontière n’ont pas le luxe de telles illusions, voyant leurs troupes se rapprocher de nous juste de l’autre côté. C’est une menace que nous ne pouvons pas laisser sans réponse. Chaque jour qui passe, [ROOT.GetName] se prépare à la guerre. Ce serait de la folie de ne pas faire de même.»\n\nNotre présence militaire près du territoire [From.GetAdjective] a provoqué une inquiétude accrue, car ils interprètent nos mouvements de troupes comme la preuve d’une intention hostile. Ils semblent à peine considérer que leur rhétorique agressive est la raison de nos mesures défensives."
 war_justification.220.t:0 "[From.GetLeader] préconise l'invasion de [ROOT.GetNameDef]"
 war_justification.220.d:0 "«Si nous voulons avoir l’avantage stratégique dans la guerre prévisible, pour ne pas dire inévitable, avec [ROOT.GetNameDef], il n’y a pas de place pour hésiter. Il s’agit de protéger l’avenir de nos enfants et de garantir que [From.GetName] ait une place dans le monde de demain. C’est une question de dévouement à notre cause et aux idéaux que nous tenons pour acquis. Il est temps d’agir.»\n\nUne série de discours enflammés des dirigeants de [From.GetRulingParty], en particulier [From.GetLeader], a appelé le public à soutenir une invasion de [ROOT.GetName]. Les motifs géopolitiques derrière l’invasion sont moins présents dans la rhétorique que les sentiments patriotiques, mais cette campagne semble très efficace pour convaincre le public de sa nécessité."
 nuke_dropped.1.d: "Pour la première et, espérons-le, dernière fois dans l’histoire, une bombe nucléaire a été déclenchée dans [From.From.GetNameDef] dans le cadre d’une guerre internationale menée par [?global.nukecountry.GetNameDef]. La destruction sans précédent témoigne du pouvoir dévastateur de cette nouvelle arme, redoutée non seulement pour ce qu’elle peut infliger à ses cibles, mais aussi pour ses implications pour celui qui la déploie et pour l’humanité elle-même.\n\nLe monde retient son souffle en attendant ce qui va suivre. Cette force forcera-t-elle [From.From.Owner.GetNameDef] à se rendre pour éviter un nouveau terrorisme, ou renforcera-t-elle seulement leur détermination à riposter contre ceux qui recourraient à de telles mesures ?"
 poland.10.t:0 "[From.GetNameDefCap] Rejoint le [Root.GetFactionName] !"
 poland.10.a:0 "[Root.GetNameDefCap] et [From.GetNameDef] sont aujourd’hui frères."
 poland.11.t:0 "[From.GetNameDefCap] Refuse de Rejoindre [Root.GetFactionName]"
 generic.1.t:0 "[From.GetNameDefCap] Influence Notre Politique"
 country_capitulated.0.t:0 "[Root.GetNameDefCap] a capitulé"
 country_capitulated.0.d_positive_collab_diff_ideology:0 "\n[Root.GetNameDefCap] a annoncé sa reddition totale à [From.From.GetNameDef]. Les forces [From.From.GetAdjective], avec un certain nombre de partisans indépendants [Root.GetAdjective] [From.From.GetRulingIdeology], ont contraint [Root.GetLeader] et son gouvernement à l’exil alors qu’un nouveau gouvernement a été établi pour gouverner [Root.GetNameDef] en coopération avec [From.From.GetNameDef]. [From.From.GetLeader] a déclaré que cet accord mutuel apporterait un nouvel âge de prospérité et de coopération à [Root.GetNameDef].\n[Root.GetLeader] a répondu en déclarant que même en exil, il continuerait à se battre pour [Root.GetNameDef] et à soutenir tous les efforts de résistance dans sa patrie."
 country_capitulated.0.d_positive_collab_invaded_same_ideology:0 "\n[Root.GetNameDefCap] a annoncé sa reddition totale à [From.From.GetNameDef]. Un certain nombre de citoyens [Root.GetAdjective] insatisfaits de la marque de [From.From.GetRulingIdeologyNoun] apportée à [Root.GetNameDef] par [Root.GetLeader] ont rejoint les soldats [From.From.GetAdjective] pour le destituer et former un nouveau gouvernement sous la direction de [From.From.GetNameDef]. [From.From.GetLeader] a déclaré que cet accord mutuel apporterait un nouvel âge de prospérité et de coopération à [From.From.GetNameDef]\n[Root.GetLeader] a répondu que [From.From.GetLeader] n’est pas un vrai [From.From.GetRulingIdeology] et qu’il continuerait même en exil à se battre pour [Root.GetNameDef] et à soutenir tous les efforts de résistance dans sa patrie."
 country_capitulated.0.d_negative_collab_diff_ideology:0 "\n[Root.GetNameDefCap] a annoncé sa reddition totale à [From.From.GetNameDef]. Il est évident que la clémence du gouvernement [Root.GetAdjective] envers les sympathisants domestiques [From.From.GetRulingIdeology] a été un facteur contribuant à la chute de [Root.GetName] alors que [Root.GetFascistLeader] a été porté au pouvoir pour diriger le pays au nom du régime de [From.From.GetLeader].\n[Root.GetLeader] affirme que ce n’est pas la fin de la souveraineté [Root.GetAdjective], et que le gouvernement soutiendra tous les efforts de résistance même exilé de sa patrie."
 generic.5.factionleader:0 "le [FROM.GetFactionName]"
 generic.5.notinfaction:0 "leur faction"
 generic.5.t:0 "[From.GetNameDefCap] invite [Root.GetNameDef] à [r56_generic5_faction]"
 news.296.a:0 "La démocratie prévaut !"
 news.301.t:0 "La Transylvanie Rendue à [155.Owner.GetName]"
 news.301.desc:0 "\nLa Roumanie a annoncé qu’elle accepterait les demandes de [155.Owner.GetName] pour le retour de la Transylvanie. En conséquence, le territoire a maintenant été réuni au pays, augmentant considérablement sa taille et sa force. Il est peu probable qu’un succès de cette ampleur dissuade les [155.owner.GetAdjective] de formuler d’autres demandes pour leurs territoires perdus restants."
 news.302.t:0 "La Roumanie Rejette les Demandes de [155.Owner.GetNameDef]"
 news.302.desc:0 "La date limite de l’ultimatum est passée sans réponse de la Roumanie. Les responsables [155.Owner.GetName] outrés ont déjà dénoncé le gouvernement roumain, affirmant qu’il « déstabilise la région » en insistant pour respecter des « traités illégaux ». Les deux nations semblent se préparer à une guerre qui pourrait éclater à tout moment."
 news.310.t:0 "[From.GetNameDefCap] Cède à la Hongrie"
 news.320.e:0 "La guerre arrive-t-elle ?"
 stability.38.desc:0 "«Ils l’ont conduit au mur à l’aube. Il a refusé une dernière cigarette, mais a accepté le bandeau. Ses derniers mots furent des excuses à sa mère pour lui avoir causé tant de douleur. Le peloton d’exécution a bien visé. Quelques minutes plus tard, le médecin présent l’a déclaré mort.»\n\nBien que les autorités n’aient pas pu attraper toutes les personnes ayant échappé à la conscription, elles ont pu procéder à plusieurs arrestations. Étant donné la gravité de la situation, le War Office a décidé que ces hommes soient jugés en vertu de la loi militaire pour ne pas s’être présentés au service. La première série de condamnations à mort a été prononcée et les condamnés ont été exécutés par peloton d’exécution. Ces mesures ont visiblement eu l’effet escompté. Il semble que la plupart des gens aient choisi la possibilité de mourir au combat plutôt que la certitude d’une mort déshonorante en tant que lâche."
 strikes_event.7.desc:0 "Les troupes assemblées à l’extérieur des villes pendant la nuit, respectant la discipline de bruit et de lumière pour conserver l’effet de surprise. Au lever du soleil, les travailleurs aux barricades des usines attendaient le relai du jour, et les colonnes d’assaut avancèrent. Les travailleurs fatigués furent lents à organiser la résistance et furent rapidement submergés. Laissant un petit détachement pour garder les prisonniers, les troupes balayèrent la ville, arrêtant tous les travailleurs inscrits sur les listes. À midi, l’armée avait pris le contrôle complet des villes et instauré un couvre-feu. Aucune résistance supplémentaire n’est attendue. La majorité des travailleurs sera bientôt libérée à condition de retourner au travail, les meneurs seront détenus et jugés. Des peines de mort sont prévues."
 strikes_event.8.desc:0 "Les troupes assemblées à l’extérieur des villes pendant la nuit, mais une mauvaise discipline de lumière et de bruit trahit la surprise. À mesure que les troupes avançaient, elles trouvèrent les travailleurs alertes et prêts pour elles. La première attaque échoua sous une pluie de pierres. Une deuxième attaque à la baïonnette fut repoussée dans des combats rapprochés brutaux, laissant des dizaines de morts et de blessés dans les rues.\n\nLes officiers en charge se sont repliés pour consolider leurs forces, tandis que les travailleurs étendaient leurs fortifications et s’armaient des armes laissées par la retraite. Un deuxième jour de combats est attendu demain, mais le Haut Commandement militaire ne croit plus à la victoire probable."
 mutiny_event.2.desc:0 "Les tentatives d’intimider les mutins ont échoué spectaculairement car les troupes montraient peu de crainte des unités envoyées pour les réprimer. Utilisant des compétences acquises sur le front, ils organisèrent rapidement une défense de leurs positions rendant toute tentative de défaite très coûteuse. \n\nLes officiers des unités loyalistes se sont repliés en attendant de nouveaux ordres, mais ce petit succès a sans doute renforcé la détermination des mutins."
 mutiny_event.5.desc:0 "Alors que le War Office fait de son mieux pour empêcher que la mutinerie actuelle dans l’armée ne devienne largement connue, censurer les lettres ne suffit pas. Les soldats en congé répandent rapidement que l’armée ne veut plus saigner inutilement dans cette guerre.\n\nLes tentatives du gouvernement pour contenir la situation ont complètement échoué. Les rapports de la police secrète indiquent que les mutins ont un fort soutien dans l’opinion publique, rendant peu probable que nous puissions les isoler et les réprimer."
 news.334.a:0 "Est-ce que [JAP.GetNameDef] n’a aucune limite ?]"
 generic.19.t:0 "[From.GetNameDefCap] Envoie un Soutien Industriel"
 usa.401.desc:0 "Le Premier ministre britannique [From.GetLeader] a signalé son acceptation des termes de l’accord Destroyers for Bases. Un groupe d’officiers navals [From.GetAdjective] est arrivé pour inspecter les destroyers et superviser le transfert.\n\nIl reste manifestement du travail à faire car plusieurs officiers [From.GetAdjective] semblent un peu préoccupés par la quantité et l’épaisseur de guano et de rouille sur les navires à transférer."
 bftb_turkey.134.j:0 "İsmet İnönü continuera là où Atatürk s’est arrêté !"
 bftb_turkey.24.k:0 "İsmet İnönü continuera là où Atatürk s’est arrêté !"
 turkey.1.b:0 "Par la force, le Maréchal Çakmak conduira la république vers l’avant !"
 bftb_turkey.24.l:0 "Par la force, le Maréchal Çakmak conduira la république vers l’avant !"
 bftb_turkey.134.k:0 "Par la force, le Maréchal Çakmak conduira la république vers l’avant !"
 nsb_news.301.t:0 "Unification du Caucase du Nord"
 nsb_news.301.d:0 "Dans l’esprit de Tapa Tchermoev avant eux, les circonscriptions de l’ancienne République Montagneuse se sont à nouveau unies sous la direction de [FROM.GetLeader].\nAu milieu d’un renouveau du sentiment national et de coopération entre les divers peuples du Caucase du Nord, le gouvernement en exil de la première MRNC a été intégré au nouvel État, dédié à la protection de la souveraineté nationale quoi qu’il arrive, comme déclaré lors de la conférence de proclamation.\nLa politique étrangère de [FROM.GetNameDefCap] devrait rester alignée contre Moscou ; les États et personnalités politiques partageant un ennemi commun avec eux ont exprimé leur soutien total à l’indépendance ciscaucasienne."
 nsb_news.301.a:0 "Nous ne sommes plus désunis !"
 nsb_news.301.b:0 "Bienvenue sur la scène mondiale."
 nsb_news.302.t:0 "Le Transcaucasie s’Unit de Nouveau"
 nsb_news.302.d:0 "Après l’incorporation de territoires voisins dans le domaine propre de [FROM.GetOldNameDef], [FROM.GetLeader] a annoncé la formation de [FROM.GetNameDef]. La troisième itération d’un État transcaucasien unifié, succédant à la DFR Transcaucasienne de 1918 et à la SFSR de 1922 à 1936, ce nouveau régime existe comme une nouvelle tentative de transcender la disunité ethnique de la région qui avait empêché son existence précédente.\nLes dépenses fastueuses pour une marche cérémoniale dans les rues de [FROM.capital.GetCapitalVictoryPointName] ont servi à projeter une image glorieuse pour cette unification politique, malgré un manque général de foi dans l’idée transcaucasienne. Le chef de l’État de l’union a exprimé la nécessité de la prouver utile – peut-être par la réalisation des ambitions territoriales des nationalités individuelles."
 nsb_news.302.a:0 "Nos querelles s’achèvent ici !"
 nsb_news.302.b:0 "Encore ?"
 nsb_news.303.t:0 "La Sibérie est Unifiée"
 nsb_news.303.d:0 "Après des siècles de domination russe, la Sibérie n’est plus seulement une région sous un pouvoir étranger, mais une entité politique souveraine, construite sur les sentiments autonomistes de la guerre civile russe, désormais transformés en une identité multinationales distincte. Les efforts de l’armée [FROM.GetOldAdjective] ont rendu cela possible.\nGarantissant une place égale pour toutes les ethnies [FROM.GetAdjective] dans le nouvel [FROM.GetName], [FROM.GetLeader] a assuré l’engagement de son gouvernement envers ses principes et sa disposition à se battre pour les droits du peuple [FROM.GetAdjective] à tout prix. La rhétorique venant de [FROM.capital.GetCapitalVictoryPointName] implique que toute la Sibérie est sous son mandat légitime ; de nombreux commentateurs prévoient que les combats dans cette région se poursuivront encore un certain temps."
 nsb_news.303.a:0 "Enfin, la Sibérie est libérée du joug de l’impérialisme !"
 nsb_news.303.b:0 "L’emprise de la Russie sur l’est diminue…"
 nsb_news.304.t:0 "Le Second État Idel-Oural"
 nsb_news.304.d:0 "Succeeding the Millät Mäclese's attempt to unite the Tatars, Bashkirs and Chuvashes as the Idel-Ural State in 1918, a new state carrying that name has been proclaimed by [FROM.GetLeader]. Now also encompassing nationalities not predominantly Muslim, this country exists as a staunch, collective rejection of foreign rule by the multitude of peoples that compose it.\n\nThe fact that [FROM.GetNameDef] is located in such an isolated position poses the tremendously concerning question of its continued viability. There certainly exist potential allies that could assist in securing [FROM.GetAdjective] sovereignty."
 nsb_news.304.a:0 "Cette fois, il restera uni !"
 nsb_news.304.b:0 "Alors, euh, où est-ce déjà ?"
 AAT_Sweden_flashpoints.33.t: "[GER.GetLeader] Met en Question la Neutralité [SWE.GetAdjective]"
 BBA_ethiopia_industrial_financial_events.2.desc:0 "Citing the fact that the economies of [ROOT.GetName] and [FROM.GetName] are so intertwined, and that much of the industry in [ROOT.GetName] is already controlled by [FROM.GetName], [FROM.GetLeader] demands that border stations between the two countries be removed. The control of all foreign policy is to be placed under the control of [FROM.Getname] to ensure maximum protection, coordination, and efficiency. In effect this would mean the end of [ROOT.GetAdjective] independence.\n All this will be done with the best interest of both countries in mind, [FROM.GetLeader] ensures."
 BBA_ethiopia_industrial_financial_events.4.a:0 "This can surely be accommodated"
 BBA_ethiopia_communist_events.14.desc:0 "[ETH.GetNameDefCap] has requested our support with the development of their own air force. Their proposal includes sending volunteers to train alongside our pilots in older, surplus planes. This would be a fantastic opportunity for our pilots to get some more experience and for testing out our equipment against the [ITA.GetAdjective]s."
 BBA_ethiopia_communist_events.15.desc:0 "Generals from [SOV.GetNameDef] arrived in [ROOT.Capital.GetCapitalVictoryPointName] today. The advisors are being given an overview of the current structure of our armed forces and the current state of the war with [ITA.GetName]. Hopefully they will be able to help modernize our forces."
 bba_news.8.desc:0 "Perhaps unsurprisingly to many, [AFA.GetNameDef] has accepted [ITA.GetAdjective] demands for subjugation. While the [AFA.GetAdjective] government held out hope of avoiding occupation, it became increasingly clear that the colonial powers of the region would not be coming to their aid, nor would neighboring [ETH.GetName] be able to spare military personnel to support them. With the situation so bleak, the government bowed to [ITA.GetAdjective] pressure to spare the people becoming the victims of unnecessary bloodshed. \n\n[ITA.GetAdjective] forces are now moving into the small nation to take up new positions on the border with [ETH.GetNameDef]. It is unclear whether the occupation will be permanent, or how it will impact the wider [ITA.GetAdjective] conflict with [ETH.GetName]."
 BBA_african_union_events.6.desc:1 "[FROM.GetNameDefCap] has agreed to join the [ETH_GetCentralBankName] and have now begun the process of aligning their currency with our own. Soon, trade will be much easier between our nations."
 BBA_italy_naval_cooperation_programs.01.a:0 "A beneficial deal!"
 ITA_losing_cores_tt:0 "Effects will be applied every time [ROOT.GetName] loses control of a §Ycore state§! to an enemy."
 ITA_losing_colonies_tt:0 "Effects will be applied every time [ROOT.GetName] loses control of a §Ynon-core state§! to an enemy."
 ITA_reclaiming_cores_tt:0 "Effects will be applied every time [ROOT.GetName] reclaims a §Ycore state§! from an enemy."
 BBA_italy_interaction_events.26.a:0 "They realize that they cannot match us!"
 BBA_italy_interaction_events.40.desc:0 "Now that territorial concessions have been decided, [ITA.GetName] has initiated a process that will bring Italy and France into a military alliance called the Stresa Front. Now is not the time to sit idly by, for France must act in her own best interest and join Italy against the German menace."
 BBA_italy_interaction_events.42.desc:0 "The country of [FROM.GetName] has humbly accepted our offer of protection and bowed down to the rightful rulers of the Mediterranean Sea. Today shines a new bright light on Iberia and [ITA.GetNameDef]."
 bba_news.107.desc:1 "Pope Pius XI has passed away after leading the Catholic Church for almost 20 years. During his turn as the Pontifex Maximus Pius XI ended the long breach between the Papacy and the Italian government and was crucial in establishing the Vatican as an independent state once again."
 mexico.32.desc:0 "Hispanic youths wearing extravagant clothes - 'zoot suits' - have been the target of race riots in border cities in the South, stemming from sensationalized reporting over the death of a teenager in Los Angeles. Nine Mexican-American youths have been convicted for murder over the incident.\n\nIntelligence agents have compiled reports stating that the zoot suiters are in fact fascist agents, collaborating with ultra-Catholic Sinarquistas in Mexico in order to assist in a Japanese-German invasion of the Americas."
 mexico.33.desc:0 "Hispanic youths wearing extravagant clothes - 'zoot suits' - have been the target of race riots in border cities to our North, stemming from sensationalized reporting over the death of a teenager in Los Angeles. Nine Mexican-American youths have been convicted for murder over the incident.\n\nAmerican intelligence agents have compiled reports stating that the zoot suiters are in fact fascist agents, collaborating with ultra-Catholic Sinarquistas in Mexico in order to assist in a Japanese-German invasion of the Americas."
 mexico.53.desc:1 "We long believed our current leaders to spread the true interpretation of Marx, Engels, and Lenin, but now they have been forced to undergo 'self-criticism' and publicly confess that the Trotskyist interpretation of Lenin is the only correct path towards the triumph of Socialism. As a result, we suddenly find ourselves isolated. Our alliance has collapsed and we are facing a Cornelian dilemma: recognize the rightfulness of Trotskyist views or become isolated and at odds with the [MEX.GetFactionName]."
 mexico.56.desc:0 "In an arrogant response characteristic of Imperialist oppressors, [From.GetNameDef] refused our demands to release their greedy hold on the Caribbean! Their proletariat must now face the contradiction of their government and see that they are working for Tyrants."
 mtg_usa_north_american_dominion.1.desc:1 "In what appears to be part of a concerted diplomatic offensive all across North America and the Caribbean, the [USA.GetAdjective] ambassador has handed over a note from President [USA.GetLeader] informing us that his government expects us to consult them in any future foreign policy decisions, \"in the interest of the continued peace and goodwill between our nations\"."
