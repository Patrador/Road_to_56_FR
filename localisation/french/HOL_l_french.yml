 HOL_air_industry_contacts:0 "Contacts de l'industrie aérienne"
 HOL_join_belgo_luxembourgian_customs_union:0 "Rejoignez l'Union douanière"
 HOL_join_belgo_luxembourgian_customs_union_desc:0 "Pour renforcer notre économie, nous devrions approcher nos voisins du sud et négocier notre admission dans l'union douanière [BEL.GetAdjective]-[LUX.GetAdjective] afin de former l'union douanière du Benelux."
 HOL_foreign_guarantees:0 "Garanties étrangères"
 HOL_foreign_guarantees_desc:0 "Si la diplomatie peut tenter d’empêcher une guerre, il faut néanmoins se préparer à l’éventualité d’un échec de notre médiation. C’est pourquoi nous devons demander aux puissances étrangères de garantir notre indépendance."
 HOL_the_new_ideal:0 "Le nouvel Idéal"
 HOL_the_new_ideal_desc:0 "[GER.GetNameDefCap] a fait trop de mal au monde et à nous en particulier. Ils doivent maintenant en payer le prix en déplaçant leurs frontières vers l'est."
 HOL_benelux_scientific_commission:0 "Commission scientifique du Benelux"
 HOL_benelux_scientific_commission_desc:0 "Après la mise en place de coopérations économiques et de défense, une étape logique consiste à coordonner nos recherches militaires."
 HOL_bicycle_infantry:0 "Infanterie cycliste"
 HOL_bicycle_infantry_desc:0 "Les bicyclettes sont notre moyen de transport préféré, qui permettront à notre infanterie d’acquérir la mobilité dont elle a tant besoin."
 HOL_convert_werkspoor_train_factory:0 "Convertir l'usine ferroviaire de Werkspoor"
 HOL_convert_werkspoor_train_factory_desc:0 "En Europe, de nombreux constructeurs de trains se sont reconvertis en fabricants de blindés. Cela ne devrait pas être une surprise car ils construisaient déjà des véhicules complexes en acier avant leur reconversion. Nous devons suivre cette voie et faire de l'usine de trains de Werkspoor l'avant-garde de notre programme de production de chars."
 netherlands.1.t:0 "Le Premier ministre a une liaison avec une femme allemande !"
 netherlands.1.desc:0 "Un journal a affirmé dans son édition d'aujourd'hui que le Premier ministre lui-même entretiendrait une relation avec une Allemande du nom de Hella Schultz. Selon la source du journal, il aurait été vu avec elle en train de dîner à Nice et ils se seraient rendus dans le même hôtel à Londres quelques mois plus tard. De plus, la sécurité d'État néerlandaise estime que même si elle a été officiellement expulsée d'Allemagne, elle pourrait être un agent allemand."
 netherlands.1.a:0 "C'était une affaire privée, je l'ai aidée à s'installer en Argentine."
 netherlands.1.b:0 "Tout nier !"
 netherlands.2.t:0 "Le Premier ministre refuse la coalition avec les catholiques"
 netherlands.2.desc:0 "Le Premier ministre Hendrikus Colijn a annoncé, de manière surprenante, qu'il n'avait pas pu parvenir à un accord avec le parti catholique. Le gouvernement est désormais minoritaire et, à moins que les négociations ne reprennent dans les prochains jours, il est probable que l'exécutif actuel démissionne."
 netherlands.2.a:0 "Continuer à négocier."
 netherlands.2.b:0 "Nous ne trahirons pas notre électorat."
 netherlands.3.t:0 "Le Premier ministre a exprimé des opinions défaitistes"
 netherlands.3.desc:0 "Aujourd'hui, Dirk Jan de Geer a avoué à la reine qu'il pensait que le pays était perdu. Le gouvernement est en exil et les chances de victoire dans cette guerre sont au mieux minces."
 netherlands.3.a:0 "La libération des Pays-Bas est notre seul objectif."
 netherlands.16.t:0 "Les Pays-Bas demandent notre protection."
 netherlands.16.desc:0 "Des représentants d'Angleterre ont contacté notre service diplomatique pour savoir si nous pourrions les rencontrer et garantir publiquement leurs frontières. Ainsi, nous annoncerions clairement notre intention de protéger le droit des petites nations contre les menaces idéologiques étrangères."
 netherlands.16.a:0 "Cela protégera la liberté et le commerce avec un partenaire précieux."
 netherlands.16.b:0 "Nous devons éviter les promesses vides."
 netherlands.17.t:0 "Le gouvernement [ENG.GetAdjective] a accepté notre proposition."
 netherlands.17.desc:0 "Les négociations entre les ministres des Affaires étrangères [ENG.GetAdjective] et [HOL.GetADjective] ont abouti avec succès à la signature d'une déclaration officielle garantissant les frontières de notre pays. Cette déclaration consacre notre neutralité actuelle comme une position sacrée."
 netherlands.17.a:0 "L'Angleterre se tient à nos côtés."
 netherlands.18.t:0 "Le gouvernement [ENG.GetAdjective] a refusé de nous garantir !"
 netherlands.18.desc:0 "Hier, un sommet a eu lieu à Londres entre les représentants [HOL.GetAdjective] et [ENG.GetAdjective] pour discuter de la possibilité d'une garantie [ENG.GetAdjective] sur [HOL.GetNameDef]. La perspective d'un engagement [ENG.GetAdjective] pour la protection des petites nations d'Europe et leur engagement à protéger la liberté de leurs peuples a été suivie de désillusion lorsque le sommet s'est terminé sans position claire de la part des [ENG.GetAdjective]."
 netherlands.18.a:0 "Une énorme déception."
 netherlands.19.t:0 "[HOL.GetNameDEfCap] demande notre protection."
 netherlands.19.desc:0 "Des représentants holandais ont contacté notre service diplomatique pour savoir si nous pourrions les rencontrer et garantir publiquement leurs frontières. Ainsi, nous annoncerions clairement notre intention de protéger le droit des petites nations contre les menaces idéologiques étrangères."
 netherlands.19.a:0 "Nous devons protéger les droits des petites nations."
 netherlands.19.b:0 "Nous devons éviter les promesses vides."
 netherlands.20.t:0 "[FRA.GetNameDefCap] garantie nos frontières"
 netherlands.20.desc:0 "Les négociations entre les représentants [FRA.GetAdjective] et [HOL.GetAdjective] ont abouti avec succès à la signature d'une déclaration officielle garantissant les frontières de notre pays."
 netherlands.20.a:0 "[FRA.GetNameDefCap] est à nos côtés."
 netherlands.21.t:0 "Le gouvernement [FRA.GetAdjective] a refusé de nous garantir !"
 netherlands.21.desc:0 "Hier, un sommet a eu lieu à Amsterdam entre les représentants [HOL.GetAdjective] et [FRA.GetAdjective] pour discuter de la possibilité de garanties. Cependant, aucun accord n'a été conclu, car l'ambassadeur [FRA.GetAdjective] n'a fait que des promesses vagues."
 netherlands.21.a:0 "Une énorme déception."
 netherlands.22.t:0 "[HOL.GetNameDefCap] Veut rejoindre l'Union douanière du Benelux"
 netherlands.22.desc:0 "Plus fortement affecté par la Grande Dépression que ses voisins, [HOL.GetNameDef] envisage la possibilité de renforcer ses liens avec nous et de transformer l'union douanière [BEL.GetAdjective]-[LUX.GetAdjective] en une union douanière du Benelux."
 netherlands.22.a:0 "Cela profiterait à tout le monde !"
 netherlands.22.b:0 "Nous n’avons pas besoin d’une telle chose."
 netherlands.23.t:0 "Le gouvernement [BEL.GetAdjective] a approuvé notre proposition de libre-échange !"
 netherlands.23.desc:0 "Désireux d'améliorer la situation économique de nos économies après des années de difficultés financières, le gouvernement [BEL.GetAdjective] a approuvé la signature d'un accord transformant l'union douanière entre [BEL.GetNameDef] et [LUX.GetNameDef], établie en 1921, en une alliance commerciale tripartite."
 netherlands.23.a:0 "C'est une opportunité historique."
 netherlands.24.t:0 "[HOL.GetNameDefCap] rejoint notre union douanière avec [BEL.GetNameDef]."
 netherlands.24.desc:0 "Après des négociations avec le gouvernement [BEL.GetAdjective], les [HOL.GetADjective] ont rejoint notre union douanière avec [BEL.GetNameDef] et formé l'union douanière du Benelux."
 netherlands.24.a:0 "Cela profitera à tout le monde !"
 netherlands.25.t:0 "Le gouvernement [BEL.GetAdjective] a refusé notre proposition de libre-échange !"
 netherlands.25.desc:0 "Malgré tous nos efforts et le potentiel bénéfique pour tous les participants, le gouvernement [BEL.GetAdjective] a refusé de supprimer les droits de douane sur les marchandises échangées à travers notre frontière."
 netherlands.25.a:0 "C'est une honte."
 netherlands.26.t:0 "Le gouvernement [HOL.GetAdjective] discute d'une nouvelle politique étrangère !"
 netherlands.26.desc:0 "Après l'échec des négociations avec [BEL.GetNameDef] et [LUX.GetNameDef], il semble évident que l'avenir de [HOL.GetNameDEf] ne réside pas dans la création de liens plus étroits avec [BEL.GetNameDef]. Coincé dans une impasse diplomatique, le gouvernement doit désormais explorer de nouvelles opportunités et réorienter sa politique diplomatique."
 netherlands.26.a:0 "Nous devons compter sur nous-mêmes."
 netherlands.26.b:0 "Nous devons essayer de nous allier avec [ENG.GetNameDef]."
 netherlands.27.t:0 "La reine réagit à la prise de pouvoir communiste"
 netherlands.27.desc:0 "Il est bien connu que la montée du communisme dans le pays a profondément préoccupé la Reine. Elle voit logiquement le communisme comme une idéologie incompatible avec le pouvoir héréditaire de la maison d'Orange-Nassau. Il n'est donc pas surprenant que la rumeur se répande selon laquelle la Reine pense de plus en plus à quitter le pays."
 netherlands.27.a:0 "Nous verrons..."
 netherlands.27.b:0 "Espionne-la."
 netherlands.28.t:0 "La Reine part en exil."
 netherlands.28.desc:0 "La reine n'est plus dans son palais. Craignant la colère des foules communistes, elle a discrètement fui le pays avec l'aide de complices réactionnaires."
 netherlands.28.a:0 "La monarchie est le dernier vestige du féodalisme."
 netherlands.29.t:0 "Wilhelmina arrêtée !"
 netherlands.29.desc:0 "Alors qu'elle tentait de fuir le pays, Wilhelmina van Orange-Nassau fut capturée par des agents fidèles au parti communiste. Elle fut rapidement arrêtée et emprisonnée en tant que principale dirigeante du régime capitaliste corrompu du passé."
 netherlands.29.a:0 "Vive la révolution !"
 netherlands.32.t:0 "Le destin de la Wallonie"
 netherlands.32.desc:0 "Nous avons finalement sécurisé les Pays-Bas, mais cette domination n'est que superficielle. Les Wallons craignent pour leur droit à pratiquer leur langue. Si leurs politiciens refusent de soutenir l'unification des Pays-Bas sous notre règne, cela pourrait recréer les conditions d'une nouvelle révolte belge, comme en 1830."
 netherlands.32.a:0 "Jouons \"Maria van Bourgondië\" à l'opéra de Bruxelles."
 netherlands.32.b:0 "Accorder une certaine autonomie aux Wallons."
 netherlands.33.t:0 "[HOL.GetNameDef] Demande le contrôle de la Flandre"
 netherlands.33.desc:0 "Dans son désir de réaliser la grande union néerlandaise, [HOL.GetLeader] nous a formellement demandé de céder le contrôle de l'ancien territoire belge de Flandre, qu'il considère comme une partie formelle de sa nation."
 netherlands.33.a:0 "Si c'est ce qu'ils veulent."
 netherlands.33.b:0 "Non, c'est à nous !"
 netherlands.34.t:0 "La Flandre a été restituée !"
 netherlands.34.desc:0 "Nos compétences diplomatiques inégalées ont conduit à la libération de la Flandre, opprimée pendant des siècles par les Espagnols, les Autrichiens, les Français et les Belges."
 netherlands.34.a:0 "Hou Zee !"
 netherlands.35.t:0 "Une occasion manquée"
 netherlands.35.desc:0 "Malgré tous nos efforts, nos tentatives d'obtenir la restitution de la Flandre et une réunification diplomatique définitive du Dietschland ont été rejetées."
 netherlands.35.a:0 "L’histoire nous dira que nous avions raison !"
 HOL_fietsinfanterie_tooltip:0 "Gagnez une petite unité d'infanterie à vélo \n"
 FLA_fascist_rebels_tooltip:0 "En cas de succès, une décision vous permettra d'ordonner la révolte des §Yfascistes flamands§! après la §Ydéclaration de guerre§! au prix de 30£command_power."
 HOL_infantry_equipment_0:0 "Geweer M.95"
 HOL_infantry_equipment_0_short:0 "Geweer M.95"
 HOL_gw_tank_equipment:0 "Carden Loyd Mk.VI"
 HOL_gw_tank_equipment_short:0 "V-CL Mk.VI"
 HOL_gw_tank_equipment_desc:0 "L'armée royale néerlandaise ne disposait que d'une poignée de voitures blindées obsolètes ou usées, de douze excellents camions blindés à six roues DAF M39 et de cinq chenillettes Carden Loyd Mark VI nommées Lynx, Poema, Jaguar, Panter et Luipaard."
 HOL_light_tank_equipment_1:0 "Vickers Light Tank Mk.IV"
 HOL_light_tank_equipment_1_short:0 "V-LT Mk.IV"
 HOL_light_tank_equipment_1_desc:0 "Seuls 22 chars légers Vickers Mk.IV ont été utilisés par la KNIL (Armée royale néerlandaise des Indes orientales)."
 HOL_light_tank_destroyer_equipment_2:0 "DAF M39 Pantserwagen"
 HOL_light_tank_destroyer_equipment_2_short:0 "DAF M39"
 HOL_light_tank_destroyer_equipment_2_desc:0 "Pour l'époque, le DAF M39 était un modèle moderne avec une coque monocoque entièrement soudée et un blindage incliné. La tourelle, équipée d'un canon de 37 mm relativement puissant, était produite en Suède par Landsverk. Le type était légèrement blindé et relativement rapide, avec une bonne capacité de franchissement."
 HOL_light_tank_equipment_2:0 "CTMS-1TB1"
 HOL_light_tank_equipment_2_short:0 "CTMS-1TB1"
 HOL_light_tank_equipment_2_desc:0 "Marmon-Herrington a lancé le projet CTMS-1TB1 pour produire un char léger à trois hommes pour l'armée néerlandaise. Il était armé d'un canon automatique de 37 mm et d'une mitrailleuse coaxiale M1919. Ils avaient initialement prévu d'en envoyer 600 aux Indes orientales néerlandaises. Cependant, la campagne s'est terminée trop tôt pour que des prototypes puissent être envoyés."
 HOL_light_tank_aa_equipment_3:0 "Braat AA"
 HOL_light_tank_aa_equipment_3_short:0 "Braat AA"
 HOL_light_tank_aa_equipment_3_desc:0 "Un canon anti-aérien monté sur le châssis d'un Braat Overvalwagen."
 HOL_medium_tank_equipment_1:0 "MTLS-1G14"
 HOL_medium_tank_equipment_1_short:0 "MTLS-1G14"
 HOL_medium_tank_equipment_1_desc:0 "Le projet MTLS-1G14 a été lancé en même temps que le CTMS-1TB1 pour produire un char moyen pouvant accueillir quatre hommes pour l'armée néerlandaise. Il était armé de deux canons automatiques de 37 mm. Il était également équipé de cinq mitrailleuses M1919, dont trois étaient montées sur la coque, une montée coaxialement et une montée sur le dessus de la tourelle. Le blindage était boulonné et mesurait entre 13 et 38 mm."
 HOL_CAS_equipment_1:0 "Fokker C.X"
 HOL_CAS_equipment_1_short:0 "Fokker C.X"
 HOL_CAS_equipment_1_desc:0 "Le Fokker C.X fut initialement conçu pour l'armée royale des Indes orientales néerlandaises afin de remplacer le Fokker C.V. Comme tous les avions Fokker de l'époque, il était de construction mixte, avec des structures d'ailes en bois et un châssis en tubes d'acier soudés recouverts de plaques d'aluminium à l'avant de l'appareil et de tissu à l'arrière. Le prototype fut construit en 1934 avec un moteur Rolls-Royce Kestrel V."
 HOL_CAS_equipment_2:0 "Douglas 8A-3N"
 HOL_CAS_equipment_2_short:0 "8A-3N"
 HOL_CAS_equipment_2_desc:0 "En raison du manque de munitions, ces appareils furent utilisés comme chasseurs lors de l'invasion allemande. Ils subirent des pertes terribles et, combinées aux opérations de débarquement aérien allemandes qui incluaient l'une de ses bases (Ockenburg AFB), cela aboutit à la perte totale de tous les 8A-3N."
 HOL_cv_CAS_equipment_1:0 "Fokker C.X-cv"
 HOL_cv_CAS_equipment_1_short:0 "Fokker C.X-cv"
 HOL_fighter_equipment_0:0 "Koolhoven F.K.51"
 HOL_fighter_equipment_0_short:0 "F.K.51"
 HOL_fighter_equipment_0_desc:0 "Alors que la majorité des F.K.51 étaient employés comme avions d'entraînement élémentaires aux Pays-Bas ou dans des rôles de reconnaissance par l'armée de l'air royale néerlandaise dans les Indes orientales néerlandaises, vingt-huit ont été vendus clandestinement au gouvernement républicain pendant la guerre civile espagnole, le tout malgré un embargo néerlandais sur la vente d'armes à l'un ou l'autre camp de ce conflit."
 HOL_fighter_equipment_1:0 "Fokker D.XXI"
 HOL_fighter_equipment_1_short:0 "Fokker D.XXI"
 HOL_fighter_equipment_1_desc:0 "Dès son entrée en service, le D.XXI représentait un bond en avant significatif pour l'aviation de l'armée néerlandaise, dont les forces de chasse étaient constituées de biplans vieillissants à cockpit ouvert. Le nouveau Fokker s'est rapidement révélé être un avion extrêmement robuste, capable d'atteindre une vitesse de 700 km/h en piqué. Une poignée de chasseurs finlandais D-XXI ont remporté près de deux cents victoires aériennes sur l'aviation soviétique au cours des deux guerres finno-soviétiques."
 HOL_fighter_equipment_2:0 "Koolhoven F.K.58"
 HOL_fighter_equipment_2_short:0 "F.K.58"
 HOL_fighter_equipment_2_desc:0 "Le Koolhoven F.K.58 était un avion de chasse intercepteur monomoteur conçu et principalement fabriqué par NV Koolhoven aux Pays-Bas sous contrat avec la France. Destiné à l'Armée de l'Air, le F.K.58 a connu un service limité lors de la bataille de France."
 HOL_fighter_equipment_3:0 "Koolhoven F.K.59"
 HOL_fighter_equipment_3_short:0 "F.K.59"
 HOL_fighter_equipment_3_desc:0 "Le projet final de Koolhoven était un chasseur-bombardier polyvalent destiné à servir dans l'aviation navale d'États comme le Portugal, la Suède et la Norvège. Aucune commande n'a suivi et le développement a été interrompu par Fall Gelb."
 HOL_cv_fighter_equipment_0:0 "Fokker D.XVII"
 HOL_cv_fighter_equipment_0_short:0 "Fokker D.XVII"
 HOL_cv_fighter_equipment_0_desc:0 "Le D.XVII était un biplan néerlandais créé par Fokker. Le prototype était propulsé par un Curtiss Conqueror non suralimenté de plus de 500 ch. Un modèle ultérieur fut configuré avec un Rolls-Royce Kestrel de 600 ch, et des plans furent élaborés pour une variante Hispano-Suiza Xbre. Le 18 janvier 1935, il établit un record néerlandais de haute altitude."
 HOL_cv_fighter_equipment_1:0 "Fokker D.XXI-cv"
 HOL_cv_fighter_equipment_1_short:0 "Fokker D.XXI-cv"
 HOL_cv_fighter_equipment_2:0 "Koolhoven F.K.58C"
 HOL_cv_fighter_equipment_2_short:0 "F.K.58C"
 HOL_cv_fighter_equipment_3:0 "Buffalo 339-23"
 HOL_cv_fighter_equipment_3_short:0 "B-339-23"
 HOL_cv_fighter_equipment_3_desc:0 "Les avions Brewster B-339 utilisés par le ML-KNIL étaient plus légers que les Brewster Mark I B-339E modifiés utilisés par d'autres forces aériennes alliées, ce qui leur a permis d'affronter avec succès les Japonais. Lors d'un engagement important, huit chasseurs Brewster néerlandais ont intercepté une formation d'environ 35 bombardiers japonais escortés d'environ 20 Zero. Les pilotes de Brewster ont détruit 11 avions japonais et perdu quatre Brewsters ; deux pilotes néerlandais ont perdu la vie."
 HOL_jet_fighter_equipment_1:0 "Gloster Meteor F.4"
 HOL_jet_fighter_equipment_1_short:0 "Meteor F.4"
 HOL_jet_fighter_equipment_2:0 "Fokker S.14"
 HOL_jet_fighter_equipment_2_short:0 "Fokker S.14"
 HOL_jet_fighter_equipment_2_desc:0 "Les caractéristiques extérieures du S.14 étaient courtes, larges et ses ailes légèrement effilées lui ont rapidement valu le surnom de 'Plank'. Cependant, tous les pilotes pilotant le S.14 l'ont loué pour ses excellentes caractéristiques de vol."
 HOL_nav_bomber_equipment_1:0 "Fokker T.IVa"
 HOL_nav_bomber_equipment_1_short:0 "Fokker T.IVa"
 HOL_nav_bomber_equipment_1_desc:0 "Le Fokker T.IV a été développé pour répondre aux besoins de la Marine royale néerlandaise en matière de patrouille maritime et de bombardement torpilleur destiné à être utilisé dans les Indes orientales néerlandaises. L'avion pouvait transporter soit une torpille, soit 800 kg de bombes, et disposait d'un armement défensif de trois mitrailleuses en position avant, dorsale et ventrale."
 HOL_nav_bomber_equipment_2:0 "Fokker C.XIw"
 HOL_nav_bomber_equipment_2_short:0 "Fokker C.XIw"
 HOL_nav_bomber_equipment_2_desc:0 "Le Fokker C.XI était un hydravion de reconnaissance conçu pour opérer à partir de navires de guerre. Après des essais de catapultage réussis, une commande fut passée pour équiper les croiseurs HNLMS Tromp et HNLMS De Ruyter alors qu'ils opéraient dans les eaux européennes ; mais la plupart furent envoyés aux Indes orientales néerlandaises pour équiper la marine de ce pays."
 HOL_nav_bomber_equipment_3:0 "Fokker T.VIIIw"
 HOL_nav_bomber_equipment_3_short:0 "Fokker T.VIIIw"
 HOL_nav_bomber_equipment_3_desc:0 "Le Fokker T.VIII était un bombardier-torpilleur et hydravion de reconnaissance bimoteur néerlandais, qui a servi dans les forces aériennes néerlandaises, britanniques et allemandes. L'avion a été initialement développé en raison d'une demande du service de l'aviation navale néerlandaise pour un avion destiné à être utilisé dans les eaux territoriales et aux Indes orientales néerlandaises."
 HOL_cv_nav_bomber_equipment_1:0 "Koolhoven F.K.52C"
 HOL_cv_nav_bomber_equipment_1_short:0 "F.K.52C"
 HOL_cv_nav_bomber_equipment_1_desc:0 "Pendant la guerre d'Hiver, deux F.K.52 furent achetés par le comte suédois Carl Gustav von Rosen et donnés à l'armée de l'air finlandaise. Les avions furent envoyés en Finlande le 18 janvier 1940. Deux mois plus tard, ils bombardèrent et mitraillèrent les troupes soviétiques qui attaquaient sur la glace en direction de Virolahti. À Londres, le gouvernement néerlandais commanda des F.K.52 pour son armée de l'air aux Indes, et les avions furent expédiés aux États-Unis mais n'atteignirent jamais les Indes."
 HOL_cv_nav_bomber_equipment_2:0 "Fokker C.XI"
 HOL_cv_nav_bomber_equipment_2_short:0 "Fokker C.XI"
 HOL_cv_nav_bomber_equipment_3:0 "Fokker T.VIII"
 HOL_cv_nav_bomber_equipment_3_short:0 "Fokker T.VIII"
 HOL_heavy_fighter_equipment_1:0 "Fokker G.1"
 HOL_heavy_fighter_equipment_1_short:0 "Fokker G.1"
 HOL_heavy_fighter_equipment_1_desc:0 "Le Fokker G.1 était un avion de chasse bimoteur lourd au design révolutionnaire : fuselage à double flèche et huit mitrailleuses frontales dans le nez. Outre l'armée de l'air néerlandaise, plusieurs armées de l'air étrangères ont montré de l'intérêt pour le G.1, que ce soit comme chasseur ou comme bombardier en piqué. Le prototype du G.1 était équipé de freins de piqué à commande hydraulique sous les ailes pour tester son potentiel en tant que bombardier en piqué. Les essais en vol ont révélé que le G.1 était capable de plonger à plus de 644 km/h."
 HOL_heavy_fighter_equipment_2:0 "Fokker D.XXIII"
 HOL_heavy_fighter_equipment_2_short:0 "Fokker D.XXIII"
 HOL_heavy_fighter_equipment_2_desc:0 "Le Fokker D.XXIII a été conçu comme un avion monoplace bimoteur. Pour surmonter les problèmes de vol asymétrique, il était équipé d'un moteur tracteur à l'avant et d'un moteur propulseur à l'arrière. Le D.XXIII était un monoplan cantilever avec deux empennages sur des poutres. Le pilote disposait d'un cockpit fermé entre les moteurs tracteur et propulseur, et il était équipé d'un train d'atterrissage tricycle rétractable."
 HOL_heavy_fighter_equipment_3:0 "Fokker G.3"
 HOL_heavy_fighter_equipment_3_short:0 "Fokker G.3"
 HOL_heavy_fighter_equipment_3_desc:0 "On sait peu de choses sur ce modèle ou sur les modèles initiaux du G.2, car le développement a été interrompu par l'invasion des Pays-Bas."
 HOL_tac_bomber_equipment_0:0 "Fokker C.V D/E"
 HOL_tac_bomber_equipment_0_short:0 "Fokker C.V D/E"
 HOL_tac_bomber_equipment_0_desc:0 "Le Fokker C.V était un avion biplan léger de reconnaissance et de bombardement néerlandais fabriqué par Fokker. Il pouvait être fabriqué en plusieurs versions ; le client pouvait choisir entre cinq constructions d'ailes différentes (dont l'envergure variait). Les moteurs en étoile pouvaient produire entre 336 et 723 kW (451 à 970 ch) et le train d'atterrissage pouvait être remplacé par des pontons plutôt que par des roues."
 HOL_tac_bomber_equipment_1:0 "Fokker T.V"
 HOL_tac_bomber_equipment_1_short:0 "Fokker T.V"
 HOL_tac_bomber_equipment_1_desc:0 "Conçu comme un avion polyvalent de type 'luchtkruiser' (croiseur aérien), dont le rôle principal était d'intercepter et de détruire les formations de bombardiers ennemis, avec un rôle secondaire de bombardier à long rayon d'action. Comme le T.V. ne possédait pas de réservoirs de carburant auto-obturants, il avait la réputation de prendre rapidement feu lorsqu'il était touché par le feu ennemi."
 HOL_tac_bomber_equipment_2:0 "Fokker T.IX"
 HOL_tac_bomber_equipment_2_short:0 "Fokker T.IX"
 HOL_tac_bomber_equipment_2_desc:0 "Le Fokker T.IX était un bombardier bimoteur néerlandais conçu et construit par Fokker pour l'armée de l'air royale néerlandaise des Indes orientales en remplacement de ses bombardiers obsolètes construits par Martin. L'invasion allemande des Pays-Bas a stoppé le développement ultérieur de l'appareil."
 HOL_strat_bomber_equipment_1:0 "Fokker T.VI"
 HOL_strat_bomber_equipment_1_short:0 "Fokker T.VI"
 HOL_strat_bomber_equipment_1_desc:0 "Entre août 1934 et février 1935, les travaux sur le 'Ontwerp 115' (Design 115), un bombardier lourd à long rayon d'action baptisé T.VI, commencèrent. On ne sait pas exactement à qui était destiné cet avion. Les Pays-Bas, qui se déclarèrent alors neutres dans le conflit européen, ne voulaient pas d'un tel avion. Il ne fut jamais construit."
 HOL_transport_plane_equipment_1:0 "Fokker F.XX"
 HOL_transport_plane_equipment_1_short:0 "Fokker F.XX"
 HOL_carrier_1:0 "Classe Rapana"
 HOL_revive_the_buffer_state_proposal_tt3:0 "§Y[HOL.GetName]§! a une £legitimacy §Ylégitimité§! plus élevée que §Y[FLA.GetName]§!."
 HOL_revive_the_buffer_state_proposal_tt4:0 "§Y[HOL.GetName]§! a une £legitimacy §Ylégitimité§! plus élevée que §Y[WLL.GetName]§!."
 HOL_form_the_benelux_fla_tt:0 "Obtient l'événement '§YLes Pays-Bas invitent [FLA.GetName] aux Pays-Bas unis§!'.\n"
 HOL_form_the_benelux_wll_tt:0 "Obtient l'événement '§YLes Pays-Bas invitent [WLL.GetName] à rejoindre les Pays-Bas Unis§!'.\n"
 HOL_democratic_tt:0 "Nous avons dû soit céder à l’influence démocratique, soit rester neutres dans notre politique commerciale."
 HOL_monarchist_tt:0 "Nous devons soit céder à l’influence monarchiste, soit adopter un type de gouvernement différent de celui de nos influenceurs pour maintenir notre politique de neutralité."
 HOL_fascist_tt:0 "Nous devons soit céder à l’influence fasciste, soit rechercher un type de gouvernement différent de celui de nos influenceurs pour maintenir notre politique de neutralité."
 HOL_communist_tt:0 "Nous devons soit céder à l’influence communiste, soit rechercher un type de gouvernement différent de celui de nos influenceurs pour maintenir notre politique de neutralité."
 HOL_can_ENG_or_GER_influence_tt:0 "Nous ne sommes pas actuellement en train de passer à un autre type de gouvernement."
 HOL_is_placated_changing_gov_tt:0 "Ne connaît pas actuellement de changement de régime."
 HOL_anti_pacifist_propaganda_long:0 "Vaste campagne de propagande antipacifiste"
 mtg_netherlands.80.t:0 "[FROM.GetNameDefCap] Propose une alliance"
 mtg_netherlands.80.d:0 "[FROM.GetNameDefCap] a proposé une alliance entre nos nations ; cet arrangement signifierait un contrôle amical sur les Indes orientales d'importance stratégique, garantissant presque notre accès à leurs ressources en pétrole et en caoutchouc sans risquer un conflit significatif."
 mtg_netherlands.80.a:0 "Cela serait bénéfique."
 mtg_netherlands.80.b:0 "Nous pourrions mieux gérer ces ressources."
 HOL_JAP_new_faction:0 "Renouvellement de l'alliance entre les Pays-Bas et le Japon"
 HOL_restore_naval_cooperation:0 "Rétablir la coopération navale"
 HOL_restore_naval_cooperation_desc:0 "Les Pays-Bas ont aidé à mettre sur pied la marine japonaise. Aujourd’hui, la situation a changé et nous sommes à la traîne en matière de développement naval. Une coopération avec le Japon dans ce domaine pourrait contribuer à renforcer nos forces navales."
 HOL_jap_research_name:0 "Échange technologique entre les Pays-Bas et le Japon"
 HOL_jap_research_desc:0 "Temps de recherche réduit pour les technologies étudiées par d'autres membres de la faction"
 HOL_request_control_over_flanders:0 "Demander le contrôle de la Flandre"
 HOL_francois_tsant:0 "François van't Sant"
 HOL_ko_beuzemaker:0 "Ko Beuzemaker"
 HOL_agathon_sickinghe:0 "Agathon Sickinghe"
 HOL_george_van_goudriaan:0 "George van Tets"
 HOL_aart_vos:0 "Aart Vos"
 HOL_hoyte_jolles:0 "Hoyte Jolles"
 HOL_carel_van_asbeck:0 "Carel Johan van Asbeck"
 HOL_jan_van_den_tempel:0 "Jan van den Tempel"
 HOL_johan_van_oorschot:0 "Johan van Oorschot"
 HOL_frugal_liberal:0 "Libéral frugal"
 tdlra.1.t:0 "[From.GetNameDefCap] Veut que nous rejoignions le Benelux"
 tdlra.1.d:0 "[From.GetNameDefCap] cherche à renforcer son alliance en nous faisant rejoindre."
 tdlra.1.a:0 "Accepter."
 tdlra.1.b:0 "Refuser."
 tdlra.2.t:0 "[From.GetNameDefCap] Refuse"
 tdlra.2.d:0 "[From.GetNameDefCap] a malheureusement refusé notre offre d'alliance."
 tdlra.2.a:0 "Nous avons besoin d’eux, d’une manière ou d’une autre !"
 tdlra.3.t:0 "[From.GetNameDefCap] Accepte !"
 tdlra.3.d:0 "[From.GetNameDefCap] a accepté notre offre d'alliance et fait désormais partie de [Root.GetFactionName]."
 tdlra.3.a:0 "Grande nouvelle"
 tdlra.4.t:0 "[From.GetNameDefCap] Propose un pacte"
 tdlra.4.d:0 "Conscients que nos conceptions de chars sont supérieures aux leurs, [From.GetNameDef] a proposé que nous partagions nos conceptions afin qu'elles puissent servir de bastion du communisme en Europe occidentale."
 tdlra.4.a:0 "Accepter."
 tdlra.4.b:0 "Refuser."
 tdlra.5.t:0 "[From.GetNameDefCap] Accepte notre proposition de pacte"
 tdlra.5.d:0 "Reconnaissant notre importance stratégique au cœur de l'Europe de l'Ouest, [From.GetNameDef] nous a fourni des conceptions de tanks technologiquement supérieures pour nous défendre contre les influences extérieures."
 tdlra.5.a:0 "Mettez-vous au travail avec les nouveaux modèles."
 tdlra.6.t:0 "[From.GetNameDefCap] refuse notre proposition de pacte !"
 tdlra.6.d:0 "[From.GetNameDefCap] n'a pas signé notre proposition de pacte qui augmenterait nos capacités blindées. Nous devrons le faire par nous-mêmes!"
 tdlra.6.a:0 "Qu'il en soit ainsi."
 tdlra.8.t:0 "Les Pays-Bas veulent rejoindre [Root.GetFactionName]."
 tdlra.8.d:0 "Réalisant qu'ils ne pourraient pas contenir l'agression [GER.GetAdjective], [From.GetNameDef] craint qu'une invasion soit imminente et demande notre protection."
 tdlra.8.a:0 "Accepter."
 tdlra.8.b:0 "Refuser."
 tdlra.9.t:0 "[From.GetNameDefCap] accepte."
 tdlra.9.d:0 "Les [ENG.GetAdjective], réalisant que le Benelux est stratégiquement situé pour une guerre contre [GER.GetNameDef], ont décidé d'étendre leur protection sur notre nation."
 tdlra.9.a:0 "Excellentes nouvelles!"
 tdlra.10.t:0 "[From.GetNameDefCap] Refuse"
 tdlra.10.d:0 "Les [ENG.GetAdjective] ne reconnaissent pas le Benelux comme nécessaire, vu qu'ils ne nous défendront pas des incursions ennemies."
 tdlra.10.a:0 "Satanés Britanniques!"
 tdlra.11.t:0 "Démarrer le processus de dépilarisation"
 tdlra.11.d:0 "En ces temps tumultueux, nous n'avons pas besoin d'une société organisée en piliers. Commencer à briser les piliers est une étape importante pour renforcer notre État."
 tdlra.11.a:0 "Lancez le processus."
 HOL_dutch_revanchism:0 "Le revanchisme hollandais"
 HOL_dutch_revanchism_desc:0 "Au fil des siècles, les Hollandais ont dominé de nombreux territoires dans les plaines et outre-mer, dont beaucoup ont été perdus au fil du temps. L'occasion est peut-être venue de réparer les erreurs des révolutions, des guerres et autres transferts qui, au fil des ans, ont considérablement affaibli notre empire."
 HOL_vlaanderen_opnieuw_van_ons:0 "Vlaanderen, Opnieuw van Ons!"
 HOL_vlaanderen_opnieuw_van_ons_desc:0 "La révolte belge de 1830, consolidée neuf ans plus tard par le traité de Londres, a brisé notre emprise sur la Flandre néerlandophone. Une fois de plus sous notre contrôle, peut-être pourra-t-elle être réintégrée, montrant une fois de plus au monde la volonté d'une Hollande unie !"
 HOL_reintegrate_wallonia:0 "Réintégrer la Wallonie"
 HOL_reintegrate_luxembourg:0 "Réintégrer le Luxembourg"
 HOL_unshackle_the_boers:0 "Libérez les Boers !"
 HOL_unshackle_the_boers_desc:0 "Il y a plusieurs siècles, la Compagnie néerlandaise des Indes orientales a établi plusieurs colonies au Cap, en Afrique du Sud, et les a agrandies au fil des ans. Bien qu'une grande partie de notre contrôle soit indirecte, de nombreux colons néerlandais vivent aujourd'hui sous domination étrangère. Nous allons libérer nos frères !"
 HOL_liberate_french_flanders:0 "Libérer la Flandre française"
 HOL_disavow_the_anglo_dutch_treaty_of_1870_1871:0 "Désavouer le traité anglo-néerlandais de 1870-1871"
 HOL_disavow_the_anglo_dutch_treaty_of_1870_1871_desc:0 "Les traités anglo-néerlandais de 1871 nous ont contraints, entre autres, à céder le poste commercial crucial de la Côte d'Or en Afrique de l'Ouest. Nous désavouerons ce coup inégal porté à notre empire !"
 HOL_claim_former_east_indies_possessions:0 "Réclamer les anciennes possessions des Indes orientales"
 HOL_claim_former_east_indies_possessions_desc:0 "La Compagnie néerlandaise des Indes orientales contrôlait autrefois plusieurs comptoirs commerciaux et îles clés à travers l'Asie, qui sont passés, au fil des siècles, sous domination étrangère. Nous n'accepterons plus cette perte sur notre territoire légitime !"
 hol_expand_the_guianas_possession:0 "Élargir la possession de la Guyane"
 no_shell_shocked_spectator_tt:0 "N'a pas §YSpectateur choqué de la Grande Guerre§!"
 hol_unlocks_integration_decisions_tt:0 "§GDéverrouille§! les décisions d’intégrer ou de revendiquer plusieurs territoires historiques §YNéerlandais§!."
 walloon_partisans:0 "Partisans wallons"
 HOL_mio_trait_van_trappen_suspension:0 "Suspension Van Trappen"
 HOL_reclaim_the_crown_jewel:0 "Reprendre le joyau de la Couronne"
 HOL_reclaim_the_crown_jewel_desc:0 "La colonie, joyau de la couronne, est bien trop importante pour que nous la laissions nous échapper, même si cela signifie réprimer une rébellion ouverte contre elle."
 HOL_sunda_islands_staging_area:0 "Zone de rassemblement des îles de la Sonde"
 HOL_sunda_islands_staging_area_desc:0 "Pour gérer le déploiement des forces dans [INS.GetNameDef], nous devons construire l’infrastructure nécessaire pour combattre efficacement dans la région."
 HOL_jungle_rangers:0 "Rangers de la jungle"
 HOL_jungle_rangers_desc:0 "Une grande partie du territoire de [INS.GetNameDef] est constituée de jungles denses. Pour combattre efficacement dans la région, nous devons former des forces spécialisées capables de s'adapter à ces terrains hostiles."
 HOL_anti_partisan_effort:0 "Effort anti-partisan"
 HOL_anti_partisan_effort_desc:0 "Les partisans de nos colonies perturbent nos forces. Nous devons redoubler d'efforts pour les traquer."
 HOL_evacuate_colonial_assets:0 "Évacuer les actifs coloniaux"
 HOL_evacuate_colonial_assets_desc:0 "Nos colonies étant perdues ou en rébellion ouverte, il est désormais temps que nous réinvestissions dans leur développement pour notre propre bénéfice."
 HOL_hollandsche_beton_maastschappij:0 "Hollandsche Beton Maatschappij"
 HOL_nederlandse_spoorwegen:0 "Pays-Bas Spoorwegen"
 HOL_finish_the_twentekanaal:0 "Achever le canal de Twente"
 HOL_finish_the_twentekanaal_desc:0 "L’achèvement du canal de Twente est nécessaire pour relier des parties de la Gueldre à l’Overijssel. Avec ce projet, le commerce se développera entre ces sections vitales de notre nation."
 r56_HOL_daf_pantrado:0 "DAF Pantrado 3"
 r56_HOL_daf_pantrado_desc:0 "Basé sur la conception de la suspension du camion Trado. Le Pantrado 3 sera un blindé de pointe qui remplacera nos véhicules blindés d’origine étrangère."
 r56_HOL_reorganize_the_engineer_regiment:0 "Réorganiser le régiment du génie"
 r56_HOL_reorganize_the_engineer_regiment_desc:0 "En réorganisant le régiment du génie, nous pourrons mieux le préparer aux combats futurs lors de la prochaine guerre."
 r56_HOL_van_kinsbergen:0 "Commander la conception Van Kinsbergen"
 r56_HOL_van_kinsbergen_desc:0 "Le Van Kinsbergen est un sloop unique construit pour protéger nos convois contre les sous‑marins des pays hostiles."
 r56_HOL_mobile_tanks_for_the_colonies:0 "Chars mobiles pour les colonies"
 HOL_samuel_mante:0 "Samuel Mante"
 mtg_netherlands.14.b:0 "Laissons l’opposition de Willem Albarda gouverner."
 mtg_netherlands.14.c:0 "Promouvoir les valeurs libérales avec Pieter Oud."
 mtg_netherlands.11.c:0 "Nous devrions coopérer."
 HOL_juliana: "Queen Juliana"
 HOL_volunteers_for_the_cause:0 "Volunteers for the Cause"
 HOL_volunteers_for_the_cause_desc:0 "To further the cause of our righteous struggle, we must be willing to aid all around the globe who share our ideals. Setting up a dedicated volunteer force to deploy and fight for the working class in foreign lands would be a good step."
 BEL_HOL_benelux_customs_union: "Benelux Customs Union"
 r56_netherlands.1.t:0 "Revolution in the East Indies"
 r56_netherlands.1.desc:0 "Beginning as a small trading post in Banten and overtime becoming what would be known as the Dutch East Indies, the lands of the East Indies have been crucial for our economy and have been our crown jewel. But it came at a cost, and holding onto the colony required us to repress national movements in the territory. But now, after our nation was invaded by both Germany and Japan and the loss of the mainland and the East Indies, the nationalists in the Indies have seized the opportunity to proclaim an independent state. \n\nOur military capabilities are hindered, and it is unulikely that our allies will come to our aid. We either have to let go of our crown jewel, or fight till the very end to keep it."
 r56_netherlands.1.a:0 "Till the bitter end!"
 r56_netherlands.1.b:0 "We are not prepared for another war. Withdraw to West Papua."
 r56_netherlands.1.c:0 "Merdeka! (Play as Indonesia)"
 r56_netherlands.2.t:0 "Indonesian National Revolution"
 r56_netherlands.2.desc:0 "Earlier this morning, at 10:00 in the morning, [INS.GetLeader], surrounded by his fellow Indonesian nationalists, proclaimed the formal independence of [INS.GetNameDef] and the beginning of a national revolution against foreign forces within Indonesia. Ceremonies all across Indonesia were held to celebrate the proclamation, but these celebrations may not last long, as the [HOL.GetAdjective] government has yet to respond to Indonesia's proclamation. \n\nOnly time will tell how events will transpire."
 r56_netherlands.2.a:0 "What does this imply for the rest of South East Asia?"