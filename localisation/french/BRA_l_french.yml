 BRA_uiracu_desc:0 "La Harpie, également appelée Faucon royal et, par les indigènes, Uiraçu, est un rapace plus grand, plus agressif et plus imposant que l'Aigle à tête blanche que les Américains vénèrent tant. Comme le faucon qui embaume notre sol, le Brésil sera le prédateur de son habitat, et le peuple brésilien l'unificateur de son continent."
