 BRA_firmo_freire_do_nascimento:0 "Firmo Freire do Nascimento"
 BRA_license_with_the_soviets: "Accords de licence avec les [SOV.GetAdjective]s"
 BRA_license_with_the_soviets_desc: "Nos recherches sont à la traîne par rapport aux grandes puissances. Il faudra beaucoup de temps pour renforcer nos capacités, mais d'ici là, nous pourrions travailler à obtenir l'autorisation de produire des équipements Soviétique au Brésil. Compte tenu des coûts d'un tel accord, nous devrions essayer de négocier une légère remise."
 BRA_license_with_the_soviets_tt: "([SOV.GetFlag]§Y[SOV.GetName]§!) Obtient l'événement '§Y[BRA.GetNameDefCap] Cherche un accord de production sous licence§!'\n\nIls sont plus susceptibles d'accepter s'ils ont une §Yhaute opinion de nous !§!"
 BRA_the_latin_american_socialist_cooperative: "La coopérative socialiste latino-américaine"
 BRA_the_latin_american_socialist_cooperative_desc: "Il y a beaucoup d’autres pays qui partagent nos idées sur ce que devrait être la société communiste. Il est temps que nous nous ouvrions à la coopération avec ces pays afin que nous puissions, ensemble, défendre notre cause !"
 BRA_establish_ulasr: "Créer l'ULASR"
 BRA_establish_ulasr_desc: "Notre mouvement révolutionnaire continue d’éroder les structures de la société bourgeoise à travers le continent. Il est clair que nous ne sommes plus un mouvement de [ROOT.GetAdjective], nous sommes un mouvement de Sud-Américains et il est temps que nos structures politiques représentent mieux ce changement."
 BRA_end_south_american_capitalism: "Mettre fin au capitalisme sud-américain"
 BRA_end_south_american_capitalism_desc: "La démocratie bourgeoise et le capitalisme continuent de saper les droits et les conditions de vie de nombreux Sud-Américains. Nous devons faire tout ce qui est en notre pouvoir pour libérer nos camarades de tout le continent de leurs oppresseurs."
 BRA_pedro_henrique_iii:0 "Dom Pedro III"
 BRA_R56_the_second_communist_putsch:0 "The Second Communist Putsch"
 BRA_R56_the_second_communist_putsch_desc:0 "The National Alliance of Liberation attempted a Coup against President Vargas. Now, with the workers' and people's support, the Marxists have an opportunity to forge in Brazil a glorious egalitarian socialist republic!"
 BRA_R56_non_dvcor_dvco:0 "Non Dvcor Dvco"
 BRA_R56_non_dvcor_dvco_desc:0 "After more than a century of constitutional life and liberalism, has regressed into a dictatorship without brakes and without limits which degrades and depletes us before the civilized world!"
 BRA_R56_usiminas:0 "USIMINAS"
 BRA_R56_usiminas_desc:0 "Usinas Siderurgicas de Minas Gerais SA will be a leading steel company in the production and marketing of hot and cold rolled steel, coils, slabs, and coated, mainly for the sectors of capital goods and consumer goods, in addition to the automotive industry."
 BRA_R56_a_revolta_da_armada:0 "A Revolta da Armada"
 BRA_R56_a_revolta_da_armada_desc:0 "We must readjust the behavior of [BRA.GetAdjective] ships and the tactics of naval commanders to modern naval warfare. We can take as an experience the Navy Revolt of 1893."
 BRA_R56_analyze_the_paulista_war:0 "Analyze the Paulista War"
 BRA_R56_analyze_the_paulista_war_desc:0 "The Brazilian Civil War has proved to be a testing ground for possible effective battle tactics."
 BRA_R56_minas_gerais_war_doctrine:0 "Minas Gerais' War Doctrine"
 BRA_R56_minas_gerais_war_doctrine_desc:0 "During the conflict, the troops of Minas Gerais and the Minas Gerais officers who led the Army were aware of the inability of Sao Paulo to maintain the war for a long time. So the Mineiros dug. Fixed machine guns supported their trenches, and the fire of the national artillery helped their slow but sure advances."
 BRA_R56_sao_paulos_war_doctrine:0 "São Paulo's War Doctrine"
 BRA_R56_sao_paulos_war_doctrine_desc:0 "The Paulistas public forces adopted the mobile war and the blitz during the conflict. The plans of the state of São Paulo foresaw a rapid and fulminating movement towards Rio de Janeiro through the Paraíba valley, with the rearguard ensured by the support that the other states would give."
 BRA_R56_heavy_artillery:0 "Heavy Artillery"
 BRA_R56_heavy_artillery_desc:0 "Enjoying more resources than his opponent, the Union imported artillery from abroad. Accurate, the cannons obliterated an entire Paulista squad in a hit. We can help our military-industrial enterprises expand their industrial centers to a never-known level."
 BRA_R56_the_voice_of_brazil:0 "Transmit 'A Voz do Brasil'"
 BRA_R56_the_voice_of_brazil_desc:0 "The Voice of Brazil is a radiophonic state-run obligatory-diffusion program that goes on-air daily in all [BRA.GetAdjective] media, usable to spread nationalistic propaganda."
 BRA_R56_stufy_the_war_of_attrition:0 "Study the War of Attrition"
 BRA_R56_stufy_the_war_of_attrition_desc:0 "With patience, technological superiority, and the use of bullets and not of men, the troops of Minas Gerais were the most efficient of the war, offering Brazil a quick victory over the Paulistas. We should not deny the legacy of the Mineiros."
 BRA_R56_federal_economic_bank:0 "Federal Economical Bank"
 BRA_R56_federal_economic_bank_desc:0 "Caixa Econômica Federal (CEF), also known as Caixa Econômica Federal or Caixa, is a financial institution in the form of a public company of the [BRA.GetAdjective] federal government. Its assets and administrative autonomy have branches throughout the country."
 BRA_R56_construct_the_belem_naval_dockyard:0 "Construct the Belém Naval Dockyard"
 BRA_R56_construct_the_belem_naval_dockyard_desc:0 "Construction of the Port of Belém gives the country a strategic base in the north, capable of supporting the Federation's vast fleets and serving as a base for invasion operations north of the Equator."
 BRA_R56_shock_and_awe:0 "Shock and Awe"
 BRA_R56_shock_and_awe_desc:0 "The Paulistas have proved to all of us that, even at a numerical disadvantage, the speed and autonomy of the troops guarantee success in battle. Let's adopt these tactics to ensure better battle efficiency and overwhelming quick victory over our enemies!"
 BRA_R56_bndes:0 "BNDES"
 BRA_R56_bndes_desc:0 "The National Bank for Economic and Social Development will be a federal public company headquartered in Rio de Janeiro and whose main objective is to finance long-term investments in all segments of the economy, social, regional, and environmental."
 BRA_R56_eduardo_gomes_doctrine:0 "Eduardo Gomes' Doctrine"
 BRA_R56_eduardo_gomes_doctrine_desc:0 "Although used by the Union during the Civil War, the bombers have become more precise and lethal since Brazil last used them. Brigadier Eduardo Gomes, during this one, bombarded Campinas, weakening much of the city's infrastructure with a squalid squadron. We will institute him as the Air Force leader."
 BRA_R56_a_new_federal_capital_brasilia:0 "A New Federal Capital: Brasília"
 BRA_R56_a_new_federal_capital_brasilia_desc:0 "Moving the capital to the interior was one of the national objectives since the Empire of Pedro II. Not only would it be interesting in the matter of national security, ensuring that it could not be the capital subject to naval invasions, but also as a guarantee of the development of the interior. Let us now begin the construction of this new capital."
 BRA_R56_a_new_federal_capital_brasilia_tooltip:0 "Switch to the Middle Republican Era. New political parties are in place and, thus, a new political class is born."
 BRA_R56_the_brazilian_action:0 "The Brazilian Action"
 BRA_R56_the_brazilian_action_desc:0 "Similar to the Action Française, the Brazilian Comprehensive Action is a Brazilian reactionary movement, inspired by the great glories and past traditions of this nation. His discussion on educational and cultural center of the country will prove important for the sake of national patriotic identity."
 BRA_R56_ministry_of_aeronautics:0 "Ministry of Aeronautics"
 BRA_R56_ministry_of_aeronautics_desc:0 "With the founding of the Ministry of Aeronautics, the government can manage this new branch of the Armed Forces of the Republic."
 BRA_R56_close_air_support:0 "Close Air Support"
 BRA_R56_close_air_support_desc:0 "Reactivating and modernizing our airplane factory in Lagoa Santa, located at Belo Horizonte's metropolitan region, will aid us in expanding our air force's size."
 BRA_R56_the_sugar_belt:0 "The Sugar Belt"
 BRA_R56_the_sugar_belt_desc:0 "With the introduction of calcarization and localized irrigation, despite acid soil and dry air, we can create in the Triângulo Mineiro and Baixo Goiás a new hyper-region of Sugar Cane cultivation. Obsolete for centuries, it has future potential as there are predictions for the use of alcohol in industrial plants and as fuel."
 BRA_R56_the_soy_belt:0 "The Soy Belt"
 BRA_R56_the_soy_belt_desc:0 "With the introduction of advanced drainage methods and the mechanization of agriculture at the national level, it is possible to grow soybeans in Mato Grosso, an isolated region. Soy has never been cultivated on national soil. It represents potential as food and being exported and serving as a method for the colonization of the interior."
 BRA_R56_support_heavy_industry_in_sao_paulo:0 "Support Heavy Industry in São Paulo"
 BRA_R56_support_heavy_industry_in_sao_paulo_desc:0 "The metropolitan area of São Paulo is the largest industrial center of the country, Latin America and, with government support, one of the largest, if not the greatest, America."
 BRA_R56_grande_valley_military_complex:0 "Grande Valley Military Complex"
 BRA_R56_grande_valley_military_complex_desc:0 "The government is able to subsidize the construction of an industrial complex for war weapons in the Rio Grande Valley, which encompasses the West Paulista and Mineiro Triangle."
 BRA_R56_military_complex_of_the_parana_valley:0 "Military Complex of the Paraná Valley"
 BRA_R56_military_complex_of_the_parana_valley_desc:0 "The govero is able to subsidize the construction of an industrial complex war weapons in Parana River Valley, which encompasses the southern part of São Paulo and almost inteiridade of Paraná."
 BRA_R56_military_complex_of_the_parnaiba_valley:0 "Military Complex of the Parnaíba Valley"
 BRA_R56_national_defense_council:0 "National Defense Council"
 BRA_R56_national_defense_council_desc:0 "The National Defense Council is an advisory body of the President of Brazil in national security, foreign policy, and defense strategies, created by the last president of the 1st Republic, Washington Luis. It is responsible for advising the president in case of declaring war or establishing peace, enacting the state of defense, the state of siege, or federal interventions."
 BRA_R56_under_a_single_banner:0 "Under a Single Banner"
 BRA_R56_under_a_single_banner_desc:0 "[BRA.GetNameDefCap]'s cultural and ethnic diversity and its spearheading in social-liberal and neo-Marxist movements are one of its advantages as a bastion of the Workers Revolution. The Indoctrination of Gramscist thought through the National Educational System will benefit the revolutionary state."
 BRA_R56_encouracados:0 "Encouraçados"
 BRA_R56_encouracados_desc:0 "Brazil, since its independence, has had the biggest beasts of the seas in its arsenal. We will not do it differently."
 BRA_R56_council_for_economics_and_finances:0 "Council for Economics and Finances"
 BRA_R56_council_for_economics_and_finances_desc:0 "The Technical Council of Economics and Finances was established to assist the president with the economic and strategic decisions of the country."
 BRA_R56_the_october_manifesto:0 "The October Manifesto"
 BRA_R56_the_october_manifesto_desc:0 "The [BRA.GetAdjective] Nation must be organized, united, indivisible, strong, powerful, rich, prosperous, and happy. For this, we need all [BRA.GetAdjective] to be united. But [BRA.GetNameDef] can not achieve the intimate and perfect union of its children as long as there are States within the State and political parties fractionating the Nation."
 BRA_R56_modernize_the_electrical_infrastructure:0 "Expand the Electrical Infrastructure"
 BRA_R56_modernize_the_electrical_infrastructure_desc:0 "The Expansion of the Electric Network in all state capitals and urban centers such as the Paulista West and Espírito Santo will improve the quality of life of [BRA.GetAdjective]s and the efficiency of the national industry."
 BRA_R56_expand_the_high_voltage_grid:0 "Expand the High Volatge Grid"
 BRA_R56_expand_the_high_voltage_grid_desc:0 "Expanding the power grid to industrially scarce regions, such as the Triângulo Mineiro, Paraná, and Bahia might create new production centers that further increase our nation's progress."
 BRA_R56_end_the_occupation:0 "End the Occupation"
 BRA_R56_end_the_occupation_desc:0 "The states of [498.GetName] and [1004.GetName] have been under martial law since the communist rebellions in the area were crushed in late 1935, with stability now restored to the states, it is now time for normal life there to be restored."
 BRA_R56_legacy_of_martinelli:0 "Legacy of Martinelli"
 BRA_R56_legacy_of_martinelli_desc:0 "Immigrant Giuseppe Martinelli made his fortune in Brazil with the trans-Atlantic trade. In São Paulo, Martinelli aimed to build the tallest building in Latin America. He made it from adjustments in the plant that overloaded but did not allow the bases to be laid, saving time and resources and guaranteeing the monument's construction. We can learn a lot from this."
 BRA_R56_imbel:0 "IMBEL"
 BRA_R56_imbel_desc:0 "Instead of motorizing their infantry, the Mineiros increased their battle efficiency. The equipment of the legalistic infantry was more modern, fast, and precise when compared to the Paulistas, facilitating the defense of the trenches. We can sign contracts with our arms manufacturers to re-modernize our infantry."
 BRA_R56_the_estado_novo:0 "The Estado Novo"
 BRA_R56_the_estado_novo_desc:0 "In its complete wisdom and industrial pioneering, a central state is capable of providing the general well-being of the citizens of the nation and the prosperity of its entrepreneurs. This eternal bond between the Republic's workers, warriors, and willful business people shall guarantee a lasting [BRA.GetAdjective] union."
 BRA_R56_the_brazilian_expeditionary_force:0 "The [BRA.GetAdjective] Expeditionary Forces"
 BRA_R56_the_brazilian_expeditionary_force_desc:0 "We have logistics capability, tactical, organizational, industrial and numeral organize expeditions abroad in order to defend the interests of the Republic against those who dare to strike."
 BRA_R56_strengthen_local_governments:0 "Strengthen Local Governments"
 BRA_R56_strengthen_local_governments_desc:0 "[BRA.GetNameDefCap] is culturally, geographically, and economically divided. Concessions of relative autonomy under the Federal Government to the various Federative Units of the nation are an efficient way of guaranteeing the freedom of their citizens and the fullness of their constitutional rights."
 BRA_R56_federal_institutes:0 "Federal Institutes"
 BRA_R56_federal_institutes_desc:0 "The Federal Institutes are ramifications of universities dedicated exclusively to practical technological innovation."
 BRA_R56_federal_universities:0 "Federal Universities"
 BRA_R56_federal_universities_desc:0 "Federal Universities are both educational centers and nuclei for technological innovations. The proper exploitation of its profits technologically speaking is attractive to the government's efforts."
 BRA_R56_fiesp:0 "FIESP"
 BRA_R56_fiesp_desc:0 "The Federation of São Paulo State Industries represents thousands of unions and businesses across the state articulate the government's plans next to their will is to unite business with pleasure, encouraging our ability to move between new manufacturing results innovations in the consumer sector and war."
 BRA_R56_gerdau:0 "GERDAU"
 BRA_R56_gerdau_desc:0 "Gerdau S.A., also referred to as the Gerdau Group, is a [BRA.GetAdjective] steel corporation. Hiring Gerdau to expand our steel sector and trans-industrial infrastructure is under discussion."
 BRA_R56_industrial_innovations:0 "Industrial Innovations"
 BRA_R56_industrial_innovations_desc:0 "Our now extensively modernized industry is ready to tackle the challenges of our time: design and produce modern equipment to ensure our victory in the field."
 BRA_R56_matarazzo_united_industries:0 "Matarazzo United Industries"
 BRA_R56_matarazzo_united_industries_desc:0 "Industrias Reunidas Factories Matarazzo were founded by immigrant Franscesco Matarazzo in years 20. The group of 360 manufacturing plants of various goods can be expanded to meet most of industrial demand in the country."
 BRA_R56_support_the_itabira_mines:0 "Support the Itabira Mines"
 BRA_R56_support_the_itabira_mines_desc:0 "The mines in Itabira, Minas Gerais, are part of the Quadrilátero Ferrífero, the largest iron and bauxite deposit in the country and one of the largest in the world. Ensuring that the minerals extracted from there are used only by [BRA.GetNameDef] will guarantee our mineral sovereignty."
 BRA_R56_establish_the_commerce_ministry:0 "Establish the Commerce Ministry"
 BRA_R56_establish_the_commerce_ministry_desc:0 "The Ministry of Work, Commerce, and Industry will assist the government in industrial expansion and modernization matters."
 BRA_R56_lobato:0 "Lobato"
 BRA_R56_lobato_desc:0 "An incident between two neighbors in Lobato, Bahia, disputed the government's claim that there is no oil in [BRA.GetAdjective] lands."
 BRA_R56_roll_out_mechanized_vehicles:0 "Roll Out Mechanized Vehicles"
 BRA_R56_roll_out_mechanized_vehicles_desc:0 "One of the most incredible feats of the state of São Paulo during the war was the construction of armored trains. Scatters of the conflicting coffee load, the trains were endowed with thick metal plates, in their windows were placed machine guns and, in front, a cannon. We can aid some truck manufacturers in creating an enterprise to suppress our need for mechanized units."
 BRA_R56_improve_military_education:0 "Improve Military Education"
 BRA_R56_improve_military_education_desc:0 "The Higher School of War (ESG - Escola Superior de Guerra) aims to develop and consolidate the knowledge necessary for exercising senior management and advisory functions for National Defense planning, including the fundamental aspects of Security and Development."
 BRA_R56_the_brazilian_air_force:0 "The Brazilian Air Force"
 BRA_R56_the_brazilian_air_force_desc:0 "To institute air forces as a significant part of the republic's armed forces is essential to guarantee [BRA.GetAdjective] power over its skies."
 BRA_R56_florianismo:0 "Florianismo"
 BRA_R56_florianismo_desc:0 "Modernizing the navy is essential to guarantee [BRA.GetAdjective] power over the sea. Floriano Peixoto was the first Admiral President of the Republic. During his rule, he maintained our great naval legacy. We must preserve it."
 BRA_R56_modernize_the_madeira_mamore_br230:0 "Modernize the Madeira-Mamoré BR-230"
 BRA_R56_modernize_the_madeira_mamore_br230_desc:0 "Madeira-Mamoré was built by Percival Farquhar as part of its project to interconnect across America Modernize and expand their lines may increase the mobility of our troops in the North.."
 BRA_R56_modernize_the_sorocabana:0 "Modernize the Sorocabana"
 BRA_R56_modernize_the_sorocabana_desc:0 "The Sorocabana part of the railway system in the state of São Paulo and Paraná, is part of the largest rail network in the country I expanded it means increasing our ability to flow and military movement.."
 BRA_R56_restore_the_empire:0 "Restore the Empire"
 BRA_R56_restore_the_empire_desc:0 "Since 1889 the royal question has been a target of debate within our intellectual circles. We can call our Emperor to lead Brazil once more."
 BRA_R56_expand_the_universities:0 "Expand the Universities"
 BRA_R56_expand_the_universities_desc:0 "More universities mean more learners and more progress. Transforming small interior colleges into major educational centers should be a priority of the government."
 BRA_R56_motorize_the_army:0 "Motorize the Army"
 BRA_R56_motorize_the_army_desc:0 "During the civil war, the Paulista Army mobilized the great centers of production of automobiles of the capital. It used its production to move its soldiers quickly between the Legalist Trenches. We can create a new vehicle production manufacturer based on Duque de Caxias."
 BRA_R56_natal_naval_dockyard:0 "Natal Naval Dockyard"
 BRA_R56_natal_naval_dockyard_desc:0 "In Natal, a naval dockyard shall provide Northeastern Brazil with a new window to the world stage. We can expect the transport of tons of imported and exported goods through it. The port will have, mostly, civil utility, but we can use it for our military purposes."
 BRA_R56_national_institutes:0 "National Institutes"
 BRA_R56_national_institutes_desc:0 "The creation of National Institutes as advanced research centers will significantly accelerate the country's technological progress."
 BRA_R56_national_security_law:0 "National Security Law"
 BRA_R56_national_security_law_desc:0 "The National Security Law is one of the transition points between the legal heritage of the Constitutionalist Revolution and the New Brazilian Politics; we should implement it for the sake of nation-wide unity."
 BRA_R56_federal_centre_for_nuclear_research:0 "Federal Centre for Nuclear Research"
 BRA_R56_federal_centre_for_nuclear_research_desc:0 "With a Nuclear Research Center Brazil can develop both the obliteration capacity of their enemies as the potential of infinite energy."
 BRA_R56_nationalize_major_infrastructure_hubs:0 "Nationalize Major Infrastructure Hubs"
 BRA_R56_nationalize_major_infrastructure_hubs_desc:0 "Having been chiefly built by the British and Americans, some infrastructure is vital in the country's operation and provider of large profits. The government must ensure that its benefits are enjoyed by nationals and not by foreigners through decrees."
 BRA_R56_embolden_patriotism:0 "Embolden Patriotism"
 BRA_R56_embolden_patriotism_desc:0 "The [BRA.GetAdjective] nation requires the citizens of all corners of its vast domains to dedicate themselves to its maintenance, defense, and development. [BRA.GetAdjective]s must respond to these aspirations, whether they are for the national good or their national freedoms."
 BRA_R56_petrobras:0 "Petrobrás"
 BRA_R56_petrobras_desc:0 "Petrobras will be the state-owned company of Brazilian Petrol and is therefore responsible for exploring, refining, and expanding oil wells throughout the country."
 BRA_R56_skewer_the_green_hens:0 "Skewer the Green Hens"
 BRA_R56_skewer_the_green_hens_desc:0 "The Green Hens (as we have come to call the Integralists) are violently opposing the people's righteous takeover of Brazil. To ensure the revolution's victory, our party leaders must personally lead our armies against fascism!"
 BRA_R56_institute_the_polaca:0 "Institute the 'Polaca'"
 BRA_R56_institute_the_polaca_desc:0 "The Fourth Constitution of Brazil was promulgated by Getulio Vargas in order to implement a system centered on the President. It is recognized as the first milestone in the consolidation of the New State"
 BRA_R56_polytechnical_colleges:0 "Polytechnical Colleges"
 BRA_R56_polytechnical_colleges_desc:0 "The construction of Polytechnical Colleges in the great urban centers of the country will train thousands of young people able to serve the country in their respective productive functions."
 BRA_R56_embrace_populism:0 "Embrace Populism"
 BRA_R56_embrace_populism_desc:0 "The great Brazilian leaders canvass support of large masses through radical ideological discourses that move the collective opinion."
 BRA_R56_department_of_press_and_propaganda:0 "Department of Press and Propaganda"
 BRA_R56_department_of_press_and_propaganda_desc:0 "Getúlio Vargas, magnanimous leader of [BRA.GetNameDef] and [BRA.GetAdjective] people, is the greatest hope for guaranteeing our nation's and her people's profound well-being. His permanence in power is essential for the development of the country and the prosperity of all its citizens, being assured through the actions of the new Department of Press and Propaganda (DIP), led by Mr. Filinto Muller."
 BRA_R56_a_collection_of_states:0 "A Collection of States"
 BRA_R56_a_collection_of_states_desc:0 "On July 9, 1932, the state of Sao Paulo, suffocated by the results of the Revolution of 1930, saw no option but to declare war on Vargas's regime. Today we perceive irrefutable truths in what the Paulistas screamed atop the trenches. The Dictatorship of Vargas is an affront to the honor of a country so diverse as of culture and so free as of people as [BRA.GetNameDef]: It is time to re-democratize the Republic."
 BRA_R56_plan_salte:0 "Plan Salte"
 BRA_R56_plan_salte_desc:0 "The SALTE (Health, Food, Transportation and Education) Plan aims to stimulate and improve the development of health, food, transportation, and energy sectors throughout [BRA.GetNameDef], thus helping and improving the living conditions of the [BRA.GetAdjective] population."
 BRA_R56_national_petroleum_council:0 "National Petroleum Council"
 BRA_R56_national_petroleum_council_desc:0 "The government can nationalize the new oil wells discovered in Salvador, guaranteeing the country's sovereignty over this essential resource."
 BRA_R56_secret_research_department:0 "Secret Research Department"
 BRA_R56_secret_research_department_desc:0 "The creation of technology centers solely dedicated to essential projects of the Armed Forces will prove crucial for the maintenance of national security."
 BRA_R56_submarines:0 "Submarines"
 BRA_R56_submarines_desc:0 "Submarines are an effective way to patrol the shores and sink enemy ships on the high seas."
 BRA_R56_expand_the_private_industry:0 "Expand the Private Industry"
 BRA_R56_expand_the_private_industry_desc:0 "Through guarantees and exemptions the federal government can encourage the creation of new workshops and manufacturers across the country."
 BRA_R56_technical_schools:0 "Technical Schools"
 BRA_R56_technical_schools_desc:0 "The sponsorship of Technical Schools by the state will form more technicians and specialists focused on industrial production in [BRA.GetNameDef]."
 BRA_R56_reinstituite_the_technocratic_system:0 "Reinstituite the Technocratic System"
 BRA_R56_reinstituite_the_technocratic_system_desc:0 "During the First Republic, Meritocracy and Sciences were highly valued by the nation's private and public institutions. The scientific progress of this time is undeniable, with the introduction of electricity and steel by great entrepreneurs. With the advent of new technologies, the readoption of these values will be of significant benefit to the country's technological progress."
 BRA_R56_tenenge:0 "TENENGE"
 BRA_R56_tenenge_desc:0 "The National Engineering Technique is an electromechanical engineering and heavy industrial construction company focused on port infrastructure and waterway management in [BRA.GetNameDef]. We can contract it to expand the operations of Vale do Rio Doce and Petrobrás to larger scales."
 BRA_R56_federal_installations_in_the_amazon:0 "Federal Installations in the Amazon"
 BRA_R56_federal_installations_in_the_amazon_desc:0 "The Jungle Warfare Instruction Center (CIGS) is a military organization of the [BRA.GetAdjective] Army based in Manaus, designed to qualify military leaders of small fractions, such as jungle warriors, combatants capable of carrying out missions of a military nature in the areas more inhospitable areas of the Brazilian Amazon Forest as well as similar environments."
 BRA_R56_tire_de_guerra:0 "Tiro de Guerra"
 BRA_R56_tire_de_guerra_desc:0 "The \"Tiro de Guerra\" was instituted as an Army policy in 1916, consisting in the basic training of unconquered reserves of the country in the case of the declaration of the State of Siege. The Expansion of this program ensures that the columns of the army are filled by men better trained and closer to becoming fit for combat."
 BRA_R56_vale_do_rio_doce:0 "Vale do Rio Doce"
 BRA_R56_vale_do_rio_doce_desc:0 "Vale do Rio Doce will be the state company extracting the most various ores, such as Bauxite and Iron, and reprocessing into Aluminum and Steel."
 BRA_R56_the_integral_state:0 "The Integral State"
 BRA_R56_the_integral_state_desc:0 "To progress in peace, to see its efforts fruitful, to achieve prestige at home and abroad, a nation must have perfect awareness of the Principle of Authority. We need an Authority capable of taking initiatives for the benefit of everyone everywhere."
 BRA_R56_duty_free_zone_of_manaus:0 "Duty-Free Zone of Manaus"
 BRA_R56_duty_free_zone_of_manaus_desc:0 ""
 BRA_R56_military_complex_of_the_parnaiba_valley_desc:0 "The govero is able to subsidize the construction of an industrial complex war weapons in the Valley of the Parnaíba River, in northeastern Brazil."
 BRA_R56_restore_the_empire_t:0 "Brazil seeks imperialist policy."
 BRA_has_coffee_barons_tt:0 "Has national spirit §YThe Coffee Barons§!"