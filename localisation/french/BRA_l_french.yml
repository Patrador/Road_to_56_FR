 BRA_firmo_freire_do_nascimento:0 "Firmo Freire do Nascimento"
 BRA_license_with_the_soviets: "Accords de licence avec les [SOV.GetAdjective]s"
 BRA_license_with_the_soviets_desc: "Nos recherches sont à la traîne par rapport aux grandes puissances. Il faudra beaucoup de temps pour renforcer nos capacités, mais d'ici là, nous pourrions travailler à obtenir l'autorisation de produire des équipements Soviétique au Brésil. Compte tenu des coûts d'un tel accord, nous devrions essayer de négocier une légère remise."
 BRA_license_with_the_soviets_tt: "([SOV.GetFlag]§Y[SOV.GetName]§!) Obtient l'événement '§Y[BRA.GetNameDefCap] Cherche un accord de production sous licence§!'\n\nIls sont plus susceptibles d'accepter s'ils ont une §Yhaute opinion de nous !§!"
 BRA_the_latin_american_socialist_cooperative: "La coopérative socialiste latino-américaine"
 BRA_the_latin_american_socialist_cooperative_desc: "Il y a beaucoup d’autres pays qui partagent nos idées sur ce que devrait être la société communiste. Il est temps que nous nous ouvrions à la coopération avec ces pays afin que nous puissions, ensemble, défendre notre cause !"
 BRA_establish_ulasr: "Créer l'ULASR"
 BRA_establish_ulasr_desc: "Notre mouvement révolutionnaire continue d’éroder les structures de la société bourgeoise à travers le continent. Il est clair que nous ne sommes plus un mouvement de [ROOT.GetAdjective], nous sommes un mouvement de Sud-Américains et il est temps que nos structures politiques représentent mieux ce changement."
 BRA_end_south_american_capitalism: "Mettre fin au capitalisme sud-américain"
 BRA_end_south_american_capitalism_desc: "La démocratie bourgeoise et le capitalisme continuent de saper les droits et les conditions de vie de nombreux Sud-Américains. Nous devons faire tout ce qui est en notre pouvoir pour libérer nos camarades de tout le continent de leurs oppresseurs."
 BRA_pedro_henrique_iii:0 "Dom Pedro III"
 BRA_R56_the_second_communist_putsch:0 "Le deuxième putsch communiste"
 BRA_R56_the_second_communist_putsch_desc:0 "L’Alliance nationale de libération a tenté un coup d’État contre le président Vargas. À présent, avec le soutien des travailleurs et du peuple, les marxistes ont l’opportunité de forger au Brésil une glorieuse république socialiste égalitaire !"
 BRA_R56_non_dvcor_dvco:0 "Non Dvcor Dvco"
 BRA_R56_non_dvcor_dvco_desc:0 "Après plus d’un siècle de vie constitutionnelle et de libéralisme, le pays a régressé en une dictature sans frein ni limite, qui nous dégrade et nous affaiblit aux yeux du monde civilisé !"
 BRA_R56_usiminas:0 "USIMINAS"
 BRA_R56_usiminas_desc:0 "Usinas Siderúrgicas de Minas Gerais S.A. sera une entreprise sidérurgique de premier plan dans la production et la commercialisation d’aciers laminés à chaud et à froid, de bobines, de plaques et d’aciers revêtus, principalement pour les secteurs des biens d’équipement et des biens de consommation, ainsi que pour l’industrie automobile."
 BRA_R56_a_revolta_da_armada:0 "La révolte de la flotte"
 BRA_R56_a_revolta_da_armada_desc:0 "Nous devons réajuster le comportement des navires [BRA.GetAdjective] et les tactiques des commandants de la marine à la guerre navale moderne. Nous pouvons prendre comme référence la Révolte de la Marine de 1893."
 BRA_R56_analyze_the_paulista_war:0 "Analyser la guerre de Paulista"
 BRA_R56_analyze_the_paulista_war_desc:0 "La guerre civile brésilienne s’est révélée être un terrain d’essai pour des tactiques de bataille potentiellement efficaces."
 BRA_R56_minas_gerais_war_doctrine:0 "Doctrine de guerre du Minas Gerais"
 BRA_R56_minas_gerais_war_doctrine_desc:0 "Pendant le conflit, les troupes de Minas Gerais et les officiers de l’État qui commandaient l’armée étaient conscients de l’incapacité de São Paulo à soutenir la guerre sur le long terme. Les Mineiros creusèrent donc des tranchées. Des mitrailleuses fixes soutenaient leurs positions, et le feu de l’artillerie nationale appuyait leurs avancées lentes mais sûres."
 BRA_R56_sao_paulos_war_doctrine:0 "Doctrine de guerre de Sao Paulo"
 BRA_R56_sao_paulos_war_doctrine_desc:0 "Les forces publiques paulistes ont adopté la guerre mobile et le blitz pendant le conflit. Les plans de l’État de São Paulo prévoyaient un mouvement rapide et foudroyant vers Rio de Janeiro par la vallée du Paraíba, la protection de l’arrière étant assurée par le soutien des autres États."
 BRA_R56_heavy_artillery:0 "Artillerie lourde"
 BRA_R56_heavy_artillery_desc:0 "Bénéficiant de plus de ressources que son adversaire, l’Union a importé de l’artillerie de l’étranger. Précis, les canons ont anéanti une escouade entière de Paulistes en un seul tir. Nous pouvons aider nos entreprises militaro-industrielles à développer leurs centres industriels à un niveau jamais atteint."
 BRA_R56_the_voice_of_brazil:0 "The Voice of Brazil"
 BRA_R56_the_voice_of_brazil_desc:0 "'The Voice of Brazil' is a mandatory diffusion state radio newscast which airs daily in all public radio stations in Brazil, at 19 pm (GMT), with duration of one hour.' It was created by the Brazilian Government as a means of dissemination of the achievements of the State"
 BRA_R56_stufy_the_war_of_attrition:0 "Étudier la guerre d’attrition"
 BRA_R56_stufy_the_war_of_attrition_desc:0 "Avec patience, supériorité technologique et l’usage des balles plutôt que des hommes, les troupes de Minas Gerais ont été les plus efficaces de la guerre, offrant au Brésil une victoire rapide sur les Paulistes. Nous ne devons pas nier l’héritage des Mineiros."
 BRA_R56_federal_economic_bank:0 "Banque économique fédérale"
 BRA_R56_federal_economic_bank_desc:0 "La Caixa Econômica Federal (CEF), également connue sous le nom de Caixa, est un établissement financier sous la forme d’une entreprise publique du gouvernement fédéral [BRA.GetAdjective]. Ses actifs et son autonomie administrative lui permettent de disposer de succursales dans tout le pays."
 BRA_R56_construct_the_belem_naval_dockyard:0 "Construire le chantier naval de Belém"
 BRA_R56_construct_the_belem_naval_dockyard_desc:0 "La construction du port de Belém offre au pays une base stratégique dans le Nord, capable de soutenir les vastes flottes de la Fédération et servant de base pour des opérations d’invasion au nord de l’équateur."
 BRA_R56_shock_and_awe:0 "Choc et effroi"
 BRA_R56_shock_and_awe_desc:0 "Les Paulistes nous ont prouvé qu’à défaut de supériorité numérique, la vitesse et l’autonomie des troupes garantissent le succès au combat. Adoptions ces tactiques pour assurer une meilleure efficacité au combat et une victoire rapide et écrasante sur nos ennemis !"
 BRA_R56_bndes:0 "BNDES"
 BRA_R56_bndes_desc:0 "La Banque nationale pour le développement économique et social sera une entreprise publique fédérale ayant son siège à Rio de Janeiro et dont l’objectif principal est de financer des investissements à long terme dans tous les secteurs de l’économie, ainsi que dans les domaines social, régional et environnemental."
 BRA_R56_eduardo_gomes_doctrine:0 "La doctrine d’Eduardo Gomes"
 BRA_R56_eduardo_gomes_doctrine_desc:0 "Bien que utilisés par l’Union pendant la guerre civile, les bombardiers sont devenus plus précis et meurtriers depuis la dernière fois que le Brésil les a employés. Le brigadier Eduardo Gomes, durant ce conflit, a bombardé Campinas, affaiblissant une grande partie des infrastructures de la ville avec une escadrille modeste. Nous l’instituerons chef de l’armée de l’air."
 BRA_R56_a_new_federal_capital_brasilia:0 "Une nouvelle capitale fédérale : Brasília"
 BRA_R56_a_new_federal_capital_brasilia_desc:0 "Le déplacement de la capitale vers l’intérieur du pays constituait l’un des objectifs nationaux depuis l’Empire de Pedro II. Cela présentait non seulement un intérêt en matière de sécurité nationale, en garantissant que la capitale ne puisse être la cible d’invasions navales, mais aussi comme un moyen de promouvoir le développement de l’intérieur. Commençons maintenant la construction de cette nouvelle capitale."
 BRA_R56_a_new_federal_capital_brasilia_tooltip:0 "Passons à l’ère républicaine intermédiaire. De nouveaux partis politiques sont en place et, ainsi, une nouvelle classe politique voit le jour."
 BRA_R56_the_brazilian_action:0 "L’Action brésilienne"
 BRA_R56_the_brazilian_action_desc:0 "Similaire à l’Action française, l’Action brésilienne globale est un mouvement brésilien réactionnaire, inspiré par les grandes gloires et les traditions passées de la nation. Sa réflexion sur le centre éducatif et culturel du pays s’avérera importante pour le renforcement de l’identité patriotique nationale."
 BRA_R56_ministry_of_aeronautics:0 "Ministère de l’aéronautique"
 BRA_R56_ministry_of_aeronautics_desc:0 "Avec la création du Ministère de l’aéronautique, le gouvernement peut désormais gérer cette nouvelle branche des Forces armées de la République."
 BRA_R56_close_air_support:0 "Appui aérien rapproché"
 BRA_R56_close_air_support_desc:0 "La réactivation et la modernisation de notre usine d’avions à Lagoa Santa, située dans la région métropolitaine de Belo Horizonte, nous aideront à accroître la taille de notre force aérienne."
 BRA_R56_the_sugar_belt:0 "La ceinture sucrière"
 BRA_R56_the_sugar_belt_desc:0 "Avec l’introduction de la calcérisation et de l’irrigation localisée, malgré les sols acides et l’air sec, nous pouvons créer dans le Triângulo Mineiro et le Bas Goiás une nouvelle hyper-région de culture de la canne à sucre. Obsolète depuis des siècles, elle a un potentiel futur, les prévisions annonçant l’utilisation de l’alcool dans les usines industrielles et comme carburant."
 BRA_R56_the_soy_belt:0 "La Ceinture du soja"
 BRA_R56_the_soy_belt_desc:0 "Avec l’introduction de méthodes avancées de drainage et la mécanisation de l’agriculture au niveau national, il est possible de cultiver le soja dans le Mato Grosso, une région isolée. Le soja n’a jamais été cultivé sur le sol national. Il représente un potentiel en tant qu’aliment, pour l’exportation et comme moyen de colonisation de l’intérieur du pays."
 BRA_R56_support_heavy_industry_in_sao_paulo:0 "Soutenir l’Industrie Lourde à São Paulo"
 BRA_R56_support_heavy_industry_in_sao_paulo_desc:0 "La région métropolitaine de São Paulo est le plus grand centre industriel du pays, de l’Amérique latine et, avec le soutien du gouvernement, l’un des plus grands, voire le plus grand, d’Amérique."
 BRA_R56_grande_valley_military_complex:0 "Complexe Militaire de la Grande Vallée"
 BRA_R56_grande_valley_military_complex_desc:0 "Le gouvernement peut subventionner la construction d’un complexe industriel d’armement dans la Vallée du Rio Grande, qui comprend l’Ouest Paulista et le Triângulo Mineiro."
 BRA_R56_military_complex_of_the_parana_valley:0 "Complexe Militaire de la Vallée du Paraná"
 BRA_R56_military_complex_of_the_parana_valley_desc:0 "Le gouvernement peut subventionner la construction d’un complexe industriel d’armement dans la vallée du fleuve Paraná, qui comprend le sud de São Paulo et presque la totalité du Paraná."
 BRA_R56_military_complex_of_the_parnaiba_valley:0 "Complexe Militaire de la Vallée du Parnaíba"
 BRA_R56_national_defense_council:0 "Conseil National de Défense"
 BRA_R56_national_defense_council_desc:0 "Le Conseil National de Défense est un organe consultatif du président du Brésil en matière de sécurité nationale, de politique étrangère et de stratégies de défense, créé par le dernier président de la 1ʳᵉ République, Washington Luis. Il a pour rôle de conseiller le président en cas de déclaration de guerre ou d’établissement de la paix, de proclamation de l’état de défense, de l’état de siège ou d’interventions fédérales."
 BRA_R56_under_a_single_banner:0 "Sous une Bannière Unique"
 BRA_R56_under_a_single_banner_desc:0 "La diversité culturelle et ethnique du [BRA.GetNameDefCap] et son rôle de pionnier dans les mouvements socio-libéraux et néo-marxistes sont un atout comme bastion de la Révolution des Travailleurs. L’endoctrinement de la pensée gramsciste à travers le système éducatif national profitera à l’État révolutionnaire."
 BRA_R56_encouracados:0 "Cuirassés"
 BRA_R56_encouracados_desc:0 "Depuis son indépendance, le Brésil dispose des plus grands monstres des mers dans son arsenal. Nous ne ferons pas autrement."
 BRA_R56_council_for_economics_and_finances:0 "Conseil pour l’Économie et les Finances"
 BRA_R56_council_for_economics_and_finances_desc:0 "Le Conseil Technique d’Économie et de Finances a été créé pour assister le président dans les décisions économiques et stratégiques du pays."
 BRA_R56_the_october_manifesto:0 "Le Manifeste d’Octobre"
 BRA_R56_the_october_manifesto_desc:0 "La Nation [BRA.GetAdjective] doit être organisée, unie, indivisible, forte, puissante, riche, prospère et heureuse. Pour cela, nous avons besoin que tous les [BRA.GetAdjective] soient unis. Mais [BRA.GetNameDef] ne peut atteindre l’union intime et parfaite de ses enfants tant qu’il existe des États au sein de l’État et des partis politiques fractionnant la Nation."
 BRA_R56_modernize_the_electrical_infrastructure:0 "Étendre l’Infrastructure Électrique"
 BRA_R56_modernize_the_electrical_infrastructure_desc:0 "L’expansion du réseau électrique dans toutes les capitales d’État et centres urbains tels que l’Ouest Paulista et l’Espírito Santo améliorera la qualité de vie des [BRA.GetAdjective] et l’efficacité de l’industrie nationale."
 BRA_R56_expand_the_high_voltage_grid:0 "Étendre le Réseau Haute Tension"
 BRA_R56_expand_the_high_voltage_grid_desc:0 "L’extension du réseau électrique vers des régions industriellement peu développées, comme le Triângulo Mineiro, le Paraná et la Bahia, pourrait créer de nouveaux centres de production et renforcer le progrès de notre nation."
 BRA_R56_end_the_occupation:0 "Mettre un terme à l'occupation"
 BRA_R56_end_the_occupation_desc:0 "Les États de [498.GetName] et [1004.GetName] ont été sous loi martiale depuis que les rébellions communistes dans la région ont été écrasées à la fin de 1935. Avec la stabilité désormais rétablie, il est temps de rétablir la vie normale dans ces États."
 BRA_R56_legacy_of_martinelli:0 "l'héritage de Martinelli"
 BRA_R56_legacy_of_martinelli_desc:0 "L’immigrant Giuseppe Martinelli a fait fortune au Brésil grâce au commerce transatlantique. À São Paulo, Martinelli visait à construire le plus haut bâtiment d’Amérique latine. Il l’a fait en ajustant la structure qui était surchargée mais n’autorisait pas la pose des fondations, gagnant ainsi du temps et des ressources tout en garantissant la construction du monument. Nous pouvons beaucoup apprendre de cela."
 BRA_R56_imbel:0 "IMBEL"
 BRA_R56_imbel_desc:0 "Au lieu de motoriser leur infanterie, les Mineiros ont augmenté leur efficacité au combat. L’équipement de l’infanterie légaliste était plus moderne, rapide et précis comparé à celui des Paulistas, facilitant la défense des tranchées. Nous pouvons signer des contrats avec nos fabricants d’armes pour re-moderniser notre infanterie."
 BRA_R56_the_estado_novo:0 "L'Estado Novo"
 BRA_R56_the_estado_novo_desc:0 "Dans sa sagesse complète et son esprit industriel pionnier, un État central est capable d’assurer le bien-être général des citoyens de la nation et la prospérité de ses entrepreneurs. Ce lien éternel entre les travailleurs, guerriers et entrepreneurs volontaires de la République garantira une union [BRA.GetAdjective] durable."
 BRA_R56_the_brazilian_expeditionary_force:0 "Les forces expéditionnaires [BRA.GetAdjective]s."
 BRA_R56_the_brazilian_expeditionary_force_desc:0 "Nous avons la capacité logistique, tactique, organisationnelle, industrielle et numérique d’organiser des expéditions à l’étranger afin de défendre les intérêts de la République contre ceux qui osent attaquer."
 BRA_R56_strengthen_local_governments:0 "Renforcer les Gouvernements Locaux"
 BRA_R56_strengthen_local_governments_desc:0 "Le [BRA.GetNameDefCap] est culturellement, géographiquement et économiquement divisé. Accorder une autonomie relative aux différentes unités fédératives sous le Gouvernement Fédéral est un moyen efficace de garantir la liberté de leurs citoyens et le plein exercice de leurs droits constitutionnels."
 BRA_R56_federal_institutes:0 "Instituts Fédéraux"
 BRA_R56_federal_institutes_desc:0 "Les Instituts Fédéraux sont des extensions des universités dédiées exclusivement à l’innovation technologique pratique."
 BRA_R56_federal_universities:0 "Universités fédérales"
 BRA_R56_federal_universities_desc:0 "Les universités fédérales sont à la fois des centres éducatifs et des pôles d’innovation technologique. La bonne exploitation de leurs profits, sur le plan technologique, est attractive pour les efforts du gouvernement."
 BRA_R56_fiesp:0 "FIESP"
 BRA_R56_fiesp_desc:0 "La Fédération des Industries de l’État de São Paulo représente des milliers de syndicats et entreprises de l’État et articule les plans du gouvernement avec leur volonté d’unir affaires et plaisir, encourageant notre capacité à progresser entre nouvelles innovations manufacturières dans le secteur consommateur et militaire."
 BRA_R56_gerdau:0 "GERDAU"
 BRA_R56_gerdau_desc:0 "Gerdau S.A., également appelée Groupe Gerdau, est une société sidérurgique [BRA.GetAdjective]. L’embauche de Gerdau pour développer notre secteur de l’acier et notre infrastructure trans-industrielle est à l’étude."
 BRA_R56_industrial_innovations:0 "Innovations industrielles"
 BRA_R56_industrial_innovations_desc:0 "Notre industrie désormais largement modernisée est prête à relever les défis de notre époque : concevoir et produire du matériel moderne pour assurer notre victoire sur le terrain."
 BRA_R56_matarazzo_united_industries:0 "Industries Unies Matarazzo"
 BRA_R56_matarazzo_united_industries_desc:0 "Les usines Indústrias Reunidas Matarazzo ont été fondées par l’immigrant Francesco Matarazzo dans les années 20. Le groupe de 360 usines de fabrication de divers biens peut être étendu pour répondre à la majorité de la demande industrielle du pays."
 BRA_R56_support_the_itabira_mines:0 "Soutenir les Mines d’Itabira"
 BRA_R56_support_the_itabira_mines_desc:0 "Les mines d’Itabira, dans le Minas Gerais, font partie du Quadrilátero Ferrífero, le plus grand gisement de fer et de bauxite du pays et l’un des plus grands au monde. S’assurer que les minéraux extraits y soient utilisés uniquement par le [BRA.GetNameDef] garantira notre souveraineté minérale."
 BRA_R56_establish_the_commerce_ministry:0 "Établir le ministère du commerce"
 BRA_R56_establish_the_commerce_ministry_desc:0 "Le Ministère du Travail, du Commerce et de l’Industrie assistera le gouvernement dans les questions d’expansion et de modernisation industrielle."
 BRA_R56_lobato:0 "Lobato"
 BRA_R56_lobato_desc:0 "Un incident entre deux voisins à Lobato, Bahia, a remis en question l’affirmation du gouvernement selon laquelle il n’y a pas de pétrole sur les terres [BRA.GetAdjective]."
 BRA_R56_roll_out_mechanized_vehicles:0 "Déployer les véhicules mécanisés"
 BRA_R56_roll_out_mechanized_vehicles_desc:0 "Une des prouesses les plus impressionnantes de l’État de São Paulo durant la guerre fut la construction de trains blindés. Chargés de café, ces trains étaient protégés par de lourdes plaques de métal, équipés de mitrailleuses aux fenêtres et d’un canon à l’avant. Nous pouvons soutenir certains constructeurs de camions dans la création d’une entreprise pour répondre à nos besoins en unités mécanisées."
 BRA_R56_improve_military_education:0 "Améliorer l'éducation militaire"
 BRA_R56_improve_military_education_desc:0 "L’École Supérieure de Guerre vise à développer et consolider les connaissances nécessaires à l’exercice des fonctions de haut commandement et de conseil pour la planification de la Défense nationale, incluant les aspects fondamentaux de la sécurité et du développement."
 BRA_R56_the_brazilian_air_force:0 "L'armée de l'air brésilienne"
 BRA_R56_the_brazilian_air_force_desc:0 "Instituer l’armée de l’air comme composante majeure des forces armées de la république est essentiel pour garantir la maîtrise des cieux [BRA.GetAdjective]."
 BRA_R56_florianismo:0 "Florianismo"
 BRA_R56_florianismo_desc:0 "Moderniser la marine est crucial pour assurer le pouvoir maritime [BRA.GetAdjective]. Floriano Peixoto fut le premier président-amiral de la République. Durant son mandat, il préserva notre grand héritage naval. Nous devons le protéger."
 BRA_R56_modernize_the_madeira_mamore_br230:0 "Moderniser la BR-230 Madeira-Mamoré"
 BRA_R56_modernize_the_madeira_mamore_br230_desc:0 "La Madeira-Mamoré, construite par Percival Farquhar pour interconnecter l’Amérique, peut voir sa modernisation et l’extension de ses lignes augmenter la mobilité de nos troupes dans le Nord."
 BRA_R56_modernize_the_sorocabana:0 "Moderniser la Sorocabana"
 BRA_R56_modernize_the_sorocabana_desc:0 "La Sorocabana, partie du réseau ferroviaire de São Paulo et du Paraná, constitue une section majeure du réseau national. Son expansion accroît notre capacité de transport et le mouvement militaire."
 BRA_R56_restore_the_empire:0 "Restaurer l’Empire"
 BRA_R56_restore_the_empire_desc:0 "Depuis 1889, la question royale fait débat dans nos cercles intellectuels. Nous pouvons appeler notre empereur à diriger à nouveau le Brésil."
 BRA_R56_expand_the_universities:0 "Développer les universités"
 BRA_R56_expand_the_universities_desc:0 "Plus d’universités signifient plus d’apprenants et plus de progrès. Transformer les petites universités de l’intérieur en grands centres éducatifs doit être une priorité du gouvernement."
 BRA_R56_motorize_the_army:0 "Motoriser l’armée"
 BRA_R56_motorize_the_army_desc:0 "Durant la guerre civile, l’Armée Paulista utilisa la production automobile des grands centres pour déplacer rapidement ses soldats entre les tranchées légalistes. Nous pouvons créer un nouveau fabricant de véhicules basé à Duque de Caxias."
 BRA_R56_natal_naval_dockyard:0 "Chantier naval de Natal"
 BRA_R56_natal_naval_dockyard_desc:0 "À Natal, un chantier naval offrira au Nord-Est du Brésil une nouvelle fenêtre sur la scène mondiale. Le port permettra le transport de tonnes de marchandises importées et exportées, principalement à usage civil, mais utilisable à des fins militaires."
 BRA_R56_national_institutes:0 "Instituts nationaux"
 BRA_R56_national_institutes_desc:0 "La création d’Instituts nationaux comme centres de recherche avancée accélérera significativement le progrès technologique du pays."
 BRA_R56_national_security_law:0 "Loi de sécurité nationale"
 BRA_R56_national_security_law_desc:0 "La Loi de sécurité nationale constitue un point de transition entre l’héritage juridique de la Révolution constitutionnaliste et la Nouvelle Politique brésilienne ; nous devons la mettre en œuvre pour l’unité nationale."
 BRA_R56_federal_centre_for_nuclear_research:0 "Centre fédéral de recherche nucléaire"
 BRA_R56_federal_centre_for_nuclear_research_desc:0 "Avec un centre de recherche nucléaire, le Brésil peut développer à la fois la capacité de destruction de ses ennemis et le potentiel d’une énergie quasi illimitée."
 BRA_R56_nationalize_major_infrastructure_hubs:0 "Nationaliser les grandes infrastructures"
 BRA_R56_nationalize_major_infrastructure_hubs_desc:0 "Principalement construites par les Britanniques et Américains, certaines infrastructures sont vitales pour le pays et génèrent de grands profits. Le gouvernement doit veiller à ce que leurs bénéfices reviennent aux nationaux et non aux étrangers."
 BRA_R56_embolden_patriotism:0 "Renforcer le patriotisme"
 BRA_R56_embolden_patriotism_desc:0 "La nation [BRA.GetAdjective] exige que ses citoyens se consacrent à son maintien, sa défense et son développement. Les [BRA.GetAdjective] doivent répondre à ces aspirations, pour le bien national et leurs libertés."
 BRA_R56_petrobras:0 "Petrobrás"
 BRA_R56_petrobras_desc:0 "Petrobras sera la compagnie pétrolière publique du Brésil et sera donc responsable de l'exploration, du raffinage et de l'expansion des puits de pétrole à l'échelle nationale."
 BRA_R56_skewer_the_green_hens:0 "Éliminer les Green Hens"
 BRA_R56_skewer_the_green_hens_desc:0 "Les Green Hens (comme nous appelons les Intégralistes) s’opposent violemment à la juste reprise du pouvoir par le peuple. Pour garantir la victoire de la révolution, nos dirigeants doivent mener personnellement nos armées contre le fascisme !"
 BRA_R56_institute_the_polaca:0 "Instituer la “Polaca”"
 BRA_R56_institute_the_polaca_desc:0 "La Quatrième Constitution du Brésil, promulguée par Getúlio Vargas, institua un système centré sur le président. Elle est considérée comme la première étape de la consolidation de l’État nouveau."
 BRA_R56_polytechnical_colleges:0 "Collèges polytechniques"
 BRA_R56_polytechnical_colleges_desc:0 "La construction de collèges polytechniques dans les grands centres urbains formera des milliers de jeunes aptes à servir le pays dans leurs fonctions productives respectives."
 BRA_R56_embrace_populism:0 "Adopter le populisme"
 BRA_R56_embrace_populism_desc:0 "Les grands leaders brésiliens obtiennent le soutien des masses par des discours idéologiques radicaux qui mobilisent l’opinion collective."
 BRA_R56_department_of_press_and_propaganda:0 "Département de la presse et de la propagande"
 BRA_R56_department_of_press_and_propaganda_desc:0 "Getúlio Vargas, leader magnanime de [BRA.GetNameDef] et du peuple [BRA.GetAdjective], est l’espoir majeur pour garantir le bien-être de la nation et de son peuple. Sa permanence au pouvoir est essentielle pour le développement du pays et la prospérité de ses citoyens, assurée par le nouveau Département de la presse et de la propagande (DIP), dirigé par M. Filinto Muller."
 BRA_R56_a_collection_of_states:0 "Une collection d’États"
 BRA_R56_a_collection_of_states_desc:0 "Le 9 juillet 1932, l’État de São Paulo, étouffé par les suites de la Révolution de 1930, n’eut d’autre choix que de déclarer la guerre au régime de Vargas. Aujourd’hui, nous percevons des vérités irréfutables dans ce que les Paulistes criaient depuis les tranchées : la dictature de Vargas est une atteinte à l’honneur d’un pays aussi divers culturellement et aussi libre que [BRA.GetNameDef]. Il est temps de ré-démocratiser la République."
 BRA_R56_plan_salte:0 "Plan Salte"
 BRA_R56_plan_salte_desc:0 "Le plan SALTE vise à stimuler et améliorer le développement des secteurs de la santé, de l’alimentation, du transport et de l’énergie dans tout [BRA.GetNameDef], contribuant ainsi à améliorer les conditions de vie de la population [BRA.GetAdjective]."
 BRA_R56_national_petroleum_council:0 "Conseil national du pétrole"
 BRA_R56_national_petroleum_council_desc:0 "Le gouvernement peut nationaliser les nouveaux puits de pétrole découverts à Salvador, assurant ainsi la souveraineté du pays sur cette ressource essentielle."
 BRA_R56_secret_research_department:0 "Département de Recherche Secrète"
 BRA_R56_secret_research_department_desc:0 "La création de centres technologiques exclusivement dédiés aux projets essentiels des Forces Armées s’avérera cruciale pour le maintien de la sécurité nationale."
 BRA_R56_submarines:0 "Sous-marins"
 BRA_R56_submarines_desc:0 "Les sous-marins sont un moyen efficace de patrouiller les côtes et de couler les navires ennemis en haute mer."
 BRA_R56_expand_the_private_industry:0 "Développer l’Industrie Privée"
 BRA_R56_expand_the_private_industry_desc:0 "Grâce à des garanties et des exonérations, le gouvernement fédéral peut encourager la création de nouveaux ateliers et fabricants à travers le pays."
 BRA_R56_technical_schools:0 "Lycées techniques"
 BRA_R56_technical_schools_desc:0 "Le parrainage des Écoles Techniques par l’État formera davantage de techniciens et de spécialistes axés sur la production industrielle au [BRA.GetNameDef]."
 BRA_R56_reinstituite_the_technocratic_system:0 "Réinstaurer le Système Technocratique"
 BRA_R56_reinstituite_the_technocratic_system_desc:0 "Pendant la Première République, la Méritocratie et les Sciences étaient très valorisées par les institutions publiques et privées du pays. Le progrès scientifique de cette époque est indéniable, avec l’introduction de l’électricité et de l’acier par de grands entrepreneurs. Avec l’avènement de nouvelles technologies, la réadoption de ces valeurs sera d’un bénéfice significatif pour le progrès technologique du pays"
 BRA_R56_tenenge:0 "TENENGE"
 BRA_R56_tenenge_desc:0 "La Technique Nationale d’Ingénierie est une entreprise d’ingénierie électromécanique et de construction industrielle lourde, spécialisée dans les infrastructures portuaires et la gestion des voies navigables au [BRA.GetNameDef]. Nous pouvons la contracter pour étendre les opérations de Vale do Rio Doce et Petrobras à plus grande échelle."
 BRA_R56_federal_installations_in_the_amazon:0 "Installations Fédérales en Amazonie"
 BRA_R56_federal_installations_in_the_amazon_desc:0 "Le Centre d’Instruction de Guerre en Jungle (CIGS) est une organisation militaire de l’Armée [BRA.GetAdjective] basée à Manaus, destinée à qualifier les chefs militaires de petites fractions, comme les guerriers de la jungle, capables d’accomplir des missions militaires dans les zones les plus inhospitalières de la forêt amazonienne brésilienne et dans des environnements similaires."
 BRA_R56_tire_de_guerra:0 "Tiro de Guerra"
 BRA_R56_tire_de_guerra_desc:0 "Le « Tiro de Guerra » a été institué comme politique de l’Armée en 1916, consistant en la formation de base des réserves du pays non conquises en cas de déclaration de l’État de Siège. L’extension de ce programme assure que les colonnes de l’armée soient composées d’hommes mieux entraînés et plus proches d’être aptes au combat"
 BRA_R56_vale_do_rio_doce:0 "'Vale do Rio Doce'"
 BRA_R56_vale_do_rio_doce_desc:0 "Vale do Rio Doce sera l’entreprise d’État extrayant les minerais les plus divers, tels que la bauxite et le fer, et les retraitant en aluminium et en acier."
 BRA_R56_the_integral_state:0 "L’État Intégral"
 BRA_R56_the_integral_state_desc:0 "Pour progresser en paix, voir ses efforts fructifier, et atteindre le prestige au pays et à l’étranger, une nation doit avoir une conscience parfaite du Principe d’Autorité. Nous avons besoin d’une Autorité capable de prendre des initiatives pour le bien de tous, partout."
 BRA_R56_duty_free_zone_of_manaus:0 "Zone Franche de Manaus"
 BRA_R56_duty_free_zone_of_manaus_desc:0 ""
 BRA_R56_military_complex_of_the_parnaiba_valley_desc:0 "The government can subsidize the construction of an industrial armaments complex in the Parnaíba River Valley in northeastern Brazil."
 BRA_R56_restore_the_empire_t:0 "Le Brésil cherche une politique impérialiste."
 BRA_has_coffee_barons_tt:0 "A un esprit national §YLes Barons du Café§!"