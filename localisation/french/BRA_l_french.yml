 bra_feb_idea:0 "Les forces expéditionnaires [BRA.GetAdjective]s."
 bra_feb_idea_desc:0 "Savez-vous d'où je viens ? Je viens des collines, des fermes. De la jungle, des plantations de café. Du pays de la noix de coco. De la petite cabane où un est peu, deux est bon, trois est grand !"
 bra_national_security_law_idea:0 "Loi sur la sécurité nationale"
 bra_national_security_law_idea_desc:0 "La nouvelle loi sur la sécurité renforcera la sécurité des citoyens."
 bra_federal_universities_idea:0 "Universités fédérales"
 bra_federal_universities_idea_desc:0 "Les universités fédérales sont à la fois des centres d'enseignement et des noyaux d'innovations technologiques. La bonne exploitation de ses bénéfices sur le plan technologique attire les efforts du gouvernement."
