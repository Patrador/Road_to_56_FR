 NRU_australian_phosphate_idea:0 "Phosphate de Nauru"
 NRU_australian_phosphate_idea_desc:0 "Actuellement, nous importons de grandes quantités de phosphate depuis l’île de Nauru afin de soutenir notre secteur agricole."
