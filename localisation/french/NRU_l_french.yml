l_french:
 NRU_commander_ridge_phosphate:0 "Développer les dépôts de phosphate de Nauru"
 NRU_commander_ridge_phosphate_desc:0 "Command Ridge, ou Peak Janor à Nauruan, est le point culminant de l'île. C'est là que se trouve la majeure partie du phosphate.\n\nL'exploitation du phosphate est pratiquée par les puissances européennes à Nauru depuis son occupation par l'Allemagne pendant la guerre civile nauruane.\nLe phosphate offre à Nauru à la fois des avantages et des inconvénients, dont nous devons nous assurer de ne pas extraire trop ou trop peu afin de ne pas faire s'effondrer l'économie."
 NRU_commander_ridge_phosphate_2:0 "Développer les dépôts de phosphate de Nauru"
 NRU_commander_ridge_phosphate_2_desc:0 "Command Ridge, ou Peak Janor à Nauruan, est le point culminant de l'île. C'est là que se trouve la majeure partie du phosphate.\n\nL'exploitation du phosphate est pratiquée par les puissances européennes à Nauru depuis son occupation par l'Allemagne pendant la guerre civile nauruane.\nLe phosphate offre à Nauru à la fois des avantages et des inconvénients, dont nous devons nous assurer de ne pas extraire trop ou trop peu afin de ne pas faire s'effondrer l'économie."
 NRU_commander_ridge_phosphate_3:0 "Développer les dépôts de phosphate de Nauru"
 NRU_commander_ridge_phosphate_3_desc:0 "Command Ridge, ou Peak Janor à Nauruan, est le point culminant de l'île. C'est là que se trouve la majeure partie du phosphate.\n\nL'exploitation du phosphate est pratiquée par les puissances européennes à Nauru depuis son occupation par l'Allemagne pendant la guerre civile nauruane.\nLe phosphate offre à Nauru à la fois des avantages et des inconvénients, dont nous devons nous assurer de ne pas extraire trop ou trop peu afin de ne pas faire s'effondrer l'économie."
 NRU_reap_the_benefits_idea:0 "Récolter les bénéfices"
 NRU_phosphate_reservers:0 "Commerce de phosphate à Nauru"
 NRU_phosphate_reservers_majors:0 "Commerce de phosphate à Nauru"
 NRU_tribal_council:0 "Chefs de Nauru"
 NRU_tribal_council_desc:0 "Nauru compte 10 tribus, toutes dirigées par leurs chefs qui obéissent au roi. Ces tribus sont les §YEamwit, Eamwitmwit, Eaoru, Eamwidara, Iruwa, Eano, Deiboe, Ranibok, Emea et les Emangum.§!"
 NRU_oppression_of_opposition:0 "Répression de l'opposition"
 NRU_riots_of_48:0 "Émeutes nauruanes"
 NRU_establish_nauru_pacific_line:0 "Établir la Ligne Pacifique de Nauru"
 NRU_establish_nauru_pacific_line_desc:0 "Établir la Ligne Pacifique de Nauru est crucial pour nous permettre de commercer avec d'autres nations et de pouvoir nous autosuffire."
 NRU_continue_phosphate_mining:0 "Poursuivre l'exploitation des mines de phosphate"
 NRU_continue_phosphate_mining_desc:0 "L’extraction de phosphate est pratiquée à Nauru depuis de nombreuses années. Le phosphate est notre principale, et peut-être notre seule source de revenus. Si nous cessons de l’exploiter, nous risquons de plonger dans une crise économique pire que tout ce que nous avons connu jusqu’à présent."
 NRU_further_phosphate_extraction:0 "Extraction du phosphate"
 NRU_further_phosphate_extraction_desc:0 "L’extraction du phosphate est notre première étape en tant que nouveau pays pour construire le pays."
 NRU_futher_phosphate_extracion_two:0 "Extraction supplémentaire de phosphate"
 NRU_futher_phosphate_extracion_two_desc:0 ""
 NRU_researchers_abroad:0 "Inviter des chercheurs étrangers"
 NRU_researchers_abroad_desc:0 "Inviter des chercheurs étrangers peut nous aider grandement en matière d’économie."
 NRU_start_exporting_phosphate:0 "Préparations pour l'exportation"
 NRU_start_exporting_phosphate_desc:0 "Nous avons commencé à exploiter le phosphate à grande échelle. Il est peut-être temps de nous ouvrir au monde ?"
 NRU_free_market:0 "Le marché libre"
 NRU_free_market_desc:0 "Ouvrez-vous au Marché Libre !"
 NRU_reap_the_benefits:0 "Profitez des avantages"
 NRU_reap_the_benefits_desc:0 "Nous l’avons fait ! Nous vendons du phosphate comme jamais auparavant. Profitons des bénéfices que cela nous apporte, et ne regardons pas en arrière !"
 NRU_britian_phosphate:0 "Approcher l'Occident"
 NRU_britian_phosphate_desc:0 "Avec la nouvelle décennie, il est clair que la voie de la démocratie guidera l’avenir du monde. Nous suivrons ce chemin, comme nos voisins, et aiderons nos alliés à poser les fondations des nations démocratiques de demain."
 NRU_japanese_phosphate:0 "Coopération avec le Japon"
 NRU_japanese_phosphate_desc:0 "Le Japon s’est révélé être un adversaire qu’il ne faut pas sous-estimer, et cela s’applique aussi à nous. Si nous vendons notre phosphate aux Japonais au lieu d’essayer de nous opposer à eux, nous pourrions peut-être survivre à leur offensive dans le Pacifique."
 NRU_soviet_phosphate:0 "L'impensable"
 NRU_soviet_phosphate_desc:0 "La Russie devient chaque jour plus puissante, et il semble évident qu’elle pourrait tourner ses ambitions vers l’océan Pacifique. Si tel est le cas, il serait préférable de nous attirer ses faveurs afin d’éviter une confrontation."
 NRU_autonomy_for_the_tribes:0 "Restaurer l'ancien système"
 NRU_autonomy_for_the_tribes_desc:0 "L’ancien système de gouvernement de Nauru reposait sur douze chefs tribaux, chacun dirigeant sa propre tribu, sous l’autorité d’un roi qui pouvait, si nécessaire, leur donner des ordres pour faire appliquer ses lois. Ce système n’a plus été pratiqué depuis l’invasion de Nauru pendant la Grande Guerre. Cependant, avec la restauration de la monarchie, peut-être est-il temps de revenir à nos traditions."
 NRU_core_kiribati:0 "Intégrer le Royaume Apemama"
 NRU_core_kiribati_desc:0 "Le Royaume d’Apemama fut réduit en cendres par les colonialistes britanniques lorsqu’ils proclamèrent leur protectorat sur les îles Gilbert. Ce fut une violation de tous les droits et un acte d’humiliation envers les Gilbertins. Mais nous ne devons pas laisser les Britanniques anéantir le royaume sans conséquence. Enseignons-leur une leçon. Qu’ils voient ce que les Apemamans et les Nauruans unis peuvent accomplir !"
 nauru.1.t:0 "Nauru propose un accord sur les phosphates"
 nauru.1.desc:0 "[NRU.GetNameDef] nous a approchés pour proposer un accord : acheter les réserves de phosphate de Nauru, reconnues comme les plus pures au monde, en échange d’investissements économiques dans l’île. Ce serait une erreur de refuser cet accord, qui bénéficierait autant à nous qu’aux Nauruans.\nMais devons-nous vraiment investir dans une île aussi isolée, alors que nous pourrions obtenir du phosphate à meilleur prix ailleurs ?"
 nauru.1.a:0 "Ne vous inquiétez pas si je le fais !"
 nauru.1.b:0 "Quelle blague.."
 nauru.2.t:0 "Nauru propose un accord sur les phosphates"
 nauru.2.desc:0 "[NRU.GetNameDef] nous a approchés pour proposer un accord : acheter les réserves de phosphate de Nauru, reconnues comme les plus pures au monde, en échange d’investissements économiques dans l’île. Ce serait une erreur de refuser cet accord, qui bénéficierait autant à nous qu’aux Nauruans.\nMais devons-nous vraiment investir dans une île aussi isolée, alors que nous pourrions obtenir du phosphate à meilleur prix ailleurs ?"
 nauru.2.a:0 "Ce serait vraiment stupide"
 nauru.2.b:0 "Un Nauru quoi ?"
 nauru.3.t:0 "Aucun accord !"
 nauru.3.desc:0 ""
 nauru.3.a:0 "Mince alors !"
 nauru.4.t:0 "Nauru propose un accord sur les phosphates"
 nauru.4.desc:0 "[NRU.GetNameDef] nous a approchés pour proposer un accord : acheter les réserves de phosphate de Nauru, reconnues comme les plus pures au monde, en échange d’investissements économiques dans l’île. Ce serait une erreur de refuser cet accord, qui bénéficierait autant à nous qu’aux Nauruans.\nMais devons-nous vraiment investir dans une île aussi isolée, alors que nous pourrions obtenir du phosphate à meilleur prix ailleurs ?"
 nauru.4.a:0 "Ce serait vraiment stupide"
 nauru.4.b:0 "Qui sont-ils pour nous vendre des crottes d’oiseaux hors de prix ?"
