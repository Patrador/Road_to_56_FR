 NRU_commander_ridge_phosphate:0 "Développer les dépôts de phosphate de Nauru"
 NRU_commander_ridge_phosphate_desc:0 "Command Ridge, ou Peak Janor à Nauruan, est le point culminant de l'île. C'est là que se trouve la majeure partie du phosphate.\n\nL'exploitation du phosphate est pratiquée par les puissances européennes à Nauru depuis son occupation par l'Allemagne pendant la guerre civile nauruane.\nLe phosphate offre à Nauru à la fois des avantages et des inconvénients, dont nous devons nous assurer de ne pas extraire trop ou trop peu afin de ne pas faire s'effondrer l'économie."
 NRU_commander_ridge_phosphate_2:0 "Développer les dépôts de phosphate de Nauru"
 NRU_commander_ridge_phosphate_2_desc:0 "Command Ridge, ou Peak Janor à Nauruan, est le point culminant de l'île. C'est là que se trouve la majeure partie du phosphate.\n\nL'exploitation du phosphate est pratiquée par les puissances européennes à Nauru depuis son occupation par l'Allemagne pendant la guerre civile nauruane.\nLe phosphate offre à Nauru à la fois des avantages et des inconvénients, dont nous devons nous assurer de ne pas extraire trop ou trop peu afin de ne pas faire s'effondrer l'économie."
 NRU_commander_ridge_phosphate_3:0 "Développer les dépôts de phosphate de Nauru"
 NRU_commander_ridge_phosphate_3_desc:0 "Command Ridge, ou Peak Janor à Nauruan, est le point culminant de l'île. C'est là que se trouve la majeure partie du phosphate.\n\nL'exploitation du phosphate est pratiquée par les puissances européennes à Nauru depuis son occupation par l'Allemagne pendant la guerre civile nauruane.\nLe phosphate offre à Nauru à la fois des avantages et des inconvénients, dont nous devons nous assurer de ne pas extraire trop ou trop peu afin de ne pas faire s'effondrer l'économie."
 NRU_reap_the_benefits_idea:0 "Récolter les bénéfices"
 NRU_phosphate_reservers:0 "Commerce de phosphate à Nauru"
 NRU_phosphate_reservers_majors:0 "Commerce de phosphate à Nauru"
 NRU_tribal_council:0 "Chefs de Nauru"
 NRU_tribal_council_desc:0 "Nauru has 10 tribes all with their chiefs who take orders from the King. These tribes are the §YEamwit, Eamwitmwit, Eaoru, Eamwidara, Iruwa, Eano, Deiboe, Ranibok, Emea, and the Emangum.§!"
 NRU_oppression_of_opposition:0 "Répression de l'opposition"
 NRU_riots_of_48:0 "Émeutes nauruanes"
 NRU_establish_nauru_pacific_line:0 "Établir la Ligne Pacifique de Nauru"
 NRU_establish_nauru_pacific_line_desc:0 "Établir la Ligne Pacifique de Nauru est crucial pour nous permettre de commercer avec d'autres nations et de pouvoir nous autosuffire."
 NRU_continue_phosphate_mining:0 "Poursuivre l'exploitation des mines de phosphate"
 NRU_continue_phosphate_mining_desc:0 "Phosphate Mining has been practiced on Nauru for years by now.  phosphate is our major income and possibly our ONLY income. If we dont keep mining it then we might fall into a depression greather than what we have ever seen."
 NRU_further_phosphate_extraction:0 "Extraction du phosphate"
 NRU_further_phosphate_extraction_desc:0 "L’extraction du phosphate est notre première étape en tant que nouveau pays pour construire le pays."
 NRU_futher_phosphate_extracion_two:0 "Extraction supplémentaire de phosphate"
 NRU_futher_phosphate_extracion_two_desc:0 ""
 NRU_researchers_abroad:0 "Invite Researchers From Abroad"
 NRU_researchers_abroad_desc:0 "Inviter des chercheurs étrangers peut nous aider grandement en matière d’économie."
 NRU_start_exporting_phosphate:0 "Préparations pour l'exportation"
 NRU_start_exporting_phosphate_desc:0 "We have started mining phosphate on a large scale. It may be time to start opening up to the world?"
 NRU_free_market:0 "Le marché libre"
 NRU_free_market_desc:0 "Ouvrez-vous au Marché Libre !"
 NRU_reap_the_benefits:0 "Profitez des avantages"
 NRU_reap_the_benefits_desc:0 "We have done it. we are selling phosphate like there is no tomorrow. Let us reap the benefits that come with it and not look back!"
 NRU_britian_phosphate:0 "Approach the West"
 NRU_britian_phosphate_desc:0 "As the new decade sets in, it is obvious that the way of democracy will guide the future all throughout. We shall follow that path as our neighbours have and assist our allies in laying the foundations of democracy for the nations of the future."
 NRU_japanese_phosphate:0 "Cooperation With Japan"
 NRU_japanese_phosphate_desc:0 "Japan has proven itself to be a foe not to be messed with, and that applies to us too. If we sell our phosphate to the Japanese instead of trying to fight against them, then there may be a possibility of us surviving the Japanese onslaught in the Pacific."
 NRU_soviet_phosphate:0 "L'impensable"
 NRU_soviet_phosphate_desc:0 "With Russia becoming ever so stronger, it seems evident that they may set their aims at the Pacific Ocean. If they do infact set their intentions on conquering the sea, then we will need to be on their good side in order to avoid the onslaught."
 NRU_autonomy_for_the_tribes:0 "Restaurer l'ancien système"
 NRU_autonomy_for_the_tribes_desc:0 "Nauru's old system of government was based around the 12 Chiefs governing their respective tribes, and with a King being the main head of state, who, if needed, gave the Chiefs orders to enforce his laws. This system of governance has not been practiced ever since Nauru was invaded in the Great War. Although, now with the monarchy reinstated, maybe it is time to go back to the past."
 NRU_core_kiribati:0 "Intégrer le Royaume Apemama"
 NRU_core_kiribati_desc:0 "The Kingdom of Apemama was reduced to mere ashes by the British colonialists when they proclaimed their protectorate of the Gilbert Islands there. it was a violation of all rights and was an act of humiliation against the Gilbertese. But we should not let the British reduce the Kingdom into ashes without consequenes. Let us teach them a lesson. Let them see what the Apemamans and Nauruans can do once united!"
 nauru.1.t:0 "Nauru propose un accord sur les phosphates"
 nauru.1.desc:0 "[NRU.GetNameDef] has approached us and offered a deal in which we buy the Nauruan phosphate reserves, proven to be the highest quality of phosphate the world has to offer. In exchange for economic investment into Nauru. It would be foolish not to accept this deal, as it benefits both us and the Nauruans.\nBut should we even invest into such a remote island in the first place when we can get cheaper phosphate elsewhere?"
 nauru.1.a:0 "Ne vous inquiétez pas si je le fais !"
 nauru.1.b:0 "Quelle blague.."
 nauru.2.t:0 "Nauru propose un accord sur les phosphates"
 nauru.2.desc:0 "[NRU.GetNameDef] has approached us and offered a deal in which we buy the Nauruan phosphate reserves, proven to be the highest quality of phosphate the world has to offer. In exchange for economic investment into Nauru. It would be foolish not to accept this deal, as it benefits both us and the Nauruans.\nBut should we even invest into such a remote island in the first place when we can get cheaper phosphate elsewhere?"
 nauru.2.a:0 "Ce serait vraiment stupide"
 nauru.2.b:0 "Un Nauru quoi ?"
 nauru.3.t:0 "Aucun accord !"
 nauru.3.desc:0 ""
 nauru.3.a:0 "Mince alors !"
 nauru.4.t:0 "Nauru propose un accord sur les phosphates"
 nauru.4.desc:0 "[NRU.GetNameDef] has approached us and offered a deal in which we buy the Nauruan phosphate reserves, proven to be the highest quality of phosphate the world has to offer. In exchange for economic investment into Nauru. It would be foolish not to accept this deal, as it benefits both us and the Nauruans.\nBut should we even invest into such a remote island in the first place when we can get cheaper phosphate elsewhere?"
 nauru.4.a:0 "Ce serait vraiment stupide"
 nauru.4.b:0 "Qui sont-ils pour nous vendre des crottes d’oiseaux hors de prix ?"
