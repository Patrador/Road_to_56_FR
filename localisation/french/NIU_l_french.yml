 NIU_memories_from_ww1_desc:0 "En 1915, nous avons envoyé un contingent de 150 hommes combattre dans une guerre à laquelle nous n’avions pas le droit de participer et dans laquelle nous n’avions aucune raison d’être. \nLes courageux soldats [NIU.GetAdjective] ont combattu en France, mais ont dû être rapatriés en 1917 à cause de la maladie. \nDepuis, nous sommes restés sur notre île, à l’écart des conflits étrangers, et nous avons l’intention de le rester. \n§YAfin de mettre fin à cet état d’esprit, nous devons lever une armée composée d’un seul bataillon.§!"
