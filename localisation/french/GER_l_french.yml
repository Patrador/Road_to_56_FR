 new_ger.77.d: "To our fury, the oppressors of our countrymen have rejected the idea of restoring Memel to it's rightful rule. Can we let them get away with this?"
 new_ger.77.a: "Never! Request an official Plebiscite!"
 new_ger.77.b: "We Should not push this yet..."
 new_ger.78.t: "[FROM.GetNameDefCap] demands North Schleswig"
 new_ger.78.d: "[FROM.GetNameDefCap] has decided we have ruled this [ROOT.GetAdjective] land for too long, considering we were simply awarded it after the great war. As such, they have now sent us an ultimatum to cede North Schleswig."
 new_ger.78.a: "We have no choice but to accept the ultimatum..."
 new_ger.78.b: "This land is [ROOT.GetAdjective] nonetheless!"
 new_ger.79.t: "[FROM.GetNameDefCap] cedes North Schleswig"
 new_ger.79.d: "To our great joy, emissaries of [FROM.GetNameDef] have come to us and informed us that our demands are accepted, North Schleswig is [ROOT.GetAdjective] again!"
 new_ger.79.a: "Glorious!"
 new_ger.80.t: "[FROM.GetNameDefCap] Refuses to cede North Schleswig"
 new_ger.80.d: "To our great dismay, emissaries of [FROM.GetNameDef] have come to us and informed us that our demands are rejected. Regardless, Schleswig is [ROOT.GetAdjective] and will be so again!"
 new_ger.80.a: "This is not for them to decide..."
 new_ger.80.b: "We must bide our time..."
 new_ger.81.t: "[FROM.GetNameDefCap] Seizes Danzig"
 new_ger.81.d: "Against all treaties of the old order, Danzig has been seized through the mixture of a local uprising and [FROM.GetAdjective] troops marching in and securing the state."
 new_ger.81.a: "This will not be tolerated!"
 new_ger.81.b: "They are [FROM.GetAdjective] after all..."
 new_ger.82.t: "[FROM.GetNameDefCap] Offers a Compromise"
 new_ger.82.d: "Having largescale claims against us, the Germans have decided to come up with a plan to prevent a full war. They will take the relatively German Lands in Katowitz and Danzig without bloodshed, in exchange for fully relinquishing claims in Poznan and Gdynia, signing a treaty of friendship."
 new_ger.82.a: "The deal of a Lifetime!"
 new_ger.82.b: "These our our countrymen we are talking about..."
 new_ger.83.t: "[FROM.GetNameDefCap] Offers Guarantees for Poznan"
 new_ger.83.d: "In a bid to reclaim their old lands, [FROM.GetNameDef] has offered us a guarantee, which would safeguard us from [SOV.GetNameDef]. In exchange though, we'd have to give up their imperial lands."
 new_ger.83.a: "A hard, but worthy bargain"
 new_ger.83.b: "Unacceptable!"
 new_ger.84.t: "[FROM.GetNameDefCap] Refuses to Part with Posen"
 new_ger.84.d: "In spite of our great offers, Posen was not returned to us, in light of this, we must decide our next steps in order to save our people!"
 new_ger.84.a: "Force the Cessation of Posen"
 new_ger.84.b: "It is not worth it!"
 new_ger.85.t: "[FROM.GetNameDefCap] Demands Poznan"
 new_ger.85.d: "In a bid to reclaim their old lands, [FROM.GetNameDef] has demanded Poznan. While it would be a shame to cede these [ROOT.GetAdjective] lands, they are stronger than us and we have little choice..."
 new_ger.85.a: "It would be an unwinnable war..."
 new_ger.85.b: "We will fights nonetheless!"
 new_ger.86.t: "[FROM.GetNameDefCap] Refuses to Abandon Posen"
 new_ger.86.d: "In spite of our Ultimatum, Posen was not returned to us, in light of this, we must prepare for war in order to save our people!"
 new_ger.86.a: "Death to these Untermenschen!"
 new_ger.86.b: "War is never good."
 new_ger.87.t: "[FROM.GetNameDefCap] Seeks to Save the West from Bolshevism"
 new_ger.87.d: "In a bid to reclaim their old lands and save the people there, be they [FROM.GetAdjective] or [ROOT.GetAdjective], [FROM.GetNameDef] has offered to take charge of these lands, as our government is about to fall to the [SOV.GetNameDef]. This would save the people there from the specter of bolshevism as our ship sinks..."
 new_ger.87.a: "Desperate times call for desperate measures..."
 new_ger.87.b: "We need these men to hold out!"
 new_ger.88.t: "[FROM.GetNameDefCap] Refuses our Plan"
 new_ger.88.d: "The [FROM.GetAdjective] has informed us that they will not be returning any of our lands, instead they will keep them and fight to the death against [SOV.GetNameDef]"
 new_ger.88.a: "Then their death will come sooner than expected!"
 new_ger.88.b: "That is their fair right!"
 new_ger.89.t: "[FROM.GetNameDefCap] Marches Across the Border!"
 new_ger.89.d: "The [FROM.GetAdjective]s have attacked us without a declaration of war, expecting us to lay down our arms and welcome them in with open arms."
 new_ger.89.a: "I mean we are one people after all..."
 new_ger.89.b: "We must resist this perfidious strike!"
 new_ger.90.t: "The Volkseinheitsgesetz is Passed in Vienna"
 new_ger.90.d: "[ROOT.GetLeader] has just been informed by the rest of his party that they have achieved one of our greatest goals today! The nation has been officially united and been brought home into the Reich! [ROOT.GetLeader] however was not informed of this until it had happened and with German help, the country now asks him to step aside for the new and united Germany. Betrayal of our cause would mean outright rebellion from all sides..."
 new_ger.90.a: "Unity at last!"
 new_ger.90.b: "Power must be kept at all costs..."
 new_ger.91.t: "[FROM.GetLeader] refuses to relinquish Power"
 new_ger.91.d: "Today we have been informed that [FROM.GetLeader] has rejected the already passed Volkseinheitsgesetz and has declared war on us and our annexation of Austria!"
 new_ger.91.a: "We will crush him..."
 new_ger.92.t: "[FROM.GetLeader] Offers a Pan German Compromise"
 new_ger.92.d: "If Germany is to be united and our power over Austria is to be kept, there is only one solution. Berlin has just approached us with exactly this offer. We would join them under this, becoming a nominal part of [FROM.GetNameDef] but retaining most of our autonomy, allowing for us to keep our own culture and heritage, so that the two nations will only slowly merge over time..."
 new_ger.92.a: "To the new and united Germany!"
 new_ger.92.b: "We will not sell out Austrian ideals..."
 new_ger.93.t: "[FROM.GetLeader] Offers us an Alliance"
 new_ger.93.d: "Berlin has declared that full German unity is not necessarily necessary... They have instead offered us to restore the Status quo that pertained from 1879 to 1919, with us serving as a member of the German Alliance."
 new_ger.93.a: "Let us Toast to this friendship!"
 new_ger.93.b: "We will not sell out Austrian ideals..."
 new_ger.94.t: "[FROM.GetLeader] rekindles the Frano-German Rivalry"
 new_ger.94.d: "Berlin has declared that Germany and France will forever be enemies, with disputes about reparations, Alsace, and many a quarrel rising, it is clear that [FROM.GetLeader] is correct. Our two people are fated to be enemies!"
 new_ger.94.a: "Let us vanquish this pitiful bunch!"
 new_ger.94.b: "Is this really necessary?"
 new_ger.95.t: "[FROM.GetNameDefCap] demands Alsace Lorraine"
 new_ger.95.d: "Alsace, an integral part of [ROOT.GetNameDef], won back after the last great war, has just been demanded by the perfidious Germans. They seek to humiliate us and seize our core lands!"
 new_ger.95.a: "Nonetheless, we have no choice but to accept the ultimatum..."
 new_ger.95.b: "This land is [ROOT.GetAdjective]!"
 new_ger.96.t: "[FROM.GetNameDefCap] cedes Elsass Lothringen"
 new_ger.96.d: "To our great joy, emissaries of [FROM.GetNameDef] have come to us and informed us that our demands are accepted, Elsass Lothringen is [ROOT.GetAdjective] again!"
 new_ger.96.a: "The Weak bow before the Mighty!"
 new_ger.97.t: "[FROM.GetNameDefCap] Refuses to cede Elsass Lothringen"
 new_ger.97.d: "To our great fury, emissaries of [FROM.GetNameDef] have come to us and informed us that our demands are rejected. Regardless, Elsass Lothringen was [ROOT.GetAdjective] and will be so again!"
 new_ger.97.a: "Death to the French!"
 new_ger.97.b: "We must bide our time..."
 new_ger.98.t: "[FROM.GetNameDefCap] Seeks Rapprochement"
 new_ger.98.d: "With the Nazis deposed, the [FROM.GetAdjectiveCap]s have come to us with an offer of rapprochement, with an initial non aggression pact and later potentially the acceptance of a new and fair Versailles..."
 new_ger.98.a: "Let us toast to our new friends!"
 new_ger.98.b: "The Germans are not to be Trusted!"
 new_ger.99.t: "[FROM.GetNameDefCap] Accept Rapprochement"
 new_ger.99.d: "To our great joy, emissaries of [FROM.GetNameDef] have come to us and informed us that our non aggression pact has been accepted as peace reigns in western Europe!"
 new_ger.99.a: "Let us toast to our new friends!"
 new_ger.100.t: "[FROM.GetNameDefCap] Reject Rapprochement"
 new_ger.100.d: "To our great dismay, emissaries of [FROM.GetNameDef] have come to us and informed us that our non aggression pact has been rejected."
 new_ger.100.a: "Damn it!"
 new_ger.101.t: "[FROM.GetNameDefCap] Seeks to Buy Back its Colonies"
 new_ger.101.d: "Today we have been approached by [FROM.GetNameDef], as this nation seeks to restore it's old empire through purchasing the land back. They have offered us quite some industrial compensations for it."
 new_ger.101.a: "The Money is Good!"
 new_ger.101.b: "This Colony is too important!"
 new_ger.101.c: "Why would we sell what our men died for?"
 new_ger.102.t: "[FROM.GetNameDefCap] Sells Land"
 new_ger.102.d: "To our great joy, emissaries of [FROM.GetNameDef] have come to us and informed us that our deal for our old colony has been accepted!"
 new_ger.102.a: "Our Empire slowly comes back together..."
 new_ger.103.t: "[FROM.GetNameDefCap] Refuses to Sell Land"
 new_ger.103.d: "To our great dismay, emissaries of [FROM.GetNameDef] have come to us and informed us that our deal for our old colony has been refused!"
 new_ger.103.a: "Painful, but it is what it is."
 new_ger.103.b: "To add insult to injury they told us to shut up with such offers!"
 new_ger.104.t: "[FROM.GetNameDefCap] Demands Our Colonies..."
 new_ger.104.d: "On this day, [FROM.GetNameDef] has informed us that we have 20 days to vacate our colonies or face their war machine. Not it is up to us, which of these grim options do we prefer?"
 new_ger.104.a: "We will not give up our honor like that!"
 new_ger.104.b: "We have no choice but to accept!"
 new_ger.105.t: "The Goal of the Pact"
 new_ger.105.d: "With the Berlin Pact officially established, we must now decide it's fate. What is to be the highest ambition of our military alliance?"
 new_ger.105.a: "It is to Secure and Iron Vanguard for the Revolution!"
 new_ger.105.b: "It is to Spread the Revolution through the World!"
 new_ger.106.a: "It is to defend Democracy above All!"
 new_ger.106.b: "It is to restore Order and Stability in Europe!"
 new_ger.106.c: "It is to bring about Global Peace!"
 new_ger.107.a: "It is to bring back what was taken from us!"
 new_ger.107.b: "It is to Wage a Great War!"
 new_ger.109.t: "[FROM.GetNameDef] Offers Guarantees"
 new_ger.109.d: "With the danger looming to our east, [FROM.GetNameDef] has offered to protect us from them."
 new_ger.109.a: "Safety at last!"
 new_ger.109.b: "This would only draw us into the [FORM.GetAdjective] sphere!"
 new_ger.110.t: "Restore the 1848 Flag?"
 new_ger.110.d: "While we currently fly the Black-White-Red Flag of the North German Confederation, the Red-Yellow-Gold Flag better fits our ideals, displaying our great republican tradition as displayed by the 1848 revolution and similar events."
 new_ger.110.a: "Unity and Right and Freedom!"
 new_ger.110.b: "Let us not anger the conservatives..."
 new_ger.111.t: "The Freikorps Assimilate into the Army"
 new_ger.111.d: "While still making sure to keep their political standing and organization, the Freikorps Divisions have ceased to be strictly separated from the standard army, as both mix among each other. This has allowed the Freikorps to become less concentrated but also have much higher support base overall..."
 new_ger.111.a: "Hail the new Army!"
 new_ger.112.t: "The Fate of the Kaiserreich"
 new_ger.112.d: "With the Current head of the German Kaiserreich having declared his support for our opposition and Canaris, we have a choice to make. As we hold all the cards in our hand we could undo the restoration of Wilhelm IV's titles for his disservice to our nation and put his brother Louis Ferdinand on the Throne..."
 new_ger.112.a: "We have already tampered too much with the Monarchy!"
 new_ger.112.b: "It is his own fault, really."
 new_ger.113.t: "[FROM.GetNameDefCap] demands South Tyrol"
 new_ger.113.d: "The [FROM.GetAdjective]s have approached us with the goal to take back South Tyrol, a set of lands we have rightfully won after the great war. We would like to refuse, however they have insinuated that the alternative is war..."
 new_ger.113.a: "We have no choice but to accept!"
 new_ger.113.b: "War to be damned, this land is ours!"
 new_ger.114.t: "[FROM.GetNameDefCap] cedes South Tyrol"
 new_ger.114.d: "Our thinly veiled threats have been a great success, as our lands in south Tyrol have been ceded. We have liberated yet one more group of our own people!"
 new_ger.114.a: "We have no choice but to accept!"
 new_ger.115.t: "[FROM.GetNameDefCap] refuses to cede South Tyrol"
 new_ger.115.d: "Our thinly veiled threats have been a failure, as our lands in south Tyrol have not been ceded. We have yet to liberate this group of our own people! We must mobilize in order to save them!"
 new_ger.115.a: "This will not go unavengaed!"
 new_ger.115.b: "Yet caution is still key..."
 new_ger.116.t: "[FROM.GetNameDefCap] Seeks to Partition South Tyrol along Ethnic Lines"
 new_ger.116.d: "The [FROM.GetAdjective]s have approached us with a deal to partition South Tyrol in a way that leaves it split among ethnic lines. The German majority north will be integrated into [FROM.GetNameDef], while they will drop their claim to Trentino, which is majority Italian."
 new_ger.116.a: "This is the perfect precursor to a long term peace!"
 new_ger.116.b: "This would give up rightful Italian clay!"
 new_ger.117.t: "[FROM.GetNameDefCap] Agrees to split South Tyrol"
 new_ger.117.d: "To our great joy, our people in northern south Tyrol were returned to us, thus without bloodshed or excess emnity a deal has been reached to appropriately reunite these lands with the rest of their nation!"
 new_ger.117.a: "Amazing!"
 new_ger.118.t: "[FROM.GetNameDefCap] refuses to split South Tyrol"
 new_ger.118.d: "Despite our best efforts to solve this diplomatically, the partition of South Tyrol has been a failure. In order to rectify this, some suggest a demand of the full region in order to bring them to their senses, while others say to leave it be for now... What is is that will serve us best?"
 new_ger.118.a: "National Unity must be achieved, one way or another..."
 new_ger.118.b: "War must still be avoided!"
 new_ger.119.t: "[FROM.GetNameDefCap] Seeks to Relocate the Germans in South Tyrol"
 new_ger.119.d: "The [FROM.GetAdjective]s have approached us with a deal in which they have made clear that they are willing to drop all claims on South Tyrol. It comes with a catch, however. They ask for permission to relocate all Germans in the area to the Reich itself, depriving us of this manpower..."
 new_ger.119.b: "This would give up rightful Italian men!"
 new_ger.120.t: "[FROM.GetNameDefCap] Agrees to let us Vacate our Men!"
 new_ger.120.d: "To our great joy, our people in northern south Tyrol were returned to us, thus without bloodshed or excess emnity a deal has been reached to appropriately reunite these lands with the rest of their nation!"
 new_ger.120.a: "Amazing!"
 new_ger.121.t: "[FROM.GetNameDefCap] refuses to let our People go!"
 new_ger.121.d: "Despite our best efforts to allow our people to leave, the Italian Government has blocked all our efforts, as a result we must decide what to do. We can either try and get them give us the German majority lands to liberate these people after all or we can try for a path of peace and give up these people..."
 new_ger.121.a: "Then we must demand the cessation of the German majority lands!"
 new_ger.121.b: "This conflict cannot bloom out of proportion!"
 new_ger.122.t: "Fate of the Mierendorff Clique"
 new_ger.122.d: "What was once the SPD, now the Mierendorff Clique of the SED, is in an interesting position. While they have done much to empower the party and have many unique strengths, they also bring division and lack communist orthodoxy. This means they could pose a threat to us in the future if left unchecked, should they attempt to undermine the Party. We must make a decision on what to do with this interesting rabble!"
 new_ger.122.a: "All of their political influence must be purged!"
 new_ger.122.b: "They shall remain a distinct clique under our watch..."
 new_ger.123.t: "The Fate of the Communists"
 new_ger.123.d: "With the Communists having a modicum of power in Germany, we must decide their fate in our revolution. How will we deal with their subversive influence?"
 new_ger.123.a: "They are a tool to use!"
 new_ger.123.b: "They are a threat to avoid!"
 new_ger.124.t: "The Fate of the Reichskonkordat"
 new_ger.124.d: "With the Nazis fallen from grace, the Reichskonkordat is lingering in the air, neither reaffirmed or repealed, we must decide its fate and make use of it, either in its disappearance or it's reinvigoration."
 new_ger.124.a: "It shall be reinvigorated!"
 new_ger.124.b: "It shall be no more..."
 new_ger.125.t: "The Fate of the Conciliators"
 new_ger.125.d: "Some of the party are degenerated and have decided to work with the SPD and other social fascists in order to better advance the revolution. Yet this pragmaticism is perhaps something to take the good out of and perhaps we must use the social fascists for now..."
 new_ger.125.a: "The Conciliators are at least somewhat right..."
 new_ger.125.b: "The party must remain pure!"
 new_ger.126.t: "The Safety of the State"
 new_ger.126.d: "It is our highest goal to ensure the safety of the German state from within and without. We face enemies on both fronts and must decide who to prioritize."
 new_ger.126.a: "The state must be safe from within."
 new_ger.126.b: "The state must be safe from without."
 new_ger.127.t: "The Settlement of the Leadership Question"
 new_ger.127.d: "With us in charge of Germany now, we must come to a decision on the leadership of the NRAF, deciding between either Viktor Lutze and the SA clique or Otto Strasser and the NRAF orthodox faction. Let us put all else aside and decide on this!"
 new_ger.127.a: "Strasser has formed our ideology."
 new_ger.127.b: "Lutze has won us the Streets!"
 new_ger.128.a: "The Trade Unions are a Danger to the Economy."
 new_ger.128.b: "Compromise must be an option, we need to secure the middle class!"
 new_ger.129.t: "What is Marriage?"
 new_ger.129.d: "Large elements of the SPD and a fair chunk of the more conciliatory KPD has long advocated to end the Chrisitan influence in our idea of marriage. They propose that marriage is between any two people who desire to enter into this bond, rather than one man and one woman. This would, however destabilize our society and lower birth rates, while its morality is openly discussed. Should we enact such a policy?"
 new_ger.129.a: "Down with Christendom!"
 new_ger.129.b: "Just cause the Christians said something doesn't make it wrong..."
 new_ger.130.t: "The End Goal of the CVU"
 new_ger.130.d: "German Conservatism has taken large strides forward in past years, now it is time to decide what exactly it is we are fighting for, the end goal of our party."
 new_ger.130.a: "It is to create a conservative mass movement!"
 new_ger.130.b: "The Status Quo of the Union is more than enough!"
 new_ger.131.t: "The German Culture Strengthening Campaign"
 new_ger.131.d: "With us launching our culture in order to win the people to our side, we must choose what to focus on in our great democratic culture."
 new_ger.131.a: "We should foster a shared European Identity."
 new_ger.131.b: "We should strengthen German Nationalism."
 new_ger.132.t: "On Solving the Economic Crisis"
 new_ger.132.d: "The Nazis have run the Economy into the Ground with the likes of the MEFO bills and other measures to improve the economy in the short term. This has made it brittle and ready to blow. We must address this crisis and prevent it from spiraling out of control. Though to do so would be quite costly and could potentially hurt the economy even more. Regardless something must be done!"
 new_ger.132.a: "To grasp the root problem would be too costly, let us instead make do with what we have."
 new_ger.132.b: "We have no choice but to deal with this problem, let us at least do it sooner than later!"
 new_ger.133.t: "[GER.GetNameDefCap] Seizes Slovenia for Their Purposes"
 new_ger.133.d: "The [GER.GetAdjective]s have decided our rule over Slovenia is to end and have instead decided that Slovenia's fate lies elsewhere. They have now seized our lands their and transferred it to their preferred controllers."
 new_ger.133.a: "At least that means they will stop trying to secede."
 new_ger.133.b: "Well in that case, damn the Germans!"
 new_ger.134.t: "[FROM.GetNameDefCap] Abandons us!"
 new_ger.134.d: "With us having determined their territory best fit for other use, the [FROM.GetAdjective]s have decided to abandon our rule and our alliance, seeing their interests only preserved alone."
 new_ger.134.a: "I guess it's only fair..."
 new_ger.134.b: "You really think that's a good idea?"
 new_ger.135.t: "[GER.GetNameDefCap] Forms a Croat State"
 new_ger.135.d: "The [GER.GetAdjective]s have decided our rule over Croatia is to end and have instead decided that Croatia shall have its independence. They have now seized our lands their and transferred it to this new Croatian state!"
 new_ger.135.a: "At least that means they will stop trying to secede."
 new_ger.135.b: "Well in that case, damn the Germans!"
 new_ger.136.t: "[FROM.GetNameDefCap] Offers us Natural Borders"
 new_ger.136.d: "The [FROM.GetAdjective]s have decided to offer us natural borders along rivers in Hungary and the Banat if we give them rights to the Ploiesti oil fields. A great trade for both of us, providing for their war economy and providing for our safety!"
 new_ger.136.a: "Let us toast to our new benefactors!"
 neW_ger.136.b: "We still prefer to keep hold of our own oil"
 new_ger.137.t: "[GER.GetNameDefCap] Gives Away our Land"
 new_ger.137.d: "The [GER.GetAdjective]s have decided our parts of our realm is to end and have instead decided to give it away to achieve German interests. They have now seized our lands their and transferred it to their chosen location."
 new_ger.137.a: "Protection comes at a price, I see..."
 new_ger.137.b: "Well in that case, damn the Germans!"
 new_ger.138.t: "[GER.GetNameDefCap] Demands we Recognize Yugoslavian Claims"
 new_ger.138.d: "The [GER.GetAdjective]s have decided to officially back Yugoslavian claims, however they do so not just with words but by force. They have now threatened war if we do not return these lands to Yugoslavia at once."
 new_ger.138.a: "We really have no choice in the matter..."
 new_ger.138.b: "This is just a bluff, let's call it!"
 new_ger.139.t: "[FROM.GetNameDefCap] refuses to give up Yugoslavian Lands."
 new_ger.139.d: "The [FROM.GetAdjective] government has decided to try and call our bluff and has blocked the return of Yugoslav lands. What shall we do with this blatant refusal to recognize our international authority?"
 new_ger.139.a: "We were just bluffing..."
 new_ger.139.b: "Let us embargo them!"
 new_ger.139.c: "By Jingo, to war!"
 new_ger.140.t: "[FROM.GetNameDefCap] gets Slovakia to Secede"
 new_ger.140.d: "[GER.GetLeader] has spoken with the Slovak parliament and persuaded them to secede from our Nation, promising backing and threatening the division by Hungary and Poland if such action was not taken. As such we have all of a sudden lost a large chunk of our Land to this now German backed puppet and must decide how to deal with the fallout."
 new_ger.140.a: "This cannot be tolerated, we will not lose even more land!"
 new_ger.140.b: "I guess it's fait accompli once again..."
 new_ger.141.t: "[FROM.GetNameDefCap] Pressures us to transfer [FROM.FROM.GetName] to [HUN.GetNameDef]"
 new_ger.141.d: "With their influence spreading all over the place, the Germans have decided to pressure us to return [FROM.FROM.GetName] to their Hungarian allies. They have implied various threats should we refuse their request..."
 new_ger.141.a: "Who are we to refuse such a mighty backer?"
 new_ger.141.b: "We will not surrender our lands like that!"
 new_ger.142.t: "[FROM.GetNameDefCap] Pressures us to transfer [FROM.FROM.GetName] to [BUL.GetNameDef]"
 new_ger.142.d: "With their influence spreading all over the place, the Germans have decided to pressure us to return [FROM.FROM.GetName] to their Bulgarian allies. They have implied various threats should we refuse their request..."
 new_ger.142.a: "Who are we to refuse such a mighty backer?"
 new_ger.142.b: "We will not surrender our lands like that!"
 new_ger.143.t: "[FROM.GetNameDefCap] has refused our Pressure to cede [FROM.FROM.FROM.GetName]"
 new_ger.143.d: "Despite us exerting our influence and pressure, [FROM.GetNameDefCap] has rejected all of our influence to give up the state of [FROM.FROM.FROM.GetName]. Instead they hold on to their lands, even though it is rightfully that of our allies."
 new_ger.143.a: "As is their right..."
 new_ger.143.b: "Well, two can play at this game..."
 new_ger.143.c: "In that case, we shall go to war!"
 new_ger.144.t: "[FROM.FROM.FROM.GetName] has been returned due to German Pressure"
 new_ger.144.d: "On our behalf, the German government has pressured [FROM.GetNameDef] to give up [FROM.FROM.FROM.GetName] in favor of our claims. Let us rejoice in this great fact and ensure that our ties to [GER.GetNameDef] are upheld!"
 new_ger.144.a: "And so we are one step closer to restoring Greater Hungary!"
 new_ger.145.t: "[FROM.GetNameDefCap] proposes a joint strike on [JAP.GetNameDef]"
 new_ger.145.d: "With both us and the Germans having a bone to pick with the Japanese, they have proposed a joint strike on them. They are ready to march out and strike at once to vanquish the Japanese, the question is, are we ready as well?"
 new_ger.145.a: "Death to the Japanese!"
 new_ger.145.b: "Moderation is key."
 new_ger.146.t: "[FROM.GetNameDefCap] proposes a joint strike on [SOV.GetNameDef]"
 new_ger.146.d: "With both us and the Germans having a bone to pick with the Soviets, them for this ideological threat and us for their support of [PRC.GetNameDef], it would be advisable for us to work together to destroy them. Thus, [GER.GetLeader] has proposed we organize a joint strike to attack together."
 new_ger.146.a: "Death to Bolshevism!"
 new_ger.146.b: "This is not our fight."
 new_ger.147.t: "[FROM.GetNameDefCap] Requests a Plebiscite in the Sudetenland"
 new_ger.147.d: "On this day, [FROM.GetNameDef] has requested a plebiscite in the [FROM.GetAdjective] majority area of the Sudetenland. While we claim to follow the values of self determination, accepting such a request would undoubtedly cause the Sudetenland to be given up after the results."
 new_ger.147.a: "Yet it is still the right thing, give us 30 days!"
 new_ger.147.b: "Never would we give up our land like that!"
 new_ger.148.t: "[FROM.GetNameDefCap] have accepted a Plebiscite!"
 new_ger.148.d: "They have told us that a plebiscite will be held within 30 days, something that will undoubtedly grant us control of our lands again!"
 new_ger.148.a: "Glorious!"
 new_ger.149.t: "The Sudetenland Plebiscite"
 new_ger.149.d: "The Results of the plebiscite have come in and, as expected, the German majority has pushed through. This means the land will now be transferred back according to pre great war borders."
 new_ger.149.a: "And so Europe shifts once again..."
 new_ger.150.t: "A Plebiscite Rejected!"
 new_ger.150.d: "The Oppressors in [FROM.GetNameDef] have pushed the idea of a plebiscite off of the table, despite us clearly being in the right. What shall we do about this?"
 new_ger.150.a: "Our Countrymen will be freed, if necessary, by force!"
 new_ger.150.b: "We are in no position to squabble..."
 new_ger.151.t: "[FROM.GetNameDef] offers Guarantees of Territorial Integrity in exchange for the Sudetenland"
 new_ger.151.d: "Considering the Sudetenland is mostly [FROM.GetAdjective], they have offered to purchase it through a guarantee of the rest of our territories being irrevocably [ROOT.GetAdjective], solving this issue of this minority in our nation, and securing peace and defenses against any Hungarian, Austrian, or Polish claims, even to the point that [FROM.GetNameDef] will back us on these issues and not them."
 new_ger.151.a: "Safety and Stability? Sign me up!"
 new_ger.151.b: "We will not sell out our nation like that!"
 new_ger.152.t: "[FROM.GetNameDefCap] transfers the Sudetenland"
 new_ger.152.d: "To our great joy, emissaries of [FROM.GetNameDef] have come to us and informed us that our offer of purchase is accepted, the Sudetenland is [ROOT.GetAdjective] again is exchange for some minimal diplomatic concessions..."
 new_ger.152.a: "Glorious!"
 new_ger.153.t: "Our Offer has been Rebuffed!"
 new_ger.153.d: "To our fury, the oppressors of our countrymen have rejected the idea of restoring the Sudetenland to it's rightful rule. Can we let them get away with this?"
 new_ger.153.a: "Never! Request an official Plebiscite!"
 new_ger.153.b: "We Should not push this yet..."
 new_ger.154.t: "The Destination of Goerdeler's Revolution"
 new_ger.154.d: "Carl Friedrich Goerdeler and his conservative conspiratorial clique are on one hand united, with the end goal of deposing Hitler's illegal regime. On the other hand, however they are divided, with many different political outlooks working together in this movement to depose the madman, each with their own vision for Germany's future.\nAs such, he must tread lightly and steer a careful course, to keep the Nation whole and steer Germany to a safe and stable future after Hitler's fall. And the first step to doing that is to declare an aim for this new German Revolution, in order to garner support and consolidate the clique's political capital."
 new_ger.154.a: "We shall strive to bring a conservative order to our beloved Fatherland!"
 new_ger.154.b: "It will require a strong democratic government to win broad support!"
 new_ger.155.t: "Viktor Lutze Offers us a Deal"
 new_ger.155.d: "In 1938 the SA were sidelined and Viktor Lutze placed as its head. While he himself was a staunch supporter of Hitler's, since then he has grown reminiscent of the age of strong SA influence, with it now falling by the day. In the hopes of reinvigorating the SA and bringing a new future to its movement, he has offered to lead it's old guard against Hitler in support of our coup. Of course, in exchange we would have to give him some power in the military and allow him to run as a politician. Is this really worth it?"
 new_ger.155.a: "Anything to gain another ally!"
 new_ger.155.b: "This is out of the question!"
 new_ger.156.t: "Wilhelm Canaris Holds Secret Talks with Beck"
 new_ger.156.d: "Two key figures in the conservative anti-Hitler movement have seemingly met for secret talks. Something that may become some sort of conspiracy in a conspiracy. As Beck has offered Canaris a deal by which they would work together to sideline Goerdeler's more democratic zeal, instead working to establish a strong German state under their own control. A deal that would drastically change the outlook of the new Germany.\nThe talks have so far gone interestingly, both wanting the power but yet wary of the other and seeking it only for themselves in earnest. As such, it seems questionable if such a deal will hold once power is secured, if it even is made in the first place."
 new_ger.156.a: "It seems at least for now an accord is struck..."
 new_ger.156.b: "After one too many disagreements, the men go home."
 new_ger.157.t: "The Comintern Offers Limited Funding for the KPD and the Conspiracy"
 new_ger.157.d: "Seeing that a German revolution would greatly strengthen the Soviet cause, the Comintern has offered to provide us and the last remnants of the KPD resistance with some limited funding and perhaps later even a full fledged Soviet Expeditionary Force. While this would greatly support us, it would greatly anger the conservatives in our coalition. Furthermore this deal has a large string attached. They have demanded that in exchange for all this, the KPD must be legalized upon the declaration of the new German Republic."
 new_ger.157.a: "A worthy bargain, though very steep."
 new_ger.157.b: "This is a bridge too far."
 new_ger.158.t: "Wilhelm II Offers his Allegiance"
 new_ger.158.d: "Seeing a new future for the monarchy in Germany in our conservative revolution, Wilhelm II has approached Beck and Goerdeler in secret, offering his full support in the coup, in exchange he asks for one thing only. That in whatever form that it comes in, the Kaiserreich be established, be it under him or under his grandson, it matters not, as long as this one request is fulfilled."
 new_ger.158.a: "Hail the new Kaiserreich!"
 new_ger.158.b: "What a power play! Unacceptable!"
 new_ger.159.t: "Economic Collapse Hits the Nation"
 new_ger.159.d: "With the launch of the German Civil War and the MEFO bills ending as a result of it, the economy is in shambles. We must do something to recover the economy, and fast, lest it deteriorate out of control."
 new_ger.159.a: "We stood through the Great Depression, we can survive this too."
 new_ger.160.t: "[FROM.GetNameDefCap] Proposes Yet Another Polish Partition"
 new_ger.160.d: "In line with our tradition of partitioning Poland again and again, [FROM.GetNameDef] has suggested we do it once more, this time givig us the east and them the west, leaving a small rump puppet state in Warsaw. A massive boost in land and industry for both of us."
 new_ger.160.a: "Any Day!"
 new_ger.160.b: "This seems a bit extreme, no?"
 new_ger.161.t: "[FROM.GetNameDefCap] and [FROM.FROM.GetNameDef] Demand Partition"
 new_ger.161.d: "In line with their tradition of partitioning our state again and again, [FROM.GetNameDef] and [FROM.FROM.GetNameDef] have decided to do it once more, this time givig [FROM.FROM.GetNameDef] the east and [FROM.GetNameDef] the west, leaving us a small rump puppet state in Warsaw. A massive boost in land and industry for both of them, while destroying our nation almost entirely."
 new_ger.161.a: "Do we really have a choice?"
 new_ger.161.b: "Poland is not yet lost!"
 new_ger.162.t: "Largescale Union Formation Takes Place After Social Economic Reforms"
 new_ger.162.d: "After our strengthening of workers rights in Germany, we have seen an unprecidented amount of unions being formed. As such, we must decide if we will support this development, coopt it, or oppose it."
 new_ger.162.a: "Disband the unions, they are a disruption to the Economy!"
 new_ger.162.b: "Verbally affirm their formation."
 new_ger.162.c: "Coopt them and make them run via state institutions."
 new_ger.163.t: "The Fate of National Socialism"
 new_ger.163.d: "With national socialism having had its illusion of omnipotence shattered, it is now time to decide what to do with the core ideals of this movement. Are they something understandable and forgiviable to have in some limited form or are they downright evil and a blight on German History?"
 new_ger.163.a: "They are a horrid blight, after all, are they not what we are fighting against?"
 new_ger.163.b: "It is forgiveable, as long as the people support us."
 new_ger.164.t: "The Fate of the Antifaschistische Aktion"
 new_ger.164.d: "As the Volksarmee grows in influence, it has run into a problem, the Antifaschistische Aktion, our party militia seeks to be the main German Army. As such the two have long been at each others' throats on this issue. With the Volksarmee now victorious, we must decide on what to do with the Antifaschistische Aktion. On one hand we could simply purge them, anhilating any hope of theirs to oppose the Volksarmee and satisfying the Volksarmee, though some of the grassroots members of the KPD may be displeased at seeing us round up and purge even more old party members. If we instead seek to avoid bloodshed, we could simply force the Antifaschistische Aktion to merely act as a domestic party enforcement force and thus reassure the Volksarmee that it will not supplant it, though that will not be satisfying for the Volksarmee and it will piss off the Antifaschistische Aktion. Finally we could come up with a Volksarmee favoring Compromise in which the Antifaschistische Aktion becomes a part of the Volksarmee, though this would lead to a rift in the now expanded Volksarmee..."
 new_ger.164.a: "Nonetheless, this cancer must go, lest it grow out of control!"
 new_ger.164.b: "They are fine so long as they drop their assertion that they should be the main German Army."
 new_ger.164.c: "They shall be merged into the army as auxiliary units."
 new_ger.165.t: "[FROM.GetNameDefCap] Pushes for the Creation of a Sudetenland Autonomy"
 new_ger.165.d: "With [FROM.GetAdjective]s having a majority in the Sudetenland, the [FROM.GetAdjective] government has now decided to request that an autonomous zone be created in these lands, granting additional freedoms and privlidges to the Sudetendeutsche, allowing for them to live as Germans despite being in [ROOT.GetNameDef]."
 new_ger.165.a: "It is the fair price of being a multiethnic state."
 new_ger.165.b: "That would cost us profits..."
 new_ger.166.t: "[FROM.GetNameDef] Grants Autonomy to the Sudetendeutsche"
 new_ger.166.d: "At our requestion [FROM.GetNameDef] has decided to accept autonomy for our people living in their lands, allowing for Harmony to be restored and our people to coexist in peace!"
 new_ger.166.a: "Let us toast to our new friends!"
 new_ger.167.t: "[FROM.GetNameDef] Seeks a Trade Agreement"
 new_ger.167.d: "In order to fund their ever growing economy and military needs, the governemnt of [FROM.GetNameDef] has decided to reach out to us and offer us some political support and favors in exchange for cheaper trade. A deal that should be favorable to both of us."
 new_ger.167.a: "Let us toast to our new friends!"
 new_ger.167.b: "[ROOT.GetAdjective] Resources are for the [ROOT.GetAdjective]s"
 new_ger.168.t: "[FROM.GetNameDef] Requests Docking Rights"
 new_ger.168.d: "In order to maintain their war effort across the Atlantic, [FROM.GetNameDef] has asked that we provide them with docking rights, allowing for their naval ranges to be greatly expanded."
 new_ger.168.a: "Why Of Course!"
 new_ger.168.b: "Where would this breach of neutrality lead to?"
 new_ger.169.t: "[FROM.GetNameDef] Pushes for Air Base"
 new_ger.169.d: "In order to gain air supremacy for their Atlantic war, [FROM.GetNameDef] has pushed for the expansion of our docking rights and requested that we turn them into air base access as well, allowing for the Luftwaffe to spread its wings over our lands."
 new_ger.169.a: "I see no issue!"
 new_ger.169.b: "This is a bridge too far!"
 new_ger.170.t: "[FROM.GetNameDefCap] Proposes a Non-Aggression Pact"
 new_ger.170.d: "In order to secure peace between our fellow germanic nations, [FROM.GetNameDef] has proposed a non-aggression pact, furthermore they have hinted at the fact that further economic cooperation may be in the cards down the line should this be accepted!"
 new_ger.170.a: "Being friends with benefits sure sounds like a great idea!"
 new_ger.170.b: "We prefer to keep our options open."
 new_ger.171.t: "[FROM.GetNameDefCap] Proposes an Industrial Cooperation Agreement"
 new_ger.171.d: "In the light of our recent cooperation and friendship, [FROM.GetNameDef] has decided to offer to expand it a bit, suggestion an industrial cooperation agreement with scientific exchanges, shared businesses, and most importantly large scale trade agreements, a lucrative deal that should benefit both nations greatly!"
 new_ger.171.a: "Event more benefits? Sign me up!"
 new_ger.171.b: "American resources are for Americans only!"
 new_ger.172.t: "[FROM.GetNameDefCap] Seeks to Work with the Afrikaners"
 new_ger.172.d: "[FROM.GetNameDefCap] has reached out to our Germanic ruling class, the Afrikaners, proposing to work with them to help entrench their control over the state and improving relations with the [GER.GetAdjective] government. Furthermore, there are talks that they may perhaps help us overthrow colonial rule and establish our own Germanic state in Africa...."
 new_ger.172.a: "A great deal! Up with the Afrikaner identity!"
 new_ger.172.b: "We believe that the status quo is fine as is."
 new_ger.173.t: "[FROM.GetNameDefCap] Finalizes Coup Preparations"
 new_ger.173.d: "[FROM.GetNameDefCap] has informed us that all preparations for the aforementioned coup are prepared and it could commence any time, so long as local Afrikaners commit to it. That being said, a coup is a radical step and we must be sure we really want to go that far."
 new_ger.173.a: "This is a bridge too far..."
 new_ger.173.b: "Hail the new afrikaner state!"
 new_ger.174.t: "[FROM.GetNameDefCap] Seeks to Establish a Military Base on Our Soil"
 new_ger.174.d: "Due to our superb location in the atlantic, [FROM.GetNameDef] has sought to establish a military base on our soil, using us as a base to expand their reach. In exchange we would be granted various perks and funds..."
 new_ger.174.a: "This is a bridge too far..."
 new_ger.174.b: "What a great deal!"
 new_ger.175.t: "[FROM.GetNameDefCap] offers us North Ireland"
 new_ger.175.d: "Seeing our plight with the divided state of our isle, the Germans have decided to offer us reunification, all they ask is that we join their alliance and thus become a staging ground for their forces. In exchange they will fully back our claim to the northern segment of our home nation."
 new_ger.175.a: "Too much blood was spilled over that land."
 new_ger.175.b: "A glorious deal!"
 new_ger.176.t: "[FROM.FROM.GetAdjective] Coup in South Africa"
 new_ger.176.d: "A [FROM.FROM.GetAdjective] coup has toppled our dominion in south Afrika, with the local Afrikaners, or white ruling class, having seize the state for themselves, forming an independent radical pro-German Government. They have immidietly joined the [FROM.FROM.GetFactionName] and intend to live on without [ROOT.GetAdjective] rule."
 new_ger.176.a: "By Jingo, to war!"
 new_ger.176.b: "How dare they!"
 new_ger.176.c: "Is that not their right?"
 new_ger.177.t: "The Fate of [LUX.GetNameDef]"
 new_ger.177.d: "As we follow the example of Saint Boniface in his destruction of the heathens for a German Emperor, the $GER_army_modifier$ marches into [BEL.GetNameDef], securing Eupen-Malmedy and liberating our men, women and children, we must make a decision. If we are to win this war against the godless heathens in [FRA.GetNameDef] swiftly with minimal bloodshed, we must act decisively and crack a few eggs in the process, even if it may hurt our international reputation. As such, we have a great opportunity to expand our front against [BEL.GetNameDef] and [FRA.GetNameDef] by driving an armored fist through [LUX.GetNameDef]. However if we are to do this we must act swiftly and firmly and immediately."
 new_ger.177.a: "In that case let us use this to secure natural borders in the west!"
 new_ger.177.b: "Let us get this over with..."
 new_ger.177.c: "The ends do not justify the means."
 new_ger.178.t: "August von Mackensen Dies"
 new_ger.178.d: "On this day, August von Mackensen, a national hero, has died. After all his deeds of valor and having been a key defender of the Reich both against the French and the Nazis, this man has now been laid to rest."
 new_ger.178.a: "He is now in a better place."
 new_ger.179.t: "The Goal of the Infiltrators"
 new_ger.179.d: "If the Revolution is to go Swimmingly, we must infiltrate its enemies while we are still in a united front and still have a chance to do so. Issue is we only have so many agents and thus must choose where to infiltrate."
 new_ger.179.a: "Let us infiltrate the area behind the Weser to ensure a strong river line."
 new_ger.179.b: "Let us infiltrate the area around Hannover to help consolidate the North."
 new_ger.179.c: "Let us infiltrate the communications network to give us intelligence."
 new_ger.179.e: "Let us infiltrate the communications network in order to temporarily disable it."
