 GER_nva_idea_thalmann:0 "Volksarmee"
 GER_establish_NVA_idea_desc:0 "The Volksarmee is the proud revolutionary army of [ROOT.GetNameDef] defending the Revolution, the Workers and the Farmers."
 GER_establish_nva_brandler:0 "Établir le VW"
 GER_establish_nva_soviet:0 "Créer la NVA"
 GER_establish_nva_thalmann:0 "Établir le VA"
 GER_nva_joint_military_exercise_idea:0 "Exercice militaire conjoint en cours"
 GER_nva_joint_military_exercise_idea_desc:0 "Les exercices militaires sont monnaie courante de nos jours. [ROOT.GetNameDefCap] participe actuellement à un exercice conjoint avec un allié."
 GER_NVA_category:0 "The Volksarmee"
 GER_NVA_category_desc:0 "The Volksarmee was established after our victory in the civil war and is protecting this country, its people and the interests of the proletariat. It is the beacon of the socialist world in eastern and central europe. If we want the revolution to be protected or even expanded, we will have to handle the Volksarmee with great care but also with priority."
 GER_nva_institute_equal_service:0 "Institut pour l'égalité des services"
 GER_nva_institute_equal_service_desc:0 "La révolution a réussi et devrait concerner tous les Allemands de la même manière. Nous ne pouvons donc pas continuer à interdire aux femmes de servir dans l'armée."
 GER_nva_military_exercise:0 "Commander un exercice militaire"
 GER_nva_military_exercise_desc:0 "Bien que nous disposions d’une armée permanente solide, il reste à voir si elle est efficace sur le terrain. Nous devrions lancer un exercice militaire de grande envergure pour déterminer notre état de préparation militaire."
 GER_nva_military_exercise_modifier_tt:0 "Coût quotidien en pouvoir politique : §R+0,25§!\nGain quotidien en pouvoir de commandement : §R-0,50§!\nAttrition : §R+4,00 %§!\nTemps d'entraînement : §G-15,00 %§!\nGain d'expérience militaire : §G+20,0 %§!\nGain d'expérience aérienne : §G+10,0 %§!\nGain d'expérience navale : §G+5,0 %§!"
 GER_nva_joint_military_exercise_idea_modifier_tt:0 "Coût en pouvoir politique : §R0,25§!\nGain en pouvoir de commandement : §R-0,50§!\nAttrition : §R+4,00%§!\nGain d'expérience militaire : §G25,0%§!\nGain d'expérience aérienne : §G25,0%§!"
 GER_nva_joint_military_exercise:0 "Proposer un exercice conjoint"
 GER_nva_joint_military_exercise_desc:0 "Nous disposons d’alliés compétents avec lesquels nous pouvons mettre en pratique nos tactiques et optimiser notre coopération sur le champ de bataille."
 GER_otto_wels:0 "Otto Wels"
 GER_election_comission:0 "Commission électorale"
 r56.ger.60.t:0 "Jour d'élection !"
 r56.ger.60.desc:0 "A democratic country needs its elections to function, today these elections will be held and the winner will lead the government and therefore get the position of president.\n\nThere are two major parties that have a shot at winning the elections. By far the most popular party is the SPD which has had considerable influence over [ROOT.GetAdjectiveCap] politics for most of its existance. They represent social democratic viewpoints, favoring the lower classes of workers by strengthening trade unions and establishing a socialsytem.\nTheir main competitor is Zentrum, the somewhat older and more centrist party of the two. Their main voters are catholics from south germany. The party is more conservative in their cultural and economic policies, yet it does not shy away from increasing benefits for workers.\n\nNow, all votes have been counted and the results are as follows:"
 r56.ger.60.a:0 "Le Zentrum gagne de manière décisive !"
 r56.ger.60.b:0 "Le SPD gagne de manière décisive !"
 r56.ger.60.c:0 "Le Zentrum gagne de justesse et forme une coalition."
 r56.ger.60.d:0 "Le SPD remporte une victoire serrée et forme une coalition."
 r56.ger.60.e:0 "Le gouvernement actuel obtient encore 4 ans de pouvoir sans opposition !"
 r56.ger.61.t:0 "Décès d'Otto Wels à l'âge de 66 ans"
 r56.ger.61.desc:0 "\"Otto Wels, l'un des derniers bastions à tomber face au fascisme, est décédé aujourd'hui à l'âge de 66 ans. Il a été le président du SPD pendant 20 ans et a dirigé le pays depuis la chute du fascisme lors de la guerre civile.\n\nIl est difficile de sous-estimer l'importance de cette personnalité dans la politique de [ROOT.GetAdjectiveCap]. Peu de personnes parviendront à égaler son héritage. Son successeur, Hans Vogel, assumera désormais la présidence du pays. Espérons qu'il connaîtra un mandat à la hauteur de celui de Wels.\n\nOtto Wels sera enterré dans les prochains jours, alors que le pays pleure encore sa perte. Sa pierre tombale portera une citation de son dernier discours prononcé en 1933, avant l'adoption de la loi habilitante :\""
 r56.ger.61.a:0 "\"Vous pouvez nous prendre notre liberté et notre vie, mais vous ne pourrez jamais nous prendre notre dignité !\""
 r56.ger.63.t:0 "Décès de Hans Vogel à l'âge de 58 ans"
 r56.ger.63.desc:0 "Le président est mort. Il s'est éteint paisiblement dans son sommeil à l'âge de 58 ans. Bien que relativement jeune, il a eu une vie bien remplie, consacrée à l'Allemagne et à sa prospérité.\n\nIl a été politiquement actif dans les syndicats dès son plus jeune âge et a été un pilier de la politique allemande pendant plusieurs décennies. Il est devenu coprésident du SPD, avec Otto Wels et Arthur Crispien en 1931. Après la mort de Wels en 1939, il est devenu lui-même président, menant l'Allemagne vers un avenir brillant.\n\nSon successeur, Kurt Schumacher, deviendra officiellement président dans les prochains jours, alors que l'ancien président du pays sera enterré dans un cimetière à Berlin."
 r56.ger.63.a:0 "Reposez en paix. Schumacher sera un digne successeur."
