 GER_cult_of_personality: "Cult of Personality"
 GER_construct_the_karl_marx_cultural_instutute: "Construct the Karl Marx Cultural Institute"
 GER_construct_the_karl_marx_cultural_instutute_desc: "Karl Marx has been the harbringer of communism. As such, the German government shall build a cultural institute in his honor and in the honor of the liberation of our workers. It will be placed on his birthplace and home town of Trier. This institute now serves as both a monument of the global communist Revolution and as a institute for the education of our people and the establishment of a new German culture."
 GER_honor_the_legacy_of_marx: "Fulfill Marx Legacy of Workers Liberation"
 GER_honor_the_legacy_of_marx_desc: "Marx vision of workers liberation has finally been brought to his home and birthplace. Let us revel in this and honor this legacy. The world must know, after all this time, Marx has been proven right!"
 GER_military_led_state_building: "Military Led State Building"
 GER_military_led_state_building_desc: "It is Beck and his army that must build up the state. Let us work to expand their political power to insure the long term survival of this great institution."
 GER_expand_the_reichsverweserschaft: "Expand the Reichsverweserschaft"
 GER_expand_the_reichsverweserschaft_desc: "Beck's official title is Reichsverweser, or general secretary. While this is by all means a position of great power and prestige, let us officially expand its duties to further cement his rule in the nation."
 GER_entrench_the_gilded_cage: "Entrench the Gilded Cage"
 GER_entrench_the_gilded_cage_desc: "The Kaiser is currently in a position of limbo, while he has a fair amount of power, Beck is much more powerful than him. Now, let us put the Kaiser in his place and ensure that he is in a gilded cage and knows it, so that he will serve as the ideal figurehead while leaving the actual ruling to Beck. After all, the Kaiser ows this to the Reichsverweser."
 GER_power_to_the_aristocracy: "Grant Power to the Aristocracy"
 GER_power_to_the_aristocracy_desc: "The aristocracy has become a key pillar of our rule. As such we shall grant them more power, allowing their estates to become part of government in some state along with the Kaisers influence being greatly increased."
 GER_consolidate_the_kaiserreich: "Consolidate the New System"
 GER_consoldiate_the_kaiserreich_desc: "Beck and Wilhelm's new diarchy must be consolidated as the two men have built up their power. As such, let us strive towards a long term stable option for German governance."
 GER_the_compromise_for_national_order: "The Compromise for National Order"
 GER_the_compromise_for_national_order_desc: "With the balance of power having shifted further and further from Beck's absolute rule, the longstanding status quo between Beck and Wilhelm must be made into something more permanent. Rather than having overlapping spheres of power and conflicting interests, the two men shall divide and conquer, with Wilhelm IV takin charge of the diplomatic and civilian matters of the nation, while Beck handles the military and security apparatus. Thus the strengths of both men shall be used as they for once see each other as equals and partners to rule together, instead of Wilhelm IV being a mere pawn."
 GER_militarize_socity: "Militarize Society"
 GER_militarize_socity_desc: "If Germany is to thrive, the military must be strong, and the people must be capable of defending themselves and be willing to fight for the Kaiser."
 GER_tighten_naval_intelligence: "Tighten Naval Intelligence"
 GER_tighten_naval_intelligence_desc: "We must live by the motto that the enemy is constantly listening to us. As such let us tighten naval intelligence and make sure that no enemy hears our secrets."
 GER_seize_direct_control: "Seize Direct Control"
 GER_seize_direct_control_desc: "It is time to retake command on the high seas. None will oppose the admiral and his naval prowess!"
 GER_invest_in_the_naval_pet_project: "Invest in the Naval Pet Project"
 GER_invest_in_the_naval_pet_project_desc: "The navy has long been a key part of Canaris' life and a passion of his. As such we shall invest into it and bring honor to this man's naval legacy."
 GER_tie_the_aristocracy_into_the_nsdap: "Secure the Aristocracy into the NSDAP"
 GER_stabilize_the_heavy_industry: "Stabilize the Heavy Industry"
 GER_secure_a_full_economic_recovery: "Secure a Full Economic Recovery"
 GER_war_fueled_economy_building: "War-Fueled Economy Building"
 GER_push_a_moderate_reamament_program: "Push a Moderate Rearmament Program"
 GER_push_a_moderate_reamament_program_desc: "The Current state of the MEFO bills is cannibalizing our economy much to fast for us to cope. We must instead moderate our military spending, while still purising our goal of militarization, just in a more balanced way."
 GER_offer_concessions_to_the_elites: "Offer Concessions to the Elites"
 GER_offer_concessions_to_the_elites_desc: "The elites can be of much use to our regime. Let us capitalize on this and make the most of this."
 GER_alliance_with_the_united_evangelical_church: "Alliance with the United Evangelical Church"
 GER_alliance_with_the_united_evangelical_church_desc: "A forced merger between the Calvinist and Lutheran Churches, the United Evangelical Chuch has been the Hohenzollern church of choice and a unique staple of the German religious scene. Let us now work with it and consolidate this alliance."
 GER_end_the_divide_between_state_and_church: "End the Divide Between State and Church"
 GER_end_the_divide_between_state_and_church_desc: "The state and the church have been divided by the godless Weimar Republic, let us go ahead and end this disgusting status quo."
 GER_coopt_the_sa: "Coopt the SA"
 GER_coopt_the_sa_desc: "While we have been unable to properly deal with the SA so far, we can coopt it instead of fighting it, allowing us to gain great benefits in exchange for keeping it alive."
 GER_towards_national_militarization: "Strive Towards National Militarization"
 GER_towards_national_militarization_desc: "We must work towards a state where the entire national is mobilized and militarized if we are to stand against the degenerate hordes around us!"
 GER_noble_advisors: "Reimplement Noble Advisors in the Heer"
 GER_noble_advisors_desc: "The Heer functioned best under the careful watch and guidance of noble advisors. As such, let us reimplement this old system and add these wise guiding figures to the army."
 GER_cleanse_the_kaiser_wilhelm_institute: "Cleanse & Expand the Kaiser Wilhelm Inst."
 GER_cleanse_the_kaiser_wilhelm_institute_desc: "The Kaiser Wilhelm Institute has been coopted by the Nazis, let us cleanse it from this degenerated influence and expand it to new heights!"
 GER_import_soviet_sciences: "Copy Soviet Sciences"
 GER_import_soviet_sciences_desc: "We must copy the soviet scientists and use what they have worked on to pave our way."
 GER_return_to_german_brilliance: "Return to German Brilliance"
 GER_return_to_german_brilliance_desc: "Germany once dominated the field of science. Let us return to this status quo and bring back our scientific prowess!"
 GER_secure_western_science_funding: "Obtain Western Science Funding"
 GER_secure_western_science_funding_desc: "If our Sciences are to flourish, we need more funds, let us reach out to our newfound friends to secure these!"
 GER_bring_the_kaiserreich_back_to_the_forefront_of_development: "Restore the Reich's Scientific Primacy"
 GER_bring_the_kaiserreich_back_to_the_forefront_of_development_desc: "The Kaiserreich was once the home of one of the most brilliant nations in the world, let us bring this back and once again restore this!"
 GER_towards_a_european_research_sphere: "Towards a European Research Sphere"
 GER_towards_a_european_research_sphere_desc: "If we are to prosper, we must work together and share our work, let us therefore strive to help eachother in this aspect."
 GER_r56_glorious_mechanical_mechanations: "$GER_glorious_mechanical_machinations$"
 GER_r56_glorious_mechanical_mechanations_desc: "$GER_glorious_mechanical_machinations_desc$"
 GER_end_the_german_brain_drain: "$GER_reverse_the_brain_drain_ww$"
 GER_end_the_german_brain_drain_desc: "$GER_reverse_the_brain_drain_ww_desc$"
 GER_r56_shared_r_and_d_programs: "$GER_shared_rd_programs_ww$"
 GER_r56_shared_r_and_d_programs_desc: "$GER_shared_rd_programs_ww_desc$"
 GER_r56_pool_technical_know_how: "$GER_pool_technical_know_how_ww$"
 GER_r56_pool_technical_know_how_desc: "$GER_pool_technical_know_how_ww_desc$"
 GER_r56_mannheim_project: "$GER_the_mannheim_project_ww$"
 GER_r56_mannheim_project_desc: "$GER_the_mannheim_project_ww_desc$"
 GER_approach_the_anglosphere: "Approach the Anglosphere"
 GER_approach_the_anglosphere_desc: "The Anglosphere shares many cultural ties with us Germans, furthermore it has influence all over the world. We should make a dedicated effort to court the nations in it order to spread our influence and prosper."
 GER_open_up_a_latin_connection: "Open Up a Latin Connection"
 GER_open_up_a_latin_connection_desc: "We have many ethnic Germans in Latin America, furthermore many people there admire our culture. Let us therefore use this to our advantage to forge a concrete connection with these resource rich and strategically well positioned nations."
 GER_establish_the_european_coal_and_steel_community: "Found the European Coal & Steel Community"
 GER_establish_the_european_coal_and_steel_community_desc: "If Europe is the thrive, it must work together.Only by pooling Resources and sharing critical resources will prosperity be achieved for all. Therefore it is of utmost importance that we make sure that all european nations have access to coal and steel for their civilian economies."
 GER_encircle_the_entente_powers: "Encircle the Entente Powers"
 GER_encircle_the_entente_powers_desc: "Should we manage to woo Iberia into our Faction, we would be able to encircle the French along with getting ideal ground to seize gibraltar, greatly strengthening our power at the cost of that of the old Entente. They may have beat us once, but they won't do so again!"
 GER_fight_the_apo: "Take the Fight to the Enemy"
 GER_fight_the_apo_desc: "Protecting our own democratic institutions is not enough. Instead we must focus on taking the fight to the enemy, destroying the bases of the SA and Antifaschistische Aktion, preventing further dissidence and uprisings against our great republic!"
 GER_GER_fate_of_nazism: "Decide a Fate for Nazism"
 GER_GER_fate_of_nazism_desc: "With national socialism having had its illusion of omnipotence shattered, it is now time to decide what to do with the core ideals of this movement. Are they something understandable and forgiviable to have in some limited form or are they downright evil and a blight on German History?"
 GER_an_outstreched_arm_towards_the_east: "An Outstretched Arm Towards the East"
 GER_an_outstreched_arm_towards_the_east_desc: "Believe it or not, it seems there may be at least a few sensible people in Russia, let us speak with them and work together to secure peace!"
 GER_heavy_handed_foreign_policy: "Adopt a Heavy Handed Foreign Policy"
 GER_heavy_handed_foreign_policy_desc: "In diplomacy action must be decisive and it must be fast, let us make sure to embody this even if it may crack an eggshell or two."
 GER_liberation_for_the_sudetendeutsche: "Liberate the Sudetendeutsche"
 GER_liberation_for_the_sudetendeutsche_desc: "The Sudetengermans have long been oppressed by the Czechs, it is time to bring them home into the Reich and free their bonds!"
 GER_open_the_asia_department: "Turn an Eye Towards the Far East"
 GER_open_the_asia_department_desc: "Our diplomacy cannot only extent to europe, instead we must look outwards, towards the far east. In Asia we can find new allies and secure new bases to expand our reach and deal with our enemies."
 GER_align_the_balkans: "Align the Balkans"
 GER_align_the_balkans_desc: "The Balkans are the ideal field to spread our influence in. We shall spread it there and secure as much of it as we can. After all, we must build an alliance to be ready for war!"
 GER_solve_the_economic_catastrophe: "Solve the Economic Catastrophe"
 GER_solve_the_economic_catastrophe_desc: "The Nazis have run the Economy into the Ground with the likes of the MEFO bills and other measures to improve the economy in the short term. This has made it brittle and ready to blow. We must address this crisis and prevent it from spiraling out of control. Though to do so would be quite costly and could potentially hurt the economy even more. Regardless something must be done!"
 GER_solve_the_economic_catastrophe_r56: "Solve the Economic Catastrophe"
 GER_solve_the_economic_catastrophe_r56_desc: "The Nazis have run the Economy into the Ground with the likes of the MEFO bills and other measures to improve the economy in the short term. This has made it brittle and ready to blow. We must address this crisis and prevent it from spiraling out of control. Though to do so would be quite costly and could potentially hurt the economy even more. Regardless something must be done!"
 GER_expand_control_over_the_wehrmacht: "Seize Direct Control over the Heer"
 GER_expand_control_over_the_wehrmacht_desc: "The Heer is to obey the Kaiser, not the other way around, therefore let us expand his control of this organization and make him head of it."
 GER_reforge_the_stahlhelm: "Reforge the Stahlhelm"
 GER_reforge_the_stahlhelm_desc: "We used to have great ties to the Stahlhem until they were dissolved by the Nazis. Let us rebuild it and ensure that this great organization that once served our Nation so well is rewarded suitably!"
 GER_a_patriotic_monarchy: "A Patriotic Monarchy"
 GER_a_patriotic_monarchy_desc: "The Monarchy must unite the Nation and be popular if it is to survive and prevent another revolution."
 GER_clear_the_facist_lair: "Clear the Fascist Lair"
 GER_clear_the_facist_lair_desc: "Fascism originally spread to us from Italy, if we are to make sure it never comes back to us, we must destroy them an their ideology once and for all!"
 GER_a_human_face_for_europe: "A Human Face for Eastern Europe"
 GER_a_human_face_for_europe_desc: "Eastern Europe shall now see a new light! We will defend it from the soviet menace and ensure stability and peace in the east!"
 GER_vanquish_the_eastern_threat: "Vanquish the [SOV.GetAdjective] Menace"
 GER_vanquish_the_eastern_threat_desc: "The [SOV.GetAdjective] state has been constantly causing problems and warmongering even more than Hitler ever did, let us save the continent and wipe out this existential threat!"
 GER_increase_factional_defenses: "Increase Factional Defenses"
 GER_increase_factional_defenses_desc: "If our alliance is to be secure, we must increase its defenses and ensure that it will not fall no matter what happens!"
 GER_a_europe_of_the_fatherlands: "Secure a Europe of the Fatherlands"
 GER_a_europe_of_the_fatherlands_desc: "The key to a strong Europe is that all nations maintain their sovereignty, let us set out to achieve this!"
 GER_a_europe_around_the_reich: "Build Europe Around the Fatherland"
 GER_a_europe_around_the_reich_desc: "Germany is to be the centerpiece and key to europe, to lead it and guide it to ensure its continued greatness!"
 GER_reestablish_colonial_claims: "Reestablish Colonial Claims"
 GER_reestablish_colonial_claims_desc: "After the Great War, we were unjustly bereaved of our colonies, now it is time to reclaim and restore our most prized posessions!"
 GER_reapproach_the_west: "Reconcile the West"
 GER_reapproach_the_west_desc: "All the bad blood between us and the French and British is a waste, let us seek rapprochement with them and a new friendship!"
 GER_rekindle_the_franco_german_rivalry: "Rekindle the Franco-German Rivalry"
 GER_rekindle_the_franco_german_rivalry_desc: "The French have long been our enemies and still are. We shall no longer pretend to get along, instead, let us prepare for war and deal with this scum!"
 GER_renegotiate_versailles_new: "Renegotiate the Locarno Pact"
 GER_renegotiate_versailles_new_desc: "The Locarno Pact was the first step in the right direction, serving to bring reason and justice to the treaty of Versailles. Despite this, it was only a first step in the right direction. Let us, now that we have good standing with the French renegotiate this treaty under even more positive terms, such as a not immutable western border, lower military restrictions and better trade relations, along with far fewer reparations, allowing for Germany to truly thrive without the need for another war!"
 GER_germans_everywhere_united: "Germans Everywhere United"
 GER_germans_everywhere_united_desc: "The Germans have finally been united under one state! Let us rejoice in this fact an in our great leader who brought this about!"
 GER_end_the_austria_debate: "End the Austria Debate"
 GER_end_the_austria_debate_desc: "The Fate of Austria has been a topic long debated by many, some suggesting full unification, others two seperate States, we must work to find a solution for this."
 GER_solve_the_danzig_issue: "Solve the Danzig Issue"
 GER_solve_the_danzig_issue_desc: "Danzig is German and will always be so, thus we will solve this issue and work to ensure the cessation of the oppression of our countrymen!"
 GER_move_to_restore_brest_litovsk: "Move to Restore Brest Litovsk"
 GER_move_to_restore_brest_litovsk_desc: "The German Empire has never had more influence than under the treaty of Brest-Litovsk. This treaty must be restored in order to restore the German Empire's greatness and glory and influence. All of Eastern Europe shall tremble and kneel before the new Germany!"
 GER_reaffirm_territorial_claims: "Reaffirm Ethnic Claims"
 GER_reaffirm_territorial_claims_desc: "Having lost many a German land after the great war, we must undo this and seek for the unification and salvation of the German People!"
 GER_build_a_pakt_around_berlin: "Build a Pact Around Berlin"
 GER_build_a_pakt_around_berlin_desc: "Berlin has always been the center of European politics, we will thus build a pact around it, greater and more influential than the Central Powers ever were!"
 GER_step_back_into_the_international_community: "Return to the International Stage"
 GER_step_back_into_the_international_community_desc: "It is time for the new Germany to entertain largescale foreign politics and forge new allies!"
 GER_control_the_press: "Control the Press"
 GER_control_the_press_desc: "The Press is key to securing Germany for the Kaiser. We must take charge of it if we are to bring a full restoration!"
 GER_embark_on_the_quest_to_absolutism: "Embark on the Quest to Absolutism"
 GER_embark_on_the_quest_to_absolutism_desc: "It is time to return to absolutism, centralizing the nation around the Kaiser and turning it away from Beck!"
 GER_expand_liberalization_efforts: "Expand Liberalization Efforts"
 GER_expand_liberalization_efforts_desc: "The nation must be liberalized if it is to go into a new future. The Kaiser will help achieve this."
 GER_prepare_the_new_era: "Prepare the New Era"
 GER_prepare_the_new_era_desc: "It is now finally time to go into a very limited parliamentary system. Beck and Louis Ferdinand have spoken and have put everything in place now."
 GER_bring_back_the_old_heirarchy: "Bring Back the Old Hierarchy"
 GER_bring_back_the_old_heirarchy_desc: "The old Hierarchy of Germany must be brought back! The Elites must rule and guide the nation forwards."
 GER_a_germany_of_the_elites: "A Germany of the Elites"
 GER_a_germany_of_the_elites_desc: "We have done it! Germany is back as it once was, us and our wise elites rule the nation and can bring it to glory!"
 GER_work_with_the_aristocracy: "Work with the Aristocracy"
 GER_work_with_the_aristocracy_desc: "The Aristocracy is the heart of Germany! It is the key go restoring prosperity and greatness in our state and among our people!"
 GER_natural_leadership_for_the_best_men: "Natural Leadership for the Best Men"
 GER_natural_leadership_for_the_best_men_desc: "The Kaiser, the best man, must rule the nation. He will lead it and all of us to victory!"
 GER_espouse_voelkish_nationalism: "Espouse Völkisch Nationalism"
 GER_espouse_voelkish_nationalism_desc: "The Kaiser and the People are one and one Blood. Let us support and espouse this ideolgy to rally the Nation around him!"
 GER_radicalize_the_army: "Radicalize the Army"
 GER_radicalize_the_army_desc: "Fervor in the army will spread and become fervor among the people. Let us expand and radicalize this in order to fully dominate the nation!"
 GER_achieve_national_renewal: "Achieve National Renewal"
 GER_achieve_national_renewal_desc: "It is time to renew our nation and free it from the republican era! Degeneracy will no longer rule the Nation."
 GER_build_a_cult_of_personality: "Construct a Cult of Personality"
 GER_build_a_cult_of_personality_desc: "If the new Kaiserreich is to thrive, a cult of personality will be key to achieving it. None will be able to stand against the Kaiser!"
 GER_secure_the_armys_support: "Secure the Army's Support"
 GER_secure_the_armys_support_desc: "The support of the army is key and to secure it Wilhelm III's connections will be used to great effect!"
 GER_personal_leadership: "Take Field Command"
 GER_personal_leadership_desc: "The time has come for the Kaiser to lead the army in the field again. It is with him that we will wreak havoc on our enemies."
 GER_reach_out_to_old_allies: "Reach Out to Old Allies"
 GER_reach_out_to_old_allies_desc: "A method to quickly secure the state and people would be to use the help of the nazis, forging a monarchy that is built in the people and from popularity."
 GER_distance_from_past_mistakes: "Distance the Kaiser from his Mistakes"
 GER_distance_from_past_mistakes_desc: "The Kaiser was once closely associated to the Nazis and Hitler. We must undo this if he is to be able to hold onto his power."
 GER_full_rehabilitation: "Fully Rehabilitate the Kaiser"
 GER_full_rehabilitation_desc: "The Kaiser, having shown to have is true loyalties align with good men, can now be fully rehabilitated."
 GER_fufill_the_legacy_of_rohm: "Fulfill Rohm's Legacy"
 GER_fufill_the_legacy_of_rohm_desc: "It was Rohm who made the SA great. Let us make him an example and fulfill his legacy! It is the NRAF that is full of Rohm's Heirs!"
 GER_the_president_for_life: "Officialize the President for Life"
 GER_the_president_for_life_desc: "With parties disbanded, we can now make Strasser the president for life, removing any chance at destorying his power."
 GER_end_political_parties: "End Political Parties"
 GER_end_political_parties_desc: "Political parties are too damaging and destructive for the Reich. They must all go, as the NRAF has served it's purpose!"
 GER_remove_fatherlandless_fellows_from_power: "Sack the Fatherlandless Fellows"
 GER_remove_fatherlandless_fellows_from_power_desc: "Beck and his allies in the military must be sacked and removed from any postitions of power. The Kaiser will be the sole source of power in the Reich!"
 GER_rely_on_divine_right: "Rely on Divine Right"
 GER_rely_on_divine_right_desc: "It is by divine right that we rule. Let us make use of that in our propaganda and ensure that the Kaiser's authority goes unquestioned!"
 GER_restore_the_fahneneid: "Restore the Fahneneid"
 GER_restore_the_fahneneid_desc: "It must be reinstituted that all must swear allegiance to the Kaiser, especially the army. None will resist his rule! All hail the Kaiser!"
 GER_restore_the_glories_of_the_bismarkian_era: "Restore the Glories of the Bismarck Era"
 GER_restore_the_glories_of_the_bismarkian_era_desc: "Germany was last truly glorious under Bismarck! Let us emulate the Kaiser's power back then and ensure that we return to that standard. While the Kaiser may not have always been on best terms with the man, he is nonetheless a hero we should look up to."
 GER_reconcile_the_crown_prince: "Reconcile the Crown Prince"
 GER_reconcile_the_crown_prince_desc: "While Louis Ferdinand has recently angered his grandfather, Wilhelm III did much less worse in the past, after all, he did not advocate for liberalism. Therefore the father shall reconcile the son and restore plans to make Wilhelm III the next Kaiser."
 GER_the_old_man_still_has_it: "The Old Kaiser Back Again"
 GER_the_old_man_still_has_it_desc: "Wilhelm II has somehow fenagled his way back into power. It seems as though he still is in a position to rule, at least for now..."
 GER_spread_order_under_the_kaiser: "Spread Order Under the Kaiser"
 GER_spread_order_under_the_kaiser_desc: "Order must be brought to the nation if Germany is to be strong. Let us work to stabilizing the Nation under the Kaiser."
 GER_deal_with_hugenberg: "Deal with Hugenberg"
 GER_deal_with_hugenberg_desc: "Hugenberg is crazy and must be removed from DNVP leadership. Let us oust this man and ensure his downfall!"
 GER_the_past_purified: "The Past Purified"
 GER_the_past_purified_desc: "Through our work we have purified two aspects of our nation. On one hand, we have dealt with the lingering national socialist ideals, and on the other, we have forged a greater and better Kaiserreich. Let us rejoice in this!"
 GER_spread_ideals_of_soldierly_conscience: "Spread Ideals of a Soldierly Conscience"
 GER_spread_ideals_of_soldierly_conscience_desc: "Our soldiers must understand that they are to serve God first, then their nation. Thus they should treat their enemies with respect and kindness and not abuse the local population, instead fighting well and for what is right."
 GER_embrace_christian_humanism: "Embrace Christian Humanism"
 GER_embrace_christian_humanism_desc: "We must embrace Christian values and emphasize our people, helping to turn the country for their good, rather than that of the elites."
 GER_modernize_the_monarchy: "Modernize the Monarchy"
 GER_modernize_the_monarchy_desc: "Monarchy must adapt to the new times, if it is to hold. We will uphold the ideals of rule of law and such instead of absolutism and power."
 GER_an_old_germany_for_a_new_age: "An Old Germany for a New Age"
 GER_an_old_germany_for_a_new_age_desc: "In Many ways we have brought back the old Germany to our new state. We can truly benefit from both modernity and technology as well as our traditions and virtues."
 GER_fully_embrace_tradition: "Fully Embrace Tradition"
 GER_fully_embrace_tradition_desc: "The first step of accurately assessing the future is correctly assessing the past. Thus we will look at the things we did correctly in the past and learn from them!"
 GER_restore_discipline_in_the_military: "Enshrine Military Tradition"
 GER_restore_discipline_in_the_military_desc: "The Military was only ever strong through the strengths of the Prussian virtues. With these enshrined, we can now restore the disciplined force that our armed forces once were! Prussia shall be the unrivaled master of European military development once more!"
 GER_a_guided_kaiserreich: "Guide a New Kaiserreich"
 GER_a_guided_kaiserreich_desc: "The last time Germany was stable was under the Kaiser. We should go back to that just with clear measures in place to make sure it doesn't end like last time."
 GER_extol_prussian_virtue: "Extol the Prussian Virtues"
 GER_extol_prussian_virtue_desc: "Prussian virtues are what made Germany great, and we must bring them back. Our people must yearn for these morals and act accordingly."
 GER_the_kaiser_rises: "The Rebirth of the Kaiserreich"
 GER_the_kaiser_rises_desc: "It was in the Era of Wilhelm I. and Bismarck that Germany was born, as these two men forged the Kaiserreich from a tangled mess of statelets and ruled it with justice and might. On this day, we have managed to restore this great system under the new Kaiser and [GER.GetLeader], his right hand man. Let us take joy in this new hope for Germany!"
 GER_the_kaiser_rises_fake: "The Rebirth of the Kaiserreich"
 GER_the_kaiser_rises_fake_desc: "Germany has now regressed in time and while the Kaiser is still not what he once was, the nation has gone far into that direction."
 GER_a_new_monarch_for_a_new_age: "The New Kaiser Empowered"
 GER_a_new_monarch_for_a_new_age_desc: "Having taken charge of the German monarchy after his grandfather's abdication, the Kaiser has now been given great power over the future of Germany and is set to help bring the nation into a bright new future!"
 GER_politicize_the_abwehr: "Politicize the Abwehr"
 GER_politicize_the_abwehr_desc: "If the State is to survive, we must use the abwehr to control politics so that all goes on under our careful watch. None will resist Canaris's rule!"
 GER_found_the_new_german_state: "Establish the New German State"
 GER_found_the_new_german_state_desc: "With the Nazis defeated, it is time to establish our state and ensure a bright and new future under our new regime."
 GER_deal_with_resistance_in_the_heer: "Deal with Resistance in the Heer"
 GER_deal_with_resistance_in_the_heer_desc: "Beck's resistance in the Heer must finally be dealt with. Let us dissolve this opposition and destroy this futile resitance."
 GER_transfer_party_leadership_to_canaris: "Assume Control over the DNVP Clique"
 GER_transfer_party_leadership_to_canaris_desc: "The DNVP is quite the roudy group, and prone to cause problems for the VDP long term. Therefore we must stage an election among all DNVP members to dictate Canaris as leader in Goerdeler's shoes to legitimize his power."
 GER_integrate_the_zentrum: "Integrate the Zentrum"
 GER_integrate_the_zentrum_desc: "Integrating the Zentrum, full of religious conservatives and a party of the people is key to giving us the reach we need. This will move all of their support into that of the VDP."
 GER_integrate_the_monarchists: "Integrate the Monarchists"
 GER_integrate_the_monarchists_desc: "The Monarchists should join the VDP as well, giving us key power among some of the most militant conservatives, calming them and fortifying our power."
 GER_integrate_the_dnvp: "Integrate the DNVP"
 GER_integrate_the_dnvp_desc: "The DNVP, masters of rallying the people and the people who overthrew Hitler will be key for our cause. Bringing great power to the VDP."
 GER_unite_the_bearocratic_colossus: "Unite the Bureaucratic Colossus"
 GER_unite_the_bearocratic_colossus_desc: "With our recent integrations, the VDP has become a bit of a fractured party. To combat this, we will work to unite an centralize this big tent party, to prevent further factionalism and collpase."
 GER_form_the_league_of_patriots: "Form the VDP"
 GER_form_the_league_of_patriots_desc: "We will for the 'Verband Deutscher Patrioten', or 'League of German Patriots', short VDP, a grand party of German conservatives who will lead the nation to glory and strength once more, led and organized by beck. This big tent Party will help us reform the nation away from the populistic tyranny it was under Hitler."
 GER_all_under_the_grey_emminence: "Germany Enveloped in the Grey Eminence"
 GER_all_under_the_grey_emminence_desc: "Canaris has slowly begun to take over more and more of the nation, to the point that he has been called the grey eminence. It is now time to ensure that everything runs accross his desk."
 GER_heirarchy_without_tyranny: "Hierarchy without Tyranny"
 GER_heirarchy_without_tyranny_desc: "We must go back to the good old days where the traditional hierarchy still existed, however we must not do it in the way the Nazis did, rather not enforcing it via tyranny."
 GER_an_irresistable_moral_guide: "An Irresistible Moral Guide"
 GER_an_irresistable_moral_guide_desc: "To prevent the calamity that was the last dictatorship under the Nazis, we must teach the German people morals and ensure that they follow them to the T."
 GER_move_towards_autocracy: "Ensure a Stranglehold on Power"
 GER_move_towards_autocracy_desc: "Germany is not in a position where self rule is possible or sustainable, as seen by the Weimar republic. Therefore the Government must be fully run by Canaris to prevent any dissidence."
 GER_forge_an_alliance_with_the_church: "Forge An Alliance With the Church"
 GER_forge_an_alliance_with_the_church_desc: "Germany is a Christian Nation, and thus if its government is to last, it must work with the Church."
 GER_implement_state_religion: "Implement State Religion"
 GER_implement_state_religion_desc: "To fulfill our obligation to God, we must not only work with the Church, but strengthen it. To do this, the state Church will be fully restored and built up, ending the Weimar notion of secularism."
 GER_the_abwehrs_germany: "Germany under Canaris"
 GER_the_abwehrs_germany_desc: "Canaris and the Abwher have made their ploy and successfully taken charge of our new state. Let us hope that this will bring us into a new era of light."
 GER_a_guiding_hand_in_politics: "A Guiding Hand in Politics"
 GER_a_guiding_hand_in_politics_desc: "Politicians left unchecked are dangerous, we must instead make sure that they are guided clearly by Beck and that so the nation is kept safe."
 GER_a_dictated_parliament: "Handpick a Parliament"
 GER_a_dictated_parliament_desc: "For our transition to a more people oriented rule, we will handpick ourselves a parliament to help us with this."
 GER_move_towards_responsible_governance: "Move Towards Responsible Governance"
 GER_move_towards_responsible_governance_desc: "Responsible government must be brought to Germany, and peace restored, with the fascists being dealt with."
 GER_an_era_of_honor: "Entrench Honor in Society"
 GER_an_era_of_honor_desc: "Our society is built off of shared values and honor. We must entrench these values in our people if we should thrive again."
 GER_pass_the_beck_constiution: "Pass the Beck Constitution"
 GER_pass_the_beck_constiution_copy: "Pass the Beck Constitution"
 GER_pass_the_beck_constiution_desc: "The time has now come to restore responsible governance. With this we will pass a new constitution, going into a semi democratic system in which Beck and his chosen two parties, the Zentrum and DNVP will bring us a bright future!"
 GER_pass_the_beck_constiution_copy_desc: "The time has now come to restore responsible governance. With this we will pass a new constitution, going into a semi democratic system in which Beck and his chosen two parties, the Zentrum and DNVP will bring us a bright future!"
 GER_a_martial_state: "Germany under Beck"
 GER_a_martial_state_desc: "Beck has ousted all those standing against him and consolidated control of Germany for his conservative clique. What will come of this is yet to be seen."
 GER_restore_legality_to_germany: "Restore Legality in Politics"
 GER_restore_legality_to_germany_desc: "Politics must be based on legality and justice, with the good of all coming before radical ideology."
 GER_the_canaris_wilhelm_pakt: "Secure the Kaiser's Endorsement"
 GER_the_canaris_wilhelm_pakt_desc: "The Kaiser's endorsement will legitimize our rule. We shall sign a deal with him, making him a constitutional monarch."
 GER_expand_the_abwehr_supremacy: "Expand the Abwehr Supremacy"
 GER_expand_the_abwehr_supremacy_desc: "The Abwehr is the key to maintaining control. Through them all dissent will be found and crushed, allowing for the republic to be safe!"
 GER_install_a_loyal_army_chief: "Install a Loyal Army Chief"
 GER_install_a_loyal_army_chief_desc: "With parts of the military resisting us, we must install a loyal chief of the army to ensure that the army refrains from destabilizing our nation."
 GER_form_the_presidency: "[GER_form_the_presidency_scripted]"
 GER_form_the_presidency_desc: "[GER_form_the_presidency_desc_scripted]"
 GER_form_the_presidency_dem: "Install the Presidency"
 GER_form_the_presidency_dem_desc: "Germany must have a strong president if it is to thrive, and who do we have as a better man for that than Canaris himself, who has done so much to save tha nation?"
 GER_form_the_presidency_mon: "Install the Monarchy"
 GER_form_the_presidency_mon_desc: "Germany must have a strong monarchy if it is to thrive, and who do we have as a better man for that than Wilhelm IV himself, who has done so much to save tha nation?"
 GER_an_iron_fist_on_the_state: "An Iron First on the State"
 GER_an_iron_fist_on_the_state_desc: "The Abwehr must rule with an iron fist, preventing dissidence from escalating to a point where our rule is threatened..."
 GER_loose_the_abwehr_on_the_opposition: "Loose the Abwehr on the Opposition"
 GER_loose_the_abwehr_on_the_opposition_desc: "We must now turn the Abwehr inwards and deal with the opposition to our state. This dissidence must not be tolerated!"
 GER_offer_goerdeler_reconciliation: "Offer Goerdeler Reconciliation"
 GER_offer_goerdeler_reconciliation_desc: "We must reach out to Goerdeler and the remaining democratic resistance, if we are to bring about a long term peace to germany."
 GER_declare_the_presidential_republic: "[GER_declare_the_presidential_republic_scripted]"
 GER_declare_the_presidential_republic_desc: "[GER_declare_the_presidential_republic_scripted_desc]"
 GER_declare_the_presidential_republic_dem: "Declare the Presidential Republic"
 GER_declare_the_presidential_republic_dem_desc: "With all in place, it is time to declare the presidential republic and bring democracy to our poor people."
 GER_declare_the_presidential_republic_mon: "Make Way for new Elections"
 GER_declare_the_presidential_republic_mon_desc: "With all in place, it is time to prepare elections and ensure that everything is ready for our new monarchy."
 GER_thalmanns_cult_of_personality: "Foster a Cult of Personality"
 GER_thalmanns_cult_of_personality_desc: "Thälmann is the man who brought the revolution to Germany, let us take an example from Stalin and Build a Cult of Personality around him to unite our nation and reward the man!"
 GER_the_berlin_trials: "The Berlin Trials"
 GER_the_berlin_trials_desc: "With the revolution successful, it is time to deal with the chaos in our country and secure it from within as well as without!"
 GER_return_the_exiles: "Return the Exiles"
 GER_return_the_exiles_desc: "We have many a ally in foreign lands that we could bring in to consolidate our regime, let us get to this phenomenal task at once."
 GER_consolidate_the_party_leadership: "Solidify the Party Leadership"
 GER_consolidate_the_party_leadership_desc: "The Party Leadership must be fully secured around one person to ensure the prevention of a power struggle and a unitary state."
 GER_the_national_congress_of_councils: "The National Congress of Councils"
 GER_the_national_congress_of_councils_desc: "It is time to hold a national congress to help solidify our rule."
 GER_globalize_the_revolution: "Globalize the Revolution"
 GER_globalize_the_revolution_desc: "The Revolution must be global to truly succeed, anything else will fall short of justice!"
 GER_declare_the_ecr: "Declare the European Council Republic"
 GER_declare_the_ecr_desc: "With the revolution having made great progress, it is time to declare the European Council Republic! Long live the Revolution!"
 GER_ready_the_political_sturcture: "Ready the Political Structure"
 GER_ready_the_political_sturcture_desc: "If we are to unite europe, we must have a robust political structure, capable of integrating all these workers in government as they are liberated."
 GER_international_pro_european_propaganda: "Spread Internationalist Propaganda"
 GER_international_pro_european_propaganda_desc: "The Revolution is impossible if the people are not on our side, we must spread our propaganda to ensure that they follow suit and bring about the revolution!"
 GER_towards_european_revolution: "The Quest Towards the European Revolution"
 GER_towards_european_revolution_desc: "The Revolution must be brought to europe, allowing for us to secure the continent under our jackboot, Socialism must not be stopped!"
 GER_organize_workers_councils: "Organize Workers Councils"
 GER_organize_workers_councils_desc: "Workers Councils are the foundation of any sustainable communist state. Let us organize them to ensure the thriving of our workers."
 GER_consolidate_the_new_system: "Consolidate the New System"
 GER_consolidate_the_new_system_desc: "This new system must be consolidated and the worker councils must be empowered. With this, we will declare the council republic."
 GER_whip_the_party_into_line: "Whip the Party into Line"
 GER_whip_the_party_into_line_desc: "The Party must be loyal to the leader, ensuring that the regime is stable and untouchable."
 GER_unite_the_working_class: "Unite the Working Class"
 GER_unite_the_working_class_desc: "The Proletariat can not stand divided. We shall unite it behind our Front and secure the revolution in this way."
 GER_our_own_lennin: "Our Own Lenin"
 GER_our_own_lennin_desc: "[FROM.GetLeader] has led our country greatly. He has become what is essentially a new Lenin for our nation."
 GER_ready_the_army_for_the_external_threat: "Ready the Army for the Revolution"
 GER_ready_the_army_for_the_external_threat_desc: "The army must be ready to bring the revolution to the world, saving the proletarians everywhere."
 GER_as_with_the_sa_so_with_the_antifa: "Cast Aside the Antifaschistische Aktion"
 GER_as_with_the_sa_so_with_the_antifa_desc: "We can take an example from the Nazis on how to deal with unwanted militia groups who are gaining too much political power. They must be cast aside and removed from any military influence, lest they try to wrest ahold of the high command for themselves!"
 GER_political_commissars_focus: "Political Commissars"
 GER_political_commissars_focus_desc: "Political Commissars will keep the army in line, ensuring that there will be no desertions and no betrayal of the revolution!"
 GER_appeal_for_autonomy: "Appeal for Autonomy"
 GER_appeal_for_autonomy_desc: "With our Nation stabilized and peace secured, we will now appeal for autonomy, securing our state as it's own entity."
 GER_the_revolution_secured: "Move to Secure the Revolution"
 GER_the_revolution_secured_desc: "We must act fast to secure the revolution and ensure it's survival long term, dealing with our political enemies before their cancer can fester."
 GER_officialize_the_volksarmee: "Officially Establish the Volksarmee"
 GER_officialize_the_volksarmee_desc: "We have formed a makeshift army in this civil war, let us now officialize it as the Volksarmee to deal with our enemies."
 GER_strengthen_soviet_political_support: "Request Soviet Political Support"
 GER_strengthen_soviet_political_support_desc: "If our state is to survive long, we must gain Soviet support for our new regime."
 GER_glorify_stalins_image: "Glorify Stalin's Image"
 GER_glorify_stalins_image_desc: "Stalin has done so much for the Revolution, let us hail the man and all the good he has done for us!"
 GER_a_greater_appeal_to_moscow: "The Revolution Needs Moscow"
 GER_a_greater_appeal_to_moscow_desc: "The unfortunate reality of the situation is that we alone are not enough to win this struggle. Let us appeal to Moscow to save us!"
 GER_smuggle_arms: "Smuggle in Arms"
 GER_smuggle_arms_desc: "We must smuggle arms into communist hands, to give us the edge in equipment needed to vanquish our enemies."
 GER_secure_control_over_the_brigades: "Secure the International Brigades"
 GER_secure_control_over_the_brigades_desc: "The International brigades, full of experienced fighters are key to our success, let us secure these to help us overthrow the social fascists!"
 GER_radicalize_german_workers: "Radicalize the Rank and File"
 GER_radicalize_german_workers_desc: "Many a soldier is quite acceptant of our ideology. Let us sway them so that we shall receive more support upon the launching of our uprising."
 GER_foster_a_progress_cult: "Foster a Progress Cult"
 GER_foster_a_progress_cult_desc: "Having well-trained and elite scientists funded by the government will give us a way to advance our sciences to the next level."
 GER_shake_off_the_fascist_yoke: "Shake off the Fascist Yoke"
 GER_shake_off_the_fascist_yoke_desc: "It is time to break our truce with the social fascists! We shall split from them and launch our own uprising!"
 GER_shake_off_the_fascist_yoke_dummy: "Shake off the Fascist Yoke"
 GER_shake_off_the_fascist_yoke_desc_dummy: "It is time to break our truce with the social fascists! We shall split from them and launch our own uprising!"
 GER_clamp_down_on_the_ruhr: "Grasp Hold of the Ruhr"
 GER_clamp_down_on_the_ruhr_desc: "As we are having our communist comrades return to the nation, we will make sure to use them to hold onto the Ruhr, securing power over this vital industrial hub."
 GER_industrial_cooperation_2: "Industrial Cooperation"
 GER_industrial_cooperation_2_desc: "Our cooperation with the [SOV.GetAdjectiveCap] has so far been restricted to military matters. Considering that [SOV.GetNameDef] is an ally of ours, it would only make sense for us to cooperate in other fields as well. Our industrial philosophies are already similar enough that joint efforts in the industrial sector should not be difficult to achieve."
 GER_resource_trade_2: "Resource Trade"
 GER_resource_trade_2_desc: "Though we strive to be able to support ourselves as much as possible, we must allow ourselves to trade with countries who share our ideals. By offering the [SOV.GetnameDef] some compensation in the form of industrial capacity, we should be able to secure ourselves a very beneficial deal with them."
 GER_tech_sharing_2: "Tech Sharing"
 GER_tech_sharing_2_desc: "The sharing of technology among us and other like-minded countries should be something we strive for. Reaching out to the Soviets for this endeavor seems the most rational course of action."
 GER_hold_new_elections: "Hold New Elections"
 GER_hold_new_elections_desc: "After years of dictatorship, Germany is free again! We shall hold new elections and follow the will of the poeple!"
 GER_adress_the_economy: "Address the Economy"
 GER_adress_the_economy_desc: "The German Economy must be addressed and solved."
 GER_rehabilitate_mueller: "Rehabilitate Mueller"
 GER_rehabilitate_mueller_desc: "Ludwig Mueller has done for the Nazis what we need done for us. Let us rehabilitate the man and make him Reichsbischof once again!"
 GER_kpd_in_coalition: "[GER_kpd_in_coalition_scripted]"
 GER_kpd_in_coalition_desc: "[GER_kpd_in_coalition_desc_scripted]"
 GER_kpd_in_coalition1: "KPD in Coalition"
 GER_kpd_in_coalition1_desc: "The KPD, after much struggle has finally become a relevant and legal political force, to the point that they now have a seat in government."
 GER_kpd_in_coalition2: "Move to Secure the Revolution"
 GER_kpd_in_coalition2_desc: "We must act fast to secure the revolution and ensure it's survival long term, dealing with our political enemies before their cancer can fester."
 GER_revolution_by_every_worker: "Revolution By Every Worker"
 GER_revolution_by_every_worker_desc: "Every Worker must contribute to the war, regardless of the circumstances. We will fight in the fields for victory is ours!"
 GER_phase_out_the_standing_army: "Phase Out the Standing Army"
 GER_phase_out_the_standing_army_desc: "The Standing Army has not served us adequately. They must go in favor of the Militia."
 GER_uplift_the_antifa: "Uplift the Antifaschistische Aktion"
 GER_uplift_the_antifa_desc: "The Antifaschistische Aktion is the future of the German armed forces. Let us strengthen it and build the German army up around it."
 GER_uplift_the_black_front: "Uplift the Black Front"
 GER_uplift_the_black_front_desc: "The Black Front is the future of the German armed forces. Let us strengthen it and build the German army up around it."
 GER_uplift_the_sa: "Uplift the SA"
 GER_uplift_the_sa_desc: "The SA is the future of the German armed forces. Let us strengthen it and build the German army up around it."
 GER_deal_with_the_officier_corps: "Deal With the Officer Corps"
 GER_deal_with_the_officier_corps_desc: "The Officer Corps stands against us. Let us deal with this blight on our nation."
 GER_deal_with_the_confessing_church: "Deal With the Confessing Church"
 GER_deal_with_the_confessing_church_desc: "The confessing church is a blight on our state. It shall be dismantled and destroyed."
 GER_weaken_the_presidents_power: "Weaken the President's Power"
 GER_weaken_the_presidents_power_desc: "The President has too much power and is damaging the rule of law. Let us pass legislation to reduce it and save our republic."
 GER_abandon_the_post_alltogether: "Abandon the Post Alltogether"
 GER_abandon_the_post_alltogether_desc: "The President's post has become useless and is more of a liability to our nation than anything else. Let us vanquish it."
 GER_address_inner_coaltionary_issues: "Address Inner Coalitionary Issues"
 GER_address_inner_coaltionary_issues_desc: "With all the differences in our Coalition, we shall have to work to mend these. The SPD is not all bad and we must recognize this fact."
 GER_the_new_federalism: "The New Federalism"
 GER_the_new_federalism_desc: "It is time to forge our own kind of federalism. One rooted more locally than then individual states. This will bring about economic growth and stability."
 GER_federalism_a_hedge_against_radicalism: "Federalism, the Hedge against Radicalism"
 GER_federalism_a_hedge_against_radicalism_desc: "Through our federalist principles, we can keep the radicals in local courts, stuck outside reach of real power."
 GER_build_germany_from_the_apartment_up: "Build the Nation From the Apartment Up"
 GER_build_germany_from_the_apartment_up_desc: "The Nation is founded on the familiy as the smallest individual unit. Let us build the nation on this principle."
 GER_strengthen_the_responsible_elites: "Strengthen the Responsible Elites"
 GER_strengthen_the_responsible_elites_desc: "The responsible elites have made this great nation what it is. They will be supported and strengthened."
 GER_upkeep_german_order: "Enshrine German Order"
 GER_upkeep_german_order_desc: "Germany is a nation of order, not chaos. This will be enshrined and entrenched in all of our institutions."
 GER_prioritise_the_rheinland: "Prioritize the Rhineland"
 GER_prioritise_the_rheinland_desc: "The Rhineland is both the largest economic hub of Germany and Adenauer's home. It is thus key to build it up."
 GER_increase_municipal_autonomy: "Increase Municipal Autonomy"
 GER_increase_municipal_autonomy_desc: "The City is the key to German economic growth. It will be prioritized and made autonomous to grow adequately."
 GER_ensure_a_loyal_clergyship: "Ensure a Loyal Clergyship"
 GER_ensure_a_loyal_clergyship_desc: "The clergy must be loyal and serve our government. We will use them for all of our causes."
 GER_a_patriotic_german_church: "A Patriotic German Church"
 GER_a_patriotic_german_church_desc: "The German church must be patriotic in all of its deeds. It will serve the state no matter what."
 GER_manipulate_the_churches: "Manipulate the Church"
 GER_manipulate_the_churches_desc: "The church must serve the state and do its bidding. It shall be manipulated and used to do just that and serve our bidding."
 GER_rebuild_the_shattered_zentrum: "Restore the Fractured Zentrum"
 GER_rebuild_the_shattered_zentrum_desc: "With the Zentrum fractured due to recent events, we must save the party and restore it to what it once was. The Zentrum will not fall that fast!"
 GER_adenauers_chance: "Adenauer's Chance"
 GER_adenauers_chance_desc: "Adenauer has long been a key figure in the Zentrum. He now finally has his chance at leading it and will lead the party to glory."
 GER_integrate_our_new_lands: "Farm the Frontier"
 GER_integrate_our_new_lands_desc: "Having taken some of our lands, let us begin settling and farming the new lands to ensure our food supply for good."
 GER_ensure_permanent_food_security: "Ensure Permanent Food Security"
 GER_ensure_permanent_food_security_desc: "It is done! We now have a secure source of food and agriculture. Germany can withstand a blockade and will not be defeated again!"
 GER_positive_christianty: "Positive Christianity"
 GER_positive_christianty_desc: "Christianity is not a good in of itself, instead it becomes useful when it serves the state. Christianity shall be made use of and molded in the image of the German state."
 GER_fully_rebuild_the_secret_police: "Officially Formalize the Sonderabteilung"
 GER_fully_rebuild_the_secret_police_desc: "The Abwehr will now gain a special department that will act as a secret police force to help us control the new Germany."
 GER_revive_gestapo_remnants: "Merge Gestapo Remains into the Abwehr"
 GER_revive_gestapo_remnants_desc: "The Gestapo contained many a skilled agent. We will merge them into the abwehr to bolster it."
 GER_strike_the_baltic: "Strike the Baltic"
 GER_strike_the_baltic_desc: "The Baltic Must be Reclaimed and we shall ready our army to do so. Soon our birthright and our food supply will be ensured!"
 GER_a_deal_with_the_russian_state: "A Deal With the Russian State"
 GER_a_deal_with_the_russian_state_desc: "In order to gain our lands, a deal will be signed with our friends in the east. Cooperation and funds will prevail and secure our living space."
 GER_an_eye_towards_the_east: "An Eye Towards the East"
 GER_an_eye_towards_the_east_desc: "The future of Germany lies in the east, where we will gain empty land to colonize in the Baltic and make to be truly German."
 GER_nraf_in_coalition: "NRAF in Coalition"
 GER_nraf_in_coalition_desc: "The NRAF and it's fascist goons have won themselves a seat in government. All can only hope that this ends quickly and that they do not do too much damage."
 GER_destroy_the_elites: "Break the Conservative Establishment"
 GER_destroy_the_elites_desc: "The conservative establishment has always been a thorn in our side. It must go now, along with the monarchy which resists us against the will and the good of the German man. As such, we will cultivate a new establishment to replace the old one, with the establishment such as the neo-teuton school to help bring this vision about."
 GER_declare_the_volksreich: "Declare the Volksreich"
 GER_declare_the_volksreich_desc: "The time has come to declare a new Reich. One for the common man, the volk. Hail the Fuhrer!"
 GER_turn_the_opposition_into_regional_issues: "Regionalize the Opposition"
 GER_turn_the_opposition_into_regional_issues_desc: "We shall know use federalism for what it's worth. Opposition will be relegated to regional courts and be dealt with there, allowing for the state to run unimpeded."
 GER_the_second_gleichschaltung: "Enact a Second Gleichschaltung"
 GER_the_second_gleichschaltung_desc: "The Federal states will be destroyed along with the opposition. We will not tolerate any dissent or anything taking power away from the government."
 GER_deal_with_inner_party_opposition: "Consolidate the Party Leadership"
 GER_deal_with_inner_party_opposition_desc: "The Party has fractured between Lutze and Strasser. This must be solved and the opposition swept by side as the party unites around one of them and their revolutionary ideals!"
 GER_expand_black_front_influence: "Expand Black Front Influence"
 GER_expand_black_front_influence_desc: "The Black Front has done much to empower our regime, let us strengthen it to consolidate both it's influence and our new state."
 GER_embrace_true_national_socialism: "Enshrine the Tenet of Socialism"
 GER_embrace_true_national_socialism_desc: "National Socialism, in the classical sense, is State Feudalist, the highest form of socialism in the context of the German folk. Let us enshire this tenet in the people and not let our ideology devolve into the capitalist mess Hitler made it."
 GER_the_revolution_under_strasser: "Strasser's Revolitionary Zeal"
 GER_the_revolution_under_strasser_desc: "It is Strasser's Revolutionary Zeal that leads the party and shapes it to the great thing that it is today. The German people will bask in this."
 GER_the_war_under_lutze: "Lutze's Fighting Spirit"
 GER_the_war_under_lutze_desc: "Lutze has the key experience in the streets. He will lead the party to a bright new future and secure it's influence in the German state."
 GER_build_up_worker_and_peasant_councils: "Peasants', Managers', and Workers' Councils"
 GER_build_up_worker_and_peasant_councils_desc: "The Peasants, Managers, and Workers are the bread and butter of the German economy. Let us give these brave men councils in order to give them a voice so that they can be heard and influence their state."
 GER_limited_federalist_reforms: "Limited Federalist Reforms"
 GER_limited_federalist_reforms_desc: "Limited Federalism is usefull in such a large and diverse state as Germany. We will use this to help the different parts of the nation prosper equally under the bright sun."
 GER_radicalize_rearmament_efforts: "Radicalize Rearmament Efforts"
 GER_radicalize_rearmament_efforts_desc: "If Germany is to survive, it must rearm fast, destroying everything standing in it's way, lest the allied powers destroy us first."
 GER_centralize_the_state: "Centralize the State"
 GER_centralize_the_state_desc: "The German state must be centralized, allowing for the SA to work its magic everywhere."
 GER_a_powerful_state: "A Powerful State"
 GER_a_powerful_state_desc: "All Authority belongs to the state. This must be made clear all throughout the administration. There will be no resistance."
 GER_use_the_communists: "Use the Communists"
 GER_use_the_communists_desc: "The Marxists are similar enough to us that it is expedient to use them to support our empowerment."
 GER_the_national_salvation_law: "The National Security Law"
 GER_the_national_salvation_law_desc: "We shall pass a second enabling act, again promising security and safety for our people, thus securing our new power. For the German Worker."
 GER_maintian_strict_anti_marxism: "Take a Stance on the Communists"
 GER_maintian_strict_anti_marxism_desc: "While we both support the workers, the Marxists are false socialists abandoning nationalism for false delusions of grandeur. Regardless, this contradiction and ideological similarity with grave differences is striking and forces us to make a touch decision on how to deal with them..."
 GER_hail_the_new_fuhrer: "Glory to the New Fuhrer"
 GER_hail_the_new_fuhrer_desc: "We now have a new Fuhrer, let us hail and laud this great man, who will lead the German worker to salvation."
 GER_inspire_fear_of_the_liberals: "Inspire A Fear of Liberalism"
 GER_inspire_fear_of_the_liberals_desc: "It was the socialists and liberals who stabbed us in the back and lost us the great war. Let us have the people fear these degenerates and turn to us instead, instilling a sense that the liberal countries to our west will attack us."
 GER_bring_about_the_second_revolution: "Bring About the Second Revolution"
 GER_bring_about_the_second_revolution_desc: "Both the Nazis and our new National Socialist Revolution have always advocated for a second economic revolution. Let us finally bring this about."
 GER_limited_reconciliation: "Limited Reconciliation"
 GER_limited_reconciliation_desc: "In order to stabilize our party, we must adopt a policy of limited reconciliation towards certain minorities, even if this goes somewhat against our greater ideology."
 GER_consolidate_socialist_reforms: "Consolidate State Feudalist Reforms"
 GER_consolidate_socialist_reforms_desc: "Our state feudalist reforms have had great success. Let us consolidate them and stabilize the nation."
 GER_crush_bourgeoise_captialism: "Crush Bourgeoise Capitalism"
 GER_crush_bourgeoise_captialism_desc: "We will destroy the bourgeoise institutions and vanquish capitalism in Germany, bringing all together for the common man. The folk must act in unity as one man to achieve a true volksgemeinschaft, as such, while private ownership is not a problem, it must be brought into the correct weighting and subordinated to the popular will."
 GER_a_true_volksgemeinschaft: "A True Volksgemeinschaft"
 GER_a_true_volksgemeinschaft_desc: "The country has been united above all class lines into one unified followship, the Volksgemeinschaft. Let us celebrate this."
 GER_declare_the_council_republic: "Declare the Council Republic"
 GER_declare_the_council_republic_desc: "It is time to declare the council republic, taking full control of what is the workers'."
 GER_collapse_our_institutions: "Collapse Our Institutions"
 GER_collapse_our_institutions_desc: "Now that we have worked our way into government, we shall collapse our state and destroy it's bourgeoise institutions."
 GER_split_faith_from_the_party: "Split Faith From the Party"
 GER_split_faith_from_the_party_desc: "A Christian in the party will always have split loyalties. Thus we must make them decide which they prefer."
 GER_watch_the_churches: "Watch the Churches"
 GER_watch_the_churches_desc: "The Stasi will watch over the churches in the nation and subvert the distributors of this opium."
 GER_demand_state_approval_for_clergy: "Demand State Approval for Clergy"
 GER_demand_state_approval_for_clergy_desc: "By demanding state approval for clergy and sermons, we will bring the church in our grip, slowly suffocating it."
 GER_ensure_the_gradual_withering_away_of_religion: "Ensure the Withering Away of Religion"
 GER_ensure_the_gradual_withering_away_of_religion_desc: "Through our actions, we have done critical damage to this opium. It is but a matter of time for it to fall."
 GER_towards_state_atheism: "Adopt State Atheism"
 GER_towards_state_atheism_desc: "Simple Secularism is insufficient, rather the people must be freed from the deadly opium that is religion."
 GER_the_will_of_the_people_unopposed: "The Will of the People Unopposed"
 GER_the_will_of_the_people_unopposed_desc: "We stand for the will of the people and must not be opposed. We will fight for this no matter the cost!"
 GER_towards_a_party_state: "Towards a Party State"
 GER_towards_a_party_state_desc: "Germany must be formed into a party state, guiding the people to true freedom and liberty."
 GER_form_the_sed: "Form the SED"
 GER_form_the_sed_desc: "The SED will be made up of members of the two socialist minded parties, the SPD and the KPD."
 GER_ban_the_reactionaries: "Ban the Reactionaries"
 GER_ban_the_reactionaries_desc: "The Reactionaries are greatly destabilizing our nation. They will be banned and vanquished, allowing for us to rule without issue."
 GER_introduce_the_jugendweihe: "Introduce the Jugendweihe"
 GER_introduce_the_jugendweihe_desc: "The Jugendweihe has long since been a key practice in the nation. Let us introduce it as a state institution to replace confirmation and weaken the grip of the church on the people."
 GER_german_entry_into_the_comintern: "Secure Entry into the Comintern"
 GER_german_entry_into_the_comintern_desc: "As the Soviets are our greatest ally, we should join them. This alliance must be secured quickly!"
 GER_peace_in_the_east: "Peace in the East"
 GER_peace_in_the_east_desc: "With peace secured in the east, the western menace can be dealt with much more efficiently, let us focus on bearing down on the French."
 GER_the_state_safe_from_without: "The State Safe From Without"
 GER_the_state_safe_from_without_desc: "It is clear that the state must be protected mostly from outside threats, let us proactively deal with these."
 GER_the_state_safe_from_within: "Ensuring the State's Safety"
 GER_the_state_safe_from_within_desc: "Our Own People still conspire against us. We must act fast and decisively to prevent their efforts, however as high as their efforts are, the same applies to foreign nations. We must choose what to focus on!"
 GER_undermine_international_fascism: "Undermine International Fascism"
 GER_undermine_international_fascism_desc: "Fascism must be dealt with in all of our enemies. Let us prepare to undermine their states to cull it."
 GER_deal_with_the_conciliators: "Deal with the Conciliators"
 GER_deal_with_the_conciliators_desc: "The Conciliators and their bourgeoisie tendencies have always been a thorn in our side. These must be dealt with at once."
 GER_fight_fascism_in_all_its_forms: "Fight Fascism in All It's Forms"
 GER_fight_fascism_in_all_its_forms_desc: "Fascism must be dealt with regardless of it's type. Both the SPD and the NRAF and all in between must be cleansed of it's influence."
 GER_espouse_unity_with_the_spd: "Espouse Unity with the SPD"
 GER_espouse_unity_with_the_spd_desc: "Unity with the SPD is the key to keeping the fascists at bay, while this may force certain compromises, it is necessary nonetheless."
 GER_unite_against_the_reactionaries: "Unite Against the Reactionaries"
 GER_unite_against_the_reactionaries_desc: "All of us must stand against the reactionaries, destroying them as we turn towards the greater good."
 GER_revolution_in_german_culture: "Revolution in German Culture"
 GER_revolution_in_german_culture_desc: "German Culture must lead the revolution into this new age. We must fight for this and bring the world into a better state."
 GER_radicalize_the_workers: "Radicalize the Workers"
 GER_radicalize_the_workers_desc: "In order to fully take over the state, we must radicalize the workers, destroying the old institutions in the process."
 GER_undermine_german_democracy: "Undermine German Democracy"
 GER_undermine_german_democracy_desc: "German Democracy has failed us once already. Let us vanquish it before it does so again."
 GER_open_the_definition_of_marriage: "Open the Definition of Marriage"
 GER_open_the_definition_of_marriage_desc: "Marriage has long been locked to the idea of a man and a woman, yet it is clear that this must not necessarily be the case. Let us rectify this and open it for all couples."
 GER_reapproachment_with_moscow: "Rekindle Relations with Moscow"
 GER_reapproachment_with_moscow_desc: "Moscow, the home of the revolution has always been one of our greatest allies, let us reach out to them and secure friendship."
 GER_expand_recruitment: "Expand Recruitment"
 GER_expand_recruitment_desc: "It is key that we have as many operatives as possible, to ensure that our regime is safe no matter what happens."
 GER_form_the_stasi_new: "Form the Stasi"
 GER_form_the_stasi_new_desc: "To secure the revolution, we need an organization to keep the state safe, let us achieve this by forming the Stasi"
 GER_legalize_the_kjvd: "Legalize the KJVD"
 GER_legalize_the_kjvd_desc: "The Communist Youth Organization of Germany must be made legal again, allowing for us to leverage it under our party's plans."
 GER_mandatory_membership: "Mandatory Membership"
 GER_mandatory_membership_desc: "Membership in the KJVD is not up to debate, every German who loves his fatherland must join it."
 GER_industrial_collectivization: "Industrial Collectivization"
 GER_industrial_collectivization_desc: "The bourgeoisie must be dealt with and their industries used for the greater good. The way to bring this about is to collectivize their goods."
 GER_rehabilitate_the_red_tsar: "A Second Red Tsar"
 GER_rehabilitate_the_red_tsar_desc: "The SPD was greatly shaped by Otto Braun, the socalled red Tsar, let us find a new man to take up this job in Prussia and fully secure it."
 GER_redistribute_wealth: "Redistribute Wealth"
 GER_redistribute_wealth_desc: "For the justice of our country, we must share our wealth and if one does not share, one should be made to share."
 GER_work_towards_a_demilitarized_europe: "Demilitarize Europe"
 GER_work_towards_a_demilitarized_europe_desc: "If Europe is to be safe, not only we should be demilitarized, but the rest of Europe as well."
 GER_towards_mierendorffs_vision: "Towards Mierendorff's Vision"
 GER_towards_mierendorffs_vision_desc: "Mierendorff has long had a great vision of a democratic socialist future for Germany, let us bring this about and secure prosperity for our workers."
 GER_strengthen_the_spd_beurocracy: "Strengthen the SPD Establishment"
 GER_strengthen_the_spd_beurocracy_desc: "The SPD establishment has led the nation well under Wels and Braun. Let us work with this ideology to let the nation truly flourish."
 GER_reform_the_institutions: "Reform the Institutions"
 GER_reform_the_institutions_desc: "It is clear as day that german institutions need reform. The SPD will bring this about and restore normalcy."
 GER_unite_the_party: "Unite the Party"
 GER_unite_the_party_desc: "As fractured as the SPD is, we must work to unite it and consolidate it, bringing about peace and prosperity."
 GER_reach_out_to_the_remaining_parliamentarians: "Seize Control of Parliament"
 GER_reach_out_to_the_remaining_parliamentarians_desc: "To greatly increase its prowess, the SPD will enlist the support of likeminded parliamentarians, securing additional seats in the Reichstag."
 GER_cater_to_the_masses: "Cater to the Masses"
 GER_cater_to_the_masses_desc: "With the Left Wing victory in the SPD, we will use this chance to bring the masses on board, strengthening our power in the party."
 GER_build_a_mass_movement: "Build a Mass Movement"
 GER_build_a_mass_movement_desc: "We will turn the SPD into a mass movement, making it into a juggernaught of power that none can contest."
 GER_no_compromise_on_socialist_ideals: "No Compromise on Socialist Ideals"
 GER_no_compromise_on_socialist_ideals_desc: "Socialist Ideals are key in securing the SPD, we will make sure to spread these along with our democracy."
 GER_spd_in_coalition: "SPD in Coalition"
 GER_spd_in_coalition_desc: "The Traditionally largest party in the Weimar and Kaiser eras has returned, once again gaining a grip in the government."
 GER_enforce_a_secularized_curriculum: "Enforce a Secularized Curriculum"
 GER_enforce_a_secularized_curriculum_desc: "For the Sciences to thrive, we must enforce a secular Curriculum, ensuring the success of our academies."
 GER_embrace_secularism: "Embrace Secularism"
 GER_embrace_secularism_desc: "Secularism is the way forward for our nation, we must drop this backward notion of religion and seek the sciences."
 GER_guarantee_religious_freedom: "Guarantee Religious Freedom"
 GER_guarantee_religious_freedom_desc: "Religious Freedoms are key for our nation's stability. While this may entrench certain incorrect notions, this will greatly help stabilize our state."
 GER_choose_an_heir_for_wels: "Choose an Heir for Wels"
 GER_choose_an_heir_for_wels_desc: "Wels is growing old and sick and will soon no longer be fit to rule. Let us choose a man to replace him."
 GER_claim_leadership_of_german_nationalism: "Claim Leadership of German Nationalism"
 GER_claim_leadership_of_german_nationalism_desc: "In the Last Years, the SPD has proven itself to be the only rightful leaders of German nationalism, fighting the Nazis and the enemies of the state successfully."
 GER_peace_with_our_new_identity: "Peace With Our New Identity"
 GER_peace_with_our_new_identity_desc: "The cultural shift in Germany has brought us a new face and a new identity to have peace with."
 GER_strengthen_german_patriotism: "Launch a Culture Strengthening Campaign"
 GER_strengthen_german_patriotism_desc: "German Patriotism is a key part of the nation's identity, we must use this to our advantage and coopt it."
 GER_encourage_european_unity: "Encourage European Unity"
 GER_encourage_european_unity_desc: "European unity is where the future lies. We must help convince the people of this."
 GER_purge_the_military_of_reactionaries: "Purge the Military of Reactionaries"
 GER_purge_the_military_of_reactionaries_desc: "The Military is to be purged of reactionaries, freeing it from those opposing the state and rule of law."
 GER_revive_the_attitude_of_1914: "Revive the Attitude of 1914"
 GER_revive_the_attitude_of_1914_desc: "In 1914 all of Germany stood together as one. This great legacy will be revived and Germany will stand at one in this current struggle."
 GER_legitimize_the_left: "Legitimize the Left"
 GER_legitimize_the_left_desc: "The Left has long since been a defining part of politics, showing the worker what he needs, let us legitimize it, bringing peace and prosperity."
 GER_campaign_as_a_popular_front: "Campaign as a Popular Front"
 GER_campaign_as_a_popular_front_desc: "It is key to campaign as a popular front, allying the communists and working with them to bring about good politics."
 GER_unite_against_fascism: "Unite Against Fascism"
 GER_unite_against_fascism_desc: "Fascism is a great threat to us all and must be defanged, let us bring this about in Germany."
 GER_democratize_the_civil_service: "Democratize the Civil Service"
 GER_democratize_the_civil_serivce_desc: "With the Civil Service Resisting our Government, we must democratacize it, bringing about a new era of stability."
 GER_legalize_the_remaining_communist_parties: "Legalize the Remaining Communist Parties"
 GER_legalize_the_remaining_communist_parties_desc: "The Communists have been unrighteously banned and brutalized. This shall be ended."
 GER_end_conscription: "End Conscription"
 GER_end_conscription_desc: "Conscription fills the army with unwilling men, unfit for service. Let us rectify this and ensure a willing corps."
 GER_divert_military_funding: "Divert Military Funds"
 GER_divert_military_funding_desc: "We shall divert funds away from the military, securing our economy for the people and using it for much nobler purposes."
 GER_work_towards_national_demilitarization: "Work Towards National Demilitarization"
 GER_work_towards_national_demilitarization_desc: "If peace is to be achieved, the nation must demilitarize, securing prosperity for all."
 GER_rebuild_the_prussian_bastion: "Rebuild the Prussian Bastion"
 GER_rebuild_the_prussian_bastion_desc: "Prussia was once the bastion of democracy in Germany. For our stability it is imperative to restore this."
 GER_build_the_rur_dam_2: "Build the Ruhr Dam"
 GER_build_the_rur_dam_2_desc: "Constructing the Ruhr Dam is more than simply a feat of engineering - it's an investment for the future. The dam would not only bolster the economic development in the region, it would also help fuel our industrial efforts and production output."
 GER_a_planned_economy: "Organize a Planned Economy"
 GER_a_planned_economy_desc: "Germany needs the stability and peace of a planned economy to thrive. Let us bring this about."
 GER_finalize_economic_planning: "Finalize Economic Planning"
 GER_finalize_economic_planning_desc: "Economic planning must be finalized, with detailed operations prepared and implemented, to ensure the people can thrive."
 GER_set_prices_in_stone: "Set Prices in Stone"
 GER_set_prices_in_stone_desc: "The time has come to ensure fixed prices for German goods, ensuring stability and prosperity for all of our workers."
 GER_state_run_unions: "State Run Unions"
 GER_state_run_unions_desc: "In order to combine the interests of the labor and the state, we must organize state run unions that help the worker and support our rule."
 GER_enforce_the_right_to_work: "Enforce the Right to Work"
 GER_enforce_the_right_to_work_desc: "The right to work is a key right among them all. We will achieve it by giving everyone who desires so a guaranteed job from the state."
 GER_socialism_with_german_characteristics: "Socialism with German Characteristics"
 GER_socialism_with_german_characteristics_desc: "We have done it! Socialism has been brought about in Germany and it will lead us into a glorious new era."
 GER_towards_a_workers_democracy: "Towards a Worker's State"
 GER_towards_a_workers_democracy_desc: "The workers are the key to the German state, and thus we must support them. Socialist economic policy is the key to economic success!"
 GER_utilize_pro_democratic_propaganda: "Utilize Pro Democratic Propaganda"
 GER_utilize_pro_democratic_propaganda_desc: "If Democracy is to succeed in Germany, we need to bring the people on board, thus we will work the Zentrum and LVP to bring this about."
 GER_land_reform: "A Proper Land Reform"
 GER_land_reform_desc: "Germany must go through a proper land reform to ensure equity for all and justice for the German worker."
 GER_support_the_workers: "Reform for the Workers"
 GER_support_the_workers_desc: "Reform must be for those who bring it forward and lead the country, the workers."
 GER_raise_the_minimum_wage: "Raise the Minimum Wage"
 GER_raise_the_minimum_wage_desc: "The minimum wage is key to supporting the workers, letting them earn money for what they work."
 GER_public_works: "Public Works"
 GER_public_works_desc: "Public works will help us to bring prosperity to Germany, giving workers work to do and roads to operate on."
 GER_fight_employment_discrimination: "Fight Employment Discrimination"
 GER_fight_employment_discrimination_desc: "Employment Discrimination is making our workforce inefficient. We must destroy this."
 GER_support_the_families: "Reform through the Families"
 GER_support_the_families_desc: "Reform must be brought into Germany by strengthening the families and working with them, using their virtue to bring us up."
 GER_preferred_hiring_for_fathers: "Preferred Hiring for Fathers"
 GER_preferred_hiring_for_fathers_desc: "We will make companies be pressured to hire fathers over others, as they need the jobs more than single men and are more likely to try harder and be more productive to feed their family."
 GER_strengthen_the_bedrock_of_the_family: "Strengthen the Familial Bedrock"
 GER_strengthen_the_bedrock_of_the_family_desc: "The Family is the Bedrock of Germany and will be what makes Germany great."
 GER_build_defense_industry_r56: "Build a Defense Industry"
 GER_build_defense_industry_r56_desc: "Having finally been able to stabilize, and even strengthen our economy many folds, we can now turn our attention to securing the sovereignty of our nation and building a proper defense industry, safeguarding the German people’s industriousness and drive for progress and excellence."
 GER_war_production_r56: "War Production"
 GER_war_production_r56_desc: "War has engulfed us once again, but we will not buckle and we will not fall! We will mobilize our industrial might and outproduce any foe unwise enough to think they can crush the German people’s unbending will!"
 GER_strengthen_the_unions: "Strengthen the Unions"
 GER_strengthen_the_unions_desc: "The Unions are the Backbone of the Economy, we will strengthen them and help them support the workers."
 GER_unemployment_ensurance: "Unemployment Insurance"
 GER_unemployment_ensurance_desc: "Insurance will save the German workers, allowing them to focus on work while feeling safe."
 GER_become_the_model_social_market_economy: "Become the Model Social Market Economy"
 GER_become_the_model_social_market_economy_desc: "We are the model social market economy of Europe. We will bring prosperity to Europe and free our workers."
 GER_enact_drastic_tax_cuts: "Enact Drastic Tax Cuts"
 GER_enact_drastic_tax_cuts_desc: "To kickstart economic growth, tax cuts are imperative, as they will lead to the long term thriving of the German economy and the survival of the nation state."
 GER_limited_social_reform: "Limited Social Reform"
 GER_limited_social_reform_desc: "Limited Social Reform is necessary for a robust economy, that has the people on our side, let us achieve this goal."
 GER_support_the_industries: "Reform Via the Industries"
 GER_support_the_industries_desc: "Reform in Germany must come from the industries to be sustainable, making them strong as well as our people."
 GER_marriage_loans: "Marriage Loans"
 GER_marriage_loans_desc: "Marriage loans will greatly assist people in their work in providing for their families and ensuring stability on the work market."
 GER_liberalize_the_economy: "Liberalize the Economy"
 GER_liberalize_the_economy_desc: "In liberalism lies the future of Germany, we must bring our economy to this new and glorious standard!"
 GER_move_towards_full_deregulation: "Slash Economic Regulations"
 GER_move_towards_full_deregulation_desc: "Full economic deregulation must be secured, bringing about a more free, more robust and more sustainable economy."
 GER_maintain_state_influence_on_the_economy: "Retain State Influence in the Economy"
 GER_maintain_state_influence_on_the_economy_desc: "The State must retain a portion of it's influence in the economy, ensuring that the country is ready for a last ditch war and to defend itself."
 GER_subsidize_key_industries: "Subsidize Key Industries"
 GER_subsidize_key_industries_desc: "The State must ensure the integrity of its key industries, keeping them safe to save Germany."
 GER_provide_funds_for_entrepreneurs: "Provide Funds for Entrepreneurs"
 GER_provide_funds_for_entrepreneurs_desc: "It is the government's job to provide funds for new businesses, helping them flourish for the common good."
 GER_an_economy_without_a_state: "An Economy Without a State"
 GER_an_economy_without_a_state_desc: "Germany has transformed into an economy without a state, securing prosperity and riches for all."
 GER_achieve_secure_long_term_economic_growth: "Achieve Long Term Economic Growth"
 GER_achieve_secure_long_term_economic_growth_desc: "We must secure long term economic growth, bringing peace and wealth for generations to come, longer than just the golden twenties."
 GER_state_economy_simbiosis: "Foster a State Economy Symbiosis"
 GER_state_economy_simbiosis_desc: "We must foster a sense that the state and the economy work together, bringing about shared goals."
 GER_help_the_worker_through_his_company: "Help the Worker Through His Company"
 GER_help_the_worker_through_his_company_desc: "The Worker is best helped through his company, with it providing him with all he needs to live a long and peaceful life."
 GER_dstp_in_coalition: "LVP in Coalition"
 GER_dstp_in_coalition_desc: "The LVP and it's liberal policy have reached the hearts and minds of the germans, let us hope they do well in government."
 GER_focus_on_political_education: "Focus on Political Education"
 GER_focus_on_political_education_desc: "It is imperative that the people have a political education, learning from the rights and wrongs of those before us."
 GER_a_new_national_anthem: "A New National Anthem"
 GER_a_new_national_anthem_desc: "All our old national anthems did not display the true German spirit, instead we must find a less aggressive more peaceful song to commemorate our spirit."
 GER_reach_out_to_the_middle_class: "Reach Out to the Middle Class"
 GER_reach_out_to_the_middle_class_desc: "The LVP must reach out to the middle class, securing their support "
 GER_a_juggernaught_back_from_the_grave: "A Juggernaut Back from the Grave"
 GER_a_juggernaught_back_from_the_grave_desc: "Liberalism has come back from the grave and become the ideology of the new key party in Germany! Let us celebrate this!"
 GER_utilize_the_zentrum_freeze: "Utilize the Zentrum Inaction"
 GER_utilize_the_zentrum_freeze_desc: "While it is clear that the CVU is collapsing, the Zentrum has yet to take action about it, let us make use of this and take over as much of the party apparatus as we can."
 GER_knock_stegerwald_down_a_peg: "Knock Stegerwald down a Peg"
 GER_knock_stegerwald_down_a_peg_desc: "As he collapses the CVU, Hugenberg will destroy the Zentrum, securing more power after the collapse and destroying Stegerwalds position as leader."
 GER_zentrum_in_coalition: "Zentrum in Coalition"
 GER_zentrum_in_coalition_desc: "The Zentrum has done greatly in the elections, securing a seat in the new government and winning a great victory for the party."
 GER_the_party_under_stegerwald: "The Party under Stegerwald"
 GER_the_party_under_stegerwald_desc: "Stegerwald has secured power over the Zentrum for his conservative clique. Let us hope he leads it into a bright future."
 GER_wirths_new_zentrum: "Wirths New Zentrum"
 GER_wirths_new_zentrum_desc: "Wirth is making the Zentrum into a true party for the good of the people. His cold, analytical approach and concern for the workers will save the German Zentrum."
 GER_apply_the_reichskonkordat_to_the_republic: "End the Reichskonkordat Debate"
 GER_apply_the_reichskonkordat_to_the_republic_desc: "With the Nazis fallen from grace, the Reichskonkordat is lingering in the air, neither reaffirmed or repealed, we must decide its fate and make use of it, either in its disappearance or it's reinvigoration."
 GER_repeal_the_reichskonkordat: "Repeal the Reichskonkordat"
 GER_repeal_the_reichskonkordat_desc: "The Pope will be informed and we shall have him repeal the reichskonkordat, allowing for further politicization of the catholic church and bishops in political positions"
 GER_foster_christian_democracy: "Foster Christian Democracy"
 GER_foster_christian_democracy_desc: "It is necessary to foster Christian democracy in Germany, to secure that the faith and democracy are both held up high."
 GER_a_new_age_of_peace: "A New Age of Peace"
 GER_a_new_age_of_peace_desc: "It is time for a new era of peace for Germany, under democracy, bringing the country into stability."
 GER_combat_the_reactionary: "Combat the Reactionary"
 GER_combat_the_reactionary_desc: "We must combat the reactionaries of the DNVP and the NRAF, preventing them from usurping democracy."
 GER_work_towards_fiscal_stability: "Work Towards Fiscal Stability"
 GER_work_towards_fiscal_stability_desc: "Germany must work towards fiscal stability, bringing the economy into a great new era."
 GER_consultations_with_the_experts: "Consultations with the Experts"
 GER_consultations_with_the_experts_desc: "The Government should consult with the experts, helping us to modernize the nation and bring it into a new era."
 GER_the_socialist_traitor: "Pro-Socialist Betrayal"
 GER_the_socialist_traitor_desc: "Wirth has always been an SPD sympathizer, now he has betrayed the Zentrum for them."
 GER_improve_railway_economics: "Improve Railway Economics"
 GER_improve_railway_economics_desc: "We shall use the economic ties Wirth has to the railway industry. Let us make use of this to modernize that as well."
 GER_technocracy_with_strong_limits: "Technocracy with Strong Limits"
 GER_technocracy_with_strong_limits_desc: "Germany needs technocracy, though with strong limits, to ensure the flourishing of democracy and the economy in Germany."
 GER_politicize_the_trade_unions: "Activate the Catholic Trade Unions"
 GER_politicize_the_trade_unions_desc: "Stegerwald's Catholic Trade Unions will be made use of and politicized, pushing their influence over all the other trade unions."
 GER_bring_about_a_new_social_order: "Bring About a New Social Order"
 GER_bring_about_a_new_social_order_desc: "A new catholic social order will be established in Germany, bringing cohesion to the people, state, and economy."
 GER_intertwine_the_state_and_the_church: "Intertwine the State and Church"
 GER_intertwine_the_state_and_the_church_desc: "We will intertwine the apparatus of the State with the one of the Church. This will consolidate our power in both, using loyalists in two roles at once."
 GER_help_the_church_permeate_everyday_german_life: "Help the Church Permeate Everyday Life"
 GER_help_the_church_permeate_everyday_german_life_desc: "It is the Church's Role to permeate everyday life in Germany, ensuring that the German People be a God fearing people."
 GER_corporatism_with_catholic_characteristics: "Corporatism with Catholic Characteristics"
 GER_corporatism_with_catholic_characteristics_desc: "We must bring Corporatism with Catholic Characteristics to Germany, outdoing the changes the SPD wants to do with better ones from our own side."
 GER_the_end_of_class_warfare: "End Class Warfare"
 GER_the_end_of_class_warfare_desc: "It is time for class warfare to end in Germany, with the Church and State mediating the struggles of the people."
 GER_organize_german_labor: "Organize German Labor"
 GER_organize_german_labor_desc: "Labor in Germany must be organized along state lines to go against the notion that the State and Labor are at odds, instead Stegerwalds Connections will bring about an era of peace between the two."
 GER_restore_the_state_churches: "Restore the State Churches"
 GER_restore_the_state_churches_desc: "The State Churches, both Catholic and Protestant, will be restored, bringing Germany back to its former Christian faith and glory."
 GER_repeal_the_137th_article: "Repeal the 137th Article"
 GER_repeal_the_137th_article_desc: "The 137th article of the Weimar Constitution officially stated that there is to be no state church, we will repeal this and work towards its full reversal."
 GER_undo_the_secularization_of_germany: "Undo the Secularization"
 GER_undo_the_secularization_of_germany_desc: "It is imperative for secularism in Germany to be dealt with. The People must be brought back to righteousness, to God!"
 GER_dvu_in_coalition: "[GER_cvu_scripted_name_colorless] in Coalition"
 GER_dvu_in_coalition_desc: "The [GER_cvu_scripted_name_colorless] has successfully made great gains in the elections, winning large seats in parliament and even a seat in government."
 GER_the_democratic_hegemon_of_germany: "The Christian Hegemon"
 GER_the_democratic_hegemon_of_germany_desc: "The [GER_cvu_scripted_name_colorless] has become the hegemon of Christianity in Germany, leading it into a bright new future. We shall now form it into a new party, fighting for German democracy and liberalism."
 GER_the_fullness_of_german_conservatism: "The Fullness of German Conservatism"
 GER_the_fullness_of_german_conservatism_desc: "We are the true heirs of the FKP, the true German conservatives, going to the point the Goerdeler is nothing less than a new Bismarck, leading Germany into a new age of unity and stability."
 GER_fight_for_dvu_stability: "Fight for [GER_cvu_scripted_name_colorless] Stability"
 GER_fight_for_dvu_stability_desc: "The [GER_cvu_scripted_name_colorless] is inherently quite unstable, and if it is to survive, we must fight for it and ensure that it will not collapse, let us enact such measures right away!"
 GER_the_union_forevermore: "The Union Forevermore"
 GER_the_union_forevermore_desc: "The [GER_cvu_scripted_name_colorless] will remain as it is, the embodiment of cooperation and the union of two different but equal parties."
 GER_the_legacy_of_the_sozialistengesetze: "Reinstate the Sozialistengesetze"
 GER_the_legacy_of_the_sozialistengesetze_desc: "Bismarck once did great actions against the SPD and we hope that should we follow his procedure that we will be met with great successes."
 GER_end_the_party_rift: "End the Party Rift"
 GER_end_the_party_rift_desc: "The Rift in the [GER_cvu_scripted_name_colorless] can finally be solved, allowing us to finally become one in name and being."
 GER_foster_german_democracy: "Consolidate Christianity in Germany"
 GER_foster_german_democracy_desc: "With the turn of the DCP, we should work to foster Christianity in our nation, ushering in a new era for our people."
 GER_expand_pro_state_propaganda: "Expand Pro-State Propaganda"
 GER_expand_pro_state_propaganda_desc: "It is necessary to expand pro state propaganda to strengthen our regime and ensure that we will rule Germany for the foreseeable future."
 GER_towards_liberalism: "Towards Liberalism"
 GER_towards_liberalism_desc: "Liberalism is the future of Germany and will bring back a return of the Glory of the Stresemann Times."
 GER_the_party_of_the_middle_class: "Work with the Middle Class"
 GER_the_party_of_the_middle_class_desc: "The DVP must also fully take up it's role as a middle class party, bringing them the wealth they deserve."
 GER_strenghten_the_new_republic: "Strengthen the New Republic"
 GER_strenghten_the_new_republic_desc: "As a Party in our new Republic, it is our duty to strengthen it, securing democracy for our sons and daughters."
 GER_the_greatest_of_all_republicans: "The Greatest of All Republicans"
 GER_the_greatest_of_all_republicans_desc: "Dingeldey has become the epitome of a democratic politician in Germany, he will lead the nation into a bright future and help us deal with all antidemocratic forces from within and without."
 GER_accept_collective_bargaining: "Accept Collective Bargaining"
 GER_accept_collective_bargaining_desc: "While Collective Bargaining goes against some of our supporters, it is inevitable and it is better to work with these people than to fight them unnecessarily"
 GER_a_new_social_compromise: "Bring About a New Social Compromise"
 GER_a_new_social_compromise_desc: "With us having made steps towards the workers, we can come to a new social compromise securing friendship with the workers over shared goals"
 GER_end_interanal_factionalism: "End internal Factionalism"
 GER_end_interanal_factionalism_desc: "It is time to end the internal factionalism of the DVP and break the notion that there are two wings fighting each other."
 GER_legacy_of_stinn: "Revive Stinn's Legacy"
 GER_legacy_of_stinn_desc: "Stinn has done much for the party back then and we shall in his name gain finances and support from the industries."
 GER_legacy_of_stresemann: "Reinvigorate Stresemann's Legacy"
 GER_legacy_of_stresemann_desc: "Stresemann is the key defining figure of the party, let us look to him for a great example in rulership."
 GER_the_proud_leaders_of_german_monarchism: "The Proud Leaders of Monarchism"
 GER_the_proud_leaders_of_german_monarchism_desc: "We have truly become the leaders of monarchism in Germany and will begin to campaign on that, centralizing this movement."
 GER_the_kaisers_endorsement_focus: "Secure the Kaiser's Endorsement"
 GER_the_kaisers_endorsement_focus_desc: "With us being the leader of his movement, we will bring the Kaiser to endorse us, fully consolidating our position in Germany."
 GER_maintain_the_conservative_course: "Maintain the Conservative Course"
 GER_maintain_the_conservative_course_desc: "The DVP must hold fast to conservatism, taking the place it should have had in Weimar, standing in for the true patriots of Germany!"
 GER_consolidate_elite_support: "Consolidate Elite Support"
 GER_consolidate_elite_support_desc: "The DVP has always been a Party of the Elites, if we are to prosper, we must once again use this support and their finances to win future elections."
 GER_the_new_german_establishment: "The New German Establishment"
 GER_the_new_german_establishment_desc: "We have finally become the new German establishment, as the greatest of all parties. We will rule through the foreseeable future."
 GER_a_respectable_germany: "A Respectable Germany"
 GER_a_respectable_germany_desc: "Germany under the DVP has truly become respectable, the sweet spot between authoritarianism and democracy, greater than all others!"
 GER_fight_trade_unions: "The Fate of the Trade Unions"
 GER_fight_trade_unions_desc: "If the economy is to prosper, we must choose a fate for the trade unions, either by working with them and securing the middle class or by fighting them and ensuring economic prosperity. Either way, this decision must be made."
 GER_a_second_restoration: "A Second Restoration"
 GER_a_second_restoration_desc: "The Kaiser will be brought back to full power. Thus we will ensure full parliamentary support for this and do what is right for the Nation!"
 GER_a_ban_for_the_spd: "End Socialist Subversion"
 GER_a_ban_for_the_spd_desc: "The SPD is no better than the communists and is simply a front for them. Therefore we shall ban and destroy them for the sake of Germany."
 GER_a_ban_for_the_kpd: "Anhilate the Communist Degeneracy"
 GER_a_coup_in_all_but_name: "A Coup in All but Name"
 GER_a_coup_in_all_but_name_desc: "The German Empire must be restored and with or without the consent of parliament. Let us act fast and do this now!"
 GER_readdress_the_kaiserfrage: "Readdress the Kaiserfrage"
 GER_readdress_the_kaiserfrage_desc: "While the first time around, the Parliament decided against the Kaiserreich, we must undo this, passing a new vote to restore the Kaiserreich!"
 GER_expand_the_kaisers_duties: "Expand the Kaiser's Duties"
 GER_expand_the_kaisers_duties_desc: "The Kaiser is the Bedrock of the new Germany. His duties and influence shall be increased to the point that he will embody all Germans."
 GER_expand_the_kaisers_duties_fake: "Expand the Kaiser's Duties"
 GER_expand_the_kaisers_duties_fake_desc: "The Kaiser is the Bedrock of the new Germany. His duties and influence shall be increased to the point that he will embody all Germans."
 GER_the_fight_against_german_antisemitism: "Destroy the Remnants of Nazi Ideology"
 GER_the_fight_against_german_antisemitism_desc: "It is time for Germany to make good on it's wrongs under the Nazis. Thus it is imperative to crack down on antisemitism in the Nation."
 GER_bring_back_einstein: "Bring back Exiled Scientists"
 GER_bring_back_einstein_desc: "The Jewish-German scientists always saw themselves as Germans above all. We will bring these loyal patriots back and ask for their forgiveness and service."
 GER_a_new_era_of_german_science: "Usher in a New Era of Science"
 GER_a_new_era_of_german_science_desc: "Germany has come into a new era of Science, bringing a great new future for the state and overcoming of it's past opposition with the Jewish scientists."
 GER_national_economic_coordination: "Ensure National Economic Coordination"
 GER_national_economic_coordination_desc: "We will mix aspects of a liberal economy with state cooperation, neither strongarming nor letting the excesses of capitalism grow into infighting."
 GER_an_era_of_german_wealth: "Foster an Era of Wealth"
 GER_an_era_of_german_wealth_desc: "Through Goerdeler's Reforms, Germany has entered a new era of wealth and power, unprecedented by the Kaiserreich of old or the Weimar Republic"
 GER_goerdelers_new_party: "Goerdeler's New Party"
 GER_goerdelers_new_party_desc: "Goeredeler has done it! The Party has been saved from radicalism and has by now truly transformed into an entirely different party, much more stable and less radical. The Bedrock of German Democracy."
 GER_sensible_fiscal_policy: "Restore Sensible Fiscal Policy"
 GER_sensible_fiscal_policy_desc: "We must give Germany a sensible fiscal policy, bringing about a form of conservative liberalism and making Germany truly Prosper."
 GER_alliance_with_the_junkers: "Build an Alliance with the Junkers"
 GER_alliance_with_the_junkers_desc: "It is the Junkers who have been our greatest supporters, therefore we will begin to support them with our politics."
 GER_restore_the_old_estates: "Restore the Old Junker Estates"
 GER_restore_the_old_estates_desc: "The Junker Estates of old shall be restored, bringing about a return to normalcy in Germany."
 GER_germany_glorious_as_it_once_was: "Germany, Glorious as it Once Was"
 GER_germany_glorious_as_it_once_was_desc: "With our Reforms complete, Germany has returned to normalcy and is now finally as glorious as it once was under the Kaiser!"
 GER_a_time_for_protectionism: "Enact Protectionist Policies"
 GER_a_time_for_protectionism_desc: "It is time for Protectionism in Germany, securing the interests of our farmers over those of the foreigners."
 GER_the_spirit_of_blut_and_boden: "Espouse Blood and Soil Ideology"
 GER_the_spirit_of_blut_and_boden_desc: "We must ensure that German Blood and Soil come first above those of the degenerate foreigners, bringing a sense of national pride to ensure our final victory! This will allow our people to buy things made by German blood and grown on German soil."
 GER_dnvp_in_coalition: "DNVP in Coalition"
 GER_dnvp_in_coalition_desc: "The DNVP has managed to become a part of the current Coalition. Let us help them bring about their plans for Germany's Future."
 GER_hugenburgs_legacy: "Hugenberg's Revival"
 GER_hugenburgs_legacy_desc: "Hugenberg has done the impossible and outmaneuvered Goeredeler, securing his return to DNVP leadership and a new radical direction for the party..."
 GER_proper_agrarian_policy: "Bring About Proper Agrarian Policy"
 GER_proper_agrarian_policy_desc: "Unlike all other German Politicians, Hugenberg knows the farms and what will save them. Thus it is time to bring proper agrarian policy to Germany!"
 GER_engrain_antiurbanism: "Fight the Urban Degeneracy"
 GER_engrain_antiurbanism_desc: "It is in the Countryside where Germany's future lies! The People must understand this and abandon the failed cesspool of the urban metropolis."
 GER_highten_nationalist_rethoric: "Heighten Nationalist Rhetoric"
 GER_highten_nationalist_rethoric_desc: "Germany must be placed above all and the people indoctrinated along these lines! Hail the new Germany!"
 GER_new_progroms: "Radicalize German Nationalism"
 GER_new_progroms_desc: "If Germany is to live long and prosper, the people must be purged from degeneracy! A new wave of pogroms will bring this about, as we radicalize the Germans."
 GER_a_new_republic: "The Republik Restored"
 GER_a_new_republic_desc: "With our power over the Nation restored, we will declare that the old German Republic from the golden 20's is restored!"
 GER_undermine_the_military: "Undermine the Military"
 GER_undermine_the_military_desc: "The Military is a threat to our democracy and we cannot risk a second Kapp Putch and must therefore curtail the military's influence."
 GER_military_depoliticization: "Military Depoliticization"
 GER_military_depoliticization_desc: "Before ending it's domestic influence, we must first officially depoliticize the military and remove Beck's power in the Government."
 GER_ban_internal_operations: "Ban internal Operations"
 GER_ban_internal_operations_desc: "We can now enact the final step of our plan, banning the military from partaking in internal operations, giving this task to the police instead."
 GER_an_eye_to_the_left: "An Eye to the Left"
 GER_an_eye_to_the_left_desc: "It is our first priority to focus on the KPD and their communist militias, wreaking havoc on Germany..."
 GER_destroy_the_antifa: "Destroy the Antifaschistische Aktion"
 GER_destroy_the_antifa_desc: "While they call themselves antifascists, the Antifaschistische Aktion are no more than a front group for the KPD. We must put and end to these radicals."
 GER_reinstate_the_reichtagsbrandverordnung: "Reinstate the Reichtag Fire Decree"
 GER_reinstate_the_reichtagsbrandverordnung_desc: "To fully ban the KPD, we will reinstate the Reichtagsbrandverordnung, banning all forms of communism in Germany."
 GER_wehrhafte_demokratie: "Towards a Militant Democracy"
 GER_wehrhafte_demokratie_desc: "We must build a democracy that is 'wehrhaft' or militant and capable of defending itself from and destroying radicalism."
 GER_an_eye_to_the_right: "An Eye to the Right"
 GER_an_eye_to_the_right_desc: "It is our first priority to focus on the NRAF radicals and Nazis and the violence of the SA, to bring back peace and prosperity in our time."
 GER_fight_the_sa: "Fight the SA"
 GER_fight_the_sa_desc: "The SA must go, and thus we will prepare our army to fight them and destroy them. The Cities will be freed from their oppression!"
 GER_demokratieschutzgesetz: "Pass the Defense of Democracy Act"
 GER_demokratieschutzgesetz_desc: "It is now time to pass the 'Demokratieschutzgesetz' or 'Defense of Democracy Act', securing the banning of the radical right and their destruction."
 GER_unite_with_the_sapd_resistance: "Unite with the SAPD Resistance"
 GER_unite_with_the_sapd_resistance_desc: "The SAPD is not too much different from us and thus we shall work with them to help overthrow the Nazis, Especially as they already have an active resistance network. This will help refacilitate connection between the wings of the SPD."
 GER_nie_wieder_ist_jetzt: "Nie Wieder ist Jetzt!"
 GER_nie_wieder_ist_jetzt_desc: "The people must know that we must always be vigilant, under the motto, 'Never again is now!', to ensure that our democracy is secure and that fascism will not wreak havoc on Germany again!"
 GER_allied_intervention: "Allied Intervention"
 GER_allied_intervention_desc: "The resistance must reach out to the western allies and old democratic and gain their support to use their forces to overthrow the Nazis."
 GER_the_center_reforged: "The Center Reforged"
 GER_the_center_reforged_desc: "The Center of German Politics has been reforged, allowing for us to deal with the Nazis and build a new republic!"
 GER_regroup_spd_exiles: "Regroup SPD Exiles"
 GER_regroup_spd_exiles_desc: "The SPD, once the strongest Party in Germany and one of the longest lasting resisters of the Nazis, will be coopted to join our uprising and get their followers to help overthrow Hitler"
 GER_proper_christian_resistance: "Proper Christian Resistance"
 GER_proper_christian_resistance_desc: "The Zentrum and other protestant groups shall put their support behind Beck and Goerdeler, bringing them back against Hitler!"
 GER_die_letzte_verschwoerung_shortcut: "Politics: Coup Hitler"
 GER_die_letzte_verschwoerung: "The Beck-Goerdeler Conspiracy"
 GER_die_letzte_verschwoerung_desc: "While Hitler seems to have secured absolute power, Beck and Goerdeler have decided that they shall create a conspiracy to overthrow the man and save Germany from his crazy ideology!"
 GER_operation_valkyre: "Operation Valkyrie"
 GER_operation_valkyre_desc: "It is time to strike! We will launch a coup in the west of Germany, securing it for ourselves and ousting the Nazis once and for all."
 GER_secure_freikorps_remnants: "Secure Freikorps Remnants"
 GER_secure_freikorps_remnants_desc: "We will now act to secure the Remnants of the once bold Freikorps to destroy the new form of socialism oppressing us."
 GER_a_deal_with_canaris: "A Deal With Canaris"
 GER_a_deal_with_canaris_desc: "We will negotiate a deal with Wilhelm Canaris, leader of the Abwehr to use his talents to help us oust the Nazis."
 GER_infiltrate_the_reich_itself: "Infiltrate the Reich Itself"
 GER_infiltrate_the_reich_itself_desc: "Canaris now embarks on a great operation to infiltrate and undermine the Nazis using their own state apparatus, giving us the ability to devastate them with smaller forces."
 GER_expand_military_backing: "Expand Military Backing"
 GER_expand_military_backing_desc: "To succeed, the coup must secure backing from the Wehrmacht, this shall be worked on day and night!"
 GER_the_wehrmachts_iron_fist: "Sideline Goerdeler"
 GER_the_wehrmachts_iron_fist_desc: "Beck has decided that cooperation with Goerdeler is no longer the way to go. Only the Wehrmacht can free Germany and it must do exactly that!"
 GER_international_brigades: "International Brigades"
 GER_international_brigades_desc: "The German Revolution Calls out to the world! We desperately cry out and seek for all leftists and republicans to help save us!"
 GER_secure_wilhelms_support: "Secure the Kaiser's Support"
 GER_secure_wilhelms_support_desc: "The Kaiser shall return to Germany at the launching time of operation Valkyrie, bringing vast amounts of legitimacy to the revolution!"
 GER_a_disturbing_deal_sa: "A Disturbing Deal"
 GER_a_disturbing_deal_sa_desc: "After the Night of the Long Knives, large parts of the SA oppose the Hitlerite regime and would gladly ally us, should we give them the ability to keep up their old activities, while this raises some ethical concerns, it would be a boon in the upcoming war..."
 GER_plan_a_soviet_expedition: "Plan a Soviet Expedition"
 GER_plan_a_soviet_expedition_desc: "We will now beg for Moscow to prepare for units for us to be readied to sneak through the Baltics and into Königsberg when the war starts, allowing for us to levy additional forces against the Nazis!"
 GER_comintern_kpd_funding: "Comintern KPD Funding"
 GER_comintern_kpd_funding_desc: "In order to help overthrow the regime, we will reach out to the KPD and use them to get access to Russian funds."
 GER_consolidate_dnvp_dissenters: "Consolidate DNVP Dissenters"
 GER_consolidate_dnvp_dissenters_desc: "The Weimar and Freikorps have strong allies in the Nazi beurocracy with the old DNVP members. Let us get Goerdeler to reach out to them and get them to join our resistance!"
 GER_defeat_without_dishonor: "Defeat without Dishonor"
 GER_defeat_without_dishonor_desc: "There are many defeatist Nazis willing to join us should we promise them amnesty. Let us do this to win this war fast!"
 GER_gather_the_weimar_remnants: "Gather the Weimar Remnants"
 GER_gather_the_weimar_remnants_desc: "We will gather the remnants of the old Weimar Republic, securing support from the few democrats that are left and legitimizing our rule."
 GER_unite_the_right: "Unite the Right"
 GER_unite_the_right_desc: "The Right will be United, with the völkisch catholic alliance. Soon all of Germany will be liberated by us conservatives!"
 GER_found_the_german_interim_government: "[GER_found_the_german_interim_government]"
 GER_found_the_german_interim_government_desc: "[GER_found_the_german_interim_government_desc]"
 GER_found_the_german_interim_government_real: "A Provisional Republic"
 GER_found_the_german_interim_government_real_desc: "With many issues left to be addressed, it seems to be the wisest course to declare a provisional republic, leaving the other issues to be dealt with later, when the time is right."
 GER_settle_the_kaiserfrage: "Settle the Kaiserfrage"
 GER_settle_the_kaiserfrage_desc: "There is vast support for the return of the monarchy in our new Germany. Because if this, it is absolutely necessary that we decide if there is to be a new monarchy or not..."
 GER_heil_kaiser_dir: "Heil Kaiser Dir!"
 GER_heil_kaiser_dir_desc: "Let us rally the soldiers to win this war for the Kaiser! All shall bow to the Jackboot of the German Heer! Hail to the Kaiser!"
 GER_republicanism_at_its_finest: "Republicanism at its Finest"
 GER_republicanism_at_its_finest_desc: "Republicanism has been made great through the works of our state! All must revel in this."
 GER_die_neue_wache: "Die Neue Wache"
 GER_die_neue_wache_desc: "A New Monument will be constructed, one for the Fallen Germans in the last wars! We will remember their great sacrifice for this great nation!"
 GER_learn_from_the_enabling_act: "Copy the Enabling Act"
 GER_learn_from_the_enabling_act_desc: "The enabling act gives us a good roadmap of how to hijack German institutions. This is to be made use of as fast as possible."
