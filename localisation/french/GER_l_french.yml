 GER_neutral_gov_long:0 "Übergangspartei"
 gov_count_middle:0 "\n§Réélire à nouveau le même gouvernement déstabiliserait notre démocratie !§!"
 r56.kill_hitler.10.t:0 "Hitler s'est suicidé"
 r56.kill_hitler.10.desc:0 "\nLa défaite de [GER.GetNameDef] semblant inévitable, Adolf Hitler se serait suicidé dans son bunker de commandement de la capitale [GER.GetAdjective] plutôt que de risquer d'être capturé.\n\nPar testament, l'amiral Karl Dönitz a été nommé nouveau président de [GER.Adjective] et a pris le commandement de ce qu'il reste des forces de [GER.GetAdjective]. Bien que Dönitz ait déclaré qu'il s'engageait à \"obtenir la paix la plus favorable possible\" pour son pays, le \"Reich de mille ans\" touche à sa fin."
 r56.kill_hitler.10.a:0 "Intéressant."
 r56.kill_hitler.10.b:0 "Bon débarras"
 r56.kill_hitler.10.c:0 "Désastreux !"
 r56.kill_hitler.10.d:0 "[GER.GetNameDef] l'emportera !"
 GERK_factory_of_europe:0 "Usine de l’Europe"
 GERK_factory_of_europe_desc:0 "[ROOT.GetNameDefCap] a une longue et fière histoire de production industrielle sans pareille, et c’est une idée que nous entendons maintenir vivante et prospère."
 GERK_army_with_a_state:0 " Une Armée avec un État"
 GERK_army_with_a_state_desc:0 " « Une armée avec un État » est l’expression unique [ROOT.GetAdjective] utilisée pour signifier la puissance et la domination de l’armée dans la société [ROOT.GetAdjective]. »"
 GERK_continue_motorization:0 "Motorisation de l'armée de terre"
 GERK_continue_motorization_desc:0 "L’âge du fantassin touche à sa fin, et nous devons nous adapter pour rester en avance. Nous devons nous assurer que nos forces motorisées soient prêtes et capables de mener l’assaut afin de remporter une victoire rapide et décisive."
 GERK_field_piece_research:0 "Déluge de feu"
 GERK_field_piece_research_desc:0 "L’infanterie est l’épine dorsale de notre armée, et pour qu’elle excelle, elle a besoin d’un soutien adéquat. Nous devons investir massivement dans l’artillerie afin que notre infanterie puisse exploiter tout avantage et écraser tout ennemi qui se présente devant elle."
 r56.ger.65.t:0 "Hitler s'est suicidé"
 r56.ger.65.desc:0 "Notre défaite semblant inévitable, Adolf Hitler a préféré mourir plutôt que de risquer d'être capturé en se suicidant dans son bunker de commandement. \n\nDans son testament, l'amiral Karl Dönitz a été nommé nouveau président [GER.Adjective] et a pris le commandement de ce qu'il reste de nos forces. Bien que Dönitz ait déclaré qu'il s'engageait à \"obtenir la paix la plus favorable possible\" pour son pays, il est peu probable que cela contribue à améliorer la situation déjà désastreuse dans laquelle nous nous trouvons."
 r56.ger.65.a:0 "[GER.GetNameDef] l'emportera !"
 germany.14.desc: "La Pologne nous appartient, mais les parties orientales relèvent de la sphère d'influence des [SOU.GetAdjective] conformément aux dispositions du pacte Molotov-Ribbentrop. Devons-nous retirer nos forces et laisser les [SOU.GetAdjective]s occuper ce territoire ? Si nous ne le faisons pas, notre traité sera annulé."
