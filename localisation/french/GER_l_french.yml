 GER_protektorat_bohmen_mahren: "Protectorat de Bohême et de Moravie"
 GER_naval_effort_r56:0 "Dénoncer le traité naval"
 GER_naval_effort_r56_desc:0 "Le traité naval de 1935 [ENG.GetAdjective]-[GER.GetAdjective] n'est qu'un autre stratagème utilisé pour empêcher notre nation de devenir grande et permettre à [ENG.GetNameDef] de nous dominer. Nous ne pouvons plus nous incliner et négliger notre puissance navale."
 ger.renegotiate_versailles.1.t:0 "[GER.GetNameDefCap] propose de renégocier le traité de Versailles"
 ger.renegotiate_versailles.1.d:0 "[GER.GetNameDefCap] nous a proposé une offre intéressante. Afin de mettre un terme à toute reprise récente des hostilités entre nos deux nations en raison des événements survenus dans leur pays, ils nous ont proposé de renégocier le Traité de Versailles. Cette mesure prévoit que [GER.GetAdjective] n'aura plus à payer de réparations et qu'aucune occupation d'aucun territoire [GER.GetNonIdeologyName] ne se poursuivra.\n\nEn échange, ils promettent de respecter les restrictions aériennes, militaires et navales qui leur sont imposées et de reconnaître le réajustement des frontières [GER.GetNonIdeologyName]. Bien qu'ils aient déclaré que nous devons fournir à [GER.GetNameDef] des garanties de sécurité afin qu'ils restent protégés des menaces étrangères malgré l'absence d'une armée permanente forte.\n\n[GER.GetNameDefCap] croit fermement que cette renégociation est le seul moyen de maintenir la paix à notre époque, mais devons-nous les croire sur parole ?"
 ger.renegotiate_versailles.1.a:0 "Pour maintenir la paix à notre époque."
 ger.renegotiate_versailles.1.b:0 "Nous ne nous intéressons pas aux anciens traités."
 ger.renegotiate_versailles.2.t:0 "[FROM.GetNameDefCap] accepte de renégocier le traité de Versailles"
 ger.renegotiate_versailles.2.d:0 "[FROM.GetNameDefCap] a gracieusement accepté notre offre de renégocier le Traité de Versailles avec nous, en accord avec notre position selon laquelle une telle action est nécessaire pour maintenir la paix à notre époque.\n\nLes effets du traité ont maintenant eu lieu, nous ne pourrons plus utiliser une grande partie de nos forces armées, mais [FROM.GetNameDef] a accepté de défendre notre nation contre l'agression étrangère à sa place."
 ger.renegotiate_versailles.2.a: "La paix pour notre temps."
 ger.renegotiate_versailles.3.t:0 "[FROM.GetNameDefCap] refuse de renégocier le traité de Versailles"
 ger.renegotiate_versailles.3.d:0 "[FROM.GetNameDefCap] a refusé notre offre de renégocier le Traité de Versailles avec nous, en affirmant qu'ils n'ont aucun intérêt à renégocier un traité ancien. Bien que cela puisse être une bonne nouvelle avec le recul, cela soulève des questions sur les véritables motivations de [FROM.GetNameDef] derrière cette décision."
 ger.renegotiate_versailles.3.a:0 "Une bénédiction ou une malédiction ?"
 ger_abided_by_versailles:0 "A respecté Versailles"
 GER_renegotiate_versailles:0 "Renégocier Versailles"
 GER_renegotiate_versailles_desc:0 "Le traité de Versailles a été accusé ces vingt dernières années d'être la cause des souffrances du peuple [GER.GetAdjective], mais il n'est que le résultat d'une négociation peu convaincante. Si nous voulons garantir la paix à notre époque, nous devons apprendre à faire des compromis avec ceux qui nous ont imposé ce traité afin qu'il soit bénéfique pour nous deux."
 GER_legacy_of_gluckliche_zwanziger_jahre:0 "L'héritage du Glückliche Zwanziger Jahre"
 GER_legacy_of_gluckliche_zwanziger_jahre_desc:0 "Les 'Glückliche Zwanziger Jahre' ou 'Les joyeuses années vingt' ont marqué une période de grande reprise économique et de croissance au sein de la République de Weimar, ce qui a montré le potentiel de croissance du peuple allemand dans un système démocratique pacifique. Maintenant que nous en avons les moyens, nous pouvons enfin pleinement exploiter ce potentiel."
 GER_german_scientific_haven:0 "Accueil des scientifique allemand en exil"
 GER_german_scientific_haven_desc:0 "La fuite des cerveaux est terminée et personne n’a gaspillé son potentiel en étant envoyé dans l’armée ou à la guerre, ce qui signifie que les gens peuvent se concentrer pleinement sur leurs études et leurs opportunités d’emploi. Cette nouvelle croissance a permis l’émergence d’un grand nombre de nouveaux universitaires dans notre pays, ce qui contribuera grandement à notre développement technologique dans son ensemble."
 GER_kill_hitler_shortcut:0 "$GER_kill_hitler$"
 GER_bernhard_rogge:0 "Bernhard Rogge"
 GER_helmuth_walter:0 "Helmuth Walter"
 GER_erma_werke:0 "Erma Werke"
 GER_erma_werke_desc:0 "Maschinenfabrik Geipel"
 GER_hanomag:0 "Hanomag"
 GER_hanomag_desc:0 "Hannoversche Maschinenbau"
 GER_mio_trait_mechanized_simplification: "Simplification de la conception"
 GER_mio_trait_mg34:0 "Mitrailleuses Mg 34"
 GER_porsche_improved_tt:0 "§GDisponible§! en tant que §Yscientifique§! : §YFerdinand Porche§!"
 GER_captured_heavy_weapons_desc:0 "Malgré notre production d’équipement supérieure, nous ne pouvons pas négliger les possibilités des équipements ennemis que nous capturons."
 GER_unholy_alliance_tt_1:0 "Cela dissoudra le §H[ROOT.GetFactionName]§! et créera l'Axe §HBerlin-Moscou§!"
 GER_unholy_alliance_tt_2:0 "Cela créera l'axe §HBerlin-Moscou§!"
 GER_appoint_economic_positions_tooltip:0 "Vous aurez le choix de nommer l'un des conseillers suivants :"
 GER_exploit_trade_dependence:0 "Exploiter les dépendances commerciales"
 GER_exploit_trade_dependence_desc:0 ""
 GER_return_of_conservative_exiles:0 "Retour des exilés"
 GER_return_of_conservative_exiles_desc:0 ""
 GER_return_of_conservative_exiles_tt:0 "Une fois que la §YCivile War§! commence :"
 GER_contact_ludendorff:0 "Contactez Ludendorff"
 GER_contact_ludendorff_desc:0 "Erich Ludendorff, le général de l'armée, conservateur et fervent pendant la Grande Guerre, reste un héros de guerre apprécié des [ROOT.GetAdjective]. Il est connu pour avoir soutenu le NSDAP au début, mais il s'est éloigné du parti ces dernières années. Avec lui à nos côtés, notre légitimité sera considérablement renforcée."
 GER_ludendorff_will_join:0 "§YErich Ludendorff§! rejoindra notre camp en tant que §YMaréchal§! dès que la §RGuerre Civile§! commencera."
 GER_fufill_the_clay_of_mittelafrika:0 "Fulfill the Clay of Mittelafrika"
 GER_fufill_the_clay_of_mittelafrika_desc:0 "Pendant trop longtemps, [ROOT.GetNameDef] a rêvé d'une grande colonie africaine s'étendant de [CHA.GetNonIdeologyName] à [ZAM.GetNonIdeologyName] surnommée 'Mittelafrika'. Il est désormais temps de réaliser ce rêve et de consolider notre place en tant que puissance coloniale établie."
 GER_reclaiming_our_colonies:0 "Restauration de nos possessions impériales"
 GER_reclaiming_our_colonies_desc:0 "Le traité de Versailles nous obligeait à renoncer à notre souveraineté sur les territoires impériaux que l'Allemagne détenait avant la Première Guerre mondiale. Ce traité nous a réduits du statut de superpuissance mondiale à celui de simple puissance régionale.\nMais maintenant que le Kaiser est de retour au pouvoir, il est peut-être temps de reconquérir notre empire une bonne fois pour toutes !"
 GER_interest_in_the_carribean:0 "Intérêt pour les Caraïbes"
 GER_interest_in_the_carribean_desc:0 "Nos forces navales ont toujours envisagé la possibilité d'établir des bases dans les îles des Caraïbes, même si Otto von Bismarck lui-même nous y empêchait. Maintenant qu'il ne nous fait plus obstacle, nous pouvons enfin mener à bien ces ambitions."
 GER_restore_klein_venedig:0 "Restaurer Klein-Venedig"
 GER_restore_klein_venedig_desc:0 "Klein-Venedig était le territoire le plus important de la colonisation allemande des Amériques jusqu'à ce qu'il nous soit volé par les puissances coloniales du passé. Il est maintenant temps que nous reprenions nos revendications et que nous nous réunissions avec nos [GER.GetAdjective] du sud !"
 GER_galvanize_german_militarism:0 "Galvaniser le militarisme [GER.GetAdjective]"
 GER_galvanize_german_militarism_desc:0 "Le militarisme en [GER.GetNameDef] est une partie essentielle de notre identité nationale et de notre place en tant que nation. Il est donc naturel que nous l'utilisions pour renforcer notre moral."
 GER_support_freikorps_tt:0 "4 §YFreikorps Divisions§! will join us upon the §YCivil War's§! start.\n§RThe Freikorps will incite a civil war in the event of a far left government...§!"
 GER_the_anglo_german_naval_agreement:0 "L'accord naval anglo-allemand"
 GER_the_anglo_german_naval_agreement_desc:0 "En juin 1935, nous avons signé l'accord naval anglo-allemand, autorisant la construction d'une flotte limitée. Il est temps de revoir cet accord..."
 GER_adhere_to_the_agreement:0 "Adhérer à l'accord"
 GER_adhere_to_the_agreement_desc:0 "Il est préférable pour nous de ne pas mettre les Britanniques en colère. Si la guerre éclate en Europe, nous ne pouvons pas nous permettre de les mettre à l'épreuve, car nous serions certainement confrontés à un nouveau blocus. En respectant l'accord, nous pourrons concentrer nos ressources ailleurs."
 GER_denounce_the_agreement:0 "Dénoncer l'accord"
 GER_denounce_the_agreement_desc:0 "Il ne fait aucun doute que nous n'avons aucune intention de maintenir le statu quo demandé par la Grande-Bretagne. L'Allemagne ne sera pas limitée dans ses ambitions !"
 GER_scale_down_naval_projects:0 "Projets navals à échelle réduite"
 GER_scale_down_naval_projects_desc:0 "En annonçant une réduction à grande échelle des projets navals, davantage de ressources seront disponibles pour le secteur industriel, nous permettant ainsi de nous concentrer sur nos projets européens au lieu de verser du sang, de la sueur et de l'acier dans des navires fragiles."
 GER_reopen_wilhelmshaven_shipyards:0 "Réouverture des chantiers navals de Wilhelmshaven"
 GER_reopen_wilhelmshaven_shipyards_desc:0 "Les chantiers navals de Wilhelmshaven ont été fermés après la Grande Guerre, mais il est peut-être temps d'envisager leur réouverture pour permettre des projets de construction de convois plus importants."
 GER_expand_blohm_voss_shipyards:0 "The Wilhelmshaven Shipyards were closed after the Great War, though perhaps it is time we take a look at reopening them to allow for greater convoy construction projects"
 GER_expand_blohm_voss_shipyards_desc:0 "Blohm+Voss a prouvé qu'il était un constructeur naval compétent et un petit investissement gouvernemental garantirait sûrement que leurs capacités soient utilisées au maximum."
 GER_naval_plan_z:0 "Plan naval Z"
 GER_naval_plan_z_desc:0 "L'Empire allemand possédait autrefois l'une des meilleures marines du monde. La Grande Guerre a changé la donne et le traité de Versailles a empêché sa renaissance. Mais, grâce au Plan Z, nous aurons à nouveau une marine qui rivalisera même avec celle de la Grande-Bretagne."
 GER_naval_aviation_patrols:0 "Patrouilles de l'aviation navale"
 GER_naval_aviation_patrols_desc:0 "Au lieu d'utiliser la marine marchande pour protéger nos côtes, nous pouvons nous concentrer sur le perfectionnement de notre aviation navale, ce qui permettrait à notre armée de l'air de jouer un rôle dissuasif. Après tout, un avion coûte moins cher qu'un navire."
 GER_simplify_convoy_construction:0 "Simplifier la construction des convois"
 GER_simplify_convoy_construction_desc:0 "En réduisant la quantité d'équipements fournis à bord de nos navires de convoi et en les standardisant, nous serons en mesure de produire davantage de convois qui permettront à nos échanges commerciaux de se dérouler plus facilement."
 GER_the_bismarck_class:0 "La classe Bismarck"
 GER_the_bismarck_class_desc:0 "Après la Grande Guerre, nos anciens ennemis se sont encore plus contraints de respecter des traités limitant la taille de leurs navires. Nous ne sommes pas liés par ces contraintes et savons donc ce qu'il nous faut pour les dépasser."
 GER_fortify_the_coast:0 "Fortifier la côte"
 GER_fortify_the_coast_desc:0 "En établissant des fortifications côtières et des installations anti-aériennes le long de la côte de la mer du Nord, nous garantissons que quiconque tente de débarquer sera confronté à une forte résistance, qu'elle vienne de la mer ou des airs."
 GER_emergency_naval_program:0 "Programme naval d'urgence"
 GER_emergency_naval_program_desc:0 "La guerre est arrivée en Allemagne et ce que nous espérions pour nous protéger ne suffit plus. Nous devons abandonner l'accord et, même si nous ne pouvons pas construire une grande flotte de surface, un sous-marin devra faire l'affaire."
 GER_the_o_class:0 "La Classe O"
 GER_the_o_class_desc:0 "Si le Bismarck et le Tirpitz sont les couronnes de notre flotte atlantique, ils doivent être accompagnés de navires performants. La classe O a été conçue pour les compléter et, ensemble, ils formeront le cœur de notre marine."
 GER_abandon_plan_z:0 "Abandonner le plan Z"
 GER_abandon_plan_z_desc:0 "Dans les circonstances actuelles, nous ne pouvons pas nous permettre de maintenir le Plan Z, les navires sont trop chers et prennent beaucoup trop de temps pour ce que nous essayons d'accomplir. En nous concentrant sur une flotte sous-marine, nous serons toujours en mesure de dominer l'Atlantique."
 GER_rule_the_naval_skies:0 "Régnez sur les cieux navals"
 GER_rule_the_naval_skies_desc:0 "La Grande Guerre a prouvé que l'aviation est le prochain champ de bataille à dominer, et ce même en mer. Nous devons nous assurer que nos navires capitaux disposent des escortes dont ils ont besoin, même aériennes."
 GER_scout_cruisers:0 "Croiseurs Scout"
 GER_scout_cruisers_desc:0 "Bien que la flotte de combat principale soit plus que capable de couler des convois, des croiseurs et des cuirassés, nous avons besoin de quelque chose qui puisse traquer et couler efficacement les convois hostiles tout en évitant l'engagement."
 GER_the_m_class:0 "La Classe M"
 GER_the_m_class_desc:0 "Contrairement aux croiseurs éclaireurs, la classe M sera placée aux côtés de la flotte de combat principale et fournira un écran défensif aux cuirassés et fera face aux autres croiseurs et destroyers qui pourraient essayer de nous forcer à nous aligner."
 GER_trade_route_interdiction:0 "Interdiction des routes commerciales"
 GER_trade_route_interdiction_desc:0 "La lame invisible est la plus meurtrière, en frappant sous la surface, nous pourrons couler convoi après convoi, affamant nos ennemis de ravitaillement et de renforts."
 GER_modular_submarine_construction:0 "Construction modulaire de sous-marins"
 GER_modular_submarine_construction_desc:0 "En simplifiant la construction de nos sous-marins, nous pourrons en construire davantage en moins de temps, ce qui nous permettra de disperser les chasseurs silencieux à travers l'Atlantique en toute impunité."
 GER_the_h_class:0 "La Classe H"
 GER_the_h_class_desc:0 "Prochaine étape dans l'évolution de la classe Bismarck, la classe H doit être suffisamment capable de projeter la force allemande non seulement dans l'Atlantique, mais au-delà !"
 GER_reach_across_the_atlantic:0 "Traverser l'Atlantique"
 GER_reach_across_the_atlantic_desc:0 "Le moment est venu pour les navires de guerre allemands de traverser l'Atlantique dans une démonstration de force qui jettera dans leur ombre les flottes américaines et britanniques."
 GER_general_staff:0 "État-major"
 GER_general_staff_desc:0 "L'état-major général [ROOT.GetAdjective] était chargé de l'étude continue de tous les aspects de la guerre, y compris de l'élaboration et de la révision des plans de mobilisation ou de campagne. Cela contribuait à un niveau d'organisation plus élevé dans l'armée."
 GER_nva_idea:0 "Volksarmee"
 GER_medical_costs:0 "Université médicale chinoise"
 GER_medical_costs_desc:0 "La détérioration de la santé d'Erich Ludendorff constitue un défi car des sommes croissantes de fonds gouvernementaux sont allouées pour qu'il reçoive le meilleur traitement possible afin qu'il puisse continuer à servir, même si ce n'est qu'une question de temps."
 GER_wilhelm_ii_idea:0 "Wilhelm II"
 GER_wilhelm_iii_idea:0 "Wilhelm III"
 GER_frederick_iv_idea:0 "Frederick IV"
 GER_case_yellow:0 "Plan Jaune"
 GER_simplified_convoys:0 "Convois simplifié"
 GER_scaled_down_naval_projects:0 "Projets navals à échelle réduite"
 GER_naval_aviation_patrol_idea:0 "Patrouilles de l'aviation navale"
 GER_wolfpack_tactics_idea:0 "Tactiques du Wolfpack"
 GER_plan_z_idea:0 "Le plan Z"
 r56_GER_four_year_plan:0 "Le Plan de quatre ans"
 r56_GER_four_year_plan_upgrade:0 "Le Plan Perpétuel de Quatre Ans"
 r56_GER_four_year_plan_desc:0 "§WEntrer en§! §Rguerre offensive§! §Wavec une§! §YGrande Puissance§! §RRetire§! §Wcet§! §YEsprit National§!\n"
 GER_coerce_the_technocrats:0 "Forcer les technocrates"
 r56_GER_four_year_plan_upgrade_tt:0 "§YL’esprit National $r56_GER_four_year_plan$§! deviendra permanent et ne sera plus supprimé si §Rnous rentrons en guerre offensive§!§W.§!"
 GER_coerce_the_technocrats_desc:0 "De nombreux hommes d’affaires et leurs partenaires, la soi-disant classe technocratique, détestent faire des affaires et mener des recherches sous notre gouvernement actuel. Cette potentielle cinquième colonne doit être détruite avant qu’elle n’ait la chance de nous détruire de l’intérieur. La classe technocratique se soumettra à notre volonté et aidera nos efforts pour développer notre pays. D’une manière ou d’une autre."
 r56_GER_coerce_the_technocrats_idea:0 "Forcer les technocrates"
 r56_GER_coerce_the_technocrats_idea_desc:0 "La classe des affaires et technocratique se soumettra à notre volonté. Nous ne leur laisserons aucun choix !"
 GER_coerce_the_technocrats_tt:0 "Quand le focus §Y$GER_institute_price_controls$§! est §Ycomplété:§!"
 r56_GER_economic_uncertainty:0 "Incertitude économique"
 r56_GER_economic_uncertainty_desc:0 "Les industriels sont inquiets des choix économiques que le gouvernement doit faire. Le choix de conserver ou de supprimer le projet de loi MEFO au profit d'un autre programme de croissance apaiserait les inquiétudes du marché concernant notre économie, tant au niveau national qu'international."
 r56_ger_ersatz_idea_1:0 "Matériaux de rechange"
 r56_ger_ersatz_idea_1_desc:0 "L'économie n'a pas accès à tous les matériaux dont elle a besoin grâce au commerce international. Nous devons utiliser ce dont nous disposons pour faire des substitutions."
 GER_enigma_machine0:0 "Machine Enigma"
 GER_enigma_machine1:0 "Machine Enigma améliorée"
 GER_enigma_machine2:0 "Machine Enigma à 5 rotors"
 GER_enigma_machine3:0 "Machine Enigma à 8 rotors"
 GER_establishing_the_reichskommissar:0 "Création du Reichskommissar"
 GER_eastern_campaign:0 "Campagne de l'Est"
 GER_eastern_campaign_desc:0 "Les campagnes de propagande financées par l’État ont assuré même aux plus fervents opposants à la guerre à l’Est que les conditions de victoire seraient dictées par les conditions allemandes et qu’aucune négociation n’entraverait les réalisations de la Wehrmacht.\n\n§HCet Esprit National sera supprimé si les pertes infligées par les soviétiques aux allemands atteignent un seuil de 4 millions, ou si un état central appartenant aux soviétiques dépasse 50 % de conformité.§!"
 r56_GER_kdf_wagen_scheme:0 "Plan Kdf-Wagen"
 r56_GER_kdf_wagen_scheme_desc:0 "En utilisant un système d'épargne permettant aux gens d'acheter des voitures, nous pouvons utiliser les fonds économisés pour aider à développer l'industrie lourde. Nous avons une fenêtre de temps limitée pour en profiter."
 GER_assault_guns:0 "Canons d'assaut"
 GER_assault_guns_desc:0 ""
 GER_modify_mefo_bills_modifier:0 "Modifiez §Y$GER_mefo_bills_modifier$§! par"
 GER_mefo_bills_increase_pp_cost_effect_tt:0 "$GER_modify_mefo_bills_modifier$\n$MODIFIER_POLITICAL_POWER_COST$: §R-0,15§!\n\n"
 GER_mefo_bills_decrease_pp_cost_effect_tt:0 "$GER_modify_mefo_bills_modifier$\n$MODIFIER_POLITICAL_POWER_COST$: §G+0,15§!\n\n"
 GER_hans_beimler:0 "Hans Beimler"
 GER_johannes_becher:0 "Johannes Becher"
 GER_denounced_the_agreement:0 "A dénoncé l'accord"
 GER_adhered_to_the_agreement:0 "A adhéré à l'accord"
 r56_GER_anschluss_mean_message_was_sent_out:0 "L'Allemagne nous a envoyé l'Anschluss"
 r56.kill_hitler.3.p:0 "*Recrache sa rioja*"
 r56.kill_hitler.3.q:0 "*Recrache sa pontikka*"
 r56.kill_hitler.8.t:0 "Le Führer poignardé à mort !"
 r56.kill_hitler.8.desc:0 "[GER.GetNameDefCap] has been shocked by the news of the assassination of its Führer, Adolf Hitler. It seems that the German chancellor went missing for a few hours, starting to raise the alarms among his entourage. After a day of research his body had finally been discovered hidden under a barrel of fuel near a oil depot close to the Berlin suburb of Marzahn. The body of the chancellor had clear traces of penetration by a piercing weapon. The preliminary report identifed it as some kind of combat knife. The body was then carried around and finally hidden on the site of its discovery. Needless to say the Berlin garrison had been on high alert for two days and rumors starts to circulate about the potential assassin alongside with the question of the succession between the bigwigs of the NSDAP."
 r56.kill_hitler.8.a:0 "Un coup d'État ?"
 r56.kill_hitler.8.b:0 "Traîtres !"
 r56.kill_hitler.9.t:0 "Hitler tué au combat !"
 r56.kill_hitler.9.desc:0 "\nAvec le retrait des troupes soviétiques de Sébastopol, le corps d'Hitler a été retrouvé dans une tranchée aux côtés de ses camarades. Semion Hitler, un juif ukrainien, avait combattu vaillamment contre les envahisseurs. Ayant été blessé au combat, il avait pourtant rejoint ses lignes. Faisant preuve d'un courage qui aurait fait honte à un messager bavarois homonyme de la première guerre mondiale."
 r56.kill_hitler.9.a:0 "Attends, ce n'est pas la bonne !"
 r56.kill_hitler.9.b:0 "Non ! Mon Fuhr..."
 r56.ger.34.t:0 "[FROM.GetName] Propose l'intégration"
 r56.ger.34.d:0 "[FROM.GetNameDefCap] est devenu un partenaire de plus en plus important pour [ROOT.GetNameDef] et cherche désormais à étendre ce partenariat par l’intégration économique et politique."
 r56.ger.34.a:0 "Une coopération plus étroite serait bénéfique."
 r56.ger.34.b:0 "On ne peut pas leur faire confiance."
 r56.ger.34.c:0 "Nous devons éliminer leur influence."
 r56.ger.35.t:0 "[FROM.GetName] accepte l'intégration"
 r56.ger.35.desc:0 "L'ambassadeur de [FROM.GetAdjective] nous a informé que le gouvernement de [FROM.GetNameDef] est intéressé par notre proposition d'intégration plus poussée. Nos liens économiques renforcés promettent d'avoir une influence positive sur nos deux nations."
 r56.ger.35.a:0 "Délicieux"
 r56.ger.36.t:0 "[FROM.GetName] refuse l'intégration"
 r56.ger.36.desc:0 "Les représentants du gouvernement [FROM.GetAdjective] nous ont fait savoir qu’ils n’avaient pas l’intention de mettre en œuvre les mesures prévues dans notre proposition d’intégration. Bien qu’ils nous assurent vouloir poursuivre nos relations commerciales, ils refusent de nous laisser étendre notre influence politique sur eux."
 r56.ger.36.a:0 "Hélas, rien ne peut être fait."
 r56.ger.36.b:0 "On verra comment ils s'en sortent sans nous."
 r56.ger.36.c:0 "Pas une option."
 r56.ger.39.t:0 "[FROM.GetName] renverse le gouvernement"
 r56.ger.39.d:0 ""
 r56.ger.39.a:0 "Leur influence a été majoritairement positive."
 r56.ger.39.b:0 "Il faut résister !"
 r56.ger.40.t:0 "Les forces soutenues par [FROM.GetAdjective] ont échoué à leur coup d'État"
 r56.ger.40.d:0 "Les corporatistes soutenus par [FROM.GetAdjective] ont tenté d'installer un gouvernement favorable tôt ce matin, mais ont été arrêtés avec succès par la police et les partisans du gouvernement. Cette escalade extrême nous a permis de purger les principaux soutiens de ce mouvement, mais elle a de graves implications sur notre relation avec [GER.GetNameDef]."
 r56.ger.40.a:0 ""
 r56.ger.41.t:0 "Un gouvernement favorable aux [ROOT.GetAdjective] se forme en [FROM.GetName]"
 r56.ger.42.t:0 "Coup d'État raté dans [FROM.GetName]"
 r56.ger.42.d:0 "Les forces soutenues par [ROOT.GetAdjective] ont rencontré une résistance étonnamment forte à [FROM.GetNameDef], ce qui a entraîné de nombreux décès lorsque la police a empêché les forces paramilitaires de prendre des positions clés et des arrestations très médiatisées. Il semble certain que cette opportunité ne se représentera pas."
 r56.ger.42.a:0 "Brûler les preuves"
 formable_cored_states_tt:0 "Gagne des §Yrevendications§! sur §Ytous les états requis§!"
 GER_inter_communist_fighting_tt:0 "Gagne des objectifs de guerre sur l'§HOpposition européenne§!."
 kpd_gets_opposition:0 "§RL'opposition de droite se formera.§!"
 GER_improved_battleship_hull_research_tt:0 "\nUne fois que la technologie §Y1940 Heavy Ship Hull§! est recherchée :\n"
 GER_anti_colonialism_desc:0 "Since our colonies were taken, much has changed, and we must recognize colonization for the evil it is, besides, this will win us some favor with several rising superpowers."
 GER_dem_anschluss_desc:0 ""
 GER_soviet_support_desc:0 "[SOV.GetNameDefCap] serait un bon partenaire pour restaurer notre puissance militaire."
 GER_counter_soviet_agression_desc:0 "Nous devons agir rapidement pour contrer la menace [SOV.GetAdjective] en élargissant notre alliance et en nous préparant à une frappe préventive."
 GER_anti_bolshevist_bloc_desc:0 "Dans les pays d’Europe de l’Est sous la menace ou l’occupation soviétique, des organisations anticommunistes se sont constituées, influençant la politique et résistant à l’influence communiste. Travailler avec de telles organisations pourrait convaincre les pays d’origine de mettre de côté leurs propres différences idéologiques pour s’unir contre le communisme."
 GER_anti_soviet_friend_poland_desc:0 "Peu de nations ont autant souffert des tentatives de colonialisme soviétique que la Pologne lors de sa guerre d'indépendance et de la répression qui s'en est suivie sur le territoire soviétique. Leur position stratégique, leur puissance militaire et leur position à l'égard de leur ancien oppresseur devraient en faire un allié redoutable."
 GER_dem_italy_alliance_desc:0 "[ITA.GetLeader] est un opportuniste et, quelles que soient ses différences idéologiques, il pourrait être intéressé à défier l'influence communiste à sa porte ou au moins à étendre l'influence de [ITA.GetAdjective]."
 GER_anti_soviet_friend_baltics_desc:0 "Les pays baltes, soutenus par nous dans l’obtention de leur indépendance, pourraient être intéressés par notre aide pour conserver leur indépendance."
 GER_anti_soviet_friend_finland_desc:0 ""
 GER_realise_belarusian_statehood_desc:0 "La Biélorussie, l’une des républiques soviétiques les plus gravement touchées par la terreur stalinienne, devrait être l’une des principales cibles de la libération."
 GER_alliance_with_gustaf:0 "Alliance avec Gustaf"
 GER_alliance_with_gustaf_desc:0 "Le roi Gustaf de [SWE.GetNonIdeologyName] viendra sûrement à notre mode de vie une fois qu'il se rendra compte du terrain d'entente sur lequel nous nous trouvons, car nous sommes parents les uns des autres."
 GER_sway_spain:0 "Influencer [SPB.GetNameDef]"
 GER_sway_spain_desc:0 "Les monarchies de [ROOT.GetNonIdeologyName] et de [SPR.GetNonIdeologyName] ont partagé une longue et fructueuse histoire commune. Il est donc naturel que nous nous réunissions à nouveau."
 GER_asia_department: "Le département Asie"
 GER_asia_department_tt: "Ce focus deviendra la condition préalable de §YSe faire ami avec le Japon§! ! et de §YSe faire ami avec la Chine§! ! une fois que §YTuer Hitler§! aura été sélectionné."
 GER_middle_east_diplo_tt:0 "Ces décisions nous permettront d’influencer les pays du §YMoyen-Orient§! et leur politique, les incitant éventuellement à rejoindre notre faction."
 GER_will_strengthen_right_opposition:0 "§RCela renforcera l'opposition de droite§!"
 GER_heinrich_brandler_will_lead_country_tt:0 "Si §YHeinrich Brandler§! est employé comme §YConseiller§!, il peut devenir §YChef de Pays§!"
 GER_middle_eastern_diplomacy_category:0 "Relations avec le Moyen-Orient"
 GER_middle_eastern_diplomacy_category_desc:0 "Alors que les guerres font rage en Europe et que l’avenir de l’Allemagne est incertain, nous devons nous efforcer de rassembler des soutiens et de tendre la main aux pays du Moyen-Orient comme l’Afghanistan et la Perse. Ces pays pourraient s’avérer très importants sur le plan politique et stratégique, car ils partagent des frontières avec nombre de nos ennemis et possèdent de grandes réserves de pétrole."
 GER_middle_eastern_diplomacy:0 "Relations avec le Moyen-Orient"
 GER_pro_german_propaganda:0 "Propagande pro-allemande"
 GER_spread_pro_german_propaganda:0 "Diffuser de la propagande dans [FROM.GetName]"
 GER_send_german_advisors:0 "Envoyer des conseillers militaires à [FROM.GetName]"
 GER_military_advisors:0 "Conseillers militaires allemands"
 GER_invite_FROM_to_faction:0 "Inviter [FROM.GetName] à [ROOT.GetFactionName]"
 GER_middle_eastern_diplomacy_desc:0 "Alors que les guerres font rage en Europe et que l’avenir de l’Allemagne est incertain, nous devons nous efforcer de rassembler des soutiens et de tendre la main aux pays du Moyen-Orient comme l’Afghanistan et la Perse. Ces pays pourraient s’avérer très importants sur le plan politique et stratégique, car ils partagent des frontières avec nombre de nos ennemis et possèdent de grandes réserves de pétrole."
 GER_communists_are_pretty_hard_tt_tip:0 "\n\n§HTip:§! Although we could focus on the Nazis and get some states or even capitulate them, the §HConservative Side§! will likely §Hdefeat us§! after.\n\nBy assembling a §HSmall Mobile Division§!, we may be able to §Hrush§! the Conservatives' §HCrucial Cities§! while they fight the Nazis."
 r56.ger.29.d: "La nation allemande réformée a demandé quelques avoirs historiques mineurs en échange de son soutien dans nos guerres actuelles."
 r56.ger.30.t:0 "Les sympathies cachées d'Erich Ludendorff"
 r56.ger.30.d:0 "Erich Ludendorff, le général de quartier-maître conservateur et dévoué pendant la Grande Guerre, reste un héros de guerre populaire dans l'esprit des [ROOT.GetAdjective]. Bien qu'il soit connu pour avoir soutenu le NSDAP au début, il s'est éloigné du parti ces dernières années au point de mépriser [GER.GetLeader] lui-même.\n\nSa popularité est incontestable et il est un commandant militaire éprouvé. Peut-être qu'avec un peu de persuasion, il sera prêt à se rallier à notre cause. Avec lui à nos côtés, notre force et notre légitimité seront considérablement renforcées."
 r56.ger.30.a:0 "Espérons qu'il s'en sortira."
 r56.ger.31.t:0 "La santé d'Erich Ludendorff se détériore"
 r56.ger.31.d:0 "Bien qu'il ait récemment rejoint notre camp dans la lutte contre les nazis, la santé de Ludendorff a de nouveau commencé à se détériorer. Des complications liées à un cancer du foie font croire à la plupart des gens que ce n'est qu'une question de temps avant qu'il ne succombe à sa maladie.\n\nNous pourrions lui permettre de prendre sa retraite en toute élégance et de vivre le temps qu'il lui reste comme il le souhaite, ou plutôt essayer de lui trouver les meilleurs soins de santé possibles et lui permettre de continuer à servir."
 r56.ger.31.a:0 "Il nous a bien servi, permettez-lui de prendre sa retraite."
 r56.ger.31.b:0 "Trouvez-lui les meilleurs soins de santé possibles !"
 r56.ger.32.t:0 "Décès de Ludendorff"
 r56.ger.32.d:0 "Erich Ludendorff, l'homme qui nous a apporté une aide précieuse pour notre cause, est décédé des suites de complications liées à un cancer du foie. Bien que nous ayons longtemps essayé de le soigner afin de le maintenir en bonne santé, il est toujours resté déterminé à servir [GER.GetNameDef] jusqu'à son dernier souffle."
 r56.ger.32.a:0 "Un vrai soldat jusqu'au bout."
 r56.ger.33.t:0 "Décès de Ludendorff"
 r56.ger.33.d:0 "Erich Ludendorff, l'homme qui nous a apporté une aide précieuse pour notre cause, est décédé des suites de complications liées à un cancer du foie. Bien qu'il soit désormais à la retraite, il a continué à servir [GER.GetNameDef] de manière civile jusqu'à son dernier souffle."
 r56.ger.33.a:0 "Il nous manquera"
 r56.ger.37.t:0 "L'armée prend le pouvoir"
 r56.ger.37.d:0 "Ce matin, dans ce qui a été décrit comme un coup d'État sans effusion de sang, de nombreux éléments des forces armées ont rapidement encerclé le palais impérial de [GER.GetLeader] et l'ont mis sous siège. Cela a obligé le Kaiser à abandonner une grande partie de ses pouvoirs et à laisser une dictature militaire diriger le pays, dirigée par Kurt von Hammerstein-Equord, se réduisant à celui d'une simple figure de proue.\n\nCette évolution a été accueillie avec des réactions mitigées dans [GER.GetNameDef]. Seul le temps nous dira quelles seront les conséquences à long terme."
 r56.ger.37.a:0 "Un développement intéressant."
 r56.ger.38.t:0 "Le Kaiser prend le contrôle du gouvernement"
 r56.ger.38.d:0 "Suite à l'influence croissante du roi en [GER.GetNameDef], le Kaiser a annoncé ce matin qu'il abrogeait de nombreuses lois restrictives qui lui avaient été imposées à la suite d'une action militaire et qu'il rétablissait son contrôle sur le gouvernement et l'armée.\n\nBien que cela puisse être impopulaire parmi l'élite radicale, il est évident que le Kaiser a la volonté populaire et le pouvoir d'accomplir cette ambitieuse reprise du pouvoir."
 r56.ger.38.a:0 "L’ordre sera-t-il rétabli ?"
 r56.ger.43.t:0 "[FROM.GetNameDefCap] Demandes d'envoi de conseillers militaires"
 r56.ger.43.d:0 "Les conseillers militaires de [GER.GetAdjective] sont arrivés dans la capitale plus tôt dans la journée après de longues discussions avec [GER.GetNameDef] sur une éventuelle coopération militaire entre les deux pays. Il semble que [GER.GetNameDef] soit prêt à investir dans notre armée et notre industrie afin d'obtenir notre soutien. Mais nous verrons si cela se produira."
 r56.ger.43.a:0 "Bienvenue."
 r56.ger.43.b:0 "Non, désolé."
 r56.ger.44.t:0 "[FROM.GetNameDefCap] Rejette"
 r56.ger.44.d:0 "Après notre proposition d'un attaché militaire dans [FROM.GetNameDefCap], [FROM.GetAdjective] a examiné et décidé qu'il était préférable de rejeter notre proposition. Cela peut être dû au fait que leur alignement politique souhaité ne se situe pas en Allemagne, mais peut-être ailleurs..."
 r56.ger.44.a:0 "Très bien, tant pis."
 r56.ger.45.t:0 "L'accord naval anglo-allemand"
 r56.ger.45.d:0 "Depuis la signature de l’accord naval anglo-allemand en 1935, notre marine est soumise au ratio de 35:100 que les Britanniques tenaient à maintenir. Cependant, l’avenir de l’Europe étant incertain, nous devrions réévaluer notre position sur l’accord, même si cela pourrait avoir des conséquences potentielles avec les Britanniques."
 r56.ger.45.a:0 "Au diable l'accord"
 r56.ger.45.b:0 "Il vaut mieux ne pas les mettre en colère..."
 wtt_germany.83.t:0 "Décès de Guillaume III"
 wtt_germany.83.d:0 "La nuit dernière, Guillaume III, notre bien-aimé empereur, est décédé des suites d'une crise cardiaque. Malgré son règne de courte durée, la Providence avait jugé bon de lui permettre de régner bien avant sa mort, et depuis lors, il a bien dirigé notre nation. Son fils, Guillaume Frédéric, a maintenant repris les rênes de la nation et, après son couronnement, il sera connu sous le nom de Guillaume IV."
 ger_brest_litovsk.1.t:0 "L'Allemagne propose la paix !"
 ger_brest_litovsk.1.d:0 "[SOV.GetNameDefCap] a proposé un traité pour mettre fin à la guerre [GER.GetAdjective]-[SOV.GetAdjective] à l'Est. Le traité comprenait des conditions pour céder plusieurs territoires occupés par les [SOV.GetAdjective] occidentaux aux [GER.GetAdjective] en échange de la paix. Ces conditions sont similaires au traité de Brest-Litovsk, qui a mis fin au conflit germano-soviétique pendant la Grande Guerre."
 ger_brest_litovsk.1.a:0 "Rejetons les conditions !"
 ger_brest_litovsk.1.b:0 "Accepter les conditions."
