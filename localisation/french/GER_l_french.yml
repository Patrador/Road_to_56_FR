 GER_forts_unavailable: "§Raucun fort ne sera construit puisque c'est soit démilitarisé ou soit pas sous notre contrôle.§!\n"
 GER_colonies_for_support:0 "Des colonies en échange d'un soutien"
 GER_colonies_for_support_desc:0 "En particulier, les Britanniques pourraient être disposés à restaurer une partie de notre empire colonial en échange de notre soutien dans leur conflit actuel, même s'il ne s'agit pas de leur plus grand mérite, cela marquerait une restauration historique."
 GER_central_powers_tt:0 "§YToutes les nations non alignées, historiquement alliées, seront invitées dans notre faction.§!"
 r56.ger.29.t: "[FROM.GetNameDefCap] demande ses anciennes colonies en échange d'un soutien"
 r56.ger.29.a: "Ce serait utile !"
 r56.ger.29.b: "Nous n'en avons pas besoin."
 GER_cede_853_to_ITA:0 "Céder Ljubljana à l'Italie"
 GER_western_communist_desc:0 "Si nous voulons repousser la menace orientale, nous devons d'abord sécuriser notre sphère."
 not_too_much_soviet_influence_tt: "Moins de 4 points d'influence soviétique"
