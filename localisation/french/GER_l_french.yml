 GER_formalize_the_reichskommissariats:0 "Formaliser les Reichskommissariats"
 GER_formalize_the_reichskommissariats_desc:0 "Maintenant que nos ennemis ont été vaincus et que nous avons remporté la victoire finale, nous pouvons prendre le temps de renforcer et de renforcer nos commissariats du Reich sur les terres qu'ils administrent. Après tout, les populations n'ont plus aucun espoir de libération auquel s'accrocher."
 GER_formalize_the_reichskommissariats_tt:0 "Les [ROOT.GetFlag]§YReichskommissariats§! et [D10.GetFlag]§YProtektorats§! que nous avons établis gagnent des revendications sur les §YÉtats§! qu'ils contrôlent entièrement."
