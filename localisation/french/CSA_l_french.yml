 CSA_change_the_flag:0 "Modifier le drapeau"
 confederacy.1.t:0 "Changer le drapeau"
 confederacy.1.desc:0 "Symbole suprême de notre nation dans la culture avant sa réorganisation, le drapeau de bataille des Confédérés fut déclaré comme étant désormais celui du pays tout entier. Cependant, la réaction face à notre quatrième changement de drapeau national n’a pas été unanimement positive.Certains souhaitent renforcer la continuité avec les États confédérés d’Amérique des années 1860 en adoptant le « Blood-Stained Banner », utilisé à peine plus d’un mois avant la fin de la guerre de Sécession.D’autres, au contraire, refusent qu’un symbole de guerre figure sur notre drapeau national ; pour eux, cette nouvelle ère doit être moins marquée par le sang et les conflits. Ils préféreraient que nous brandissions à nouveau le premier drapeau, celui des « Stars and Bars »."
 confederacy.1.a:0 "Le \"Blood-Stained Banner\" mérite une chance."
 confederacy.1.b:0 "Nous devrions ramener les “Stars and Bars” — la guerre ne devrait pas représenter notre nation."
 confederacy.1.c:0 "C’est inutile. Tous les patriotes confédérés aiment le drapeau de bataille !"