l_french:
 KAT_the_geological_scandal:0 "Le scandale géologique"
 KAT_the_geological_scandal_desc:0 "Avec un sous-sol riche en vastes quantités d’une grande variété de minerais, le Katanga est connu comme le « scandale géologique ». Tout plan économique national devrait se concentrer sur le développement de nos capacités extractives."
 KAT_gold_mining:0 "Étendre l’extraction de l’or"
 KAT_gold_mining_desc:0 "La présence d’or, de diamants et d’autres minerais de valeur nous fournirait des revenus directs afin de poursuivre notre développement."
 KAT_katangese_copper:0 "Le cuivre katangais"
 KAT_katangese_copper_desc:0 "Le cuivre est le principal minerai disponible au Katanga. Il est même collecté par les populations locales pour créer les « croisettes », ces petites croix qui sont devenues notre emblème national et qui figurent sur notre drapeau."
 KAT_rare_minerals:0 "Exploiter les autres éléments"
 KAT_rare_minerals_desc:0 "La présence de cobalt, de molybdène et d’autres éléments pourrait nous aider, ou aider nos clients, à forger des alliages de niche. Même les résidus de certaines mines contiennent suffisamment de matériaux rares pour justifier l’extraction de ces éléments."
 KAT_exploit_the_yellowcake:0 "Exploiter le minerai d’uranium le plus riche"
 KAT_exploit_the_yellowcake_desc:0 "Le minerai d’uranium de la mine de Tchinkolobwe est le plus riche du monde entier."
 KAT_neutrality_party: "Convention Nationale Katangaise"
 KAT_neutrality_party_long: "Convention Nationale Katangaise"
 KAT_democratic_party: "CONAKAT"
 KAT_democratic_party_long: "Confédération des Associations Tribales du Katanga"