 KMT_kmt_remnants: "Vestiges du KMT"
 KMT_align_kmt_remnants_desc: "Les vestiges du KMT seront alignés, assurant leur collaboration avec notre régime à l’avenir."
 chinese_tributary_state: "Système tributaire chinois"
 KMT_prepare_for_the_civil_war_desc:0 "La nécessité de se préparer face aux communistes se fait sentir, car ils pourraient eux aussi se préparer contre nous."
