 sic_nra_DEF:0 "Le groupe d’armées occidental de l’Armée nationale révolutionnaire"
 sic_nra_ADJ:0 "ANR Ouest"
 CHI_join_the_republican_government:0 "Les Provinces unies de Chine"
 CHI_join_the_republican_government_desc:0 "Ayant obtenu la gouvernance nationale, nous allons désormais accomplir ce que nous avons toujours cherché à faire. Nous proclamerons les Provinces unies de Chine et renforcerons notre nouvelle Chine fédérale !"
 CHI_seek_japanese_support:0 "Rechercher le soutien japonais"
 CHI_seek_japanese_support_desc:0 "Alors que la dictature minable et les maoïstes dégénérés massacrent des enfants à travers toute la Chine, nous avons besoin d’un allié alternatif, et le seul qui reste est le Japon. Peut-être pourrons-nous ainsi déployer nos ailes."
 CHI_join_the_chinese_soviet:0 "Rejoindre [PRC.GetNameDef]"
 CHI_join_the_chinese_soviet_desc:0 "La révolution étant assurée au sein de notre clique, il est temps de rejoindre Mao. Ainsi, la République soviétique chinoise pourra véritablement redevenir grande !"
 CHI_cooperation_with_the_communists:0 "Se tourner vers le communisme"
 CHI_cooperation_with_the_communists_desc:0 "Le seigneur de guerre a adopté les voies du communisme et a commencé à mettre en œuvre les idéaux communistes au sein de sa clique !"
 CHI_opposition:0 "Opposition"
 CHI_opposition_desc:0 "Les chiangistes et les maoïstes sont tous deux des individus abominables ayant commis de graves atrocités contre le peuple chinois ! Nous nous déclarerons en opposition aux deux !"
 CHI_cooperation_with_the_nationalists:0 "Coalition avec le KMT"
 CHI_cooperation_with_the_nationalists_desc:0 "Le KMT contrôlant la majeure partie de la Chine, c’est lui que nous soutiendrons. Nous prendrons contact avec lui et proposerons de devenir une clique qui lui soit loyale, à condition qu’il nous permette de conserver notre influence régionale sous son gouvernement national."
 CHI_proclaim_rival_government:0 "Un gouvernement pour toute la Chine"
 CHI_proclaim_rival_government_desc:0 "C’est fait. Nous sommes enfin devenus un véritable gouvernement chinois !"
 KHM_the_left_kuomintang_national_revolution:0 "La Révolution nationale du Kuomintang de gauche"
 KHM_state_of_the_united_front:0 "État du Front uni"
 KHM_three_principles_of_the_nation:0 "Les Trois principes du peuple"
 CHI_warlords.44.t: "[FROM.GetNameDefCap] se retire du conflit"
 CHI_warlords.44.desc: "N’ayant aucune troupe dans la région pour maintenir le conflit, les armées de [FROM.GetNameDef] se sont tout simplement retirées de la guerre."
 CHI_warlords.44.a: "Un de moins, encore beaucoup à venir !"
 CHI_warlords.45.t: "Famine !"
 CHI_warlords.45.desc: "Notre deuxième récolte ayant été ratée, les prix du grain ont explosé. Beaucoup ont déjà commencé à mourir alors que la famine s’installe dans la province du Sichuan ! De plus, des bandits ont commencé à piller toute la clique, ciblant particulièrement les réserves de nourriture.\nIl ne nous reste plus qu’à lancer un appel à l’aide au gouvernement central !"
 CHI_warlords.45.a: "Shangdi nous a abandonnés !"
 CHI_warlords.46.t: "Famine au Sichuan !"
 CHI_warlords.46.desc: "Avec tout le chaos qui règne dans la province, le Sichuan est désormais frappé par une famine. Incapable d’y remédier, [SIC.GetLeader] a fait appel à l’aide de notre gouvernement ! Accepter stabiliserait grandement la province, mais à un certain coût ; refuser aliénerait la population. Que devons-nous faire ?"
 CHI_warlords.46.a: "Nous devons sauver ces vies chinoises !"
 CHI_warlords.46.b: "Ce n’est pas notre problème !"
 CHI_warlords.46.c: "Nous aiderons, mais à un prix…"
 CHI_warlords.47.t: "Le gouvernement central envoie de l’aide"
 CHI_warlords.47.desc: "Constatant la détresse de notre peuple, le gouvernement central a envoyé une aide massive à notre province, nous sauvant de l’effondrement total et de la mort !"
 CHI_warlords.47.a: "Zhonghua Minguo Wansui !"
 CHI_warlords.48.t: "La famine prend fin !"
 CHI_warlords.48.desc: "Après une récolte estivale réussie, la famine a pris fin, permettant à la clique de se stabiliser à nouveau !"
 CHI_warlords.48.a: "Des assiettes pleines ? Hourra !"
 CHI_warlords.49.t: "Le gouvernement central nous ignore !"
 CHI_warlords.49.desc: "Malgré la détresse évidente de notre peuple, le gouvernement central n’a envoyé aucune aide à notre province, tandis que la famine échappe totalement à tout contrôle…"
 CHI_warlords.49.a: "Nous sommes véritablement abandonnés de tous !"
 CHI_warlords.50.t: "La famine échappe à tout contrôle"
 CHI_warlords.50.desc: "Au lieu de s’améliorer, la famine a commencé à devenir de plus en plus incontrôlable. Une nouvelle récolte ratée a aggravé notre situation, tandis que les cadavres commencent à s’entasser !"
 CHI_warlords.50.a: "Nous sommes véritablement abandonnés de tous !"
 CHI_warlords.51.t: "La famine s’atténue"
 CHI_warlords.51.desc: "Il semble que le pire ait été surmonté : la famine est lentement en train d’être résolue, une récolte réussie a corrigé les plus grands problèmes et le banditisme a nettement diminué !"
 CHI_warlords.51.a: "Un rayon d’espoir ?"
 CHI_warlords.52.t: "La famine prend fin !"
 CHI_warlords.52.desc: "Après une récolte automnale réussie, la famine a pris fin, permettant à la clique de se stabiliser à nouveau !"
 CHI_warlords.52.a: "Des assiettes pleines ? Hourra !"
 CHI_warlords.53.t: "Le gouvernement central propose de l’aide, à un prix…"
 CHI_warlords.53.desc: "Le gouvernement central a décidé de nous aider face à la famine ; cependant, cela aura un coût : il exige que nous nous soumettions à son autorité en compensation."
 CHI_warlords.53.a: "Des assiettes pleines ? J’en suis !"
 CHI_warlords.53.b: "Cela n’en vaut pas la peine…"
 CHI_rising_grain_prices: "Hausse des prix du grain"
 CHI_famine: "Famine !"
 CHI_famine_intensifies: "Famine !"
 CHI_weak_famine_tt: "La famine au Sichuan sera beaucoup moins dévastatrice"
