 MAN_95_reached: "§G95%§! §RMAX. VALUE REACHED§!"
 CHI_government_crackdown_tt: "The Government will take this state back from the Islamic insurgents..."
 KMT_utilize_german_training_methods: "Form a German Trained Division"
 KMT_raise_baojia_troops_in_FROM: "Raise Baojia Troops in [FROM.GetName]"
 KMT_mobilize_the_industries: "Mobilize the Industries"
 KMT_mobilize_the_industries_desc: "If we are to be ready for war, we must have a proper war industry, let us make sure to achieve this and catch up to the industrial output of the japanese!"
 KMT_modernize_whampoa_academy: "Modernize Whampoa Academy"
 KMT_modernize_whampoa_academy_desc: "Whampoa has done a great many things for China, however it has been outdated at times, let us revise this and bring it up to par with all the western Schools!"
 KMT_reorganize_the_command_structures: "Reorganize the Command Structure"
 KMT_reorganize_the_command_structures_desc: "The NRA's command Structure is not set up ideally, as such we will work to reorganize it and ensure that our army is in top condition to deal with our enemies!"
 KMT_en_masse_conscription: "En Masse Conscription"
 KMT_en_masse_conscription_desc: "We must conscript a vast amount of men to help us win this war, our nation is in a dire position and must do anything we can to get ready for war!"
 KMT_centralize_military_direction: "Centralize Military Direction"
 KMT_centralize_military_direction_desc: "The the NRA is to be victorious, it must be centralized around one force, Chiang Kai Chek, and follow his vision and his direction when in battle, that way it will be victorious over the invaders."
 KMT_adress_the_nras_politicization: "Address the NRA's Politicization"
 KMT_adress_the_nras_politicization_desc: "If the NRA is to function properly, we must address the elephant in the room, the fact that it is being used in politics to reinforce [CHI.GetLeader]'s and the KMT's Rule, serving as a party army, rather than state army."
 KMT_hold_the_national_defense_conference: "Hold the National Defense Conference"
 KMT_hold_the_national_defense_conference_desc: "With the Japanese and the communist bandits hounding our forces and our Regime we must hold a grand conference to ensure their demise rather than ours. Let us work to bring about this grand goal!"
 KMT_mobilize_the_railways: "Mobilize the Railways"
 KMT_mobilize_the_railways_desc: "The railways shall not just serve the industry, instead the military needs them just as much in order to feed our armies, let us therefore work to mobilize the railways and use them for war!"
 KMT_armored_pincer_strikes: "Armored Pincer Strikes"
 KMT_armored_pincer_strikes_desc: "Any Modern Army needs the offensive brilliance of modern armored pincer strikes, we will therefore be forced to invest into tanks and make sure that we have the greatest of them all! This project will start with the 200th division and spread its way through the rest of the army!"
 KMT_the_grand_infantry_offensive: "The Chinese Way of War"
 KMT_the_grand_infantry_offensive_desc: "China has never won by having better or more modern troops than its enemies, instead the sheer numbers and sheer will of our troops, with their willingness to die for the country has won us our wars, as proven by the Suiyuan campaign. We will therefore delve deeper into this Chinese way, supporting grand infantry offensives!"
 KMT_utilize_meritocratic_incentives: "Utilize Meritocratic Incentives"
 KMT_utilize_meritocratic_incentives_desc: "If our troops are to be victorious on the battlefield, they must be incentivized to head into combat, let us use exactly these incentives to reward officers who lead our troops to victory!"
 KMT_modernize_the_army_new: "Modernize the Army"
 KMT_modernize_the_army_new_desc: "Without a modern Army, we will never be able to reunite China, let alone project our power. Therefore it is of utmost importance that we invest into reforming our army as fast as possible..."
 KMT_prepare_for_foreign_inasion: "Prepare for Foreign Invasion"
 KMT_prepare_for_foreign_inasion_desc: "China has always been threatened by foreign invaders, as such, we must prepare for a new invader striking us at any moment. Let us therefore prepare some stratagems to deal with this!"
 KMT_drive_them_back: "Drive them Back"
 KMT_drive_them_back_desc: "In the dire straights that we are in, we cannot simply wait to lure our enemies in and fight them then, instead we must focus on driving them back and removing them from our lands!"
 KMT_forge_a_modern_offensive_force: "Forge a Modern Offensive Force"
 KMT_forge_a_modern_offensive_force_desc: "If our Army is to do well on the battle, a coherent offensive force must be established, be it with infantry or tanks, it matters not, something must be done!"
 KMT_strengthen_the_logistical_department: "Establish the Combined Logistics Command"
 KMT_strengthen_the_logistical_department_desc: "Logistics are key to the survival of our nation and it's victory in future battlefields, let us therefore make sure to establish a command center for it, to ensure that our troops maintain permanently supplied!"
 KMT_found_the_roc_armed_forces: "[ROOT.GetNameDefCap] Armed Forces"
 KMT_found_the_roc_armed_forces_desc: "The NRA has long been a party army, controlled by the KMT rather than China as a whole. This must change and the first step towards depoliticization shall be taken, as the army is reformed!"
 KMT_major_operational_planning: "Strategize for Major Operations"
 KMT_major_operational_planning_desc: "We must begin gathering experience in the planning of Operations and Offensives, if we are to be victorious in the battlefield!"
 KMT_continue_the_nanjing_decades_progress: "Maintain the Nanjing Decade's Progress"
 KMT_continue_the_nanjing_decades_progress_desc: "The Nanjing Decade has brought about a vast amount of Progress for China in these last few years, let us delve deeper into this and harness this for our growth!"
 KMT_china_back_from_the_grave: "China back from the Grave"
 KMT_china_back_from_the_grave_desc: "Despite all the damage that war has done to us, our economy has truly recovered, it seems as though we may go through a second Nanjing Decade and resume our old economic progress!"
 KMT_utilize_the_national_resources_commission: "Utilize the National Resource Commission"
 KMT_utilize_the_national_resources_commission_desc: "The National Resource Commission is key to providing our industry and armed forces with the materiel they need. Let us utilize it to its fullest extent to help secure this."
 KMT_launch_the_three_year_plan: "Launch the Three Year Plan"
 KMT_launch_the_three_year_plan_desc: "We shall launch a three year plan to further invigorate our industry, modernizing quickly to outpace the Japanese and westerners!"
 KMT_resource_monopolies_on_strategic_minerals: "Secure Strategic Mineral Resource Monopolies"
 KMT_resource_monopolies_on_strategic_minerals_desc: "Any largescale Economy thrives off of its resources. As such we must make sure to expand our grasp over the rural wastes of the nation, securing the resources there and winning them for our industry. The National Resource Commission will help us greatly in this endeavor!"
 KMT_construct_largescale_chemical_complexes: "Construct Largescale Chemical Complexes"
 KMT_construct_largescale_chemical_complexes_desc: "If our Chemical industry is properly built up, it will act as a great force multiplier for our economy, boosting the effectiveness of our nation manyfold"
 KMT_reform_the_taxation_system: "Reform the Taxation System"
 KMT_reform_the_taxation_system_desc: "Our Taxation System is woefully outdated and in need of reform, let us implement this in order to keep it up to par with its growing financial demands!"
 KMT_some_uni_i_guess: "Form the National Political University"
 KMT_some_uni_i_guess_desc: "With illiteracy dealt with, we must work to improve our higher level academia. For this, we shall merge the Central Political Institute with the Central Youth Cadre School in order to greatly consolidate and centralize Chinese academia. As such we will have a model university for the Nation to follow!"
 KMT_a_naitonal_defense_state: "A Chinese National Defense State"
 KMT_a_naitonal_defense_state_desc: "With war further and further pushing us down, we now have no choice but to copy the Japanese and enter into a national defense state for the interest of our own nation. All must serve the nation and its survival and defense, cost it what it must!"
 KMT_enact_technical_training: "Enact Technical Training"
 KMT_enact_technical_training_desc: "Our experts need to be trained properly and must be ready to deal with all the different hazards of leading an economy properly. Let us work towards this at once!"
 KMT_construct_heavy_machinery: "Construct Heavy Machinery"
 KMT_construct_heavy_machinery_desc: "If the Chinese Economy is to thrive, we must invest into it, securing the necessary capacity to build it up and prosper deep into the future!"
 KMT_foster_modern_power_infrastructure: "Foster Modern Power Infrastructure"
 KMT_foster_modern_power_infrastructure_desc: "Modern Power Infrastructure is key to any long term industrialization. Let us invest in and build this."
 KMT_prepare_inflation_weaponry: "Prepare Inflation Weaponry"
 KMT_prepare_inflation_weaponry_desc: "With the economy suffering greatly from inflation, it is time to deal with this vice. We must prepare weapons to destroy and eradicate this from our nation!"
 KMT_expand_efforts_to_deal_with_national_devastation: "Fight Economic Devastation"
 KMT_expand_efforts_to_deal_with_national_devastation_desc: "After Our Economy has been devastated by the foreign invasion, we must invest money into it to undo what has been done to us!"
 KMT_secure_foreign_investment: "Secure Foreign Investment"
 KMT_secure_foreign_investment_desc: "Foreing investment is the key to industrial growth, therefore let us set out to get exactly this."
 KMT_build_up_the_rear_area: "Build Up the Rear Area"
 KMT_build_up_the_rear_area_desc: "If we are to hold out against the foreign invaders, we must build up our heartland, the rear area. Let us make it a bastion of military production to keep our army well supplied and ready to resist the enemy!"
 KMT_finalize_war_preparations: "Finalize Preparations for War"
 KMT_finalize_war_preparations_desc: "Many a foreign power is on our doorstep, as such we must be ready. We will further invest into the military sector of our economy and seek to entrench it as fast as possible."
 KMT_deal_with_rural_illiteracy: "Deal with Rural Illiteracy"
 KMT_deal_with_rural_illiteracy_desc: "Rural illiteracy is a massive issue plaguing the nation. As such we must dedicate vast amounts of time and effort to combat it."
 KMT_expand_military_aid: "Expand Foreign Military Aid"
 KMT_expand_military_aid_desc: "While we have some international funding, we need to give this funding to the military as well. Let us purchase the necessary weapons from our investors."
 KMT_a_foreign_funded_defense_indstry: "A Foreign Funded Defense Indstry"
 KMT_a_foreign_funded_defense_indstry_desc: "If we are to survive, we must face the facts. China currently is unable to properly defend against our enemies. As such we must rely more and more on foreign funding for our industries, allowing us to remain resilient despite economic collapse."
 KMT_reintroduce_income_tax: "Reintroduce Income Tax"
 KMT_reintroduce_income_tax_desc: "Income tax, though unpopular is the key to a long term survivable economy. This, while bureaucratically challenging and unpopular is what brought the western economies forward and it will do the same for us."
 KMT_nationalize_the_grain_tax: "Nationalize the Grain Tax"
 KMT_nationalize_the_grain_tax_des: "The grain tax has been a key to building up many a Chinese dynasty. While it now goes to the provinces, we must change that to be able to adequately fund our military and economy. If we are to do this, however, we must decide how we shall do it. While we could force the provinces to fully hand it over to us, that would lead to a massive conflict with them, potentially causing more damage than it is worth. Instead, we could make a compromise with them, where they only hand us a portion of it instead, making both ends meet."
 KMT_expand_military_schooling: "Expand Military Schooling"
 KMT_expand_military_schooling_desc: "Military schooling is the key to getting our military up to par with the west. We must make full use of this in order to catch up as fast as possible."
 KMT_launch_a_major_fortification_programme: "Launch a Major Fortification Programme"
 KMT_launch_a_major_fortification_programme_desc: "If we are to be able to properly defend China, we must launch a major fortification programme, giving us the ability to hold off our enemies and defend the nation."
