 KMT_HARPO_cat: "Coopération militaro-industrielle sino-allemande"
 KMT_HARPO_cat_desc: "Le Handelsgesellschaft für Industrielle Produkte (§YHAPRO§!) est notre moyen d'accéder au marché allemand des armes et d'acquérir leurs armes pour notre cause. \n\nCette société est spécialement conçue pour notre commerce d'armes et pour contourner les réglementations internationales sur les armes allemandes.\n\n L'influence actuelle de l'§YHAPRO§! en Chine est : §Y[?KMT_harpo_inf]§!\n\n§tSi§! l'§YHAPRO§! §ta trop d'influence lors de sa dissolution, cela aura de graves conséquences pour l'économie chinoise...§!\n\nEn outre, le fait de ne contrôler aucun État côtier obligera à cesser la collaboration avec les Allemands et à dissoudre l'§YHAPRO§!."
