 KMT_party_of_teachers: "Parti des Enseignants"
 KMT_landlords_rising: "Influence Croissante des Propriétaires Terriens et Hommes d’Affaires"
 KMT_landlords_solidifying: "Influence des Propriétaires Terriens et Hommes d’Affaires qui se Solidifie"
