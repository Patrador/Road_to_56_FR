 CHI_puppet_warning_tt:0 "§RNote that the National Regeneration League, the Kuomintang and the Federalists are National movements, so having them gain power in your country could result in you gaining subjects or becoming one depending on who first forms a national government.§!"
 CHI_coalition_tt:0 "§RNote that this alliance is very sturdy, so long as China is still threatened by Japan, Manchuria, or any other foreign power, however should China be at peace and in a situation where enforced national unity is no longer necessary, it may collapse. Should this occur through the wrong means, up to a quarter of China may follow them.§! §GHowever should the fascists prove to be incompetent and begin losing our war for national salvation, we may be able to directly seize them and integrate them into the KMT without any resistance and thus fully annex them.§!"
 CHI_coalition_collapse_tt:0 "§RThe Country will work toward collapsing the coalition with the KMT, in the process attempting to get parts of the KMT's Troops and garrisons to defect to you to advance your position. This will force you to rekindle the Chinese Civil War.§!"
