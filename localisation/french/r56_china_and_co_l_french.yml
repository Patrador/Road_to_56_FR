 KMT_event.1.t: "L'orientation de l'ANR"
 KMT_event.1.desc: "Notre objectif n'a jamais été de contrôler uniquement ces petites terres. Nous sommes des nationalistes et, en tant que tels, nous cherchons à unir toute la Chine ! Cela nous amène à une question importante. Devons-nous nous concentrer sur les problèmes internes pour traiter d'abord avec les communistes et les seigneurs de la guerre, ou devons-nous nous préparer à faire face à la menace japonaise ?"
 KMT_event.1.a: "Nous devons nous concentrer sur le véritable ennemi, les communistes !"
 KMT_event.1.b: "Nous devons nous concentrer sur l'élimination de l'influence japonaise en Chine !"
 KMT_event.2.t: "La guerre civile du KMT"
 KMT_event.2.desc: "Au sein du Congrès national chinois, les Chiangistes et les politiciens pro-démocrates sont en profond désaccord. De ce fait, deux camps se sont formés et une guerre civile a éclaté entre eux. Cela nous amène à la question suivante. Qui reconnaissons-nous comme notre souverain légitime ?"
 KMT_event.2.a: "Nous ne reconnaissons personne et profitons de l'occasion pour nous échapper !"
 KMT_event.2.b: "Nous devons soutenir le généralissime"
 KMT_event.2.c: "La démocratie doit sauver la Chine !"
 KMT_event.2.d: "Nous nous contenterons de nous asseoir sur cette question et de nous ranger du côté des vainqueurs."
 KMT_event.3.t: "The New Fourth Army Incident"
 KMT_event.3.desc: "While we were fighting the Japanese together, our units have been bamboozled and stabbed in the back by an NRA ambush, despite us allegedly being allies. This has caused massive losses amongst our troops, leaving us incapable to fully prevent their current purge of Communists in the lands under the Central Government! After all, some of our best men have died and units lost. What are we to do in this dire situation?"
 KMT_event.3.a: "Nous dénonçons le gouvernement nationaliste et nous coupons les ponts !"
 KMT_event.3.b: "Nous ne sommes pas en mesure de nous battre sans l'ANR à nos côtés."
 KMT_event.4.t: "Finalisation du projet de constitution"
 KMT_event.4.desc: "Le projet de constitution étant terminé, nous avons maintenant deux constitutions complètes devant nous. Nous devons choisir entre celle soutenue par les Chiangistes et celle soutenue par les Démocrates. Quelle constitution sera approuvée ?"
 KMT_event.4.a: "Nous soutiendrons Chiang."
 KMT_event.4.b: "Nous ne pouvons pas faire de choix. Abandonnez le projet !"
 KMT_event.4.c: "Nous soutiendrons les démocrates"
 KMT_event.5.t: "Le congrès national du KMT"
 KMT_event.5.desc: "Alors que le Congrès national et le destin de la nation sont sur le point d'être décidés, il est temps de choisir un camp."
 KMT_event.5.a:0 "Nous soutiendrons les Chiangistes"
 KMT_event.5.b:0 "Nous soutiendrons la bureaucratie du parti"
 KMT_event.6.t: "Exigences de Chiang"
 KMT_event.6.desc: "Au Congrès national, Chiang prend la parole en premier, pour le bien de toute la Chine. Selon lui, que doit faire le pays à présent ?"
 KMT_event.6.a:0 "Chiang exige le transfert total du pouvoir..."
 KMT_event.6.b:0 "Chiang ne formule aucune exigence, pour l'instant..."
 KMT_event.7.t: "Le parti cède"
 KMT_event.7.desc: "Le Parti a accepté les exigences de Chiang ! Il est désormais le seul détenteur du pouvoir en Chine ! Gloire à la révolution nationale de Chiang !"
 KMT_event.7.a:0 "Glorieux !"
 KMT_event.8.t: "La trahison du parti"
 KMT_event.8.desc: "Le Parti nous a trahis ! Il a résisté à Tchang qui, malgré lui, s'est proclamé dictateur de toute la Chine ! Cela a provoqué la révolte du Parti contre nous !"
 KMT_event.8.a:0 "Que les dieux nous aident !"
 KMT_event.9.t: "Les exigences du parti"
 KMT_event.9.desc: "Le Parti est entré en scène contre Chiang et a décidé d'exposer ses projets pour la Chine. Quels sont ces projets ?"
 KMT_event.9.a:0 "Le parti exige des élections libres"
 KMT_event.9.b:0 "Le parti n'a pas d'exigences, pour l'instant..."
 KMT_event.10.t: "Chiang se soumet"
 KMT_event.10.desc: "Chiang a décidé de se retirer et d'accepter des élections libres. Une nouvelle aube se lève sur la Chine !"
 KMT_event.10.a:0 "Glorieux !"
 KMT_event.11.t: "Révoltes de Chiang"
 KMT_event.11.desc: "Chiang a décidé qu'il devait prendre le pouvoir national, après l'avoir exigé, nous l'en avons empêché, mais il en a profité pour se révolter et nous combattre."
 KMT_event.11.a:0 "Que les dieux nous aident !"
 KMT_event.12.t: "Les résultats des élections"
 KMT_event.12.desc: "Nous avons annoncé les résultats des élections et après une course serrée, il est clair qu'un groupe de politiciens est arrivé en tête."
 KMT_event.12.a:0 "Le KMT a de nouveau gagné, sans surprise."
 KMT_event.12.b:0 "Carsun et son idéalisme ont gagné"
 KMT_event.12.c:0 "Les conservateurs du YCP l'ont emporté"
 KMT_event.13.t: "Le gouvernement chinois s'attaque à la Mongolie"
 KMT_event.13.desc: "Le gouvernement chinois cherche à déclarer la Mongolie d'un jour à l'autre ! Que faire face à ce front asiatique massif ?"
 KMT_event.13.a:0 "Les Chinois doivent mourir."
 KMT_event.13.b:0 "Nous accepterons d’abandonner la Mongolie pour la paix."
 KMT_event.14.t: "La Chine exige la libération de l’Indochine"
 KMT_event.14.desc: "Après des années de critiques contre l’impérialisme en Asie, les Chinois sont finalement venus nous demander l’abolition de l’oppression des peuples d’Indochine. Que faisons-nous de cela ?"
 KMT_event.14.a: "Nous devons nous battre pour nos colonies !"
 KMT_event.14.b: "Cela ne vaut pas la peine de mener une guerre terrestre en Asie."
 KMT_event.15.t: "La Chine exige la libération de la Corée"
 KMT_event.15.desc: "Après des années de critiques contre notre impérialisme, les Chinois nous ont finalement envoyé un ultimatum pour nous retirer de Corée. Que faisons-nous de cela ?"
 KMT_event.15.a:0 "Nous garderons nos terres durement acquises"
 KMT_event.15.b:0 "Nous devons leur accorder la liberté"
 KMT_event.16.t: "La Chine nationalise nos actifs"
 KMT_event.16.desc: "Le KMT a nationalisé un grand nombre de nos actifs dans toute la Chine. Que faisons-nous à ce sujet ?"
 KMT_event.16.a:0 "C’est un fait accompli, nous ne pouvons rien y faire."
 KMT_event.16.b:0 "Nous les frapperons avec un lourd embargo."
 KMT_event.17.t: "[PRC.GetNameDefCap] quitte le Front uni"
 KMT_event.17.desc: "À la lumière de notre exécution de nombreux communistes, y compris un bon nombre des forces de [PRC.GetNameDef], [PRC.GetNameDef] a abandonné le Front uni et nous a dénoncés, nous qualifiant de traîtres et de bouchers."
 KMT_event.17.a:0 "Ce sont eux les traîtres à la nation !"
 KMT_event.18.t: "Wang Jingwei's Olive Branch"
 KMT_event.18.desc: "Wang Jingwei has made us an offer. He has made us an offer by which we will meet in Taiwan to discuss terms of an economic pact and deal for us."
 KMT_event.18.a: "Un certain rapprochement est peut-être possible"
 KMT_event.18.b: "Nous ne pourrions jamais faire une telle chose"
 KMT_event.19.t: "Les Accords de Taïwan"
 KMT_event.19.desc: "La Chine a finalement tenu sa promesse de conclure un accord avec nous. Ils proposent un traité de recherche par lequel ils nous donneront une part de leur économie en échange d’une aide à leur développement. Ils proposent également d’augmenter cette part par l’expansion du traité plus tard."
 KMT_event.19.a: "De l'argent gratuit ? Pourquoi, bien sûr"
 KMT_event.19.b: "Une Chine moderne ? Ce serait notre fin."
 KMT_event.20.t: "La Chine cherche à inviter des investisseurs japonais"
 KMT_event.20.desc: "La Chine a proposé de renouveler notre traité et d’inviter nos investisseurs. Cela nous apporterait de grands profits mais renforcerait leur économie à long terme."
 KMT_event.20.a: "De l'argent gratuit ? Pourquoi, bien sûr"
 KMT_event.20.b: "Nous ne cherchons pas à les aider de cette façon"
 KMT_event.21.t: "La Chine propose un programme d’échange de scientifiques"
 KMT_event.21.desc: "La Chine a proposé de renouveler notre traité et de lancer un programme d’échange de scientifiques. Ils ont proposé de payer pour rendre cela intéressant."
 KMT_event.21.a: "De l'argent gratuit ? Pourquoi, bien sûr"
 KMT_event.21.b: "Nous ne cherchons pas à les aider de cette façon"
 KMT_event.22.t: "La Chine cherche à acheter notre production"
 KMT_event.22.desc: "La Chine a proposé de renouveler notre traité et d’acheter de grandes quantités de notre production. Cela nous apporterait de grands profits mais leur permettrait de copier notre technologie."
 KMT_event.22.a: "De l'argent gratuit ? Pourquoi, bien sûr"
 KMT_event.22.b: "Nous ne cherchons pas à les aider de cette façon"
 KMT_event.23.t: "La Chine cherche à acquérir notre recherche"
 KMT_event.23.desc: "La Chine a proposé de renouveler notre traité et de nous donner un accord sur les ressources avantageux. Cela aiderait à résoudre le problème des ressources mais aiderait grandement leur technologie."
 KMT_event.23.a: "Des ressources bon marché ? Bien sûr que oui"
 KMT_event.23.b: "Nous ne cherchons pas à les aider de cette façon"
 KMT_event.24.t: "La Chine cherche à acquérir notre expertise"
 KMT_event.24.desc: "La Chine a proposé de renouveler notre traité et de nous offrir des ouvriers, qui leur fourniront probablement une partie de nos informations technologiques mais seraient de la main-d’œuvre gratuite pour les usines."
 KMT_event.24.a: "Des travailleurs gratuits ? Bien sûr que oui"
 KMT_event.24.b: "Nous ne cherchons pas à les aider de cette façon"
 KMT_event.25.t: "La Chine exige des terres"
 KMT_event.25.desc: "La Chine a exigé que nous nous retirions de chaque parcelle de terre que nous possédons et qui leur appartient. En échange nous gagnerons des droits d’accostage pour assurer notre avantage naval. Ou alors ils nous attaqueront avec leur avance technologique. Que faisons-nous ?"
 KMT_event.25.a: "Nous cédons"
 KMT_event.25.b: "Notre esprit nous mènera à la victoire"
 KMT_event.26.t: "La Chine exige des terres pour des bases navales"
 KMT_event.26.desc: "La Chine a exigé que nous nous retirions de chaque parcelle de terre que nous possédons et qui leur appartient. Ou alors ils nous attaqueront avec leur avance technologique. Que faisons-nous ?"
 KMT_event.26.a: "Nous cédons"
 KMT_event.26.b: "Notre esprit nous mènera à la victoire"
 KMT_event.27.t: "La Chine exige carte blanche en Mandchourie"
 KMT_event.27.desc: "La Chine a exigé une carte blanche en Mandchourie pour prendre le contrôle de la région sans notre intervention. Que faisons-nous ?"
 KMT_event.27.a: "Nous cédons"
 KMT_event.27.b: "Nous tenons bon"
 KMT_event.28.t: "La Chine exige carte blanche en Mandchourie pour maintenir notre influence économique"
 KMT_event.28.desc: "La Chine a exigé une carte blanche en Mandchourie pour prendre le contrôle de la région sans notre intervention. Que faisons-nous ?"
 KMT_event.28.a: "Nous cédons, après tout ils nous paient pour cela"
 KMT_event.28.b: "Nous tenons bon"
 KMT_event.29.t: "Le Japon nous vend"
 KMT_event.29.desc: "La Chine a conclu un accord avec le Japon pour nous leur remettre. Que faisons-nous à propos de cela ?"
 KMT_event.29.a: "Nous cédons, après tout, le souhait du Japon est notre commandement"
 KMT_event.29.b: "Nous devons survivre"
 KMT_event.30.t: "Un assassin frappe Wang"
 KMT_event.30.desc: "Estimant que Jingwei trahissait le peuple chinois en se rapprochant du Japon, un assassin a attaqué Wang Jingwei et a tenté de le tuer."
 KMT_event.30.a: "Heureusement, il a raté"
 KMT_event.30.b: "Il semble que le chef du Kuomintang soit mort. Encore une fois."
 KMT_event.35.t: "Jingwei s'est suicidé"
 KMT_event.35.desc: "With Japan rejecting our offer to meet and being openly hostile to us, Wang Jingwei has killed himself, believing the future of China to be hopeless and himself being the first to be executed by the Japanese."
 KMT_event.35.a: "Pourtant, dans la tragédie, un nouvel espoir surgit"
 KMT_event.39.t: "[CHI.GetNameDef] exige l’hégémonie sur l’Indochine"
 KMT_event.39.desc: "Aujourd’hui [CHI.GetNameDef] nous a annoncé qu’ils exigent que nous leur transférions notre colonie en Indochine pour leur propre empire. Bien que nous ne soyons pas en position de les en empêcher, c’est une insulte envers nous. Que devons-nous faire ?"
 KMT_event.39.a: "Nous n’avons vraiment pas le choix ici"
 KMT_event.39.b: "Nous combattrons avec honneur"
 KMT_event.40.t: "Le gouvernement chinois attaque la Touva"
 KMT_event.40.desc: "Le gouvernement chinois cherche à déclarer la guerre à la Touva d’un jour à l’autre ! Que faisons-nous à propos de ce gigantesque front asiatique ?"
 KMT_event.40.a:0 "Les Chinois doivent mourir."
 KMT_event.40.b:0 "Nous accepterons d’abandonner la Touva pour la paix."
 KMT_event.41.t: "L’Empire chinois exige l’annulation des annexions de l’Amour"
 KMT_event.41.desc: "Le gouvernement chinois a déclaré que notre annexion des régions de l’Amour était contraire au droit international et que ces terres sont chinoises. Nous avons cependant installé beaucoup de gens là-bas, qui y vivent maintenant leur propre vie russe. Que faisons-nous à propos de cet ultimatum ?"
 KMT_event.41.a:0 "Vladivostok est russe"
 KMT_event.41.b:0 "Nous n’avons vraiment aucun moyen de mener une guerre terrestre en Asie"
 KMT_event.42.t: "Les Chinois exigent une gouvernance conjointe de l’Indochine"
 KMT_event.42.desc: "Le gouvernement chinois a déclaré que l’Indochine est dans leur sphère d’influence et qu’ils ont droit à une part de ses profits pour ne pas l’attaquer. Cette proposition semble plutôt raisonnable, étant donné que c’est une terre lointaine."
 KMT_event.42.a:0 "Nous rejetons néanmoins"
 KMT_event.42.b:0 "Pourquoi n’accepterions-nous pas une si bonne affaire ?"
 KMT_event.43.t:0 "Blueshirts Rise Up in Beiping"
 KMT_event.43.desc:0 "The Blueshirts, after falling out with us, after our attempts to disband them, have never truly disappeared... Today they have moved in on Beiping and taken control of the City. It has fallen. The Blueshirts seem to be back and more powerful than ever."
 KMT_event.43.a: "Cela n'augure rien de bon..."
 KMT_event.44.t: "La déclaration et le coup d'État de Pékin"
 KMT_event.44.desc: "À Pékin, Dai Li a fait une proclamation, qualifiant Chiang d'imbécile et se déclarant le nouveau seigneur de la Chine. Simultanément, il a déclaré Beijing nouvelle capitale de la Chine et s'est emparé de la plus grande partie possible de l'appareil d'État. Enfin, ses troupes marchent maintenant sur Nanjing, pour s'emparer complètement de la Chine."
 KMT_event.44.a:0 "Lors de ce coup d'État, les troupes chiangistes ont fait défection et Chiang a été capturé."
 KMT_event.44.b:0 "Les Chiangistes restent forts, résistant à cette trahison."
 KMT_event.45.t: "[FROM.GetNameDefCap] déclare son indépendance"
 KMT_event.45.desc: "Après avoir fui vers nos îles, le KMT a décidé d’abandonner le concept de Chine et a maintenant commis un nouvel acte de trahison en déclarant l’indépendance. Que ferons-nous de cela ?"
 KMT_event.45.a:0 "Il vaut mieux laisser ces gens inutiles et ces traîtres suivre leur propre voie."
 KMT_event.45.b:0 "Nous mettrons fin à leur existence répugnante"
 KMT_event.46.t: "[FROM.GetNameDefCap] demande une aide économique"
 KMT_event.46.desc: "Après leur exil sur les îles, le KMT a commencé à demander une aide étrangère pour leur industrie faible et incompétente. Que ferons-nous de cela ?"
 KMT_event.46.a: "Envoyer un conseiller pour aider un allié serait approprié"
 KMT_event.46.b:0 "Nous ne nous mêlerons pas de cette affaire"
 KMT_event.47.t: "Le premier congrès national à l’étranger"
 KMT_event.47.desc: "Bien que le KMT soit tombé bien bas, nous tenons encore un congrès et planifions l’avenir de notre nouveau royaume. Un jour, nous reviendrons. Il est inévitable que Chiang nous mène à la victoire et à la reconquête de la patrie."
 KMT_event.47.a:0 "À travers le désespoir, l’espoir renaît !"
 KMT_event.48.t: "Chiang s'adresse à la nation"
 KMT_event.48.desc: "Alors que Chiang commence à parler, un coup de feu part de la foule, l'un des communistes survivants tourne son arme vers lui, crie \"Vive le PCC\" et se tue, dans un suicide meurtrier. Après cet incident, le KMT se ressaisit et le fils de Chiang devient le nouveau président du KMT..."
 KMT_event.48.a:0 "Le président est mort, vive le nouveau président !"
 KMT_event.49.t: "Li Zongren rejoint le KMT à Nanjing"
 KMT_event.49.desc: "Voyant une chance d'être élu à la place de Chiang, Li Zongren est retourné à Nanjing pour prendre le contrôle de la nation et évincer définitivement Chiang."
 KMT_event.49.a:0 "Un nouveau despote ou une lueur d'espoir ?"
 KMT_event.50.t: "Une chance pour la présidence"
 KMT_event.50.desc: "Les élections ont lieu en Chine et Li Zongren voit une chance de les gagner. Pourtant, avant de se lancer, il a consulté sa femme, lui demandant s’il devait y aller ou non."
 KMT_event.50.a:0 "Pourquoi pas ? Cela écartera enfin Chiang !"
 KMT_event.50.b:0 "La famille a déjà trop souffert des mains de Chiang."
 KMT_event.51.t: "Les centristes du KMT nomment un candidat"
 KMT_event.51.desc: "Dans la lutte pour nommer un candidat unifié du KMT, les centristes du KMT ont présenté aujourd’hui leur candidat."
 KMT_event.51.a:0 "Gagnons la candidature !"
 KMT_event.52.t: "Les gauchistes du KMT nomment un candidat"
 KMT_event.52.desc: "Dans la lutte pour nommer un candidat unifié du KMT, les gauchistes du KMT ont présenté aujourd’hui leur candidat."
 KMT_event.52.a:0 "Gagnons la candidature !"
 KMT_event.52.b: "Mais alors qu’ils le faisaient, ils furent dissous par l’armée et leur candidat placé en résidence surveillée..."
 KMT_event.53.t: "La fin de la lutte pour le pouvoir"
 KMT_event.53.desc: "Dans la lutte pour nommer un candidat unifié du KMT, le KMT a finalement terminé ses réunions et discussions, nommant un excellent candidat pour mener la nation vers l’avenir !"
 KMT_event.53.a: "Il est temps de détruire la faible opposition !"
 KMT_event.54.t: "Les gauchistes abandonnent le KMT"
 KMT_event.54.desc: "Après que l’issue de la lutte interne pour le pouvoir au sein du KMT ait été un tel désastre pour eux, les gauchistes du KMT nous ont abandonnés, se tournant vers le CDSP à la recherche d’égalité économique."
 KMT_event.54.a:0 "Traîtres !"
 KMT_event.55.t: "Les centristes abandonnent le KMT"
 KMT_event.55.desc: "Après que l’issue de la lutte interne pour le pouvoir au sein du KMT ait été un tel désastre pour eux, le parti se tournant vers la gauche, les centristes du KMT nous ont abandonnés, se tournant vers le YCP à la recherche d’une Chine unie et forte."
 KMT_event.55.a:0 "Traîtres !"
 KMT_event.56.t: "Chiang lui-même abandonne le KMT"
 KMT_event.56.desc: "Après que l’issue de la lutte interne pour le pouvoir au sein du KMT ait été un tel désastre pour eux, avec le parti se tournant vers la gauche, Chiang Kai-Shek nous a abandonnés, renonçant à la politique et dénonçant le parti qui fut autrefois le sien."
 KMT_event.56.a:0 "Traître !"
 KMT_event.60.t: "La Chine demande l’indépendance"
 KMT_event.60.desc: "S’étant reconstruits en un grand phare, les Chinois ont de nouveau demandé l’indépendance tout en respectant notre influence économique. Que disons-nous d’une telle idée ?"
 KMT_event.60.a:0 "Cela nous aidera à nous réconcilier"
 KMT_event.60.b: "Nous leur accorderons… une indépendance nominale"
 KMT_event.60.c: "Il n’en est pas question"
 KMT_event.61.t: "La Chine propose la paix"
 KMT_event.61.desc: "Nous avons apparemment perdu la guerre contre les Chinois. Ils ne se sont pas seulement libérés de notre domination, mais nous ont aussi repoussés hors de leurs terres et exigent maintenant que nous retirions nos forces de leur territoire."
 KMT_event.61.a: "C’est ainsi… Hélas, nous avons perdu."
 KMT_event.61.b: "Néanmoins, nous nous battrons jusqu’au dernier homme."
 KMT_event.62.t: "Allégations de corruption au sein du KMT"
 KMT_event.62.desc: "Durant notre lutte pour le pouvoir et avec l’approche des élections, des allégations de corruption visant le KMT, notre parti au pouvoir, ont émergé. Beaucoup demandent maintenant la création d’un comité d’enquête officiel. Cependant, cela doit d’abord être approuvé par le KMT lui-même…"
 KMT_event.62.a: "Étonnamment, le KMT l’autorise…"
 KMT_event.62.b: "Comme prévu, cela a été bloqué."
 KMT_event.63.t: "Le comité d’enquête"
 KMT_event.63.desc: "Avec le comité établi, il se prépare maintenant à enquêter sur les allégations de corruption, cependant certaines personnes cherchent à soudoyer et influencer le comité afin de l’utiliser pour leur propre bénéfice politique."
 KMT_event.63.a: "Malgré tout cela, le comité reste neutre"
 KMT_event.63.b: "Le comité accepte de prêter une “attention particulière” aux activités de Chiang"
 KMT_event.63.c: "Le comité accepte de surveiller ce qui pourrait se passer dans la bureaucratie du parti"
 KMT_event.63.d: "Le comité accepte d’examiner les activités gauchistes suspectes"
 KMT_event.64.t: "Verdict du comité : un KMT coupable"
 KMT_event.64.desc: "Après une longue enquête, le comité est parvenu à la conclusion que le KMT dans son ensemble est coupable de corruption massive. Bien que le KMT puisse toujours se présenter aux élections, cela va sûrement redistribuer les cartes, réduire sa popularité et nuire à sa réputation."
 KMT_event.64.a: "Peut-être n’aurions-nous jamais dû autoriser cette enquête…"
 KMT_event.65.t: "Verdict du comité : un Chiang coupable"
 KMT_event.65.desc: "Après une longue enquête et peut-être un peu d’“aide extérieure”, le comité est parvenu à la conclusion que Chiang seul est coupable de corruption et que le KMT dans son ensemble est innocent. Chiang est furieux face à ce grand revers et à cette atteinte à son influence."
 KMT_event.65.a: "Parfait, tout se déroule comme prévu"
 KMT_event.66.t: "Verdict du comité : une bureaucratie coupable"
 KMT_event.66.desc: "Après une longue enquête et peut-être un peu “d’aide” venant des poches de Chiang, le comité est parvenu à la conclusion que les bureaucrates du parti et des gens comme Lin Sen seuls sont coupables de corruption, et que le KMT dans son ensemble est innocent. Ceux-ci, bien sûr, fulminent face à ce grand revers et à cette atteinte à leur influence."
 KMT_event.66.a: "Parfait, tout se déroule comme prévu"
 KMT_event.67.t: "Verdict du comité : une gauche coupable"
 KMT_event.67.desc: "Après une longue enquête et peut-être un peu “d’aide” venant des poches de Chiang, le comité est parvenu à la conclusion que les gauchistes du parti et des gens comme Soong Qing Ling seuls sont coupables de corruption, et que le KMT dans son ensemble est innocent. Ceux-ci, bien sûr, fulminent face à ce grand revers et à cette atteinte à leur influence."
 KMT_event.67.a: "Parfait, tout se déroule comme prévu"
 KMT_event.67.b: "La parfaite excuse pour les interdire encore une fois !"
 KMT_event.70.t: "Le Kuomintang nous contacte"
 KMT_event.70.desc: "Avec leur nouveau gouvernement plus à gauche au pouvoir, le KMT nous a contactés, cherchant à obtenir notre soutien pour leur gouvernement ainsi que notre amitié et notre guidance."
 KMT_event.70.a: "Bien sûr que nous aiderons un ami."
 KMT_event.70.b: "Nous ne gaspillerons pas nos précieuses ressources."
 KMT_event.71.t: "Le Kuomintang demande une mission militaire"
 KMT_event.71.desc: "Puisque nous aidons leur gouvernement, le KMT a maintenant demandé une mission militaire également, afin d’aider à guider leur armée dépassée et à planifier ses offensives de manière moderne."
 KMT_event.71.a: "Un grand atout contre le fascisme en Asie, envoyons les hommes !"
 KMT_event.71.b: "Nous ne gaspillerons pas nos précieuses ressources."
 KMT_event.72.t: "Le Kuomintang propose une alliance militaire complète"
 KMT_event.72.desc: "Puisque nous avons aidé leur gouvernement et leur armée, le KMT a déclaré qu’il est évident que leur avenir réside dans une alliance avec nous. Ils ont en outre souligné que cela augmenterait l’efficacité de notre coopération militaire et créerait un bloc eurasiatique solide."
 KMT_event.72.a: "Nous les accueillons à bras ouverts !"
 KMT_event.72.b: "Ils ne sont qu’un fardeau."
 KMT_event.73.t: "La lutte pour le pouvoir progresse"
 KMT_event.73.desc: "Au fur et à mesure que la lutte pour le pouvoir progresse, les candidats prononcent de grands discours devant le parti, tentant de consolider leur leadership sur celui-ci."
 KMT_event.73.a: "Les résultats ont été… intéressants"
 KMT_event.74.t: "Le crépuscule de la tutelle"
 KMT_event.74.desc: "Il est temps, les dernières étapes vers les élections ont commencé alors que différents groupes en Chine cherchent à prendre le pouvoir.\nDans le §2KMT§!, diverses factions et cliques ont utilisé l’érosion du pouvoir de Chiang à leur avantage et ont provoqué une lutte interne pour le pouvoir, qui n’est plus dominée uniquement par les Chiangistes. Cette lutte déterminera le chef du §2KMT§! après les élections.\nPendant ce temps, si l’occasion et le statut légal leur sont donnés, le §8YCP§! et le §OCDSP§! cherchent eux aussi à surpasser le §2KMT§! et à devenir la nouvelle force politique dominante en Chine…\nEnfin, l’armée reste en retrait et, si elle estime que les choses se passent mal et qu’il existe une fraude à grande échelle avec un gouvernement refusant d’annoncer les résultats une fois le vote terminé, il y a une chance qu’un coup d’État ait lieu…\n\nIl semble que seul le temps dira qui sera la force dominante en Chine."
 KMT_event.74.a: "Portons un toast à cette nouvelle ère !"
 KMT_event.75.t: "Le sort des résultats électoraux"
 KMT_event.75.desc: "Bien que des élections aient eu lieu, certaines personnes sont mécontentes des résultats et tentent d’empêcher leur annonce afin de conserver le peu de pouvoir qui leur reste."
 KMT_event.75.a: "Néanmoins, le peuple doit connaître la vérité."
 KMT_event.75.b: "Du moins pour l’instant, ils ont réussi."
 KMT_event.76.t: "La Chine demande un accord de troc"
 KMT_event.76.desc: "La Handelsgesellschaft für Industrielle Produkte (GSPP) opère en Chine et lui vend nos armes afin de contourner le droit international relatif au commerce des armes. La Chine a maintenant pris contact avec nous et propose un échange de ressources contre des armes, dans le cadre d'accords qui seront précisés une fois ce traité signé."
 KMT_event.76.a: "Les affaires ? Oui, volontiers !"
 KMT_event.76.b: "Il n’est pas nécessaire d’attiser l’hostilité de la communauté internationale"
 KMT_event.77.t: "La Chine cherche à acheter des plans militaires"
 KMT_event.77.desc: "Pour moderniser leur armée dépassée, les Chinois ont proposé d’augmenter notre influence dans leur économie en échange de certains plans militaires, leur permettant d’entrer dans l’ère moderne en tant que grande puissance."
 KMT_event.77.a: "Une affaire formidable !"
 KMT_event.77.b: "Les plans allemands sont pour les Allemands seulement !"
 KMT_event.78.t: "La Chine cherche à ouvrir un échange militaire"
 KMT_event.78.desc: "Pour moderniser leur armée dépassée, les Chinois ont proposé d’augmenter notre influence dans leur économie en échange d’un échange militaire. Bien que nominalement pour le bénéfice des deux parties, cela aidera bien sûr surtout leur armée."
 KMT_event.78.a: "Une affaire formidable !"
 KMT_event.78.b: "La science allemande est pour les Allemands seulement !"
 KMT_event.79.t: "La Chine cherche à acquérir de l’expérience militaire"
 KMT_event.79.desc: "Pour moderniser leur armée dépassée, les Chinois ont proposé d’augmenter notre influence dans leur économie en échange d’un peu d’expérience."
 KMT_event.79.a: "Une affaire formidable !"
 KMT_event.79.b: "L’expérience allemande est réservée aux Allemands seulement !"
 KMT_event.80.t: "La Chine dissout l'HAPRO"
 KMT_event.80.desc: "Mécontents de notre emprise sur leur économie, les Chinois ont dissous l'HAPRO et pris leur part des bénéfices avant de partir, mettant ainsi fin à notre coopération et à notre accès à des ressources bon marché en Chine."
 KMT_event.80.a: "Je suppose que c’est un fait accompli"
 KMT_event.80.b: "Maudit sois-tu, Chiang !"
 GER_harpo_tt: "La Chine pourra acheter davantage de notre équipement, nous donnant de l’influence en Chine, simplifiant le commerce dans un premier temps, mais avec plus de possibilités disponibles à terme…"
 CHI_election_guide_tt: "Débloquer un §YGUI§! dans §Ydécisions§! notant l’état actuel de la lutte pour le pouvoir et les popularités des partis, chaque bouton §2KMT§!, §8YCP§!, et §OCDSP§! ouvrant un sous-menu unique au parti.\n\nN’oubliez pas d’annoncer les résultats des élections via le bouton en haut à droite, sinon un §gcoup d’État militaire§! pourrait avoir lieu…"
 KMT_SOV_cooperation: "Mission militaire soviétique"
 KMT_SOV_cooperation2: "Mission militaire soviétique"
 KMT_reach_out_to_moscow: "Tendre la main à Moscou"
 KMT_reach_out_to_moscow_desc: "Nos diplomates ont maintenant reçu l’ordre de tendre la main à Moscou, car ils sont nos frères socialistes et nous pouvons beaucoup apprendre d’eux, peut-être que cela mènera à une grande coopération future…"
 KMT_military_exchanges: "Échanges militaires"
 KMT_military_exchanges_desc: "Avec notre coopération naissante, nous demanderons une mission militaire soviétique, améliorant grandement l’efficacité de notre armée et nous aidant à devenir une force dominante à l’avenir."
 KMT_full_military_alliance: "Alliance militaire complète"
 KMT_full_military_alliance_desc: "Nous devons tant aux Soviétiques. Il serait donc juste de demander une alliance militaire complète avec eux, renforçant encore la mission et forgeant un grand bloc eurasien !"
 KMT_moscow_nanjing: "Moscou et Nankin travaillent ensemble"
 KMT_scrifice_in_the_name_of_china: "Sacrifice au nom de la Chine"
 KMT_scrifice_in_the_name_of_china_desc: "Notre peuple doit apprendre à se sacrifier pour le bien supérieur de la Chine ! La Chine sera sauvée et notre peuple se battra pour elle !"
 KMT_the_return_of_whampoa: "Le retour de Whampoa"
 KMT_the_return_of_whampoa_desc: "Whampoa a finalement consolidé le pouvoir total sur la Chine ! Gloire à la NRA !"
 KMT_extol_china: "Exalter la Chine"
 KMT_full_military_politicization: "Politisation militaire totale"
 KMT_full_military_politicization_desc: "L’armée de Whampoa a désormais retrouvé sa politisation, garantissant qu’elle dominera l’avenir de la Chine."
 KMT_help_generals_into_the_government: "Aider les généraux à entrer dans le gouvernement"
 KMT_help_generals_into_the_government_desc: "Whampoa commence maintenant à aider ses généraux à entrer dans notre gouvernement, garantissant que la clique de Whampoa puisse seulement étendre son pouvoir."
 KMT_full_loyalty_to_the_generalissimo: "Loyauté totale envers le Généralissime"
 KMT_full_loyalty_to_the_generalissimo_desc: "L’armée a déclaré une loyauté totale envers le Généralissime, assurant son contrôle sur elle."
 KMT_the_grand_goverment: "Le Grand Gouvernement"
 KMT_the_grand_goverment_desc: "Whampoa mettra en place un grand gouvernement composé de membres de toute la clique Whampoa. Bientôt, elle dominera toute la Chine."
 KMT_civilian_matters_in_civilian_hands: "Les affaires civiles entre des mains civiles"
 KMT_civilian_matters_in_civilian_hands_desc: "Même Whampoa reconnaît que certaines choses doivent être laissées entre des mains civiles. Ainsi, une politique basée exactement sur cela sera adoptée."
 KMT_arrest_key_oppositional_figures: "Arrêter les principales figures d’opposition"
 KMT_arrest_key_oppositional_figures_desc: "La police militaire arrêtera les principales figures d’opposition, mettant fin à toute opposition au nouveau régime militaire. Whampoa et le KMT ne doivent pas être remis en question."
 KMT_anti_conservative_censorship: "Censure anti-conservatrice"
 KMT_anti_conservative_censorship_desc: "L’État censurera les démocrates et les conservateurs du KMT, tous doivent s’incliner devant la clique Whampoa et son régime !"
 KMT_violence_when_necessarys: "Violence lorsque nécessaire"
 KMT_violence_when_necessarys_desc: "Nous estimons qu'il peut être nécessaire de recourir à la violence à certains moments. Ce principe que les Chemises Bleues nous ont donné sera utilisé avec succès pour sécuriser le régime."
 KMT_disband_the_cc_clique_wham: "Démanteler la clique CC"
 KMT_disband_the_cc_clique_wham_desc: "Le moment est venu de démanteler la clique CC et son opposition envers nous, détruisant leur attitude arrogante et pathétique."
 KMT_decrease_blueshirt_autonomy: "Réduire l’autonomie des Chemises Bleues"
 KMT_decrease_blueshirt_autonomy_desc: "Nous allons enfin réduire l’autonomie que les Chemises Bleues possèdent dans la NRA et la clique Whampoa, en centralisant le tout et en gérant ces dégénérés."
 KMT_consolidate_military_power: "Consolider le pouvoir militaire"
 KMT_consolidate_military_power_desc: "Nous devons consolider le pouvoir militaire dans notre nation, le sécurisant pour Whampoa et Whampoa seul."
 KMT_increase_military_quality_of_life: "Améliorer la qualité de vie militaire"
 KMT_increase_military_quality_of_life_desc: "Le gouvernement a ordonné d’améliorer la qualité de vie de nos soldats au point que combattre pour nous devienne extrêmement avantageux, avec des soldats nous aimant et prêts à mourir pour nous."
 KMT_national_defense_fund: "Fonds de défense nationale"
 KMT_national_defense_fund_desc: "Whampoa manque de fonds suffisants… Cela sera corrigé avec notre nouveau projet et notre fonds destiné à agrandir notre armée."
 KMT_high_pensions: "Fortes pensions"
 KMT_high_pensions_desc: "Le gouvernement impose une pension élevée pour que nos troupes soient heureuses de se battre pour nous et puissent vivre dignement même si elles sont blessées."
 KMT_a_martial_china: "Un État martial"
 KMT_a_martial_china_desc: "La Chine est devenue un véritable État militaire, contrôlé par Whampoa et sans opposition."
 KMT_national_military_indoctrination: "Endoctrinement militaire national"
 KMT_national_military_indoctrination_desc: "La nation sera endoctrinée selon les principes militaires, garantissant le pouvoir total de Whampoa sur elle."
 KMT_all_hail_the_nra: "Gloire à la NRA"
 KMT_all_hail_the_nra_desc: "Alors que tous acclament la NRA, elle assure son pouvoir sur la Chine et unifie son contrôle sur la nation."
 KMT_a_military_to_be_proud_of_desc: "Nous allons développer un sentiment de fierté dans notre armée, unissant le pays autour d’elle. Cela la rendra vraiment grande."
 KMT_parade_on_tianmen_square: "Parade sur la place Tian’anmen"
 KMT_parade_on_tianmen_square_desc: "Les soldats défilent sur la place Tian’anmen, montrant réellement la puissance de notre armée."
 KMT_mandatory_work_quotas: "Quotas de travail obligatoires"
 KMT_mandatory_work_quotas_desc: "Les Chemises Bleues instaurent des quotas de travail obligatoires pour s’assurer que nous produisons plus que nos ennemis."
 KMT_align_with_moscow: "S’aligner sur Moscou"
 KMT_economic_unity: "Unité économique"
 KMT_economic_unity_desc: "Nous enverrons les Russes et proposerons une coopération économique plus étroite, pour construire un futur solide."
 KMT_military_unity_desc: "Nous enverrons les Russes et proposerons une coopération militaire plus étroite, pour un futur puissant."
 KMT_military_unity: "Unité militaire"
 KMT_one_union_in_all_but_name: "Une union en tout sauf en nom"
 KMT_one_union_in_all_but_name_desc: "Récemment, nous sommes devenus de facto une partie de l’Union soviétique. Officialisons cela et obtenons un statut légal spécial !"
 KMT_de_facto_member_of_the_union: "Membre de facto de l’Union"
 KMT_happy_blueshirts_tt: "§tAvec son nouveau poste, §YDai Li§! sera pacifié et ne s'opposera pas au démantèlement des §!§8Chemises Bleues§! par Chiang."
 KMT_angry_blueshirts_tt: "Cela va mettre en colère les Chemises Bleues ou ce qui en reste"
