 KMT_further_integration: "Approfondir l’intégration de §Y[FROM.GetNameDef]§!"
 KMT_limited_campaign_in_FROM: "Campagne limitée en [FROM.GetName]"
 KMT_strategize_against_FROM_tt: "Ce qui confère un bonus d’attaque de §G+10 %§! contre un seigneur de guerre de votre choix à la fois."
 KMT_limited_campaign_in_FROM_tt: "Ce qui donne la capacité de lancer des guerres frontalières pour conquérir les États voisins."
 KMT_integrate_the_cliques_tt: "Débloque des décisions pour subjuguer et annexer des seigneurs de guerre alliés."
 KMT_the_true_enemy_28_days_tt: "Prendre §YLe véritable ennemi§! réduira la durée de ce focus à §G28§! jours."
 KMT_the_true_enemy_35_days_tt: "Prendre §YLe véritable ennemi§! réduira la durée de ce focus de §G35§! jours."
 KMT_the_foreign_imminent_treaty_35_days_tt: "Prendre §YLa menace étrangère imminente§! réduira la durée de ce focus de §G35§! jours."
 KMT_set_up_the_big_rear_plan_30_tt: "Prendre §YMettre en place le grand plan de l’arrière§! réduira la durée de ce focus de §G30§! jours."
 KMT_the_invaders_vanquished: "Les envahisseurs vaincus"
 KMT_the_invaders_vanquished_desc: "Les Japonais et les autres étrangers ont été chassés de Chine ! Nous avons enfin sauvé la nation de nouvelles humiliations !"
 KMT_the_national_government_secured: "Gouvernance nationale assurée"
 KMT_the_national_government_secured_desc: "Nous l’avons fait ! Toute la Chine centrale est sécurisée et les communistes ont été éliminés ! La Chine est unie et la Chine est forte ! Nul ne résistera au KMT !"
 KMT_wittle_down_the_cliques: "Éroder les cliques"
 KMT_wittle_down_the_cliques_desc: "Les différentes cliques de seigneurs de guerre nous causent toutes sortes de problèmes ces derniers temps ; il est temps de commencer à les repousser progressivement avec l’aide de l’ANR !"
 KMT_utilize_asymetric_warfare: "Mener une guerre inégale"
 KMT_utilize_asymetric_warfare_desc: "Si nous voulons gagner cette guerre, nous ne pouvons pas combattre comme une nation normale ; au lieu de cela, nous frapperons l’ennemi là où il ne s’y attend pas. Nous le poignarderons dans le dos et détruirons sa capacité de combat avant qu’il n’atteigne le front !"
 KMT_work_towards_the_integration_of_the_cliques: "Intégrer les cliques"
 KMT_work_towards_the_integration_of_the_cliques_desc: "Les différentes cliques qui maintiennent notre nation divisée doivent disparaître ; nous commencerons à les intégrer et à les annexer aussi vite que possible !"
 KMT_end_the_red_menace_once_and_for_all: "Éliminer définitivement la menace rouge"
 KMT_end_the_red_menace_once_and_for_all_desc: "Il est temps d’en finir une bonne fois pour toutes avec les communistes ; il n’y a plus de Japonais pour nous gêner et nous pouvons désormais leur accorder toute notre attention. Commençons par saisir les points clés qu’ils contrôlent !"
 KMT_deal_with_the_traitor_in_nanning: "Plus jamais un autre Liangguang"
 KMT_deal_with_the_traitor_in_nanning_desc: "Les cliques du Guangxi et du Guangdong ont tenté de nous trahir. Nous devons veiller à ce que cela ne soit pas oublié. Nous exigerons donc leur soumission et assurerons notre emprise sur le sud afin que cela ne se reproduise plus !"
 KMT_increase_preparations_for_the_united_front: "Accroître les préparatifs pour un front uni"
 KMT_increase_preparations_for_the_united_front_desc: "Même si cela ne nous réjouit pas, au vu de la pression japonaise, nous devons être prêts à coopérer avec les communistes. Autant préparer les infrastructures à l’avance si cela doit bien se passer !"
 KMT_march_into_the_communist_basin: "Purger la zone de base de Yan’an"
 KMT_march_into_the_communist_basin_desc: "Le quartier général de répression des bandits étant sécurisé, nous pouvons nous assurer que sa mission soit accomplie ; nous marcherons sur Yan’an et détruirons définitivement ce bastion communiste. Le communisme ne doit jamais prendre racine en Chine !"
 KMT_secure_the_yellow_river_line: "Sécuriser la ligne du fleuve Jaune"
 KMT_secure_the_yellow_river_line_desc: "Le fleuve Jaune est essentiel pour défendre le nord de la Chine contre les Japonais ; nous exigerons donc que notre armée soit autorisée à entrer au Shanxi afin de pouvoir s’y retrancher correctement et préparer le terrain pour la guerre."
 KMT_disband_the_bandit_suppression_headquarters: "Contrôler directement le QG de répression des bandits"
 KMT_disband_the_bandit_suppression_headquarters_desc: "Si les communistes doivent tomber un jour, nous devons décharger Zhang Xueliang de ses fonctions au quartier général de répression des bandits, car il les néglige. Exigeons plutôt leur intégration à l’ANR et finissons nous-mêmes le travail contre les communistes !"
 KMT_set_up_the_big_rear_plan: "Mettre en place le grand plan de l’arrière"
 KMT_set_up_the_big_rear_plan_desc: "Avec une invasion japonaise à l’horizon, nous devons être prêts ; nous veillerons à ce que tous les préparatifs du grand plan de l’arrière soient effectués à l’avance afin qu’il puisse être mis en œuvre rapidement !"
 KMT_destroy_the_remnants_of_the_NCAM: "Détruire les vestiges du NCAM"
 KMT_destroy_the_remnants_of_the_NCAM_desc: "Le Japon a cherché à détacher le nord de la Chine de nous ; annulons cela jusqu’au bout, en dissolvant même l’État fantoche japonais de l’est du Hebei."
 KMT_end_songs_flirtations: "Mettre fin aux manœuvres de Song"
 KMT_end_songs_flirtations_desc: "Song and his army in Beiping have beeen far too comfortable working with the Japanese and even occasionally collaborating with the North China Autonomy Movement. This must be ended, and to do this, we will send him an ultimatum at the same time as we march towards the forbidden city."
