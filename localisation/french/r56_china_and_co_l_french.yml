 MAN_legtimate_state:0 "État légitime"
 MAN_kwantung_holdings:0 "Biens du Kwantung"
 MAN_kwantung_consolidated: "Kwantung consolidé"
 MAN_kwantung_marches_south: "Le Kwantung marche vers le sud"
 MAN_kwantung_marches_north: "Le Kwantung marche vers le nord"
 MAN_communist_cells: "Cellules communistes"
 MAN_eastasian_order: "La Mandchourie dans l’ordre est-asiatique"
 MAN_a_walk_to_capitalism: "Une marche vers le capitalisme"
 MAN_a_walk_to_capitalism_desc: "La clé d’une croissance économique à long terme réside dans le capitalisme. Si nous voulons prospérer, nous devons l’adopter."
 MAN_liberalize_the_economy: "Libéraliser l'économie"
 MAN_liberalize_the_economy_desc: "Pour mettre en œuvre cette politique capitaliste, il est nécessaire de libéraliser l’économie et d’assurer une croissance durable."
 MAN_slash_tax_rates: "Réduire les taux d’imposition"
 MAN_slash_tax_rates_desc: "Nous réduirons les impôts sur les entreprises afin de favoriser la prospérité économique en Mandchourie."
 MAN_dole_out_starting_capital: "Distribuer un capital de départ"
 MAN_dole_out_starting_capital_desc: "Pour renforcer encore davantage nos entreprises, un capital de départ sera distribué."
 MAN_a_prosperous_manchuria: "une Mandchourie prospère"
 MAN_a_prosperous_manchuria_desc: "C’est accompli : la Mandchourie est un État prospère. Le peuple voit désormais tous ses besoins satisfaits et entre dans une ère de prospérité."
 MAN_support_interest_of_the_buisness_owners: "Soutenir les intérêts des entreprises"
 MAN_support_interest_of_the_buisness_owners_desc: "Avec une économie toujours plus capitaliste, nous garantirons la défense des intérêts des propriétaires d’entreprises, afin de stimuler la croissance nationale."
 MAN_sacrfice_for_the_state: "Se sacrifier pour l’État"
 MAN_sacrfice_for_the_state_desc: "Le peuple doit se sacrifier pour l’État mandchou, donner tout ce qu’il possède pour assurer notre victoire."
 MAN_total_economic_coherance_3: "Cohérence économique totale"
 MAN_total_economic_coherance_3_desc: "Les réformes continues entreprises par le gouvernement mandchou ont abouti à la création d’une économie impériale parfaitement organisée et efficace, hiérarchisée de haut en bas.Comme une machine bien huilée, notre économie peut désormais servir les besoins de l’Empereur et bien sûr ceux du peuple mandchou."
 MAN_support_workers_rights: "Soutenir les droits des travailleurs"
 MAN_support_workers_rights_desc: "Nous soutiendrons les droits des travailleurs de notre nation. Cela garantira leur fidélité et leur motivation."
 MAN_begin_socialist_reforms: "Commencer les réformes communistes"
 MAN_begin_socialist_reforms_desc: "La Mandchourie a beaucoup bénéficié de ses alliés socialistes ; en récompense, nous appliquerons certaines de leurs politiques dans le pays."
 MAN_expropriate_the_japanese_sympathisers: "Exproprier les sympathisants japonais"
 MAN_expropriate_the_japanese_sympathisers_desc: "Les sympathisants japonais ont causé de grands torts à notre nation. Ils doivent être expropriés, et leurs biens redistribués pour le bien de l’État et du peuple."
 MAN_bring_about_social_justice_by_state_methods: "La justice sociale par l’épée"
 MAN_bring_about_social_justice_by_state_methods_desc: "La justice sociale doit être instaurée, coûte que coûte.Aucun sacrifice ne doit être épargné."
 MAN_nationalize_the_industries: "Nationaliser les industries"
 MAN_nationalize_the_industries_desc: "Les capitalistes et industriels ont nui à notre peuple. Leurs biens seront nationalisés et mis au service du bien commun."
 MAN_a_state_for_the_people: "Un État pour les citoyens"
 MAN_a_state_for_the_people_desc: "La Mandchourie est devenue un État du peuple. Tous y sont pris en charge et en bénéficieront."
 MAN_the_kwantung_withdrawal: "Le retrait du Kwantung"
 MAN_the_kwantung_withdrawal_desc: "Avec le retrait de la majeure partie de l’armée du Kwantung, nous chasserons désormais les dernières forces restantes. La Mandchourie sera libre !"
 MAN_invest_in_a_modern_tank_force: "Investir dans une force blindée moderne"
 MAN_invest_in_a_modern_tank_force_desc: "L’État doit investir dans une force de chars moderne, afin d’assurer la puissance de notre armée et notre sécurité pour les années à venir."
 MAN_consolidate_internal_politics: "Consolider les politiques intérieures"
 MAN_consolidate_internal_politics_desc: "Il est temps de consolider notre politique intérieure, garantissant la stabilité et l’avenir de l’État."
 MAN_break_the_notion_of_the_past: "Briser la notion du passé"
 MAN_break_the_notion_of_the_past_desc: "Autrefois, la Mandchourie était considérée comme une partie inaliénable de la Chine, même par les anciens Qing.Le nouvel Empereur a reconnu que ce n’est pas le cas !La Mandchourie est un État unique qui forgera son propre destin."
 MAN_forging_a_unique_identity: "Forger une identité unique"
 MAN_forging_a_unique_identity_desc: "La Mandchourie forgera une identité nouvelle, mêlant les cultures de nombreux peuples en une synthèse unique, jamais vue ailleurs dans le monde. Nous sommes l’avenir de l’Asie et du monde !"
 MAN_greater_manchuria_theory: "Théorie de la Grande Mandchourie"
 MAN_greater_manchuria_theory_desc: "Nous adopterons l’idée d’une Grande Mandchourie, en reprenant les terres occupées par la Russie. La Mandchourie redeviendra grande !"
 MAN_integrate_the_frontier: "Intégrer la frontière"
 MAN_integrate_the_frontier_desc: "Ayant récupéré plusieurs de nos anciennes provinces, il est désormais temps de les intégrer, de consolider notre pouvoir et d’unifier pleinement la nation !"
 MAN_deal_with_kwantung_remnants: "Traiter les restes du Kwantung"
 MAN_deal_with_kwantung_remnants_desc: "Le Japon et les armées du Kwantung contrôlent encore une partie de nos terres. Nous devons les repousser, les détruire et libérer notre peuple."
 MAN_abide_by_the_constitution: "Rédiger une nouvelle Constitution"
 MAN_abide_by_the_constitution_desc: "Avec le renversement de l’État fantoche japonais, nous n’avons plus eu de constitution, étant gouvernés par des hommes forts. Le temps est venu d’y mettre fin et d’écrire une nouvelle constitution."
 MAN_manchurian_constitutionalism: "Soumission totale à la Constitution"
 MAN_manchurian_constitutionalism_desc: "L’Empereur a décidé de se soumettre pleinement à l’autorité de la Constitution, devenant ainsi un monarque constitutionnel, garantissant plus de liberté pour notre peuple."
 MAN_rule_by_decree: "Gouverner par Décret"
 MAN_centralizing_authority: "Centraliser l’autorité"
 MAN_centralizing_authority_desc: "Nous devons centraliser notre autorité dans la nation, assurer la sécurité du régime et le règne éternel de l’Empereur !"
 MAN_his_wish_our_command: "Son souhait, notre commandement"
 MAN_his_wish_our_command_desc: "Le peuple doit se soumettre à la volonté de l’Empereur ; son œuvre est divine, et le peuple obéira !"
 MAN_the_qing_restoration: "La Restauration Qing"
 MAN_the_qing_restoration_desc: "Grâce à notre succès au Congrès de Harbin, la monarchie est désormais solidement ancrée en Mandchourie ! Gloire au retour des Qing !"
 MAN_the_manchu_restoration: "Ancrer l’hégémonie mandchoue"
 MAN_the_manchu_restoration_desc: "L’hégémonie mandchoue règnera sur nos terres, assurant notre retour éternel au pouvoir. Jamais plus les Mandchous ne seront opprimés par les Han ou les Japonais."
 MAN_the_hope_of_seperatism_desc: "La Mandchourie vit dans le but d’obtenir sa souveraineté et de se séparer des dégénérés de Chine."
 MAN_the_hope_of_seperatism_tt: "Pour chaque État chinois que vous contrôlez mais qui n’est pas votre État national, vous recevrez :\nUsines de biens de consommation : §Y+1,5 %§!\nStabilité : §R-1,50 %§!\nObjectif de résistance : §R+2 %§!\nVitesse de croissance de la résistance : §R+2 %§!\nVitesse de croissance de la conformité : §R-1 %§!"
 MAN_open_the_mining_industry_for_investments_desc: "Nous ouvrirons l’industrie minière aux investissements, afin que l’économie puisse se développer et devenir une force puissante."
 MAN_expand_state_resource_extraction_desc: "Les ressources extraites par l’État doivent être accrues. L’économie sera florissante."
 MAN_greatly_increase_tenko_measures: "Augmenter considérablement les mesures Tenko"
 MAN_greatly_increase_tenko_measures_desc: "Le Kwantung renforcera considérablement nos mesures de lavage de cerveau du peuple. Ils doivent être loyaux envers l’Empereur et non envers leur idéologie socialiste, même si c’est pour cette raison qu’ils ont quitté le Japon pour la Mandchourie."
 MAN_raid_the_social_research_unit: "Faire une descente dans l’unité de recherche sociale"
 MAN_raid_the_social_research_unit_desc: "Pour lutter contre le socialisme, l’unité de recherche sociale et ses sympathisants communistes doivent être perquisitionnés. La Mandchourie doit être libérée de ces imbéciles !"
 MAN_enforce_japanese_cultural_norms: "Imposer les normes culturelles japonaises"
 MAN_enforce_japanese_cultural_norms_desc: "Les normes culturelles japonaises doivent être imposées, afin de garantir un État exempt de toute pensée gauchiste provenant des colons."
 MAN_consolidate_control_over_the_state: "Consolider le contrôle sur l’État"
 MAN_consolidate_control_over_the_state_desc: "Avec l’influence grandissante du Kwantung en Mandchourie, il est temps de la consolider pleinement. Nul ne contestera l’Armée, et nul ne contestera l’Empereur !"
 MAN_fully_sideline_kwantung: "Écarter complètement le Kwantung"
 MAN_fully_sideline_kwantung_desc: "Nous écarterons totalement l’armée du Kwantung, désormais affaiblie, pour permettre au régime de poursuivre ses propres objectifs."
 MAN_kwantungs_power_secured: "Pouvoir du Kwantung sécurisé"
 MAN_kwantungs_power_secured_desc: "L’armée du Kwantung a désormais consolidé pleinement son pouvoir. Gloire à l’armée du Kwantung !"
 MAN_our_part_in_the_new_eastasian_order: "Notre rôle dans le nouvel ordre est-asiatique"
 MAN_our_part_in_the_new_eastasian_order_desc: "Nos troupes marchent désormais pour aider nos suzerains dans leur tentative de libérer l’Asie des colonisateurs. Bientôt, l’Asie sera libre !"
 MAN_a_bent_knee_before_the_emporer: "Un genou à terre devant l’Empereur"
 MAN_a_bent_knee_before_the_emporer_desc: "Puyi s’agenouille devant nos grands suzerains et l’Empire du Japon. C’est notre devoir de leur obéir."
 MAN_kwantung_finally_marches_south: "Kwantung marche enfin vers le sud"
 MAN_kwantung_finally_marches_south_desc: "Il est enfin temps pour Kwantung de marcher vers le sud et de combattre pour le reste de la Chine. Bientôt elle aussi sera pacifiée."
 MAN_sino_japanese_basic_treaty: "Traité de base sino-japonais"
 MAN_sino_japanese_basic_treaty_desc: "Avec un régime collaborationniste installé à Nankin, le cabinet leur fera signer un nouveau traité avec nous, reconnaissant le Mandchoukouo comme un État indépendant. Cela renforcera notre légitimité et fera de nous un État véritablement légitime !"
 MAN_full_seperation_from_china: "Séparation totale de la Chine"
 MAN_full_seperation_from_china_desc: "Avec la Chine désormais assurée dans la sphère japonaise, le soutien japonais les forcera à se retirer de nos terres et à affirmer le Traité de base sino-japonais, reconnaissant le peuple du Mandchoukouo."
 MAN_expand_kwantung_influence_in_china: "Étendre l'influence de Kwantung en Chine"
 MAN_expand_kwantung_influence_in_china_desc: "Kwantung, qui a joué un rôle loin d’être négligeable dans la libération de la Chine, étendra son influence là-bas et saisira certains de leurs actifs."
 MAN_the_fight_for_the_continent: "La lutte pour le continent"
 MAN_the_fight_for_the_continent_Desc: "La guerre contre les Russes pour le continent asiatique a commencé. Bientôt nos forces les vaincront et libéreront une Mandchourie plus grande !"
 MAN_embrace_the_status_quo: "Adopter le statu quo"
 MAN_embrace_the_status_quo_desc: "Il est clair que le Japon et l’armée de Kwantung ont certains objectifs pour notre État. L’État mandchou est obligé de travailler avec eux afin d’assurer leur réussite, en nous utilisant comme un État se séparant de la Chine et en enrichissant notre pays ainsi que le Japon."
 MAN_the_empire_of_great_manchuria: "L’Empire de la Grande Mandchourie"
 MAN_the_empire_of_great_manchuria_desc: "Il est temps de proclamer l’Empire de la Grande Mandchourie, et de commencer à cimenter notre propre identité en opposition à celle chinoise."
 MAN_increase_japanese_settlements: "Augmenter les colonies japonaises"
 MAN_increase_japanese_settlements_desc: "D’importants investissements seront faits pour augmenter les colonies japonaises dans notre pays, en veillant à utiliser leurs fonds pour développer notre pays."
 MAN_a_truly_non_han_identity: "Une identité véritablement non-han"
 MAN_a_truly_non_han_identity_desc: "Avec tant de Japonais et de diverses minorités ethniques sur nos terres, nous pouvons commencer à consolider une identité complètement différente du reste de la Chine. Gloire à la Mandchourie !"
 MAN_bedrock_of_the_japanese_economy: "Pilier de l’économie japonaise"
 MAN_bedrock_of_the_japanese_economy_desc: "Nous sommes désormais devenus le pilier de l’économie japonaise, en les approvisionnant ; tirons parti de cela pour notre propre bénéfice économique."
 MAN_pacify_the_countryside_2: "Pacifier la campagne"
 MAN_pacify_the_countryside_2_desc: "Depuis que nous sommes au pouvoir, les hors-la-loi et rebelles n'ont de cesse de s'opposer à notre autorité dans les régions les plus reculées du pays. Si nous voulons que notre gouvernement soit pris au sérieux, nous devons éradiquer ces terroristes et montrer à la population que nous pouvons imposer notre loi."
 MAN_army_modernization_2: "Modernisation de l'armée"
 MAN_army_modernization_2_desc: "L'armée est trop peu nombreuse et totalement dépassée. C'est inacceptable étant donné les ressources dont nous disposons. Nous devons pouvoir faire notre part."
 MAN_mukden_military_academy_2: "Académie militaire de Mukden"
 MAN_mukden_military_academy_2_desc: "L'armée doit disposer d'officiers compétents et loyaux pour la commander si nous voulons procéder autrement qu'employer de la chair à canon pour atteindre nos objectifs."
 MAN_invite_japanese_settlers_2: "Inviter des colons japonais"
 MAN_invite_japanese_settlers_2_desc: "Nous avons bien plus de terres à travailler que nous n'avons d'hommes pour le faire. De vastes régions du pays sont littéralement laissées en friche. Nous devrions y installer des gens, qui y formeront de nouvelles communautés et permettront d'accélérer le développement économique."
 MAN_collective_farms_2: "Fermes collectives"
 MAN_collective_farms_2_desc: "Le système de la ferme individuelle, possédée et travaillée par une seule famille, est aussi arriéré qu'inefficace. En réunissant toute la main-d'œuvre et toutes les terres d'un village au sein d'une entité unique, le développement serait bien plus rapide."
 MAN_law_university_2: "Université de droit"
 MAN_law_university_2_desc: "Notre pays est encore jeune. Nous avons donc une occasion bien réelle de mettre sur pied un système juridique entièrement nouveau, s'appuyant sur ce qui se fait de plus moderne en termes de gouvernance. Pour y parvenir, nous devrions commencer par créer une institution spécialisée, capable d'accueillir les plus beaux esprits de toute l'Asie."
 MAN_research_and_education_department_2: "Ministère de la Recherche et de l'éducation"
 MAN_research_and_education_department_2_desc: "À mesure que le pays se développe, nous devons veiller à ce que son système éducatif et ses institutions de recherche se développent aussi. Nous devons renforcer nos efforts pour nous assurer que la recherche se concentre sur les enjeux les plus importants."
 MAN_trade_delegation_2: "Délégation commerciale"
 MAN_trade_delegation_2_desc: "Par rapport au reste du monde, nous avons pris beaucoup de retard dans l'industrie. Nous devrions dépêcher une délégation pour étudier les méthodes employées à l'étranger et ainsi trouver le moyen de développer les nôtres."
 MAN_expand_the_textile_industry_2: "Développement de l'industrie textile"
 MAN_expand_the_textile_industry_2_desc: "Les ateliers textiles ont longtemps été le pilier de notre industrie. C'est eux qui nous permettront le plus aisément d'acquérir davantage de capitaux étrangers pour développer l'industrie au sens large."
 MAN_obedience_2: "Soumission"
 MAN_obedience_2_desc: "Certains ne voient en nous qu'une marionnette des Japonais, mais ils ne comprennent absolument rien à cette relation d'égaux à égaux qui nous lie à eux. Nous dresser contre nos bienfaiteurs serait aussi vain qu'un enfant qui refuserait l'autorité de ses parents."
 MAN_hoankyoku_2: "Hoankyoku"
 MAN_hoankyoku_2_desc: "Notre gouvernement est le meilleur espoir pour la Chine d'accéder à un avenir radieux. Mais, bien évidemment, nombreux sont ceux qui ont intérêt à s'assurer de sa destruction. Nous devons donc disposer d'une organisation capable de traquer ces gens et de protéger l'État."
 MAN_first_five_year_plan_2: "Premier plan quinquennal"
 MAN_first_five_year_plan_2_desc: "Même si cela fait très communiste, un plan quinquennal est un outil de valeur pour tout ce qui concerne la planification du développement économique d'un pays. Nous devrions en mettre un en place afin de piloter notre expansion industrielle."
 MAN_invite_japanese_investors_2: "Inviter les investisseurs japonais"
 MAN_invite_japanese_investors_2_desc: "Pour développer le pays, il nous faut des aides extérieures. Or, un certain nombre de compagnies japonaises ont indiqué qu'elles seraient prêtes à investir chez nous."
 MAN_expand_the_railways_2: "Développez les chemins de fer"
 MAN_expand_the_railways_2_desc: "Un réseau ferré moderne est vital pour relier entre elles toutes les régions du pays et l'assembler comme sous un seul toit."
 MAN_develop_aluminum_sources_2:0 "Extension des mines d'aluminium"
 MAN_develop_aluminum_sources_2_desc:0 "Nous disposons de vastes gisements de bauxite dans le Liaoning, qui ne demandent qu'à être exploités. Ils constitueraient un grand avantage pour l'industrie aéronautique."
 MAN_expand_showa_steel_works_2:0 "Étendre les aciéries Shôwa"
 MAN_expand_showa_steel_works_2_desc:0 "Les aciéries Shôwa sont le pilier de notre industrie lourde. Y investir maintenant nous garantira à coup sûr d'en récolter plus tard tous les bénéfices."
 MAN_social_research_unit_2:0 "Unité de recherche sociale"
 MAN_social_research_unit_2_desc:0 "Nous devrions créer une unité spécifiquement dédiée à la recherche sur les coutumes et traditions de notre peuple, de façon à mieux pouvoir le guider afin que tous deviennent des citoyens productifs pour le pays."
 MAN_second_five_year_plan_2:0 "Deuxième plan quinquennal"
 MAN_second_five_year_plan_2_desc:0 "Avec la réussite du premier plan quinquennal, ce n'est que bon sens de répéter cette expérience avec un autre projet de développement économique."
 MAN_national_defense_state_2:0 "État de défense nationale"
 MAN_national_defense_state_2_desc:0 "Jusqu'à ce que la guerre soit gagnée, jusqu'à ce que nous ayons rétabli notre autorité sur l'ensemble de la Chine, nous devons consentir à tous les efforts, être prêts à tous les sacrifices et utiliser jusqu'à nos dernières ressources pour mener la guerre à son terme."
 MAN_mukden_arsenal_2:0 "Arsenal de Mukden"
 MAN_mukden_arsenal_2_desc:0 "Le vieil arsenal impérial de Mukden doit être au cœur d'un nouveau complexe militaro-industriel qui fournira à notre armée l'armement le plus moderne."
 MAN_mamc_2:0 "Manshû"
 MAN_mamc_2_desc:0 "Établir une Compagnie aéronautique mandchoue nous permettrait de constituer une armée de l'air moderne, capable de faire face à n'importe quelle autre."
 MAN_alliance_with_the_kwantung_army_2:0 "Alliance avec le Kantôgun"
 MAN_alliance_with_the_kwantung_army_2_desc:0 "Les forces japonaises dans le pays sont souvent opposées à nos idées. Nous devrions donc tout faire pour nous rapprocher d'elles et nous assurer de pouvoir travailler en collaboration, en évitant autant que possible les conflits."
 MAN_chinese_leadership_2:0 "Gouvernement chinois"
 MAN_chinese_leadership_2_desc:0 "Ce qu'il faut aux Chinois, c'est un dirigeant chinois. Nous devrions donc affirmer de façon officielle que nous n'avons aucun autre objectif que restaurer intégralement l'autorité impériale sur l'ensemble de la Chine."
 MAN_vassalize_mengukuo_2:0 "Vassaliser le Mengkukuo"
 MAN_vassalize_mengukuo_2_desc:0 "Le prince du Mengkukuo n'a pas le rang pour se comporter en égal de l'empereur du Mandchoukouo. Il est temps de mettre un terme à cette expérience ridicule en le remettant à la place qui est la sienne."
 MAN_national_cooperation_government_2:0 "Gouvernement de coopération nationale"
 MAN_national_cooperation_government_2_desc:0 "On nous a rapporté des rumeurs inquiétantes, selon lesquelles les Japonais songeraient à des politiciens chinois – des roturiers – pour mettre sur pied un gouvernement de collaboration. C'est parfaitement inenvisageable. Nous devons veiller à ce que tout territoire chinois repris par nos forces combinées soit bien administré par nous, et personne d'autre."
 MAN_the_two_emperors_2:0 "Les deux empereurs"
 MAN_the_two_emperors_2_desc:0 "Le temps est venu de mettre fin à l’idée absurde selon laquelle nous serions autre chose que des partenaires pleinement égaux des Japonais. Nos deux empereurs sont comme des frères !"
 MAN_assertiveness_2: "Affirmation"
 MAN_assertiveness_2_desc: "Les Japonais continuent de nous diriger avec une arrogance exaspérante. Nous devrions bien leur rappeler que nous sommes, nous aussi, un empire digne de respect."
 MAN_request_control_of_the_railways_2: "Demander à contrôler les chemins de fer"
 MAN_request_control_of_the_railways_2_desc: "Dans un pays aussi grand que le nôtre, contrôler les chemins de fer signifie contrôler le pays.\n\nEt les Japonais contrôlent les chemins de fer.\n\nCela doit changer."
 MAN_staff_the_court_with_manchus_2:0 "Installer des Mandchous à la cour"
 MAN_staff_the_court_with_manchus_2_desc:0 "La dynastie Qing a régné sur la Chine durant des siècles. Si nous voulons retrouver notre gloire passée, nous devons veiller à suivre autant que possible son exemple."
 MAN_expand_the_imperial_guards_2:0 "Étendre la Garde impériale"
 MAN_expand_the_imperial_guards_2_desc:0 "La Garde impériale va former l'élite de la nouvelle armée et sera un exemple pour tous les soldats qui aspireront à l'intégrer."
 MAN_local_arms_procurement_2:0 "Approvisionnement en armement local"
 MAN_local_arms_procurement_2_desc:0 "Nous ne pourrons nous appuyer éternellement sur les Japonais pour nous fournir des armes. Si nous voulons en obtenir par nous-mêmes, nous avons besoin de trouver des sources d'approvisionnement que nous sommes sûrs de pouvoir contrôler directement."
 MAN_bolster_nationalism_2:0 "Soutenir le sentiment nationaliste"
 MAN_bolster_nationalism_2_desc:0 "Pendant trop longtemps, on a considéré le Mandchoukouo comme une construction artificielle inventée par les Japonais. Mais chaque nation n’a été au départ qu’une idée. Nous devons instaurer un sentiment d’identité mance dans le peuple et transformer l’idée en réalité."
 MAN_five_equal_peoples_2:0 "Cinq peuples égaux"
 MAN_five_equal_peoples_2_desc:0 "Les jours où un peuple pouvait régner en maître sur tous les autres sont révolus. Le Mandchoukouo sera un nouveau type de nation, où cinq peuples - Russes, Japonais, Mongols, Coréens et Mandchous - vivront ensemble en harmonie."
 MAN_white_russian_advisers_2:0 "Recruter des conseillers russes blancs"
 MAN_white_russian_advisers_2_desc:0 "Après la guerre civile russe, un certain nombre de Russes ont préféré l’exil à ce que les Soviétiques avaient prévu pour leurs ennemis vaincus. Nous pourrions utiliser ces personnes pour reconstruire et entraîner notre armée."
 MAN_empower_the_legislative_council_2:0 "Renforcer le Conseil législatif"
 MAN_empower_the_legislative_council_2_desc:0 "Le Conseil législatif est pour l'heure à peine plus qu'une institution cérémonielle qui ne fait qu'accepter toute suggestion présentée par nos maîtres japonais. Si nous voulons former une nation réellement souveraine, la priorité est d'acquérir une pleine autonomie en matière législative."
 MAN_five_people_armies_2:0 "Armée des Cinq peuples"
 MAN_five_people_armies_2_desc:0 "Si chaque citoyen est l'égal des autres, alors chacun doit de même se préparer et être volontaire pour défendre le pays contre l'oppression étrangère."
 MAN_purge_the_general_affairs_council_2:0 "Purge du Conseil d'État des Affaires générales"
 MAN_purge_the_general_affairs_council_2_desc:0 "Le Conseil d'État des Affaires générales a été institué par les Japonais pour s'assurer qu'ils conservent le plein contrôle sur notre gouvernement. Cela ne peut continuer ainsi. Nous devons en éliminer tous les membres dont la loyauté envers nous est au mieux suspecte."
 MAN_reform_the_civil_service_2:0 "Réformer la fonction publique"
 MAN_reform_the_civil_service_2_desc:0 "Le Conseil d'État des Affaires générales n'était que le sommet de l'iceberg : dans les faits, les Japonais géraient eux-mêmes de vastes pans de la fonction publique, sans que nous puissions rien y faire. Nous devons maintenant mettre en place nos propres fonctionnaires."
 MAN_independence_war_2:0 "Guerre d'indépendance"
 MAN_independence_war_2_desc:0 "Le temps est venu de briser les chaînes de l’oppression et de combattre pour nos libertés ancestrales. Le Mandchoukouo sera la première partie de la Chine à respirer librement, affranchie de toute oppression étrangère."
 MAN_imperial_divinity_2:0 "Divinisation de l'Empereur"
 MAN_imperial_divinity_2_desc:0 "Autrefois, les empereurs de Chine étaient révérés comme des dieux vivants. Nous devons rapprocher l'Empereur de cette tradition ancienne."
 MAN_imperial_university_2:0 "Université impériale"
 MAN_imperial_university_2_desc:0 "L'Empire a besoin de gens brillants pour faire avancer sa cause. Nous devrions établir un lieu où les meilleurs et les plus intelligents au sein de notre peuple pourront s'assembler pour enseigner et apprendre des autres."
 MAN_move_capitals_2:1 "Transférer la capitale"
 MAN_move_capitals_2_desc:0 "L’ancienne capitale de toute la Chine a toujours été Pékin. Maintenant qu’elle a été reprise, nous pouvons ramener l’Empereur en triomphe dans son ancien foyer."
 MAN_claim_the_mandate_of_heaven_2:0 "Revendiquer le Mandat céleste"
 MAN_claim_the_mandate_of_heaven_2_desc:0 "Les victoires remportées lors de la guerre ont rendu évident le fait que le ciel lui-même a jugé l'Empereur juste et digne du trône céleste. Face à une telle vérité, toute insinuation selon laquelle il ne serait pas le dirigeant légitime de la Chine doit être ridiculisée."
 MAN_reclaim_the_empire_2:0 "Revendiquer l'Empire"
 MAN_reclaim_the_empire_2_desc:0 "Maintenant que nous avons gagné notre liberté, il est temps de porter la guerre contre les traîtres et les rebelles qui se trouvent toujours en Chine. Soit nous gouvernerons le pays, soit nous périrons dans notre entreprise."
 MAN_assert_our_authority_2:0 "Imposer notre autorité"
 MAN_assert_our_authority_2_desc:0 "La Chine est toujours divisée et déchirée. Aucun de ces usurpateurs, de ces bandits qui se font appeler seigneurs de la guerre, de ces présidents n'est en mesure de gouverner. Ils doivent être soumis afin que notre règne éclairé puisse se répandre sur toute la Chine."
 MAN_offer_vassalization_2:0 "Offrir le titre de vassal"
 MAN_offer_vassalization_2_desc:0 "La guerre a déchiré le pays. Nous pourrions y mettre un terme en offrant à ceux qui ont refusé de prendre parti une place à notre cour."
 MAN_finish_the_five_year_plan_2:0 "Terminer le plan quinquennal"
 MAN_finish_the_five_year_plan_2_desc:0 "Notre deuxième plan quinquennal a été fructueux, il nous faut juste y consacrer un peu plus d’efforts et notre industrie sera en plein essor en un rien de temps."
 MAN_reclaim_the_entierty_of_manchuria_puppet_2: "Reproche à l'impérialisme russe"
 MAN_reclaim_the_entierty_of_manchuria_puppet_2_desc: "Pendant que la Chine était à genoux, les Russes ont volé de vastes pans de la Mandchourie, qu'ils appellent aujourd'hui la Primature, dans une démonstration flagrante d'impérialisme colonial. Bien que nous ayons participé à la lutte contre les puissances impérialistes occidentales actuelles, le temps a jugé bon de nous faire combattre à nouveau les Russes, une chance de réparer ces torts !"
 MAN_acquire_kanto_shu_2: "Acquérir Kanto-Shu"
 MAN_acquire_kanto_shu_2_desc: "Les autorités japonaises sont trop préoccupées par la guerre avec les Chinois et elles tentent de nous transférer le Kanto-shu pour alléger une partie de leur pression législative. Nous pourrions également gagner un port important dans le processus."
 MAN_for_the_emperor_2: "Pour l'Empereur"
 MAN_for_the_emperor_2_desc: "Nos soldats combattent au nom de notre glorieux et bien-aimé empereur, notre victoire est assurée !"
 MAN_send_cadets_to_japan_2:0 "Envoyer des cadets au Japon"
 MAN_send_cadets_to_japan_2_desc:0 "L'absence d'académie militaire dans notre pays a entraîné un manque d'expérience chez nos officiers militaires. Nous pouvons les envoyer dans les académies japonaises des îles japonaises pour améliorer cette situation."
 MAN_reform_command_structure_2:0 "Réformer la structure de commandement"
 MAN_reform_command_structure_2_desc:0 "Notre structure de commandement actuelle n’est pas très efficace, elle pourrait bénéficier de quelques réformes."
 MAN_restore_the_old_frontier_2:0 "Restaurer l'ancienne frontière"
 MAN_restore_the_old_frontier_2_desc:0 "Maintenant que la plaine centrale est sous contrôle, la prochaine étape du plan est de reconquérir les territoires extérieurs perdus."
 MAN_restore_the_tributary_system_2: "Restaurer le système tributaire"
 MAN_restore_the_tributary_system_2_desc: "Grâce à la puissance considérable de l'Empire, les nations mineures environnantes auront la possibilité d'être protégées par les Grands Qing. Ce serait un honneur pour elles de faire partie de l'Empire."
 MAN_revive_zongli_yamen_2: "Faire revivre Zongli Yamen"
 MAN_revive_zongli_yamen_2_desc: "Le Zongli Yamen était une organisation principalement chargée des affaires étrangères et du développement technologique de l'Empire Qing. Si l'Empire veut rivaliser avec les puissances occidentales, le Zongli Yamen en sera un élément indispensable."
 MAN_revive_the_grand_council_2:0 "Faire revivre le Grand Conseil"
 MAN_revive_the_grand_council_2_desc:0 "Le Grand Conseil fut abandonné après la création du \"Cabinet royal\", qui s'avéra un échec. Un organe aussi important de l'Empire doit être rétabli et contribuer à nouveau à la gloire du Grand Empire Qing."
 MAN_subjugate_japan_2:0 "Soumettre le Japon"
 MAN_subjugate_japan_2_desc:0 "Les Japonais paieront pour l'humiliation qu'ils nous ont infligée. Nous les mettrons à genoux !"
 MAN_reclaim_the_entierty_of_manchuria_2:0 "Réprimander l'annexion de l'Amour"
 MAN_reclaim_the_entierty_of_manchuria_2_desc:0 "Alors que notre peuple était au plus bas, les Russes ont volé de vastes étendues de nos terres ancestrales au-delà du fleuve Amour, la partie de la Mandchourie qu'ils appellent aujourd'hui Primayure. Grâce à notre force retrouvée et au renouvellement du mandat divin, nous pouvons veiller à ce que ce grief soit enfin vengé avec intérêt."
 MAN_qing_romanov_alliance_2:0 "Une branche d'olivier à travers la Sibérie"
 MAN_qing_romanov_alliance_2_desc:0 "Alors que beaucoup d’entre nous souhaitent s’en prendre aux Russes pour leurs crimes passés, les temps ont changé et ces deux trônes d’Asie devraient plutôt s’unir contre les perversions de la modernité et la puissance impérialiste des autres grandes puissances."
 MAN_winter_training_2:0 "Entraînement hivernal"
 MAN_winter_training_2_desc:0 "Il fait froid dehors, les chapkas sont utiles."
 MAN_manchuria_petroleum_company_2: "Compagnie pétrolière de Mandchourie"
 MAN_manchuria_petroleum_company_2_desc: "Créée le 10 mai 1935, la société a permis un monopole japonais complet sur l'exploitation et le raffinage du pétrole en Mandchourie."
 MAN_national_martyr_shrine_2: "Sanctuaire national des martyrs"
 MAN_national_martyr_shrine_2_desc: "Les pertes de leurs vies ne seront pas oubliées. Ils sont un sacrifice que j'accepte volontiers comme une nécessité afin de regagner mon trône."
 MAN_support_aikawa_2:0 "Soutenez Aïkawa"
 MAN_support_aikawa_2_desc:0 "Le plan d'Aikawa Yoshisuke pour l'économie nationale du Mandchoukouo, visant à établir un conglomérat industriel de style zaibatsu afin de développer l'économie en fonction des besoins de l'État et de tous les acteurs impliqués, profitera à tous ceux qui ont un intérêt dans l'industrialisation de la Mandchourie. Aikawa a convaincu le gouvernement."
 MAN_support_hoshino_2:0 "Soutenez Hoshino"
 MAN_support_hoshino_2_desc:0 "Le modèle syndicaliste national imaginé et en partie édicté par Hoshino Naoki permettra plus de souplesse et une meilleure adhésion aux revendications des militaires du Mandchoukouo. De plus, ses pratiques contraires à l'éthique attireront des revenus supplémentaires pour le gouvernement."
 MAN_establish_mangyo_2:0 "Établir Mangyo"
 MAN_establish_mangyo_2_desc:0 "La Société de développement industriel de la Mandchourie ou en abrégé Mangyo, sera établie en tant que conglomérat industriel pour se voir accorder un monopole sur l'économie de la Mandchourie. Plusieurs sociétés autrefois indépendantes telles que la Showa Steel Works ou la South Manchuria Railway seront intégrées."
 MAN_expand_opium_production_2:0 "Développer la production d'opium"
 MAN_expand_opium_production_2_desc:0 "La promotion de Hoshino a ouvert de nouvelles possibilités pour le Bureau d'État du monopole de l'opium, les nouveaux revenus renforceront le gouvernement et lui permettront d'exercer une plus grande influence sur les zones indisciplinées. Sous la direction d'Hoshinos, le Bureau deviendra le plus grand distributeur d'opium au monde."
 MAN_mantetsu_railway_monopoly_2:0 "Monopole ferroviaire de Mantetsu"
 MAN_mantetsu_railway_monopoly_2_desc:0 "Le chemin de fer du sud de la Mandchourie était avant même la création de l'Empire de Mandchourie l'une des entreprises les plus rentables de toute l'Asie, avec leur intégration dans la structure économique du Mandchoukouo, leurs bénéfices apporteront richesse et prospérité."
 MAN_total_economic_coherence_2: "Cohérence économique totale"
 MAN_total_economic_coherence_2_desc: "Les réformes continues entreprises par le gouvernement mandchou ont abouti à une économie impériale parfaitement organisée et efficace, organisée de haut en bas. Comme une machine bien huilée, notre économie peut désormais servir les exigences de l'Empire japonais, les exigences de l'armée du Kwantung et bien sûr les exigences du peuple mandchou."
 MAN_officer_academies_2: "Crée une Académie d'Officiers"
 MAN_officer_academies_2_desc: "Afin de créer une armée relativement fiable et autosuffisante, [MAN.GetName] doit former une classe d'officiers confiants et fidèles à notre cause."
 MAN_labor_corps_2: "Corps du travail de Mandchourie"
 MAN_labor_corps_2_desc: "S'il y a une chose que [MAN.GetName] possède, c'est une main-d'œuvre nombreuse, cette main-d'œuvre peut également être utilisée à des fins militaires comme l'entretien et la réparation d'installations militaires."
 MAN_special_river_detachments_2: "Détachements fluviaux spéciaux"
 MAN_special_river_detachments_2_desc: "Pour que l'armée de Mandchourie assiste efficacement les efforts de nos seigneurs, quels qu'ils soient, elle doit créer un corps spécialisé capable d'exceller dans la tâche qui lui est assignée. Bien que nous ne soyons pas en mesure de suivre l'armée du Kwantung à tous les niveaux, grâce à la spécialisation, nous serons toujours utiles !"
 MAN_military_supplies_requisition_law_2:0 "Adopter la loi sur la réquisition des fournitures militaires"
 MAN_military_supplies_requisition_law_2_desc:0 "L'adoption de la loi sur la réquisition des fournitures militaires permettra au gouvernement de s'approprier des terres et des ressources à des fins militaires s'il le juge nécessaire, en outre, il donne l'autorité officielle de recruter des ouvriers pour aider l'armée."
 MAN_auxiliary_forces_2:0 "Forces auxiliaires"
 MAN_auxiliary_forces_2_desc:0 "Afin de créer une force de combat cohérente, des forces auxiliaires pour maintenir la paix derrière les lignes du front sont indispensables."
 MAN_self_sufficient_military_2:0 "Militaire autosuffisant"
 MAN_self_sufficient_military_2_desc:0 "Les réformes précédentes du gouvernement mandchou ont finalement conduit l'armée à passer d'un gang de bandits soudoyés à une force suffisante et fiable, pleinement capable d'aider les opérations japonaises et de mener leurs propres attaques."
 MAN_reinforce_the_heilongjiang_2:0 "Renforcer le Heilongjiang"
 MAN_reinforce_the_heilongjiang_2_desc:0 "L'[SOV.GetName] est sans aucun doute la plus grande menace pour les possessions impériales japonaises sur le continent et la [MAN.GetName] elle-même. Nous devons orienter les efforts du gouvernement vers la construction d'infrastructures militaires et d'un système d'approvisionnement suffisant pour les opérations le long de la frontière."
 MAN_reinforce_east_hebei_2:0 "Renforcer le Hebei oriental"
 MAN_reinforce_east_hebei_2_desc:0 "Le gouvernement impérial japonais a exprimé son désir d'étendre les opérations contre le gouvernement nationaliste de [CHI.GetLeader], nous les aiderons en investissant dans le renforcement du Hebei oriental et pour permettre des manœuvres sur le continent menées par les armées mandchoues et japonaises."
 MAN_the_kwantung_connection_2:0 "La connexion Kwantung"
 MAN_the_kwantung_connection_2_desc:0 "Le chef d'état-major de l'armée du Kwantung, Seishiro Itagaki entretient de bonnes relations avec le général et homme politique influent Hideki Tojo, cette connexion nous donne la possibilité de persuader le gouvernement japonais de s'abstenir de soutenir un gouvernement rival du KMT et de soutenir à la place notre revendication légitime pour la Chine."
 MAN_imperial_tianjin_conference_2:0 "Conférence impériale de Tianjin"
 MAN_imperial_tianjin_conference_2_desc:0 "L'avenir de la [MAN.GetName] et de toute la Chine se décidera principalement à Tokyo, pas en Chine même. Pour devancer toute décision concernant le futur leadership du nouvel État chinois, le gouvernement mandchou et l'armée du Kwantung ont convoqué une conférence à Tianjin occupée, invitant des représentants de toutes les parties prenantes en Chine au sein de la sphère japonaise."
 MAN_order_under_the_marshal_2:0 "Ordre sous le maréchal"
 MAN_order_under_the_marshal_2_desc:0 "Avec la nomination plutôt inattendue d'un chef de guerre d'importance secondaire, [MAN.GetLeader]en tant que président et donc chef fantoche du [MAN.GetName], le maintien de l'ordre dans les campagnes, en particulier dans les anciens territoires du KMT, est de la plus haute importance. La loi martiale sera instaurée dans tout le continent."
 MAN_lessons_of_the_warlord_era_2:0 "Leçons de l'ère des seigneurs de la guerre"
 MAN_lessons_of_the_warlord_era_2_desc:0 "Les nombreux conflits entre seigneurs de guerre, [MAN.GetLeader]ayant été lui-même un combattant, on étaient parmi les seuls conflits militaires à grande échelle de l'entre-deux-guerres, beaucoup de choses peuvent être apprises en étudiant les stratégies et les tactiques utilisées."
 MAN_honor_the_military_2:0 "Honorer les militaires"
 MAN_honor_the_military_2_desc:0 "Avec l'instauration de la loi martiale, l'armée peut désormais exercer des pouvoirs étendus, il est donc important de montrer au peuple que l'armée mandchoue est une institution honorable, qui sert à le protéger des bandits et des traîtres."
 MAN_back_to_the_basics_2:0 "Retour à l'essentiel"
 MAN_back_to_the_basics_2_desc:0 "Avec la défaite du gouvernement KMT, le plan conçu à la conférence de Tianjin peut enfin être mis en œuvre, sous la direction nominale du maréchal-président [MAN.GetLeader], une ligue de gouvernorats de seigneurs de guerre collaborateurs autonomes doit être établie à travers la Chine. Tout en affaiblissant le gouvernement central, il assure le contrôle japonais sur les vastes territoires de la Chine et un coût d'administration minimal."
 MAN_return_of_the_manchus_2:0 "Le retour des Mandchous"
 MAN_return_of_the_manchus_2_desc:0 "Après le couronnement d'Aisin Gioro Pujie comme empereur de Chine et la condamnation de son frère incompétent, nous allons revenir sur l'histoire des Qing, qui se sont battus contre un gouvernement chinois corrompu pour rendre à la Chine sa véritable gloire, comme nous le faisons aujourd'hui. Mort au républicanisme !"
 MAN_the_republican_disgrace_2:0 "La honte républicaine"
 MAN_the_republican_disgrace_2_desc:0 "Avec le renversement de la dynastie Qing en 1911 et l'introduction des idéaux pervers du républicanisme en Chine, son histoire de centralisation s'est fracturée en un conglomérat de seigneurs de guerre qui se querellaient et qui avaient perdu leur respect pour l'autorité. Il doit être reconnu comme la catastrophe la plus choquante de l'histoire chinoise. Le républicanisme en Chine doit être éradiqué et l'ordre doit être rétabli."
 MAN_vanguard_of_the_state_2:0 "Avant-garde de l'État"
 MAN_vanguard_of_the_state_2_desc:0 "La Garde Impériale Mandchoue, l'Empereur [MAN.GetLeader] ,qui lui-même est leur chef de cérémonie, sera élargie en une petite force d'élite, pour effectuer des tâches spéciales au nom de l'Empereur aux côtés de l'Armée Impérial Japonaise."
 MAN_a_tale_of_two_emperors_2:0 "Une histoire de deux empereurs"
 MAN_a_tale_of_two_emperors_2_desc:0 "L'empire chinois a enfin été reconquis ! Alors que ses dirigeants légitimes sont de retour à la barre, nous ne pouvons pas oublier qui nous a amenés ici, sans nos seigneurs bienveillants au Japon, notre héritage aurait été détruit par le républicanisme et le banditisme. Nous devons non seulement accepter mais embrasser notre position en tant qu'Empire soumis au Trône du Chrysanthème."
 MAN_our_place_in_the_empire_2:0 "Notre place dans l'Empire"
 MAN_our_place_in_the_empire_2_desc:0 "Il faut reconnaître que le destin de la Mandchourie, est un destin mandchou, nous resterons séparés du gouvernement central de la Chine, et nous en tirerons le meilleur ! Nous continuerons notre expansion industrielle et économique rapide et montrerons au monde la gloire de l'Ordre Nouveau en Asie"
 MAN_mongol_dominion_2:0 "Domination mongole"
 MAN_mongol_dominion_2_desc:0 "Le règne de [MEN.GetLeader] est opportuniste au mieux et traître au pire, l'État mongol intérieur a dépassé son objectif et il doit être intégré au [MAN.GetName]."
 MAN_request_continental_territory_2:0 "Demander un territoire continental"
 MAN_request_continental_territory_2_desc:0 "Bien que nous reconnaissions notre position en tant que [MAN.GetName], demander des territoires à proximité de nos frontières actuelles pourrait aider à réduire les coûts administratifs pour notre suzerain et nous fournir de la main-d'œuvre et des ressources supplémentaires."
 MAN_mukden_convention_2:0 "Convention de Moukden"
 MAN_mukden_convention_2_desc:0 "Ayant maintenant établi notre position distincte de la Chine, il reste la question des anciens territoires de l'ancien Qing volés par l'Empire russe. Nous convoquerons une convention à Moukden pour convoquer des fonctionnaires japonais et des délégués militaires, que nous revendiquions ou non des territoires anciennement détenus par les Qing en Mongolie et en Mandchourie extérieure."
 MAN_depose_the_weak_monarch_2:0 "Destituer le faible monarque"
 MAN_depose_the_weak_monarch_2_desc:0 "Le règne de Puyi est devenu un outil pour obtenir une légitimité internationale, en nous faisant passer pour les dirigeants légitimes de la Chine. Mais maintenant que nous avons renoncé à nos prétentions sur la Chine, nous n’avons plus besoin de maintenir la façade de Puyi dirigeant notre État, il doit partir. Bien que son départ soit assuré, la question de son successeur est plus compliquée."
 MAN_reorganize_the_kwantung_army_2:0 "Réorganiser l'armée du Kwantung"
 MAN_reorganize_the_kwantung_army_2_desc:0 "L'armée du Kwantung ayant désormais un contrôle absolu sur la [MAN.GetName], la relation du Kwantung avec l'État lui-même doit être redéfinie, l'armée du Kwantung sera fusionnée avec les forces armées mandchoues actuellement existantes, pour former l'armée frontalière continentale. Avant que cela puisse avoir lieu, une réorganisation des deux entités est nécessaire."
 MAN_establish_continental_frontier_army_2:0 "Créer le AFC (Armée des frontières continental)"
 MAN_establish_continental_frontier_army_2_desc:0 "Les préparatifs sont terminés et l'armée frontalière continentale peut être établie, les commandants de l'armée du Kwantung, qui n'avaient auparavant détenu le pouvoir que derrière les chefs fantoches mandchous, assumeront désormais des postes officiels et utiliseront plus efficacement leur expertise pour le [MAN.GetName]."
 MAN_technological_supremacy_2:0 "Suprématie technologique"
 MAN_technological_supremacy_2_desc:0 "Une façon, avec laquelle nous pouvons prouver notre supériorité et présenter la légitimité de l'Ordre Nouveau en Asie, est d'atteindre la suprématie technologique sur les nations voisines et même sur les puissances européennes."
 MAN_the_imperial_wildcard_2:0 "Le joker impérial"
 MAN_the_imperial_wildcard_2_desc:0 "Alors qu'il se présentait initialement comme un candidat de compromis, Kishi n'a montré son vrai visage que peu de temps après avoir pris ses fonctions. Utilisant ses relations à Tokyo, il s'est rapidement débarrassé de l'armée du Kwantung et de son influence et a réprimandé les industriels restants pour qu'ils n'agissent que sous sa supervision. Il a accordé la main libre aux Zaibatsus pour exploiter et abuser du [MAN.GetName], sous son contrôle bien sûr."
 MAN_council_of_corporations_2:0 "Conseil des corporations"
 MAN_council_of_corporations_2_desc:0 "En créant un conseil de tous les acteurs économiques du [MAN.GetName], les efforts industriels peuvent être coordonnés plus efficacement et les inquiétudes des investisseurs peuvent être rapidement prises en compte par le gouvernement."
 MAN_the_council_of_corporations_desc:0 "En créant un conseil de tous les acteurs économiques du [MAN.GetName], les efforts industriels peuvent être coordonnés plus efficacement et les inquiétudes des investisseurs peuvent être rapidement prises en compte par le gouvernement."
 MAN_the_concord_of_ethnicities_2:0 "La concorde des ethnies"
 MAN_the_concord_of_ethnicities_2_desc:0 "La montée en puissance de l'Association d'Union, avec le soutien des industriels, nous permet d'élargir davantage notre objectif de créer un État panasiatique dans lequel les peuples autochtones de la région collaborent et coopèrent."
 MAN_the_pan_asian_dream_2:0 "Le rêve panasiatique"
 MAN_the_pan_asian_dream_2_desc:0 "La règle de l'Association d'Union a vu la diffusion d'une propagande efficace non seulement en Mandchourie mais aussi dans les territoires alliés, elle a conduit à l'immigration de nombreux peuples fuyant la guerre en Chine ou l'occupation japonaise en Corée, nous accordant le bénéfice de nombreux réfugiés au nom du rêve panasiatique."
 MAN_central_control_2:0 "Dictature parfaite"
 MAN_central_control_2_desc:0 "Kishi a créé en Mandchourie ce dont les autres dictateurs ne peuvent que rêver, un État dans lequel rien ne se passe à son insu, un État dans lequel chaque acteur comprend qu'il doit être fidèle à son chef sous peine d'être écrasé, un État dans lequel personne n'ose pour résister aux crétins du chef de l'exécutif."
 MAN_operation_kantokuen_2:0 "Opération Kantokuen"
 MAN_operation_kantokuen_2_desc:0 "Le moment est venu de vaincre l'ultime ennemi de notre nouvel ordre en Asie, les Russes ont occupé pendant des siècles des territoires asiatiques, prétendant que c'était le leur. Leur arrogance sera une fois de plus écrasée par une alliance unie des nations asiatiques ! Nous devons préparer nos forces armées à une longue marche en Sibérie pour bannir une fois pour toutes les forces européennes."
 MAN_greater_manchuria_2:0 "Grande Mandchourie"
 MAN_greater_manchuria_2_desc:0 "L' objectifs de la[MAN.GetName] doit être de récupérer les territoires de la Mandchourie extérieure volés par les Russes en 1858 et 1860. §R Revendiquer des terres qui n'ont pas été sous notre contrôle depuis si longtemps déstabilisera notre nation, mais la libération de l'Asie en vaudra chaque goutte de sang§!"
 MAN_beyond_baikal_2:0 "Au-delà du Baïkal"
 MAN_beyond_baikal_2_desc:0 "Pour vraiment montrer au monde notre paradis des peuples panasiatiques, nos revendications s'étendront au-delà du lac Baïkal pour incorporer tous les Mongols, Bouriates et plus encore ! §R Revendiquer des territoires aussi vastes déstabilisera lourdement notre nation, mais nous devons rester fidèles à notre cause du panasiatisme! §!"
 MAN_revise_imperial_treaties_2:0 "Réviser les traités impériaux"
 MAN_revise_imperial_treaties_2_desc:0 "Nos préparatifs sont terminés et le moment est venu ! Les traités d'Aigun et de Pékin seront révisés, et nos territoires reconquis ! Les colonisateurs européens seront bannis à travers l'Oural ! §R Déclarer la guerre à une nation de force supérieure incitera au défaitisme dans l'armée.§!"
 MAN_liberation_is_nigh_2:0 "La libération est proche !"
 MAN_liberation_is_nigh_2_desc:0 "Nous avons réussi à libérer les territoires revendiqués par le gouvernement, §G tout en contribuant à extirper le défaitisme§, nous avons encore un long chemin à parcourir pour que les Russes se rendent !"
 MAN_propagate_nanshinron_2:0 "Propager Nanshin-ron"
 MAN_propagate_nanshinron_2_desc:0 "La doctrine Nanshrin-ron adoptée par le gouvernement japonais doit être propagée au sein du gouvernement pour permettre la mobilisation contre les ennemis du Nouvelle Ordre Asiatique, la construction militaire doit avoir lieu afin de se préparer à la guerre avec les nations hostiles."
 MAN_pressure_tibet_2:0 "Faire pression sur le Tibet"
 MAN_pressure_tibet_2_desc:0 "Le [TIB.GetName]a été un obstacle dans notre façon de menacer le [RAJ.GetName], ils doivent soit se soumettre au contrôle japonais et accepter notre offre de compromis de céder le Qinghai, soit être écrasés sous la puissance du Nouvel Ordre Asiatique. Nous délivrerons l'ultimatum."
 MAN_the_kashmir_border_2:0 "La frontière du Cachemire"
 MAN_the_kashmir_border_2_desc:0 "La frontière du Cachemire est notre deuxième étape possible pour des opérations terrestres contre le [RAJ.GetName] et la Birmanie, outre la Birmanie, nous devons nous assurer de l'existence d'infrastructures et de capacités d'approvisionnement suffisantes pour le soutien de telles manœuvres."
 MAN_remodel_the_river_detachments_2:0 "Remodeler les détachements de la rivière"
 MAN_remodel_the_river_detachments_2_desc:0 "Nos ennemis en Asie possèdent de nombreuses colonies qui ne peuvent être libérées qu'en lançant des manœuvres navales à grande échelle, nous remodelerons nos détachements fluviaux pour qu'ils soient capables de débarquements navals."
 MAN_hainan_forward_operating_base_2:0 "Base d'opérations avancée de Hainan"
 MAN_hainan_forward_operating_base_2_desc:0 "Hainan est un emplacement parfait pour une base d'opérations avancée pour les débarquements navals, nous allons construire sur l'île pour permettre le stationnement de grandes quantités de forces marines et de la flotte impériale japonaise."
 MAN_assume_continental_responsibilities_2:0 "Assumer des responsabilités continentales"
 MAN_assume_continental_responsibilities_2_desc:0 "En assumant la responsabilité de simples tâches de garnison et de défense, nous pouvons alléger la pression exercée par l'IJA et l'IJN pour leur permettre de mettre en scène des opérations offensives. Nos forces seront adéquatement ajustées pour être aptes au service en terrain birman et malais."
 MAN_new_imperial_chinese_navy_2:0 "Nouvelle marine impériale"
 MAN_new_imperial_chinese_navy_2_desc:0 "Avec le retrait de l'armée du Kwantung, nous allons renforcer nos forces armées indépendantes et recréer notre marine impériale !"
 MAN_manchurian_auxiliary_navy_2:0 "Marine auxiliaire de Mandchourie"
 MAN_manchurian_auxiliary_navy_2_desc:0 "Nous allons investir dans nos capacités navales pour accroître les activités mercantiles et assister l'IJN."
