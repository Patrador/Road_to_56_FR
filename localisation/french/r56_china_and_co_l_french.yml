 KMT_stab10_n3_f2_pp3_tt:0 "Modify §YLa Révolution Nationale du Kuomintang§! by\nStabilité : §G10%§!\nGain de pouvoir politique : §G3%§!\nSoutien quotidien au fascisme : §G+0.02§!\nSoutien quotidien aux non-alignés : §G+0.03§!"
 KMT_continue_land_reform3:0 "Poursuivre la réforme agraire"
 KMT_continue_land_reform2:0 "Poursuivre la réforme agraire"
 KMT_continue_land_reform:0 "Poursuivre la réforme agraire"
 KMT_democracy:0 "Démocratie"
 KMT_democracy_desc:0 "L'un des principes fondateurs du KMT est la démocratie, et nous en instaurerons une glorieuse à l'avenir ! La démocratie sera introduite en Chine, tôt ou tard..."
 KMT_nationalism:0 "Nationalisme"
 KMT_nationalism_desc:0 "Le principe fondamental de notre révolution est le nationalisme ! La Chine sera réformée en un État national et tous les Chinois doivent être unis !"
 KMT_socialism:0 "Socialisme"
 KMT_nanjing_academy_of_the_sciences: "Académie des sciences de Nanjing"
 KMT_nanjing_academy_of_the_sciences_desc: "Nous allons maintenant créer notre propre académie des sciences, garantissant le succès à long terme de la révolution en nous dotant d’une recherche de haute qualité."
 KMT_deal_with_the_traitors: "S’occuper des traîtres"
 KMT_deal_with_the_traitors_desc: "Certains n’ont pas apprécié notre prise de contrôle et nous ont même opposé résistance. Ces traîtres méritent la mort et la recevront."
 KMT_purge_of_the_academies: "Purge des académies"
 KMT_purge_of_the_academies_desc: "Nos académies sont pleines de traîtres envers nous et la révolution. Cela doit cesser immédiatement."
 KMT_ensure_party_purity: "Garantir la pureté du parti"
 KMT_ensure_party_purity_desc: "Nous devons garantir la pureté de notre parti. Tous suivront la ligne du président !"
 KMT_crackdown_on_the_confucianists: "Répression des confucéens"
 KMT_crackdown_on_the_confucianists_desc: "Ces traîtres et vendeurs de l’opium du peuple doivent mourir et leur dissidence doit être stoppée."
 KMT_purge_of_the_generals: "Purge des généraux"
 KMT_purge_of_the_generals_desc: "Nous avons de nombreux généraux opposés à nous, fidèles à l’ancien régime chinois. L’ancien doit partir, le nouveau doit émerger."
 KMT_the_great_purge_successful: "La Révolution culturelle réussie"
 KMT_the_great_purge_successful_desc: "Notre révolution culturelle a été couronnée de succès ! La révolution va enfin se poursuivre sans entrave."
 KMT_deal_with_bluehirt_remnants: "S'occuper des restes des Chemises Bleues"
 KMT_deal_With_bluehirt_remnants_desc: "Les Chemises Bleuesont fait beaucoup de mal à notre peuple et ont été un fléau. On va enfin s'occuper d'eux."
 KMT_socialism_desc:0 "Selon Sun Yat-Sen, le principe final de la révolution du KMT est le socialisme. Nous l'utiliserons pour prendre soin de notre peuple et lui assurer la justice."
 KMT_the_peoples_tutelage: "La tutelle du peuple"
 KMT_the_peoples_tutelage_desc: "Pour instaurer la démocratie en Chine, nous utiliserons la tutelle du peuple pour enseigner à notre peuple les voies de la démocratie en Chine."
 KMT_demand_return_of_the_concessions: "Exiger la restitution des concessions"
 KMT_demand_return_of_the_concessions_desc: "Nous devons maintenant exiger le retour des concessions. La Chine sera unie et nous commencerons par nos ports !"
 KMT_smite_corruption:0 "Réduire la corruption"
 KMT_smite_corruption_desc:0 "Le temps est venu de frapper la corruption en Chine, d'en détruire tous les vestiges, afin que la Chine puisse se libérer d'elle-même."
 KMT_crackdown_on_communist_organizations:0 "Répression des communistes"
 KMT_crackdown_on_communist_organizations_desc:0 "Une campagne de répression des communistes sera lancée dans notre pays, afin de le purger de leur influence répugnante !"
 KMT_chaing_reinvigored:0 "Chiang revigoré"
 KMT_party_empowered:0 "Un parti renfoncé"
 KMT_increase_collaboration_with_the_blueshirts:0 "Renforcer la collaboration avec les Blueshirts"
 KMT_increase_collaboration_with_the_blueshirts_desc:0 "Chiang renforce sa collaboration avec les chemises bleues, permettant à leur influence de contribuer à façonner notre pays. Cela nous apportera une grande victoire !"
 KMT_maintain_the_red_generals_supremacy:0 "Maintenir la suprématie de Chiang"
 KMT_maintain_the_red_generals_supremacy_desc:0 "Le gouvernement doit maintenir la suprématie du généralissime en Chine ! Gloire à Chiang et à sa conduite de notre grand État !"
 KMT_create_the_cbis:0 "Créer le CBIS"
 KMT_create_the_cbis_desc:0 "Chiang créera le CBIS, notre grande organisation d'espionnage, afin d'assurer notre pouvoir dans l'État et d'imposer la volonté du KMT."
 KMT_crackdown_on_capitalist:0 "Répression de la criminalité"
 KMT_push_the_fabi:0 "Renforcer la circulation du Fabi"
 KMT_push_the_fabi_desc:0 "Il est impératif de pousser notre nouvelle monnaie, le Fabi, en Chine, nous l'utiliserons pour consolider notre pouvoir sur l'industrie et nous doter de nouvelles grandes réserves financières."
 KMT_a_new_court:0 "Une nouvelle Cour"
 KMT_a_new_court_desc:0 "Le parti mettra en place une nouvelle Cour dans notre pays pour aider à faciliter la transition vers la démocratie afin que nous puissions réaliser notre volonté pour l'État."
 KMT_reinvigorate_the_white_terror:0 "Renforcer la terreur blanche"
 KMT_reinvigorate_the_white_terror_desc:0 "Le CBIS donnera un nouvel élan à la terreur blanche en Chine. L'opposition et les communistes seront purgés et éliminés, et les Chemises bleues seront renforcées. Vive le Dang !"
 KMT_declare_martial_law:0 "Déclarer la loi martiale"
 KMT_declare_martial_law_desc:0 "La Terreur blanche étant en place, il est temps de concrétiser nos plans et d'officialiser ce que nous faisons déjà. Nous allons déclarer la loi martiale, ce qui nous permettra de faire ce que nous faisons déjà et d'agir en toute impunité."
 KMT_prepare_for_new_elections:0 "Se préparer à de nouvelles élections"
 KMT_prepare_for_new_elections_desc:0 "Le Parti va maintenant commencer à préparer de nouvelles élections, en avançant les dernières pierres pour nous permettre de les organiser."
 KMT_consolidate_party_supremacy:0 "Consolider la suprématie du parti"
 KMT_consolidate_party_supremacy_desc:0 "Le gouvernement consolidera la suprématie du parti, ce qui nous permettra d'agir en toute impunité à l'égard de Chiang et de faire jaillir la démocratie !"
 KMT_enforce_chaings_compliance:0 "Imposer la soumission de Chiang"
 KMT_enforce_chaings_compliance_desc:0 "Le parti fera respecter la soumission de Chiang à notre cause. Il doit maintenant annoncer qu’il renonce au pouvoir et nous cède le contrôle de la nation."
 KMT_a_new_constitution:0 "Finaliser l’ébauche constitutionnelle"
 KMT_a_new_constitution_desc:0 "Chiang et le parti ont travaillé dur pour terminer enfin le projet de constitution et doter l’État d’une véritable constitution. Il reste seulement à décider qui en profitera…"
 KMT_seize_merchant_assets:0 "Saisir les actifs des commerçants"
 KMT_seize_merchant_assets_desc:0 "Afin d'égaliser les richesses du peuple chinois, l'État doit saisir les actifs des riches marchands qui font des affaires en Chine, en prenant pour le peuple ce qui lui revient de droit. Nous ne tolérerons plus ceux qui extorquent la classe ouvrière !"
 KMT_legalize_the_party_left:0 "Légaliser la gauche du parti"
 KMT_legalize_the_party_left_desc:0 "Chiang légalisera à nouveau l'aile gauche du parti, afin de construire un grand front uni contre les Japonais."
 KMT_nationalize_bourgeoise_industries:0 "Nationaliser les propriétés des capitalistes"
 KMT_nationalize_bourgeoise_industries_desc:0 "L'État nationalise enfin les industries des capitalistes, qui privent les travailleurs chinois de ce qui leur revient de droit ! La Chine sera libérée de ces hommes malfaisants."
 KMT_legitimize_the_fabi:0 "Légitimer le Fabi"
 KMT_legitimize_the_fabi_desc:0 "Une fois notre nouvelle monnaie mise en place et diffusée dans toute la Chine, nous travaillerons à sa légitimation, ce qui permettra à la Chine d'avoir une grande économie dans un avenir proche !"
 KMT_seize_foreign_assets:0 "Saisir les avoirs étrangers"
 KMT_seize_foreign_assets_desc:0 "La Chine saisira les biens des impérialistes étrangers qui empiètent sur notre pays."
 KMT_consolidate_government_control_of_industry:0 "Consolider le contrôle de l'industrie par le gouvernement"
 KMT_consolidate_government_control_of_industry_desc:0 "Nous pouvons maintenant consolider le contrôle de l'industrie dans ce pays et assurer notre pouvoir sur celle-ci pour soutenir notre puissance industrielle."
 KMT_push_for_full_control:0 "Push for Full Industrial Control"
 KMT_push_for_full_control_desc:0 "Nous sommes maintenant dans une situation désastreuse et nous pouvons nous en servir pour obtenir le contrôle total des industries chinoises, ce qui nous permettra de monopoliser l'industrie chinoise contre les capitalistes."
 KMT_promise_multiparty_elections:0 "Promettre des élections multipartites"
 MAN_kwantung_veto_2: "Veto du Kwantung"
 KMT_promise_multiparty_elections_desc:0 "Le parti promettra des élections multipartites en Chine, ce qui permettra une grande liberté à l'avenir."
 KMT_uphold_the_concept_of_dang_guo:0 "Défendre le concept de \"Dang Guo\""
 KMT_uphold_the_concept_of_dang_guo_desc:0 "Le parti veillera à maintenir le principe Dang Guo (Parti-État), fusionnant le parti et l'État, donnant au KMT un pouvoir permanent."
 KMT_empower_the_kmt_beurocracy:0 "Renforcer la bureaucratie du KMT"
 KMT_empower_the_kmt_beurocracy_desc:0 "Le régime renforcera la bureaucratie du KMT, lui permettant de faire ce qu'elle veut, garantissant ainsi sa capacité à faire de bonnes choses pour la nation."
 KMT_fufill_the_promise_of_land_reform:0 "Tenir la promesse de la réforme agraire"
 KMT_fufill_the_promise_of_land_reform_desc:0 "Nous avons promis à notre peuple une réforme agraire et nous devrons donc la concrétiser. C'est la demande du peuple."
 KMT_sell_public_land:0 "Vendre des terrains publics"
 KMT_sell_public_land_desc:0 "L'une des étapes clés pour y parvenir consistera à vendre les terres publiques appartenant à l'État. Cela nous aidera à tenir nos promesses et à satisfaire notre population."
 KMT_arable_rent_reduction_act:0 "Loi sur la réduction des loyers des terres arables"
 KMT_arable_rent_reduction_act_desc:0 "L'État veille désormais à réduire le loyer maximum des terres arables. Cela contribuera à rendre le loyer beaucoup moins cher pour les gens et à stimuler leur productivité."
 KMT_land_to_the_tiller:0 "La terre au timon"
 KMT_land_to_the_tiller_desc:0 "Nous forcerons enfin les grands propriétaires terriens à donner des terres à leurs ouvriers, ce qui permettra de rendre justice à ces travailleurs pauvres."
 KMT_revive_the_new_life_movement:0 "Raviver le mouvement de la Nouvelle Vie"
 KMT_revive_the_new_life_movement_desc:0 "Si nous voulons que la Chine devienne grande, nous devrons également faire en sorte que le peuple chinois devienne grand. C'est pourquoi nous allons relancer le mouvement pour une vie nouvelle afin que le peuple chinois devienne un bon citoyen, un citoyen vertueux."
 KMT_disband_the_blueshirts:0 "Dissoudre les Blueshirts"
 KMT_disband_the_blueshirts_desc:0 "Pour la stabilité de notre royaume, nous allons dissoudre les Blueshirts, ce qui nous permettra de gouverner sans les grands problèmes qu'ils ne cessent de causer."
 KMT_violence_is_the_ulimate_means_of_political_expression:0 "Violence comme outils d'expression"
 KMT_violence_is_the_ulimate_means_of_political_expression_desc:0 "Nous, les chemises bleues, croyons que la violence est le moyen ultime d'expression politique. Nous acceptons cette réalité et l'utilisons à notre avantage."
 KMT_elitism:0 "Élitisme"
 KMT_elitism_desc:0 "Les élites doivent diriger la Chine si elle veut réussir. Les plébéiens ne sont pas en mesure de diriger la Chine et nous devons le dire clairement."
 KMT_rural_reconstruction_movement:0 "Increase Support for Rural Reconstruction"
 KMT_rural_reconstruction_movement_desc:0 "Le parti soutiendra le mouvement de reconstruction en Chine et contribuera à l'édification des communautés rurales. C'est ainsi que le peuple chinois se ralliera à notre cause."
 KMT_ensure_popular_support:0 "S'assurer du soutien de la population"
 KMT_ensure_popular_support_desc:0 "Notre propagande assurera le soutien populaire de notre régime afin que la transition vers la démocratie soit facile."
 KMT_help_establish_a_range_of_parties:0 "Aider à établir un éventail de parties"
 KMT_help_establish_a_range_of_parties_desc:0 "Le KMT doit aider les petits partis à se constituer dans toute la Chine, afin que la démocratie puisse être instaurée."
 KMT_enforce_lenninist_standards:0 "Appliquer les normes léninistes"
 KMT_enforce_lenninist_standards_desc:0 "Nous devons nous assurer que le KMT reste bolchevisé et que les normes léninistes sont respectées, en réprimant la dissidence dans le parti avant qu'elle ne puisse se former."
 KMT_prepare_national_liberation: "Préparer la libération nationale"
 KMT_the_power_of_confucious:0 "Le pouvoir de Confucius"
 KMT_the_power_of_confucious_desc:0 "Chiang commence à endoctriner le peuple chinois pour qu'il croie au pouvoir de Confucius et à ses enseignements. Cela nous ramènera à nos racines et à ce qui a fait notre grandeur."
 KMT_confucian_fascism:0 "Fascisme confucéen"
 KMT_confucian_fascism_desc:0 "Certains reprochent à Chiang d'être un fasciste confucéen. Nous ne rejetons pas ce point de vue ; en fait, un mélange des deux permettra peut-être d'obtenir d'excellents résultats."
 KMT_control_chinese_life:0 "Contrôle total sur la nouvelle vie chinoise"
 KMT_control_chinese_life_desc:0 "Nous voulons exercer un contrôle total sur la vie des Chinois et nous y veillerons. Nous appliquerons les normes de la nouvelle vie chinoise, quelles qu'en soient les conséquences."
 KMT_li_proper_rite:0 "Li"
 KMT_li_proper_rite_desc:0 "Nous mettrons l'accent sur la vertu d'un rite approprié pour le peuple chinois. Nous ferons ce que l'on attend de nous pour que la Chine soit grande et victorieuse !"
 KMT_yi_righteousness_and_justice:0 "Yi"
 KMT_yi_righteousness_and_justice_desc:0 "Nous veillerons à inculquer un sens de la droiture et de la justice dans la nouvelle vie chinoise. Cela nous aidera à constituer une main-d'œuvre intégrable."
 KMT_lian_honesty_and_cleanliness:0 "Lian"
 KMT_lian_honesty_and_cleanliness_desc:0 "Pour que la Chine soit vraiment grande, notre peuple doit être propre, tant sur le plan physique que métaphysique. Nous leur inculquerons ces vertus."
 KMT_chi_shame:0 "Chi"
 KMT_chi_shame_desc:0 "Nous installerons un sentiment de honte chez nos concitoyens, une honte qui les poussera à éviter le mal et à faire le bien."
 KMT_the_hundred_rules:0 "Les cent règles"
 KMT_the_hundred_rules_desc:0 "Avec les quatre vertus inculquées à notre peuple, nous mettrons en place les cent règles, en veillant à ce que les vertus soient respectées dans tous les aspects de la vie des Chinois !"
 KMT_the_virtues:0 "Les vertus"
 KMT_the_virtues_desc:0 "Si nous voulons instaurer une nouvelle vie chinoise, nous devons construire un peuple vertueux."
 KMT_purge_the_liberal_democrats:0 "Purger les libéraux démocrates"
 KMT_purge_the_liberal_democrats_desc:0 "Le régime va maintenant purger les démocrates libéraux qui le combattent. Nous assurerons leur destruction et la victoire de notre grand généralissime."
 KMT_prepare_for_the_national_congress:0 "Préparer le congrès national"
 KMT_prepare_for_the_national_congress_desc:0 "La situation est maintenant prête à préparer le prochain congrès national et ses conséquences pour la Chine. Il est temps d'assurer l'avenir de la Chine maintenant qu'elle est unie !"
 KMT_the_nth_national_congress:0 "Le prochain congrès national"
 KMT_the_nth_national_congress_desc:0 "Le moment est venu ! La Chine est unie et nous allons maintenant déterminer son destin ! Le Congrès national va maintenant se tenir."
 KMT_the_true_enemy:0 "Le véritable ennemi"
 KMT_the_foreign_imminent_threat:0 "La menace étrangère imminente"
 KMT_preparations_to_fight_the_soviet_imperialists:0 "Préparer la lutte contre les soviétiques"
 KMT_strike_PRC2:0 "Frapper le bassin de Yannan"
 KMT_SHX_offer2:0 "L'offre de Shanxi"
 KMT_military_planning_corps:0 "Le Corps de planification militaire"
 KMT_military_planning_corps_desc:0 "L'ARN crée un nouveau corps de planification, ce qui permet à l'armée d'être beaucoup plus efficace dans l'élaboration de plans pour faire face à nos rivaux."
 KMT_coastal_fortifications:0 "Fortifications côtières"
 KMT_ultimatum_to_the_warlords:0 "Ultimatum aux seigneurs de la guerre"
 KMT_national_defense_propaganda:0 "Propagande pour la défense nationale"
 KMT_ultimatum_to_tibet:0 "Ultimatum au Tibet"
 KMT_befriend_tibet:0 "Se rapprocher du Tibet"
 KMT_sinkiang_issue:0 "La question du Sinkiang"
 KMT_redraw_the_mcmahon_line:0 "Redessiner la ligne McMahon"
 KMT_the_state_in_one_man:0 "L'État en un seul homme"
 KMT_the_state_in_one_man_desc:0 "Chiang incarne l'État russe et le conduit à la gloire ! Il incarne la Chine en tant que personne et la conduira à la grandeur !"
 KMT_increased_nepotism:0 "Renforcer le népotisme"
 KMT_increased_nepotism_desc:0 "La clique CC renforce le népotisme dans notre État, ce qui permet à Chiang de placer ses alliés à des postes clés."
 KMT_the_eternal_dictator:0 "Le dictateur éternel"
 KMT_the_eternal_dictator_desc:0 "Chiang a enfin réussi ! Il s'est assuré tout le pouvoir en Chine ! Personne ne peut arrêter le grand dictateur !"
 KMT_no_enemy_in_any_position:0 "Pas d'ennemi, quelle que soit la position"
 KMT_no_enemy_in_any_position_desc:0 "Nos amis qui empilent le gouvernement ne suffisent pas ! Nous allons purger l'État de toute opposition."
 KMT_the_disappearing_opposition:0 "L'opposition en voie de disparition"
 KMT_the_disappearing_opposition_desc:0 "Il est temps de faire disparaître l'opposition chinoise. La Chine sera libérée de toute cette dégénérescence !"
 KMT_sideline_the_democrats:0 "Mettre les démocrates à l'écart"
 KMT_sideline_the_democrats_desc:0 "les démocrates de notre pays seront totalement mis à l'écart, leurs dernières tentatives de conquête du pouvoir seront rejetées."
 KMT_empower_the_cc_clique:0 "Renforcer la \"clique CC\""
 KMT_empower_the_cc_clique_desc:0 "Avec l'arrivée au pouvoir de Chiang, il donnera à ses chiens de poche de la clique CC les moyens de faire ce qu'il veut."
 KMT_the_sword_nephew:0 "Le neveu de l'épée"
 KMT_the_sword_nephew_desc:0 "Chiang soutiendra désormais le neveu de l'épée, qui a tant fait pour notre nation et qui a dirigé la clique ces dernières années."
 KMT_the_wife:0 "L'épouse"
 KMT_the_wife_desc:0 "Chiang renforcera Soong Mei Ling, l'épouse de Chiang, dans ses fonctions en Chine et les aidera à réussir dans le pays !"
 KMT_a_friend_in_every_position:0 "Un ami dans chaque position"
 KMT_a_friend_in_every_position_desc:0 "La clique CC s'est assurée que dans la Chine à venir, nous aurons un ami à chaque poste, ce qui nous permettra de régner en toute impunité !"
 CHI_break_kmt_tt: "Réinitialiser la mission de §Rrépression du gouvernement§! et ajouter 25 jours à chaque décision."
 CHI_lkmt_cd_5_tt: "Modifie §YLa révolution nationale du Kuomintang de gauche§! par \n Défense des divisions dans les Etats nationaux: §G+5%§!"
