 r56_chinese_gui_sichuan_tooltip:0 "La province du Sichuan est actuellement contrôlée par §Y[1116.Controller.GetNameDef]§!, qui est [1116.GetChiTooltipAlignment]."
 CHI_islamic_insurgency_tt: "§Y1 Islamic-Jihadist Corps§! division will spawn here upon the civil war, rather than §Y1 Anti-Islamic Defense Force§! division"
 KMT_hyperinflation_military_effects: "Military Effects of Hyperinflation"
 KMT_reactivate_the_big_rear_plan: "Reactivate the Big Rear Plan"
