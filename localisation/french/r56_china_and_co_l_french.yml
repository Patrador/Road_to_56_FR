 CHI_ban_lkmt_button_delayed: "Nous rétablirons l’interdiction du §9LKMT§!, les retirant du parti et de la lutte pour le pouvoir…\nStabilité §R-10%§!\nSoutien de guerre §R-5%§!\nPouvoir politique §R-25§!"
 CHI_radicalize_lkmt_button_tt: "Radicaliser le §9LKMT§!"
