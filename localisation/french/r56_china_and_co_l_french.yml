 XIC_towards_peace_across_china_r56: "Towards Peace Across China"
 XIC_towards_peace_across_china_r56_desc: "Nanjing's internal-first military policies are leaving China devastated and unprepared for the increasingly militarizing Japan. We must end our subservience in this arrangement, so that we may instead turn all of China against the true enemies of our nation: [JAP.GetNameDef]."
 XIC_force_an_end_to_the_fighting_r56: "Force an End to the Fighting"
 XIC_force_an_end_to_the_fighting_r56_desc: "Despite the communist's clear willingness to come to the negotiation table, Nanjing remains firm and unnegotiable. We must force them to the table by any means necessary."
 XIC_return_to_nanjing_r56: "Return to Nanjing"
 XIC_return_to_nanjing_r56_desc: "Despite our many differences, our mission is complete and the time has come for us to return home. A strong China must come out from the conflicts ahead; only together, with unbroken unity, may we achieve this!"
 XIC_synthesis_with_the_communists_r56: "Synthesis With the Communists"
 XIC_synthesis_with_the_communists_r56_desc: "One of the saddest tails of China's 20th century has been the absence of dialogue and the opening of violence across our revolution. While they are not perfect, the Chinese Soviet Republic is fighting for a better future than the capitalist order we've maintained. We shall fight as one to achieve prosperity for all of China!"
 XIC_finish_the_encirclement_campaign_r56: "Finish the Encirclement Campaign"
 XIC_finish_the_encirclement_campaign_r56_desc: "The Chinese Soviet Republic has been shook and beaten to the point of near-destruction. It would be a tragedy for us to end operations against them at this point of close victory. We shall march into the Yan'an base area and crush China's internal threat once and for all!"
 XIC_consolidate_authority_in_shaanxi_r56: "Consolidate Control in [622.GetName]"
 XIC_consolidate_authority_in_shaanxi_r56_desc: "We have done what so many considered impossible. With the communists shaken out of the Yan'an base area for good, it is time for us to establish a proper Kuomintang administration in the region. With China's internal enemy finally destroyed, prosperity will follow for the nation!"
 XIC_a_new_path_for_china_r56: "A New Path for China"
 XIC_a_new_path_for_china_r56_desc: "The Sixth Encirclement Campaign has propelled Zhang Xueling to dominance once more in China's north. The regime in Nanjing has failed the needs of our people; we can answer to them and unite the nation for a brighter tomorrow!"
 CHI_warlords.55.t: "Hu Hanmu Passes Away"
 CHI_warlords.55.desc: "Hu Hanmu has been a pillar of the Kuomintang and a strong supporter of Chen Jitang, granting him a lot of political legitimacy on the national scene. His loss will certainly weaken the national influence of Chen Jitang."
 CHI_warlords.55.a: "What a loss..."
