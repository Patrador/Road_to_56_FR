 CHI_puppet_warning_tt:0 "§RNotez que la Ligue de régénération nationale, le Kuomintang et les Fédéralistes sont des mouvements nationaux, donc leur gain de pouvoir dans votre pays pourrait entraîner que vous gagniez des sujets ou en deveniez un, selon qui forme en premier un gouvernement national.§!"
 CHI_coalition_tt:0 "§RNotez que cette alliance est très solide, tant que la Chine est encore menacée par le Japon, la Mandchourie ou toute autre puissance étrangère, cependant si la Chine est en paix et dans une situation où l’unité nationale imposée n’est plus nécessaire, elle peut s’effondrer. Si cela se produit par de mauvaises voies, jusqu’à un quart de la Chine pourrait les suivre.§!\n§GCependant, si les fascistes se montrent incompétents et commencent à perdre notre guerre pour le salut national, nous pourrions les saisir directement et les intégrer au KMT sans résistance et ainsi les annexer complètement.§!"
 CHI_coalition_collapse_tt:0 "§RLe pays travaillera à faire s’effondrer la coalition avec le KMT, tentant au passage de faire déserter certaines troupes et garnisons du KMT pour avancer votre position. Cela vous forcera à raviver la guerre civile chinoise.§!"
 CHI_free_territories_tt:0 "§RAinsi votre armée envahira directement le pays contrôlant votre territoire revendiqué et s’ils refusent de se rendre, vous serez forcé de faire la guerre à cause de vos troupes franchissant la frontière.§!"
