 MAN_56_event.1.t: "L'armée du Kwantung demande du soutien"
 MAN_56_event.1.desc: "L'armée du Kwantung nous a demandé de lui envoyer davantage d'armes et d'hommes pour l'aider à stabiliser la Mandchourie et à y consolider son contrôle. Que répondre à une telle offre ?"
 MAN_56_event.1.a: "Les ressources japonaises sont destinées aux Japonais"
 MAN_56_event.1.b: "Nous serions fous de refuser"
 MAN_56_event.2.t: "La NRA relance ses opérations en Mandchourie"
 MAN_56_event.2.desc: "Dans leur objectif d'unifier toute la Chine, y compris notre État, les Chinois ont décidé de relancer leurs opérations en Mandchourie, relançant cette guerre de guérilla brutale.\n\nEn d'autres termes, la Chine commence maintenant à perturber notre équilibre des pouvoirs et nous devons donc nous méfier de cette menace, voire l'éliminer."
 MAN_56_event.2.a: "Des temps malheureux sont sur nous."
 MAN_56_event.3.t: "La Mandchourie s'enflamme"
 MAN_56_event.3.desc: "Aujourd'hui, l'Empereur a annoncé qu'il était temps de chasser les Japonais. Ses forces et ses garnisons se sont donc soulevées, déclenchant une insurrection massive en Mandchourie, avec une résistance au Japon d'une ampleur jamais vue depuis l'époque de la clique du Fengtian. Seul l'avenir nous dira si Puyi et son régime survivront…"
 MAN_56_event.3.a: "Saluons tous le Qing"
 MAN_56_event.4.t: "Puyi demande notre aide"
 MAN_56_event.4.desc: "Aujourd'hui, Puyi a envoyé un émissaire secret à nos avant-postes près de la frontière avec la Mandchourie. Il a sollicité notre soutien pour son soulèvement secret, dont l'objectif est de vaincre l'influence japonaise en Mandchourie...\n Bien que nous puissions nous opposer à certains aspects de son idéologie, cela pourrait être une excellente occasion de chasser les Japonais du continent."
 MAN_56_event.4.a: "L'ennemi de mon ennemi est mon ami."
 MAN_56_event.4.b: "Excusez-moi, qui?"
 MAN_56_event.4.c: "Une telle insolence doit être signalée immédiatement !"
 MAN_56_event.5.t: "[FROM.GetNameDefCap] exige un retrait total de la Mandchourie."
 MAN_56_event.5.desc: "Ayant consolidé leur pouvoir sur leur État ces derniers temps, les Mandchous se sont lassés de notre occupation de quelques États restants. Ils exigent maintenant que nous leur rendions l’intégralité de leur pays. Que faisons-nous à ce sujet ?"
 MAN_56_event.5.a: "Ces terres appartiennent de droit aux Japonais !"
 MAN_56_event.5.b: "Ils ont déjà vaincu l’armée du Kwantung une fois, et ils gagneront de nouveau. Il serait insensé de résister !"
 MAN_56_event.6.t: "Puyi demande le renforcement des opérations de bandits"
 MAN_56_event.6.desc: "Il y a de nombreux bandits en Mandchourie financés par notre gouvernement. Pour en tirer parti, Puyi a demandé à nous aider à intensifier ces efforts afin de mettre rapidement fin à la domination japonaise."
 MAN_56_event.6.a: "Une méthode pour combattre les Japonais ? Magnifique !"
 MAN_56_event.6.b: "Cela lui donnerait trop de connaissances sur nos opérations"
 MAN_56_event.8.t: "Puyi demande l’Armée du Nord-Est"
 MAN_56_event.8.desc: "L'armée du nord-est, dirigée par Zhang Xueliang, a depuis longtemps combattu les Japonais et a envie de le faire à nouveau. Puyi a donc proposé qu'elle lui soit transférée lors du lancement de la conspiration, ce qui lui permettrait d'utiliser ces forces pour chasser les Japonais."
 MAN_56_event.8.a: "Si tel est leur souhait, bien sûr !"
 MAN_56_event.8.b: "Abandonner nos forces ? Hors de question !"
 MAN_56_event.9.t: "Puyi propose un nouvel accord"
 MAN_56_event.9.desc: "Puyi, voyant notre mécontentement face à la création d’un second gouvernement national en Chine, nous a offert un accord : en échange d’une énorme quantité d’armes, il renoncera aux revendications Qing sur toutes les terres situées en dehors de la Mandchourie, assurant ainsi la paix pour notre temps."
 MAN_56_event.9.a: "Combattre les Japonais et assurer la paix ? Allons-y !"
 MAN_56_event.9.b: "Ces terres sont toujours chinoises !"
 MAN_56_event.10.t: "Des espions rapportent des activités suspectes..."
 MAN_56_event.10.desc: "Nos espions nous ont transmis un rapport indiquant que Puyi pourrait en effet comploter contre nous. Bien qu’aucune preuve concrète n’existe, certains éléments semblent aller dans ce sens..."
 MAN_56_event.10.a: "Nous devons rester vigilants."
 MAN_56_event.11.t: "Le 125e corps rapporte une tentative de corruption..."
 MAN_56_event.11.desc: "Le 125e corps rapporte qu’une tentative de corruption a eu lieu, probablement de la part de Puyi, dans le but de les rallier à sa cause. Bien qu’il n’y ait pas de preuve définitive, certains éléments semblent aller dans cette direction..."
 MAN_56_event.11.a: "C'est noté."
 MAN_56_event.12.t: "[FROM.GetNameDefCap] affirme détenir la preuve d’une insurrection mandchoue"
 MAN_56_event.12.desc: "[FROM.GetName] a affirmé que Puyi avait cherché à établir des relations avec eux et à recevoir de l’aide pour nous renverser. Même si cela pourrait être un mensonge, nous restons sur nos gardes..."
 MAN_56_event.12.a: "La rébellion ne vaincra jamais notre nation !"
 MAN_56_event.13.t: "Le Japon cherche à déposer l’Empereur"
 MAN_56_event.13.desc: "Les Japonais semblent croire que l’Empereur conspire contre eux et ont décidé de le purger. L’Empereur doit maintenant choisir son destin..."
 MAN_56_event.13.a: "L’Empereur déclare la fin de la domination japonaise"
 MAN_56_event.13.b: "L’Empereur met fin à ses jours"
 MAN_56_event.14.t: "Le destin de la Mandchourie"
 MAN_56_event.14.desc: "Les Japonais s’étant retirés de notre nation, l’Empereur doit agir avec détermination. La pression de nombreux groupes pro-indépendance monte, tandis que l’armée du Kwantung cherche à affermir son emprise sur l’État. Le destin de la Mandchourie ne tient plus qu’à un fil."
 MAN_56_event.14.a: "L’Empereur déclare la fin de la domination japonaise"
 MAN_56_event.14.b: "L’Empereur se soumet à l’armée du Kwantung"
 MAN_56_event.15.t: "La botte de l’armée du Kwantung"
 MAN_56_event.15.desc: "L’armée du Kwantung a pris le contrôle de la Mandchourie pour le compte du Japon et la gouverne désormais, influençant lourdement toutes les fonctions de l’État et ne laissant à l’Empereur qu’un rôle de marionnette sous sa coupe.\nC’est elle qui dirige réellement ce pseudo-État.\nEt pourtant, l’armée du Kwantung n’est pas toute-puissante : elle dépend fortement de ses succès militaires. Si elle commence à perdre sur le front, son emprise sur le pays pourrait bien commencer à se déliter."
 MAN_56_event.15.a: "C'est noté..."
 MAN_56_event.16.t: "La Mandchourie cherche une coopération renforcée"
 MAN_56_event.16.desc: "La Mandchourie nous a maintenant demandé d’accomplir la prochaine étape de notre coopération : que nous abandonnions définitivement et officiellement nos revendications sur elle."
 MAN_56_event.16.a: "Cela va à l’encontre des principes de la révolution."
 MAN_56_event.16.b: "Bien sûr, portons un toast à nos nouveaux alliés !"
 MAN_56_event.17.t: "La Mandchourie sombre dans le chaos"
 MAN_56_event.17.desc: "En guerre avec la Mandchourie, celle-ci a sombré dans le chaos, entamant une lutte pour l’indépendance. Puyi mène la charge pour chasser les Japonais, nos véritables ennemis de ce petit morceau de terre du nord de la Chine."
 MAN_56_event.17.a: "Malgré cela, Puyi reste notre ennemi."
 MAN_56_event.17.b: "L’ennemi de mon ennemi est mon ami."
 MAN_bribery_tt: "Un État non infiltré existe pour que l’armée du Kwantung s’y replie."
 MAN_kwantung_guide_tt: "Le gain ou la perte d’États revendiqués ou possédés fera évoluer §YLa botte de l’armée du Kwantung§!"
 MAN_seperatism_tt: "La Mandchourie sera forcée d’emprunter une voie séparatiste..."
 MAN_send_xueliang_tt: "Zhang Xueliang et 4 % de notre armée rejoindront la Mandchourie lors du lancement de la conspiration."
