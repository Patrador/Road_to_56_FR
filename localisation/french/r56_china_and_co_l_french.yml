 KMT_democratic_establishment2: "Establishment démocratique"
 KMT_unitary_state: "État unitaire"
 KMT_unitary_state2: "État unitaire"
 KMT_unitary_state3: "État unitaire"
 KMT_unitary_state4: "État unitaire"
 KMT_national_character: "Caractère national"
 KMT_national_character2: "Caractère national"
 KMT_national_character3: "Caractère national fort"
 KMT_three_principles: "Les Trois Principes"
 KMT_three_principles2: "Les Trois Principes"
 KMT_three_principles3: "Les Trois Principes"
 KMT_three_principles4: "Les Trois Principes"
 KMT_the_young_china: "La Jeune Chine"
 KMT_the_young_china2: "La Jeune Chine"
 KMT_the_young_china3: "La Jeune Chine"
 KMT_siphon_school_funds: "Détourner les fonds scolaires"
 KMT_levy_taxes_on_the_upper_middle_class: "Taxer les classes supérieures"
 KMT_pro_education_propaganda: "Propagande pro‑éducation"
 KMT_pro_buisness_propaganda: "Propagande pro‑entreprises"
 KMT_the_national_catastrophe: "La Catastrophe Nationale"
 KMT_the_national_catastrophe_desc: "Une chose horrible est arrivée ! La Chine a été maltraitée par des étrangers et gravement blessée. Nous devons surmonter cela !"
 KMT_deal_with_unrest: "Gérer les troubles"
 KMT_deal_with_unrest_desc: "Il est temps de gérer les troubles chinois. Ils nous ont causé beaucoup de dégâts et nous devons faire face à ce grand danger pour notre nouveau régime."
 KMT_crush_the_radical_nationalists: "Écraser les nationalistes radicaux"
 KMT_crush_the_radical_nationalists_desc: "L’armée doit écraser les radicaux qui s’opposent à notre régime. Nous devons nous en occuper et sauver la Chine de ces dégénérés"
 KMT_crush_the_nra: "Écraser la ANR"
 KMT_crush_the_nra_desc: "Des restes de l'ANR se cachent dans tout le pays pour combattre nos forces. Ils seront attirés dans la bataille, combattus et vaincus, ce qui mettra nos forces à l'abri de toute attaque."
 KMT_find_chiang_kai_shek: "Trouver Chiang Kai-Shek"
 KMT_find_chiang_kai_shek_desc: "La police trouvera Chiang Kai-Shek, le recherchera et veillera à ce qu'il soit tué, ce qui entraînera une forte diminution de la résistance en Chine."
 KMT_ideological_education: "Éducation idéologique"
 KMT_ideological_education_desc: "Le gouvernement réorganisé entamera un programme d'éducation idéologique en Chine, afin d'assurer notre domination pour de bon et de rendre notre régime populaire."
 KMT_strengthen_resource_extraction: "Augmenter l'extraction des ressources"
 KMT_strengthen_resource_extraction_desc: "Nos suzerains exigent que nous augmentions l'extraction des ressources sur nos terres, afin de garantir des richesses sans commune mesure."
 KMT_improve_the_negotiating_position: "Améliorer la position de négociation"
 KMT_improve_the_negotiating_position_desc: "Après avoir amélioré notre économie, il est maintenant temps d'améliorer notre position de négociation avec nos suzerains et de commencer à réaffirmer notre souveraineté."
 KMT_china_at_the_mercy_of_our_overlord: "La Chine à la merci de notre suzerain"
 KMT_china_at_the_mercy_of_our_overlord_desc: "Nous sommes à la merci de nos suzerains et nous nous en accommoderons. Il n'y a rien que nous puissions faire pour changer les choses, alors autant être loyaux."
 KMT_seek_industrial_investments: "Recherche d'investissements industriels"
 KMT_seek_industrial_investments_desc: "Comme nous sommes absolument loyaux envers nos suzerains, nous pouvons leur demander des investissements pour améliorer l'état lamentable de notre économie."
 KMT_for_better_or_worse_the_fate_of_china: "Le destin de la Chine, pour le meilleur ou pour le pire"
 KMT_for_better_or_worse_the_fate_of_china_desc: "Il semble que le destin de la Chine soit la soumission ; nous devons l’accepter pour nous reconstruire et avancer."
 KMT_winning_the_hearts_and_minds_of_the_people: "Gagner les cœurs et les esprits"
 KMT_winning_the_hearts_and_minds_of_the_people_desc: "Il est temps de gagner les cœurs et les esprits du peuple chinois. Nous veillerons à être leur véritable priorité."
 KMT_chinese_industry_in_the_shadow_of_the_overlord: "Une industrie chinoise au‑delà de notre suzerain"
 KMT_chinese_industry_in_the_shadow_of_the_overlord_desc: "Pour reconstruire, nous devons développer une grande industrie pour la Chine, faisant de nous une grande puissance au‑delà de nos suzerains, peut‑être même capable de les surpasser un jour."
 KMT_a_beacon_of_ideology_in_the_middle_kingdom: "Un grand phare idéologique"
 KMT_a_beacon_of_ideology_in_the_middle_kingdom_desc: "Nous avons fait de la Chine un grand phare idéologique en Asie, devenant un nouveau symbole fort pour l’idéologie que nous avons adoptée."
 KMT_declare_the_peoples_republic: "Declare the People's Republic"
 KMT_declare_the_peoples_repulbic_desc: "Nous allons maintenant proclamer la République populaire, assurant la grandeur du communisme pour l’avenir."
 KMT_rise_of_the_blueshirts: "Montée des Chemises Bleues"
 KMT_rise_of_the_bleushirts_desc: "Nous avons fait de grands progrès en collaborant avec les Chemises Bleues, nous allons maintenant les intégrer au gouvernement pour sécuriser notre pouvoir."
 KMT_align_pla_remnants: "Aligner les restes de l’APL"
 KMT_align_pla_remnants_desc: "Les restes de l’APL seront alignés, garantissant leur collaboration avec notre régime à l’avenir."
 KMT_align_the_blueshirts_puppet: "Aligner les Chemises Bleues"
 KMT_align_the_blueshirts_puppet_desc: "Les Chemises Bleues seront alignées avec notre cause, apportant un grand soutien de la part de ces compatriotes fascistes."
 KMT_victory_over_the_partisans: "Victoire sur les partisans"
 KMT_victory_over_the_partisans_desc: "Nous l’avons fait, les partisans sont presque tous vaincus, peut‑être qu’un jour la Chine sera en sécurité…"
 KMT_the_armed_forces_of_the_chinese_state: "Les forces armées de l’État chinois"
 KMT_the_armed_forces_of_the_chinese_state_desc: "Nous allons maintenant réorganiser nos forces armées après la défaite de l’ANR, assurant un nouvel État pour la Chine."
 KMT_strengthen_the_high_command: "Reconstruire le haut commandement"
 KMT_strengthen_the_high_command_desc: "L’armée reconstruit son haut commandement, afin que nous puissions nous défendre."
 KMT_a_vast_army: "Une armée immense"
 KMT_a_vast_army_desc: "Nos suzerains exigent que nous construisions une armée immense, capable de fournir des forces pour nos suzerains. La Chine sera bientôt de nouveau utile."
 KMT_wjw_rule_secured: "Le collaborateur consolidé"
 KMT_wjw_rule_secured_desc: "Jing Wei a maintenant fait de la Chine une simple marionnette, consolidant son emprise sur le pays. Qui sait ce que l’avenir réserve…"
 KMT_an_auxuliary_army: "Une armée auxiliaire"
 KMT_an_auxuliary_army_desc: "Nos suzerains exigent que nous formions une armée auxiliaire, composée de forces spéciales modernes et de chars pour accomplir des missions spécialisées."
 KMT_ycp_victory: "Victoire du YCP"
 KMT_ycp_victory_desc: "Le YCP a remporté une grande victoire, en battant le KMT à l'isoloir et en ouvrant une nouvelle ère pour la Chine."
 KMT_strengthen_national_character: "Renforcer le caractère national"
 KMT_strengthen_national_character_desc: "Le caractère national de la Chine a été endommagé par le KMT et détruit par les puissances étrangères qui abusent de notre nation. Nous devons mettre fin à cette horrible évolution"
 KMT_make_china_young_again: "Redonner à la Chine sa jeunesse"
 KMT_make_china_young_again_desc: "Il est temps de rendre à la Chine sa jeunesse, afin qu'elle puisse rivaliser avec les Européens et devenir une nation développée véritablement moderne."
 KMT_strengthen_the_constitution: "Renforcer la Constitution"
 KMT_strengthen_the_constitution_desc: "Après avoir beaucoup fait pour démocratiser la Chine, nous renforcerons la constitution de la Chine afin que nous puissions réellement devenir une démocratie libérale moderne."
 KMT_secularize_the_state: "Séculariser l'État"
 KMT_secularize_the_state_desc: "La Chine doit être sécularisée et libérée de l'influence malsaine des confucianistes qui retardent le développement de la Chine."
 KMT_secularization_of_the_state: "Séculariser l'État"
 KMT_secularization_of_the_state_desc: "La Chine doit être sécularisée et libérée de l'influence malsaine des confucianistes qui retardent le développement de la Chine."
 KMT_modernize_the_nation: "Moderniser la nation"
 KMT_modernize_the_nation_desc: "Il est nécessaire de moderniser la nation pour que la Chine devienne un paradis capitaliste, capable de surpasser toutes les nations européennes."
 KMT_a_china_capable_of_outdoing_europe: "La Chine surpassera l'Europe"
 KMT_a_china_capable_of_outdoing_europe_desc: "Nous avons beaucoup fait pour moderniser la Chine et, grâce à cela, elle dépassera bientôt les Européens."
 KMT_make_china_one_again: "Réunir la Chine à nouveau"
 KMT_make_china_one_again_desc: "La Chine est divisée en raison de son passé de seigneurs de la guerre, de fédéralistes et d'autres groupes qui divisent le pays."
 KMT_expand_reach_of_the_cental_government: "Élargir le champ d'action du gouvernement central"
 KMT_full_centralization_of_the_state: "Centralisation totale de l'État"
 KMT_full_centralization_of_the_state_desc: "La Chine sera désormais entièrement centralisée, tous les pouvoirs étant transférés au gouvernement central."
 KMT_a_unitary_han_state: "Le succès du nationalisme"
 KMT_a_unitary_han_state_desc: "Notre politique de centralisation de la Chine et de construction d’une nation forte a été un grand succès !"
 KMT_vanquish_the_memory_of_the_seperatists: "Vaincre le souvenir des séparatistes"
 KMT_vanquish_the_memory_of_the_seperatists_desc: "Le gouvernement central va anéantir la mémoire des séparatistes et des seigneurs de guerre ; les ayant vaincus, leur héritage sera désormais détruit."
 KMT_extol_the_three_principles: "Exalter les Trois Principes"
 KMT_extol_the_three_principles_desc: "Notre gouvernement continue d’exalter les Trois Principes du Peuple et rassemble notre peuple autour de ces idées clés qui unissent toute la Chine !"
 KMT_the_success_of_democracy: "Le succès de la démocratie"
 KMT_the_success_of_democracy_desc: "Notre mise en place de la démocratie en Chine a été un grand succès ; bientôt, la Chine deviendra la meilleure démocratie du monde."
 KMT_the_success_of_peoples_welfare: "Le succès du Bien-être du Peuple"
 KMT_the_success_of_peoples_welfare_desc: "Notre mise en place du Bien-être du Peuple a apporté une grande prospérité à notre nation. Profitons pleinement de ce fait."
 KMT_a_strong_national_character: "Un caractère national fort"
 KMT_a_strong_national_character_desc: "Nous l’avons fait, nous avons construit un caractère national fort pour la Chine, l’unissant dans la victoire."
 KMT_expand_loyalist_support: "Étendre le soutien loyaliste"
 KMT_expand_loyalist_support_desc: "Pour survivre, nous devons nous appuyer sur le soutien de nos fidèles, les enseignants, les hommes d'affaires et les banquiers qui sont alliés à notre régime."
 KMT_delve_into_factionalism: "S'intéresser au factionnalisme"
 KMT_delve_into_factionalism_desc: "Le factionnalisme assurera la sécurité du régime, en travaillant avec nos loyalistes et en renforçant notre régime."
 KMT_an_educated_china: "Une Chine éduquée"
 KMT_an_educated_china_desc: "Avec le soutien de nos loyalistes rassemblés, le gouvernement consolidera son pouvoir dans le régime."
 KMT_china_open_for_buisness: "La Chine ouverte aux affaires"
 KMT_china_open_for_buisness_desc: "Avec le soutien de nos loyalistes rassemblés, le gouvernement consolidera son pouvoir dans le régime."
 KMT_the_liberation_of_chinese_national_character: "Libéraliser le caractère national"
 KMT_the_liberation_of_chinese_national_character_desc: "L'État a travaillé dur pour réparer les dommages causés au caractère national chinois par les oppresseurs étrangers. La Chine sera véritablement libérée."
 KMT_expand_reach_of_the_cental_government_desc: "Nous avons fini d'étendre la portée du gouvernement central et d'asseoir notre pouvoir sur tous les seigneurs de la guerre et autres régionalistes."
 KMT_a_bigger_stronger_chiang: "Un Chiang plus grand et plus fort"
 KMT_a_bigger_stronger_chiang_desc: "Dai n'est qu'une version plus grande et plus forte de Chiang, avec toutes les forces et aucune des faiblesses du vieil homme."
 KMT_build_a_cult_of_personality: "Le sauveur de la Chine"
 KMT_build_a_cult_of_personality_desc: "Dai a sauvé la Chine des Chiangistes et, à ce titre, il doit être vénéré dans son nouveau rôle. Vive le dictateur !"
 KMT_showcase_lis_prowess: "Présenter les prouesses de Dai"
 KMT_showcase_lis_prowess_desc: "Les prouesses de Dai doivent être assurées, prouvant qu'il est meilleur que Chiang dans tous les domaines."
 KMT_showcase_chiangs_degeneracy: "La dégénérescence de Chiang exposée"
 KMT_showcase_chiangs_degeneracy_desc: "Les crimes de Chiang doivent être mis en évidence, afin de préparer sa mort, en achetant la loyauté de notre peuple."
 KMT_the_fate_of_all_his_cronies: "Le destin de tous ses sbires"
 KMT_the_fate_of_all_his_cronies_desc: "Chiang a été puni, mais ses sbires ne l’ont pas encore été. Il est temps de s’en occuper en les purgeant eux aussi."
 KMT_cosolidate_power_over_the_nation: "Consolider le pouvoir sur la nation"
 KMT_cosolidate_power_over_the_nation_desc: "Nous devons consolider le pouvoir sur la Chine, brisant les liens du KMT."
 KMT_hang_chiang_kai_shek: "Hang Chiang Kai-shek"
 KMT_hang_chiang_kai_shek_desc: "We can finally hang Chiang Kai-shek, for all he has done to our blueshirts. This must be repaid."
 KMT_purge_the_chiangists: "Purger les Chiangistes"
 KMT_purge_the_chiangists_desc: "Les Chiangistes seront purgés, nous permettant de sécuriser définitivement l’État contre eux."
 KMT_strengthen_lis_power: "Renforcer le pouvoir de Dai"
 KMT_strengthen_lis_power_desc: "Il est temps de renforcer le pouvoir de Dai dans notre nation, pour s’assurer que personne ne puisse l’opposer."
 KMT_asian_bloc: "Bloc asiatique"
 KMT_asian_bloc_desc: "La Chine a entrepris de créer un nouveau bloc en Asie, afin de sécuriser nos intérêts et ceux de nos pays voisins asiatiques."
 KMT_claims_for_peace: "Revendiquer pour la paix"
 KMT_claims_for_peace_desc: "Nous avons certaines revendications auprès des Soviétiques ; nous exigeons qu’ils nous les donnent, en échange d’une paix durable entre nous."
 KMT_shared_interests_in_indochina: "Intérêts communs en Indochine"
 KMT_shared_interests_in_indochina_desc: "Nos diplomates doivent contacter les Français afin de sécuriser nos intérêts en Indochine sans les forcer à entrer en guerre au sujet du Vietnam et de ses ressources."
 KMT_realpolitik: "Realpolitik"
 KMT_realpolitik_desc: "Nos hommes d’État doivent adopter une politique de realpolitik pour la Chine, en faisant ce qu’il y a de plus pratique pour assurer l’expansion sans guerre."
 KMT_great_commander: "Bâtisseur du Royaume"
 KMT_great_commander_desc: "Dai a prouvé qu’il est plus que capable de faire de la Chine une grande nation, bâtissant un royaume et une nouvelle Chine bien plus grande que l’ancienne sous le perfide Chiang."
 KMT_manchuria_for_economic_rights: "La Mandchourie contre des droits économiques"
 KMT_manchuria_for_economic_rights_desc: "Pour parvenir à un compromis, nous proposons de laisser les Japonais conserver leurs droits économiques en Mandchourie, nous garantissant ainsi la terre sans provoquer une guerre."
 KMT_blueshirts_everywhere_always: "Des Chemises Bleues partout, toujours"
 KMT_blueshirts_everywhere_always_desc: "L’État de l’ombre fera en sorte qu’il y ait des Chemises Bleues partout, toujours, garantissant que nous ayons le contrôle total de la Chine."
 KMT_enforce_membership_for_generals: "Imposer l’adhésion pour les généraux"
 KMT_enforce_membership_for_generals_desc: "Il est enfin temps d’imposer l’adhésion aux Chemises Bleues pour tous les généraux. Cela garantira leur loyauté."
 KMT_harsh_quotas: "Quotas sévères"
 KMT_harsh_quotas_desc: "Nos agents imposeront des quotas sévères au peuple chinois, assurant la survie à long terme de la Chine."
 KMT_promote_the_militarists: "Promouvoir les militaristes"
 KMT_promote_the_militarists_desc: "Il est temps de promouvoir les militaristes dans notre armée, garantissant que nous ayons un contrôle total sur l’armée."
 KMT_blueshirts_in_every_group: "Des Chemises Bleues dans chaque groupe"
 KMT_blueshirts_in_every_group_desc: "Nous devons nous assurer qu’il y ait des Chemises Bleues dans chaque groupe, afin qu’ils garantissent le contrôle du gouvernement."
 KMT_ready_the_clases_for_war: "Préparer les classes à la guerre"
 KMT_ready_the_clases_for_war_desc: "Les classes doivent être préparées à la guerre, garantissant que la Chine sera prête lorsque le moment viendra."
 KMT_work_targets: "Objectifs de travail"
 KMT_work_targets_desc: "Nos agents établissent des quotas de travail pour le peuple chinois, garantissant qu’ils s’engagent pleinement à travailler d’arrache-pied pour le régime."
 KMT_blueshirts_overseers: "Surveillants Chemises Bleues"
 KMT_blueshirts_overseers_desc: "L’État de l’ombre surveille désormais le peuple chinois, garantissant qu’il soit pleinement engagé dans son travail."
 KMT_the_great_flight: "La Grande Fuite"
 KMT_the_great_flight_desc: "Une grande tragédie est survenue… nous avons été forcés de fuir le continent ; il semble que les communistes aient remporté une victoire. Mais bientôt, nous reviendrons."
 KMT_finalize_asset_evacuation: "Finaliser l’évacuation des biens"
 KMT_finalize_asset_evacuation_desc: "Nous avons rapatrié de nombreux biens industriels à Taïwan. Nous allons les utiliser pour construire notre industrie."
 KMT_secure_foreign_aid: "Sécuriser l’aide étrangère"
 KMT_secure_foreign_aid_desc: "Nos diplomates travaillent à obtenir une aide étrangère des grandes puissances alliées qui nous soutiennent. Cela réparera notre industrie et nous permettra de dépasser [CUG.GetNameDef]."
 KMT_save_national_treasure: "Sauver le trésor national"
 KMT_save_national_treasure_desc: "Nous avons sauvé une grande quantité de trésors nationaux et allons maintenant les exposer au peuple et à l’armée, leur donnant la motivation de se battre et de défendre cela contre les porcs communistes."
 KMT_the_last_bastion: "Le dernier bastion"
 KMT_the_last_bastion_desc: "Nous sommes devenus le dernier bastion du véritable gouvernement chinois. Nous sauverons la Chine des porcs du continent !"
 KMT_fortify_the_coast: "Fortifier la côte"
 KMT_fortify_the_coast_desc: "Ce n’est qu’une question de temps avant que [CUG.GetNameDef] ne nous surpasse navalement, nous devons donc fortifier la côte pour garantir que nos îles ne tomberont jamais."
 KMT_protect_the_streight: "Protéger le détroit"
 KMT_protect_the_streight_desc: "Nos possessions à Hainan sont menacées par une attaque terrestre. Il est nécessaire de fortifier le détroit pour garantir que les armes modernes chinoises ne nous briseront pas."
 KMT_prepare_to_retake_the_homeland: "Préparer la reconquête de la patrie"
 KMT_prepare_to_retake_the_homeland_desc: "Il est temps de préparer la reconquête de la patrie ; le continent sera libéré des oppresseurs et le KMT reviendra !"
 KMT_plan_the_reconquest: "Planifier la reconquête"
 KMT_plan_the_reconquest_desc: "Nous commençons maintenant à planifier la reconquête du continent. Bientôt, nos hommes assureront notre victoire finale grâce à ces plans méticuleux. L’opération Hope sera un immense succès !"
 KMT_march_forth: "En avant"
 KMT_march_forth_desc: "We now march forth and retake the Homeland! It is but a matter of days until Nanjing and Beiping are free again."
 KMT_a_glorious_return: "Un retour glorieux"
 KMT_a_glorious_return_desc: "Nous l’avons fait ! Nous avons effectué un retour glorieux ! La Chine est de nouveau libre !"
 KMT_build_up_cells_in_the_mainland: "Développer des cellules sur le continent"
 KMT_build_up_cells_in_the_mainland_desc: "Un grand effort sera mené pour développer des cellules sur le continent, le rendant vulnérable à une attaque de notre part."
 KMT_rebolshevize_the_NRA: "Rebolcheviser la NRA"
 KMT_rebolshevize_the_NRA_desc: "Il est nécessaire de rebolcheviser la NRA, assurant son unité et sa loyauté envers le KMT."
 KMT_reconsider_army_doctrine: "Reconsidérer la doctrine de l’armée"
 KMT_reconsider_army_doctrine_desc: "L’armée doit reconsidérer sa doctrine. Nous n’avons plus les hordes du continent et devons répondre à des besoins bien différents."
 KMT_porcupine_strategy: "Stratégie du porc-épic"
 KMT_porcupine_strategy_desc: "Nous devons nous concentrer sur la défense de notre patrie ; ainsi, nos forces adopteront la stratégie du porc-épic, garantissant la défense permanente de notre île."
 KMT_modern_arms: "Armes modernes"
 KMT_modern_arms_desc: "Il est temps d’adopter une politique d’armement moderne, utilisant des chars et une technologie similaire pour surpasser le gouvernement principal de Chine, permettant des offensives audacieuses et d’excellents ratios de pertes."
 KMT_urban_guerilla_warfare: "Guerre urbaine de guérilla"
 KMT_urban_guerilla_warfare_desc: "Notre population sera formée à l’art de la guérilla, nous permettant de défendre nos villes quoi qu’il arrive."
 KMT_modernize_technology: "Moderniser la technologie"
 KMT_modernize_technology_desc: "Nous devons moderniser notre technologie, nous permettant de dépasser le gouvernement principal sur le long terme et d’assurer notre victoire finale."
 KMT_tanks_good_both_here_and_there: "Des chars, bons ici comme là-bas"
 KMT_tanks_good_both_here_and_there_desc: "Les chars sont utiles tant sur nos îles que sur le continent. Nos troupes doivent s’enfoncer davantage dans cet investissement et fabriquer les meilleurs chars d’Asie."
 KMT_well_trained_infantry: "Infanterie bien entraînée"
 KMT_an_untakeable_island: "Une île imprenable"
 KMT_an_untakeable_island_desc: "L’armée garantit que nos îles sont imprenables, que l’État vivra pour toujours, quel que soit le destin du continent."
 KMT_a_modern_tank_army: "Une armée de chars moderne"
 KMT_a_modern_tank_army_desc: "Le haut commandement veillera à ce que nous ayons une armée de chars moderne, qui un jour traversera le détroit et apportera une grande victoire au KMT."
 KMT_skilled_offensive_generals: "Généraux offensifs compétents"
 KMT_skilled_offensive_generals_desc: "Nous devons nous assurer que nos généraux sont compétents et capables de gagner des batailles pour nous."
 KMT_accept_the_inevitable: "Accepter l’inévitable"
 KMT_accept_the_inevitable_desc: "Il est temps d’accepter l’inévitable : nous ne pourrons jamais retourner sur le continent. Préparons-nous à déclarer l’indépendance."
 KMT_declare_independence: "Déclarer l’indépendance"
 KMT_declare_independence_desc: "C’est le moment, déclarons l’indépendance, au diable les continentaux ! Gloire au nouveau régime !"
 KMT_a_national_congress_through_the_despair: "Un congrès national à travers le désespoir"
 KMT_a_national_congress_through_the_despair_desc: "Le KMT doit tenir un congrès national à travers le désespoir ; nous veillerons à ce qu’il reste solide et fort durant cette période difficile."
 KMT_permanent_marshal_law: "Loi martiale permanente"
 KMT_permanent_marshal_law_desc: "Avec notre État sécurisé, Chiang déclare la loi martiale ; la Chine sera placée sous le contrôle permanent du Généralissime. La dissidence ne sera pas tolérée."
 KMT_lift_the_veil: "Lever le voile"
 KMT_lift_the_veil_desc: "Le moment est venu de lever le voile de la loi martiale dans notre pays. Nous devons apporter la victoire finale des Trois Principes !"
 KMT_educate_the_people: "Éduquer le peuple"
 KMT_educate_the_people_desc: "Le peuple chinois doit être éduqué, en lui enseignant des connaissances modernes, et en l’aidant à apprendre et à faire de la science."
 KMT_restart_the_white_terror: "Relancer la Terreur Blanche"
 KMT_restart_the_white_terror_desc: "Le moment est venu de relancer la Terreur Blanche, consolidant le pouvoir du Généralissime. Les séparatistes et les communistes seront écrasés !"
 KMT_seek_revenge_for_the_feb28_incident: "Venger le 28 février"
 KMT_seek_revenge_for_the_feb28_incident_desc: "Chiang cherche à venger notre peuple, qui a été attaqué par des séparatistes et des communistes après que nous ayons repris l’île. Une telle insolence ne sera pas tolérée."
 KMT_purge_communists: "Purger les communistes"
 KMT_purge_communists_desc: "Il est de la plus haute priorité de purger les communistes sur notre île ; ce ne sont que des traîtres à la nation et ils doivent disparaître."
 KMT_deal_with_the_locals: "Gérer les locaux"
 KMT_deal_with_the_locals_desc: "Nos troupes s’occupent des locaux qui cherchent à nous renverser. Le séparatisme ne sera pas toléré !"
 KMT_punish_anti_state_activities: "Punir les activités anti-étatiques"
 KMT_punish_anti_state_activities_desc: "Toutes les activités allant à l’encontre de l’État doivent être punies, permettant à notre régime d’être sécurisé de façon permanente."
 KMT_deal_with_taiwanese_seperatists: "Traiter avec les séparatistes taïwanais"
 KMT_deal_with_taiwanese_seperatists_desc: "Les séparatistes doivent être éliminés de manière permanente si nous voulons survivre à long terme. Nous en finirons avec eux…"
 KMT_consolidate_KMT_rule: "Consolider la domination du KMT"
 KMT_consolidate_KMT_rule_desc: "Chiang doit consolider la domination du KMT, nous permettant d’être en sécurité sous un régime stable."
 KMT_hail_the_national_savior: "Gloire au Sauveur de la Nation"
 KMT_hail_the_national_savior_desc: "All hail the National Savior, the man who has brought us over here and saved us! All Hail Chiang Kai-shek!"
 KMT_form_the_TGC: "Former le TGC"
 KMT_form_the_TGC_desc: "Le KMT forme le Taiwan Garrison Command, nous permettant de trouver et de renifler les traîtres afin que personne ne nous livre aux communistes."
 KMT_limited_opposition: "Opposition limitée"
 KMT_limited_opposition_desc: "Pour la stabilité, nous autorisons une opposition limitée pour des partis comme le CDSP, qui nous soutiendront en échange et deviendront de simples marionnettes, légitimant notre régime."
 KMT_executive_rule: "Règle exclusive"
 KMT_executive_rule_desc: "Nous allons instaurer la Rule Exécutive, nous permettant de faire et de ne pas faire ce que nous voulons."
 KMT_mass_pervasive_monitoring: "Surveillance massive et omniprésente"
 KMT_mass_pervasive_monitoring_desc: "Le TGC mettra en place une surveillance massive, nous permettant de voir toute trahison avant qu’elle n’arrive. La Chine sera sécurisée !"
 KMT_sham_criminal_trials: "Simulacres de procès criminels"
 KMT_sham_criminal_trials_desc: "Le TGC tiendra des “procès” pour les traîtres nationaux, nous donnant de la légitimité tout en massacrant les traîtres."
 KMT_suspend_basic_human_rights: "Suspendre les droits humains fondamentaux"
 KMT_suspend_basic_human_rights_desc: "Le TGC suspendra les droits des traîtres, car ils ne les méritent pas et ces droits entravent la justice ! Le TGC aura une main ferme."
 KMT_imbue_them_in_the_people: "Insuffler les vertus au peuple"
 KMT_imbue_them_in_the_people_desc: "Le peuple doit apprendre à consacrer sa vie aux vertus ; ainsi, Chiang commence une propagande d’État plus intense pour implanter cela en eux."
 KMT_influencing_the_people: "Influencer le peuple"
 KMT_blue_coup_tt: "Les §8Chemises Bleues§! organiseront un coup d’État et tenteront d’imposer leur propre vision pour la Chine dans le mois suivant l’apparition des déclencheurs…"
 KMT_prop_done_tt: "Toutes les décisions §YInfluencer le Peuple§! ont été complétées"
 KMT_party_bop_tt: "Cet effet ne se produira que tant que §YConsolider la suprématie du Parti§! n’a pas été complété."
 KMT_CKS_bop_tt: "Cet effet ne se produira que tant que §YDéclarer la loi martiale§! n’a pas été complété."
 KMT_starting_tt: "Le §2Kuomintang§! a remporté une victoire en Chine centrale et est devenu le gouvernement chinois reconnu internationalement, mais seul le temps dira s’ils réussiront ou s’ils périront face à des ennemis internes ou externes…"
 KMT_beijing_tt: "Les §8Chemises Bleues§! ont été dissoutes par Chiang"
 KMT_consolidate_chiangs_control: "Consolider le contrôle de Chiang"
 KMT_consolidate_chiangs_control_desc: "Chiang consolidera son contrôle sur la Chine, apportant un avenir radieux et loyal pour notre nation."
 KMT_well_trained_infantry_desc: "Nous devons entraîner notre infanterie en profondeur, garantissant qu’elle soit capable de combattre et de tenir face à des ennemis supérieurs, assurant ainsi notre survie."
 KMT_secure_mongolia_and_tuva: "Sécuriser la Mongolie et le Touva"
 KMT_secure_mongolia_and_tuva_desc: "Le moment est venu de sécuriser la Mongolie et le Touva face aux Soviétiques, garantissant l’intégrité de notre nouvel empire."
 KMT_undo_the_armur_annextion: "Annuler l’annexion de l’Amour"
 KMT_undo_the_armur_annextion_desc: "Les Russes ont volé de grandes parties de nos terres, et il est de notre devoir de défaire cela et de les reprendre."
 KMT_restore_the_tributary_system: "Restaurer le système tributaire"
 KMT_restore_the_tributary_system_desc: "C’est notre droit divin de restaurer le système tributaire et d’assurer notre domination sur l’Asie."
 KMT_the_empire_plan: "Le Plan Impérial"
 KMT_the_empire_plan_desc: "Le moment est venu d’entamer un nouveau plan, celui de construire un grand Empire chinois."
 KMT_demand_manchuria: "Exiger la Mandchourie"
 KMT_demand_manchuria_desc: "Nous exigeons maintenant le retour de la Mandchourie. Nous devons être autorisés à prendre le contrôle de tout l’État chinois."
 KMT_expand_the_treaty: "Étendre le traité"
 KMT_expand_the_treaty_desc: "Nous allons étendre notre alliance au-delà de notre seul pays. Cela élargira grandement notre alliance."
 KMT_declare_the_empire: "Déclarer l’Empire"
 KMT_declare_the_empire_desc: "Notre plan a été un grand succès, le moment est venu de déclarer un nouvel empire. Gloire à la Chine !"
 KMT_hegemony_over_indochina: "Hégémonie sur l’Indochine"
 KMT_hegemony_over_indochina_desc: "Dai Li exige la remise de l’Indochine entre nos mains et la sécurisation de notre nouvelle sphère impériale."
 KMT_the_tianmen_square_coup: "Le Coup de Pékin"
 KMT_the_tianmen_square_coup_desc: "Nous avons organisé un coup d’État à Pékin, nous permettant de prendre le contrôle du gouvernement chinois. Gloire aux Chemises Bleues !"
 KMT_brilliant_genius: "Maître rusé"
 KMT_brilliant_genius_desc: "Avec son coup d’État et la prise de contrôle de la Chine, Dai a vraiment montré qu’il est un maître rusé et que personne ne pourra stopper son ascension au pouvoir."
 KMT_they_will_know_fear: "Nos ennemis vaincus"
 KMT_they_will_know_fear_desc: "La peur sera imposée à nos ennemis, garantissant qu’aucune puissance étrangère ne pourra agir contre nous. Ils seront vaincus par nos chars et détruits sur le champ de bataille."
 KMT_leader_of_the_nation_and_the_people: "Un homme du peuple"
 KMT_leader_of_the_nation_and_the_people_desc: "Dai a montré maintes et maintes fois qu’il n’est pas comme les anciennes élites, il est un homme du peuple et celui-ci doit l’aimer."
 KMT_seize_landholder_assets: "Saisir les biens des propriétaires terriens"
 KMT_seize_landholder_assets_desc: "Nous saisissons maintenant les biens des propriétaires terriens et de tels traîtres, renforçant encore davantage le plan."
 KMT_bind_the_army_into_the_state: "Lier l’armée à l’État"
 KMT_bind_the_army_into_the_state_desc: "C’est l’armée qui a apporté notre glorieuse révolution ! Rendons-lui hommage pour ses grandes actions pour notre pays."
 KMT_choosing_a_new_chairman: "Choisir un président"
 KMT_choosing_a_new_chairman_desc: "Notre gouvernement provisoire se réunira à nouveau pour établir un dirigeant pour la nouvelle Chine. Tandis que Li Lisan cherche à maintenir sa domination sur le Parti, certains se demandent si cela sera vraiment possible étant donné la désapprobation soviétique envers lui."
 KMT_li_lisan: "Président Li"
 KMT_li_lisan_desc: "Li Lisan l’a fait ! Lui, le maître de la révolution chinoise, a réussi à consolider son pouvoir. Gloire au nouveau Président !"
 KMT_chinese_five_year_plan: "Un plan quinquennal chinois"
 KMT_chinese_five_year_plan_desc: "Les Soviétiques ont connu un immense succès avec leur plan quinquennal. Nous en ferons un nous aussi afin de prospérer."
 KMT_consolidate_control_over_industry: "Consolider le contrôle sur l’industrie"
 KMT_consolidate_control_over_industry_desc: "Nous allons consolider le contrôle sur l’industrie chinoise, en nationalisant de larges portions pour le bien de notre peuple."
 KMT_support_trade_unions: "Soutenir les syndicats"
 KMT_support_trade_unions_desc: "Les syndicats ont été très utiles dans notre révolution. Nous les remercierons pour leur soutien en maintenant leur indépendance."
 KMT_enforce_trade_union_compliance: "Imposer la conformité syndicale"
 KMT_enforce_trade_union_compliance_desc: "Bien que les syndicats soient très utiles à notre Révolution pour l’instant, nous devons empêcher qu’ils menacent notre pouvoir. Nous devons imposer leur obéissance à notre autorité."
 KMT_build_up_the_red_army: "Développer l’Armée Rouge"
 KMT_build_up_the_red_army_desc: "Notre nouvelle Armée rouge est en désordre après notre révolution chaotique. Nous devons régler cela. Le moment est venu d’investir dans nos troupes et d’assurer leur survie."
 KMT_a_great_purge: "Une révolution culturelle"
 KMT_a_great_purge_desc: "Notre régime est plein d’ennemis, internes comme externes. Nous devons nous en occuper rapidement."
 KMT_deal_with_the_beurgeois: "Traiter avec la bourgeoisie"
 KMT_deal_with_the_beurgeois_desc: "Il est nécessaire de traiter avec les bourgeois fascistes et capitalistes, qui nous ont si longtemps opposés. Ces traîtres à la classe ouvrière périront !"
 KMT_consolidate_power_over_the_state: "Consolider le pouvoir sur l’État"
 KMT_consolidate_power_over_the_state_desc: "Le Président consolide son pouvoir sur l’État, garantissant la défaite de notre opposition et enracinant la règle du Président."
 KMT_prepare_to_drive_out_foreign_influence: "Préparer l’expulsion de l’influence étrangère"
 KMT_a_new_kmt_thinktank:0 "Un nouveau think tank du KMT"
 KMT_a_new_kmt_thinktank_desc:0 "Nous allons créer un nouveau think tank pour notre grand parti afin de diffuser ce que nous considérons comme la pensée correcte, pour que ceux qui suivent notre voie prospèrent !"
 KMT_increase_military_r_and_d:0 "Augmenter la recherche militaire"
 KMT_increase_military_r_and_d_desc:0 "L’armée exige que nous augmentions la R&D militaire, maintenant que Wei-Kuo est là pour nous guider. Cela améliorera grandement nos chances de moderniser nos forces armées !"
 KMT_invite_eurofacist_scientists:0 "Inviter des scientifiques eurofascistes"
 KMT_invite_eurofacist_scientists_desc:0 "Pour améliorer notre armée, Li s’inspire de ceux qui ont inspiré notre idéologie, nous permettant d’importer certains de leurs scientifiques afin qu’ils nous aident à développer de nouvelles armes formidables !"
 KMT_counter_asian_imperialism:0 "Prioriser l’impérialisme asiatique"
 KMT_counter_asian_imperialism_desc:0 "Bien que l’Asie ait historiquement été victime de l’impérialisme depuis la chute des Qing, les Japonais ont eux aussi commis ces méfaits ! Ils doivent être arrêtés !"
 KMT_korean_liberation:0 "Exiger la libération de la Corée"
 KMT_korean_liberation_desc:0 "Nous exigeons enfin la libération de la Corée et libérons enfin ce peuple de ses oppresseurs ! La Corée sera libre !"
 KMT_cdsp_victory:0 "Victoire du PDSC"
 KMT_cdsp_victory_desc:0 "Le Parti Démocratique Socialiste de Chine a remporté une grande victoire et a évincé le KMT du pouvoir, avec Carsun Chiang les menant à cette grande victoire."
 KMT_the_foundations_of_chinese_fedralism:0 "Les fondations du fédéralisme chinois"
 KMT_the_foundations_of_chinese_fedralism_desc:0 "Nous allons poser les bases du fédéralisme chinois et commencer à orienter le pays dans cette direction, permettant une gouvernance meilleure et plus juste."
 KMT_analyze_the_1922_constitution_attempt:0 "Analyser la tentative de constitution de 1922"
 KMT_utilize_our_riches: "Utiliser nos richesses"
 KMT_utilize_our_riches_desc: "Nous allons maintenant utiliser nos richesses pour nous-mêmes, en finançant de nombreux établissements éducatifs et en apportant un avenir prospère."
 KMT_analyze_the_1922_constitution_attempt_desc:0 "Carsun avait déjà essayé d’instaurer une constitution fédérale en 1922. Il revisite aujourd’hui ce travail et l’utilisera pour améliorer l’actuelle."
 KMT_prepare_changes_to_the_kmt_constitution:0 "Préparer des changements à la constitution du KMT"
 KMT_prepare_changes_to_the_kmt_constitution_desc:0 "Carsun préparera des changements à la constitution basés sur la tentative de 1922 et d’autres sources. Une fois la paperasse terminée, le parlement n’aura qu’à adopter ces changements."
 KMT_strengthen_larger_minorities:0 "Renforcer les grandes minorités"
 KMT_strengthen_larger_minorities_desc:0 "Nous appliquons nos principes fédéralistes et les renforçons, particulièrement là où les minorités sont nombreuses, permettant de traiter les populations selon leurs besoins."
 KMT_tweak_province_borders:0 "Ajuster les frontières provinciales"
 KMT_tweak_province_borders_desc:0 "Le moment est venu d’ajuster les frontières de nos provinces pour mieux suivre les lignes ethniques, permettant un fédéralisme plus efficace et cohérent avec notre mise en œuvre de la loi."
 KMT_pass_the_changes:0 "Faire passer les changements"
 KMT_pass_the_changes_desc:0 "Nous allons faire adopter nos nouveaux changements à la constitution, maintenant qu’ils sont prêts. Le fédéralisme règnera véritablement en Chine !"
 KMT_break_the_kmt_stranglehold:0 "Briser l’emprise du KMT"
 KMT_break_the_kmt_stranglehold_desc:0 "Nous devons travailler à briser l’emprise du KMT sur la Chine et libérer le peuple chinois de leur domination."
 KMT_showcase_chiangs_noncompliance:0 "Mettre en évidence la non‑conformité de Chiang"
 KMT_showcase_chiangs_noncompliance_desc:0 "Chiang a fait de nombreuses choses qui vont contre notre constitution. Le nouveau régime montrera cela au peuple pour discréditer le KMT à leurs yeux."
 KMT_wang_jingweis_rise:0 "L'ascension de Wang Jingwei"
 KMT_wang_jingweis_rise_desc:0 "With Chiang dead, it is time for Wang Jingwei to take over the reins of the state! let us hope he leads us to prosperity!"
 KMT_consolidate_the_new_regime:0 "Consolider le nouveau régime"
 KMT_consolidate_the_new_regime_desc:0 "In the chaos of the wake of Chiang's death, we must act fast and decisively, securing China under our new state."
 KMT_preempt_the_inevitable: "Prévenir l'inévitable"
 KMT_preempt_the_inevitable_desc:0 "Le Japon vient nous chercher et il est impossible que la Chine puisse gagner une telle guerre. Nous devons rechercher un rapprochement et une solution pacifique."
 KMT_the_taiwan_accords:0 "Les accords de Taïwan"
 KMT_the_taiwan_accords_desc: "Puisque le Japon a accepté de discuter, nous nous rencontrerons à Taïwan, où Wang proposera un accord nous permettant d'accéder à la technologie japonaise pour la copier, et nous permettant de rattraper notre retard technologique tout en leur cédant une partie de notre économie."
 KMT_savior_of_all_china:0 "Sauveur de toute la Chine"
 KMT_savior_of_all_china_desc:0 "Wang Jingwei has become the Savior of all China and united all its people. All hail Wang Jingwei!"
 KMT_buy_and_sell_japanese: "Acheter et vendre des produits japonais"
 KMT_buy_and_sell_japanese_desc: "Nous devons nous efforcer d'acheter et de vendre des produits japonais, ce qui nous permettra de les copier et d'accéder ainsi à leur technologie. Nous allons maintenant envoyer au Japon un accord visant à renforcer notre traité afin d'atteindre cet objectif."
 KMT_scientist_exchange_programmes: "Programmes d'échange de scientifiques"
 KMT_scientist_exchange_programmes_desc: "Nous lancerons des programmes d'échange entre nos scientifiques et les Japonais moyennant une petite somme d'argent. Cela nous permettra de copier rapidement leur technologie et de mieux connaître les progrès de notre jeu de rattrapage."
 KMT_resources_for_research: "Ressources pour la recherche"
 KMT_resources_for_research_desc: "cNos entreprises proposeront un accord commercial lucratif au Japon en échange d'une partie de leurs recherches. Cela nous permettra de les rattraper et de les dépasser plus rapidement."
 KMT_labor_for_expertise: "Le travail pour l'expertise"
 KMT_labor_for_expertise_desc: "Nos centres pour l'emploi proposent désormais aux Japonais un marché, en leur offrant notre main-d'œuvre en échange de leur expertise, ce qui contribue à stimuler notre économie à long terme."
 KMT_invite_japanese_investors: "Inviter des investisseurs japonais"
 KMT_invite_japanese_investors_desc: "Nous aurions tout à gagner à inviter des investisseurs japonais en Chine et à en tirer des avantages décisifs."
 KMT_the_dragon_swallows_the_sun: "Le dragon avale le soleil"
 KMT_the_dragon_swallows_the_sun_desc: "Nous avons réussi ! Nous avons dépassé le Japon, nous nous sommes placés au premier rang de ces partenariats et nous sommes devenus les maîtres de l'Asie."
 KMT_the_path_of_war: "Le chemin de la guerre"
 KMT_the_path_of_war_desc:0 "Une fois notre suprématie assurée, la Chine peut s'engager sur la voie de la guerre, cherchant à évincer les Japonais par la force militaire."
 KMT_lands_or_war: "Des terres ou la guerre"
 KMT_lands_or_war_desc: "Nous envoyons maintenant un ultimatum au Japon, étant en position de force, et exigeons qu’ils se retirent de nos terres essentielles."
 KMT_carte_blanche_in_manchuria: "Carte blanche en Mandchourie"
 KMT_carte_blanche_in_manchuria_desc: "Nous exigeons que les Japonais respectent notre revendication en Mandchourie et nous donnent carte blanche pour y pacifier le régime et unir la Chine."
 KMT_the_masters_of_asia: "Les maîtres de l’Asie"
 KMT_the_masters_of_asia_desc: "Nous et les Japonais sommes les maîtres de l’Asie. Si nous coopérons, et peut‑être devenons alliés un jour, personne ne pourra nous arrêter."
 KMT_manchuria_for_continued_economic_influence: "La Mandchourie contre une influence économique continue"
 KMT_manchuria_for_continued_economic_influence_desc:0 "La Chine demande aux Japonais de lui rendre la Mandchourie, en échange de conserver une partie des profits de cette région. Cela évitera la guerre et assurera une coopération durable."
 KMT_begin_reforming_the_nation: "Commencer à réformer la nation"
 KMT_begin_reforming_the_nation_desc: "Nous pouvons enfin commencer à réformer la Chine et la transformer en paradis social comme Jingwei le souhaite."
 KMT_align_the_blueshirts:0 "Aligner les Chemises Bleues"
 KMT_align_the_blueshirts_desc: "Jingwei a décidé d’aligner les Chemises Bleues afin de renforcer le régime et disposer d’une nouvelle force si le Japon nous trahit."
 KMT_purge_suriviving_communists: "Purger les communistes survivants"
 KMT_purge_suriviving_communists_desc: "Nous sommes tenus par l’honneur de purger les communistes et traîtres survivants et d’assurer leur élimination. La Chine doit être débarrassée de cette vermine !"
 KMT_the_true_enemies_of_china: "Les vrais ennemis de la Chine"
 KMT_the_true_enemies_of_china_desc: "La Chine avant tout"
 KMT_china_above_all: "La Chine doit s’occuper de ses véritables ennemis : non pas les Japonais ni les étrangers, mais les communistes, qui doivent être éliminés pour que la Chine survive."
 KMT_china_above_all_desc: "Le chemin de la paix"
 KMT_the_path_of_peace: "Le chemin de la paix"
 KMT_the_path_of_peace_desc: "Avec notre suprématie assurée, nous tentons de pousser les Japonais hors de nos terres de manière ferme mais pacifique, peut‑être même en ouvrant la voie à une future coopération."
 KMT_lands_for_bases: "Des terres contre des bases"
 KMT_lands_for_bases_desc: "L’État peut proposer un accord aux Japonais : ils se retireront de nos terres en échange de bases pour leur marine. Nous espérons ne pas avoir à utiliser des moyens plus… persuasifs."
 KMT_sun_yat_sens_true_heir: "Le véritable héritier de Sun Yat‑Sen"
 KMT_sun_yat_sens_true_heir_desc:0 "Alors que Chiang prétendait être l’héritier de Sun Yat‑Sen, c’est faux : il prouvera au peuple que le véritable héritier, c’est lui !"
 KMT_reshuffle_the_courts:0 "Réorganiser les tribunaux"
 KMT_reshuffle_the_courts_desc:0 "Le régime réorganisera les tribunaux, y plaçant de nombreux membres neutres ou du parti, brisant le contrôle du KMT sur ces institutions pour garantir un avenir libre de leur influence."
 KMT_renew_the_beaurocracy:0 "Renouveler la bureaucratie"
 KMT_renew_the_beaurocracy_desc:0 "Le régime renouvellera la bureaucratie et ses fonctionnaires, en éliminant l’influence du KMT dans les institutions de l’État. Bientôt, il n’y aura plus aucun loyaliste du KMT dans ces postes."
 KMT_a_new_establishment:0 "Un nouvel establishment"
 KMT_a_new_establishment_desc:0 "Le régime peut maintenant travailler à construire un nouvel établissement en Chine, et devenir ce que le KMT fut autrefois, et assurer un pouvoir éternel sur tous les aspects de l’État chinois."
 KMT_true_free_democracy:0 "Véritable Démocratie Libre"
 KMT_true_free_democracy_desc:0 "Le régime travaillera à mettre en place de nouvelles mesures pour s’assurer qu’aucun parti ne puisse jamais prendre la même place en Chine que le KMT autrefois ou dégrader à nouveau notre système démocratique."
 KMT_train_the_idealist_in_politics:0 "Former l’Idéaliste à la Politique"
 KMT_train_the_idealist_in_politics_desc:0 "Nos professionnels doivent travailler à former Carsun Chiang aux méthodes de la politique, lui permettant de devenir de plus en plus compétent et de gérer son idéalisme irréaliste."
 KMT_support_the_common_man:0 "Soutenir l’Homme du Peuple"
 KMT_support_the_common_man_desc:0 "Il est de la plus haute priorité que nous soutenions l’homme du peuple en Chine, en veillant à ce que les gens du quotidien puissent réellement être aidés et pris en charge."
 KMT_a_mixed_economy:0 "Une Économie Mixte"
 KMT_a_mixed_economy_desc:0 "Pour soutenir l’homme du peuple, la Chine commence à adopter une économie mixte, soutenant les entreprises et la prospérité et permettant que le peuple soit pris en charge même s’il n’a pas personnellement les fonds."
 KMT_social_welfare:0 "Aide Sociale"
 KMT_social_welfare_desc:0 "Dans le cadre de notre économie mixte, l’État commencera à mettre en œuvre une politique d’aide sociale. Cela nous permettra de prendre soin de nos travailleurs."
 KMT_public_health:0 "Santé Publique"
 KMT_public_health_desc:0 "L’État, dans le cadre de notre programme social, veillera à distribuer des soins de santé publics, permettant aux pauvres et à nos travailleurs de rester en bonne santé, ce qui profitera à notre économie à long terme."
 KMT_social_security:0 "Sécurité Sociale"
 KMT_social_security_desc:0 "L’État doit travailler à mettre en place davantage de sécurité sociale, permettant aux travailleurs qui ont perdu leur emploi dans notre industrialisation rapide de pouvoir encore mettre du pain sur la table."
 KMT_reducing_income_equality:0 "Réduire les Inégalités de Revenus"
 KMT_reducing_income_equality_desc:0 "Nous l’avons fait ! Le peuple est maintenant réellement pris en charge car les riches et les pauvres ne sont plus si différents. Il semble que les inégalités de revenus puissent enfin être réduites à un niveau tolérable."
 KMT_socialize_the_railways:0 "Nationaliser les Chemins de Fer"
 KMT_socialize_the_railways_desc:0 "Il est temps de nationaliser les chemins de fer dans toute la Chine, permettant aux gens de se déplacer d’un endroit à un autre à moindre coût et efficacement."
 KMT_socialize_the_mines:0 "Nationaliser les Mines"
 KMT_socialize_the_mines_desc:0 "Il est temps de nationaliser les mines, permettant que nous en tirions profit et d’assurer des salaires équitables pour ceux qui y travaillent."
 KMT_equal_rights_for_all:0 "Droits Égaux pour Tous"
 KMT_equal_rights_for_all_desc:0 "Nous veillerons à ce que tous aient des droits égaux, homme, femme ou enfant. Cela seul sera réellement juste."
 KMT_a_victory_for_liberalism:0 "Une Victoire pour le Libéralisme"
 KMT_a_victory_for_liberalism_desc:0 "Notre victoire aux élections a été un grand succès, nous permettant d’apporter le libéralisme à la Chine ! Gloire à ce nouveau changement pour notre bien."
 KMT_distribute_key_roles:0 "Distribuer les Rôles Clés"
 KMT_distribute_key_roles_desc:0 "Comme il semble que Carsun soit trop incompétent pour véritablement diriger la nation, nous devons agir de manière décisive pour assurer la survie de notre parti et transférer son pouvoir au parti dans son ensemble."
 KMT_organizer_of_the_party:0 "Organisateur du Parti"
 KMT_organizer_of_the_party_desc:0 "Le travail doit être effectué pour aider Carsun à réellement devenir l’organisateur du parti et devenir un grand leader. Il ne manque qu’un peu et il pourrait être transformé en grand dirigeant."
 KMT_support_individual_liberties:0 "Soutenir les Libertés Individuelles"
 KMT_support_individual_liberties_desc:0 "Chang soutient la liberté de l’homme du peuple, en veillant à ce que les droits de l’homme soient véritablement accomplis."
 KMT_freedom_from_corruption:0 "Liberté contre la Corruption"
 KMT_freedom_from_corruption_desc:0 "Si la Chine veut réussir, nous devons purger la corruption du KMT de cette nation, afin que nous puissions tous être libres."
 KMT_a_state_for_the_people:0 "Un État pour les citoyens"
 KMT_a_state_for_the_people_desc:0 "Nous avons transformé la Chine en un pays pour l’homme ordinaire, permettant à notre peuple de devenir de véritables grands hommes, capables de diriger et de façonner notre démocratie."
 KMT_the_duty_to_vote:0 "Le devoir de voter"
 KMT_the_duty_to_vote_desc:0 "Il est clair qu’il est du devoir du peuple de voter, afin qu’ils sachent que leurs droits comportent certains devoirs et que ceux-ci doivent être remplis."
 KMT_fight_the_aristocracy:0 "Combattre l'aristocratie"
 KMT_fight_the_aristocracy_desc:0 "L'État combat l'ancienne aristocratie et soutient le paysan, montrant qui est le plus juste et le plus digne d'être appelé véritablement chinois."
 KMT_the_chinese_bill_of_rights:0 "La Déclaration des droits chinoise"
 KMT_the_chinese_bill_of_rights_desc:0 "Le moment est venu de mettre en place une nouvelle Déclaration des droits en Chine, calquée sur le système américain. Cela consacrera véritablement nos libertés et garantira ce qui est bon pour le peuple."
 KMT_make_use_of_his_education:0 "Mettre à profit son éducation"
 KMT_make_use_of_his_education_desc:0 "L’éducation de Carsun doit être promue et mise à profit, lui permettant d’occuper une place spéciale aux yeux du peuple."
 KMT_the_return_of_taiwan:0 "Le retour de Taïwan"
 KMT_the_return_of_taiwan_desc:0 "Nous devons exiger le retour de Taïwan, retrouver notre peuple et reprendre ce que l’impérialisme japonais nous a enlevé."
 KMT_reassert_the_mongolian_claim:0 "Réaffirmer la revendication sur la Mongolie"
 KMT_reassert_the_mongolian_claim_desc:0 "Le moment est venu de réaffirmer notre revendication sur la Mongolie, reprenant enfin une terre chinoise qui nous revient de droit à ses oppresseurs communistes !"
 KMT_anti_soviet_isolation_tactics:0 "Tactiques d’isolement anti-soviétiques"
 KMT_anti_soviet_isolation_tactics_desc:0 "Nous ferons tout notre possible pour isoler les Soviétiques de leurs alliés à l’est, les rendant vulnérables à toute attaque de notre part ou du Japon."
 KMT_indochinese_liberation:0 "Exiger la liberté indochinoise"
 KMT_indochinese_liberation_desc:0 "Nous exigerons que les Français se retirent des terres d’Indochine, permettant la naissance d’un État indochinois libre !"
 KMT_the_son:0 "Le fils"
 KMT_the_son_desc:0 "Il est temps de rapatrier Chiang Wei-Kuo, le deuxième fils de Chiang, d’Europe ! Il servira désormais la patrie et nous aidera à mettre à profit ses connaissances pour forger notre armée vers la grandeur !"
 KMT_the_true_enemy_desc:0 "Tandis que les Japonais sont une maladie de la peau, les bandits communistes sont une maladie du cœur. Pour sauver la Chine, nous devons d’abord la purifier de tous les traîtres."
 KMT_SHX_offer2_desc:0 "Le fief de Yan nous refuse l'accès militaire. Si nous le forçons à se soumettre, nous pouvons encercler les communistes et les écraser une fois pour toutes."
 KMT_preparations_to_fight_the_soviet_imperialists_desc:0 "Après leur quasi-destruction pendant la Longue Marche, les bandits communistes se cachent dans la région de Shaanxi. Nous devons attaquer avant qu'ils ne puissent récupérer !"
 KMT_strike_PRC2_desc:0 "Les bandits sont encore en train de se remettre de la Longue Marche. Nous devons frapper quand ils sont faibles !"
 KMT_ultimatum_to_the_warlords_desc:0 "Maintenant que nous avons détruit les bandits communistes, il est temps pour les seigneurs de la guerre de rencontrer l'épée. Ils ont volé le peuple pendant trop longtemps. Nous devons achever la Révolution Nationale !"
 KMT_sinkiang_issue_desc:0 "Le Sinkiang est une partie inaliénable de la Chine ; le gouverneur local s'est révélé être un séparatiste. Nous demandons leur soumission rapide et immédiate ; si cet ultimatum ne fonctionne pas, notre armée devrait suffire à les faire se rendre."
 KMT_the_foreign_imminent_threat_desc:0 "Bien que les communistes soient une menace sérieuse, le Japon peut anéantir la nation chinoise entière. Ils ne se contenteront pas de la Mandchourie. Un jour, ils essaieront de prendre le reste de la Chine aussi. Nous devons faire tout notre possible pour nous préparer à la tempête."
 KMT_mass_fortifications:0 "Fortification de Masse"
 KMT_mass_fortifications_desc:0 "With the Japanese probing the area around Beiping, their intentions become clear. We must fortify our borders. We will not give them an inch of sacred Chinese soil!"
 KMT_coastal_fortifications_desc:0 "Compte tenu de leur maîtrise des mers, les Japonais lanceront sans doute des invasions côtières en cas de guerre. Nous devons nous préparer tant que nous le pouvons. Nous n'abandonnerons pas le Paris de l'Orient sans nous battre !"
 KMT_national_defense_propaganda_desc:0 "Pour nous défendre contre la menace japonaise, nous devons unifier le peuple chinois. Bien que nous détestions à la fois les bandits communistes et les seigneurs de guerre, chaque homme, femme et enfant doit être prêt à se battre et à mourir ensemble pour défendre la Chine."
 KMT_ultimatum_to_tibet_desc:0 "Le Tibet est essentiel à la défense et à l'expansion future de la Chine. Cependant, la région est indépendante du pouvoir chinois depuis la révolution de 1911. Nous devons réparer cette erreur."
 KMT_befriend_tibet_desc:0 "Le Tibet est essentiel pour la défense et l'expansion future de la Chine. Cependant, le Tibet a gagné son indépendance après la révolution de 1911. Nous devons nous allier avec le Dalaï Lama et sécuriser nos flancs."
 KMT_redraw_the_mcmahon_line_desc:0 "Le Tibet a accepté l'accord honteux de Simla, qui a redessiné sa frontière avec l'Inde. Nous devons faire en sorte que cette ligne soit redessinée en notre faveur."
 KMT_industrial_effort2:0 "Investir dans l'industrie"
 KMT_industrial_effort2_desc:0 "L'industrie chinoise a toujours été en retard sur celle de l'Occident et du Japon. Pour maintenir notre indépendance, nous devons augmenter notre production industrielle. Nous pouvons également autoriser les entreprises étrangères à investir dans notre industrie."
 KMT_refound_the_jiangman_aresenal:0 "Recréer l'arsenal de Jiangnan"
 KMT_refound_the_jiangman_aresenal_desc:0 "L'arsenal de Jiangnan a fourni à la dynastie Qing des équipements de pointe. Nous devrions emprunter ce nom pour créer un complexe militaro-industriel qui pourrait servir de noyau à notre industrie de l'armement en pleine expansion."
 KMT_expand_the_navy:0 "Agrandir la marine"
 KMT_expand_the_navy_desc:0 "Nous avons perdu depuis longtemps notre supériorité navale, qui a été brisée lors de la bataille du fleuve Yalu. Avec la marine japonaise qui menace notre commerce, nous devons essayer de défendre nos navires marchands en haute mer."
 KMT_the_big_rear_plan:0 "Retreat to the Rear Area"
 KMT_the_big_rear_plan_desc:0 "Avec la guerre qui fait rage à l'est de la Chine, notre ouest reste relativement sûr. Nous devons essayer de développer ces régions reculées afin qu'elles puissent également contribuer au combat de la Chine."
 KMT_finish_the_big_rear_plan:0 "Finir le Plan du Grand Arrière"
 KMT_finish_the_big_rear_plan_desc:0 "Plus nous perdons de terres, plus nous devons nous engager et terminer le plan Big Rear"
 KMT_nationalize_electronics_company:0 "Nationaliser la compagnie électronique"
 KMT_nationalize_electronics_company_desc:0 "Alors que l'électricité n'a pas encore atteint les campagnes, nos scientifiques sont déjà occupés à fabriquer des produits électroniques indigènes pour les marchés de Shanghai et de Hong Kong. Nous devrions prendre le contrôle de Ch'eng-kung et l'utiliser pour la recherche d'État."
 KMT_adopt_gerrman_style_equipment:0 "Adopter un équipement de type allemand"
 KMT_adopt_gerrman_style_equipment_desc:0 "Bien que nous ayons le soutien de conseillers allemands tels que Von Falkenhausen et que nous disposions de quelques équipements allemands importés, nos modèles produits localement sont d'une qualité horrible. L'utilisation d'équipements allemands comme modèles dans notre processus de fabrication peut multiplier notre qualité par huit !"
 KMT_lure_them_in_strategy2:0 "Stratégie « Leurres et pièges »"
 KMT_lure_them_in_strategy2_desc:0 "Avec le vaste territoire et le terrain accidenté de notre nation, nous pouvons nous permettre de battre en retraite et d'attirer les envahisseurs sur nos champs de bataille choisis. Que les impérialistes essaient de nous pourchasser ! Ils trouveront une embuscade à chaque coin de rue et un piège à chaque pas !"
 KMT_airbase_expansion:0 "Extension de la base aérienne"
 KMT_airbase_expansion_desc:0 "Nous avons besoin de bases aériennes pour que nos avions puissent décoller et atterrir, sinon ils ne seront qu'un tas d'objets exposés dans un entrepôt."
 KMT_national_resources_commission2:0 "Commission nationale des ressources"
 KMT_national_resources_commission2_desc:0 "La Commission nationale des ressources (CNR) est un institut chargé de la prospection et de l'exploitation des ressources en Chine. Sa création permettra d'améliorer considérablement nos efforts pour obtenir des ressources naturelles."
 KMT_national_defense_council2:0 "Conseil de défense nationale"
 KMT_national_defense_council2_desc:0 "Avec les Japonais et les bandits communistes qui nuisent à notre nation, nous devons trouver un moyen d'organiser notre défense contre eux. Nous devrions également essayer d'importer des équipements modernes à l'étranger."
 KMT_expand_the_jiangman_shipyard_group:0 "Développer le groupe du chantier naval de Jiangnan"
 KMT_expand_the_jiangman_shipyard_group_desc:0 "Nous devons développer la capacité de l'arsenal de Jiangnan à construire des navires ; cela nous permettra de disposer d'une meilleure marine pour faire face aux menaces futures."
 KMT_revive_the_hanyang_arsenal:0 "Faire revivre l'arsenal de Hanyang"
 KMT_revive_the_hanyang_arsenal_desc:0 "L'arsenal de Hanyang était l'un des arsenaux les plus importants et les plus performants pendant le mouvement d'autosuffisance lancé par les fonctionnaires Qing. Nous pouvons le revitaliser afin de produire des équipements de pointe pour notre armée."
 KMT_reorganize_the_ROCAF:0 "Réorganiser le ROCAF"
 KMT_reorganize_the_ROCAF_desc:0 "Nous avons toujours négligé notre force aérienne. Si nous voulons être en mesure de faire un effort pour combattre dans les airs, la branche doit être sérieusement réformée."
 KMT_the_flying_tigers:0 "Les Flying Tigers"
 KMT_the_flying_tigers_desc:0 "Conscient de la justesse de notre cause, un groupe de pilotes américains s'est porté volontaire pour rejoindre en masse notre force aérienne. Nous devrions utiliser ces hommes bien entraînés comme noyau d'élite d'une force aérienne nouvelle et revitalisée."
 KMT_study_foreign_ship2:0 "Étudier la conception des navires étrangers"
 KMT_study_foreign_ship2_desc:0 "Nous sommes à la traîne des autres nations dans la conception des navires. Pour construire un jour une marine de premier ordre, nous devons apprendre ce qui rend leurs navires supérieurs."
 KMT_demand_taiwan2:0 "Demander Taïwan"
 KMT_demand_taiwan2_desc:0 "Le peuple de Taiwan doit être libéré de son dirigeant actuel et nous être rendu. Longtemps divisée, la nation doit s'unir."
 KMT_taiwan_fleet_hub2:0 "Centre de la flotte de Taïwan"
 KMT_taiwan_fleet_hub2_desc:0 "Les étrangers ont laissé derrière eux une grande quantité d'infrastructures à Taiwan. Nous devrions développer cette base pour transformer l'île entière en une base navale et un centre de production."
 KMT_break_the_first_island_chain:0 "Briser la première chaîne d'îles"
 KMT_break_the_first_island_chain_desc:0 "Si la Chine veut réaliser son plein potentiel, nous ne devons pas nous contenter de ce côté du Pacifique. Nous devons construire une flotte capable de passer devant Taïwan et le Japon."
 KMT_draw_the_nine_dash_line:0 "Tracer la ligne des neuf tirets"
 KMT_draw_the_nine_dash_line_desc:0 "La mer de Chine méridionale contient de nombreuses routes commerciales essentielles. Si nous revendiquons ce passage, nous pourrons alors progresser vers la domination de l'Asie du Sud-Est. Cependant, nous devons disposer d'une flotte capable de soutenir nos revendications et d'envoyer tout commerce hostile dans une tombe aqueuse."
 KMT_naval_equipment2:0 "Équipement naval"
 KMT_naval_equipment2_desc:0 "Une marine moderne a besoin d'équipements modernes."
 KMT_industrial_evacuations:0 "Évacuation des industries"
 KMT_industrial_evacuations_desc:0 "Nous devons évacuer notre industrie vers l’arrière-pays chinois. Cela permettra à la fois de sécuriser notre production et d’empêcher qu’elle ne tombe entre les mains des étrangers."
 KMT_break_the_second_island_chain:0 "Briser la deuxième chaîne d'îles"
 KMT_break_the_second_island_chain_desc:0 "Maintenant que nous disposons d'une flotte capable de mener le combat au-delà du Japon, nous devons construire une flotte capable de faire sentir la colère de la Chine à n'importe quelle nation du Pacifique. Nous rendrons Zheng He fier."
 KMT_mobilize_the_chinese_volk_in_the_face_of_death:0 "Mobilisation face à la mort"
 KMT_mobilize_the_chinese_volk_in_the_face_of_death_desc:0 "Alors que les Japonais l’emportent et que notre peuple se fait massacrer, nous devons nous mobiliser face à cette mort ! Nous résisterons et nous nous battrons jusqu’au dernier homme !"
 KMT_enforce_the_nine_dash_line:0 "Faire respecter la ligne des neuf traits"
 KMT_enforce_the_nine_dash_line_desc:0 "Il semble que l'affirmation de nos revendications sur la mer de Chine méridionale n'ait pas suffi. Nous devons poursuivre l'expansion de notre marine, afin de faire comprendre aux impérialistes la justesse de notre cause par la force !"
 KMT_modernize_army2:0 "Moderniser l'armée"
 KMT_modernize_army2_desc:0 "L'esprit et la compétence ne suffisent pas pour gagner une guerre. Nous avons également besoin d'un équipement moderne."
 KMT_retake_manchuria:0 "Reprendre la Mandchourie"
 KMT_retake_manchuria_desc:0 "Le Dongbei, appelé Mandchourie par les Occidentaux, est tombé aux mains des Japonais et de leurs marionnettes il y a quelques années seulement. Nous devons la reprendre !"
 KMT_fund_the_northeast_development_agency:0 "Création de l'Agence de développement du Nord-Est"
 KMT_fund_the_northeast_development_agency_desc:0 "Bien que les Japonais aient développé certaines parties de la Mandchourie, de vastes étendues de terre restent intactes. Nous devrions entreprendre un vaste effort pour faire entrer ces terres autrefois barbares dans le monde moderne."
 KMT_academia_sinica:0 "Académie Sinica"
 KMT_academia_sinica_desc:0 "Fondée en 1928, l'Academia Sinica supervise et coordonne la recherche scientifique, sociale et humaniste dans tous les instituts de recherche et universités parrainés par l'État de la République de Chine. Contrairement aux autres instituts de recherche parrainés par le gouvernement, l'Academia Sinica est directement responsable devant le président."
 KMT_expand_peking_university:0 "Agrandir l'Université de Pékin"
 KMT_expand_peking_university_desc:0 "L'université de Pékin est une institution de classe mondiale. Nous devrions lui accorder davantage de fonds et offrir des bourses aux jeunes talents afin de produire une génération de scientifiques et de dirigeants compétents."
 KMT_asylum_for_jews:0 "L'asile pour les juifs"
 KMT_asylum_for_jews_desc:0 "De nombreux Juifs ont commencé à s'installer à Shanghai après avoir été persécutés et tués en Europe. Nous devrions ouvrir nos frontières à tous les réfugiés juifs afin de pouvoir, à notre tour, profiter de leur expertise. Des ingénieurs juifs nous ont déjà apporté des modèles d'armes polonais et allemands. Que peuvent-ils faire d'autre pour leurs nouveaux protecteurs ?"
 KMT_military_science2:0 "Science Militaire"
 KMT_military_science_desc:0 "La science civile et la science militaire sont toutes deux essentielles à la force d'une nation. Un financement raisonnable des sciences rendra notre armée plus redoutable."
 KMT_the_guandi_rocket_system:0 "Le système de fusée Guandi"
 KMT_the_guandi_rocket_system_desc:0 "L'aube des roquettes dans la guerre est arrivée. Nous devons adopter ce nouveau système d'armes si nos armées veulent survivre sur le champ de bataille moderne. Que nos ennemis ressentent la rage du dieu de la guerre !"
 KMT_expand_peking_university2:0 "Éducation pour la nation"
 KMT_expand_peking_university2_desc:0 "Il ne suffit pas de permettre aux seules personnes suffisamment riches pour s'offrir une formation universitaire d'entrer dans les salles de cours. Nous devons nationaliser toutes les universités chinoises et fonder l'admission sur le mérite et non sur la richesse."
 KMT_brave_science:0 "Science courageuse"
 KMT_brave_science_desc:0 "Nos scientifiques ont eu un complexe d'infériorité, croyant qu'ils ne dépasseront jamais l'Occident, quoi qu'ils fassent. Nous devons lancer un programme de propagande pour restaurer le moral de nos scientifiques."
 KMT_nuclear_physics2:0 "Physique nucléaire"
 KMT_nuclear_physics2_desc:0 "Si les théories d'Einstein sont correctes, alors la division de l'atome pourrait produire une arme d'une puissance inouïe. Nous devrions approfondir cette possibilité."
 KMT_the_tianlong_jet_engine:0 "Le moteur à réaction de Tianlong"
 KMT_the_tianlong_jet_engine_desc:0 "Le développement de la technologie des jets mènera à notre suprématie dans les cieux. L'époque où le fantassin chinois pouvait être attaqué depuis le ciel serait enfin révolue. Notre force s'élèvera comme le dragon en vol."
 KMT_fighter_focus2:0 "Priorité aux chasseurs"
 KMT_fighter_focus2_desc:0 "La supériorité aérienne est notre première préoccupation dans le combat aérien et les chasseurs sont ceux qui font le travail."
 KMT_bomber_focus2:0 "Priorité aux bombardiers"
 KMT_bomber_focus2_desc:0 "Détruire les lignes d'approvisionnement et les usines de notre ennemi est la meilleure option dans une guerre aérienne. C'est pourquoi nous devrions nous en tenir aux bombardiers."
 KMT_cas_effort2:0 "Développement de l'appui aérien rapproché"
 KMT_cas_effort2_desc:0 "L'appui aérien rapproché est très bénéfique pour l'avancée de notre armée sur le terrain. Ces chasseurs CAS vont gagner la guerre pour nous."
 KMT_nav_effort2:0 "Développement de l'aéronavale"
 KMT_nav_effort2_desc:0 "Les bombardiers navals sont excellents dans la destruction des navires et des ports ennemis ; ils sont une partie inaliénable de la guerre navale."
 KMT_saco:0 "SACO"
 KMT_saco_desc:0 "L'Organisation coopérative sino-américaine vise à fournir un soutien en matière de renseignement à notre armée et à former des forces d'opérations spéciales."
 KMT_improve_the_burma_road:0 "Améliorer la route de Birmanie"
 KMT_improve_the_burma_road_desc:0 "Améliorer la route de Birmanie"
 KMT_industrialization_NW2:0 "Industrialisation locale : Nord-Ouest"
 KMT_industrialization_NW2_desc:0 "La région du Nord-Ouest peut sembler être une terre stérile, pour l'instant. Bientôt, elle deviendra l'une des zones les plus industrialisées."
 KMT_excavation_NW2:0 "Excavation du nord-ouest"
 KMT_excavation_NW2_desc:0 "Nous devons rechercher davantage de ressources dans notre pays pour devenir indépendants des ressources importées."
 KMT_industrialization_S2:0 "Industrialisation locale : Sud"
 KMT_industrialization_S2_desc:0 "Le Sud est peut-être l'une des régions les plus industrialisées, mais il peut être beaucoup plus amélioré."
 KMT_excavation_S2:0 "Plantation de caoutchouc"
 KMT_excavation_S2_desc:0 "Le climat du sud est très propice aux plantations de caoutchouc ; nous devrions en faire bon usage."
 KMT_excavation_NE2:0 "Prospection du nord-est"
 KMT_excavation_NE2_desc:0 "Les Japonais ont laissé de nombreux outils dans la région ; nous pouvons les utiliser pour découvrir de nouvelles ressources dans la région."
 KMT_ledo_road2:0 "Route de Ledo"
 KMT_ledo_road2_desc:0 "Les envahisseurs ont coupé la route de Birmanie ; nous devons construire une autre route depuis l'Inde pour le ravitaillement."
 KMT_dare_to_die_corps2:0 "Escadron suicide"
 KMT_dare_to_die_corps2_desc:0 "Si nous voulons gagner la guerre contre les envahisseurs, notre peuple doit être assez courageux pour ne pas craindre la mort, il doit être prêt à faire tout ce qu'il faut pour défendre notre nation."
 KMT_reuse_captured_weaponary2:0 "Réutilisation des armes capturées"
 KMT_reuse_captured_weaponary2_desc:0 "Pour mener une guerre d'usure à long terme, il est essentiel d'utiliser au mieux les équipements capturés au cours des combats afin de maintenir la puissance de nos armées."
 KMT_prepare_for_the_civil_war:0 "Se préparer à la guerre civile"
 KMT_ultimatum_to_the_warlords_after_civil_war:0 "Anéantir les seigneurs de guerre"
 KMT_ultimatum_to_the_warlords_after_civil_war_desc:0 "Maintenant que nous avons détruit les bandits communistes, il est temps pour les seigneurs de la guerre de rencontrer l'épée."
 KMT_offer_the_yangtze_partition:0 "Proposer la partition du Yangtze"
 KMT_offer_the_yangtze_partition_desc:0 "La guerre ne tourne pas en notre faveur, et nous sommes en train de la perdre lourdement. La [PRC.getAdjective] étant incapable de franchir nos lignes de défense sur le fleuve Yangtze, nous pouvons demander une solution diplomatique à cette guerre civile si nous sommes prêts à survivre et à épargner nos troupes épuisées."
 KMT_taiwan_bastion2:0 "Bastion Taïwanais"
 KMT_taiwan_bastion2_desc:0 "Il y a une chance que nous perdions cette guerre. Pour parer à cette éventualité, nous devons faire de Taïwan un bastion national où nous pouvons attendre et nous préparer à reprendre le continent."
 KMT_collaborate_with_collaborators:0 "Collaborer avec les collaborateurs"
 KMT_collaborate_with_collaborators_desc:0 "Les anciennes marionnettes japonaises sont toutes des traîtres, et tout le monde le sait. Mais, avec le départ des Japonais, ils peuvent servir de nouveaux maîtres."
 KMT_harsh_takeover_foc:0 "S'emparer du Hanjian"
 KMT_harsh_takeover_foc_desc:0 "Il n'y a pas besoin d'être poli avec les traîtres. Nous les arrêterons tous et mettrons leurs ressources à notre disposition."
 KMT_develop_taiwan:0 "Développer Taïwan"
 KMT_develop_taiwan_desc:0 "Taïwan a reçu beaucoup d'attention de la part des Japonais. Étant donné que la base économique taïwanaise est considérablement plus élevée que celle du reste de la Chine, il serait judicieux de la développer davantage afin qu'elle puisse servir de modèle pour la compétence de notre gouvernance."
 KMT_integrate_warlord_forces:0 "Intégrer les forces des seigneurs de guerre"
 KMT_integrate_warlord_forces_desc:0 "L'armée centrale et les forces des seigneurs de guerre constituent notre armée actuelle. Cependant, les forces des seigneurs de la guerre ne sont pas très obéissantes à nos ordres. Nous aurons une armée plus efficace si nous parvenons à gagner leur confiance."
 KMT_focus_on_the_central_army:0 "Focus sur l'armée centrale"
 KMT_focus_on_the_central_army_desc:0 "Les forces indisciplinées des seigneurs de guerre ne méritent pas notre attention. Leur seule utilité est de servir de chair à canon et d'appât pendant que notre armée centrale porte le coup à nos ennemis."
 KMT_increase_sino_german_cooperation2:0 "Accroître la coopération sino-allemande"
 KMT_increase_sino_german_cooperation2_desc:0 "Nous devrions coopérer davantage avec l'Allemagne. De cette façon, nous aurons un meilleur avantage sur nos ennemis."
 KMT_indiscrimatory_conscription_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §G+10%§! \n Army Attack Factor §R-5%§! \n Recovery Rate §R-5%§!"
 KMT_unindiscrimatory_conscription_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §R-10%§! \n Army Attack Factor §G+5%§! \n Recovery Rate §G+5%§!"
 KMT_special_military_pay_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §G+7.5%§! \n Expected number of factories put on Consumer Goods §Y+5%§!"
 KMT_unspecial_military_pay_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §R-7.5%§! \n Expected number of factories put on Consumer Goods §Y-5%§!"
 KMT_reducing_stuff: "Réduit déjà les méthodes de conscription"
 KMT_hunt_draft_dodgers_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §G+7.5%§! \n Stability §R-10%§!"
 KMT_unhunt_draft_dodgers_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §R-7.5%§! \n Stability §G+10%§!"
 KMT_special_military_pay: "Paie militaire spéciale"
 KMT_unspecial_military_pay: "Réduire la paie militaire spéciale"
 KMT_hunt_draft_dodgers: "Chasse aux déserteurs"
 KMT_unhunt_draft_dodgers: "Réduire la chasse aux déserteurs"
 KMT_indiscrimatory_conscription: "Conscription indiscriminée"
 KMT_unindiscrimatory_conscription: "Réduire la conscription indiscriminée"
 KMT_lacking_support_for_conscription: "Manque de soutien pour la conscription"
 KMT_lacking_support_for_conscription_desc: "Notre État manque de moyens pour appliquer la conscription à l’échelle nationale. De plus, de nombreux goulots d’étranglement empêchent la levée d’une grande armée, car en faire trop provoquerait une famine massive."
 KMT_the_kuomintang_natl_revolution_desc: "La Révolution nationale du Kuomintang a bien progressé vers son objectif final : l’unification du pays. Pourtant, ce mouvement politiquement fragmenté a peu à peu stagné et est enclin aux luttes internes. Ainsi, il reste incertain qu’il parvienne à réaliser son but ultime : l’unification de la Chine."
 KMT_corruption_tt: "Cela aggravera la §Ycorruption§! au sein du §2KMT§!..."
 KMT_tributary_tooltip_tt: "Terminer cette action obligera quiconque rejoindra une faction dirigée par vous à verser un tribut."
 KMT_unlock_more_focuses_tt: "Terminer cette action fera progresser le destin de la Chine et débloquera de nouvelles options..."
 KMT_the_long_catchup_game: "Le Long Jeu de Rattrapage"
 KMT_tlcg_tt: "A débloqué plus de technologies que le Japon"
 KMT_natl_congress_tt:0 "§RLe destin de la Chine sera déterminé… Assurez-vous d’être préparé et que votre camp favori ait consolidé le pouvoir en Chine.§!"
 KMT_nlm_fcm_tt: "Les priorités §YDétruire le Mouvement de la Nouvelle Vie§! et §YRéanimer le Mouvement de la Nouvelle Vie§! sont mutuellement exclusives"
 KMT_no_corruption_tt: "Unlocks decisions to establish a §YCommittee§! for land reform.\n\nShould the §Y[PRC.GetNameDef]§! not exit, some of their generals will join our ranks."
 KMT_xueliang_tt: "Xueliang est un fervent défenseur d’un Front Uni contre le Japon…\n§tSi une telle rencontre tournait mal, cela pourrait avoir des conséquences drastiques pour Chiang§!"
 KMT_the_son_tt:0 "Créer un nouveau général §YChiang Wei-Kuo§! et débloquer son théoricien"
 KMT_remove_all_fascism_and_gain_stab:0 "Les Chemises Bleues seront détruites, retirant tout gain progressif de soutien fasciste, donnant 20 pour cent de Stabilité, et retirant tous les bonus que les Chemises Bleues avaient donnés."
 KMT_announce_results_tt:0 "§RVous devez annoncer les Résultats des Élections dans les 50 jours suivant cette priorité ou il y aura des conséquences…§!"
 KMT_announce_results_via_button_tt: "§YLes Résultats des Élections§! peuvent encore être annoncés via les §YÉlections Nationales§!"
 KMT_announce_results: "Annoncer les Résultats des Élections"
 KMT_elecions_in_a_year_tt:0 "§RVous avez promis à votre peuple des élections dans l’année… Ils attendent et exigent que vous teniez cette promesse…§!"
 KMT_the_chinese_national_state_focus:0 "L’État National Chinois"
 KMT_the_chinese_national_state_focus_desc:0 "Avec notre triomphe sur les dégénérés et les communistes dans notre nation, il est temps de déclarer un nouvel État pur ! Gloire à la Nation Chinoise et à son État !"
 KMT_democratic_opposition3:0 "Opposition Démocratique"
 KMT_democratic_opposition2:0 "Opposition Démocratique"
 KMT_democratic_opposition:0 "Opposition Démocratique"
 KMT_powerful_blueshirts2:0 "Puissantes Chemises Bleues"
 KMT_powerful_blueshirts3:0 "Puissantes Chemises Bleues"
 KMT_powerful_blueshirts4:0 "Activités Élargies des Chemises Bleues et de la Police Secrète"
 KMT_powerful_blueshirts4_no_lar:0 "Activités Élargies des Chemises Bleues et de la Police Secrète"
 KMT_powerful_blueshirts5:0 "Un Régime dans l’Ombre"
 KMT_powerful_blueshirts5_no_lar:0 "Un Régime dans l’Ombre"
 KMT_puppetmaster:0 "Le Marionnettiste Chinois"
 KMT_an_oath_of_loyalty:0 "Un Serment de Loyauté"
 KMT_depoliticized_army: "Armée Dépolitisée"
 KMT_depoliticized_army2: "Armée Dépolitisée"
 KMT_secularism: "Laïcité"
 KMT_democracy_of_the_proletariat: "Démocratie du Prolétariat"
 KMT_democracy_of_the_proletariat_desc: "La voie du socialisme et des travailleurs n’est pas celle d’une dictature comme celle de Staline, au contraire, apportons la démocratie dans notre nouvelle Chine."
 KMT_democracy_of_the_proletariat2: "Démocratie du Prolétariat"
 KMT_own_all_of_china_and_mongolia_and_tuva: "Possède et Contrôle tous les Cœurs chinois et mongols ainsi que Tuva"
 KMT_the_new_way: "La Nouvelle Voie"
 KMT_the_new_way2: "La Nouvelle Voie"
 KMT_the_new_way3: "La Nouvelle Voie"
 KMT_free_speech: "Liberté d’Expression"
 KMT_independent_judiciary: "Justice Indépendante"
 KMT_science_funding2: "Academia Sinica"
 KMT_the_new_communist_woman:0 "La Nouvelle Femme Communiste"
 KMT_the_new_communist_woman_desc:0 "La révolution politique a apporté la liberté à des millions de personnes dans notre Union, et parmi elles d’abord les millions de femmes qui ne sont plus confinées à être seulement des épouses et des mères, mais qui peuvent désormais aussi se tenir comme totalement égales sur le lieu de travail."
 KMT_expand_the_agitrop:0 "Étendre l’Agitprop"
 KMT_expand_the_agitrop_desc:0 "Pour atteindre des millions de travailleurs dans toute notre Union, nous devons parler leur langue. Nous devons rendre nos arguments simples et facilement compréhensibles, afin qu’ils restent dans la mémoire du citoyen commun. Nous devons encore étendre nos efforts dans ce domaine."
 KMT_positive_heroism:0 "Héroïsme Positif"
 KMT_positive_heroism_desc:1 "Bien que toutes les réalisations des membres de la classe ouvrière soient partagées par tous les membres de la classe ouvrière, nous pouvons tout de même désigner des individus comme exemples que d’autres doivent imiter."
 KMT_import_the_stakhanovite_movement:0 "Importer le Mouvement Stakhanoviste"
 SOV_revive_the_stakhanovite_movement_desc:0 "Nous avons vu l'effet que le mouvement stakhanoviste a eu sur la Russie, apportons-le à notre propre nation !"
 KMT_war_heroes:0 "Héros de Guerre"
 KMT_war_heroes_desc:0 "Les Chinois ont toujours été capables et prêts à accomplir des actes d’extrême bravoure dans la cause de la défense contre tout envahisseur de la mère patrie. Bien que nous soyons unis dans la lutte contre l’ennemi, nous ne devons pas prétendre qu’il n’existe pas des soldats qui ont dépassé de très loin l’appel du devoir."
 KMT_collectivist_propaganda:0 "Propagande Collectiviste"
 KMT_collectivist_propaganda_desc:1 "Les nombreux défis auxquels nous faisons face ne sont jamais affrontés seul par un citoyen. Toutes nos luttes sont des luttes partagées, en conséquence, toutes nos réussites sont des réussites partagées."
 KMT_socialist_emulation:0 "Émulation socialiste"
 KMT_socialist_emulation_desc:0 "Dans le système capitaliste, les travailleurs sont en rivalité les uns contre les autres afin de gagner chaque jour leur pain, tout pendant que les possédants profitent de leurs efforts pour accroître leur productivité individuelle. C'est un gâchis en plus d'être inhumain. Un système socialiste, lui, soutient chacun, lui permettant d'apprendre des meilleurs, de les imiter et d'exceller à son tour."
 KMT_socialist_realism:0 "Réalisme socialiste"
 KMT_socialist_realism_desc:1 "La route vers un avenir socialiste brillant est longue et souvent sinueuse. Certaines personnes pourraient même perdre espoir que cet objectif puisse un jour être atteint. Nous devons leur montrer exactement ce pour quoi elles travaillent, en promouvant un style artistique qui montre à quoi ressemblerait réellement la vie dans un pays socialiste."
 KMT_wang_ming: "Président Wang"
 KMT_wang_ming_desc: "Avec l’aide de Moscou, Wang Ming a remporté la lutte pour le pouvoir en Chine ! Gloire au grand vainqueur !"
 KMT_import_the_stalin_constituion: "Importer la Constitution de Staline"
 KMT_import_the_stalin_constituion_desc: "Nous avons vu le succès de la Constitution de Staline en Russie, nous l’adopterons donc en Chine !"
 KMT_secure_the_administration:0 "Sécuriser l’administration"
 KMT_secure_the_administration_desc:0 "Avec la récente révolution et le chaos de la lutte pour le pouvoir, nous devons nous interroger sur la loyauté des membres du parti. Il est impératif que nous sachions où se situe chaque membre du Politburo."
 KMT_accelerate_the_collectivization_process:0 "Accélérer le processus de collectivisation"
 KMT_accelerate_the_collectivization_process_desc:0 "Bien qu’il reste encore beaucoup de travail à faire, et que certaines régions l’aient mal géré, le processus de collectivisation des fermes en Chine doit être mené à bien et augmentera bientôt la production agricole."
 KMT_the_workers_dictatorship:0 "Dictature du prolétariat"
 KMT_the_workers_dictatorship_desc:0 "Tout le pouvoir dans notre Union doit finalement reposer sur les travailleurs. Nous ne pouvons pas nous permettre de nous diviser en factions et devons donc nous assurer que la volonté des travailleurs soit toujours reflétée dans les décisions du Politburo."
 KMT_centralization_and_discipline:0 "Centralisation et discipline"
 KMT_centralization_and_discipline_desc:0 "En ces temps d’incertitude, le peuple se tourne vers le Politburo pour obtenir stabilité et orientation. Nous devons veiller à ce que cet organe décisionnel soutienne et soit uni derrière les décisions du camarade Staline."
 KMT_chinese_war_economy:0 "Guerre économique chinoise"
 KMT_chinese_war_economy_desc:0 "Il est clair que les nations capitalistes et réactionnaires à nos frontières prévoient de frapper dans notre moment de faiblesse. Plus tôt nous adapterons notre économie à un régime de guerre, mieux ce sera."
 KMT_chen_duxiu: "Président Chen"
 KMT_chen_duxiu_desc: "Avec l’aide de Moscou, Chen Duxiu a remporté la lutte pour le pouvoir en Chine ! Gloire au grand vainqueur !"
 KMT_denounce_the_maoist_stalinist_line: "Dénoncer la ligne maoïste-stalinienne"
 KMT_denounce_the_maoist_stalinist_line_desc: "Mao et Staline, et leurs principes dictatoriaux, ont causé de grands dommages à notre nation. Cela doit être arrêté et leur idéologie détruite."
 KMT_assist_the_ordinary_soldier_desc: "Plutôt que de soutenir uniquement les officiers supérieurs, nous soutiendrons l’homme ordinaire, gagnant ainsi sa loyauté et sa confiance."
 KMT_rebuild_the_national_assembly:0 "Reconstruire l’Assemblée nationale"
 KMT_rebuild_the_national_assembly_desc:0 "Nous nous efforcerons de reconstruire l’assemblée nationale et de lui donner du pouvoir sur le président, pour garantir l’absence de corruption."
 KMT_found_the_legislative_yuan:0 "Fonder le Yuan législatif"
 KMT_found_the_legislative_yuan_desc:0 "Nous fonderons le Yuan législatif et veillerons à avoir une force modératrice de législation dans notre nation. Cela nous aidera à protéger la démocratie dans notre grande nation !"
 KMT_birth_of_the_control_yuan:0 "Naissance du Yuan de contrôle"
 KMT_birth_of_the_control_yuan_desc:0 "Notre nouveau gouvernement cherchera à créer une troisième force dans le pays : le Yuan de contrôle. Il fonctionnera comme une cour judiciaire pour s’assurer qu’aucun législateur ou président n’abuse de son pouvoir pour saper notre précieuse démocratie."
 KMT_supply_the_west:0 "Approvisionner la campagne de l’Ouest"
 KMT_supply_the_west_desc:0 "Une voie ferrée sera construite pour approvisionner la poursuite de la réclamation de l’Ouest ! Cela nous permettra de mener de nouvelles opérations militaires à grande échelle et de traiter les séparatistes."
 KMT_uphold_democratic_centralism:0 "Soutenir le centralisme démocratique"
 KMT_uphold_democratic_centralism_desc:0 "Le nouveau gouvernement maintient le centralisme démocratique de l’ancien KMT, s’assurant que nos décisions politiques NE soient pas contournées ou critiquées !"
 KMT_preempt_the_dissenters:0 "Prévenir les dissidents"
 KMT_preempt_the_dissenters_desc:0 "Il est urgent de prévenir les dissidents de gauche cherchant à renverser l’état de droit dans notre nation, en les emprisonnant avant qu’ils ne causent des problèmes. Vive la Révolution du Kuomintang et mort aux traîtres !"
 KMT_enshrine_kmt_power:0 "Consolider le pouvoir du KMT"
 KMT_enshrine_kmt_power_desc:0 "Nos bureaucrates travaillent jour et nuit pour consolider le pouvoir du Kuomintang. Cela ne sera pas arrêté et la Révolution sera assurée !"
 KMT_display_chaings_crimes:0 "Exposer les crimes de Chiang"
 KMT_display_chaings_crimes_desc:0 "L’État doit désormais montrer au peuple l’étendue réelle des crimes de Chiang. Espérons que cela contribuera à prouver la légitimité de notre nouveau gouvernement et à renforcer la confiance envers celui-ci."
 KMT_yet_honor_his_successes:0 "Mais honorer ses succès"
 KMT_yet_honor_his_successes_desc:0 "Bien que Chiang ait commis de nombreux actes atroces, nous ne nous concentrerons pas uniquement sur ceux-ci, mais montrerons également ses grands succès et les grandes choses qu’il a accomplies pour notre nation ! N’est-ce pas lui qui a lancé la Révolution du Kuomintang ?"
 KMT_the_right_men_in_the_right_places:0 "Les hommes qu’il faut aux bons endroits"
 KMT_the_right_men_in_the_right_places_desc:0 "Avec le grand succès de notre régime et l’autonomisation de nos alliés, nous avons désormais tous nos hommes à tous les postes de pouvoir. Le Parti exercera désormais un contrôle total sur la nation."
 KMT_all_glory_to_the_dang:0 "Gloire au Dang"
 KMT_all_glory_to_the_dang_desc:0 "Avec notre prise complète de tous les aspects de l’État, nous pouvons le dire de tout cœur ! Gloire au Kuomintang populaire et à sa grande et réussie Révolution !"
 KMT_the_anti_imperial_league:0 "La Ligue anti-impérialiste"
 KMT_the_anti_imperial_league_desc:0 "Alors que l’Asie est envahie par l’impérialisme, nous devrons la sauver de celui-ci : les occidentaux, les Soviétiques et les Japonais doivent tous être combattus !"
 KMT_the_blue_dictatorship:0 "La dictature bleue"
 KMT_the_blue_dictatorship_desc:0 "Avec la prise complète du pouvoir, nous contrôlons désormais toutes les parties de l’État, Chiang et les Chemises bleues règnent en maître et personne ne peut rien y changer !"
 KMT_the_slippery_slope_to_fascism:0 "La pente glissante vers le fascisme"
 KMT_the_slippery_slope_to_fascism_desc:0 "Alors que notre régime et les Chemises bleues dérivent de plus en plus vers le fascisme, nous allons l’embrasser, utilisant la nature de notre régime pour assurer le plein pouvoir pour nous-mêmes !"
 KMT_secure_the_new_state:0 "Sécuriser le nouvel État"
 KMT_secure_the_new_state_desc:0 "Il est temps de prendre le contrôle complet de la Chine par les Chemises bleues, Chiang les mènera à la gloire et anéantira toute résistance de quiconque oserait s’opposer à nous !"
 KMT_a_regime_in_the_shadows:0 "Un régime dans l’ombre"
 KMT_a_regime_in_the_shadows_desc:0 "We have created for ourselves a regime in the shadows, one where all is controlled by us! None shall hide from our gaze and go unpunished! None will oppose Chiang Kai-shek!"
 KMT_expand_secret_police_operations:0 "Étendre les Opérations de la Police Secrète"
 KMT_expand_secret_police_operations_desc:0 "Les Chemises Bleues étendent les opérations de la police secrète pour résister à ceux qui s’opposent à notre nouvelle domination sur la Chine ! Toute dissidence sera trouvée et purgée."
 KMT_free_china_movement:0 "Mouvement de la Chine Libre"
 KMT_final_electoral_preparations: "Préparatifs Électoraux Finaux"
 KMT_final_electoral_preparations_desc: "Avec le Congrès National tenu, il est temps de faire les derniers préparatifs pour les élections ! Longue vie au futur de la Révolution !"
 KMT_the_results: "Les Résultats"
 KMT_the_results_desc: "Il est maintenant temps d’annoncer les Résultats de nos élections ! La voix du Peuple sera entendue et la Démocratie instaurée !"
 KMT_prepare_for_new_eletions:0 "Annoncer de Nouvelles Élections"
 KMT_prepare_for_new_eletions_desc:0 "Le Parti annonce maintenant de nouvelles élections dans l’année ! Nous avons fait cette promesse audacieuse, il nous revient de la tenir…"
 KMT_hold_new_elections:0 "Tenir les Élections Promises"
 KMT_hold_new_elections_desc:0 "Avec tout en place, il est grand temps de tenir nos promesses. De nouvelles élections seront tenues, et elles le seront maintenant."
 KMT_the_first_replublican_elections:0 "Les Premières Élections Républicaines"
 KMT_the_first_replublican_elections_desc:0 "Avec tout en place, il est temps d’agir pleinement, de mener la Chine vers un véritable espace démocratique, en organisant les premières vraies élections en Chine depuis la nuit des temps, plus grandes et meilleures que celles de la Révolution Xinhai !"
 KMT_a_new_dawn: "Une Nouvelle Aube"
 KMT_a_new_dawn_desc:0 "Avec le pouvoir sécurisé, nous apporterons une nouvelle aube pour la Chine, le statu quo sera brisé et la démocratie instaurée en Chine !"
 KMT_the_silent_takeover:0 "La Prise de Contrôle Silencieuse"
 KMT_the_silent_takeover_desc:0 "À l’insu de notre ennemi, nous avons infiltré chaque partie de leur camp ces derniers jours, mois et années. Maintenant, sans aucun changement visible de l’extérieur, nous allons mettre en œuvre nos plans pour le destin de la Chine."
 KMT_the_status_quo:0 "Le Statu Quo"
 KMT_the_status_quo_desc:0 "Penser que le Congrès National résoudrait tous les problèmes de la Chine a été un échec, nous avons commis une grave erreur en faisant cela. La Chine est maintenant tombée dans un état de statu quo, où nous allons stagner pour un futur prévisible !"
 KMT_uneasy_status_quo:0 "Statu Quo Malaisé"
 KMT_leftist_dissent:0 "Dissidence de Gauche"
 KMT_state_within_a_state:0 "l’État dans l’État"
 KMT_a_new_and_better_chiang:0 "Un Chiang Nouveau et Meilleur"
 KMT_a_new_and_better_chiang_desc:0 "Ayant montré les graves erreurs et les gloires de Chiang, nous allons récupérer cela, nous déclarant la version meilleure et plus pure de Chiang, capable de faire ce qu’il ne pouvait pas et de résister à ses maux."
 KMT_a_state_within_a_state:0 "Un État dans l’État"
 KMT_a_state_within_a_state_desc:0 "Le Kuomintang a pris le pouvoir sur l'ensemble de l'appareil d'État et s'en est servi pour créer un sous-État en son sein. Cela lui a permis de conserver le pouvoir sur le gouvernement central, quel que soit le titulaire du poste."
 KMT_limit_the_executive_yuan:0 "Limiter le Yuan Exécutif"
 KMT_limit_the_executive_yuan_desc:0 "Le nouveau gouvernement formé limite le pouvoir du Yuan exécutif, empêchant la prise de pouvoir par une seule personne."
 KMT_empower_the_legislature:0 "Renforcer le Législatif"
 KMT_empower_the_legislature_desc:0 "Le nouveau gouvernement formé renforce le pouvoir du Législatif dans le nouvel État, permettant une forte primauté du droit et un bon déroulement de la gouvernance !"
 KMT_silence_rightist_legislators:0 "Réduire au Silence les Législateurs Droitistes"
 KMT_silence_rightist_legislators_desc:0 "Nous devons agir pour réduire au silence les législateurs droitistes qui s’opposent à notre juste primauté du droit ! Nous ferons appliquer notre morale par la loi quoi qu’il arrive !"
 KMT_full_unity_of_action:0 "Unité Totale d’Action"
 KMT_full_unity_of_action_desc:0 "Notre État utilisera nos éléments léninistes pour garantir que toute opposition travaillera avec nous, assurant une unité d’action dans toutes nos quêtes !"
 KMT_maintain_kmt_purity:0 "Maintenir la Pureté du KMT"
 KMT_maintain_kmt_purity_desc:0 "Il est impératif de maintenir la pureté dans notre parti, en clarifiant que nous ne sommes pas des communistes, mais bien des démocrates."
 KMT_purge_disloyal_generals:0 "Écarter les Généraux Déloyaux"
 KMT_purge_disloyal_generals_desc:0 "L’État purgera tous les généraux qui contestent notre nouveau régime de gauche ! Tous se plieront à la Gloire du nouveau KMT !"
 KMT_dechiangification_of_the_army:0 "Déchiangification de l’Armée"
 KMT_dechiangification_of_the_army_desc:0 "Nous devons agir vite pour purger l’influence chiangiste dans l’armée, assurant sa neutralité et sa loyauté !"
 KMT_fully_bolshevise_the_army:0 "Bolchéviser Complètement l’Armée"
 KMT_fully_bolshevise_the_army_desc:0 "Le temps est venu de bolchéviser complètement l’armée selon nos standards !"
 KMT_fuse_the_army_into_the_state:0 "Fusionner l’Armée dans l’État"
 KMT_fuse_the_army_into_the_state_desc:0 "Pour sécuriser notre pouvoir, l’armée sera fusionnée dans l’État, nous permettant de consolider un contrôle total pour notre nouveau régime socialiste."
 KMT_the_economic_national_revolution:0 "La Révolution Nationale Économique"
 KMT_the_economic_national_revolution_desc:0 "Nous ferons une seconde révolution économique en Chine, apportant de grandes choses à notre peuple et redistribuant la richesse !"
 KMT_moderate_the_revolution:0 "Modérer la Révolution"
 KMT_moderate_the_revolution_desc:0 "Il est prudent de modérer notre révolution économique afin que notre peuple ne se révolte pas et ne cause pas de problèmes."
 KMT_the_young_guard:0 "La Jeune Garde"
 KMT_the_young_guard_desc:0 "Le peuple soutient la Jeune Garde du KMT, les gauchistes, maintenant qu’ils sont de retour et légaux. Ils ont gagné les élections et peuvent maintenant espérer mener la Chine vers une nouvelle aube."
 KMT_maintain_the_saction_against_communsim:0 "Maintenir la Sanction contre le Communisme"
 KMT_maintain_the_saction_against_communsim_desc:0 "L’État étant sécurisé, nous nous assurons de maintenir notre sanction contre le communisme, veillant à ce que cette dégénérescence soit complètement détruite, nous permettant de résister à son influence répugnante sur notre peuple."
 KMT_in_the_shadow_of_chiang_kai_shek:0 "In the Shadow of Chiang Kai-shek"
 KMT_the_old_guard:0 "La vieille garde"
 KMT_the_old_guard_desc:0 "La vieille garde du Kuomintang a remporté la victoire, vive le Kuomintang et vive la République chinoise !"
 KMT_destroy_the_new_life_movement:0 "Détruire le Mouvement de la Nouvelle Vie"
 KMT_destroy_the_new_life_movement_desc:0 "Avec notre pouvoir sécurisé, nous détruirons les vestiges du mouvement de la Nouvelle Vie, un mouvement fasciste mis en place par Chiang pour son propre bénéfice, contre la volonté du peuple. Cela doit être stoppé et détruit."
 KMT_the_free_china_movement:0 "Le Mouvement de la Chine Libre"
 KMT_the_free_china_movement_desc:0 "Le nouveau gouvernement créera un nouveau mouvement, plus grand et meilleur que l’ancien mouvement de la Nouvelle Vie. Le Mouvement de la Chine Libre apportera la grandeur à notre peuple et leur apportera une grande gloire à l’avenir."
 KMT_end_the_blueshirt_sharade:0 "Mettre Fin à la Farce des Chemises Bleues"
 KMT_end_the_blueshirt_sharade_desc:0 "Les Chemises Bleues ont été autorisées à semer le chaos en Chine beaucoup trop longtemps. Nous devons mettre fin à ces horribles fauteurs de troubles."
 KMT_a_suitable_president:0 "Un Président Convenable"
 KMT_a_suitable_president_desc:0 "Avec notre victoire aux élections, il est temps de faire officiellement de Hu Shih le président, afin qu’il puisse désormais mener la Chine à la victoire !"
 KMT_president_of_all_china:0 "Président de toute la Chine"
 KMT_chiangs_heir:0 "L’Héritier de Chiang"
 KMT_commander_in_chief:0 "The KMT's Generalissimo"
 KMT_veangeful:0 "Vengeur"
 KMT_military_support:0 "Soutien Militaire"
 KMT_stack_the_high_command:0 "Empiler le Haut Commandement"
 KMT_chaos_in_the_capital:0 "Chaos dans la Capitale"
 KMT_dissolved_democratic_institutions:0 "Institutions Démocratiques Dissoutes"
 KMT_strengthen_democratic_institutions: "Renforcer les Institutions Démocratiques"
 KMT_strengthen_democratic_institutions_desc: "Pour que la démocratie prospère en Chine, nos institutions doivent être renforcées. Grâce à elles, la liberté sera assurée."
 KMT_enabling_act:0 "Loi d’Habilitation"
 KMT_martial_law:0 "Loi Martiale"
 KMT_stacked_high_command:0 "Haut Commandement Empilé"
 KMT_increase_secret_police_authority:0 "Augmenter l’Autorité de la Police Secrète"
 KMT_increase_secret_police_authority_desc:0 "Afin d’aider à mettre en place nos grandes réformes dans notre État, nous devons augmenter l’autorité de notre police secrète. Elle nous aidera à prendre pleinement les rênes du pouvoir et à éliminer la dissidence."
 KMT_purge_the_blueshirt_members:0 "Désarmer les Chemises Bleues"
 KMT_purge_the_blueshirt_members_desc:0 "Avec notre clique CC ayant désormais sécurisé son pouvoir, il est temps de s’occuper des Chemises Bleues, qui ont tenté de nous rivaliser pendant si longtemps. Avec la bénédiction de Chiang, nous allons mener cela à bien, nous occuper des Chemises Bleues et les anéantir."
 KMT_chaings_right_hand_man:0 "La Main Droite de Chiang"
 KMT_chiangs_right_hand_man_desc:0 "Avec Dai Li devenant toujours plus important dans notre régime, il est temps de le montrer pleinement pour ce qu’il est. Il deviendra ouvertement la main droite du Généralissime, exécutant ses ordres dans toute la nation."
 KMT_loyalty_to_the_generalissimo:0 "Loyauté au Généralissime"
 KMT_loyalty_to_the_generalissimo_desc:0 "Dai Li prêtera désormais loyauté au Généralissime, faisant de lui une force réellement formidable capable d’accomplir tout ce que le Généralissime exige de lui. Personne ne résistera à Li, et donc, personne ne résistera à Chiang."
 KMT_the_diarchy:0 "La Diarchie"
 KMT_the_diarchy_desc:0 "Avec Dai et Chiang devenant de plus en plus des égaux, il est temps de consolider leur pouvoir comme égaux, avec Chiang conservant le pouvoir en tant que figure dirigeante de la Nation mais Dai dirigeant l’intérieur de l’appareil d’État."
 KMT_disband_the_cc_clique:0 "Dissoudre la Clique CC"
 KMT_disband_the_cc_clique_desc:0 "Ayant pris le contrôle de l’État, nous dissoudrons la clique CC. Ces hommes nous ont méprisés depuis si longtemps. Il est juste que nous les traitions de cette manière."
 KMT_hunt_communists_in_the_street:0 "Traquer les Communistes dans la Rue"
 KMT_hunt_communists_in_the_street_desc:0 "Les communistes sont une disgrâce pour notre peuple. Ces hommes nous ont blessés et trahis encore et encore. Nous leur donnerons ce qu’ils méritent depuis longtemps et les massacrerons sans pitié !"
 KMT_violence_the_solution_to_opposition:0 "La Violence, Solution à l’Opposition"
 KMT_violence_the_solution_to_opposition_desc:0 "La violence a toujours été notre solution préférée à l’opposition. Nous l’utiliserons pour sécuriser notre domination et traiter TOUTE dissidence !"
 KMT_gut_the_deep_state:0 "Éventrer l’État Profond"
 KMT_gut_the_deep_state_desc:0 "Les Chemises Bleues éventrent désormais l’État profond, détruisant toute résistance à notre maniement de l’État organique, nous permettant d’imposer notre volonté à la nation sans entraves !"
 KMT_further_combat_illiteracy:0 "Renforcer la Lutte contre l’Analphabétisme"
 KMT_further_combat_illiteracy_desc:0 "Le temps est venu de renforcer davantage la lutte contre l’analphabétisme en Chine, selon les plans de Chiang, permettant une population éduquée et industrieuse."
 KMT_chiangs_right_hand_man:0 "La Main Droite du Généralissime"
 KMT_chiangs_loyal_right_hand_man:0 "Un avec le Généralissime"
