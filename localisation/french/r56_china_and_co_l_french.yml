 seized_assets:0 "Seized Assets"
 refused_cooperation:0 "Refused Cooperation"
 CHI_only_we_can_save_china:0 "Only we Can Save China"
 CHI_only_we_can_save_china_desc:0 "Only we can save China! To do this, we will declare national governance and prepare to destroy the fake pretenders in Nanjing!"
 CHI_resurrect_the_anti_chaing_coalition:0 "Resurrect the Anti-Chiang Coalition"
 CHI_resurrect_the_anti_chaing_coalition_desc:0 "We will resurrect the anti-Chiang coalition from a couple years ago! Chiang, the evil tinpot dictator against the people will fall! up with our great new Regime!"
 CHI_a_friendship_with_the_warlords:0 "A Friendship with the Warlords"
 CHI_a_freindship_with_the_warlords_desc:0 "We will seek support from the warlords in our great Coalition, as they were the driving force in the last one! As that one was close, this one will succeed!"
 CHI_an_alliance_with_the_rightists:0 "An Alliance with the Rightists"
 CHI_an_alliance_with_the_rightists_desc:0 "We will reach out to the rightists who are equally disgusted with Chiang as we are! This will bring us together against Chiang and level the field for his demise!"
 CHI_an_olive_branch_to_the_communists:0 "An Olive Branch to the Communists"
 CHI_an_olive_branch_to_the_communists_desc:0 "We will reach out to the Communists in China. While we share a great ideological difference with them, it matters not. Chiang must die, and we work together to make that happen!"
 CHI_seek_support_from_the_democrats:0 "Seek Support from the Democrats"
 CHI_seek_support_from_the_democrats_desc:0 "The democrats in China are like us and despise Chiang! This gives us perfect grounds to begin to work with them to eliminate this shared threat and oppressor!"
 CHI_march_on_chaing:0 "March on Chiang"
 CHI_march_on_chaing_desc:0 "It is time! We will begin to strike at Nanjing and knock Chiang from his pedestal! Chain will die as we will instate ourselves as the true China!"
 CHI_prepare_for_the_second_northern_expedition:0 "Prepare for the Second Northern Expedition"
 CHI_prepare_for_the_second_northern_expedition_desc:0 "We will prepare for a second Northern Expedition to secure the great northern areas of China along with Beijing to insure that we can unite a great Chinese Republic. Glory to the KMT and China!"
 CHI_pillage_the_occupied_lands:0 "Pillage the Occupied Lands"
 CHI_pillage_the_occupied_lands_desc:0 "With the Jihad running successfully, it is time to pillage these lands, boosting our economy, bringing us a great victory!"
 CHI_construct_minarets:0 "Construct Minarets"
 CHI_construct_minarets_desc:0 "We will work to construct minarets all over our new realm! Allah will be glorified by our great victory! Glory to the Jihad and Allah!"
 CHI_take_leadership_of_islam:0 "Take Leadership of Islam"
 CHI_take_leadership_of_islam_desc:0 "We will take leadership of Islam, declaring ourselves a great Islamic state!"
 CHI_enforced_social_values:0 "Enforced Values"
 CHI_enforced_social_values_desc:0 "We will begin to enforce the Quran's Values. If these are indeed from Allah, then all our people must obey them!"
 CHI_a_unitary_education:0 "Unitary Education"
 CHI_a_unitary_education_desc:0 "Our Sons must be educated according to the will of Allah! They will learn the Hadiths and learn Allah's will! This alone will make our people great and studious."
 CHI_society_as_allah_ordained_it:0 "Society as Allah Ordained it"
 CHI_reinstate_the_jizya:0 "Reinstate the Jizya"
 CHI_reinstate_the_jizya_desc:0 "With so many infidels in our land, we will reinstate the Jizya! The Infidels shall pay for rejecting Allah and the Quran! This will help us ramp up spending for the Jihad and prepare for the great Holy war!"
 CHI_stabilize_the_economy:0 "Stabilize the Economy"
 CHI_Stabilize_the_economy_desc:0 "We will work to stabilize our economy after the civil war and the takeover of Allah's men! This will help us be capable of initiating all the reforms we wish to!"
 CHI_conversion_by_the_sword:0 "Conversion by the Sword"
 CHI_conversion_by_the_sword_desc:0 "While the Jizya was a great first step to integrating the infidels into our Islamic society, it was not enough. Those that remain will bow to Allah and Muhammed his prophet! There may be no alternative!"
 CHI_begin_preparations_for_jihad:0 "Begin Preparations for Jihad"
 CHI_begin_preparations_for_jihad_desc:0 "We will begin to prepare for the great Jihad and build up our economy to ensure that our supply of guns never dwindles!"
 CHI_ready_the_army_of_jihad:0 "Ready the Army of Jihad"
 CHI_ready_the_army_of_jihad_desc:0 "We will begin readying the army of Jihad! not much is missing! Soon we will be able to strike for and fulfill Allah's will!"
 CHI_strike_forth:0 "Strike Forth"
 CHI_strike_forth_desc:0 "We will begin to strike forth, and start the Jihad! We will be victorious and none will stop us!"
 CHI_collect_funds_for_the_jihad:0 "Collect Funds for the Jihad"
 CHI_collect_funds_for_the_jihad_desc:0 "We will begin to collect funds for the Jihad from our people, fixing the economic woes we face and giving us the necessary military production to effectively counter the infidels!"
 CHI_the_caliphate_of_china:0 "The Caliphate of China"
 CHI_the_caliphate_of_china_desc:0 "While we may be Muslims, we are also Chinese! therefore we will work to bring these things together and create a caliphate here in our eastern extent of Islamic influence to bring spiritual revival to China!"
 CHI_an_islamic_state:0 "An Islamic State"
 CHI_an_islamic_state_desc:0 "Muslims have been divided and bickering amongst each other for far too long! We will work to create an Islamic state here in Western China and spread across the world to unite it and our fellow Muslims in it, allowing us to create a great Islamic state!"
 CHI_a_great_turkestan:0 "A Turkestani Caliphate"
 CHI_a_great_turkestan_desc:0 "Our People are not of the infidel Chinese, rather we are the great Turkestani People! We will work to restore this great state under our new caliphate day and night!"
 CHI_instate_sharia_law:0 "Instate Sharia Law"
 CHI_instate_sharia_law_desc:0 "We will begin to instate Sharia Law, allowing for us to bring about Allah's will in our Society and have it fully submit to his will!"
 CHI_totaltarianism_after_allahs_word:0 "Totalitarianism after the Quran"
 CHI_totaltarianism_after_allahs_word_desc:0 "We will begin to crack down on any disobedience and apostasy in our ranks! Allah does not allow such degeneracy and commands we act as his right hand and do this good work for him! The degenerates and apostates will be vanquished!"
 CHI_eliminate_all_dissent:0 "Eliminate all Dissent"
 CHI_eliminate_all_dissent_desc:0 "We will do further work to eliminate all dissent! Everyone who does not submit to all of the Sharia's Commandments must die! Islam means submission and the traitors will feel this!"
 CHI_adopt_the_penal_code:0 "Adopt the Penal Code in the Sharia"
 CHI_adopt_the_penal_code_desc:0 "The Quran lays out a very clear way to deal with all sorts of Crime, from the thief to the murderer! We will implement this part of the sharia as well to deal with the many criminals under our rule!"
 CHI_begin_jihad_against_the_oppressors:0 "Begin Jihad Against the Oppressors"
 CHI_begin_jihad_against_the_oppressors_desc:0 "We will begin a great Jihad against the Chinese Oppressing us! We will free our Hui People with a Holy Jihad to free our Islamic People according to the will of Allah!"
 CHI_infiltrate_hui_communities:0 "Infiltrate Hui Communities"
 CHI_infiltrate_hui_communities_desc:0 "We will work to infiltrate the Hui Communities and begin to radicalize their people! Islam will be made great and the Hui will bask in Allah's Glory!"
 CHI_a_radical_hui:0 "A Radicalized Hui"
 CHI_a_radical_hui_desc:0 "Due to our work, the Hui people have truly become Radicalized, they are now hell bent on doing the will of Allah, not much is missing till we can overthrow the Chinese Oppressors!"
 CHI_propaganda_against_the_kmt:0 "Propaganda Against the KMT"
 CHI_propaganda_against_the_kmt_desc:0 "We will begin massive propaganda against the KMT, this way we will indirectly support the great islamic revolution!"
 CHI_an_organized_resistance_militia:0 "An Organized Resistance Militia"
 CHI_an_organized_resistance_militia_desc:0 "We will form an organized militia to resist the KMT, this will allow us to seize control of the mountains and desert and lay the capital under siege! None can resist the great sword of Islam!"
 CHI_break_the_back_of_the_kmt_forces:0 "Break the Back of the KMT forces"
 CHI_break_the_back_of_the_kmt_forces_desc:0 "We will break the back of the KMT forces in our region. This will allow us to work with impunity and absolutely destroy the KMT Oppression."
 CHI_the_jihad_successfull:0 "Drive out the Infidels"
 CHI_the_jihad_successfull_desc:0 "We have finally done it! It is time to commence the Jihad and drive out the infidels! Down with the old guard, up with the Islamic State!"
 CHI_deal_with_anti_japanese_hatred:0 "Deal with Anti-Japanese Hatred"
 CHI_deal_with_anti_japanese_hatred_desc:0 "Now that we have truly become our own state, it is time for us to deal with the people's hatred toward Japan and ensure that perhaps forgiveness may be achieved!"
 CHI_the_sinofication_of_china:0 "The Sinification of China"
 CHI_manchu_colab:0 "Create a special administration in Manchuria"
 CHI_tunganistan_colab:0 "Create a special administration in East Turkestan"
 CHI_sinofy_land:0 "Sinofy [FROM.GetName]"
 CHI_a_place_in_the_comintern:0 "A Place in the Comintern"
 CHI_a_place_in_the_comintern_desc:0 "With the Soviets having supported us to this date, we will seek a place in the Comintern. The Russo-Chinese alliance will be a great achievement."
 CHI_request_military_aid:0 "Request Soviet Military Aid"
 CHI_request_military_aid_desc:0 "We will request military aid from the Soviet union. We need guns and they have the industry to produce them, therefore it would be reasonable for them to give us some."
 CHI_a_soviet_tank_advisors:0 "Soviet Tank Advisors"
 CHI_a_soviet_tank_advisors_desc:0 "We will invite Soviet Tank advisors into our country, so that they may help teach us how to make a great and mighty tank force."
 CHI_extol_chinese_nationalism:0 "Extol Chinese Nationalism"
 CHI_extol_chinese_nationalism_desc:0 "We will work to extol Chinese Nationalism in our country! China will be made one under us! That is the highest good of the Revolution!"
 CHI_reach_out_to_moscow:0 "Reach out to Moscow"
 CHI_reach_out_to_moscow_desc:0 "We will reach out to [SOV.GetNameDef] and request their support. If we can get it, we may end up with great expertise, weapons, and diplomatic backing."
 CHI_request_official_recognition:0 "Request Official Recognition"
 CHI_request_official_recognition_desc:0 "We will request official recognition from the Soviets, this will finalize the preparations for our plans to take over China. This way we will be more than ready, as we will be the main Soviet aligned state in China."
 CHI_joint_ultimatum_to_prc:0 "Joint Ultimatum to [PRC.GetNameDef]"
 CHI_joint_ultimatum_to_prc_desc:0 "We will work with the Soviets to send the PRC an ultimatum to cede control of their state to us, as we are the new Soviet backed state in the region."
 CHI_support_chinese_religion:0 "Support Chinese Religion"
 CHI_support_chinese_religion_desc:0 "We will support ethnic Chinese religions based on a shared sense of nationalism, so that we can ensure that through the use of these religions, we may create a great force to protect the Nation!"
 CHI_state_atheism:0 "State Atheism"
 CHI_state_atheism_desc:0 "We will work to implement state Atheism in our Nation, this will create a sense of Purity in our ideology. This way our work force will be able to toil away relentlessly for the KMT revolution!"
 CHI_beacon_of_socialism:0 "Beacon of Socialism"
 CHI_beacon_of_socialism_desc:0 "We have truly become a great beacon of socialism, a bright example for all socialists in the world! Glory to the Revolution!"
 CHI_beacon_of_communism:0 "Beacon of Communism"
 CHI_beacon_of_communism_desc:0 "We have truly become a great beacon of communism, a bright example for all communists in the world! Glory to the Revolution!"
 CHI_enforce_loyalty_to_the_revolution:0 "Enforce Loyalty to the Revolution"
 CHI_enforce_loyalty_to_the_revolution_desc:0 "We will enforce loyalty to the KMT national revolution to make sure that no dissidence will form toward our great revolution! No one will reject our great crusade!"
 CHI_purge_the_decadence:0 "Purge the Decadence"
 CHI_purge_the_decadence_desc:0 "We will purge the decadent republicans who are causing a massive delay in our great revolution! They must go and China must be restored under the bright light of the Kuomintang Revolution!"
 CHI_enshrine_the_yuan:0 "Enshrine the Yuan"
 CHI_enshrine_the_yuan_desc:0 "We will work to enshrine the Yuan, or the Chinese Legislative, in China, this will create a mighty bulwark capable of stopping a new Chiang and a new CCP from forming. This way we will be capable of ensuring responsible leadership according to the three principles of the people."
 CHI_sideline_the_radicals:0 "Mettre les radicaux à l'écart"
 CHI_sideline_the_radicals_desc:0 "Nous travaillerons à marginaliser les radicaux dans notre parlement et à en interdire même quelques-uns pour avoir continué à violer les principes du centralisme démocratique. Comme ils ont enfreint nos règles, ils doivent en subir les conséquences."
 CHI_full_control_over_the_apparatus_of_education:0 "Contrôle total de l’appareil éducatif"
 CHI_full_control_over_the_apparatus_of_education_desc:0 "Nous veillerons à assurer le contrôle de l’ensemble de l’appareil éducatif, ce qui permettra un financement accru et la loyauté envers notre parti !"
 CHI_nationalize_foreign_assets:0 "Nationaliser les actifs étrangers"
 CHI_nationalize_foreign_assets_desc:0 "Avec la révolution du KMT ayant pris le contrôle de notre province, nous nous assurerons que les actifs étrangers soient saisis ; ainsi nous aurons une vraie Chine pour les Chinois !"
 CHI_purge_the_reactionary:0 "Purger les réactionnaires"
 CHI_purge_the_reactionary_desc:0 "Nous épurerons les réactionnaires au sein du KMT, permettant d’arrêter l’influence dégénérative venue du Nord et de permettre à notre grand État de prospérer !"
 CHI_reorganize_the_party_along_lenninist_lines:0 "Réorganiser le Parti selon des lignes léninistes"
 CHI_reorganize_the_party_along_lenninist_lines_desc:0 "Nous reviendrons aux fondamentaux et commencerons à faire ce que nous faisions alors, et procéderons à la réorganisation du parti selon des lignes léninistes !"
 CHI_democratic_centralism:0 "Centralisme démocratique"
 CHI_democratic_centralism_desc:0 "Nous mettrons en œuvre le centralisme démocratique, nous permettant à la fois la liberté de débat et une action exécutive forte ! Cela permettra à la Révolution nationale du Kuomintang de progresser réellement et efficacement !"
 CHI_announce_full_communism:0 "Proclamer le communisme intégral"
 CHI_announce_full_communism_desc:0 "La première motion que nous adopterons inscrira le véritable communisme dans notre État, nous permettant de créer une grande utopie communiste !"
 CHI_socialism_not_communism:0 "Socialisme, pas communisme"
 CHI_socialism_not_communism_desc:0 "Nous commencerons à mettre en œuvre nos politiques socialistes ; toutefois, cela ne signifie pas que nous succomberons aux horreurs du communisme. Au contraire, nous rejetterons fermement toute motion visant à mettre en œuvre de tels plans !"
 CHI_land_value_tax_3:0 "Taxe sur la valeur des terres"
 CHI_land_value_tax_3_desc:0 "Nous ferons ce que le KMT a longtemps voulu faire ; en fait nous sommes déjà en retard, nous saisirons enfin l’occasion et imposerons une taxe sur la valeur foncière, afin que notre peuple puisse être libéré de l’oppression capitaliste !"
 CHI_transfer_factories_to_the_proletariat:0 "Transférer les usines au prolétariat"
 CHI_state_owned_corporations:0 "Entreprises publiques"
 CHI_state_owned_corporations_desc:0 "Nous nationaliserons nos sociétés ; ainsi le peuple et l’État en bénéficieront bien davantage et nous favoriserons une croissance économique à long terme !"
 CHI_seize_merchant_property:0 "Saisir les biens des commerçants"
 CHI_seize_merchant_property_desc:0 "Nous nous attaquerons à un bastion clé du capitalisme en Chine ! Les commerçants répugnants perdront leurs biens et verront leurs actifs confisqués !"
 CHI_the_fate_of_the_overrun_lands:0 "Le sort des terres envahies"
 CHI_the_fate_of_the_overrun_lands_desc:0 "La Mandchourie et le Sinkiang ont été envahis par des races impures... Nous devons maintenant décider quoi faire de ces terres et des personnes qui s’y trouvent, tant les Chinois que les autres « saletés » qui s’y trouvent."
 CHI_appropriate_the_fuhrerprinzip:0 "S’approprier le Führerprinzip"
 CHI_appropriate_the_fuhrerprinzip_desc:0 "Bien que anti-monarchistes, les nationaux-socialistes allemands partagent de nombreux aspects de leur idéologie avec nous. Nous nous inspirerons donc de leur Führerprinzip et l’appliquerons à l’Empereur ! Il deviendra le Führer incontesté de notre Grande Nation et personne ne le remettra en question !"
 CHI_drive_out_the_foreign_devils:0 "Chasser les démons étrangers"
 CHI_drive_out_the_foreign_devils_desc:0 "Nous avons subi pendant trop longtemps l’horrible influence occidentale impure dans nos milieux académiques ! Nous détruirons les porcs occidentaux et sauverons notre pays de leur influence maléfique !"
 CHI_destroy_foreign_thought:0 "Détruire la pensée étrangère"
 CHI_destroy_foreign_thought_desc:0 "Même si les démons étrangers ont été chassés, nous voyons encore beaucoup de leur pensée dans notre pays... Cela sera traité et les responsables en seront éliminés."
 CHI_the_revolution_successfull:0 "La révolution réussie"
 CHI_the_revolution_successfull_desc:0 "Nous avons lutté jour et nuit et avons finalement atteint notre plus grand objectif. La Révolution culturelle a été un grand succès ; nous pouvons enfin lever les mesures que nous avons imposées et préparer un État véritablement grand pour le peuple et sa prospérité sous le grand Empereur !"
 CHI_jihad: "Djihad"
 CHI_begin_the_cultural_revolution:0 "Commencer la §RÉvolution culturelle§!"
 CHI_begin_the_cultural_revolution_desc:0 "Nous entamerons la Révolution culturelle pour détruire les forces dégénérées qui détruisent la pureté et la stabilité de notre pays. Nous lancerons une vaste campagne pour anéantir toute résistance à nos nouvelles formes de pensée pure !"
 CHI_a_national_chinese_empire:0 "Un empire chinois national"
 CHI_a_national_chinese_empire_desc:0 "Nous déclarerons un nouvel Empire national ! Le peuple chinois sera sauvé par nous ! Gloire au peuple Han !"
 CHI_break_the_confucionists:0 "Briser les confucéens"
 CHI_break_the_confucionists_desc:0 "Nous commencerons à briser les confucéens et travaillerons jour et nuit pour les détruire entièrement ainsi que leurs pratiques dégénérées en opposition à notre pays. Ils seront massacrés !"
 CHI_undo_the_damage_of_the_cim:0 "Annuler les dégâts de la CIM"
 CHI_undo_the_damage_of_the_dim_desc:0 "La China Inland Mission a fait de grandes choses pour corrompre notre pureté de pensée, en répandant des idéaux chrétiens dégénérés à travers la Chine ! Nous travaillerons à anéantir leurs effets et à organiser une persécution plus grande que tout ce que Néron a pu faire."
 CHI_full_autarky:0 "Autarcie totale"
 CHI_full_autarky_desc:0 "Nous avons enfin atteint l’autarcie et il est donc temps d’accomplir la dernière étape nécessaire pour réparer notre économie !"
 CHI_a_new_socalled_religion:0 "Une nouvelle prétendue religion"
 CHI_a_new_socalled_religion_desc:0 "Avec les religieux dégénérés détruits, il est temps pour nous d’imposer pleinement notre nouvelle religion, exaltant l’État et notre nouveau sens de la Raison irréligieuse ! Gloire à l’Empereur !"
 CHI_the_three_principles_of_the_nation:0 "Les trois principes de la §RNation§!"
 CHI_the_three_principles_of_the_nation_desc:0 "La ROC a ses Trois Principes. Ils sont vieux et dépassés et ont ruiné la culture chinoise. Pour y remédier, nous établirons trois nouveaux principes pour la Chine : les Trois Unités, les Trois Purités, les Trois Forces."
 CHI_santong:0 "Santong"
 CHI_santong_desc:0 "Nous travaillerons à unifier les aspects centraux de notre État sous nos nouvelles « Trois Unités ». Nous unirons la direction et l’autorité de l’État sous l’Empereur afin de consolider le pouvoir, nous unirons le peuple et créerons une Volksgemeinschaft (communauté populaire) sur le modèle des Allemands, et enfin nous unifierons le pays et établirons le grand objectif d’unifier la Nation chinoise !"
 CHI_guo:0 "Guo"
 CHI_guo_desc:0 "We will empower a sense of Chinese Nationalism and purism in our pursuit of it in order to have truly a great central unitary state! China will be United!"
 CHI_min:0 "Min"
 CHI_min_desc:0 "We will set forth uniting the People behind a common goal, a fellowship similar to what the Germans call the Volksgemeinschaft! The Chinese People will unite behind us!"
 CHI_wang:0 "Wang"
 CHI_wang_desc:0 "We will work to put the Emperor at the heart of everything and make sure that he personally is the incarnate unity of the Nation! A United China under the Emperor will be Forged!"
 CHI_sanchun:0 "Sanchun"
 CHI_sanchun_desc:0 "We will declare the three purities of our Nation. To survive, we need purity of blood and culture to create a strong Chinese Nation and Volk. Furthermore, we must purify the wisdom of our people, so that everyone in our country shares our Wisdom and ideas!"
 CHI_wen:0 "Wen"
 CHI_wen_desc:0 "We will purify the Chinese of the Great Chinese Nation! The Emperor will work day and night to sinify the Chinese culture and ensure that it will be pure after his own ideal with no minorities resisting us anymore!"
 CHI_zhi:0 "Zhi"
 CHI_zhi_desc:0 "We will purify the Wisdom of the Great Chinese Nation! The Emperor will work day and night to ensure that the entire people follows his school of thought! Resistance of false intellectuals will be driven out as we secure the People's Minds!"
 CHI_sanqiang:0 "Sanqiang"
 CHI_sanqiang_desc:0 "We will build up our three strengths as well, we will have our strength of a great faith under our atheism, a great army, capable of purging our state and defending us, and finally a vast swathes of resources, capable of feeding our war machine and being exported."
 CHI_xin:0 "Xin"
 CHI_xin_desc:0 "We will work hard every day to make our sense of atheism and reason one of our greatest strengths, this will lead to a modern and pure people, capable of resisting foreign deception!"
 CHI_wu:0 "Wu"
 CHI_wu_desc:0 "We will work towards achieving strength by military force and use it to purge our state of its enemies and create a great empire capable of resisting outside attack!"
 CHI_cai:0 "Cai"
 CHI_cai_desc:0 "If we are to modernize and build a large military, we need to increase our resource extraction, as this way we will be more than capable of acquiring all the finances and producing all the resources we need! Autarky and full self reliance will be achieved!"
 CHI_xie:0 "Xie"
 CHI_xie_desc:0 "We as Chinese have Chinese blood and we must keep it pure. We will do everything to ensure that this is accomplished and not a drop of our great blood is made impure! We will begin the purification process right now as we destroy the westerners in our state!"
 CHI_prepare_for_the_three_year_plan:0 "Prepare for the '3 year Plan'"
 CHI_prepare_for_the_three_year_plan_desc:0 "We will make final preparations for the so called 3 year plan, which will allow us to truly transform the model province into a great state capable of providing for it's people!"
 CHI_project_gaosu_gonglu:0 "Project 'Gaosu Gonglu'"
 CHI_project_gaosu_gonglu_desc:0 "We will begin Project 'Gaosu Gonglu' (Engl. Fast Major Road/Highway), an integral part of our plan. We will begin building a Chinese Highway capable of transporting vast amounts of people and objects."
 CHI_upgrade_the_gonglu:0 "Upgrade the 'Gonglu'"
 CHI_upgrade_the_gonglu_desc:0 "With initial projects having made good progress, it is time that we upgrade our highways, making our Clique a truly great place to live and our logistics flawless."
 CHI_output_1: "Increased Workplace Efficiency"
 CHI_output_2: "New Industrial Methods"
 CHI_output_3: "The Modern [GXC.GetAdjective] Workplace"
 CHI_finalize_the_gonglu:0 "Finalize the 'Gonglu'"
 CHI_finalize_the_gonglu_desc:0 "We will now work towards finalizing the Highway, this will allow us to become truly a logistical powerhouse capable of fighting for China!"
 CHI_increase_workplace_efficiency:0 "Increase Workplace Efficiency"
 CHI_increase_workplace_efficiency_desc:0 "We will work toward increasing the efficiency in our workplaces, so that they may truly become great at doing their jobs."
 CHI_implement_new_methods:0 "Implement New Methods"
 CHI_implement_new_methods_desc:0 "We will implement new methods in our factories to ensure that we may truly reach peak efficiency with the materiel we can produce for China."
 CHI_a_modern_workplace:0 "A Modern Workplace"
 CHI_a_modern_workplace_desc:0 "We have finally done it! The workplaces in [ROOT.GetNameDef] are now indeed some of the best on earth! What a great time to be around!"
 CHI_increase_metal_output:0 "Increase Metal Output"
 CHI_increase_metal_output_desc:0 "Steel and Aluminum are key materials in ensuring that we can properly industrialize and build a proper economy for China, we must increase the output of these materials."
 CHI_advanced_metal_extraction:0 "Advanced Metal Extraction"
 CHI_advanced_metal_extraction_desc:0 "While we now have large amounts of cheap metal being produced, it is time that we work towards producing high quality metal, suitable for advanced tasks to feed our industry."
 CHI_synthetic_oil_production:0 "Synthetic Oil Production"
 CHI_synthetic_oil_production_desc:0 "With our metal output now suitable, we will begin producing our own oil, allowing us to have our own rubber and oil output for all tasks in our industry."
 CHI_project_gongchang:0 "Project 'Gongchang'"
 CHI_project_gongchang_desc:0 "We will begin Project Gongchang (Workplace/Factory) as the factories are the backbone of our economy, this project will aim towards the revolutionizing of our factories and the mass production of industry."
 CHI_additional_gongchang:0 "Additional 'Gongchang'"
 CHI_additional_gongchang_desc:0 "With the project going well, we need further factories to help us properly industrialize and allow our economy to truly flourish."
 CHI_a_largescale_economy:0 "A Large-Scale Economy"
 CHI_a_largescale_economy_desc:0 "With Project 'Gongchang' being accomplished, we can now safely say that we have a modern large-scale economy, capable of competing with other small countries."
 CHI_a_model_province_indeed:0 "A Model Province Indeed"
 CHI_a_model_province_indeed_desc:0 "With the Success of the 3 year Plan, we can indeed state that our plans have been a great success and that we are now the most industrious region in China!"
 CHI_professionalize_the_army_mp:0 "Professionalize the Army"
 CHI_professionalize_the_army_mp_desc:0 "With us having brought back our army from neglect, it is time to ensure professional standards are restored, so that we can properly fight."
 CHI_new_model_province2:0 "New Model Province"
 CHI_new_model_province2_desc:0 "With the KMT's acceptance of us, we will declare ourselves to be a new model province of China and work to become an industrial powerhouse!"
 CHI_break_the_shackles:0 "Break the Shackles"
 CHI_break_the_shackles_desc:0 "With [CUG.GetNameDef] fighting for its survival, it is time to break the shackles it has put down on us. We will break free from their oppression and restore our independence!"
 CHI_seize_the_mantle_of_national_governance:0 "Seize the Mantle of National Governance"
 CHI_seize_the_mantle_of_national_governance_desc:0 "We will seize the mantle of National Governance, as China fades! We are the new China and it is time to proclaim ourselves as exactly that!"
 CHI_survival_of_the_fittest:0 "Survival of the Fittest"
 CHI_survival_of_the_fittest_desc:0 "With [CUG.GetNameDef] in complete collapse, it is time that we leave the united front and cease hostilities with Japan."
 CHI_learn_from_chinese_equipment:0 "Learn from Chinese Equipment"
 CHI_learn_from_chinese_equipment_desc:0 "We will look at Chinese weaponry and make use of the information we gain to improve our troops and better counter theirs."
 CHI_learn_from_japanese_equipment:0 "Learn from Japanese Equipment"
 CHI_learn_from_japanese_equipment_desc:0 "We will look at Japanese weaponry and make use of the information we gain to improve our troops and better counter theirs."
 CHI_bribe_chinese_officers:0 "Bribe Chinese Officers"
 CHI_bribe_chinese_officers_desc:0 "We will pay a bit of money to Chinese officers to leak key secrets to allow us to better counter them in any war."
 CHI_a_great_victory:0 "A Great Victory"
 CHI_a_great_victory_desc:0 "It is done! We have finally beat the Japanese and saved China! None can match the Chinese prowess. Now, however, it is time to see what our future is..."
 CHI_bribe_japanese_officers:0 "Bribe Japanese Officers"
 CHI_bribe_japanese_officers_desc:0 "We will pay a bit of money to Japanese officers to leak key secrets to allow us to better counter them in any war."
 CHI_request_communist_removal:0 "Request Removal of [PRC.GetNameDef]"
 CHI_request_communist_removal_desc:0 "We will request the removal of [PRC.GetNameDef] from the Chinese United Front, as these horrid people should never have been allowed in in the first place!"
 CHI_a_neutral_battlefield:0 "A Neutral Battlefield"
 CHI_a_neutral_battlefield_desc:0 "With invasion imminent, we will reach out to Japan and ask for peace, in exchange, we will allow them to move through our lands with impunity and allow the war to continue to be fought through our lands."
 CHI_chinese_united_front:0 "Chinese United Front"
 CHI_chinese_united_front_desc:0 "With the War of Resistance begun, we will stand together against Japan as a sign of National Unity! Long live China!"
 CHI_left_front: "Has Left the Chinese United Front"
 CHI_a_final_warning:0 "A Final Warning"
 CHI_a_final_warning_desc:0 "Some warlords have rejected our advances earlier, perhaps they do not understand our intent. We will send them our offer again. This time with full intent on attacking, should they reject."
 CHI_free_china_from_imperialism:0 "Free China from Imperialism"
 CHI_free_china_from_imperialism_desc:0 "We will send an ultimatum to the imperialists who are assaulting our country and demand they withdraw, so that China may finally be free!"
 CHI_federalism_the_savior_of_china:0 "Federalism, the Savior of China"
 CHI_federalism_the_savior_of_china_desc:0 "We have seen that it was federalism that brought back China up off its knees! With this, we can indeed declare that Federalism is the true savior of China!"
 CHI_the_united_provinces_of_china:0 "The United Provinces of China"
 CHI_the_united_provinces_of_china_desc:0 "With us having gained national governance, we will now do what we have always sought out to do. We will declare the United Provinces of China and strengthen our new federal China!"
 CHI_japanese_lapdog:0 "Japanese Lapdog"
 CHI_review_the_fortifications:0 "Review the Fortifications"
 CHI_review_the_fortifications_desc:0 "We will Review our fortifications and inspect them carefully so that we can make more of them in the future."
 CHI_initial_fortification_tests:0 "Initial Fortification Tests"
 CHI_initial_fortification_tests_desc:0 "We will use the new information we have gained and build a new fort in our capital in order to fully test out how to make good forts."
 CHI_fortify_the_frontier:0 "Fortify the Frontier"
 CHI_fortify_the_frontier_desc:0 "We will fortify the frontier of our country to be able to hold our border against [CUG.GetNameDef]."
 CHI_high_level_forifications:0 "High Level Fortifications"
 CHI_high_level_fortifications_desc:0 "We will work toward high level fortifications in our capital and ensure that the capital will always be held."
 CHI_review_the_army:0 "Review the Army"
 CHI_review_the_army_desc:0 "We will review the army of our State. This will help us work towards a truly modern army."
 CHI_a_decentralized_high_command:0 "A Decentralized High Command"
 CHI_a_decentralized_high_command_desc:0 "We will make an effort to decentralize the High Command of our Army so that we may be able to better hold in the event of invasion."
 CHI_uncaring_warfare:0 "Uncaring Warfare"
 CHI_uncaring_warfare_desc:0 "Warfare in China has been quite Uncaring in China and as such we will embrace that and work towards implementing these things in our army to ensure the power of it."
 CHI_slash_ration_sizes:0 "Slash Ration Sizes"
 CHI_slash_ration_sizes_desc:0 "We will slash the ration sizes of our troops in order to make it much cheaper and efficient to employ a massive army."
 CHI_appropriate_civillian_stockpiles:0 "Appropriate Civilian Stockpiles"
 CHI_appropriate_civillian_stockpiles_desc:0 "We will allow our soldiers to appropriate Stockpiles from our Civilians and allow them to plunder at will, much reducing the logistical burden of fielding them."
 CHI_legalize_farm_helping:0 "Legalize 'Farm Helping'"
 CHI_legalize_farm_helping_desc:0 "We will allow our soldiers to 'help' in the fields of farmers, however this will not be altruistic help, instead we will allow them to seize control of the farmers' fruits of their fields. This will allow them to simply live off the land."
 CHI_mass_military_impressment:0 "Mass Military Impressment"
 CHI_mass_military_impressment_desc:0 "We will begin massive military impressment to ensure our military is large enough. This may slightly dilute our military, however the mass deployment of troops will more than compensate for this."
 CHI_a_gun_behind_every_rock:0 "A Gun Behind Every Rock"
 CHI_a_gun_behind_every_rock_desc:0 "We will work towards having a gun behind every rock and ensure that we can hold every part of our nation to ensure the protection of it."
 CHI_the_country_is_where_the_general_is:0 "Where the General is, There is the Country"
 CHI_the_country_is_where_the_general_is_desc:0 "We will attempt to consolidate the army and country around the General. This way we will be able to hold on in any and every situation!"
 CHI_defense_of_the_fatherland:0 "In Defense of the Fatherland"
 CHI_defense_of_the_fatherland_desc:0 "We will create an army with the sole goal of defending our country. We will work towards this and achieve this."
 CHI_a_proper_high_command:0 "A Proper High Command"
 CHI_a_proper_high_command_desc:0 "We will begin to establish a proper High Command in our army, so that it may operate highly effectively in each situation."
 CHI_a_new_recruitment_centre:0 "A new Recruitment Centre"
 CHI_a_new_recruitment_centre_desc:0 "With a new High Command established, we will empower them to force the people to enter the army with this new recruitment Centre."
 CHI_mountain_training:0 "Rough Terrain Training"
 CHI_mountain_training_desc:0 "We will work on helping our army fight in rough terrain and use it to fight the enemy in places they can't reach well, especially our mountaineers will help fight in those situations."
 CHI_a_central_high_command:0 "Central High Command"
 CHI_a_central_high_command_desc:0 "We work towards creating a central high command to ensure the fast modernization of our forces."
 CHI_a_modern_army:0 "A Modern Army"
 CHI_a_modern_army_desc:0 "We will enforce new modern methods we have seen in the west. This will work wonders in the modernization of our forces."
 CHI_a_military_planning_school:0 "A Military Planning School"
 CHI_a_military_planning_school_desc:0 "We will create a military planning school to work out great plans for our military to fight our wars. This will greatly improve our effectiveness."
 CHI_modern_warfare:0 "Modern Warfare"
 CHI_modern_warfare_desc:0 "With our Reforms complete, we have truly made a modern army and achieved modernity."
 CHI_an_auxuliary_army:0 "An Auxiliary Army"
 CHI_an_auxuliary_army_desc:0 "It will be our goal to create an army to help support our overlord. This purpose based approach will make it much easier to make our army effective."
 CHI_task_specific_planning:0 "Task Specific Planning"
 CHI_task_specific_planning_desc:0 "We will allow our military to plan specifically for each task separately, with our small army that is achievable and will make our military be able to achieve each task with peak results."
 CHI_a_gruelling_training_regimen:0 "A Grueling Training Regimen"
 CHI_a_gruelling_training_regimen_desc:0 "We will force our military into a grueling Training Regimen, with our small army this is very doable. This will make our military quite a lot more effective in the field."
 CHI_a_new_special_forces_project:0 "A New Special Forces Project"
 CHI_a_new_special_forces_project_desc:0 "We will work on a new special forces project and allow them to be able to fight a lot more effectively."
 CHI_uplift_the_special_forces:0 "Uplift the Special Forces"
 CHI_uplift_the_special_forces_desc:0 "We will uplift our special forces and select a lot more carefully between our soldiers and fight a lot more effectively."
 CHI_a_new_tank_project:0 "A New Tank Project"
 CHI_a_new_tank_project_desc:0 "We will work on a new Tank project and modernize our army in this aspect to allow armor to lead our troops."
 CHI_uplift_the_tanks:0 "Uplift the Tanks"
 CHI_uplift_the_tanks_desc:0 "We will uplift our tank forces and select a lot more carefully between our soldiers and fight a lot more effectively."
 CHI_industrial_investment2:0 "Industrial Investment"
 CHI_industrial_investment2_desc:1 "While our resources may be limited, we should still funnel what capital we have into improving our economy."
 CHI_public_education_reform2:0 "Public Education Reform"
 CHI_public_education_reform2_desc:1 "The foundation of a modern nation is knowledge and science. We must first improve and strengthen that foundation."
 CHI_local_arms_production2:0 "Local Arms Production"
 CHI_local_arms_production2_desc:1 "As long as we are seen as merely an insignificant minor faction in the war, we can not rely on deliveries of weapons from outside. We will have to develop our own arsenals to build weapons."
 CHI_long_term_economic_planning2:0 "Long Term Economic Planning"
 CHI_long_term_economic_planning2_desc:1 "Our bureaucratic apparatus is not as big as that of the Central Government. This allows us to cut much of the red tape that hinders economic development and focus our modest efforts to get the highest possible payoff."
 CHI_local_arms_development2:0 "Local Arms Development"
 CHI_local_arms_development2_desc:1 "Producing crude copies of foreign guns is not enough. If we want to keep pace with the rest of China, we must develop new weapons."
 CHI_heavy_weapons_development2:0 "Heavy Weapons Development"
 CHI_heavy_weapons_development2_desc:1 "With resources scarce, we must make maximum use of what little heavy firepower we have. We should order new artillery guns to be developed."
 CHI_assemble_the_regency_council:0 "Assemble the Regency Council"
 CHI_assemble_the_regency_council_desc:0 "With our support secured, we will assemble the regency council to make the warlord King. We will put them in front of facts set in stone that they will do this. Long live the Emperor!"
 CHI_a_new_chinese_empire:0 "A New Chinese Empire"
 CHI_a_new_chinese_empire_desc:0 "We will proclaim a new Chinese Empire with the warlord as Empire! None will stop us now!"
 CHI_staff_the_royal_court:0 "Staff the Royal Court"
 CHI_staff_the_royal_court_desc:0 "With us having declared a new Empire, we must create a fitting royal court and will staff the royal court with the correct people supporting us."
 CHI_royal_splendour:0 "Royal Splendor"
 CHI_royal_splendour_desc:0 "With our court staffed, we will create a sense of splendor around the Emperor. This will motivate our people to work for us and support the great Emperor!"
 CHI_denounce_the_roc:0 "Denounce [CUG.GetNameDef]"
 CHI_denounce_the_roc_desc:0 "We will denounce the Republic of China and hold great speeches against them. This way our soldiers will be much more on our side in the final uniting of the Kingdom."
 CHI_state_confutionism:0 "State Confucianism"
 CHI_state_confutionism_desc:0 "We will impose state Confucianism in China and will work toward that. this will greatly secure the fate of China."
 CHI_consolidate_imperial_power:0 "Consolidate Imperial Power"
 CHI_consolidate_imperial_power_desc:0 "With Confucianism in place, we will consolidate imperial power and force them to fuse with the Monarchy, creating a great complex to rule the nation."
 CHI_crackdown_on_the_kmt:0 "Crackdown on the KMT"
 CHI_crackdown_on_the_kmt_desc:0 "With the KMT having lost ever more power, we will begin a major crackdown on them and attempt to purge them from all parts of Chinese society."
 CHI_invest_in_the_royal_army:0 "Invest in the Royal Army"
 CHI_invest_in_the_royal_army_desc:0 "If we are an Empire full of splendor, then our Army must reflect this too. Therefore we must launch a massive investment into it to ensure that it can hold up to any foreign threat."
 CHI_entice_british_investments:0 "Entice British Investments"
 CHI_entice_british_investments_desc:0 "With the British too having a monarch and with their widespread influence over China, we will beg them for investments to fix our weak economy."
 CHI_a_modern_economy:0 "A Modern Economy"
 CHI_a_modern_economy_desc:0 "With the use of the investments and after enough time, we now have a modern economy in our region in China! The emperor is indeed great!"
 CHI_a_declaration_from_the_clergy:0 "A Declaration from the Clergy"
 CHI_a_declaration_from_the_clergy_desc:0 "We will have the Confucian Priests work together and come up with a theological grounding for our Monarchy and say that we are the only salvation for China!"
 CHI_a_final_blow_to_the_kmt:0 "A Final Blow to the KMT"
 CHI_a_final_blow_to_the_kmt_desc:0 "We will commence a final blow to the KMT in our lands, with the Clergy and people on our side and eliminate every trace of them in our Nation."
 CHI_prepare_to_unite_the_kingdom:0 "Prepare to Unite the Empire"
 CHI_prepare_to_unite_the_kingdom_desc:0 "With the situation improved enough for this, we will prepare to Unite the great Empire of China!"
 CHI_cater_to_the_past:0 "Cater to the Past"
 CHI_cater_to_the_past_desc:0 "To ensure a proper alternative to the KMT we will embrace ideas from the past. Confucianism and Monarchism will be the salvation of China!"
 CHI_reempower_religious_ideas:0 "Reempower Religious Ideas"
 CHI_reempower_religious_ideas_desc:0 "If our plan is supposed to go through, we will have to boost religious support, so that long term our regime may hold."
 CHI_prepare_supply_lines:0 "Prepare Supply Lines"
 CHI_prepare_supply_lines_desc:0 "In order to unite Muslim China, we must ensure our supply lines are ready to deal with the other cliques."
 CHI_lay_claim_to_muslim_china:0 "Lay Claim to Muslim China"
 CHI_lay_claim_to_muslim_china_desc:0 "With us having secured power over our state, we will now lay claim to be the true representative of Muslim China and seek to unify it, ensuring that we may truly empower the Hui Muslims in China."
 CHI_begin_operations:0 "Begin Military Operations"
 CHI_begin_operations_desc:0 "With our claims layed out, we will begin to mobilize the military in order to march on the other warlords and unite China."
 CHI_a_victory_for_islam:0 "A Victory for Islam"
 CHI_a_victory_for_islam_desc:0 "We have won and are Victorious, we will declare this to be a great Victory for Islam here."
 CHI_alignment_with_the_kmt:0 "Seek Alignment with the KMT"
 CHI_alignment_with_the_kmt_desc:0 "In order to secure power in Northwest China, we will reach out to Nanjing and the KMT, in order to have a strong backer of ours."
 CHI_ultimatum_to_the_warlord:0 "Ultimatum to the Warlord"
 CHI_ultimatum_to_the_warlord_desc:0 "With us having support from the KMT, we will send an ultimatum to the Warlord to follow through with his Islamic tradition and bow to our will."
 CHI_fire_the_flames_of_islam:0 "Fan the Flames of Islam"
 CHI_fire_the_flames_of_islam_desc:0 "We are an Islamic people, unlike the rest of China. Therefore, we will accentuate that difference and ensure a separate destiny for the Hui people."
 CHI_a_religion_of_peace:0 "A Religion of Peace"
 CHI_a_religion_of_peace_desc:0 "Islam is primarily a religion of peace, therefore we will merely seek a union of Islamic states in Northwestern China."
 CHI_secure_warlord_support:0 "Secure Warlord Support"
 CHI_secure_warlord_support_desc:0 "We will reach out to the warlord and secure his support from him in order to facilitate our Religious state for the Hui People."
 CHI_swap_out_non_hui_nobility:0 "Swap out non-Hui Nobility"
 CHI_swap_out_non_hui_nobility_desc:0 "With the Warlord on our side, we will take over the state and get rid of the non-Hui nobility and establish our own state."
 CHI_nationalist_socialist_indoctrination:0 "Nationalist Socialist Indoctrination"
 CHI_natiinalist_socialist_indoctrination_desc:0 "With the Two principles and our National Government established, we will begin to indoctrinate our people in our ways so that we can be in a position to unite the Fatherland!"
 CHI_prepare_for_national_unification:0 "Prepare for National Unification"
 CHI_prepare_for_national_unification_desc:0 "With our people sufficiently indoctrinated, it is time for us to prepare for National Unification."
 CHI_foster_a_chinese_volksgemeinschaft:0 "A Chinese Volksgemeinschaft"
 CHI_foster_a_chinese_volksgemeinschaft_desc:0 "In order to have our country made great, we must create a 'Volksgemeinschaft' in the Example of the Germans. This way our people will be able to stick together more."
 CHI_donations_for_the_national_army:0 "Donations for the National Army"
 CHI_donations_for_the_national_army_desc:0 "The National Army has been in a lapsed state for a long time. To combat this, we will ask for donations from the Chinese People and our Volksgemeinschaft!"
 CHI_donations_for_the_welfare_of_the_people:0 "Donations for the Welfare of the People"
 CHI_donations_for_the_welfare_of_the_people_desc:0 "We will furthermore ask the people to donate to our own economy. This way the Volksgemeinschaft will be made strong."
 CHI_the_national_unity_government:0 "The National Unity Government"
 CHI_the_national_unity_government_desc:0 "With the league in power, we will declare a National Government in order to assist the league to accomplish its Goal to create a great Chinese National Republic!"
 CHI_minzhu_minsheng:0 "Minzhu & Minsheng"
 CHI_minzhu_minsheng_desc:0 "The Chinese believe in three principles. This is wrong, however, the principle of democracy is a mistake and an abomination. Instead we will reduce it to Nationalism and Socialism and turn this into a new ideology!"
 CHI_envoy_to_germany:0 "Envoy to Germany"
 CHI_envoy_to_germany_desc:0 "With us having a similar ideology of Nationalist Socialism, we will send an envoy to Germany to ask them to move their support away from [CHI.GetNameDef]."
 CHI_nationalize_corrupt_buisnesses:0 "Nationalize Corrupt Business"
 CHI_nationalize_corrupt_buisnesses_desc:0 "We will begin a policy of nationalizing Corrupt businesses owned by KMT and Criminals. This will give us much more economic influence and allow us to fix our economic woes."
 CHI_republic_without_democracy:0 "Republic Without Democracy"
 CHI_republic_without_democracy_desc:0 "The Congress has decided we will become a Chinese National republic, however, unlike with other Republics, we will not instate democracy, instead we have the Warlord lead us on toward Victory!"
 CHI_national_regeneration_league_victory:0 "National Regeneration League Victory"
 CHI_national_regeneration_league_victory_desc:0 "The Chinese Republic has had the National Regeneration League win and establish a new Republic!"
 CHI_an_enabling_act:0 "An Enabling Act"
 CHI_an_enabling_act_desc:0 "With the League having taken over the Republic, we will put through an enabling act and ensure the abolishment of democracy in line with our ideology. This will make our government a lot more effective."
 CHI_devolop_a_cult_of_personality:0 "Develop a Cult of Personality"
 CHI_devolop_a_cult_of_personality_desc:0 "In order to effectively maintain our governance over the region and provide a functioning alternative to the KMT, we will develop a cult of personality around the warlord."
 CHI_radicalize_anti_japanese_retoric:0 "Radicalize Anti-Japanese Rhetoric"
 CHI_radicalize_anti_japanese_retoric_desc:0 "To effectively empower our new government, we will declare full enmity to the Japanese and embolden this rhetoric! This way the Chinese people will much more support us and our plans to reclaim China!"
 CHI_radicalize_chinese_nationalism:0 "Radicalize Chinese Nationalism"
 CHI_radicalize_chinese_nationalism_desc:0 "We will attempt to radicalize Chinese Nationalism. This way we will be seen as the true Chinese state and the Chinese Nation State will be made great through us!"
 CHI_convene_the_national_unity_congress:0 "Convene the National Unity Congress"
 CHI_convene_the_national_unity_congress_desc:0 "With us having spread our influence all throughout our Clique, we will convene a great Congress, laying down the fate of our state! Will the warlord lead a new republic or allow himself to be made Emperor of All Chinese People!"
 CHI_crush_the_farmers:0 "Crush the Farmers"
 CHI_crush_the_farmers_desc:0 "With the all Chinese resistance in action against us, we will secure the countryside and crush the rebelling farmers, this way our military can be ready for future operations. None can defy the warlord."
 CHI_crush_the_workers:0 "Crush the Workers"
 CHI_crush_the_workers_desc:0 "We will crush the workers who have revolted. This will ensure that the only people left opposing us are the KMT party members, who will be simple to deal with."
 CHI_government_of_national_salvation:0 "Government of National Salvation"
 CHI_government_of_national_salvation_desc:0 "We will declare the Government of National Salvation and prepare to save our part of China from the Evil Chiangists and Maoists!"
 CHI_oust_kmt_troublemakers:0 "Oust KMT Troublemakers"
 CHI_oust_kmt_troublemakers_desc:0 "All things are in place, the KMT party members will now be rounded up and made to disappear..."
 CHI_use_anti_chinese_intel_from_japan:0 "Japanese Anti-Chinese Intel"
 CHI_use_anti_chinese_intel_From_japan_desc:0 "With the war having begun, we will request the Japanese to provide us with intel on China, so that we are capable of holding them off."
 CHI_ramp_up_anti_communist_retoric:0 "Ramp up Anti-Communist Rhetoric"
 CHI_ramp_up_anti_communist_retoric_desc:0 "In order to bring the people in behind us, we will justify our turning towards Japan by pointing out the horrors of Communism and all that they have done wrong! This will make them the main enemy rather than us."
 CHI_display_the_cruelty_of_chaing_and_mao:0 "Display the Cruelty of Chiang and Mao"
 CHI_display_the_cruelty_of_chaing_and_mao_desc:0 "We will now begin to point out all the atrocities Chiang and Mao and their tinpot dictatorship have committed among the Chinese people."
 CHI_an_alternative_to_the_two:0 "An Alternative to KMT and CCP"
 CHI_an_alternative_to_the_two_desc:0 "Now that we have proven how horrid the KMT and CCP are, we will decide to provide an alternative, under the benevolent umbrella of the Japanese in order to be a true state for the Chinese People."
 CHI_japanese_money:0 "Japanese Money"
 CHI_japanese_money_desc:0 "We will request Money from Japan in order to secure a proper industry. This way our rule may be ever more prosperous."
 CHI_military_training_in_japan:0 "Military Training in Japan"
 CHI_military_training_in_japan_desc:0 "With the Kwantung Army here, we can now send recruits to Japan to receive their training. This will help our army modernize fast."
 CHI_japanese_military_support:0 "Japanese Military Support"
 CHI_japanese_military_support_desc:0 "With us having economic support from Japan for our economy, we will also gain it for our army. This way we will be capable of holding off China."
 CHI_further_japanese_guns:0 "Request Further Japanese Guns"
 CHI_further_japanese_guns_desc:0 "We need more Guns to hold off China. We must acquire them. To do so, we will request Japan give us some more."
 CHI_our_own_military_desc:0 "Now that our military has modernized, it is time for us to have our own military and slowly become self-sufficient."
 CHI_begin_invitation_of_the_kwantung_army:0 "Invite the Kwantung Army"
 CHI_begin_invitation_of_the_kwantung_army_desc:0 "With Japanese support secured, we will invite the Kwantung army in order to be better able to counter the Chinese invaders and build a larger army!"
 CHI_seek_japanese_support2:0 "Seek Japanese Support"
 CHI_submit_to_tokyo:0 "Submit to Tokyo"
 CHI_submit_to_tokyo_desc:0 "We will submit to Tokyo in order to secure the future of our warlord state. Perhaps this will even open the door for Chinese unification!"
 CHI_a_japanese_national_government:0 "A Japanese National Government"
 CHI_a_japanese_national_government_desc:0 "With the betrayal of the Manchurians, we will now take over the claim of China under Japan to prepare for a new National Government."
 CHI_consolidate_control_over_china:0 "Consolidate Control over China"
 CHI_consolidate_control_over_china_desc:0 "We will now begin to consolidate control over China, and ensure that the people begin to see us as the true government of China! China has been United and we are the new saviors of China!"
 CHI_seek_japanese_support2_desc:0 "With the tinpot dictatorship and the degenerate Maoists slaughtering Children all over China, we need an alternative ally, and the only one left is Japan, perhaps we will be able to spread our wings that way."
 CHI_reinvest_the_collectivisations:0 "Rural Collectivization"
 CHI_reinvest_the_collectivisations_desc:0 "We have seized much property from the Chinese Bourgeois, we will now reinvest it into the local economies, as to fix our economy and help the workers."
 CHI_our_own_military_industrial_complex:0 "Our Own Military Industry"
 CHI_our_own_military_industrial_complex_desc:0 "If we are to ever hold out against [CHI.GetNameDef] or [Jap.GetNameDef], then we must first build our own military. To do so, we need our own military industry. We shall get to this task immediately."
 CHI_an_economy_for_the_proletariat:0 "An Economy for the Proletariat"
 CHI_an_economy_for_the_proletariat_desc:0 "With our military being built up, we must now fulfill our promise to our civilians and begin investing in an economy for our workers."
 CHI_empower_the_regional_pla:0 "Empower the regional PLA"
 CHI_empower_the_regional_pla_desc:0 "With the military secured, we will allow it to take over the State. This way the PLA will be much more effective at helping us successfully uniting China!"
 CHI_shaping_the_state_in_ones_own_image:0 "Shaping the State in One's Own Image"
 CHI_shaping_the_state_in_ones_own_image_desc:0 "With the military in power, we will begin to shape the state in the warlord's image, including making soldiers swear oaths to him personally."
 CHI_a_new_peoples_republic:0 "A New [PRC.GetName]"
 CHI_a_new_peoples_republic_desc:0 "With the loyalty of the army secured to the warlord, he has decided that he will declare himself to be the only true Chinese Government, and will declare the Second People's Republic."
 CHI_troops_for_mao:0 "Send Volunteers to [PRC.GetNameDef]"
 CHI_troops_for_mao_desc:0 "With Mao fighting against [ROC.GetNameDef], we will send him a large contingent of men in order to support his struggle."
 CHI_loyalty_has_its_rewards:0 "Loyalty Has its Rewards"
 CHI_loyalty_has_its_rewards_desc:0 "With us and our contingent of men having been of great help to Mao and China having been united under [PRC.GetNameDef], we can now profit from the rewards of our loyalty and help to Mao."
 CHI_a_great_purge:0 "Sideline Rebellious Officers"
 CHI_a_great_purge_desc:0 "With our military revolting after our switch to communism, it is time we take an example from the great Stalin and do a massive purge, cementing our authority over the military."
 CHI_full_membership_in_the_republic:0 "Full Integration in [PRC.GetNameDef]"
 CHI_full_membership_in_the_republic_desc:0 "With [PRC.GetNameDef] becoming ever more united, it is time that we too integrate ourselves. This way China can be made one again!"
 CHI_learn_from_the_maoists:0 "Learn from the Maoists"
 CHI_learn_from_the_maoists_desc:0 "The Maoists have much experience fighting [CHI.GetNameDef]. Therefore we will ask them to give us some of this experience so that we, too, may effectively fight them."
 CHI_join_the_chinese_soviet2:0 "Join [PRC.GetNameDef]"
 CHI_join_the_chinese_soviet2_desc:0 "With the Revolution secured in our Clique, it is time to join Mao. This way the Chinese Soviet Republic can truly be made great again!"
 CHI_public_works2:0 "Public Works"
 CHI_public_works2_desc:0 "With our communist state established, it is time to begin public works. This way the people may truly demonstrate their love for China and socialism!"
 CHI_rural_militias2:0 "Rural Militias"
 CHI_rural_militias2_desc:0 "We will be creating a plan for rural militias. This way we can solve the manpower issue and make use of the unemployed masses of the countryside."
 CHI_labor_reform2:0 "Labor Reform"
 CHI_labor_reform2_desc:0 "Nous allons créer un plan massif de réforme du travail, à la fois pour rendre notre main-d’œuvre plus efficace et pour augmenter la main-d’œuvre dont nous disposons !"
 CHI_cooperation_with_the_communists2:0 "Turn towards Communism"
 CHI_cooperation_with_the_communists2_desc:0 "The warlord has adopted the ways of communism and has begun implementing Communist ideals in his clique!"
 CHI_land_redistribution2:0 "Land Redistribution"
 CHI_land_redistribution2_desc:0 "We shall begin to redistribute land from the corrupt rich and give it to the poor workers of China! This will greatly help stabilize our economy, as the capital and labor will be brought together!"
 CHI_ideological_education2:0 "Ideological Education"
 CHI_ideological_deucation2_desc:0 "We shall begin educating the people in the ways of communism. This will help quell much of the fear and hatred for our government!"
 CHI_land_value_tax2:0 "Land Value Tax"
 CHI_land_value_tax2_desc:0 "We will now put in place a land value tax. This way we will be able to properly redistribute wealth over time, ensuring a strong state financing and a supportive people!"
 CHI_communist_administrators2:0 "Communist Administrators"
 CHI_communist_administrators2_desc:0 "With our administration so young, it may be advisable to bring some administrators in from [PRC.GetNameDef], this way they will help us recover and be able to run our state smoothly."
 CHI_judiciary_reforms2:0 "Judiciary Reforms"
 CHI_judiciary_reforms2_desc:0 "We will implement large scale judiciary Reforms. This way we will be able to greatly stabilize our government and put in place a Communist law set."
 CHI_the_warlord_stays:0 "The Warlord Stays"
 CHI_the_warlord_stays_desc:0 "The warlord's private followers have formed a party and won the election!"
 CHI_province_work_force_conscription:0 "Conscription de la main-d'œuvre provinciale"
 CHI_province_work_force_conscription_desc:0 "If our economy is to recover from the warlord days, we must allow our federal provinces to conscript workers, this way they can contribute to our economy and we can reduce government overspending."
 CHI_work_out_provincial_workforce_regulations:0 "Élaborer les règlements provinciaux sur la main-d'œuvre"
 CHI_work_out_provincial_workforce_regulations_desc:0 "Avec la reprise économique, nous pouvons désormais mettre en place des réglementations sur le travail. Ainsi, nos employés seront protégés pendant que nous travaillons sur nos enjeux économiques."
 CHI_provide_funds_for_local_infrastructure:0 "Provide Funds for Local Infrastructure"
 CHI_provide_funds_for_local_infrastructure_desc:0 "Nous utiliserons les fonds provenant de notre nouvelle main-d’œuvre pour financer une amélioration massive des infrastructures locales, ce qui améliorera considérablement notre qualité de vie et notre capacité économique."
 CHI_begin_local_industrialisation:0 "Begin Local Industrialization"
 CHI_begin_local_industrialisation_desc:0 "We will, now that the infrastructure is in place make use of our funds in order to upgrade our economic capacity and start industrializing."
 CHI_enforce_local_military_budgets:0 "Enforce Local Military Budgets"
 CHI_enforce_local_military_budgets_desc:0 "We will also force our federal states to begin investing in the military. This is our only means of ensuring we have enough funds and methods in place to counter an attack from outside."
 CHI_oust_KMT_influence:0 "Oust KMT Influence"
 CHI_oust_KMT_influence_desc:0 "Rather than giving up our own statehood, we will oust the remaining influence of the KMT and ensure that we can embrace our own destiny! Glory to the clique!"
 CHI_opposition2:0 "Opposition"
 CHI_opposition2_desc:0 "The Chiangists and Maoists are both horrible people who have committed grave atrocities among the Chinese People! We will declare to be an opposition to both of them!"
 CHI_an_alternative_to_the_KMT:0 "An Alternative to the KMT"
 CHI_an_alternative_to_the_KMT_desc:0 "If we are to truly represent the Chinese people, we cannot submit to Japan, instead we will prepare to become an alternative to the KMT, without succumbing to the excesses of Mao!"
 CHI_a_true_chinese_republic:0 "A True Chinese Republic"
 CHI_a_true_chinese_republic_desc:0 "With the Chiangists promising democracy and yet imposing a dictatorship, we will do the opposite, we will immediately begin reforming our clique into a democratic state, worthy of the people's trust."
 CHI_question_of_the_system:0 "The Question of the System"
 CHI_question_of_the_system_desc:0 "With us preparing for elections, we must create a system by which the state will operate."
 CHI_party_founding_act:0 "Party Founding Act"
 CHI_party_founding_act_desc:0 "If we are to hold elections, we must allow a variety of parties to form. To do this, we will pass the 'Party founding Act'."
 CHI_anti_KMT_propaganda:0 "Anti KMT Propaganda"
 CHI_anti_KMT_propaganda_desc:0 "With the KMT meddling in our affairs and illegitimately having a stranglehold on many of our people, we must begin propaganda against them, to secure our people and army from defection!"
 CHI_question_of_the_constitution:0 "The Question of the Constitution"
 CHI_question_of_the_constitution_desc:0 "With our System selected, we must now plan out the details of our Constitution."
 CHI_hold_free_elections:0 "Hold Free Elections"
 CHI_hold_free_elections_desc:0 "Everything is finally in place! We may now hold free elections in our small state!"
 CHI_federalist_victory:0 "Federalist Victory"
 CHI_federalist_victory_desc:0 "The Federalists and their appeal to regional sovereignty have won!"
 CHI_empower_the_federal_states:0 "Empower the Federal States"
 CHI_empower_the_federal_states_desc:0 "With us federalists in power, we shall now empower the federal states! This way federalism can indeed prosper and our first principles can be fulfilled!"
 CHI_full_hezhong:0 "Full Hezhong"
 CHI_full_hezhong_desc:0 "With the federal States empowered, we may now divide the country into Hezhong to ensure the federalism can truly be lived out!"
 CHI_beacon_of_federalism_desc:0 "With our economy thriving and our federalist policy in place, we can truly say that true federalism has been achieved here and that we are a shining beacon of it!"
 CHI_a_new_federalist_national_government:0 "A New Federalist National Government"
 CHI_a_new_federalist_national_government_desc:0 "With us having begun initial progress towards federalism and our headquarters having been set up, it is time to truly oppose the Chiangists and Maoists. To do this, we will declare a new national Government and prepare to unite China!"
 CHI_an_appeal_for_autonomy:0 "An Appeal for Autonomy"
 CHI_an_appeal_for_autonomy_desc:0 "It seems hopeless that we may unite China, instead we will reach out to the ROC, asking to become an autonomous federal state of theirs, keeping federalism to our region along with the ones under our governates."
 CHI_train_everywhere_always:0 "Train Everywhere Always"
 CHI_train_everywhere_always_desc:0 "With our state secured, we will embark on a massive training Program. This way we will equip our army to learn the details of the country and make use of every nook or cranny."
 CHI_make_a_detailed_home_plan:0 "Make a Detailed Home Plan"
 CHI_make_a_detailed_home_plan_desc:0 "Having learned all the intricacies of our country in our training exercises, we will centralize this information in one plan, this way all of our soldiers can fight perfectly everywhere, not just in the few places they trained."
 CHI_the_territories_to_free:0 "The Territories to Liberate"
 CHI_the_territories_to_free_desc:0 "In order to make China great again and bring the fight to our enemy, we will lay out claims on the enemy's Land. This way our NRA influence will soon grow!"
 CHI_begin_the_war:0 "March into the Territories"
 CHI_begin_the_war_desc:0 "We will begin marching into our Lands and seize them by an invasion without warning. This bold move will hopefully have the enemy retreat from these lands without a fight, but if not, we are more than prepared to fight them and seize the territories By force."
 CHI_declare_victory_over_the_fiends:0 "Declare Victory Over the Fiends"
 CHI_declare_victory_over_the_fiends_desc:0 "With our Territories seized, and mission accomplished, we can now fully declare victory!"
 CHI_a_bulwark_of_defense:0 "A Bulwark of Defense"
 CHI_a_time_for_integration:0 "A Time for Integration"
 CHI_a_time_for_integration_desc:0 "All things are set in place, and as the warlord grows weary of running this state, he shall now retire and allow the Clique to fully integrate into the [CHI.GetName]"
 CHI_national_defense_state:0 "National Defense State"
 CHI_national_defense_state_desc:0 "With war on the horizon, we must prepare as best we can for it, we will do everything we possibly can to mobilize and ensure that China will not fall!"
 CHI_chinese_defense_industry:0 "[ROOT.GetAdjective] Defense Industry"
 CHI_chinese_defense_industry_desc:0 "If we are ever to play a part in the defense of China, we must work to build up our own defense industry. This way we will be able to hold off the invaders and save our great nation!"
 CHI_Coalition_with_the_KMT:0 "Coalition with the KMT"
 CHI_Coalition_with_the_KMT_desc:0 "With the KMT controlling most of China, it is they who we will support. We shall reach out and offer to be a Clique loyal to them, so long as they just allow us to retain our regional influence under their national Government."
 CHI_technological_cooperation2:0 "Technological Cooperation"
 CHI_technological_cooperation2_desc:0 "We will attempt to learn from the Army of the [CHI.GetName]. This way we will quickly modernize and be of use to the NRA."
 CHI_secure_internal_politics2:0 "Secure Internal Politics"
 CHI_secure_internal_politics2_desc:0 "The Clique has been floating around doing nothing for the past years, this must end, however, as world events are speeding up. It is time that the Clique takes a stance in the world."
 CHI_investments_from_nanjing:0 "Investments from Nanjing"
 CHI_investments_from_nanjing_desc:0 "With our becoming a part of [CHI.GetNameDef], we can request them to provide us with funds to fix our broken Economy."
 CHI_national_defense_fund:0 "National Defense Fund"
 CHI_national_defense_fund_desc:0 "We shall put together a National Defense Fund to ensure that we have the funds to ensure a strong military to fight off our enemies."
 CHI_commander_political_training:0 "Train Commanders in the Ways of Politics"
 CHI_commander_political_training_desc:0 "If our Commanders of the NRA should ever take over the Clique, we must ensure that they are properly equipped for the tasks of running our state. Therefore we will train them in these ways."
 CHI_professionalize_the_army:0 "Professionalize the Army"
 CHI_professionalize_the_army_desc:0 "Our Army consists of Unprofessional rabble. If they should ever defend our state, our army must be professionalized to be able to accomplish this great task."
 CHI_commence_nra_takeover:0 "Commence NRA Takeover"
 CHI_commence_nra_takeover_desc:0 "We will commence a takeover for the NRA, fully accomplishing our goal of becoming a bulwark of defense for [CHI.GetNameDef]."
 CHI_unite_the_province:0 "Unite the Province"
 CHI_unite_the_province_desc:0 "Our Province has long been divided, however, now that we have empowered the NRA, it is time to strike and unite our great Province of Xinjiang in Western China!"
 CHI_request_kmt_protection:0 "Request KMT Protection"
 CHI_request_kmt_protection_desc:0 "We are hopeless on our own. With the Nationalists on one side, the Communists on the other and even the Japanese coming for us. If we are to survive at all, we must pick a side and the only one that is willing to work with us is the central KMT Government."
 CHI_secure_kmt_funds:0 "Secure Funds from the KMT"
 CHI_secure_kmt_funds_desc:0 "With us being under their Influence it is a simple task for them to loan us a small amount of money. This stable currency will go great lengths to improve our feeble economy."
 CHI_centralise_authority_around_the_warlord:0 "Centralize Authority around the Warlord"
 CHI_centralise_authority_around_the_warlord_desc:0 "The Warlord is in command of all aspects of our Clique. If we are to survive or thrive, he must consolidate his authority around him and thereby slowly bring the people towards himself rather than the government in Nanjing."
 CHI_seize_western_assets:0 "Seize Western Assets"
 CHI_seize_western_assets_desc:0 "Many foreign powers have large scale Assets in our country that they took up as the central Government lost influence. Now is the perfect time to take them back and reuse that good money for our own citizens and the Warlords tasks."
 CHI_denounce_the_japanese_empire:0 "Denounce the Japanese Empire"
 CHI_denounce_the_japanese_empire_desc:0 "The Japanese are the bane of all Chinese Peoples and have already greatly expanded their influence in northern China. We must denounce this and prepare for an invasion by them and look for any means to oppose these perfidious People!"
 CHI_seize_japanese_assets:0 "Seize Japanese Assets"
 CHI_seize_japanese_assets_desc:0 "With us having embargoed the Japanese it is but logical that we take over their assets in our country, as this way we would be in a much better position to counter their inevitable invasion."
 CHI_an_oath_of_loyalty:0 "An Oath of Loyalty"
 CHI_an_oath_of_loyalty_desc:0 "With the Warlord having gained more authority he will now have every soldier swear loyalty to him over everyone else. This way we will encourage soldiers to stay by his side in the case of an eventual Chinese invasion."
 CHI_seize_chinese_assets:0 "Seize Chinese Assets"
 CHI_seize_chinese_assets_desc:0 "With us having enforced loyalty to the Warlord, we are now in a position to shake off Chinese economic Influence and spread our own wings. This way we will be able to increase our profits."
 CHI_supreme_leader_of_all_china_desc:0 "With China united under us it is time. [ROOT.GetLeader] will be declared the supreme leader and a Hero of all Chinese People."
 CHI_bribe_chinese_officials:0 "Bribe Corrupt KMT Officials"
 CHI_bribe_chinese_officials_desc:0 "For our state to thrive, we must ensure peace with the National Government. For this, as they are corrupt enough, we shall spend a little of our money to get their officials to sign a statement ensuring they will not attack us."
 CHI_allow_civillian_pillaging:0 "Allow the Pillaging of Civilian Property"
 CHI_allow_civillian_pillaging_desc:0 "We shall allow our army a free hand to seize weapons and anything they please from the civilians, as we must ensure a strong army to survive. This way it will help pay for and equip itself."
 CHI_seize_assets_for_the_military:0 "Seize Civilian Assets for the Military"
 CHI_seize_assets_for_the_military_desc:0 "We shall now go ahead and seize any industries in civilian hands this way our military will have much larger capacities to produce domestic weaponry and deal with foreign threats."
 CHI_recruit_the_disenfanchised:0 "Recruit Disenfranchised Citizens"
 CHI_recruit_the_disenfanchised_desc:0 "With many people disenfranchised due to our recent actions, we shall allow the recruitment of them into our army. This way we will prevent a large-scale uprising and help solve the manpower issue."
 CHI_a_grand_army_for_the_warlord:0 "A Grand Army for the Warlord"
 CHI_a_grand_army_for_the_warlord_desc:0 "With army loyalty and recruitment secured, we can finally say that the warlord truly now has a grand army for himself, capable of defending the country from outside threats."
 CHI_contacts_in_the_roc:0 "Contacts in the Republic of China"
 CHI_contacts_in_the_roc_desc:0 "In preparation for our drug sales in China, we must establish connections all over the country. Luckily, we have a couple of men in Nanjing, who would do just about anything for a share of the profits..."
 CHI_siphon_local_trade:0 "Siphon Local Trade"
 CHI_siphon_local_trade_desc:0 "In order to secure the funds to pay for drug production initially, we shall siphon off of local trade and seize some of it for ourselves, this way we will have enough money to start this project to bring our country out of the gutter."
 CHI_begin_drug_production:0 "Begin Drug Production"
 CHI_begin_drug_produciton_desc:0 "With funding secured, we shall now take the hit and begin mass production of drugs, even though some of our population opposes it. This way we will be able to fix our economic woes."
 CHI_mass_drug_export:0 "Mass Drug Sales"
 CHI_mass_drug_export_desc:0 "With the drugs produced, we will now begin selling them, at the cost of the Chinese people. Soon great riches will be upon us!"
 CHI_a_concerted_effort_to_the_japanese_sphere:0 "Expand the Trade North"
 CHI_a_concerted_effort_to_the_japanese_sphere_desc:0 "While we may sell drugs, we are not without morals. We shall try to ensure that the great enemy of the Japanese takes as much damage as possible from our sale of drugs and that they too have to deal with the issues it brings. This way our people will not be betrayed."
 CHI_proliferate_the_chinese_drug_trade:0 "Proliferate the Chinese Drug Trade"
 CHI_proliferate_the_chinese_drug_trade_desc:0 "With the drug trade in China booming, we will double down. The money is too good to pass up and therefore we shall set nationalism aside for a bit..."
 CHI_maintain_the_status_quo:0 "Maintain the Status Quo"
 CHI_maintain_the_status_quo_desc:0 "With the warlord's influence slowly growing, trade is not needed. It is not advantageous to join the National government, however neither is it advantageous to fight it, instead we shall play both sides and profit."
 CHI_a_coalition_gov_for_national_survival:0 "A Coalition Government for National Survival"
 CHI_a_coalition_gov_for_national_survival_desc:0 "With Japan on our doorstep, we are forced to find allies to work together with. Therefore we will approach the KMT, as they share some of our ideological principles. One interesting side effect of this, however, is that we may be able to spread our influence in the RoC."
 CHI_collapse_the_coalition:0 "Collapse the Coalition"
 CHI_collapse_the_coalition_desc:0 "With us having saved China it is time to use our Cells in [CHI.GetNameDef] and attempt to collapse them and take control of the country by reigniting the Chinese Civil War."
 CHI_a_government_for_all_china:0 "A Government for All China"
 CHI_a_government_for_all_china_desc:0 "It is done. We have finally become a true Chinese Government!"
 CHI_march_on_the_cliques:0 "March on the Cliques"
 CHI_march_on_the_cliques_desc:0 "China has been fractured for far too long. Those that have not joined us to this day must die! We will take out the remaining warlords for their insolence!"
 CHI_march_on_nanjing:0 "March on Nanjing"
 CHI_march_on_nanjing_desc:0 "With Nanjing having led the oppression of China for so long, we will finally get our revenge! We will go and commence a national Revolution to reunite China!"
 CHI_prepare_to_kick_out_the_japanese:0 "Kick out the Japanese"
 CHI_prepare_to_kick_out_the_japanese_desc:0 "With Us having reunited China proper, we will now march on Manchuria and free China from the horror that is the Japanese occupation!"
 CHI_the_great_restoration:0 "The Great Restoration"
 CHI_the_great_restoration_desc:0 "We have done it! We are the only legitimate rulers of China! As such, we will begin the integration and restoration of our great new Nation!"
 CHI_autonomy_for_the_fractured_states:0 "Autonomy for the fractured states"
 CHI_autonomy_for_the_fractured_states_desc:0 "With much of China in the grip of warlords, we will ask them if they wish to recognize our government. Why? This is because we are not only the only legitimate ones, but we also will promise in their role as federal states, they will retain full autonomy over their internal affairs and will have rights to do as they please, so long as they toe our foreign policy line."
 CHI_an_all_chinese_university:0 "An All Chinese University"
 CHI_an_all_chinese_university_desc:0 "With us having United China, we will open up a new university, so that we may undo the damage that has been done to Chinese sciences under the KMT"
 KMT_maintain_military_support:0 "Maintain Military Support"
 KMT_maintain_military_support_desc:0 "We will maintain the support of the military around the old guard, ensuring that Chiang can have his will with China for the salvation of the country."
 KMT_stack_the_high_command_desc:0 "We will stack the Chinese High command, ensuring that it is fully loyal to us no matter what we do..."
 KMT_chiangs_word:0 "Chiang's Word"
 KMT_chiangs_word_desc:0 "All must obey Chiang's Word! We will follow this man to the end of our days."
 KMT_the_hardliners:0 "The Hardliners"
 KMT_the_hardliners_desc:0 "Chiang and his clique of Hardliners within the KMT have won over the electorate with the Generalissimo's popularity. It seems we have not fully removed the man after all."
 KMT_both_commander_in_chief_and_president:0 "Both Commander in Chief and President"
 KMT_both_commander_in_chief_and_president_desc:0 "We will make Chiang both Commander and President of China, giving him power over the key institutions of the state should anything happen to parliament..."
 KMT_back_with_a_veangance:0 "Back with a Vengeance"
 KMT_back_with_a_veangance_desc:0 "Chiang has returned and he is hungry for revenge. While the party has pushed him out of his position as dictator, it seems a return to that may be inevitable..."
 KMT_the_nanjing_incident:0 "The Nanjing Incident"
 KMT_the_nanjing_incident_desc:0 "We will stage an incident around Nanjing, allowing us to force through emergency measures to take over full control of the state and circumvent the legislative controls..."
 KMT_dissolve_the_provisional_yuans:0 "Dissolve the Yuans"
 KMT_dissolve_the_provisional_yuans_desc:0 "With our provisional legislative branch in place, this shackle will be removed! We will dissolve it in light of our 'crisis' and ensure that it will only convene again on the day of the enabling act."
 KMT_the_enabling_act:0 "The Enabling Act"
 KMT_the_enabling_act_desc:0 "We will sign into effect an enabling act, ensuring our permanent ownership of the state and the destruction of democracy, at least for now. This will give us what we need to deal with the perfidious people who stole our power."
 KMT_declare_martial_law_demo:0 "Declare Martial Law"
 KMT_declare_martial_law_demo_desc:0 "Having taken over the sole ruling function of the state, we will declare martial law, allowing us to make use of the military in civilian matters, ensuring we can do as we please."
 KMT_vanquish_democratic_institutions:0 "Vanquish Democratic Institutions"
 KMT_vanquish_democratic_institutions_desc:0 "We will Vanquish democracy in China, ensuring its defeat. With the army in place none will be able to stop us."
 KMT_rely_on_military_supremacy:0 "Rely on Military Supremacy"
 KMT_rely_on_military_supremacy_desc:0 "We will rely on our military, ensuring that no one can oust us. Sedition can not be tolerated."
 KMT_use_the_military:0 "Use the Military"
 KMT_use_the_military_desc:0 "With our military in our hands, we will send it out into positions all throughout major Chinese cities, to begin watching our enemies and track those who stole our power."
 KMT_military_oath_of_loyalty:0 "Military Oath of Loyalty"
 KMT_military_oath_of_loyalty_desc:0 "Before doing our great operations, we must demand an oath of loyalty to Chiang himself from the army. This will ensure its obedience, regardless of the circumstances."
 KMT_patrol_the_streets:0 "Patrol the Streets"
 KMT_patrol_the_streets_desc:0 "We will begin to patrol the streets in public, further bringing the army into civilian rather than military matters. This will allow us to move our last figures in place to prepare for mass arrests of those who forced our hand."
 KMT_mass_arrests_of_opposition:0 "Mass Arrests of Oppositions"
 KMT_mass_arrests_of_opposition_desc:0 "We will begin arresting the opposition en Masse via our military. Some complain, but is it not their own fault for opposing us in the first place?"
 KMT_exalt_the_army:0 "Exalt the Army"
 KMT_exalt_the_army_desc:0 "To prepare for the great battle against the legislative, we will exalt the army, ensuring that it feels honored by our regime."
 KMT_retake_field_command:0 "Retake Field Command"
 KMT_retake_field_command_desc:0 "Chiang will now finally take personal command of this new army, leaving his bureaucratic job to once again fight for the sake of China."
 KMT_march_out_against_the_legislative:0 "March out Against the Legislative"
 KMT_march_out_against_the_legislative_desc:0 "With all in place and the first wave of arrests and executions complete, we will march out and fight pitched battles against the last strongholds of opposition. None will resist Chiang's Rule."
 KMT_dictatorship_in_all_but_name:0 "Dictatorship in All But Name"
 KMT_dictatorship_in_all_but_name_desc:0 "Chiang has now become a dictator in all but name. It is clear that he is the true face of China and none can resist him. Furthermore with those that have betrayed him captured or slain, he is finally satisfied."
 KMT_transfer_powers_to_the_assembly:0 "Transfer Powers to the Assembly"
 KMT_transfer_powers_to_the_assembly_desc:0 "With the Assembly being supportive of us, unlike certain other branches of government, we will increase their power, allowing for us to consolidate a great bloc against our opposition and achieve vengeance."
 KMT_secure_new_political_allies:0 "Secure New Political Allies"
 KMT_secure_new_political_allies_desc:0 "We will secure new political allies, those few that support Chiang in the legislative. These will serve as a basis for our future plans."
 KMT_stack_the_legislative:0 "Stack the Legislative"
 KMT_stack_the_legislative_desc:0 "If we should ever lift the enabling act, we should first use our new allies to stack the legislative branch of government, allowing us to rule through it after the act's lifting."
 KMT_civilian_oath_of_loyalty:0 "Civilian Oath of Loyalty"
 KMT_civilian_oath_of_loyalty_desc:0 "If we want to be strong after the act's lifting, we must demand all members of government who are active take an oath of loyalty to Chiang, this will make it official treason to betray this man's will."
 KMT_the_nanjing_investigation_committee:0 "The Nanjing Investigation Com."
 KMT_the_nanjing_investigation_committee_desc:0 "We will create a new committee to 'investigate' what happened in Nanjing. This will allow us to frame those we hate and those who betrayed Chiang."
 KMT_frame_the_traitor:0 "Frame the Traitors"
 KMT_frame_the_traitor_desc:0 "With the NIC giving us its first 'results', it is clear we can now finally arrest all those who forced Chiang to cede power. It is time to right this great wrong and get back on his behalf for all time."
 KMT_a_pure_state:0 "A Pure State"
 KMT_a_pure_state_desc:0 "With the Government Stacked and the traitors punished, we now have a pure state, allowing Chiang to control everything from top to bottom while still following the bureaucratic code."
 KMT_democracy_in_name_only:0 "Democracy in Name Only"
 KMT_democracy_in_name_only_desc:0 "We will now lift the enabling act, legitimizing our government for the people, yet with our reforms in the last months, we have made sure that Chiang will always rule and that there will never be a credible force of opposition against him, giving the guise of a democracy but just being a Chiangist dictatorship."
 CHI_a_great_unitary_china:0 "A Great Unitary China"
 CHI_a_great_unitary_china_desc:0 "With us having united China under our Jackboot, it is time that China truly enters its golden age."
 CHI_there_is_only_one_language_chaing_speaks:0 "There is Only One Language Chiang speaks"
 CHI_there_is_only_one_language_chaing_speaks_desc: "We have seen Chiang's ways and it is apparent that he merely speaks one language. That of Violence! Therefore we must fight him and save the country from him by force!"
 CHI_demand_repealing_of_the_unequal_treaties: "Demand Repealing of the Unequal Treaties"
 CHI_demand_repealing_of_the_unequal_treateis_desc:0 "With us having united China, we will now demand one final thing to fully upend the unequal treaties. The allies must cede the treaty ports they seized from us!"
 CHI_integrate_the_warlords_desc:0 "With China united, it is time to send our warlords ultimatums to surrender and be integrated or die trying to resist unification."
 CHI_a_constitutional_monarchy:0 "A Constitutional Monarchy"
 CHI_a_constitutional_monarchy_desc:0 "We will implement a constitutional Monarchy, taking the best elements of Monarchy and fusing them with a robust democracy."
 CHI_consolidate_the_national_unity_government:0 "Consolidate the NUG"
 CHI_consolidate_the_national_unity_government_desc:0 "With us having been able to combine different centers of our power, it is time for us to consolidate our Regime under the great Warlord of Nationalist Socialism."
 CHI_demand_transferance_of_national_power:0 "Demand Transference of National Power"
 CHI_demand_transferance_of_national_power_desc:0 "We will demand that [CUG.GetNameDef] surrender to our regime and become a governate of ours along with giving us the mantle of being the true Chinese Government."
 CHI_maintain_the_harsh_stance:0 "Maintain the harsh Stance"
 CHI_maintain_the_harsh_stance_desc:0 "We will maintain our harsh stance against communism and denounce [PRC.GetNameDef] despite our temporary alliance."
 CHI_limited_cooperation:0 "Limited Cooperation"
 CHI_limited_cooperation_desc:0 "We will begin limited cooperation with [PRC.GetNameDef], this may be against our ideology, but it is for the Sake of China!"
 CHI_maintain_chinese_infighting:0 "Maintain Chinese Infighting"
 CHI_maintain_chinese_infighting_desc:0 "We will keep up the infighting running rampant in China, while we may be allies, that won't stop us from taking what we want."
 CHI_mobilize_against_japan:0 "Mobilize Against [JAP.GetNameDef]"
 CHI_mobilize_against_japan_desc:0 "With the war of resistance upon us, we will mobilize our army and prepare to fight the foreign attacker and save our country!"
 CHI_adopt_chinese_tactics:0 "Adopt the Chinese Command Structure"
 CHI_adopt_chinese_tactics_desc:0 "We will adopt the Chinese command structure in our army. This way we will be much more effective against the Japanese!"
 CHI_infiltrate_chinese_command_structure:0 "Infiltrate the Chinese command Structure"
 CHI_infiltrate_chinese_command_structure_desc:0 "We will infiltrate the Chinese command structure. This way, when the Front finally collapses, we will have a large advantage against them!"
 CHI_allow_communist_cells:0 "Allow Communist Cells"
 CHI_allow_communist_cells_desc:0 "We will allow the communists to establish cells in our country. This way, we will strengthen our ability to fight the outward enemy!"
 CHI_preempt_corruption:0 "Preempt Corruption"
 CHI_preempt_corruption_desc:0 "With Corruption Rampant in China, we will preempt it spreading to our model province. This will allow us to become a truly modern nation."
 CHI_demand_workplace_integrity:0 "Demand Workplace integrity"
 CHI_demand_workplace_integrity_desc:0 "We will demand that our people have integrity at work and implement new measures to achieve this!"
 CHI_an_integritable_workforce:0 "Une main-d'œuvre intégrative"
 CHI_an_integritable_workforce_desc:0 "La corruption étant enfin éradiquée, il est devenu évident que notre province dispose d’une main-d’œuvre pleine d’intégrité et prête à vraiment briller !"
 CHI_embrace_corruption:0 "Embrace Corruption"
 CHI_embrace_corruption_desc:0 "We will Embrace Corruption in our state, allowing us to make use of it's fruits and truly leverage our economy."
 CHI_dabble_in_the_opium_trade:0 "Dabble in the Opium Trade"
 CHI_dabble_in_the_opium_trade_desc:0 "We will now work to dabble in the Opium trade, as despite the harmful effect on our people, there are millions to be made here!"
 CHI_fully_embrace_the_opium_trade:0 "Fully Embrace the Opium Trade"
 CHI_fully_embrace_the_opium_trade_desc:0 "With the market created, we can now fully embrace the opium trade, and truly become a rich Government capable of great spending!"
 KMT_a_second_purge_of_leftists:0 "A Second Purge of leftists"
 KMT_a_second_purge_of_leftists_desc:0 "With the leftists now having a chance to run rampant in our party, we must deal with them. Communism must have no place in our great country!"
 CHI_total_mobilization_for_the_emporer:0 "Total Mobilization for the Emperor"
 CHI_total_mobilization_for_the_emporer_desc:0 "With China itself at stake, we will fully mobilize the country to fully ensure its survival and that of the emperor! None can be above the Grand emperor and all who try must die!"
 CHI_reach_out_to_nanjing:0 "Reach out to Nanjing"
 CHI_reach_out_to_nanjing_desc:0 "We will reach out to Nanjing and offer to Join the KMT Government there, so long as they allow us regional autonomy and allow Left Kuomintang activity in China."
 CHI_western_victory:0 "Western Victory"
 CHI_western_victory_desc:0 "We have done it, the election is won! It is now time to make a truly prosperous State for our people and work towards remodeling our state in the shape of the western powers!"
 CHI_christian_democracy_desc:0 "We will work towards spreading Christianity in our lands and work towards the forming of a state that brings about the best for its people through Christian governance and morals."
 CHI_modernize_the_armed_forces:0 "Modernize the Armed Forces"
 CHI_modernize_the_armed_forces_desc:0 "We will work towards the modernization of our armed forces and create a truly modern army in the model of the western countries."
 CHI_modern_innovations:0 "Modern Innovations"
 CHI_modern_innovations_desc:0 "We will work towards implementing modern innovations in our military high command and ensure that it is highly effective."
 CHI_economic_mobilization:0 "Economic Mobilization"
 CHI_economic_mobilization_desc:0 "With our military having been modernized, it is time for us to mobilize the economy and work towards the creation of a great military economy."
 CHI_a_modern_national_army:0 "A Modern National Army"
 CHI_a_modern_national_army_desc:0 "With China unified, we will tighten standards and cut out excess conscription, instead improving quality through our great screening."
 CHI_begin_the_quest_for_developental_aid:0 "Begin the Quest for Developmental Aid"
 CHI_begin_the_quest_for_developental_aid_desc:0 "To Fix our economy, we will begin working to secure developmental aid from within and without, so that we may truly have a wealthy economy for our poor people"
 CHI_core_tenants_of_the_faith:0 "The Core Tenants of the Faith"
 CHI_core_tenants_of_the_faith_desc:0 "To stop heresy, we will hold on to the core tenants of the Faith. We shall enshrine the Niceno-Constantinopolitan Creed."
 CHI_a_god_honorig_legal_code:0 "A God Honoring Legal Code"
 CHI_a_god_honorig_legal_code_desc:0 "We will create a legal Code based on biblical principles to create a just and godly society for the betterment and sanctification of our people."
 CHI_state_funding_for_religious_schools:0 "State Funding for Religious Schools"
 CHI_state_funding_for_religious_schools_desc:0 "We will begin legal support and funding for religious schools, as if we want to teach our children our beliefs and impart them with our faith, they must have the highest standard of education and knowledge in both the sciences and in our faith."
 CHI_reach_out_to_the_local_elites:0 "Reach out to Local Elites"
 CHI_reach_out_to_the_local_elites_desc:0 "We will reach out to the local elites, and persuade them to invest in our new state in order to increase their own profits in the long run, thus improving the state of capitalism in our nation."
 CHI_stabilze_the_economy:0 "Stabilize the Economy"
 CHI_stabilze_the_economy_desc:0 "We have had enough fast investments, it is now time to stabilize the economy and ensure it's continued long term competitiveness"
 CHI_import_western_technology:0 "Import Western Technology"
 CHI_import_western_technology_desc:0 "we will begin the importing of western technology. This way we will be able to ensure that we can compete with the modern economies around the world with high quality products."
 CHI_abandon_china:0 "Abandon China"
 CHI_abandon_china_desc:0 "We will seek to abandon China and go our own way, we will work to empower local Islamists and separatists!"
 CHI_expand_regional_identity:0 "Expand Separatism"
 CHI_expand_regional_identity_desc:0 "We will begin to work with the local separatists and help to encourage that and help foster a new regional identity allowing for our independence."
 CHI_begin_the_desinofication_of_root:0 "Begin the Desinofication of [ROOT.GetNameDef]"
 CHI_begin_the_desinofication_of_root_desc:0 "We will begin working toward a new state and we will work to purge the Chinese influence of our state and ensure that we can free ourselves of the Chinese influence."
 CHI_meet_with_the_army:0 "Meet with the Army"
 CHI_meet_with_the_army_desc:0 "We will meet with the army and seek to work with them and get them on board with our separatism so that they may help us with our great quest!"
 CHI_a_declaration_of_statehood:0 "A Declaration of Statehood"
 CHI_a_declaration_of_statehood_desc:0 "We will declare statehood and change our name to represent our new separatist identity!"
 CHI_reinvigorate_the_national_economy:0 "Reinvigorate the National Economy"
 CHI_reinvigorate_the_national_economy_desc:0 "We will work to reinvigorate the National Economy and ensure that we can prosper and develop a great economy full of riches!"
 CHI_prepare_for_national_unification2:0 "Prepare for National Unification"
 CHI_prepare_for_national_unification2_desc:0 "We will begin to work towards the unification of east Turkestan and destroy the fake warlord clique resisting us!"
 CHI_break_the_kmt_stranglehold:0 "Break the KMT Stranglehold"
 CHI_break_the_kmt_stranglehold_desc:0 "We will work day and night to break the stranglehold the KMT has over our army. The Chiangists must be purged and China must be freed!"
 CHI_arrest_kmt_officials:0 "Arrest KMT Officials"
 CHI_arrest_kmt_officials_desc:0 "We will work to arrest KMT officials and we will ensure that there will be no more destabilizing KMT influence in our state structure. That way soon our clique may be free of Chinese meddling!"
 CHI_arrest_kmt_officers:0 "Arrest KMT Officers"
 CHI_arrest_kmt_officers_desc:0 "We will arrest all KMT officers in our army, while it may temporarily hurt, this will break the stranglehold the KMT has over our armed forces!"
 CHI_a_new_alternative_form_of_nationalism:0 "A New, Alternative form of Nationalism"
 CHI_a_new_alternative_form_of_nationalism_desc:0 "We will remove the idea that we are all a great Chinese nation from the minds of our people. Instead we will offer them an alternative, giving them a regional nation to hold on to and exalt as our new nation."
 CHI_a_cleansing_of_the_new_state:0 "Eradicate KMT Influence"
 CHI_a_cleansing_of_the_new_state_desc:0 "We will work to fully cleanse our State from the last vestiges of the KMT. The Nation State must be secure!"
 CHI_enshrine_the_national_savior:0 "Enshrine the National Savior"
 CHI_enshrine_the_national_savior_desc:0 "With our state having finally dealt with the problems facing it, it is time to exalt the National Savior and help enshrine his authority in our great new state!"
 CHI_british_money:0 "British Money"
 CHI_british_money_desc:0 "The British are a key player in our region and we will therefore reach out to them and request some economic aid in our westernization."
 CHI_french_money:0 "French Money"
 CHI_french_money_desc:0 "The French are a key player in our region and we will therefore reach out to them and request some economic aid in our westernization."
 CHI_american_money:0 "American Money"
 CHI_american_money_desc:0 "The Americans are a key player in our region and we will therefore reach out to them and request some economic aid in our westernization."
 CHI_secular_institutions:0 "Secular Institutions"
 CHI_secular_institutions_desc:0 "We will establish secular institutions after the model of the other western states so that we may be a model state in their example."
 CHI_empower_the_capitalists:0 "Empower the Capitalists"
 CHI_empower_the_capitalists_desc:0 "We will empower the capitalists in our nation and help work with them to fully make use of our economy to create a thriving region full of wealth!"
 CHI_rewrite_the_constitiution:0 "A Liberal Constitution"
 CHI_rewrite_the_constitiution_desc:0 "We will rewrite the constitution to insert both liberal western ideas and a liberal economic policy, while this may turn some heads, it is for the greater good of the nation!"
 CHI_unbridled_capitalism:0 "Unbridled Capitalism"
 CHI_unbridled_capitalism_desc:0 "we will work towards unbridling Capitalism in our nation and focus on maximizing the economic output of our great nation, allowing for us to truly become wealthy, even though some workers may feel exploited, it is for the greater good."
 CHI_further_increase_resource_output:0 "Further increase Resource Output"
 CHI_further_increase_resource_output2:0 "We will work towards further increasing our resource output, even at the cost of our people, after all, who cannot crush a few eggshells while working for a much greater goal?"
 CHI_a_new_republic:0 "A New Republic"
 CHI_a_new_republic_desc:0 "We will declare a new republic, fully independent and in preparation to reclaim China and create a great and free state!"
 CHI_lobby_for_western_recognition:0 "Lobby for Western Recognition"
 CHI_lobby_for_western_recognition_desc:0 "We will reach out to the western powers and seek recognition for our republic so that we can be safe from outside attack!"
 CHI_seek_recognition_from_the_occident:0 "Seek Recognition from the Occident"
 CHI_seek_recognition_from_the_occident_desc:0 "With our new Christian republic established, we will reach out to the old Christian allies in the occident and seek help from the Christian nations there!"
 CHI_one_china_two_systems:0 "One China Two Systems"
 CHI_one_china_two_systems_desc:0 "We will reach out to [CUG.GetNameDef] and request them to uplift their claims on us, instead we will mutually exist and live in peace."
 CHI_help_the_cim:0 "Help the CIM"
 CHI_help_the_cim_desc:0 "We will begin to work with the CIM and push through their evangelization en masse, so that our country and people can be reached by the good news of the gospel!"
 CHI_lkmt_victory:0 "Left-Kuomintang Victory"
 CHI_lkmt_victory_desc:0 "While they were cast out from the Republic of China, the Left wing of the Kuomintang has had a resurgence and won the elections."
 CHI_strengthen_the_radicals:0 "Strengthen the Radicals"
 CHI_strengthen_the_radicals_desc:0 "With our takeover successful, we will begin to work with the radicals in the KMT, so that we can properly assert ourselves from Nanjing's influence."
 CHI_hoist_the_red_flag:0 "Hoist the Red Flag"
 CHI_hoist_the_red_flag_desc:0 "With the Radicals gaining ever more party, we shall further allow them to operate so as not to jeopardize our great Coalition!"
 CHI_empower_party_democracy:0 "Empower Party Democracy"
 CHI_empower_party_democracy_desc:0 "We will work to strengthen the democratic institutions in our party, so that it will truly align with the three principles of the people!"
 CHI_strengthen_the_conservatives:0 "Strengthen the Conservatives"
 CHI_strengthen_the_conservatives_desc:0 "To make the KMT truly a mass movement, we will begin to work with the conservatives, even if they may have certain allegiances to Nanjing."
 CHI_empower_the_military:0 "Empower the Military"
 CHI_empower_the_military_desc:0 "We will work to strengthen the NRA to be better able to defend our Great China from the foreign invaders, be they Japanese, Soviets, or British!"
 CHI_the_second_thrid_congress_of_the_kmt:0 "The Second §RThird Congress of the KMT§!"
 CHI_the_second_thrid_congress_of_the_kmt_desc:0 "There has been no legitimate Congress of the KMT since we were purged, therefore we will now hold the true Third Congress of the KMT, announcing ourselves to be the only legitimate successors to Sun Yat-Sen and the true heirs of the Kuomintang National Revolution!"
 CHI_open_domestic_politics:0 "Open up Domestic Politics"
 CHI_open_domestic_politics_desc:0 "With our new state secured, we will work to open up domestic politics, allowing for our new state to be crafted according to the will of our people!"
 CHI_a_turkestani_national_state:0 "A Turkestani National State"
 CHI_a_turkestani_national_state_desc:0 "We will work to unite with our western brothers in [SOV.GetNameDef], so that we can establish a great Turkestani National State!"
 CHI_seize_the_colonial_possessions:0 "Seize the Colonial Possessions"
 CHI_seize_the_colonial_possessions_desc:0 "We will send the colonial powers ultimatums to withdraw from the local states of ours they have occupied! The Great National state will be secured!"
