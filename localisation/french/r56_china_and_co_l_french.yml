 chaing_dictatorship:0 "La dictature de Chiang"
 party_gaining_influence:0 "Le parti qui gagne en influence"
 party_influence_solidifying:0 "L'influence du Parti se renforce"
 the_party_supreme:0 "La suprématie du parti"
 the_party_dictatorship:0 "La dictature du parti"
 KMT_party_consolidation:0 "Influence du Parti Consolidée"
 KMT_the_kuomintang_natl_revolution:0 "La révolution nationale du Kuomintang"
 KMT_the_cc_clique:0 "La Clique du Club Central"
 KMT_organizer_of_the_clique:0 "Organisateur de la Clique"
 KMT_centralize_power:0 "Centraliser le Pouvoir"
 KMT_CCP: "Le Parti Communiste Chinois"
 KMT_neglecting_presidential_dutes:0 "Négliger les Devoirs Présidentiels"
 KMT_centralize_power_desc:0 "Avec notre nouveau régime établi, nous centraliserons le Pouvoir autour de notre nouveau Gouvernement, cela rendra notre domination imparable et nous apportera une grande gloire !"
