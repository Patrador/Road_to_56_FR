 KMT_party_of_landslords: "Parti des Propriétaires Terriens et Hommes d’Affaires"
 KMT_main_bop:0 "État de la Révolution Nationale du Kuomintang"
 KMT_main_bop_tt:0 "L’état du Kuomintang et sa lutte pour le pouvoir détermineront finalement le destin de la Chine et de sa direction. \nIl reste à voir qui sécurisera la Chine et l’emportera lors du §YProchain Congrès National§!."
