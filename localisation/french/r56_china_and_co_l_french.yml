 KMT_finish_land_reform_tt:0 "La réforme agraire sera considérée comme achevée et la mission disparaîtra."
 KMT_stab-10_ws5_f3_n1_tt:0 "Modify §YLa Révolution Nationale du Kuomintang§! by\nStabilité : §R-10%§!\nSoutien à la guerre : §G5%§!\nSoutien quotidien aux non-alignés : §G+0.01§!\nSoutien quotidien au fascisme : §G+0.03§!"
