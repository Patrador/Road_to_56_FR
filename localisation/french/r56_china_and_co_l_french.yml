 RULE_OPTION_OBEDIENCE_MAN_AI_DESC_a: "La Mandchourie s'engagera à respecter la règle de Puyi et le statu quo sous le Japon avec l'armée du Kwantung, progressant lentement vers sa propre identité nationale, tout en n'agissant qu'aux ordres du Japon."
 RULE_OPTION_OBEDIENCE_b: "La connexion Kwantung"
 RULE_OPTION_OBEDIENCE_MAN_AI_DESC_b: "La Mandchourie s'efforcera d'étendre l'influence du Kwantung et la sienne à toute la Chine, afin de la conquérir entièrement et de créer une nouvelle Chine sous domination japonaise."
 RULE_OPTION_OBEDIENCE_c: "Déposer Puyi"
 RULE_OPTION_OBEDIENCE_MAN_AI_DESC_c: "§YArbre de priorités Road to 56§! : La Mandchourie japonaise s’engagera pleinement à renverser Puyi et tentera d’agir de manière radicale afin d’établir son propre État.\n\n§YArbre de priorités No Compromise, No Surrender§! : L’IA mandchoue tentera de se libérer et de devenir la République populaire de Chine en suivant la branche correspondante de l’arbre des priorités nationales."
 RULE_OPTION_INDEPENDENCE_a: "Restauration Qing"
 RULE_OPTION_INDEPENDENCE_MAN_AI_DESC_a: "Puyi tentera de renverser les Japonais afin de rétablir l'Empire Qing sous son nouveau régime."
