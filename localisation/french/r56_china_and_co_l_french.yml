 CHI_warlords.1.t:0 "The Question of the System"
 CHI_warlords.1.desc:0 "Before we go about writing our constitution, we must decide what type of system our country should have. We could either have one with a strong permanent guiding hand of the warlord, where he is the president of each government, or we could have one where the parties will be fully empowered to run parliament as they please."
 CHI_warlords.2.t:0 "The Question of the Constitution"
 CHI_warlords.2.desc:0 "Writing a Constitution has not turned out easy, in fact it has caused much discussion. Many people believe the constitution should empower a strong executive, while others believe these duties should be left to the deep state. Now it is up to the warlord what to choose."
 CHI_warlords.3.t:0 "Election Results"
 CHI_warlords.3.desc:0 "We have finally held free elections. Now that this is done it is time to see who has won!"
 CHI_warlords.4.t:0 "[FROM.GetNameDefCap] Seeks to Submit to Us."
 CHI_warlords.4.desc:0 "It seems as though [FROM.GetNameDef] is afraid, as they have decided to abandon the plan for federalism for all China, instead they have reached out and offered to subjugate themselves to us, so long as we allow them to maintain the policies of federalism in their own land and governates. Do we make use of this to unite China, or do we hold out and fight and conquer these lands to implement direct rule?"
 CHI_warlords.5.t:0 "La guerre de résistance !"
 CHI_warlords.5.desc:0 "Ce que nous craignions depuis longtemps est arrivé ! Les Japonais, qui s'ingèrent dans notre pays et abusent de notre peuple depuis trop longtemps, ont finalement poussé les choses si loin qu'une guerre a éclaté entre nous. La guerre de résistance a donc éclaté et il est temps de se battre pour notre survie ! Cela soulève toutefois une question. Allons-nous inviter les autres cliques chinoises à se joindre à notre grand combat ?"
 CHI_warlords.6.t:0 "Une proposition pour sauver la Chine !"
 CHI_warlords.6.desc:0 "La plus grande catastrophe pour le peuple chinois vient de se produire ! [JAP.GetNameDefCap] a envahi notre pays ! [CUG.GetNameDef] ne semble pas du tout préparé à cette tâche. C'est pourquoi ils ont appelé tous les Chinois à les rejoindre pour repousser les Japonais ! Notre peuple est très favorable à ce grand élan de solidarité pour repousser les envahisseurs et sauver la Chine, mais ce n'est pas forcément dans notre intérêt. Que devons-nous faire à ce sujet ?"
 CHI_warlords.7.t:0 "Un seigneur de la guerre propose de rejoindre notre République"
 CHI_warlords.7.desc:0 "[FROM.GetLeader] de [FROM.GetNameDef] a proposé de rejoindre notre grande République, mais il demande à pouvoir contrôler sa clique comme une marionnette quelque peu autonome. Est-ce que nous acceptons cela ?"
 CHI_warlords.8.t:0 "Contre qui sommes-nous un rempart ?"
 CHI_warlords.8.desc:0 "Le fait que nous nous soyons déclarés un rempart de défense soulève une question : Contre qui nous défendons-nous ?"
 CHI_warlords.9.t:0 "Ultimatum de [FROM.GetNameDef]"
 CHI_warlords.9.desc:0 "[FROM.GetNameDefCap] nous a envoyé un ultimatum pour réclamer diverses terres qu'ils revendiquent. Ils ont déjà commencé à s'emparer de ces terres, la question est de savoir si nous les arrêtons ou si nous nous battons pour conserver nos terres."
 CHI_warlords.10.t:0 "[FROM.GetNameDefCap] Seeks Protection"
 CHI_warlords.10.desc:0 "We have just received an envoy from the warlord in [FROM.GetName]. The warlord seeks help against the threats from [Jap.GetName] and [PRC.GetName] and protection from our own Regime. Therefore he has offered to submit to our protection and foreign policy in exchange for maintaining his power over his Clique."
 CHI_warlords.11.t:0 "[FROM.GetNameDefCap] Bribes Our Officials!"
 CHI_warlords.11.desc:0 "We have gotten wind of the fact that [FROM.GetNameDef] has just bribed our officials to sign a Non-Aggression Pact with them. Of course this money is quite nice, however some question the fact that it comes at the expense of uniting our Country."
 CHI_warlords.12.t:0 "[FROM.GetNameDefCap] Seeks to Change Alignment"
 CHI_warlords.12.desc:0 "[FROM.GetNameDef] has sent us a delegation, asking if they would have a place in the Japanese sphere and they have announced that they will align with us and later become our subject, should we be willing to accept them."
 CHI_warlords.13.t:0 "[FROM.GetNameDefCap] Requests Additional Guns"
 CHI_warlords.13.desc:0 "[FROM.GetNameDefCap] has requested additional guns in order to help unite China under them. How much, if any, do we send them?"
 CHI_warlords.14.t:0 "Le Congrès d'unité nationale"
 CHI_warlords.14.desc:0 "Le Congrès d'unité nationale s'est réuni et a donné lieu à de grandes discussions. Les révolutionnaires nationalistes sont venus réclamer un grand État chinois sous la garde du chef de guerre, ainsi qu'une ligue de régénération nationale chargée de purger le pays de la corruption et de l'influence étrangère. De l'autre côté, les nationalistes impérialistes ont exigé que le seigneur de la guerre prenne le manteau du mandat du ciel et déclare un nouvel empire chinois !"
 CHI_warlords.15.t:0 "Le rapport du Conseil de régence"
 CHI_warlords.15.desc:0 "Le conseil de régence s'est réuni et a réfléchi au sort de la monarchie en Chine. Ils ont décidé de faire du seigneur de la guerre l'empereur de toute la Chine !"
 CHI_warlords.16.t:0 "A Request from [FROM.GetNameDef]"
 CHI_warlords.16.desc:0 "An envoy from [FROM.GetNameDef] has just come over here with one request. He has requested that we remove our support for [CHI.GetNameDef] and instead support them. Do we oblige?"
 CHI_warlords.17.t:0 "Une demande du peuple Hui"
 CHI_warlords.17.desc:0 "Un envoyé du peuple musulman Hui de [FROM.GetNameDef] nous a contactés et nous a proposé un marché. Ils nous ont demandé de les aider à unifier les régions islamiques de Chine et nous ont proposé de devenir leur protectorat."
 CHI_warlords.18.t:0 "La coalition pour la survie nationale"
 CHI_warlords.18.desc:0 "[FROM.GetNameDefCap] nous a contactés pour nous proposer de se soumettre et de nous rejoindre au sein d'un gouvernement de coalition. Leur raisonnement est qu'il s'agit d'une nécessité pour la survie de la Chine, car les Japonais s'apprêtent à s'en prendre à nous. Toutefois, selon certains pessimistes au sein de notre armée, on suppose qu'ils seront loyaux tant que la Chine sera directement menacée par le Japon ou d'autres envahisseurs, mais qu'ils pourraient bien nous trahir..."
 CHI_warlords.19.t:0 "[FROM.GetNameDefCap] Has Refused Our Offer"
 CHI_warlords.19.desc:0 "Our envoy to [FROM.GetNameDef] has returned with terrible news. The government of [FROMGetNameDef] has refused our offer to them."
 CHI_warlords.20.t:0 "[FROM.GetNameDefCap] Has Accepted Our Offer"
 CHI_warlords.20.desc:0 "Our envoy to [FROM.GetNameDef] has returned with great news. The government of [FROMGetNameDef] has accepted our offer to them."
 CHI_warlords.21.t:0 "[JAP.GetNameDefCap] has Responded to Our Request"
 CHI_warlords.21.desc:0 "Our envoy to [JAP.GetNameDef] has returned with news from the Japanese army. They have come to a conclusion and have announced how many guns they have sent us!"
 CHI_warlords.22.t:0 "Betrayal!"
 CHI_warlords.22.desc:0 "With direct threat to us over, [FROM.GetNameDef] has betrayed us! They have in preparation for rekindling the Chinese civil war called out to our garrisons and a fourth of them have joined them, drastically boosting them in the now inevitable civil war."
 CHI_warlords.23.t:0 "The Army Revolts!"
 CHI_warlords.23.desc:0 "Our greatest nightmare has come about! Our plan to rely on the army has failed as one quarter of our troops too have defected to the enemy! It may soon be too late to save China!"
 CHI_warlords.24.t:0 "[FROM.GetNameDefCap] Has Sent Us an Offer"
 CHI_warlords.24.desc:0 "[FROM.GetNameDefCap] has sent us an offer. They claim that there are multiple great powers attempting to invade us. They offer that in exchange for us recognizing their authority as the National Government, they will embrace us as a federal state and give us all the rights associated with it. This will allow us to maintain all of our local internal policies, so long as we stay under their umbrella."
 CHI_warlords.25.t:0 "[FROM.GetNameDefCap] Has Sent Us an Ultimatum"
 CHI_warlords.25.desc:0 "[FROM.GetNameDefCap] Has Sent Us an Ultimatum. They Point at the, according to them, unjust occupation of Chinese Treaty Ports and demand that we pull out of China, effective immediately."
 CHI_warlords.26.t:0 "[FROM.GetNameDefCap] Has Sent Us a Proposal"
 CHI_warlords.26.desc:0 "[FROM.GetNameDefCap] has recognized something. Much can be done if the right people are given power. They have therefore offered [ROOT.GetLeader], should he submit to them, that he would gain a large sphere of influence around [ROOT.capital.GetCapitalVictoryPointName] and have full rights to his own internal policies."
 CHI_warlords.27.t:0 "[FROM.GetNameDefCap] Demands Final Integration"
 CHI_warlords.27.desc:0 "With China united, [FROM.GetNameDef] has decided it is time to fully unite China, as such, they have demanded that we, their governorate be integrated into them, what do we say to this?"
 CHI_warlords.28.t:0 "[FROM.GetNameDefCap] Requests Peace"
 CHI_warlords.28.desc:0 "Envoys from [FROM.GetNameDef] have reached out to our military officers on their border requesting peace and offering us full access through their lands. This would make it much easier to supply our army on one hand, however it would long term be disadvantageous for conquering all of China. What should we do?"
 CHI_warlords.28.a:0 "Bit by bit the United Front crumbles!"
 CHI_warlords.28.b:0 "We will show no mercy to cowards!"
 CHI_warlords.29.t:0 "[FROM.GetNameDefCap] Requests the Removal of the Communists"
 CHI_warlords.29.desc:0 "Envoys from [FROM.GetNameDef] have reached out to us and have pointed out the evils of communism. They therefore request the removal of [PRC.GetNameDef] from our alliance."
 CHI_warlords.29.a:0 "They, are right, we must do this"
 CHI_warlords.29.b:0 "The United Front must hold!"
 CHI_warlords.30.t:0 "The Congress for the People's Survival"
 CHI_warlords.30.desc:0 "Confucians, Christians and many other intellectuals have gathered together in response to our three purities and have come to the conclusion that we are evil and abusing them, they have therefore banded together to resist us and fight for their survival."
 CHI_warlords.30.a:0 "They bring our wrath on themselves and have chosen their own fate..."
 CHI_warlords.31.t:0 "The Fate of the Overrun Lands"
 CHI_warlords.31.desc:0 "We have finally reclaimed certain lands which have long been overrun by foreign peoples, Russians, Manchus, Mongolians and so forth. This raises the question, what do we do with these disgusting subhumans?"
 CHI_warlords.31.a:0 "We will establish separate states with special rights for the Chinese people!"
 CHI_warlords.31.b:0 "These Chinese Lands must be purged from all foreign influence!"
 CHI_warlords.32.t:0 "A Proposition from [FROM.GetNameDef]"
 CHI_warlords.32.desc:0 "[FROM.GetNameDefCap] has in recent years become ever more divorced from the rest of China, therefore they have come to us with an offer, stating that they will offer to recognize our government if we recognize theirs, agreeing to a principle of 'One China, Two Systems'"
 CHI_warlords.32.b:0 "That sounds reasonable, there is no reason to seek conflict here."
 CHI_warlords.32.a:0 "We will unite China no matter what!"
 CHI_warlords.33.t:0 "[FROM.GetNameDefCap] Seeks Guarantees"
 CHI_warlords.33.desc:0 "[FROM.GetNameDefCap] has in recent years become a modern western state after our own ideals. They request our guarantees to protect their way of life, do we accept?"
 CHI_warlords.33.a:0 "We have no reason to invest ourselves that way"
 CHI_warlords.33.b:0 "Of course we will protect our friends!"
 CHI_warlords.34.t:0 "[FROM.GetNameDefCap] Seeks Our Support"
 CHI_warlords.34.desc:0 "[FROM.GetNameDefCap] has in recent years gone under a revolution under the Left Kuomintang and in their struggle for the national revolution, they have reached out to secure our support. What do we have to say about this?"
 CHI_warlords.34.a:0 "We have no reason to invest ourselves that way"
 CHI_warlords.34.b:0 "Cooperation with more Revolutionaries in China? Of course!"
 CHI_warlords.35.t:0 "[FROM.GetNameDefCap] Seeks Recognition"
 CHI_warlords.35.desc:0 "[FROM.GetNameDefCap] has, after gaining our support, now requested that we officially recognize them as the legitimate government of China and cease our support to [PRC.GetNameDef]"
 CHI_warlords.35.a:0 "[PRC.GetNameDefCap] still has our trust!"
 CHI_warlords.35.b:0 "[FROM.GetNameDefCap] is obviously the legitimate Government of China!"
 CHI_warlords.36.t:0 "[FROM.GetNameDefCap] Proposes a Joint Ultimatum to [PRC.GetNameDef]"
 CHI_warlords.36.desc:0 "[FROM.GetNameDefCap] proposed that we, as the PRC is dependent on us, send them an ultimatum, so as they may join [FROM.GetNameDef]. This will greatly boost our supported government in China, however it would invest us a bit more in the conflict."
 CHI_warlords.36.a:0 "We have no reason to invest ourselves that way"
 CHI_warlords.36.b:0 "Send the Papers"
 CHI_warlords.37.t:0 "[FROM.GetNameDefCap] and [FROM.FROM.GetNameDef] Have Sent Us an Ultimatum..."
 CHI_warlords.37.desc:0 "These two powers have joined together and demanded we fold into the Soviet backed government in [FROM.FROM.GetNameDef]. We are reliant on the Soviet Union and in no position to refuse, however some still want to fight against those nationalists."
 CHI_warlords.37.a:0 "We will fight to the last breath!"
 CHI_warlords.37.b:0 "We are doomed either way and may as well save our lives..."
 CHI_warlords.38.t:0 "[FROM.GetNameDefCap] Requests Guns"
 CHI_warlords.38.desc:0 "[FROM.GetNameDefCap] has requested guns in order to help unite China under them. How much, if any, do we send them?"
 CHI_warlords.38.a:0 "We will send them 4000 guns"
 CHI_warlords.38.b:0 "We will send them 1500 guns"
 CHI_warlords.38.c:0 "We cannot send them anything"
 CHI_warlords.39.t:0 "[SOV.GetNameDefCap] Has Responded to Our Request"
 CHI_warlords.39.desc:0 "Our envoy to [SOV.GetNameDef] has returned with news from the Soviet army. They have come to a conclusion and have announced how many guns they have sent us!"
 CHI_warlords.40.t:0 "[FROM.GetNameDefCap] Invites Us to the Second Anti-Chiang Coalition"
 CHI_warlords.40.desc:0 "[FROM.GetNameDefCap] has reforged the Anti-Chiang Coalition! They now have invited us to join them and request our support in toppling the tinpot dictator! What do we say to this?"
 CHI_warlords.40.a:0 "Why, Of Course!"
 CHI_warlords.40.b:0 "This is merely a ploy to spread their own influence!"
 CHI_warlords.41.t:0 "[FROM.GetNameDefCap] Has Declared National Governance"
 CHI_warlords.41.desc:0 "[FROM.GetNameDefCap] has successfully led us in the anti Chiang Coalition as the KMT collapses in Nanjing. However, they have used this as an opportunity to declare National Governance and now demand our obedience and submission in their bid to consolidate their control over the country, yet they do promise us internal autonomy over all our domestic politics... What do we say to such an offer?"
 CHI_warlords.42.t:0 "Notre place dans le Front uni"
 CHI_warlords.42.desc:0 "Le Front uni chinois ayant rempli son rôle et devenu obsolète, il est désormais temps de déterminer notre sort au sein de celui-ci, car [CUG.GetNameDefCap] le domine de plus en plus, au point que nous sommes de plus en plus attirés dans leur sphère d'influence."
 CHI_warlords.42.a: "Notre rôle est d'être avec et sous la domination chinoise."
 CHI_warlords.42.b: "We must forge our own fate!"
 CHI_warlords.43.t: "[FROM.GetNameDefCap] Joins the Front"
 CHI_warlords.43.desc: "[FROM.GetNameDefCap] shares our love for China and has joined the united front, a great step forward!"
 CHI_warlords.43.a: "For Better Or Worse We Are Comrades Now."
