 JAP_rejection:0 "e Japon a rejeté nos avances."
 KMT_rejection:0 "Le Kuomintang a rejeté nos avances"
 seized_assets:0 "Actifs saisis"
 refused_cooperation:0 "Refus de coopération"
 CHI_only_we_can_save_china:0 "Seuls nous pouvons sauver la Chine"
 CHI_only_we_can_save_china_desc:0 "Seuls nous pouvons sauver la Chine ! Pour cela, nous déclarerons un gouvernement national et nous nous préparerons à détruire les faux prétendants à Nankin !"
 CHI_resurrect_the_anti_chaing_coalition:0 "Ressusciter la coalition anti-Chiang"
 CHI_resurrect_the_anti_chaing_coalition_desc:0 "Nous ressusciterons la coalition anti-Chiang d’il y a quelques années ! Chiang, le méchant dictateur de pacotille contre le peuple, tombera ! Vive notre grand nouveau régime !"
 CHI_a_friendship_with_the_warlords:0 "Une amitié avec les seigneurs de guerre"
 CHI_a_freindship_with_the_warlords_desc:0 "Nous chercherons le soutien des seigneurs de guerre dans notre grande coalition, car ils étaient la force motrice de la précédente ! Comme elle a failli réussir, celle-ci réussira !"
 CHI_an_alliance_with_the_rightists:0 "Une alliance avec les droitistes"
 CHI_an_alliance_with_the_rightists_desc:0 "Nous contacterons les droitistes qui sont tout aussi dégoûtés par Chiang que nous ! Cela nous unira contre Chiang et préparera le terrain pour sa chute !"
 CHI_an_olive_branch_to_the_communists:0 "Une branche d’olivier aux communistes"
 CHI_an_olive_branch_to_the_communists_desc:0 "Nous nous adresserons aux communistes en Chine. Même si une grande différence idéologique nous sépare, cela n’a pas d’importance. Chiang doit mourir, et nous travaillerons ensemble pour que cela arrive !"
 CHI_seek_support_from_the_democrats:0 "Chercher le soutien des démocrates"
 CHI_seek_support_from_the_democrats_desc:0 "Les démocrates en Chine sont comme nous et détestent Chiang ! Cela nous donne une base parfaite pour commencer à travailler avec eux afin d’éliminer cette menace et cet oppresseur commun !"
 CHI_march_on_chaing:0 "Marcher sur Chiang"
 CHI_march_on_chaing_desc:0 "Il est temps ! Nous commencerons à frapper Nankin et à faire tomber Chiang de son piédestal ! Chiang mourra tandis que nous nous établirons comme la véritable Chine !"
 CHI_prepare_for_the_second_northern_expedition:0 "Préparer la seconde expédition du Nord"
 CHI_prepare_for_the_second_northern_expedition_desc:0 "We will prepare for a second Northern Expedition to secure the great northern areas of China along with Beiping to insure that we can unite a great Chinese Republic. Glory to the KMT and China!"
 CHI_pillage_the_occupied_lands:0 "Piller les terres occupées"
 CHI_pillage_the_occupied_lands_desc:0 "Avec le djihad qui se déroule avec succès, il est temps de piller ces terres, renforçant notre économie et nous apportant une grande victoire !"
 CHI_construct_minarets:0 "Construire des minarets"
 CHI_construct_minarets_desc:0 "Nous travaillerons à construire des minarets partout dans notre nouveau royaume ! Allah sera glorifié par notre grande victoire ! Gloire au djihad et à Allah !"
 CHI_take_leadership_of_islam:0 "Prendre la direction de l’Islam"
 CHI_take_leadership_of_islam_desc:0 "Nous prendrons la direction de l’islam, nous déclarant grand État islamique !"
 CHI_enforced_social_values:0 "Valeurs imposées"
 CHI_enforced_social_values_desc:0 "Nous commencerons à imposer les valeurs du Coran. Si elles viennent réellement d’Allah, alors tout notre peuple doit leur obéir !"
 CHI_a_unitary_education:0 "Éducation unitaire"
 CHI_a_unitary_education_desc:0 "Nos fils doivent être éduqués selon la volonté d’Allah ! Ils apprendront les hadiths et la volonté d’Allah ! Cela seul rendra notre peuple grand et studieux."
 CHI_society_as_allah_ordained_it:0 "La société telle qu’Allah l’a ordonnée"
 CHI_reinstate_the_jizya:0 "Rétablir la Jizyâ"
 CHI_reinstate_the_jizya_desc:0 "Avec tant d’infidèles dans notre terre, nous rétablirons la jizya ! Les infidèles paieront pour avoir rejeté Allah et le Coran ! Cela nous aidera à augmenter les dépenses pour le djihad et à préparer la grande guerre sainte !"
 CHI_stabilize_the_economy:0 "Stabiliser l'économie"
 CHI_Stabilize_the_economy_desc:0 "Nous travaillerons à stabiliser notre économie après la guerre civile et la prise de pouvoir des hommes d’Allah ! Cela nous aidera à être capables de lancer toutes les réformes que nous souhaitons !"
 CHI_conversion_by_the_sword:0 "Conversion par l’Épée"
 CHI_conversion_by_the_sword_desc:0 "Alors que la Jizya fut un excellent premier pas pour intégrer les infidèles dans notre société islamique, ce n’était pas suffisant. Ceux qui restent se soumettront à Allah et à Mahomet, son prophète ! Il ne peut y avoir d’alternative !"
 CHI_begin_preparations_for_jihad:0 "Commencer les préparatifs pour le Djihad"
 CHI_begin_preparations_for_jihad_desc:0 "Nous commencerons à préparer le grand Djihad et à renforcer notre économie afin que notre approvisionnement en armes ne diminue jamais !"
 CHI_ready_the_army_of_jihad:0 "Préparer l’Armée du Djihad"
 CHI_ready_the_army_of_jihad_desc:0 "Nous allons commencer à préparer l’armée du Djihad ! Il ne manque plus grand-chose ! Bientôt, nous pourrons frapper et accomplir la volonté d’Allah !"
 CHI_strike_forth:0 "Passer à l’Attaque"
 CHI_strike_forth_desc:0 "Nous allons commencer à passer à l’attaque et lancer le Djihad ! Nous serons victorieux et personne ne nous arrêtera !"
 CHI_collect_funds_for_the_jihad:0 "Collecter des fonds pour le Djihad"
 CHI_collect_funds_for_the_jihad_desc:0 "Nous allons commencer à collecter des fonds pour le Jihad auprès de notre peuple, en résolvant les problèmes économiques auxquels nous faisons face et en nous donnant la production militaire nécessaire pour contrer efficacement les infidèles !"
 CHI_the_caliphate_of_china:0 "Le Califat de Chine"
 CHI_the_caliphate_of_china_desc:0 "While we may be Muslims, we are also Chinese! Therefore we will work to bring these things together and create a caliphate here in our eastern extent of Islamic influence to bring spiritual revival to China!"
 CHI_an_islamic_state:0 "Un État Islamique"
 CHI_an_islamic_state_desc:0 "Les musulmans ont été divisés et querelleurs bien trop longtemps ! Nous travaillerons à créer un État islamique ici en Chine occidentale et à nous étendre à travers le monde pour l’unifier ainsi que nos frères musulmans, nous permettant ainsi de créer un grand État islamique !"
 CHI_a_great_turkestan:0 "Un Califat Turkmène"
 CHI_a_great_turkestan_desc:0 "Notre peuple n’est pas celui des infidèles chinois, mais bien le grand peuple turkestanais ! Nous travaillerons jour et nuit pour restaurer ce grand État sous notre nouveau califat !"
 CHI_instate_sharia_law:0 "Instaurer la Loi de la Charia"
 CHI_instate_sharia_law_desc:0 "Nous commencerons à instaurer la Loi de la Charia, ce qui nous permettra d’accomplir la volonté d’Allah dans notre société et de la soumettre entièrement à sa volonté !"
 CHI_totaltarianism_after_allahs_word:0 "Totalitarianism After the Quran"
 CHI_totaltarianism_after_allahs_word_desc:0 "Nous commencerons à sévir contre toute désobéissance et apostasie dans nos rangs ! Allah ne permet aucune dégénérescence et nous commande d’agir comme sa main droite et de faire ce bon travail pour Lui ! Les dégénérés et les apostats seront anéantis !"
 CHI_eliminate_all_dissent:0 "Éliminer toute dissidence"
 CHI_eliminate_all_dissent_desc:0 "Nous continuerons notre travail pour éliminer toute dissidence ! Quiconque ne se soumet pas à tous les commandements de la Charia doit mourir ! L’Islam signifie soumission, et les traîtres le comprendront !"
 CHI_adopt_the_penal_code:0 "Adopter le Code Pénal de la Charia"
 CHI_adopt_the_penal_code_desc:0 "Le Coran expose une manière très claire de traiter toutes sortes de crimes, du voleur au meurtrier ! Nous appliquerons également cette partie de la Charia pour gérer les nombreux criminels sous notre autorité !"
 CHI_begin_jihad_against_the_oppressors:0 "Commencer le Djihad contre les Oppresseurs"
 CHI_begin_jihad_against_the_oppressors_desc:0 "Nous commencerons un grand Djihad contre les Chinois qui nous oppriment ! Nous libérerons notre peuple Hui par un Djihad sacré afin de libérer notre peuple islamique selon la volonté d’Allah !"
 CHI_infiltrate_hui_communities:0 "Infiltrer les communautés Hui"
 CHI_infiltrate_hui_communities_desc:0 "Nous travaillerons à infiltrer les communautés Hui et à commencer à radicaliser leur population ! L’Islam sera glorifié et les Hui profiteront de la gloire d’Allah !"
 CHI_a_radical_hui:0 "Un Hui radicalisé"
 CHI_a_radical_hui_desc:0 "Grâce à notre travail, le peuple Hui est désormais réellement radicalisé : ils sont désormais déterminés à accomplir la volonté d’Allah, il ne manque presque plus rien avant que nous puissions renverser les oppresseurs chinois !"
 CHI_propaganda_against_the_kmt:0 "Propagande contre le KMT"
 CHI_propaganda_against_the_kmt_desc:0 "Nous commencerons une propagande massive contre le KMT afin de soutenir indirectement la grande révolution islamique !"
 CHI_an_organized_resistance_militia:0 "Une Milice de Résistance Organisée"
 CHI_an_organized_resistance_militia_desc:0 "Nous formerons une milice organisée pour résister au KMT, ce qui nous permettra de prendre le contrôle des montagnes et du désert et d’assiéger la capitale ! Nul ne peut résister à la grande épée de l’Islam !"
 CHI_break_the_back_of_the_kmt_forces:0 "Briser le Dos des Forces du KMT"
 CHI_break_the_back_of_the_kmt_forces_desc:0 "Nous briserons la résistance des forces du KMT dans notre région. Cela nous permettra d’agir librement et de détruire totalement l’oppression du KMT."
 CHI_the_jihad_successfull:0 "Chassez les infidèles"
 CHI_the_jihad_successfull_desc:0 "Nous l’avons enfin fait ! Il est temps de commencer le Djihad et de chasser les infidèles ! À bas l’ancien régime, vive l’État islamique !"
 CHI_deal_with_anti_japanese_hatred:0 "Gérer la Haine Anti-Japonaise"
 CHI_deal_with_anti_japanese_hatred_desc:0 "Maintenant que nous sommes véritablement devenus notre propre État, il est temps de gérer la haine du peuple envers le Japon et de nous assurer qu’un jour, peut-être, le pardon pourra être atteint !"
 CHI_the_sinofication_of_china:0 "La Sinisation de la Chine"
 CHI_manchu_colab:0 "Créer une administration spéciale en Mandchourie"
 CHI_tunganistan_colab:0 "Créer une administration spéciale au Turkestan oriental"
 CHI_sinofy_land:0 "Siniser [FROM.GetName]"
 CHI_a_place_in_the_comintern:0 "Une Place dans le Komintern"
 CHI_a_place_in_the_comintern_desc:0 "Les Soviétiques nous ayant soutenus jusqu’à présent, nous chercherons une place dans le Komintern. L’alliance russo-chinoise sera une grande réussite."
 CHI_request_military_aid:0 "Demander une aide militaire soviétique"
 CHI_request_military_aid_desc:0 "Nous demanderons une aide militaire à l’Union soviétique. Nous avons besoin d’armes et ils ont l’industrie pour les produire, il serait donc logique qu’ils nous en donnent."
 CHI_a_soviet_tank_advisors:0 "Conseillers Soviétiques en Blindés"
 CHI_a_soviet_tank_advisors_desc:0 "Nous inviterons des conseillers soviétiques en blindés dans notre pays afin qu’ils nous apprennent à créer une grande et puissante force de chars."
 CHI_extol_chinese_nationalism:0 "Exalter le Nationalisme Chinois"
 CHI_extol_chinese_nationalism_desc:0 "Nous travaillerons à exalter le nationalisme chinois dans notre pays ! La Chine sera unifiée sous notre direction ! C’est le plus grand bien de la Révolution !"
 CHI_reach_out_to_moscow:0 "Contacter Moscou"
 CHI_reach_out_to_moscow_desc:0 "Nous contacterons [SOV.GetNameDef] et demanderons leur soutien. Si nous pouvons l’obtenir, nous pourrions bénéficier d’une grande expertise, d’armes et d’un appui diplomatique."
 CHI_request_official_recognition:0 "Demander la reconnaissance officielle"
 CHI_request_official_recognition_desc:0 "Nous demanderons la reconnaissance officielle aux Soviétiques ; cela finalisera les préparatifs de nos plans pour prendre le contrôle de la Chine. Ainsi, nous serons plus que prêts, puisque nous deviendrons l’État chinois aligné sur les Soviétiques."
 CHI_joint_ultimatum_to_prc:0 "Ultimatum conjoint à [PRC.GetNameDef]"
 CHI_joint_ultimatum_to_prc_desc:0 "Nous travaillerons avec les Soviétiques pour envoyer un ultimatum à la RPC afin qu’elle nous cède le contrôle de son État, puisque nous sommes le nouvel État soutenu par l’URSS dans la région."
 CHI_support_chinese_religion:0 "Soutenir la religion chinoise"
 CHI_support_chinese_religion_desc:0 "Nous soutiendrons les religions chinoises ethniques fondées sur un sentiment nationaliste partagé, afin d’être certains qu’avec leur aide nous puissions créer une grande force pour protéger la Nation !"
 CHI_state_atheism:0 "Athéisme d'État"
 CHI_state_atheism_desc:0 "Nous travaillerons à instaurer l’athéisme d’État dans notre Nation, cela créera un sentiment de pureté dans notre idéologie. Ainsi, notre main-d’œuvre pourra travailler sans relâche pour la révolution du KMT !"
 CHI_beacon_of_socialism:0 "Exemplarité socialiste"
 CHI_beacon_of_socialism_desc:0 "Nous sommes réellement devenus un grand phare du socialisme, un exemple éclatant pour tous les socialistes du monde ! Gloire à la Révolution !"
 CHI_beacon_of_communism:0 "Phare du communisme"
 CHI_beacon_of_communism_desc:0 "Nous sommes réellement devenus un grand phare du communisme, un exemple éclatant pour tous les communistes du monde ! Gloire à la Révolution !"
 CHI_enforce_loyalty_to_the_revolution:0 "Imposer la Loyauté envers la Révolution"
 CHI_enforce_loyalty_to_the_revolution_desc:0 "Nous imposerons la loyauté envers la révolution nationale du KMT afin qu’aucune dissidence ne puisse se former contre notre grande révolution ! Personne ne rejettera notre grande croisade !"
 CHI_purge_the_decadence:0 "Purger la décadence"
 CHI_purge_the_decadence_desc:0 "Nous purgerons les républicains décadents qui retardent massivement notre grande révolution ! Ils doivent partir et la Chine doit être restaurée sous la lumière éclatante de la Révolution du Kuomintang !"
 CHI_enshrine_the_yuan:0 "Sanctifier le Yuan"
 CHI_enshrine_the_yuan_desc:0 "Nous travaillerons à sanctifier le Yuan, ou le Législatif chinois, en Chine ; cela créera un rempart puissant capable d’empêcher la formation d’un nouveau Chiang et d’un nouveau PCC. Ainsi, nous pourrons garantir une direction responsable selon les trois principes du peuple."
 CHI_sideline_the_radicals:0 "Mettre les radicaux à l'écart"
 CHI_sideline_the_radicals_desc:0 "Nous travaillerons à marginaliser les radicaux dans notre parlement et à en interdire même quelques-uns pour avoir continué à violer les principes du centralisme démocratique. Comme ils ont enfreint nos règles, ils doivent en subir les conséquences."
 CHI_full_control_over_the_apparatus_of_education:0 "Contrôle total de l’appareil éducatif"
 CHI_full_control_over_the_apparatus_of_education_desc:0 "Nous veillerons à assurer le contrôle de l’ensemble de l’appareil éducatif, ce qui permettra un financement accru et la loyauté envers notre parti !"
 CHI_nationalize_foreign_assets:0 "Nationaliser les actifs étrangers"
 CHI_nationalize_foreign_assets_desc:0 "Avec la révolution du KMT ayant pris le contrôle de notre province, nous nous assurerons que les actifs étrangers soient saisis ; ainsi nous aurons une vraie Chine pour les Chinois !"
 CHI_purge_the_reactionary:0 "Purger les réactionnaires"
 CHI_purge_the_reactionary_desc:0 "Nous épurerons les réactionnaires au sein du KMT, permettant d’arrêter l’influence dégénérative venue du Nord et de permettre à notre grand État de prospérer !"
 CHI_reorganize_the_party_along_lenninist_lines:0 "Réorganiser le Parti selon des lignes léninistes"
 CHI_reorganize_the_party_along_lenninist_lines_desc:0 "Nous reviendrons aux fondamentaux et commencerons à faire ce que nous faisions alors, et procéderons à la réorganisation du parti selon des lignes léninistes !"
 CHI_democratic_centralism:0 "Centralisme démocratique"
 CHI_democratic_centralism_desc:0 "Nous mettrons en œuvre le centralisme démocratique, nous permettant à la fois la liberté de débat et une action exécutive forte ! Cela permettra à la Révolution nationale du Kuomintang de progresser réellement et efficacement !"
 CHI_announce_full_communism:0 "Proclamer le communisme intégral"
 CHI_announce_full_communism_desc:0 "La première motion que nous adopterons inscrira le véritable communisme dans notre État, nous permettant de créer une grande utopie communiste !"
 CHI_socialism_not_communism:0 "Socialisme, pas communisme"
 CHI_socialism_not_communism_desc:0 "Nous commencerons à mettre en œuvre nos politiques socialistes ; toutefois, cela ne signifie pas que nous succomberons aux horreurs du communisme. Au contraire, nous rejetterons fermement toute motion visant à mettre en œuvre de tels plans !"
 CHI_land_value_tax_3:0 "Taxe sur la valeur des terres"
 CHI_land_value_tax_3_desc:0 "Nous ferons ce que le KMT a longtemps voulu faire ; en fait nous sommes déjà en retard, nous saisirons enfin l’occasion et imposerons une taxe sur la valeur foncière, afin que notre peuple puisse être libéré de l’oppression capitaliste !"
 CHI_transfer_factories_to_the_proletariat:0 "Transférer les usines au prolétariat"
 CHI_state_owned_corporations:0 "Entreprises publiques"
 CHI_state_owned_corporations_desc:0 "Nous nationaliserons nos sociétés ; ainsi le peuple et l’État en bénéficieront bien davantage et nous favoriserons une croissance économique à long terme !"
 CHI_seize_merchant_property:0 "Saisir les biens des commerçants"
 CHI_seize_merchant_property_desc:0 "Nous nous attaquerons à un bastion clé du capitalisme en Chine ! Les commerçants répugnants perdront leurs biens et verront leurs actifs confisqués !"
 CHI_the_fate_of_the_overrun_lands:0 "Le sort des terres envahies"
 CHI_the_fate_of_the_overrun_lands_desc:0 "La Mandchourie et le Sinkiang ont été envahis par des races impures... Nous devons maintenant décider quoi faire de ces terres et des personnes qui s’y trouvent, tant les Chinois que les autres « saletés » qui s’y trouvent."
 CHI_appropriate_the_fuhrerprinzip:0 "S’approprier le Führerprinzip"
 CHI_appropriate_the_fuhrerprinzip_desc:0 "Bien que anti-monarchistes, les nationaux-socialistes allemands partagent de nombreux aspects de leur idéologie avec nous. Nous nous inspirerons donc de leur Führerprinzip et l’appliquerons à l’Empereur ! Il deviendra le Führer incontesté de notre Grande Nation et personne ne le remettra en question !"
 CHI_drive_out_the_foreign_devils:0 "Chasser les démons étrangers"
 CHI_drive_out_the_foreign_devils_desc:0 "Nous avons subi pendant trop longtemps l’horrible influence occidentale impure dans nos milieux académiques ! Nous détruirons les porcs occidentaux et sauverons notre pays de leur influence maléfique !"
 CHI_destroy_foreign_thought:0 "Détruire la pensée étrangère"
 CHI_destroy_foreign_thought_desc:0 "Même si les démons étrangers ont été chassés, nous voyons encore beaucoup de leur pensée dans notre pays... Cela sera traité et les responsables en seront éliminés."
 CHI_the_revolution_successfull:0 "La révolution réussie"
 CHI_the_revolution_successfull_desc:0 "Nous avons lutté jour et nuit et avons finalement atteint notre plus grand objectif. La Révolution culturelle a été un grand succès ; nous pouvons enfin lever les mesures que nous avons imposées et préparer un État véritablement grand pour le peuple et sa prospérité sous le grand Empereur !"
 CHI_jihad: "Djihad"
 CHI_begin_the_cultural_revolution:0 "Commencer la §RÉvolution culturelle§!"
 CHI_begin_the_cultural_revolution_desc:0 "Nous entamerons la Révolution culturelle pour détruire les forces dégénérées qui détruisent la pureté et la stabilité de notre pays. Nous lancerons une vaste campagne pour anéantir toute résistance à nos nouvelles formes de pensée pure !"
 CHI_a_national_chinese_empire:0 "Un empire chinois national"
 CHI_a_national_chinese_empire_desc:0 "Nous déclarerons un nouvel Empire national ! Le peuple chinois sera sauvé par nous ! Gloire au peuple Han !"
 CHI_break_the_confucionists:0 "Briser les confucéens"
 CHI_break_the_confucionists_desc:0 "Nous commencerons à briser les confucéens et travaillerons jour et nuit pour les détruire entièrement ainsi que leurs pratiques dégénérées en opposition à notre pays. Ils seront massacrés !"
 CHI_undo_the_damage_of_the_cim:0 "Annuler les dégâts de la CIM"
 CHI_undo_the_damage_of_the_dim_desc:0 "La China Inland Mission a fait de grandes choses pour corrompre notre pureté de pensée, en répandant des idéaux chrétiens dégénérés à travers la Chine ! Nous travaillerons à anéantir leurs effets et à organiser une persécution plus grande que tout ce que Néron a pu faire."
 CHI_full_autarky:0 "Autarcie totale"
 CHI_full_autarky_desc:0 "Nous avons enfin atteint l’autarcie et il est donc temps d’accomplir la dernière étape nécessaire pour réparer notre économie !"
 CHI_a_new_socalled_religion:0 "Une nouvelle prétendue religion"
 CHI_a_new_socalled_religion_desc:0 "Avec les religieux dégénérés détruits, il est temps pour nous d’imposer pleinement notre nouvelle religion, exaltant l’État et notre nouveau sens de la Raison irréligieuse ! Gloire à l’Empereur !"
 CHI_the_three_principles_of_the_nation:0 "Les trois principes de la §RNation§!"
 CHI_the_three_principles_of_the_nation_desc:0 "La ROC a ses Trois Principes. Ils sont vieux et dépassés et ont ruiné la culture chinoise. Pour y remédier, nous établirons trois nouveaux principes pour la Chine : les Trois Unités, les Trois Purités, les Trois Forces."
 CHI_santong:0 "Santong"
 CHI_santong_desc:0 "Nous travaillerons à unifier les aspects centraux de notre État sous nos nouvelles « Trois Unités ». Nous unirons la direction et l’autorité de l’État sous l’Empereur afin de consolider le pouvoir, nous unirons le peuple et créerons une Volksgemeinschaft (communauté populaire) sur le modèle des Allemands, et enfin nous unifierons le pays et établirons le grand objectif d’unifier la Nation chinoise !"
 CHI_guo:0 "Guo"
 CHI_guo_desc:0 "Nous renforcerons un sentiment de nationalisme et de purisme chinois afin d’obtenir un véritable grand État central unitaire ! La Chine sera Unifiée !"
 CHI_min:0 "Min"
 CHI_min_desc:0 "Nous entreprendrons d’unir le Peuple derrière un objectif commun, une communauté semblable à ce que les Allemands appellent la Volksgemeinschaft ! Le Peuple chinois s’unira derrière nous !"
 CHI_wang:0 "Wang"
 CHI_wang_desc:0 "Nous œuvrerons à placer l’Empereur au centre de tout et à faire en sorte qu’il soit personnellement l’incarnation de l’unité de la Nation ! Une Chine unifiée sous l’Empereur sera Forgée !"
 CHI_sanchun:0 "Sanchun"
 CHI_sanchun_desc:0 "Nous déclarerons les trois puretés de notre Nation. Pour survivre, nous avons besoin de la pureté du sang et de la culture afin de créer une Nation et un Volk chinois forts. De plus, nous devons purifier la sagesse de notre peuple, afin que tous dans notre pays partagent notre Sagesse et nos idées !"
 CHI_wen:0 "Wen"
 CHI_wen_desc:0 "Nous purifierons les Chinois de la Grande Nation Chinoise ! L’Empereur travaillera jour et nuit pour siniser la culture chinoise et s’assurer qu’elle soit pure selon son idéal, sans qu’aucune minorité ne nous résiste !"
 CHI_zhi:0 "Zhi"
 CHI_zhi_desc:0 "Nous purifierons la Sagesse de la Grande Nation Chinoise ! L’Empereur travaillera jour et nuit pour s’assurer que l’ensemble du peuple suive son école de pensée ! La résistance des faux intellectuels sera éliminée tandis que nous sécuriserons les Esprits du Peuple !"
 CHI_sanqiang:0 "Sanqiang"
 CHI_sanqiang_desc:0 "Nous renforcerons également nos trois forces : une grande foi sous notre athéisme, une grande armée capable de purger notre État et de nous défendre, et enfin d’immenses ressources capables d’alimenter notre machine de guerre et d’être exportées."
 CHI_xin:0 "Xin"
 CHI_xin_desc:0 "Nous travaillerons dur chaque jour pour faire de notre sens de l’athéisme et de la raison l’une de nos plus grandes forces, cela mènera à un peuple moderne et pur, capable de résister à la tromperie étrangère !"
 CHI_wu:0 "Wu"
 CHI_wu_desc:0 "Nous travaillerons à obtenir la force par la puissance militaire et à l’utiliser pour purger notre État de ses ennemis et créer un grand empire capable de résister aux attaques extérieures !"
 CHI_cai:0 "Cai"
 CHI_cai_desc:0 "Si nous voulons nous moderniser et construire une grande armée, nous devons augmenter notre extraction de ressources, car ainsi nous serons pleinement capables d’obtenir toutes les finances et de produire toutes les ressources dont nous avons besoin ! L’autarcie et l’autosuffisance totale seront atteintes !"
 CHI_xie:0 "Xie"
 CHI_xie_desc:0 "Nous, en tant que Chinois, avons du sang chinois et devons le garder pur. Nous ferons tout pour garantir cela et qu’aucune goutte de notre grand sang ne soit rendue impure ! Nous commencerons le processus de purification immédiatement en détruisant les Occidentaux dans notre État !"
 CHI_prepare_for_the_three_year_plan:0 "Préparer pour le 'Plan de 3 ans'"
 CHI_prepare_for_the_three_year_plan_desc:0 "Nous ferons les préparatifs finaux pour le soi-disant plan triennal, qui nous permettra de transformer réellement la province modèle en un grand État capable de subvenir à son peuple !"
 CHI_project_gaosu_gonglu:0 "Projet ‘Gaosu Gonglu’"
 CHI_project_gaosu_gonglu_desc:0 "Nous commencerons le Projet ‘Gaosu Gonglu’ (signifiant en anglais Grande Route/Vautoroute Rapide), une partie intégrale de notre plan. Nous commencerons à construire une autoroute chinoise capable de transporter d’immenses quantités de personnes et de biens."
 CHI_upgrade_the_gonglu:0 "Améliorer le ‘Gonglu’"
 CHI_upgrade_the_gonglu_desc:0 "Les projets initiaux ayant bien progressé, il est temps d’améliorer nos autoroutes, faisant de notre Clique un endroit véritablement agréable à vivre et rendant notre logistique irréprochable."
 CHI_output_1: "Efficacité Accrue sur le Lieu de Travail"
 CHI_output_2: "Nouvelle méthode industrielle"
 CHI_output_3: "Le Lieu de Travail Moderne [GXC.GetAdjective]"
 CHI_finalize_the_gonglu:0 "Finaliser le ‘Gonglu’"
 CHI_finalize_the_gonglu_desc:0 "Nous travaillerons maintenant à finaliser l’Autoroute, ce qui nous permettra de devenir une véritable puissance logistique capable de combattre pour la Chine !"
 CHI_increase_workplace_efficiency:0 "Augmenter l’Efficacité au Travail"
 CHI_increase_workplace_efficiency_desc:0 "Nous travaillerons à augmenter l’efficacité dans nos lieux de travail afin qu’ils deviennent réellement excellents dans l’accomplissement de leurs tâches."
 CHI_implement_new_methods:0 "Mettre en Place de Nouvelles Méthodes"
 CHI_implement_new_methods_desc:0 "Nous mettrons en œuvre de nouvelles méthodes dans nos usines afin de garantir que nous puissions réellement atteindre une efficacité maximale avec le matériel que nous pouvons produire pour la Chine."
 CHI_a_modern_workplace:0 "Un Lieu de Travail Moderne"
 CHI_a_modern_workplace_desc:0 "Nous l’avons enfin fait ! Les lieux de travail de [ROOT.GetNameDef] font désormais effectivement partie des meilleurs au monde ! Quel merveilleux moment pour être ici !"
 CHI_increase_metal_output:0 "Augmenter la Production de Métaux"
 CHI_increase_metal_output_desc:0 "L’acier et l’aluminium sont des matériaux-clés pour nous permettre de nous industrialiser correctement et de construire une économie solide pour la Chine ; nous devons augmenter la production de ces matériaux."
 CHI_advanced_metal_extraction:0 "Extraction Avancée des Métaux"
 CHI_advanced_metal_extraction_desc:0 "Alors que nous produisons désormais de grandes quantités de métal bon marché, il est temps de travailler à produire des métaux de haute qualité, adaptés aux tâches avancées pour alimenter notre industrie."
 CHI_synthetic_oil_production:0 "Production d’Huile Synthétique"
 CHI_synthetic_oil_production_desc:0 "Avec une production de métaux désormais adéquate, nous commencerons à produire notre propre pétrole, ce qui nous permettra d’avoir notre propre production de caoutchouc et de pétrole pour toutes les tâches de notre industrie."
 CHI_project_gongchang:0 "Projet 'Gongchang'"
 CHI_project_gongchang_desc:0 "Nous lancerons le Projet Gongchang (Lieu de Travail/Usine) car les usines sont l’épine dorsale de notre économie ; ce projet visera à révolutionner nos usines et la production industrielle de masse."
 CHI_additional_gongchang:0 "Usines Supplémentaires"
 CHI_additional_gongchang_desc:0 "Le projet progressant bien, nous avons besoin d’autres usines pour nous industrialiser correctement et permettre à notre économie de véritablement prospérer."
 CHI_a_largescale_economy:0 "Une Économie à Grande Échelle"
 CHI_a_largescale_economy_desc:0 "Avec l’accomplissement du Projet 'Gongchang', nous pouvons désormais dire sans risque que nous disposons d’une économie moderne à grande échelle, capable de rivaliser avec d’autres petits pays."
 CHI_a_model_province_indeed:0 "Une Province Modèle en Effet"
 CHI_a_model_province_indeed_desc:0 "Avec le succès du plan triennal, nous pouvons effectivement affirmer que nos plans ont été une grande réussite et que nous sommes désormais la région la plus industrieuse de Chine !"
 CHI_professionalize_the_army_mp:0 "Professionnaliser l'Armée"
 CHI_professionalize_the_army_mp_desc:0 "Maintenant que nous avons ramené notre armée hors de la négligence, il est temps de restaurer des normes professionnelles, afin que nous puissions combattre correctement."
 CHI_new_model_province2:0 "Province moderne"
 CHI_new_model_province2_desc:0 "Avec l’acceptation du KMT, nous nous déclarerons nouvelle province modèle de la Chine et travaillerons pour devenir une puissance industrielle !"
 CHI_break_the_shackles:0 "Briser les chaînes"
 CHI_break_the_shackles_desc:0 "Alors que [CUG.GetNameDef] se bat pour sa survie, il est temps de briser les chaînes qu’il nous a imposées. Nous nous affranchirons de leur oppression et rétablirons notre indépendance !"
 CHI_seize_the_mantle_of_national_governance:0 "Saisir le Manteau du Gouvernement National"
 CHI_seize_the_mantle_of_national_governance_desc:0 "Nous saisirons le manteau du Gouvernement National, tandis que la Chine décline ! Nous sommes la nouvelle Chine et il est temps de nous proclamer exactement ainsi !"
 CHI_survival_of_the_fittest:0 "La loi du plus fort"
 CHI_survival_of_the_fittest_desc:0 "Avec l’effondrement total de [CUG.GetNameDef], il est temps que nous quittions le front uni et que nous cessions les hostilités envers le Japon."
 CHI_learn_from_chinese_equipment:0 "Apprendre de l’Équipement Chinois"
 CHI_learn_from_chinese_equipment_desc:0 "Nous étudierons l’armement chinois et utiliserons les informations recueillies pour améliorer nos troupes et mieux contrer les leurs."
 CHI_learn_from_japanese_equipment:0 "Apprendre de l’Équipement Japonais"
 CHI_learn_from_japanese_equipment_desc:0 "Nous étudierons l’armement japonais et utiliserons les informations recueillies pour améliorer nos troupes et mieux contrer les leurs."
 CHI_bribe_chinese_officers:0 "Soudoyer des Officiers Chinois"
 CHI_bribe_chinese_officers_desc:0 "Nous verserons un peu d’argent à des officiers chinois pour qu’ils divulguent des secrets clés afin de mieux les contrer en cas de guerre."
 CHI_a_great_victory:0 "Une grande victoire"
 CHI_a_great_victory_desc:0 "C’est fait ! Nous avons finalement vaincu les Japonais et sauvé la Chine ! Nul ne peut égaler la prouesse chinoise. Il est maintenant temps de voir quel sera notre avenir..."
 CHI_bribe_japanese_officers:0 "Soudoyer des Officiers Japonais"
 CHI_bribe_japanese_officers_desc:0 "Nous verserons un peu d’argent à des officiers japonais pour qu’ils divulguent des secrets clés afin de mieux les contrer en cas de guerre"
 CHI_request_communist_removal:0 "Demander la Suppression de [PRC.GetNameDef]"
 CHI_request_communist_removal_desc:0 "Nous demanderons l’exclusion de [PRC.GetNameDef] du Front Uni Chinois, car ces abominables personnes n’auraient jamais dû être admises en premier lieu !"
 CHI_a_neutral_battlefield:0 "Un Champ de Bataille Neutre"
 CHI_a_neutral_battlefield_desc:0 "Avec l’invasion imminente, nous contacterons le Japon pour demander la paix ; en échange, nous leur permettrons de traverser nos terres en toute impunité et de laisser la guerre se poursuivre sur notre territoire."
 CHI_chinese_united_front:0 "Front Uni Chinois"
 CHI_chinese_united_front_desc:0 "With the War of Resistance begun, we will stand together against Japan as a sign of National Unity! ZhongHua MinGuo WanSui!"
 CHI_left_front: "A Quitter le Front Uni Chinois"
 CHI_a_final_warning:0 "Le dernier avertissement"
 CHI_a_final_warning_desc:0 "Certains seigneurs de guerre ont précédemment rejeté nos avances ; peut-être ne comprennent-ils pas notre intention. Nous leur renverrons notre offre. Cette fois, avec l’intention claire d’attaquer s’ils rejettent."
 CHI_free_china_from_imperialism:0 "Libérer la Chine de l’Impérialisme"
 CHI_free_china_from_imperialism_desc:0 "Nous enverrons un ultimatum aux impérialistes qui agressent notre pays et exigerons leur retrait, afin que la Chine puisse enfin être libre !"
 CHI_federalism_the_savior_of_china:0 "Le Fédéralisme, le Sauveur de la Chine"
 CHI_federalism_the_savior_of_china_desc:0 "Nous avons constaté que c’est le fédéralisme qui a relevé la Chine de ses genoux ! Grâce à cela, nous pouvons effectivement déclarer que le fédéralisme est le vrai sauveur de la Chine !"
 CHI_japanese_lapdog:0 "Marionnette Japonaise"
 CHI_review_the_fortifications:0 "Revue des fortifications"
 CHI_review_the_fortifications_desc:0 "Nous examinerons nos fortifications et les inspecterons soigneusement afin d’en construire davantage à l’avenir."
 CHI_initial_fortification_tests:0 "Tests initiaux de fortifications"
 CHI_initial_fortification_tests_desc:0 "Nous utiliserons les nouvelles informations acquises et construirons un nouveau fort dans notre capitale afin de tester pleinement comment réaliser de bonnes fortifications."
 CHI_fortify_the_frontier:0 "Fortifier la frontière"
 CHI_fortify_the_frontier_desc:0 "Nous fortifierons la frontière de notre pays afin de pouvoir tenir notre frontière contre [CUG.GetNameDef]."
 CHI_high_level_forifications:0 "Haut niveau de fortification"
 CHI_high_level_fortifications_desc:0 "Nous travaillerons à des fortifications de haut niveau dans notre capitale et veillerons à ce que la capitale soit toujours tenue."
 CHI_review_the_army:0 "Examiner l'Armée"
 CHI_review_the_army_desc:0 "Nous passerons en revue l’armée de notre État. Cela nous aidera à progresser vers une armée véritablement moderne."
 CHI_a_decentralized_high_command:0 "Un Haut commandement décentralisé"
 CHI_a_decentralized_high_command_desc:0 "Nous ferons un effort pour décentraliser le Haut Commandement de notre armée afin de mieux tenir en cas d’invasion."
 CHI_uncaring_warfare:0 "Guerre Indifférente"
 CHI_uncaring_warfare_desc:0 "La guerre en Chine a été particulièrement indifférente, et nous adopterons cela en mettant en place ces pratiques dans notre armée afin d’en assurer la puissance."
 CHI_slash_ration_sizes:0 "Réduire les rations"
 CHI_slash_ration_sizes_desc:0 "Nous réduirons la taille des rations de nos troupes afin de rendre l’entretien d’une armée massive beaucoup moins coûteux et plus efficace."
 CHI_appropriate_civillian_stockpiles:0 "S’approprier les stocks civils"
 CHI_appropriate_civillian_stockpiles_desc:0 "Nous permettrons à nos soldats de s’approprier les stocks de nos civils et de piller à volonté, réduisant ainsi fortement le fardeau logistique."
 CHI_legalize_farm_helping:0 "Légaliser « l’aide aux fermes »"
 CHI_legalize_farm_helping_desc:0 "Nous autoriserons nos soldats à « aider » dans les champs des fermiers, mais il ne s’agira pas d’une aide altruiste : ils pourront s’emparer des récoltes des paysans. Cela leur permettra de vivre directement sur le terrain."
 CHI_mass_military_impressment:0 "Enrôlement militaire massif"
 CHI_mass_military_impressment_desc:0 "Nous commencerons un enrôlement militaire massif pour garantir que notre armée soit assez grande. Cela pourrait légèrement la diluer, mais le déploiement massif de troupes compensera largement cet effet."
 CHI_a_gun_behind_every_rock:0 "Un fusil derrière chaque rocher"
 CHI_a_gun_behind_every_rock_desc:0 "Nous travaillerons à avoir un fusil derrière chaque rocher et à pouvoir tenir chaque partie de notre nation pour en assurer la protection."
 CHI_the_country_is_where_the_general_is:0 "Là où se trouve le général, se trouve le pays"
 CHI_the_country_is_where_the_general_is_desc:0 "Nous tenterons de consolider l’armée et le pays autour du Général. Ainsi, nous pourrons tenir dans toutes les situations !"
 CHI_defense_of_the_fatherland:0 "En défense de la patrie"
 CHI_defense_of_the_fatherland_desc:0 "Nous créerons une armée dont le seul objectif est de défendre notre pays. Nous travaillerons pour cela et nous y parviendrons."
 CHI_a_proper_high_command:0 "Un Haut Commandement approprié"
 CHI_a_proper_high_command_desc:0 "Nous commencerons à établir un véritable Haut Commandement dans notre armée, afin qu’elle puisse fonctionner très efficacement dans chaque situation."
 CHI_a_new_recruitment_centre:0 "Un nouveau centre de recrutement"
 CHI_a_new_recruitment_centre_desc:0 "Avec un nouveau Haut Commandement établi, nous leur donnerons le pouvoir de forcer la population à entrer dans l’armée grâce à ce nouveau centre de recrutement."
 CHI_mountain_training:0 "Entraînement en terrain difficile"
 CHI_mountain_training_desc:0 "Nous travaillerons à aider notre armée à combattre en terrain difficile et à utiliser ces terrains pour affronter l’ennemi là où il ne peut pas atteindre efficacement, notamment grâce à nos troupes de montagne."
 CHI_a_central_high_command:0 "Haut Commandement centralisé"
 CHI_a_central_high_command_desc:0 "Nous œuvrons à créer un haut commandement centralisé afin d’assurer une modernisation rapide de nos forces."
 CHI_a_modern_army:0 "Une armée moderne"
 CHI_a_modern_army_desc:0 "Nous appliquerons de nouvelles méthodes modernes observées en Occident. Cela fera des merveilles pour la modernisation de nos forces."
 CHI_a_military_planning_school:0 "Une école de planification militaire"
 CHI_a_military_planning_school_desc:0 "Nous créerons une école de planification militaire pour élaborer de grands plans permettant à notre armée de mener nos guerres. Cela améliorera grandement notre efficacité."
 CHI_modern_warfare:0 "Guerre moderne"
 CHI_modern_warfare_desc:0 "Avec nos réformes terminées, nous avons véritablement créé une armée moderne et atteint la modernité."
 CHI_an_auxuliary_army:0 "Une armée auxiliaire"
 CHI_an_auxuliary_army_desc:0 "Notre objectif sera de créer une armée destinée à soutenir notre suzerain. Cette approche fonctionnelle rendra la création d’une armée efficace beaucoup plus simple."
 CHI_task_specific_planning:0 "Planification spécifique aux missions"
 CHI_task_specific_planning_desc:0 "Nous permettrons à notre armée de planifier spécifiquement chaque mission séparément. Avec notre petite armée, cela est réalisable et permettra d’accomplir chaque tâche avec un rendement optimal."
 CHI_a_gruelling_training_regimen:0 "Un régime d’entraînement exténuant"
 CHI_a_gruelling_training_regimen_desc:0 "Nous soumettrons notre armée à un régime d’entraînement exténuant. Avec notre petite armée, cela est très faisable. Cela la rendra beaucoup plus efficace sur le terrain."
 CHI_a_new_special_forces_project:0 "Un nouveau projet de forces spéciales"
 CHI_a_new_special_forces_project_desc:0 "Nous travaillerons sur un nouveau projet de forces spéciales afin de leur permettre de combattre beaucoup plus efficacement."
 CHI_uplift_the_special_forces:0 "Améliorer les forces spéciales"
 CHI_uplift_the_special_forces_desc:0 "Nous renforcerons nos forces spéciales en sélectionnant beaucoup plus rigoureusement nos soldats, ce qui leur permettra de combattre bien plus efficacement."
 CHI_a_new_tank_project:0 "Un nouveau projet de char"
 CHI_a_new_tank_project_desc:0 "Nous travaillerons sur un nouveau projet de char et moderniserons notre armée dans ce domaine afin de permettre aux blindés de mener nos troupes."
 CHI_uplift_the_tanks:0 "Améliorer les forces blindées"
 CHI_uplift_the_tanks_desc:0 "Nous renforcerons nos forces blindées en sélectionnant beaucoup plus rigoureusement nos soldats, ce qui leur permettra de combattre bien plus efficacement."
 CHI_industrial_investment2:0 "Investissement industriel"
 CHI_industrial_investment2_desc:1 "Bien que nos ressources soient limitées, nous devons tout de même investir le capital dont nous disposons pour améliorer notre économie."
 CHI_public_education_reform2:0 "Réforme de l’éducation publique"
 CHI_public_education_reform2_desc:1 "La base d’une nation moderne est la connaissance et la science. Nous devons d’abord améliorer et renforcer cette base."
 CHI_local_arms_production2:0 "Production locale d’armes"
 CHI_local_arms_production2_desc:1 "Tant que nous sommes perçus comme une simple faction insignifiante dans la guerre, nous ne pouvons pas compter sur des livraisons d’armes de l’extérieur. Nous devrons développer nos propres arsenaux pour fabriquer des armes."
 CHI_long_term_economic_planning2:0 "Planification économique à long terme"
 CHI_long_term_economic_planning2_desc:1 "Notre appareil bureaucratique n’est pas aussi vaste que celui du gouvernement central. Cela nous permet de couper une grande partie de la paperasserie qui freine le développement économique et de concentrer nos modestes efforts pour obtenir le meilleur rendement possible."
 CHI_local_arms_development2:0 "Développement d’armes locales"
 CHI_local_arms_development2_desc:1 "Produire des copies grossières d’armes étrangères ne suffit pas. Si nous voulons suivre le rythme du reste de la Chine, nous devons développer de nouvelles armes."
 CHI_heavy_weapons_development2:0 "Développement d’armes lourdes"
 CHI_heavy_weapons_development2_desc:1 "Avec des ressources limitées, nous devons tirer le maximum de notre maigre puissance de feu lourde. Nous devrions ordonner le développement de nouveaux canons d’artillerie."
 CHI_assemble_the_regency_council:0 "Assembler le conseil de régence"
 CHI_assemble_the_regency_council_desc:0 "Avec notre soutien assuré, nous assemblerons le conseil de régence pour faire du seigneur de guerre un Roi. Nous les placerons devant des faits accomplis qu’ils devront accepter. Vive l’Empereur !"
 CHI_a_new_chinese_empire:0 "Un nouvel Empire chinois"
 CHI_a_new_chinese_empire_desc:0 "Nous proclamerons un nouvel Empire chinois avec le seigneur de guerre comme Empereur ! Plus rien ne pourra nous arrêter désormais !"
 CHI_staff_the_royal_court:0 "Doter la cour royale"
 CHI_staff_the_royal_court_desc:0 "Ayant déclaré un nouvel Empire, nous devons créer une cour royale appropriée et la doter des bonnes personnes nous soutenant."
 CHI_royal_splendour:0 "Splendeur royale"
 CHI_royal_splendour_desc:0 "Avec notre cour établie, nous créerons un sentiment de splendeur autour de l’Empereur. Cela motivera notre peuple à travailler pour nous et à soutenir le grand Empereur !"
 CHI_denounce_the_roc:0 "Dénoncer [CUG.GetNameDef]"
 CHI_denounce_the_roc_desc:0 "Nous dénoncerons la République de Chine et prononcerons de grands discours contre elle. Ainsi, nos soldats seront bien plus de notre côté lors de l’unification finale du Royaume."
 CHI_state_confutionism:0 "Confucianisme d’État"
 CHI_state_confutionism_desc:0 "Nous imposerons le confucianisme d’État en Chine et œuvrerons en ce sens. Cela sécurisera grandement le destin de la Chine."
 CHI_consolidate_imperial_power:0 "Consolider le pouvoir impérial"
 CHI_consolidate_imperial_power_desc:0 "Avec le confucianisme en place, nous consoliderons le pouvoir impérial et les forcerons à fusionner avec la Monarchie, créant un grand ensemble pour gouverner la nation."
 CHI_crackdown_on_the_kmt:0 "Répression contre le KMT"
 CHI_crackdown_on_the_kmt_desc:0 "Le KMT ayant perdu toujours plus de pouvoir, nous commencerons une répression majeure contre eux et tenterons de les purger de toutes les parties de la société chinoise."
 CHI_invest_in_the_royal_army:0 "Investir dans l’armée royale"
 CHI_invest_in_the_royal_army_desc:0 "Si nous sommes un Empire plein de splendeur, alors notre armée doit le refléter également. Nous devons donc lancer un investissement massif afin qu’elle puisse faire face à toute menace étrangère."
 CHI_entice_british_investments:0 "Attirer les investissements britanniques"
 CHI_entice_british_investments_desc:0 "Les Britanniques ayant eux aussi un monarque et une forte influence sur la Chine, nous les implorerons pour obtenir des investissements afin de réparer notre économie faible."
 CHI_a_modern_economy:0 "Une économie moderne"
 CHI_a_modern_economy_desc:0 "Grâce à ces investissements et au temps, nous avons désormais une économie moderne dans notre région de Chine ! L’Empereur est véritablement grand !"
 CHI_a_declaration_from_the_clergy:0 "Une déclaration du clergé"
 CHI_a_declaration_from_the_clergy_desc:0 "Nous ferons travailler ensemble les prêtres confucéens pour élaborer un fondement théologique à notre Monarchie et proclamer que nous sommes le seul salut pour la Chine !"
 CHI_a_final_blow_to_the_kmt:0 "Un dernier coup porté au KMT"
 CHI_a_final_blow_to_the_kmt_desc:0 "Nous porterons un dernier coup au KMT sur nos terres, avec le clergé et le peuple à nos côtés, et éliminerons toute trace d’eux dans notre Nation."
 CHI_prepare_to_unite_the_kingdom:0 "Préparer l’unification de l’Empire"
 CHI_prepare_to_unite_the_kingdom_desc:0 "La situation étant suffisamment améliorée, nous nous préparerons à unir le grand Empire de Chine !"
 CHI_cater_to_the_past:0 "S’adresser au passé"
 CHI_cater_to_the_past_desc:0 "Pour garantir une véritable alternative au KMT, nous adopterons des idées du passé. Le confucianisme et le monarchisme seront le salut de la Chine !"
 CHI_reempower_religious_ideas:0 "Redonner du pouvoir aux idées religieuses"
 CHI_reempower_religious_ideas_desc:0 "Si notre plan doit réussir, nous devrons renforcer le soutien religieux afin que notre régime puisse se maintenir sur le long terme."
 CHI_prepare_supply_lines:0 "Préparer les lignes de ravitaillement"
 CHI_prepare_supply_lines_desc:0 "Pour unifier la Chine musulmane, nous devons nous assurer que nos lignes de ravitaillement sont prêtes à affronter les autres cliques."
 CHI_lay_claim_to_muslim_china:0 "Revendiquer la Chine musulmane"
 CHI_lay_claim_to_muslim_china_desc:0 "Ayant sécurisé le pouvoir sur notre État, nous revendiquerons désormais être le véritable représentant de la Chine musulmane et chercherons à l’unifier, afin de réellement renforcer les musulmans Hui en Chine."
 CHI_begin_operations:0 "Commencer les opérations militaires"
 CHI_begin_operations_desc:0 "Avec nos revendications posées, nous commencerons à mobiliser l’armée afin de marcher sur les autres seigneurs de guerre et unifier la Chine."
 CHI_a_victory_for_islam:0 "Avec nos revendications posées, nous commencerons à mobiliser l’armée afin de marcher sur les autres seigneurs de guerre et unifier la Chine."
 CHI_a_victory_for_islam_desc:0 "Nous avons gagné et sommes victorieux ; nous déclarerons qu’il s’agit ici d’une grande victoire pour l’Islam."
 CHI_alignment_with_the_kmt:0 "Chercher un alignement avec le KMT"
 CHI_alignment_with_the_kmt_desc:0 "Afin de sécuriser le pouvoir dans le Nord-Ouest de la Chine, nous contacterons Nankin et le KMT, afin d’obtenir un solide soutien."
 CHI_ultimatum_to_the_warlord:0 "Ultimatum au seigneur de guerre"
 CHI_ultimatum_to_the_warlord_desc:0 "Avec le soutien du KMT, nous enverrons un ultimatum au Seigneur de guerre pour qu’il suive sa tradition islamique et se soumette à notre volonté."
 CHI_fire_the_flames_of_islam:0 "Attiser les flammes de l’Islam"
 CHI_fire_the_flames_of_islam_desc:0 "Nous sommes un peuple islamique, contrairement au reste de la Chine. Nous accentuerons donc cette différence et assurerons un destin séparé pour le peuple Hui."
 CHI_a_religion_of_peace:0 "Une religion de paix"
 CHI_a_religion_of_peace_desc:0 "L’Islam est avant tout une religion de paix ; nous chercherons donc simplement une union des États islamiques du nord-ouest de la Chine."
 CHI_secure_warlord_support:0 "Obtenir le soutien du seigneur de guerre"
 CHI_secure_warlord_support_desc:0 "Nous contacterons le seigneur de guerre et obtiendrons son soutien afin de faciliter notre État religieux pour le peuple Hui."
 CHI_swap_out_non_hui_nobility:0 "Remplacer la noblesse non-Hui"
 CHI_swap_out_non_hui_nobility_desc:0 "Avec le seigneur de guerre à nos côtés, nous prendrons le contrôle de l’État et éliminerons la noblesse non-Hui pour établir notre propre État."
 CHI_nationalist_socialist_indoctrination:0 "Endoctrinement national-socialiste"
 CHI_natiinalist_socialist_indoctrination_desc:0 "Avec les Deux principes et notre Gouvernement National établi, nous commencerons à endoctriner notre peuple à nos idées afin d’être en position d’unifier la Patrie !"
 CHI_prepare_for_national_unification:0 "Préparer l’unification nationale"
 CHI_prepare_for_national_unification_desc:0 "Avec notre peuple suffisamment endoctriné, il est temps de nous préparer à l’Unification Nationale."
 CHI_foster_a_chinese_volksgemeinschaft:0 "Une Volksgemeinschaft chinoise"
 CHI_foster_a_chinese_volksgemeinschaft_desc:0 "Afin de rendre notre pays grand, nous devons créer une « Volksgemeinschaft » à l’exemple des Allemands. De cette manière, notre peuple pourra rester plus soudé."
 CHI_donations_for_the_national_army:0 "Dons pour l’Armée Nationale"
 CHI_donations_for_the_national_army_desc:0 "L’Armée Nationale est depuis longtemps dans un état de déclin. Pour y remédier, nous demanderons des dons de la part du peuple chinois et de notre Volksgemeinschaft !"
 CHI_donations_for_the_welfare_of_the_people:0 "Dons pour le bien-être du peuple"
 CHI_donations_for_the_welfare_of_the_people_desc:0 "Nous demanderons également au peuple de donner pour notre propre économie. Ainsi, la Volksgemeinschaft sera rendue forte."
 CHI_the_national_unity_government:0 "Le Gouvernement d’Unité Nationale"
 CHI_the_national_unity_government_desc:0 "Avec la ligue au pouvoir, nous déclarerons un Gouvernement National afin d’aider la ligue à accomplir son objectif : créer une grande République Nationale Chinoise !"
 CHI_minzhu_minsheng:0 "Minzhu & Minsheng"
 CHI_minzhu_minsheng_desc:0 "Les Chinois croient en trois principes. C’est faux, cependant : le principe de démocratie est une erreur et une abomination. À la place, nous le réduirons au Nationalisme et au Socialisme et en ferons une nouvelle idéologie !"
 CHI_envoy_to_germany:0 "Envoyé en Allemagne"
 CHI_envoy_to_germany_desc:0 "Notre idéologie étant semblable au national-socialisme, nous enverrons un envoyé en Allemagne pour leur demander de détourner leur soutien de [CHI.GetNameDef]."
 CHI_nationalize_corrupt_buisnesses:0 "Nationaliser les entreprises corrompues"
 CHI_nationalize_corrupt_buisnesses_desc:0 "Nous commencerons une politique de nationalisation des entreprises corrompues appartenant au KMT et aux criminels. Cela nous donnera bien plus d’influence économique et nous permettra de résoudre nos problèmes économiques."
 CHI_republic_without_democracy:0 "République sans démocratie"
 CHI_republic_without_democracy_desc:0 "Le Congrès a décidé que nous deviendrons une république nationale chinoise ; cependant, contrairement aux autres républiques, nous n’instaurerons pas la démocratie. À la place, nous laisserons le seigneur de guerre nous mener vers la victoire !"
 CHI_national_regeneration_league_victory:0 "Victoire de la Ligue de Régénération Nationale"
 CHI_national_regeneration_league_victory_desc:0 "La République chinoise a vu la victoire de la Ligue de Régénération Nationale, qui a établi une nouvelle République !"
 CHI_an_enabling_act:0 "Une loi d’habilitation"
 CHI_an_enabling_act_desc:0 "Avec la Ligue ayant pris le contrôle de la République, nous adopterons une loi d’habilitation afin d’abolir la démocratie conformément à notre idéologie. Cela rendra notre gouvernement bien plus efficace."
 CHI_devolop_a_cult_of_personality:0 "Développer un culte de la personnalité"
 CHI_devolop_a_cult_of_personality_desc:0 "Pour maintenir efficacement notre gouvernance sur la région et offrir une alternative fonctionnelle au KMT, nous développerons un culte de la personnalité autour du seigneur de guerre."
 CHI_radicalize_anti_japanese_retoric:0 "Radicaliser la rhétorique anti-japonaise"
 CHI_radicalize_anti_japanese_retoric_desc:0 "Pour renforcer efficacement notre nouveau gouvernement, nous déclarerons une hostilité totale envers les Japonais et amplifierons cette rhétorique ! Ainsi, le peuple chinois nous soutiendra bien davantage et soutiendra nos plans pour reconquérir la Chine !"
 CHI_radicalize_chinese_nationalism:0 "Radicaliser le nationalisme chinois"
 CHI_radicalize_chinese_nationalism_desc:0 "Nous tenterons de radicaliser le nationalisme chinois. Ainsi, nous serons vus comme le véritable État chinois et l’État-nation chinois sera rendu grand grâce à nous !"
 CHI_convene_the_national_unity_congress:0 "Convoquer le Congrès d’Unité Nationale"
 CHI_convene_the_national_unity_congress_desc:0 "Ayant répandu notre influence dans toute notre clique, nous convoquerons un grand Congrès, déterminant le destin de notre État ! Le seigneur de guerre dirigera-t-il une nouvelle république, ou se laissera-t-il proclamer Empereur de tout le peuple chinois ?"
 CHI_crush_the_farmers:0 "Écraser les fermiers"
 CHI_crush_the_farmers_desc:0 "Avec la résistance chinoise entière agissant contre nous, nous sécuriserons la campagne et écraserons les fermiers rebelles ; ainsi, notre armée pourra se préparer aux futures opérations. Personne ne peut défier le seigneur de guerre."
 CHI_crush_the_workers:0 "Écraser les ouvriers"
 CHI_crush_the_workers_desc:0 "Nous écraserons les travailleurs qui se sont révoltés. Cela garantira que les seuls opposants restants seront les membres du KMT, dont nous pourrons facilement nous occuper."
 CHI_government_of_national_salvation:0 "Gouvernement de Salut National"
 CHI_government_of_national_salvation_desc:0 "Nous déclarerons le Gouvernement de Salut National et nous préparerons à sauver notre partie de la Chine des odieux Chiangistes et Maoïstes !"
 CHI_oust_kmt_troublemakers:0 "Expulser les fauteurs de trouble du KMT"
 CHI_oust_kmt_troublemakers_desc:0 "Tout est en place, les membres du parti KMT seront désormais rassemblés et feront disparaître…"
 CHI_use_anti_chinese_intel_from_japan:0 "Renseignements anti-chinois japonais"
 CHI_use_anti_chinese_intel_From_japan_desc:0 "La guerre ayant commencé, nous demanderons aux Japonais de nous fournir des renseignements sur la Chine afin que nous soyons capables de les contenir."
 CHI_ramp_up_anti_communist_retoric:0 "Accentuer la rhétorique anticommuniste"
 CHI_ramp_up_anti_communist_retoric_desc:0 "Afin de rallier le peuple derrière nous, nous justifierons notre rapprochement avec le Japon en mettant en avant les horreurs du Communisme et tout le mal qu’ils ont fait ! Ils deviendront ainsi le principal ennemi à la place de nous."
 CHI_display_the_cruelty_of_chaing_and_mao:0 "Montrer la cruauté de Chiang et Mao"
 CHI_display_the_cruelty_of_chaing_and_mao_desc:0 "Nous commencerons maintenant à montrer toutes les atrocités commises par Chiang et Mao et leur petite dictature contre le peuple chinois."
 CHI_an_alternative_to_the_two:0 "Une alternative au KMT et au PCC"
 CHI_an_alternative_to_the_two_desc:0 "Maintenant que nous avons prouvé à quel point le KMT et le PCC sont horribles, nous déciderons d’offrir une alternative, sous le bienveillant parapluie des Japonais, afin d’être un véritable État pour le peuple chinois."
 CHI_japanese_money:0 "Argent japonais"
 CHI_japanese_money_desc:0 "Nous demanderons de l’argent au Japon pour sécuriser une industrie adéquate. Ainsi, notre règne sera encore plus prospère."
 CHI_military_training_in_japan:0 "Entraînement militaire au Japon"
 CHI_military_training_in_japan_desc:0 "Avec l’Armée du Kwantung présente, nous pouvons désormais envoyer des recrues au Japon pour y recevoir leur entraînement. Cela aidera notre armée à se moderniser rapidement."
 CHI_japanese_military_support:0 "Soutien militaire japonais"
 CHI_japanese_military_support_desc:0 "Avec un soutien économique assuré de la part du Japon pour notre économie, nous l’obtiendrons aussi pour notre armée. Ainsi, nous serons capables de tenir tête à la Chine."
 CHI_further_japanese_guns:0 "Demander davantage de fusils japonais"
 CHI_further_japanese_guns_desc:0 "Nous avons besoin de plus de fusils pour tenir face à la Chine. Nous devons en acquérir. Pour ce faire, nous demanderons au Japon de nous en fournir davantage."
 CHI_our_own_military_desc:0 "Maintenant que notre armée s’est modernisée, il est temps pour nous d’avoir notre propre armée et de devenir progressivement autosuffisants."
 CHI_begin_invitation_of_the_kwantung_army:0 "Inviter l’Armée du Kwantung"
 CHI_begin_invitation_of_the_kwantung_army_desc:0 "Avec le soutien japonais assuré, nous inviterons l’Armée du Kwantung afin d’être mieux capables de contrer les envahisseurs chinois et de construire une armée plus vaste !"
 CHI_submit_to_tokyo:0 "Se soumettre à Tokyo"
 CHI_submit_to_tokyo_desc:0 "Nous nous soumettrons à Tokyo afin d’assurer l’avenir de notre État seigneurial. Peut-être cela ouvrira-t-il même la porte à l’unification chinoise !"
 CHI_a_japanese_national_government:0 "Un Gouvernement National japonais"
 CHI_a_japanese_national_government_desc:0 "Avec la trahison des Mandchous, nous reprendrons maintenant la revendication de la Chine sous le Japon afin de préparer un nouveau Gouvernement National."
 CHI_consolidate_control_over_china:0 "Consolider le contrôle sur la Chine"
 CHI_consolidate_control_over_china_desc:0 "Nous commencerons maintenant à consolider le contrôle sur la Chine, et ferons en sorte que le peuple commence à nous voir comme le véritable gouvernement de la Chine ! La Chine a été unifiée et nous sommes les nouveaux sauveurs de la Chine !"
 CHI_reinvest_the_collectivisations:0 "Collectivisation rurale"
 CHI_reinvest_the_collectivisations_desc:0 "Nous avons saisi beaucoup de propriétés à la bourgeoisie chinoise ; nous allons maintenant les réinvestir dans les économies locales, afin de réparer notre économie et d’aider les travailleurs."
 CHI_our_own_military_industrial_complex:0 "Notre propre industrie militaire"
 CHI_our_own_military_industrial_complex_desc:0 "Si nous voulons un jour tenir face à [CHI.GetNameDef] ou [Jap.GetNameDef], nous devons d’abord construire notre propre armée. Pour cela, il nous faut notre propre industrie militaire. Nous nous attellerons immédiatement à cette tâche."
 CHI_an_economy_for_the_proletariat:0 "Une économie pour le prolétariat"
 CHI_an_economy_for_the_proletariat_desc:0 "Notre armée étant en construction, nous devons maintenant tenir notre promesse envers nos civils et commencer à investir dans une économie pour nos travailleurs."
 CHI_empower_the_regional_pla:0 "Renforcer l’APL régionale"
 CHI_empower_the_regional_pla_desc:0 "L’armée étant sécurisée, nous lui permettrons de prendre le contrôle de l’État. Ainsi, l’APL sera bien plus efficace pour nous aider à réunifier la Chine !"
 CHI_shaping_the_state_in_ones_own_image:0 "Façonner l’État à l’image du seigneur de guerre"
 CHI_shaping_the_state_in_ones_own_image_desc:0 "L’armée étant au pouvoir, nous commencerons à façonner l’État à l’image du seigneur de guerre, notamment en faisant prêter des serments personnels des soldats envers lui."
 CHI_a_new_peoples_republic:0 "Un nouveau [PRC.GetName]"
 CHI_a_new_peoples_republic_desc:0 "Avec la loyauté de l’armée assurée envers le seigneur de guerre, celui-ci a décidé qu’il se proclamerait le seul véritable gouvernement chinois, et déclarera la Seconde République Populaire."
 CHI_troops_for_mao:0 "Envoyer des volontaires à [PRC.GetNameDef]"
 CHI_troops_for_mao_desc:0 "Mao combattant contre [ROC.GetNameDef], nous lui enverrons un grand contingent d’hommes afin de soutenir sa lutte."
 CHI_loyalty_has_its_rewards:0 "La loyauté a ses récompenses"
 CHI_loyalty_has_its_rewards_desc:0 "Avec nous et notre contingent ayant été d’une grande aide pour Mao, et la Chine ayant été unifiée sous [PRC.GetNameDef], nous pouvons désormais profiter des récompenses de notre loyauté et de notre aide envers Mao."
 CHI_a_great_purge:0 "Écarter les officiers rebelles"
 CHI_a_great_purge_desc:0 "Notre armée se révoltant après notre passage au communisme, il est temps de suivre l’exemple du grand Staline et de mener une purge massive, consolidant notre autorité sur l’armée."
 CHI_full_membership_in_the_republic:0 "Intégration complète à [PRC.GetNameDef]"
 CHI_full_membership_in_the_republic_desc:0 "[PRC.GetNameDef] devenant de plus en plus unifié, il est temps que nous nous intégrions nous aussi. Ainsi, la Chine pourra redevenir une."
 CHI_learn_from_the_maoists:0 "Apprendre des maoïstes"
 CHI_learn_from_the_maoists_desc:0 "Les maoïstes ont beaucoup d’expérience dans le combat contre [CHI.GetNameDef]. Nous leur demanderons donc de nous transmettre une partie de cette expérience afin que nous puissions, nous aussi, les combattre efficacement."
 CHI_public_works2:0 "Travaux publics"
 CHI_public_works2_desc:0 "Avec notre État communiste établi, il est temps de commencer des travaux publics. Ainsi, le peuple pourra véritablement démontrer son amour pour la Chine et le socialisme !"
 CHI_rural_militias2:0 "Milices rurales"
 CHI_rural_militias2_desc:0 "Nous allons créer un plan pour des milices rurales. Ainsi, nous pourrons résoudre le problème de main-d’œuvre et utiliser les masses rurales au chômage."
 CHI_labor_reform2:0 "Réforme du travail"
 CHI_labor_reform2_desc:0 "Nous allons créer un plan massif de réforme du travail, à la fois pour rendre notre main-d’œuvre plus efficace et pour augmenter la main-d’œuvre dont nous disposons !"
 CHI_land_redistribution2:0 "Redistribution des terres"
 CHI_land_redistribution2_desc:0 "Nous commencerons à redistribuer les terres des riches corrompus pour les donner aux pauvres travailleurs chinois ! Cela aidera grandement à stabiliser notre économie, car le capital et le travail seront réunis !"
 CHI_ideological_education2:0 "Éducation idéologique"
 CHI_ideological_deucation2_desc:0 "Nous commencerons à éduquer le peuple aux voies du communisme. Cela aidera à calmer une grande partie de la peur et de la haine envers notre gouvernement !"
 CHI_land_value_tax2:0 "Taxe sur la valeur des terres"
 CHI_land_value_tax2_desc:0 "Nous allons maintenant mettre en place une taxe sur la valeur foncière. Ainsi, nous pourrons correctement redistribuer la richesse au fil du temps, assurant un financement solide de l’État et un peuple soutenant !"
 CHI_communist_administrators2:0 "Administrateurs communistes"
 CHI_communist_administrators2_desc:0 "Notre administration étant si jeune, il peut être judicieux de faire venir certains administrateurs de [PRC.GetNameDef] ; ils nous aideront ainsi à nous rétablir et à gérer notre État correctement."
 CHI_judiciary_reforms2:0 "Réformes judiciaires"
 CHI_judiciary_reforms2_desc:0 "Nous mettrons en œuvre des réformes judiciaires à grande échelle. Ainsi, nous pourrons grandement stabiliser notre gouvernement et instaurer un ensemble de lois communistes."
 CHI_the_warlord_stays:0 "Le seigneur de guerre reste"
 CHI_the_warlord_stays_desc:0 "Les partisans privés du seigneur de guerre ont formé un parti et remporté les élections !"
 CHI_province_work_force_conscription:0 "Conscription de la main-d'œuvre provinciale"
 CHI_province_work_force_conscription_desc:0 "Si notre économie doit se remettre des jours du seigneur de guerre, nous devons permettre à nos provinces fédérales d’enrôler des travailleurs ; ainsi, elles pourront contribuer à notre économie et nous pourrons réduire les dépenses excessives de l’État."
 CHI_work_out_provincial_workforce_regulations:0 "Élaborer les règlements provinciaux sur la main-d'œuvre"
 CHI_work_out_provincial_workforce_regulations_desc:0 "Avec la reprise économique, nous pouvons désormais mettre en place des réglementations sur le travail. Ainsi, nos employés seront protégés pendant que nous travaillons sur nos enjeux économiques."
 CHI_provide_funds_for_local_infrastructure:0 "Fournir des fonds pour l’infrastructure locale"
 CHI_provide_funds_for_local_infrastructure_desc:0 "Nous utiliserons les fonds provenant de notre nouvelle main-d’œuvre pour financer une amélioration massive des infrastructures locales, ce qui améliorera considérablement notre qualité de vie et notre capacité économique."
 CHI_begin_local_industrialisation:0 "Commencer l’industrialisation locale"
 CHI_begin_local_industrialisation_desc:0 "Maintenant que l’infrastructure est en place, nous utiliserons nos fonds pour améliorer notre capacité économique et commencer à industrialiser."
 CHI_enforce_local_military_budgets:0 "Imposer des budgets militaires locaux"
 CHI_enforce_local_military_budgets_desc:0 "Nous obligerons également nos États fédéraux à investir dans l’armée. C’est notre seul moyen d’assurer la présence de fonds et de moyens suffisants pour contrer une attaque extérieure."
 CHI_oust_KMT_influence:0 "Écarter l’influence du KMT"
 CHI_oust_KMT_influence_desc:0 "Plutôt que d’abandonner notre statut d’État, nous chasserons l’influence restante du KMT et nous assurerons d’embrasser notre propre destin ! Gloire à la clique !"
 CHI_an_alternative_to_the_KMT:0 "Une alternative au KMT"
 CHI_an_alternative_to_the_KMT_desc:0 "Si nous voulons vraiment représenter le peuple chinois, nous ne pouvons pas nous soumettre au Japon ; à la place, nous nous préparerons à devenir une alternative au KMT, sans succomber aux excès de Mao !"
 CHI_a_true_chinese_republic:0 "Une vraie République Chinoise"
 CHI_a_true_chinese_republic_desc:0 "Les Chiangistes promettant la démocratie tout en imposant une dictature, nous ferons l’inverse : nous commencerons immédiatement à réformer notre clique en un État démocratique, digne de la confiance du peuple."
 CHI_question_of_the_system:0 "La question du système"
 CHI_question_of_the_system_desc:0 "En nous préparant aux élections, nous devons créer un système selon lequel l’État fonctionnera."
 CHI_party_founding_act:0 "Loi sur la fondation des partis"
 CHI_party_founding_act_desc:0 "Si nous voulons organiser des élections, nous devons permettre la formation d’une variété de partis. Pour cela, nous adopterons la « Loi sur la fondation des partis »."
 CHI_anti_KMT_propaganda:0 "Propagande anti‑KMT"
 CHI_anti_KMT_propaganda_desc:0 "Avec le KMT qui s’ingère dans nos affaires et qui détient illégitimement une emprise sur une grande partie de notre population, nous devons commencer la propagande contre eux, afin de protéger notre peuple et notre armée des défections !"
 CHI_question_of_the_constitution:0 "La Question de la Constitution"
 CHI_question_of_the_constitution_desc:0 "Avec notre système choisi, nous devons maintenant planifier les détails de notre Constitution."
 CHI_hold_free_elections:0 "Organiser des élections libres"
 CHI_hold_free_elections_desc:0 "Tout est enfin en place ! Nous pouvons désormais organiser des élections libres dans notre petit État !"
 CHI_federalist_victory:0 "Victoire Fédéraliste"
 CHI_federalist_victory_desc:0 "Les Fédéralistes et leur attrait pour la souveraineté régionale ont gagné !"
 CHI_empower_the_federal_states:0 "Donner du pouvoir aux États fédéraux"
 CHI_empower_the_federal_states_desc:0 "Avec nous, fédéralistes, au pouvoir, nous allons maintenant renforcer le pouvoir des États fédéraux ! Ainsi, le fédéralisme pourra réellement prospérer et nos premiers principes pourront être accomplis !"
 CHI_full_hezhong:0 "Plein Hezhong"
 CHI_full_hezhong_desc:0 "Avec les États fédéraux renforcés, nous pouvons maintenant diviser le pays en Hezhong afin d’assurer que le fédéralisme puisse véritablement être vécu !"
 CHI_beacon_of_federalism_desc:0 "Avec notre économie florissante et notre politique fédéraliste établie, nous pouvons vraiment dire que le véritable fédéralisme a été atteint ici et que nous en sommes une lueur éclatante !"
 CHI_a_new_federalist_national_government:0 "Un nouveau gouvernement national fédéraliste"
 CHI_a_new_federalist_national_government_desc:0 "Ayant commencé nos premiers progrès vers le fédéralisme et installé notre quartier général, il est temps de véritablement s’opposer aux Chiangistes et aux Maoïstes. Pour ce faire, nous déclarerons un nouveau gouvernement national et nous préparerons à unifier la Chine !"
 CHI_an_appeal_for_autonomy:0 "Un appel à l’autonomie"
 CHI_an_appeal_for_autonomy_desc:0 "Il semble désespéré que nous puissions unifier la Chine ; au lieu de cela, nous nous adresserons au ROC, demandant à devenir un État fédéral autonome, gardant le fédéralisme dans notre région ainsi que dans celles sous notre gouvernorat."
 CHI_train_everywhere_always:0 "S’entraîner partout, tout le temps"
 CHI_train_everywhere_always_desc:0 "Avec notre État sécurisé, nous entreprendrons un vaste programme d’entraînement. Ainsi, nous équiperons notre armée pour apprendre les détails du pays et tirer parti du moindre recoin."
 CHI_make_a_detailed_home_plan:0 "Élaborer un plan détaillé du territoire"
 CHI_make_a_detailed_home_plan_desc:0 "Ayant appris toutes les subtilités de notre pays durant nos exercices, nous centraliserons ces informations dans un seul plan, afin que tous nos soldats puissent combattre parfaitement partout, et non seulement dans les quelques endroits où ils se sont entraînés."
 CHI_the_territories_to_free:0 "Les territoires à libérer"
 CHI_the_territories_to_free_desc:0 "Afin de rendre la Chine à nouveau grande et d’apporter le combat à notre ennemi, nous établirons des revendications sur les terres ennemies. Ainsi, notre influence NRA grandira bientôt !"
 CHI_begin_the_war:0 "Marcher dans les territoires"
 CHI_begin_the_war_desc:0 "Nous commencerons à marcher dans nos terres et à les saisir par une invasion sans avertissement. Ce mouvement audacieux fera peut-être battre en retraite l’ennemi sans combattre, mais sinon, nous sommes plus que prêts à les affronter et à saisir les territoires par la force."
 CHI_declare_victory_over_the_fiends:0 "Déclarer la victoire sur les infâmes"
 CHI_declare_victory_over_the_fiends_desc:0 "Avec nos territoires saisis et la mission accomplie, nous pouvons maintenant déclarer pleinement la victoire !"
 CHI_a_bulwark_of_defense:0 "Un rempart de défense"
 CHI_a_time_for_integration:0 "Un temps pour l’intégration"
 CHI_a_time_for_integration_desc:0 "Toutes les choses étant en place, et le seigneur de guerre étant las de diriger cet État, il se retirera et permettra à la Clique de s’intégrer pleinement dans le [CHI.GetName]."
 CHI_national_defense_state:0 "État de défense nationale"
 CHI_national_defense_state_desc:0 "Avec la guerre à l’horizon, nous devons nous préparer du mieux possible, nous ferons tout ce que nous pouvons pour nous mobiliser et garantir que la Chine ne tombera pas !"
 CHI_chinese_defense_industry:0 "Industrie de défense [ROOT.GetAdjective]"
 CHI_chinese_defense_industry_desc:0 "Si nous voulons jouer un rôle dans la défense de la Chine, nous devons travailler à développer notre propre industrie de défense. Ainsi, nous serons capables de repousser les envahisseurs et de sauver notre grande nation !"
 CHI_technological_cooperation2:0 "Coopération technologique"
 CHI_technological_cooperation2_desc:0 "Nous tenterons d’apprendre de l’armée du [CHI.GetName]. Ainsi, nous moderniserons rapidement et serons utiles à la NRA."
 CHI_secure_internal_politics2:0 "Sécuriser la politique interne"
 CHI_secure_internal_politics2_desc:0 "La Clique est restée à flot sans rien faire ces dernières années ; cela doit cesser, car les événements mondiaux s’accélèrent. Il est temps que la Clique prenne position dans le monde."
 CHI_investments_from_nanjing:0 "Investissements de Nankin"
 CHI_investments_from_nanjing_desc:0 "En devenant une partie du [CHI.GetNameDef], nous pouvons leur demander de nous fournir des fonds pour réparer notre économie brisée."
 CHI_national_defense_fund:0 "Fonds de défense nationale"
 CHI_national_defense_fund_desc:0 "Nous constituerons un Fonds national de défense afin de garantir que nous avons les ressources nécessaires pour assurer une armée forte capable de repousser nos ennemis."
 CHI_commander_political_training:0 "Former les commandants aux voies de la politique"
 CHI_commander_political_training_desc:0 "Si nos commandants de la NRA devaient un jour prendre le contrôle de la Clique, nous devons nous assurer qu’ils soient correctement équipés pour les tâches de gestion de notre État. Par conséquent, nous les formerons de ces manières."
 CHI_professionalize_the_army:0 "Professionnaliser l’Armée"
 CHI_professionalize_the_army_desc:0 "Notre armée est composée de bandes non professionnelles. Si elle devait un jour défendre notre État, notre armée doit être professionnalisée pour être capable d’accomplir cette grande tâche."
 CHI_commence_nra_takeover:0 "Commencer la prise de contrôle par la NRA"
 CHI_commence_nra_takeover_desc:0 "Nous lancerons une prise de contrôle pour la NRA, accomplissant entièrement notre objectif de devenir un bastion de défense pour [CHI.GetNameDef]."
 CHI_unite_the_province:0 "Unifier la Province"
 CHI_unite_the_province_desc:0 "Notre province est divisée depuis longtemps, cependant, maintenant que nous avons renforcé la NRA, il est temps de frapper et d’unir notre grande province du Xinjiang en Chine occidentale !"
 CHI_request_kmt_protection:0 "Demander la protection du KMT"
 CHI_request_kmt_protection_desc:0 "Nous sommes désespérés seuls. Avec les Nationalistes d’un côté, les Communistes de l’autre et même les Japonais venant vers nous. Si nous voulons survivre, nous devons choisir un camp, et le seul prêt à travailler avec nous est le gouvernement central du KMT."
 CHI_secure_kmt_funds:0 "Obtenir des fonds du KMT"
 CHI_secure_kmt_funds_desc:0 "Comme nous sommes sous leur influence, il leur est simple de nous prêter une petite somme d’argent. Cette monnaie stable contribuera grandement à améliorer notre faible économie."
 CHI_centralise_authority_around_the_warlord:0 "Centraliser l’Autorité autour du Seigneur de Guerre"
 CHI_centralise_authority_around_the_warlord_desc:0 "Le Seigneur de guerre commande tous les aspects de notre Clique. Si nous voulons survivre ou prospérer, il doit consolider son autorité autour de lui et ainsi amener lentement le peuple vers lui plutôt que vers le gouvernement de Nankin."
 CHI_seize_western_assets:0 "Saisir les actifs occidentaux"
 CHI_seize_western_assets_desc:0 "Beaucoup de puissances étrangères possèdent de vastes actifs dans notre pays qu’elles ont acquis lorsque le gouvernement central a perdu de l’influence. C’est maintenant le moment idéal pour les reprendre et réutiliser cet argent pour nos propres citoyens et les tâches du seigneur de guerre."
 CHI_denounce_the_japanese_empire:0 "Dénoncer l’Empire japonais"
 CHI_denounce_the_japanese_empire_desc:0 "Les Japonais sont le fléau de tous les peuples chinois et ont déjà largement étendu leur influence dans le nord de la Chine. Nous devons dénoncer cela, nous préparer à une invasion de leur part et chercher tout moyen de nous opposer à ce peuple perfide !"
 CHI_seize_japanese_assets:0 "Saisir les actifs japonais"
 CHI_seize_japanese_assets_desc:0 "Puisque nous avons imposé un embargo aux Japonais, il est logique de reprendre leurs actifs dans notre pays, car cela nous placerait dans une bien meilleure position pour contrer leur invasion inévitable."
 CHI_an_oath_of_loyalty:0 "Un serment de loyauté"
 CHI_an_oath_of_loyalty_desc:0 "Le seigneur de guerre ayant gagné en autorité, il fera désormais prêter serment de loyauté à chaque soldat, envers lui avant toute autre personne. Ainsi, nous encouragerons les soldats à rester à ses côtés en cas d’invasion chinoise éventuelle."
 CHI_seize_chinese_assets:0 "Saisir les actifs chinois"
 CHI_seize_chinese_assets_desc:0 "Ayant imposé la loyauté envers le seigneur de guerre, nous sommes maintenant en position de nous défaire de l’influence économique chinoise et de prendre notre essor. De cette manière, nous pourrons augmenter nos profits."
 CHI_supreme_leader_of_all_china_desc:0 "Avec la Chine unie sous notre autorité, il est temps. [ROOT.GetLeader] sera déclaré dirigeant suprême et héros de tout le peuple chinois."
 CHI_bribe_chinese_officials:0 "Soudoyer les officiels corrompus du KMT"
 CHI_bribe_chinese_officials_desc:0 "Pour que notre État prospère, nous devons assurer la paix avec le gouvernement national. Pour cela, comme ils sont suffisamment corrompus, nous dépenserons un peu d’argent pour que leurs officiels signent une déclaration garantissant qu’ils ne nous attaqueront pas."
 CHI_allow_civillian_pillaging:0 "Autoriser le pillage des biens civils"
 CHI_allow_civillian_pillaging_desc:0 "Nous permettrons à notre armée de saisir librement des armes et tout ce qu’elle souhaite aux civils, car nous devons garantir une armée forte pour survivre. Ainsi, elle pourra s’autofinancer et s’équiper."
 CHI_seize_assets_for_the_military:0 "Saisir les actifs civils pour l’armée"
 CHI_seize_assets_for_the_military_desc:0 "Nous allons maintenant saisir toutes les industries détenues par des civils afin que notre armée ait une capacité bien plus grande de produire des armes nationales et de faire face aux menaces étrangères."
 CHI_recruit_the_disenfanchised:0 "Recruter les citoyens privés de leurs droits"
 CHI_recruit_the_disenfanchised_desc:0 "De nombreuses personnes ayant été privées de leurs droits en raison de nos récentes actions, nous autoriserons leur recrutement dans notre armée. Ainsi, nous empêcherons un soulèvement de grande ampleur et résoudrons notre manque de main-d’œuvre."
 CHI_a_grand_army_for_the_warlord:0 "Une grande armée pour le seigneur de guerre"
 CHI_a_grand_army_for_the_warlord_desc:0 "Avec la loyauté de l’armée et le recrutement assurés, nous pouvons enfin dire que le seigneur de guerre possède désormais une grande armée, capable de défendre le pays contre les menaces extérieures."
 CHI_contacts_in_the_roc:0 "Contacts dans la République de Chine"
 CHI_contacts_in_the_roc_desc:0 "En préparation de nos ventes de drogues en Chine, nous devons établir des connexions dans tout le pays. Heureusement, nous avons quelques hommes à Nankin, prêts à tout pour une part des profits…"
 CHI_siphon_local_trade:0 "Siphonner le commerce local"
 CHI_siphon_local_trade_desc:0 "Afin d’obtenir les fonds nécessaires pour financer initialement la production de drogues, nous siphonnerons le commerce local et en saisirons une partie pour nous-mêmes, afin d’avoir assez d’argent pour lancer ce projet et sortir notre pays de la misère."
 CHI_begin_drug_production:0 "Commencer la production de drogues"
 CHI_begin_drug_produciton_desc:0 "Les fonds étant sécurisés, nous ferons maintenant le pas et commencerons la production massive de drogues, même si une partie de notre population s’y oppose. Ainsi, nous pourrons résoudre nos problèmes économiques."
 CHI_mass_drug_export:0 "Vente massive de drogues"
 CHI_mass_drug_export_desc:0 "Les drogues étant produites, nous commencerons maintenant à les vendre, au détriment du peuple chinois. Bientôt, de grandes richesses seront à notre portée !"
 CHI_a_concerted_effort_to_the_japanese_sphere:0 "Étendre le commerce vers le nord"
 CHI_a_concerted_effort_to_the_japanese_sphere_desc:0 "Même si nous vendons des drogues, nous ne sommes pas dépourvus de morale. Nous ferons en sorte que le grand ennemi des Japonais subisse autant de dégâts que possible grâce à nos ventes, afin qu’ils aient eux aussi à gérer les problèmes que cela apporte. Ainsi, notre peuple ne sera pas trahi."
 CHI_proliferate_the_chinese_drug_trade:0 "Proliférer le commerce chinois de drogues"
 CHI_proliferate_the_chinese_drug_trade_desc:0 "Avec le commerce de drogues en plein essor en Chine, nous redoublerons d’efforts. L’argent est trop tentant pour le laisser passer et nous mettrons donc le nationalisme de côté un moment…"
 CHI_maintain_the_status_quo:0 "Maintenir le statu quo"
 CHI_maintain_the_status_quo_desc:0 "Avec l’influence du seigneur de guerre croissant lentement, le commerce n’est pas nécessaire. Il n’est pas avantageux de rejoindre le gouvernement national, mais il ne l’est pas non plus de le combattre ; nous jouerons donc sur les deux tableaux et en profiterons."
 CHI_a_coalition_gov_for_national_survival:0 "Un gouvernement de coalition pour la survie nationale"
 CHI_a_coalition_gov_for_national_survival_desc:0 "Avec le Japon à nos portes, nous sommes forcés de trouver des alliés pour collaborer. Nous nous rapprocherons donc du KMT, car ils partagent certains de nos principes idéologiques. Un effet secondaire intéressant, cependant, est que nous pourrions étendre notre influence dans la République de Chine."
 CHI_collapse_the_coalition:0 "Faire s’effondrer la coalition"
 CHI_collapse_the_coalition_desc:0 "Après avoir sauvé la Chine, il est temps d’utiliser nos cellules dans [CHI.GetNameDef] et de tenter de les faire s’effondrer pour prendre le contrôle du pays en ravivant la guerre civile chinoise."
 CHI_march_on_the_cliques:0 "Marcher sur les Cliques"
 CHI_march_on_the_cliques_desc:0 "La Chine est fracturée depuis bien trop longtemps. Ceux qui ne nous ont pas encore rejoints doivent mourir ! Nous éliminerons les seigneurs de guerre restants pour leur insolence !"
 CHI_march_on_nanjing:0 "Marcher sur Nankin"
 CHI_march_on_nanjing_desc:0 "Nankin ayant dirigé l’oppression de la Chine pendant si longtemps, nous allons enfin obtenir notre vengeance ! Nous lancerons une révolution nationale pour réunifier la Chine !"
 CHI_prepare_to_kick_out_the_japanese:0 "Chasser les Japonais"
 CHI_prepare_to_kick_out_the_japanese_desc:0 "Ayant réunifié la Chine proprement dite, nous marcherons maintenant sur la Mandchourie et libérerons la Chine de l’horreur qu’est l’occupation japonaise !"
 CHI_the_great_restoration:0 "La Grande Restauration"
 CHI_the_great_restoration_desc:0 "Nous l’avons fait ! Nous sommes les seuls dirigeants légitimes de la Chine ! Ainsi, nous commencerons l’intégration et la restauration de notre grande nouvelle nation !"
 CHI_autonomy_for_the_fractured_states:0 "Autonomie pour les États fracturés"
 CHI_autonomy_for_the_fractured_states_desc:0 "Une grande partie de la Chine étant sous l’emprise de seigneurs de guerre, nous leur demanderons s’ils souhaitent reconnaître notre gouvernement. Pourquoi ? Parce que nous ne sommes pas seulement les seuls légitimes, mais nous leur promettrons aussi qu’en tant qu’États fédérés, ils conserveront une autonomie totale sur leurs affaires internes et auront le droit de faire ce qu’ils veulent tant qu’ils respectent notre politique étrangère."
 CHI_an_all_chinese_university:0 "Une université pan-chinoise"
 CHI_an_all_chinese_university_desc:0 "Avec nous ayant unifié la Chine, nous ouvrirons une nouvelle université, afin de réparer les dégâts infligés aux sciences chinoises sous le KMT."
 KMT_maintain_military_support:0 "Maintenir le soutien militaire"
 KMT_maintain_military_support_desc:0 "Nous maintiendrons le soutien de l’armée autour de l’ancienne garde, garantissant que Chiang puisse faire ce qu’il veut de la Chine pour le salut du pays."
 KMT_stack_the_high_command_desc:0 "Nous remplirons le Haut Commandement chinois de fidèles, garantissant qu’il nous soit entièrement loyal quoi que nous fassions…"
 KMT_chiangs_word:0 "La Parole de Chiang"
 KMT_chiangs_word_desc:0 "Tous doivent obéir à la Parole de Chiang ! Nous suivrons cet homme jusqu’à la fin de nos jours."
 KMT_the_hardliners:0 "Les Radicaux"
 KMT_the_hardliners_desc:0 "Chiang et sa clique de durs au sein du KMT ont conquis l’électorat grâce à la popularité du Généralissime. Il semble que nous n’ayons finalement pas totalement écarté cet homme."
 KMT_both_commander_in_chief_and_president:0 "À la fois commandant en chef et président"
 KMT_both_commander_in_chief_and_president_desc:0 "Nous ferons de Chiang à la fois le Commandant en chef et le Président de la Chine, lui donnant le pouvoir sur les institutions clés de l’État si jamais quelque chose arrivait au parlement…"
 KMT_back_with_a_veangance:0 "De retour avec vengeance"
 KMT_back_with_a_veangance_desc:0 "Chiang est revenu et il est avide de revanche. Bien que le parti l’ait évincé de son poste de dictateur, il semble qu’un retour à cela soit inévitable…"
 KMT_the_nanjing_incident:0 "L’incident de Nankin"
 KMT_the_nanjing_incident_desc:0 "Nous mettrons en scène un incident autour de Nankin, nous permettant d’imposer des mesures d’urgence pour prendre le contrôle total de l’État et contourner les contrôles législatifs…"
 KMT_dissolve_the_provisional_yuans:0 "Dissoudre les Yuans"
 KMT_dissolve_the_provisional_yuans_desc:0 "Avec notre branche législative provisoire en place, cette entrave sera retirée ! Nous la dissoudrons à cause de notre « crise » et nous assurerons qu’elle ne se réunira de nouveau que le jour de la loi d’habilitation."
 KMT_the_enabling_act:0 "La Loi d’habilitation"
 KMT_the_enabling_act_desc:0 "Nous promulguerons une loi d’habilitation, garantissant notre possession permanente de l’État et la destruction de la démocratie, du moins pour l’instant."
 KMT_declare_martial_law_demo:0 "Déclarer la loi martiale"
 KMT_declare_martial_law_demo_desc:0 "Ayant pris la fonction seule de gouvernement, nous déclarerons la loi martiale, nous permettant d’utiliser l’armée dans les affaires civiles."
 KMT_vanquish_democratic_institutions:0 "Anéantir les institutions démocratiques"
 KMT_vanquish_democratic_institutions_desc:0 "Nous vaincrons la démocratie en Chine, assurant sa défaite. Avec l’armée en place, personne ne pourra nous arrêter."
 KMT_rely_on_military_supremacy:0 "S’appuyer sur la suprématie militaire"
 KMT_rely_on_military_supremacy_desc:0 "Nous nous appuierons sur notre armée, garantissant que personne ne pourra nous évincer. La sédition ne peut être tolérée."
 KMT_use_the_military:0 "Utiliser l’armée"
 KMT_use_the_military_desc:0 "Avec notre armée entre nos mains, nous la déploierons à des positions dans toutes les grandes villes chinoises, afin de commencer à surveiller nos ennemis et traquer ceux qui ont volé notre pouvoir."
 KMT_military_oath_of_loyalty:0 "Serment de loyauté militaire"
 KMT_military_oath_of_loyalty_desc:0 "Avant d’entreprendre nos grandes opérations, nous devons exiger de l’armée un serment de loyauté envers Chiang lui‑même. Cela garantira son obéissance, quelles que soient les circonstances."
 KMT_patrol_the_streets:0 "Patrouiller dans les rues"
 KMT_patrol_the_streets_desc:0 "Nous commencerons à patrouiller publiquement dans les rues, impliquant encore davantage l’armée dans des affaires civiles plutôt que militaires. Cela nous permettra de placer nos dernières pièces pour préparer des arrestations massives de ceux qui nous ont forcé la main."
 KMT_mass_arrests_of_opposition:0 "Arrestations massives de l’opposition"
 KMT_mass_arrests_of_opposition_desc:0 "Nous commencerons à arrêter l’opposition en masse par le biais de notre armée. Certains se plaignent, mais n’est‑ce pas de leur faute d’avoir osé nous opposer en premier lieu ?"
 KMT_exalt_the_army:0 "Exalter l’armée"
 KMT_exalt_the_army_desc:0 "Pour préparer la grande bataille contre le pouvoir législatif, nous exalterons l’armée, garantissant qu’elle se sente honorée par notre régime."
 KMT_retake_field_command:0 "Reprendre le commandement sur le terrain"
 KMT_retake_field_command_desc:0 "Chiang va désormais enfin prendre le commandement personnel de cette nouvelle armée, quittant son poste bureaucratique pour de nouveau se battre pour le bien de la Chine."
 KMT_march_out_against_the_legislative:0 "Marcher contre le pouvoir législatif"
 KMT_march_out_against_the_legislative_desc:0 "Avec tout en place et la première vague d'arrestations et d'exécutions achevée, nous marcherons et mènerons des batailles acharnées contre les derniers bastions d’opposition. Personne ne résistera au règne de Chiang."
 KMT_dictatorship_in_all_but_name:0 "Une dictature qui ne dit pas son nom"
 KMT_dictatorship_in_all_but_name_desc:0 "Chiang est désormais devenu un dictateur sans en porter officiellement le titre. Il est clair qu’il est le véritable visage de la Chine, et nul ne peut lui résister. De plus, ceux qui l’ont trahi ayant été capturés ou tués, il est enfin satisfait."
 KMT_transfer_powers_to_the_assembly:0 "Transférer les pouvoirs à l’Assemblée"
 KMT_transfer_powers_to_the_assembly_desc:0 "L’Assemblée nous soutenant, contrairement à certaines autres branches du gouvernement, nous augmenterons ses pouvoirs, nous permettant de consolider un grand bloc contre notre opposition et d’obtenir vengeance."
 KMT_secure_new_political_allies:0 "Sécuriser de nouveaux alliés politiques"
 KMT_secure_new_political_allies_desc:0 "Nous obtiendrons de nouveaux alliés politiques, ces quelques personnes qui soutiennent Chiang au sein du pouvoir législatif. Ils serviront de base à nos futurs projets."
 KMT_stack_the_legislative:0 "Empiler le pouvoir législatif"
 KMT_stack_the_legislative_desc:0 "Si nous devions un jour lever la loi d’habilitation, nous devrions d’abord utiliser nos nouveaux alliés pour remplir la branche législative de nos partisans, nous permettant de gouverner à travers elle une fois la loi levée."
 KMT_civilian_oath_of_loyalty:0 "Serment civil de loyauté"
 KMT_civilian_oath_of_loyalty_desc:0 "Si nous voulons rester forts après la levée de la loi d’habilitation, nous devons exiger que tous les membres actifs du gouvernement prêtent un serment de loyauté à Chiang ; cela fera officiellement de toute trahison de sa volonté un acte de haute trahison."
 KMT_the_nanjing_investigation_committee:0 "La Commission d’Enquête de Nankin"
 KMT_the_nanjing_investigation_committee_desc:0 "Nous créerons une nouvelle commission pour « enquêter » sur ce qui s’est passé à Nankin. Cela nous permettra d’accuser ceux que nous détestons et ceux qui ont trahi Chiang."
 KMT_frame_the_traitor:0 "Piéger les traîtres"
 KMT_frame_the_traitor_desc:0 "Avec les premiers « résultats » donnés par la CEN, il est clair que nous pouvons enfin arrêter tous ceux qui ont forcé Chiang à céder le pouvoir. Il est temps de réparer cette grande injustice et de nous venger pour lui une fois pour toutes."
 KMT_a_pure_state:0 "Un État pur"
 KMT_a_pure_state_desc:0 "Avec le gouvernement rempli de nos partisans et les traîtres punis, nous avons désormais un État pur, permettant à Chiang de tout contrôler de haut en bas tout en respectant le cadre bureaucratique."
 KMT_democracy_in_name_only:0 "Une démocratie de nom seulement"
 KMT_democracy_in_name_only_desc:0 "Nous lèverons désormais la loi d’habilitation, légitimant notre gouvernement aux yeux du peuple. Toutefois, avec les réformes menées ces derniers mois, nous avons garanti que Chiang régnera toujours et qu’aucune force d’opposition crédible n’existera jamais, donnant l’apparence d’une démocratie mais n’étant en réalité qu’une dictature chiangiste."
 CHI_a_great_unitary_china:0 "Une grande Chine unitaire"
 CHI_a_great_unitary_china_desc:0 "Ayant uni la Chine sous notre botte, il est temps que la Chine entre véritablement dans son âge d’or."
 CHI_there_is_only_one_language_chaing_speaks:0 "Il n’y a qu’une seule langue que Chiang parle"
 CHI_there_is_only_one_language_chaing_speaks_desc: "Nous avons vu les méthodes de Chiang, et il est évident qu’il ne parle qu’une seule langue : celle de la violence ! Nous devons donc le combattre et sauver le pays de lui par la force !"
 CHI_demand_repealing_of_the_unequal_treaties: "Exiger l’abrogation des traités inégaux"
 CHI_demand_repealing_of_the_unequal_treateis_desc:0 "Ayant uni la Chine, nous exigerons maintenant une dernière chose pour renverser complètement les traités inégaux : les alliés doivent céder les ports des traités qu’ils nous ont pris !"
 CHI_integrate_the_warlords_desc:0 "La Chine étant unifiée, il est temps d’envoyer à nos seigneurs de guerre des ultimatums pour se rendre et être intégrés, ou mourir en tentant de résister à l’unification."
 CHI_a_constitutional_monarchy:0 "Une monarchie constitutionnelle"
 CHI_a_constitutional_monarchy_desc:0 "Nous instaurerons une monarchie constitutionnelle, prenant les meilleurs éléments de la monarchie et les fusionnant avec une démocratie solide."
 CHI_consolidate_the_national_unity_government:0 "Consolider le NUG"
 CHI_consolidate_the_national_unity_government_desc:0 "Ayant réussi à combiner différents centres de notre pouvoir, il est temps de consolider notre régime sous le grand seigneur de guerre du socialisme nationaliste."
 CHI_demand_transferance_of_national_power:0 "Exiger le transfert du pouvoir national"
 CHI_demand_transferance_of_national_power_desc:0 "Nous exigerons que [CUG.GetNameDef] se rende à notre régime, devienne l’un de nos gouvernorats et nous cède le manteau de véritable gouvernement chinois."
 CHI_maintain_the_harsh_stance:0 "Maintain the Harsh Stance"
 CHI_maintain_the_harsh_stance_desc:0 "Nous maintiendrons notre position dure contre le communisme et dénoncerons [PRC.GetNameDef] malgré notre alliance temporaire."
 CHI_limited_cooperation:0 "Coopération limitée"
 CHI_limited_cooperation_desc:0 "Nous entamerons une coopération limitée avec [PRC.GetNameDef]. Cela peut aller contre notre idéologie, mais c’est pour le bien de la Chine !"
 CHI_maintain_chinese_infighting:0 "Maintenir les luttes internes chinoises"
 CHI_maintain_chinese_infighting_desc:0 "Nous laisserons les luttes internes continuer à ravager la Chine. Même si nous sommes alliés, cela ne nous empêchera pas de prendre ce que nous voulons."
 CHI_mobilize_against_japan:0 "Mobiliser contre [JAP.GetNameDef]"
 CHI_mobilize_against_japan_desc:0 "Avec la guerre de résistance à nos portes, nous mobiliserons notre armée et nous préparerons à combattre l’agresseur étranger et sauver notre pays !"
 CHI_adopt_chinese_tactics:0 "Adopter la structure de commandement chinoise"
 CHI_adopt_chinese_tactics_desc:0 "Nous adopterons la structure de commandement chinoise dans notre armée. Ainsi, nous serons bien plus efficaces contre les Japonais !"
 CHI_infiltrate_chinese_command_structure:0 "Infiltrer la structure de commandement chinoise"
 CHI_infiltrate_chinese_command_structure_desc:0 "Nous infiltrerons la structure de commandement chinoise. Ainsi, lorsque le front s’effondrera enfin, nous aurons un large avantage sur eux !"
 CHI_allow_communist_cells:0 "Autoriser les cellules communistes"
 CHI_allow_communist_cells_desc:0 "Nous autoriserons les communistes à établir des cellules dans notre pays. Ainsi, nous renforcerons notre capacité à combattre l’ennemi extérieur !"
 CHI_preempt_corruption:0 "Prévenir la corruption"
 CHI_preempt_corruption_desc:0 "Avec la corruption rampant en Chine, nous empêcherons qu’elle ne se propage à notre province modèle. Cela nous permettra de devenir une nation véritablement moderne."
 CHI_demand_workplace_integrity:0 "Exiger l’intégrité au travail"
 CHI_demand_workplace_integrity_desc:0 "Nous exigerons que notre peuple fasse preuve d’intégrité au travail et mettrons en œuvre de nouvelles mesures pour y parvenir !"
 CHI_an_integritable_workforce:0 "Une main-d'œuvre intégrative"
 CHI_an_integritable_workforce_desc:0 "La corruption étant enfin éradiquée, il est devenu évident que notre province dispose d’une main-d’œuvre pleine d’intégrité et prête à vraiment briller !"
 CHI_embrace_corruption:0 "Adopter la corruption"
 CHI_embrace_corruption_desc:0 "Nous adopterons la corruption dans notre État, ce qui nous permettra de profiter de ses fruits et de tirer pleinement parti de notre économie."
 CHI_dabble_in_the_opium_trade:0 "S’essayer au commerce de l’opium"
 CHI_dabble_in_the_opium_trade_desc:0 "Nous allons maintenant nous essayer au commerce de l’opium, car malgré ses effets néfastes sur notre peuple, il y a des millions à gagner !"
 CHI_fully_embrace_the_opium_trade:0 "Adopter pleinement le commerce de l’opium"
 CHI_fully_embrace_the_opium_trade_desc:0 "Le marché étant créé, nous pouvons maintenant adopter pleinement le commerce de l’opium et devenir un gouvernement réellement riche, capable de grandes dépenses !"
 KMT_a_second_purge_of_leftists:0 "Une seconde purge des gauchistes"
 KMT_a_second_purge_of_leftists_desc:0 "Avec les gauchistes ayant maintenant la possibilité de se répandre dans notre parti, nous devons nous en occuper. Le communisme ne doit avoir aucune place dans notre grand pays !"
 CHI_total_mobilization_for_the_emporer:0 "Mobilisation totale pour l’empereur"
 CHI_total_mobilization_for_the_emporer_desc:0 "La Chine étant elle-même en jeu, nous mobiliserons totalement le pays pour garantir sa survie et celle de l’empereur ! Nul ne peut être au-dessus du Grand Empereur, et tous ceux qui essaient doivent mourir !"
 CHI_reach_out_to_nanjing:0 "Tendre la main à Nankin"
 CHI_reach_out_to_nanjing_desc:0 "Nous contacterons Nankin et proposerons de rejoindre le gouvernement du KMT là-bas, à condition qu’ils nous accordent une autonomie régionale et permettent l’activité de la gauche du Kuomintang en Chine."
 CHI_western_victory:0 "Victoire occidentale"
 CHI_western_victory_desc:0 "Nous l’avons fait, l’élection est remportée ! Il est maintenant temps de bâtir un État véritablement prospère pour notre peuple et de travailler à remodeler notre pays à l’image des puissances occidentales !"
 CHI_christian_democracy_desc:0 "Nous travaillerons à répandre le christianisme dans nos terres et à former un État qui apporte le meilleur à son peuple grâce à une gouvernance et des valeurs chrétiennes."
 CHI_modernize_the_armed_forces:0 "Moderniser les forces armées"
 CHI_modernize_the_armed_forces_desc:0 "Nous travaillerons à la modernisation de nos forces armées et créerons une armée véritablement moderne, sur le modèle des pays occidentaux."
 CHI_modern_innovations:0 "Innovations modernes"
 CHI_modern_innovations_desc:0 "Nous travaillerons à mettre en œuvre des innovations modernes dans notre haut commandement militaire et à garantir son efficacité maximale."
 CHI_economic_mobilization:0 "Mobilisation économique"
 CHI_economic_mobilization_desc:0 "Notre armée ayant été modernisée, il est temps de mobiliser l’économie et de travailler à la création d’une grande économie militaire."
 CHI_a_modern_national_army:0 "Une armée nationale moderne"
 CHI_a_modern_national_army_desc:0 "La Chine étant unifiée, nous renforcerons nos normes et réduirons la conscription excessive, en améliorant plutôt la qualité grâce à notre excellent filtrage."
 CHI_begin_the_quest_for_developental_aid:0 "Commencer la quête pour l’aide au développement"
 CHI_begin_the_quest_for_developental_aid_desc:0 "Pour réparer notre économie, nous commencerons à travailler pour obtenir une aide au développement intérieure et extérieure, afin que nous puissions réellement avoir une économie riche pour notre peuple pauvre."
 CHI_core_tenants_of_the_faith:0 "Les principes fondamentaux de la Foi"
 CHI_core_tenants_of_the_faith_desc:0 "Pour arrêter l’hérésie, nous préserverons les principes fondamentaux de la Foi. Nous consacrerons le Credo nicéno-constantinopolitain."
 CHI_a_god_honorig_legal_code:0 "Un code légal honorant Dieu"
 CHI_a_god_honorig_legal_code_desc:0 "Nous créerons un code légal basé sur des principes bibliques afin de créer une société juste et pieuse pour l’amélioration et la sanctification de notre peuple."
 CHI_state_funding_for_religious_schools:0 "Financement public pour les écoles religieuses"
 CHI_state_funding_for_religious_schools_desc:0 "Nous commencerons le soutien légal et le financement des écoles religieuses, car si nous voulons enseigner à nos enfants nos croyances et leur transmettre notre foi, ils doivent avoir le plus haut niveau d’éducation et de connaissances à la fois dans les sciences et dans notre foi."
 CHI_reach_out_to_the_local_elites:0 "Atteindre les élites locales"
 CHI_reach_out_to_the_local_elites_desc:0 "Nous contacterons les élites locales et les persuaderons d’investir dans notre nouvel État afin d’augmenter leurs propres profits à long terme, améliorant ainsi l’état du capitalisme dans notre nation."
 CHI_stabilze_the_economy:0 "Stabiliser l’économie"
 CHI_stabilze_the_economy_desc:0 "Nous en avons eu assez des investissements rapides, il est maintenant temps de stabiliser l’économie et d’assurer sa compétitivité à long terme."
 CHI_import_western_technology:0 "Importer la technologie occidentale"
 CHI_import_western_technology_desc:0 "Nous commencerons à importer la technologie occidentale. Ainsi, nous pourrons nous assurer que nous pouvons rivaliser avec les économies modernes du monde grâce à des produits de haute qualité."
 CHI_abandon_china:0 "Abandonner la Chine"
 CHI_abandon_china_desc:0 "Nous chercherons à abandonner la Chine et à suivre notre propre voie, nous travaillerons à renforcer les islamistes locaux et les séparatistes !"
 CHI_expand_regional_identity:0 "Étendre le séparatisme"
 CHI_expand_regional_identity_desc:0 "Nous commencerons à travailler avec les séparatistes locaux et aiderons à encourager cela et à favoriser une nouvelle identité régionale permettant notre indépendance."
 CHI_begin_the_desinofication_of_root:0 "Commencer la désinofication de [ROOT.GetNameDef]"
 CHI_begin_the_desinofication_of_root_desc:0 "Nous commencerons à travailler vers un nouvel État et œuvrerons à purger l’influence chinoise de notre État afin de nous en libérer."
 CHI_meet_with_the_army:0 "Rencontrer l’armée"
 CHI_meet_with_the_army_desc:0 "Nous rencontrerons l’armée et chercherons à travailler avec elle et à l’amener à soutenir notre séparatisme afin qu’elle puisse nous aider dans notre grande quête !"
 CHI_a_declaration_of_statehood:0 "Une déclaration d’État"
 CHI_a_declaration_of_statehood_desc:0 "Nous déclarerons la création de l’État et changerons notre nom pour représenter notre nouvelle identité séparatiste !"
 CHI_reinvigorate_the_national_economy:0 "Revigorer l’économie nationale"
 CHI_reinvigorate_the_national_economy_desc:0 "Nous travaillerons à revigorer l’économie nationale et à nous assurer que nous pouvons prospérer et développer une grande économie pleine de richesses !"
 CHI_prepare_for_national_unification2:0 "Préparer l’unification nationale"
 CHI_prepare_for_national_unification2_desc:0 "Nous commencerons à travailler à l’unification du Turkestan oriental et à détruire la fausse clique de seigneurs de guerre qui nous résiste !"
 CHI_break_the_kmt_stranglehold:0 "Briser l’emprise du KMT"
 CHI_break_the_kmt_stranglehold_desc:0 "Nous travaillerons jour et nuit pour briser l’emprise du KMT sur notre armée. Les Chiangistes doivent être purgés et la Chine doit être libérée !"
 CHI_arrest_kmt_officials:0 "Arrêter les officiers du KMT"
 CHI_arrest_kmt_officials_desc:0 "Nous travaillerons à arrêter les fonctionnaires du KMT et nous veillerons à ce qu’il n’y ait plus d’influence déstabilisatrice du KMT dans notre structure étatique. Ainsi, bientôt notre clique pourra être libre de toute ingérence chinoise !"
 CHI_arrest_kmt_officers:0 "Arrestation des officiers du KMT"
 CHI_arrest_kmt_officers_desc:0 "Nous arrêterons tous les officiers du KMT dans notre armée ; même si cela peut faire mal temporairement, cela brisera l’emprise que le KMT a sur nos forces armées !"
 CHI_a_new_alternative_form_of_nationalism:0 "Une nouvelle forme alternative de nationalisme"
 CHI_a_new_alternative_form_of_nationalism_desc:0 "Nous retirerons de l’esprit de notre peuple l’idée que nous formons tous une grande nation chinoise. À la place, nous leur offrirons une alternative, en leur donnant une nation régionale à laquelle s’attacher et qu’ils pourront exalter comme notre nouvelle nation."
 CHI_a_cleansing_of_the_new_state:0 "Éradiquer l’influence du KMT"
 CHI_a_cleansing_of_the_new_state_desc:0 "Nous travaillerons à nettoyer entièrement notre État des derniers vestiges du KMT. L’État-nation doit être sécurisé !"
 CHI_enshrine_the_national_savior:0 "Consacrer le Sauveur national"
 CHI_enshrine_the_national_savior_desc:0 "Notre État ayant finalement réglé les problèmes auxquels il faisait face, il est temps d’exalter le Sauveur national et d’aider à consacrer son autorité dans notre grand nouvel État !"
 CHI_british_money:0 "L’argent britannique"
 CHI_british_money_desc:0 "Les Britanniques sont un acteur clé dans notre région et nous les contacterons donc pour demander une aide économique dans notre occidentalisation."
 CHI_french_money:0 "L’argent français"
 CHI_french_money_desc:0 "Les Français sont un acteur clé dans notre région et nous les contacterons donc pour demander une aide économique dans notre occidentalisation."
 CHI_american_money:0 "L’argent américain"
 CHI_american_money_desc:0 "Les Américains sont un acteur clé dans notre région et nous les contacterons donc pour demander une aide économique dans notre occidentalisation."
 CHI_secular_institutions:0 "Institutions laïques"
 CHI_secular_institutions_desc:0 "Nous établirons des institutions laïques sur le modèle des autres États occidentaux afin d’être un État modèle à leur image."
 CHI_empower_the_capitalists:0 "Renforcer les capitalistes"
 CHI_empower_the_capitalists_desc:0 "Nous renforcerons les capitalistes de notre nation et aiderons à travailler avec eux pour exploiter pleinement notre économie afin de créer une région prospère et pleine de richesses !"
 CHI_rewrite_the_constitiution:0 "Une constitution libérale"
 CHI_rewrite_the_constitiution_desc:0 "Nous réécrirons la constitution pour y insérer à la fois des idées occidentales libérales et une politique économique libérale ; même si cela peut surprendre certains, c’est pour le bien supérieur de la nation !"
 CHI_unbridled_capitalism:0 "Capitalisme débridé"
 CHI_unbridled_capitalism_desc:0 "Nous travaillerons à débrider le capitalisme dans notre nation et à nous concentrer sur la maximisation de la production économique de notre grande nation, nous permettant de devenir réellement riches, même si certains travailleurs peuvent se sentir exploités — c’est pour le bien supérieur."
 CHI_further_increase_resource_output:0 "Augmenter davantage la production de ressources"
 CHI_further_increase_resource_output2:0 "Nous travaillerons à augmenter davantage notre production de ressources, même au détriment de notre peuple ; après tout, qui ne peut pas écraser quelques coquilles d’œufs en travaillant pour un but bien plus grand ?"
 CHI_a_new_republic:0 "Une nouvelle république"
 CHI_a_new_republic_desc:0 "Nous déclarerons une nouvelle république, totalement indépendante et en préparation pour reconquérir la Chine et créer un grand État libre !"
 CHI_lobby_for_western_recognition:0 "Faire du lobbying pour la reconnaissance occidentale"
 CHI_lobby_for_western_recognition_desc:0 "Nous contacterons les puissances occidentales et chercherons à obtenir la reconnaissance de notre république afin d’être protégés des attaques extérieures !"
 CHI_seek_recognition_from_the_occident:0 "Chercher la reconnaissance de l’Occident"
 CHI_seek_recognition_from_the_occident_desc:0 "Avec notre nouvelle république chrétienne établie, nous contacterons les anciens alliés chrétiens en Occident et chercherons de l’aide auprès des nations chrétiennes là-bas !"
 CHI_one_china_two_systems:0 "Une Chine, Deux Systèmes"
 CHI_one_china_two_systems_desc:0 "Nous contacterons [CUG.GetNameDef] et leur demanderons de lever leurs revendications sur nous ; à la place, nous coexisterons mutuellement et vivrons en paix."
 CHI_help_the_cim:0 "Aider la CIM"
 CHI_help_the_cim_desc:0 "Nous commencerons à travailler avec la CIM et à faire avancer leur évangélisation de masse, afin que notre pays et notre peuple puissent recevoir la bonne nouvelle de l’Évangile !"
 CHI_lkmt_victory:0 "Victoire du Kuomintang de gauche"
 CHI_lkmt_victory_desc:0 "Bien qu’ils aient été expulsés de la République de Chine, l’aile gauche du Kuomintang a connu une résurgence et a remporté les élections."
 CHI_strengthen_the_radicals:0 "Renforcer les radicaux"
 CHI_strengthen_the_radicals_desc:0 "Avec notre prise de contrôle réussie, nous commencerons à collaborer avec les radicaux du KMT, afin de pouvoir affirmer correctement notre influence vis-à-vis de Nankin."
 CHI_hoist_the_red_flag:0 "Hisser le drapeau rouge"
 CHI_hoist_the_red_flag_desc:0 "Avec les radicaux gagnant toujours plus de part dans le parti, nous leur permettrons davantage d’opérer afin de ne pas mettre en péril notre grande coalition !"
 CHI_empower_party_democracy:0 "Renforcer la démocratie du parti"
 CHI_empower_party_democracy_desc:0 "Nous travaillerons à renforcer les institutions démocratiques de notre parti, afin qu’il s’aligne véritablement sur les trois principes du peuple !"
 CHI_strengthen_the_conservatives:0 "Renforcer les conservateurs"
 CHI_strengthen_the_conservatives_desc:0 "Pour faire du KMT un véritable mouvement de masse, nous commencerons à collaborer avec les conservateurs, même s’ils peuvent avoir certaines allégeances à Nankin."
 CHI_empower_the_military:0 "Renforcer l’armée"
 CHI_empower_the_military_desc:0 "Nous travaillerons à renforcer la NRA afin d’être mieux capables de défendre notre Grande Chine contre les envahisseurs étrangers, qu’ils soient Japonais, Soviétiques ou Britanniques !"
 CHI_the_second_thrid_congress_of_the_kmt:0 "Le deuxième §RTroisième Congrès du KMT§!"
 CHI_the_second_thrid_congress_of_the_kmt_desc:0 "Il n’y a pas eu de congrès légitime du KMT depuis que nous avons été purgés ; nous tiendrons donc maintenant le véritable Troisième Congrès du KMT, nous proclamant seuls successeurs légitimes de Sun Yat-Sen et véritables héritiers de la Révolution Nationale du Kuomintang !"
 CHI_open_domestic_politics:0 "Ouvrir la politique intérieure"
 CHI_open_domestic_politics_desc:0 "Avec notre nouvel État sécurisé, nous travaillerons à ouvrir la politique intérieure, permettant que notre nouvel État soit façonné selon la volonté de notre peuple !"
 CHI_a_turkestani_national_state:0 "Un État national turkestanais"
 CHI_a_turkestani_national_state_desc:0 "Nous travaillerons à nous unir avec nos frères de l’Ouest dans [SOV.GetNameDef], afin de pouvoir établir un grand État national turkestanais !"
 CHI_seize_the_colonial_possessions:0 "Saisir les possessions coloniales"
 CHI_seize_the_colonial_possessions_desc:0 "Nous enverrons aux puissances coloniales des ultimatums pour qu’elles se retirent des États locaux à nous qu’elles ont occupés ! Le Grand État national sera sécurisé !"
