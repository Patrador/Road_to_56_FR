 CHI_warlords.1.t: "La Question du Système"
 CHI_warlords.1.desc: "Avant de rédiger notre constitution, nous devons décider quel type de système notre pays devrait avoir. Nous pourrions en adopter un avec une main directrice forte et permanente du seigneur de guerre, où il est le président de chaque gouvernement, ou nous pourrions en avoir un où les partis seraient pleinement habilités à diriger le parlement comme ils le souhaitent."
 CHI_warlords.2.t: "La Question de la Constitution"
 CHI_warlords.2.desc: "Rédiger une constitution ne s’est pas avéré facile, en fait cela a provoqué de nombreux débats. Beaucoup de gens pensent que la constitution devrait renforcer un exécutif puissant, tandis que d’autres pensent que ces fonctions devraient être laissées à l’État profond. Désormais c’est au seigneur de guerre de choisir."
 CHI_warlords.3.t: "Résultats des Élections"
 CHI_warlords.3.desc: "Nous avons enfin organisé des élections libres. Maintenant que c’est fait, il est temps de voir qui a gagné !"
 CHI_warlords.4.t: "[FROM.GetNameDefCap] Cherche à se Soumettre à Nous."
 CHI_warlords.4.desc: "Il semble que [FROM.GetNameDef] ait peur, car ils ont décidé d’abandonner le plan de fédéralisme pour toute la Chine. À la place, ils ont tendu la main et proposé de se soumettre à nous, tant que nous leur permettons de maintenir les politiques du fédéralisme dans leurs propres terres et gouvernorats. Profitons-nous de cela pour unir la Chine, ou attendons-nous pour combattre et conquérir ces terres afin d’y instaurer une administration directe ?"
 CHI_warlords.5.t: "La guerre de résistance !"
 CHI_warlords.5.desc: "Ce que nous craignions depuis longtemps est arrivé ! Les Japonais, qui s'ingèrent dans notre pays et abusent de notre peuple depuis trop longtemps, ont finalement poussé les choses si loin qu'une guerre a éclaté entre nous. La guerre de résistance a donc éclaté et il est temps de se battre pour notre survie ! Cela soulève toutefois une question. Allons-nous inviter les autres cliques chinoises à se joindre à notre grand combat ?"
 CHI_warlords.6.t: "Une proposition pour sauver la Chine !"
 CHI_warlords.6.desc: "La plus grande catastrophe pour le peuple chinois vient de se produire ! [JAP.GetNameDefCap] a envahi notre pays ! [CUG.GetNameDef] ne semble pas du tout préparé à cette tâche. C'est pourquoi ils ont appelé tous les Chinois à les rejoindre pour repousser les Japonais ! Notre peuple est très favorable à ce grand élan de solidarité pour repousser les envahisseurs et sauver la Chine, mais ce n'est pas forcément dans notre intérêt. Que devons-nous faire à ce sujet ?"
 CHI_warlords.7.t: "Un seigneur de la guerre propose de rejoindre notre République"
 CHI_warlords.7.desc: "[FROM.GetLeader] de [FROM.GetNameDef] a proposé de rejoindre notre grande République, mais il demande à pouvoir contrôler sa clique comme une marionnette quelque peu autonome. Est-ce que nous acceptons cela ?"
 CHI_warlords.8.t: "Contre qui sommes-nous un rempart ?"
 CHI_warlords.8.desc: "Le fait que nous nous soyons déclarés un rempart de défense soulève une question : Contre qui nous défendons-nous ?"
 CHI_warlords.9.t: "Ultimatum de [FROM.GetNameDef]"
 CHI_warlords.9.desc: "[FROM.GetNameDefCap] nous a envoyé un ultimatum pour réclamer diverses terres qu'ils revendiquent. Ils ont déjà commencé à s'emparer de ces terres, la question est de savoir si nous les arrêtons ou si nous nous battons pour conserver nos terres."
 CHI_warlords.10.t: "[FROM.GetNameDefCap] Cherche Protection"
 CHI_warlords.10.desc: "Nous venons de recevoir un envoyé du seigneur de guerre de [FROM.GetName]. Le seigneur de guerre cherche de l’aide contre les menaces de [Jap.GetName] et [PRC.GetName] et une protection contre notre propre régime. Pour cela, il a proposé de se soumettre à notre protection et à notre politique étrangère en échange du maintien de son pouvoir sur sa Clique."
 CHI_warlords.11.t: "[FROM.GetNameDefCap] Corrompt Nos Officiels !"
 CHI_warlords.11.desc: "Nous avons appris que [FROM.GetNameDef] vient de soudoyer nos officiels pour signer un pacte de non-agression avec eux. Bien sûr, cet argent est plutôt agréable, cependant certains questionnent le fait qu’il arrive au détriment de l’unification de notre pays."
 CHI_warlords.12.t: "[FROM.GetNameDefCap] Cherche à Changer d’Alignement"
 CHI_warlords.12.desc: "[FROM.GetNameDef] nous a envoyé une délégation, demandant s’ils auraient une place dans la sphère japonaise, et ils ont annoncé qu’ils s’aligneront avec nous et deviendront plus tard notre sujet, si nous acceptons."
 CHI_warlords.13.t: "[FROM.GetNameDefCap] Demande des Armes Supplémentaires"
 CHI_warlords.13.desc: "[FROM.GetNameDefCap] a demandé des armes supplémentaires afin d’aider à unir la Chine sous leur bannière. Combien, si tant est qu’on en envoie, leur donnons-nous ?"
 CHI_warlords.14.t: "Le Congrès d'unité nationale"
 CHI_warlords.14.desc: "Le Congrès d'unité nationale s'est réuni et a donné lieu à de grandes discussions. Les révolutionnaires nationalistes sont venus réclamer un grand État chinois sous la garde du chef de guerre, ainsi qu'une ligue de régénération nationale chargée de purger le pays de la corruption et de l'influence étrangère. De l'autre côté, les nationalistes impérialistes ont exigé que le seigneur de la guerre prenne le manteau du mandat du ciel et déclare un nouvel empire chinois !"
 CHI_warlords.15.t: "Le rapport du Conseil de régence"
 CHI_warlords.15.desc: "Le conseil de régence s'est réuni et a réfléchi au sort de la monarchie en Chine. Ils ont décidé de faire du seigneur de la guerre l'empereur de toute la Chine !"
 CHI_warlords.16.t: "Une Demande de [FROM.GetNameDef]"
 CHI_warlords.16.desc: "Un envoyé de [FROM.GetNameDef] vient d’arriver ici avec une demande. Il a demandé que nous retirions notre soutien à [CHI.GetNameDef] et que nous les soutenions eux à la place. Acceptons-nous ?"
 CHI_warlords.17.t: "Une demande du peuple Hui"
 CHI_warlords.17.desc: "Un envoyé du peuple musulman Hui de [FROM.GetNameDef] nous a contactés et nous a proposé un marché. Ils nous ont demandé de les aider à unifier les régions islamiques de Chine et nous ont proposé de devenir leur protectorat."
 CHI_warlords.18.t: "La coalition pour la survie nationale"
 CHI_warlords.18.desc: "[FROM.GetNameDefCap] nous a contactés pour nous proposer de se soumettre et de nous rejoindre au sein d'un gouvernement de coalition. Leur raisonnement est qu'il s'agit d'une nécessité pour la survie de la Chine, car les Japonais s'apprêtent à s'en prendre à nous. Toutefois, selon certains pessimistes au sein de notre armée, on suppose qu'ils seront loyaux tant que la Chine sera directement menacée par le Japon ou d'autres envahisseurs, mais qu'ils pourraient bien nous trahir..."
 CHI_warlords.19.t: "[FROM.GetNameDefCap] a Refusé Notre Offre"
 CHI_warlords.19.desc: "Notre envoyé vers [FROM.GetNameDef] est revenu avec de terribles nouvelles. Le gouvernement de [FROMGetNameDef] a refusé notre offre."
 CHI_warlords.20.t: "[FROM.GetNameDefCap] a Accepté Notre Offre"
 CHI_warlords.20.desc: "Notre envoyé vers [FROM.GetNameDef] est revenu avec d’excellentes nouvelles. Le gouvernement de [FROMGetNameDef] a accepté notre offre."
 CHI_warlords.21.t: "[JAP.GetNameDefCap] a Répondu à Notre Demande"
 CHI_warlords.21.desc: "Notre envoyé vers [JAP.GetNameDef] est revenu avec des nouvelles de l’armée japonaise. Ils ont pris une décision et ont annoncé combien d’armes ils nous ont envoyées !"
 CHI_warlords.22.t: "Trahison !"
 CHI_warlords.22.desc: "La menace directe contre nous étant terminée, [FROM.GetNameDef] nous a trahis ! Ils ont, en préparation pour rallumer la guerre civile chinoise, appelé nos garnisons et un quart d’entre elles les ont rejoints, les renforçant drastiquement lors de la guerre civile désormais inévitable."
 CHI_warlords.23.t: "L’Armée se Révolte !"
 CHI_warlords.23.desc: "Notre pire cauchemar est arrivé ! Notre plan de dépendre de l’armée a échoué, car un quart de nos troupes aussi ont fait défection vers l’ennemi ! Il sera bientôt trop tard pour sauver la Chine !"
 CHI_warlords.24.t: "[FROM.GetNameDefCap] nous a envoyé une offre"
 CHI_warlords.24.desc: "[FROM.GetNameDefCap] nous a envoyé une offre. Ils affirment que plusieurs grandes puissances tentent de nous envahir. Ils proposent qu’en échange de notre reconnaissance de leur autorité comme gouvernement national, ils nous intégreront comme un État fédéré et nous accorderont tous les droits associés. Cela nous permettra de conserver toutes nos politiques internes locales, tant que nous restons sous leur protection."
 CHI_warlords.25.t: "[FROM.GetNameDefCap] nous a envoyé un ultimatum"
 CHI_warlords.25.desc: "[FROM.GetNameDefCap] nous a envoyé un ultimatum. Ils pointent du doigt, selon eux, l’occupation injuste des ports chinois sous traité et exigent que nous nous retirions de Chine, immédiatement."
 CHI_warlords.26.t: "[FROM.GetNameDefCap] nous a envoyé une proposition"
 CHI_warlords.26.desc: "[FROM.GetNameDefCap] a remarqué quelque chose. Beaucoup peut être accompli si les bonnes personnes reçoivent du pouvoir. Ils ont donc offert à [ROOT.GetLeader], s’il se soumet à eux, une grande sphère d’influence autour de [ROOT.capital.GetCapitalVictoryPointName] et des droits complets sur ses propres politiques internes."
 CHI_warlords.27.t: "[FROM.GetNameDefCap] exige l’intégration finale"
 CHI_warlords.27.desc: "Avec la Chine unifiée, [FROM.GetNameDef] a décidé qu’il est temps d’unir totalement la Chine ; ainsi, ils exigent que nous, leur gouvernorat, soyons intégrés à eux. Que répondons-nous ?"
 CHI_warlords.28.t: "[FROM.GetNameDefCap] demande la paix"
 CHI_warlords.28.desc: "Des envoyés de [FROM.GetNameDef] ont contacté nos officiers militaires à leur frontière pour demander la paix et nous offrir un accès total à leurs terres. Cela faciliterait grandement le ravitaillement de notre armée, mais serait désavantageux à long terme pour la conquête de toute la Chine. Que devons-nous faire ?"
 CHI_warlords.28.a:0 "Petit à petit, le Front uni s’effondre !"
 CHI_warlords.28.b:0 "Nous ne montrerons aucune pitié aux lâches !"
 CHI_warlords.29.t: "[FROM.GetNameDefCap] demande la suppression des communistes"
 CHI_warlords.29.desc: "Des envoyés de [FROM.GetNameDef] sont venus nous voir et ont souligné les méfaits du communisme. Ils demandent donc l’expulsion de [PRC.GetNameDef] de notre alliance."
 CHI_warlords.29.a:0 "Ils ont raison, nous devons le faire"
 CHI_warlords.29.b:0 "Le Front uni doit tenir !"
 CHI_warlords.30.t: "Le Congrès pour la survie du peuple"
 CHI_warlords.30.desc: "Confucéens, chrétiens et de nombreux autres intellectuels se sont rassemblés en réaction à nos trois puretés et ont conclu que nous sommes mauvais et que nous abusons d’eux ; ils se sont donc unis pour nous résister et lutter pour leur survie."
 CHI_warlords.30.a:0 "Ils attirent sur eux notre colère et ont choisi leur propre destin..."
 CHI_warlords.31.t: "Le sort des terres envahies"
 CHI_warlords.31.desc: "Nous avons enfin repris certaines terres qui ont longtemps été envahies par des peuples étrangers, Russes, Mandchous, Mongols, etc. Cela pose la question : que faisons-nous de ces sous-humains répugnants ?"
 CHI_warlords.31.a:0 "Nous établirons des États séparés avec des droits spéciaux pour le peuple chinois !"
 CHI_warlords.31.b:0 "Ces terres chinoises doivent être purgées de toute influence étrangère !"
 CHI_warlords.32.t: "Une proposition de [FROM.GetNameDef]"
 CHI_warlords.32.desc: "[FROM.GetNameDefCap] s’est, ces dernières années, progressivement détaché du reste de la Chine ; ils viennent donc nous faire une offre, déclarant qu’ils reconnaîtront notre gouvernement si nous reconnaissons le leur, acceptant un principe de « Une Chine, deux systèmes »."
 CHI_warlords.32.b:0 "Cela semble raisonnable, il n’y a aucune raison de chercher le conflit."
 CHI_warlords.32.a:0 "Nous unirons la Chine quoi qu’il arrive !"
 CHI_warlords.33.t: "[FROM.GetNameDefCap] recherche des garanties"
 CHI_warlords.33.desc: "[FROM.GetNameDefCap] est devenu ces dernières années un État occidental moderne suivant nos idéaux. Ils demandent nos garanties pour protéger leur mode de vie, acceptons-nous ?"
 CHI_warlords.33.a:0 "Nous n’avons aucune raison de nous engager ainsi"
 CHI_warlords.33.b:0 "Bien sûr que nous protégerons nos amis !"
 CHI_warlords.34.t: "[FROM.GetNameDefCap] cherche notre soutien"
 CHI_warlords.34.desc: "[FROM.GetNameDefCap] a récemment connu une révolution menée par le Kuomintang de gauche et, dans leur lutte pour la révolution nationale, ils ont sollicité notre soutien. Que disons-nous ?"
 CHI_warlords.34.a:0 "Nous n’avons aucune raison de nous engager ainsi"
 CHI_warlords.34.b:0 "Coopérer avec davantage de révolutionnaires en Chine ? Bien sûr !"
 CHI_warlords.35.t: "[FROM.GetNameDefCap] cherche la reconnaissance"
 CHI_warlords.35.desc: "[FROM.GetNameDefCap], après avoir obtenu notre soutien, demande désormais que nous les reconnaissions officiellement comme gouvernement légitime de la Chine et que nous cessions notre soutien à [PRC.GetNameDef]"
 CHI_warlords.35.a:0 "[PRC.GetNameDefCap] a toujours notre confiance !"
 CHI_warlords.35.b:0 "[FROM.GetNameDefCap] est évidemment le gouvernement légitime de la Chine !"
 CHI_warlords.36.t: "[FROM.GetNameDefCap] propose un ultimatum conjoint à [PRC.GetNameDef]"
 CHI_warlords.36.desc: "[FROM.GetNameDefCap] propose que nous adressions, comme le PRC dépend de nous, un ultimatum afin qu’ils rejoignent [FROM.GetNameDef]. Cela renforcerait grandement notre gouvernement soutenu en Chine, mais nous engagerait un peu plus dans le conflit."
 CHI_warlords.36.a:0 "Nous n’avons aucune raison de nous engager ainsi"
 CHI_warlords.36.b:0 "Envoyer les papiers"
 CHI_warlords.37.t: "[FROM.GetNameDefCap] et [FROM.FROM.GetNameDef] nous ont envoyé un ultimatum..."
 CHI_warlords.37.desc: "Ces deux puissances se sont unies et exigent que nous nous plions au gouvernement soutenu par les Soviétiques à [FROM.FROM.GetNameDef]. Nous dépendons de l’Union soviétique et ne sommes pas en position de refuser, mais certains veulent encore combattre ces nationalistes."
 CHI_warlords.37.a:0 "Nous nous battrons jusqu’au dernier souffle !"
 CHI_warlords.37.b:0 "Nous sommes condamnés de toute façon et autant sauver nos vies..."
 CHI_warlords.38.t: "[FROM.GetNameDefCap] demande des armes"
 CHI_warlords.38.desc: "[FROM.GetNameDefCap] a demandé des armes pour aider à unir la Chine sous leur bannière. Combien, si tant est que nous envoyions quelque chose, leur envoyons-nous ?"
 CHI_warlords.38.a:0 "Nous leur enverrons 4000 fusils"
 CHI_warlords.38.b:0 "Nous leur enverrons 1500 fusils"
 CHI_warlords.38.c:0 "Nous ne pouvons rien leur envoyer"
 CHI_warlords.39.t: "[SOV.GetNameDefCap] a répondu à notre demande"
 CHI_warlords.39.desc: "Notre envoyé auprès de [SOV.GetNameDef] est revenu avec des nouvelles de l’armée soviétique. Ils sont arrivés à une conclusion et ont annoncé combien d’armes ils nous ont envoyées !"
 CHI_warlords.40.t: "[FROM.GetNameDefCap] nous invite à la seconde coalition anti-Chiang"
 CHI_warlords.40.desc: "[FROM.GetNameDefCap] a reforgé la coalition anti-Chiang ! Ils nous invitent maintenant à les rejoindre et demandent notre soutien pour renverser le dictateur de pacotille ! Que disons-nous ?"
 CHI_warlords.40.a:0 "Mais bien sûr !"
 CHI_warlords.40.b:0 "Ce n’est qu’un stratagème pour étendre leur propre influence !"
 CHI_warlords.41.t: "[FROM.GetNameDefCap] a déclaré un gouvernement national"
 CHI_warlords.41.desc: "[FROM.GetNameDefCap] nous a menés avec succès dans la Coalition anti-Chiang alors que le KMT s’effondre à Nankin. Cependant, ils ont utilisé cette opportunité pour déclarer un Gouvernement National et exigent maintenant notre obéissance et notre soumission dans leur tentative de consolider leur contrôle sur le pays ; pourtant, ils nous promettent une autonomie interne sur toute notre politique intérieure… Que répondons-nous à une telle offre ?"
 CHI_warlords.42.t: "Notre place dans le Front uni"
 CHI_warlords.42.desc: "Le Front uni chinois ayant rempli son rôle et devenu obsolète, il est désormais temps de déterminer notre sort au sein de celui-ci, car [CUG.GetNameDefCap] le domine de plus en plus, au point que nous sommes de plus en plus attirés dans leur sphère d'influence."
 CHI_warlords.42.a: "Notre rôle est d'être avec et sous la domination chinoise."
 CHI_warlords.42.b: "Nous devons forger notre propre destin !"
 CHI_warlords.43.t: "[FROM.GetNameDefCap] rejoint le front"
 CHI_warlords.43.desc: "[FROM.GetNameDefCap] partage notre amour pour la Chine et a rejoint le front uni, une grande avancée !"
 CHI_warlords.43.a: "Pour le meilleur ou pour le pire, nous sommes camarades désormais."
