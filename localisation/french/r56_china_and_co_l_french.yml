 MAN_bandits_tooltip_tt: "Le pourcentage de l’armée loyale à Puyi £GFX_in_combat est supérieur à §G30%§!"
 MAN_rule_by_decree_desc: "Puyi continuera simplement à gouverner par décret, lui permettant d’exercer un pouvoir quasi dictatorial sur la nation sous l’autorité de l’Empereur."
 MAN_mongol_dominion_3:0 "Domination mongole"
 MAN_mongol_dominion_3_desc:0 "Le règne de [MEN.GetLeader] est opportuniste au mieux et traître au pire, l'État mongol intérieur a dépassé son objectif et il doit être intégré au [MAN.GetName]."
 KMT_beijing_2_tt: "Les §8Chemises bleues§! ont 30 % de popularité."
 KMT_beijing_3_tt: "§YDai Li§! n’a pas été apaisé avec un poste au §YCBIS§!."
 KMT_crackdown_on_capitalist_desc:0 "Le CBIS réprime toute la criminalité dans notre pays, capturant et emprisonnant les malfaiteurs, leurs pots‑de‑vin n’y changeront rien !"
 KMT_prepare_national_liberation_desc: "Le régime étant stabilisé, il est temps de préparer la libération de la Mandchourie et de chercher à libérer le peuple là-bas des Japonais ! Pour cela, nous enverrons ceux qu’ils appellent des « bandits » afin de saper le pouvoir japonais et de combattre pour la liberté."
 CHI_society_as_allah_ordained_it_desc:0 "Nous l’avons enfin fait ! Notre société a été fondée selon la volonté d’Allah et conformément au Coran ! Gloire à Allah et au Calife !"
 CHI_take_direct_control_over_the_failed_warlords: "Prendre le contrôle direct des seigneurs de guerre défaillants"
 KMT_no_true_enemy_flag: "a accepté une unité temporaire avec §Y[PRC.GetNameDef]§! durant l’incident de Xi’an"
 KMT_beacon_of_democracy_puppet: "Phare de la démocratie"
 KMT_beacon_of_authoritarianism: "Phare de l’autoritarisme"
 KMT_align_the_kmt_puppet: "S’aligner sur les restes du KMT"
 CHI_event_options_matter_2: "§RCette option empêchera le §YKuomintang de gauche§! d’accéder un jour au pouvoir…§!"
 KMT_event.81.t: "[FROM.GetNameDefCap] exige le contrôle total du Quartier général de la suppression des bandits"
 KMT_event.81.desc: "[FROM.GetNameDefCap] a exigé, estimant que nous avons trop flirté avec les communistes et que notre proximité diplomatique avec eux est inacceptable. À ce titre, ils demandent que nous réintégrions le gouvernement central et que nous les laissions nous diriger contre l’insurrection."
 KMT_event.81.a: "Bien sûr, nous sommes après tout des membres loyaux de l’ANR !"
 KMT_event.81.b: "Faire cela condamnerait la Chine !"
 KMT_event.81.c: "Zhang Xueliang et ses fidèles changent de camp !"
 KMT_event.82.t: "Chaos à Xi’an"
 KMT_event.82.desc: "Le chaos a frappé Xi’an alors que Zhang Xueliang et la moitié de l’armée du Nord-Est ont fait défection au profit de [PRC.GetNameDef]. À la suite de cela, l’armée du Nord-Ouest a sécurisé Xi’an elle-même, tandis que Xueliang et les communistes ont pris le contrôle de la campagne environnante…"
 KMT_event.82.a: "La Chine est à nouveau en flammes…"
 KMT_event.83.t: "[FROM.GetNameDefCap] s’empare du contrôle de Shimen"
 KMT_event.83.desc: "[FROM.GetNameDefCap] a décidé que nous étions trop proches des Japonais et que Pékin était trop vulnérable. Ils ont donc pénétré sur notre territoire et progressent rapidement pour s’emparer de Pékin. Dans le même temps, ils ont réussi à rallier de larges portions de notre armée au gouvernement central, affaiblissant drastiquement notre position…"
 KMT_event.83.b: "Pékin restera sous notre contrôle !"
 KMT_event.83.c: "Nous n’avons d’autre choix que de battre en retraite et de faire appel à l’armée du Kwantung"
 KMT_event.84.t: "Chaos à Pékin"
 KMT_event.84.desc: "Le chaos a éclaté alors que l’armée du Kwantung étend une fois de plus sa sphère d’influence dans le nord de la Chine. Tandis que Pékin était prise par l’ANR, les restes de la garnison du Hebei-Chahar ont rejoint l’armée du Kwantung sous la promesse que Pékin et Shimen seraient ultérieurement restituées… Désormais, les sphères d’influence du gouvernement central et du Japon se sont toutes deux étendues, et les tensions explosent…"
 KMT_event.84.a: "La Chine est à nouveau en flammes…"
 KMT_event.85.t: "Song résiste !"
 KMT_event.85.desc: "Alors que notre armée a sécurisé Shimen et poursuit sa progression vers le nord, la garnison de Pékin nous a refusé l’entrée dans la ville et Song a refusé de se soumettre à notre autorité… Nous sommes désormais en état de guerre ouverte avec ce traître !"
 KMT_event.85.a: "Mort aux traîtres !"
 KMT_event.86.t: "[FROM.GetNameDefCap] exige un droit de passage pour ses troupes"
 KMT_event.86.a: "Pourtant, cela en vaut la peine."
 KMT_event.86.b: "L’autonomie n’est pas négociable."
 KMT_event.87.t: "[FROM.GetNameDefCap] exige notre soumission"
 KMT_event.87.desc: "À la suite de l’incident du Liangguang, notre loyauté a été fortement remise en question par la haute direction du KMT ; en conséquence, ils exigent désormais une soumission totale au gouvernement central."
 KMT_event.87.a: "C’est notre devoir."
 KMT_event.87.b: "Nous ne nous soumettrons pas à Chiang !"
 KMT_event.90.t: "Le gouvernement central se prépare à intégrer les cliques"
 KMT_event.90.desc: "Le gouvernement central a décidé d’utiliser notre alliance pour commencer à centraliser la nation. Nous devons rester vigilants si nous ne voulons pas tomber sous leur influence…"
 KMT_event.90.a: "Soyons rusés comme des serpents et doux comme des colombes…"
 KMT_event.91.t: "Le gouvernement central intensifie les efforts d’intégration"
 KMT_event.91.desc: "Le gouvernement central a décidé de sévir contre notre clique et a commencé à nous intégrer davantage, érodant lentement notre pouvoir…"
 KMT_event.91.a: "Vers une Chine unie !"
 KMT_event.91.b: "C’est inacceptable !"
 KMT_event.91.c: "Toute la Chine doit se rallier contre cette folie !"
 KMT_event.92.t: "[FROM.GetNameDefCap] nous appelle à prendre les armes contre Nankin !"
 KMT_event.92.desc: "Après que le gouvernement central a commencé à réprimer nos cliques, [FROM.GetNameDef] a décidé d’y mettre fin ; ils ont donc déclaré une révolte et appelé tous les seigneurs de guerre à les rejoindre en solidarité !"
 KMT_event.92.a: "À bas ces traîtres !"
 KMT_event.92.b: "À bas Nankin !"
 KMT_event.93.t: "[FROM.GetNameDefCap] demande notre intervention contre les communistes"
 KMT_event.93.desc: "La guerre contre [PRC.GetNameDef] ayant commencé, le gouvernement nationaliste a décidé de nous offrir le bassin de Yan’an en échange de notre intervention, ce qui nous permettrait d’encercler les communistes pour leur compte."
 KMT_event.93.a: "Pas après la guerre des plaines centrales."
 KMT_event.93.b: "Influence renouvelée ? Glorieux !"
 KMT_event.94.t: "L’armée du Kwantung se prépare à la guerre !"
 KMT_event.94.desc: "Les récents développements en Chine, rapprochant l’ANR et l’armée du Kwantung de leurs sphères d’influence respectives, laissent penser que l’armée du Kwantung se prépare à sa propre guerre contre la Chine, malgré le veto de l’Empereur."
 KMT_event.94.a: "Cela n’augure rien de bon…"
 KMT_event_90_tt: "§RMaintenir £faction_initiative_texticon §Y5 %§! §Ret§! £pol_power §Y50§! pour pouvoir éviter la subjugation.§!"
 KMT_further_integration_tt: "§R§Y[FROM.GetNameDefCap]§! pourrait tenter de se révolter contre notre intégration de leur pays…§!"
 KMT_SHX_deal_tt: "Le bassin de Yan’an sera transféré à §Y[SHX.GetNameDefCap]§! à la conclusion de la guerre."
 KMT_further_integration_trigger_tt: "Ne combat pas dans une guerre défensive aux côtés de §Y[FROM.GetNameDef]§!"
 KMT_no_true_enemy_flag_tt: "§RAccepter ces termes entraînera le blocage de §YContrôler directement le QG de répression des bandits§!, §YPurger la zone de base de Yan’an§! et §YPlus jamais un autre Liangguang§! jusqu’à ce que §Y[JAP.GetNameDef]§! et ses sujets aient été chassés de Chine…§!"
