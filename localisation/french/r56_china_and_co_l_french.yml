 CHI_industrial_evacuations_from_FROM_2: "Evacuate Industry from [FROM.GetName]"
 r56_chinese_gui_guangzhou: "Home of the §YGuangdong Clique§! and brithplace of the §2Kuomintang§!, §YGuangzhou§! has become a linchpin of our industry, especially through it's rapid modernization under §YChen Jitang§!, now even home to a largescale §gMilitary Industrial Organization§!"
 r56_chinese_gui_nanning: "Home of the §YGuangxi Clique§!, §YNanning§! has become a linchpin of our industry, especially through it's rapid modernization and militarization under §YLi Zongren§!, now even home to a largescale §gMilitary Industrial Organization§!, in order to fufill this militant city's reputation..."
 r56_chinese_gui_shaoguan: "While §YShaoguan§! is not the most populous or industrial part of §Y[CHI.GetNameDef]§!, it has still brought forth the §YShaoguan Aircraft Manufacturing Factory§! and thus become key part of our national industry."
 r56_chinese_gui_kunming: "Center and Capital of the §YYunnan Clique§! and §YProvince§!, §YKunming§! has become a powerhouse, providing it's so-called 'Kings' with some of the best equipped armies in all of §YChina§!, as such it is no wonder that §YKunming§! holds §gMilitary Industrial Organizations§!, capable of arming it's defenders."
 r56_chinese_gui_chongqing: "Captial of §YLiu Xiang§!'s §YSichuan Clique§! and long since a key cultural focal point for the Chinese, §YChongqing§! stands unbowed, despite having been ravished by famine and droughts in recent years. Seeing this resiliance, it is evident that the placment of a §gMilitary Industial Organization§! into this stronghold is only logical."
 r56_chinese_gui_chengdu: "Captial of §YSichuan Province§! and giving everything in the fight against foreign invaders, despite myriad internal woes, §YChengdu§! sends out wave after wave of soldiers, despite having been ravished by famine and droughts in recent years. Seeing this prowess, it is evident that the placment of a §gMilitary Industial Organization§! into this great city is only logical."
 r56_chinese_gui_changsha: "Capital of §YHunan Province§!, §YChangsha§! saw the beginning of the end of the warlord era, being the center of the key province in the §2KMT§!'s Northern Expedition. Later again, it demonstrated it's pro-government militarism by mobilizing militia after militia to drive out the §tCCP§!. Now §YChangsha§! once again bears this honor, this time by being the location of a critical §gMilitary Industrial Organization§!"
 r56_chinese_gui_nanchang: "Capital of §YJiangxi Province§!, §YNanchang§! is a bastion of the National Industry, bearing many a §gMilitary Industrial Organization§! This significance has only been increased due to the fact that §YNanchang§! has become the key to controlling transportation lines in Southern China and massive traffic passes through this city."
 r56_chinese_gui_shanghai: "Arguably §YChina's§! gateway to the world, §YShanghai§! is the crossroad between the §YShanghai International Settlement§! and it's western influence and the Han Chinese High Culture. The massive metropolis has hence grown prosperous and wealthy, and carries the Chinese economy. As such, who is surprised that it contains the largest amount of our §gMilitary Industrial Organizations§!?"
 r56_chinese_gui_wuhan: "Once Capital of §YWang Jingwei§!'s §tLKMT§! aligned government, §YWuhan§! is a force to be reckoned with, both politically and industrially. With such great influence, it is clear that the city has been quite attractive to many a §gMilitary Industrial Organization§!"
 r56_chinese_gui_nanjing: "Capital of the §2Kuomintang§!'s §YRepublic of China§!, Nanjing has in recent years become the focal point of all §YChina§!. Thus it is the center of both the State Apparatus, Industrial Reform, and §YChiang Kai-Shek§!'s §YNational Revolutionary Army§!. With this all playing together there is no better place for a §gMilitary Industrial Organization§! to set itself up, and they all know it."
 r56_chinese_gui_taiyuan: "Center and Capital of §YYan Xishan§!'s mighty §YShanxi Clique§!, §YTaiyuan§! has been a beacon of stability in §YChina§! during the past years. While he did have a spat or two with §YChiang Kai-shek§!, up till then §YYan Xishan§! and his clique swiftly modernized and built up, most notably in their capital. As such the city is a mighty fortress and will be hard for any foreign power to take. With this basis, it is the perfect location for the §gMilitary Industrial Organization§! that is located inside of it."
 r56_chinese_gui_xian: "According to some the birthplace of §YChinese§! civilization, §YXian§! is now one of the westernmost major cities in §YChina§!. As such, due to the wars ravishing the nation, it is no surprise that certain §gMilitary Industrial Organizations§! have evacuated to this symbolic location."
 r56_chinese_gui_jinan: "Capital of the §YShandong Clique§!, the great city of §YJinan§! is an interesting place. Recently dragged into chaos and disrepair by §YZhang Zongchang§! and his abysmal rule, the city has now been built up by §YHan Fuju§! and his new regime. With this fresh development, §YJinan§! has become the new location of many a §gMilitary Industrial Organization§!"
 r56_chinese_gui_beijing: "Known as either §YBeijing§! or §YBeiping§! by the §2KMT§!, this city is one of the most important cities in §YChina§!. Especially as this city was the capital of §YChina§! under many a imperial dynasty and under the §YBeiyang Government§!, no one will deny this. As such, it has become a hub of industry despite some more chaotic development in the last years and now it, too holds certain §gMilitary Industrial Organizations§!."
 r56_chinese_gui_dalian: "Home of the §YDalian Shipyard§!, and also known as §YPort Arthur§!, the seaside city of §YDalian§! has maintained significant influence in §YManchuria§!, both under §YChinese§!, §YRussian§! and §YJapanese§! rule, serving as a major port and shipbuilding facility, thus forging this special §gMilitary Industrial Organization§!"
 r56_chinese_gui_hinggan: "A major city in §YInner Mongolia§!, and on the northern frontier, §YHinggan§! has always needed a strong defense to prevent border raids, as such it has developed its local §YLiaoning Arsenal§! and thus now has its own local §gMilitary Industrial Organization§!"
 r56_chinese_gui_mukden: "Capital of the §YFengtian Clique§! and §YFengtian Province§!, §YMukden§! has become a linchpin of §YChinese§! industry, especially after massive §YJapanese§! investment. As such the city's arsenals have made it the ideal ground for the location of §gMilitary Industrial Organizations§!."
 r56_chinese_gui_hsinking: "The Capital of §Ythe Empire of Manchuria§!, §YHsingking§! has become the key to §YJapanese§! investment, causing a swift development of its industries. As such quite a few §gMilitary Industrial Organizations§! have been relocated to this city."
 r56_chinese_gui_harbin: "Capital of §YHeilongjiang Province§!, the city of §YHarbin§! has is the northernmost chinese metropolis, as such, in the face of any southern invasion, it is the ideal place for our §gMilitary Industrial Organizations§! to be located."
