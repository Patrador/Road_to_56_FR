 KMT_chinese_eco_cat_desc: "The Economy of §Y[ROOT.GetNameDef]§! is volatile and vulnerable despite having had massive growth over the past few years. It must be managed carefully if §Y[ROOT.GetNameDef]§! is to thrive and prosper...\n\nThe first thing we must keep an eye on is foreign §Ginvestment§! into our country. This has been one of the key factors pushing the KMT forward in the Nanjing Decade and if managed properly will contribute greatly to improving our economic standing. Of course should we rely too much on it, it could have painful consequences should §Ginvestment§! cease...\nAs such it will be a good idea to keep watch upon our income and our ability to fund various §YProjects§!.\n\nMonthly §Gincome§!:\n from Domestic §Ginvestment§!: [?KMT_eco_chi_inv] §GFunds§!\n from §Y[USA.GetAdjective]§! §Ginvestment§!: [?KMT_eco_usa] §GFunds§!\n from §Y[ENG.GetAdjective]§! §Ginvestment§!: [?KMT_eco_eng] §GFunds§!\n from §Y[SOV.GetAdjective]§! §Ginvestment§!: [?KMT_eco_sov] §GFunds§!\n from §Y[FRA.GetAdjective]§! §Ginvestment§!: [?KMT_eco_fra] §GFunds§!\n from §Y[GER.GetAdjective]§! §Ginvestment§!: [?KMT_eco_ger] §GFunds§!\n from §Y[JAP.GetAdjective]§! §Ginvestment§!: [?KMT_eco_jap] §GFunds§!\n from §Y[ITA.GetAdjective]§! §Ginvestment§!: [?KMT_eco_ita] §GFunds§!\n\nTotal Stockpile of §GFunds§!: [?KMT_eco_total]\n\nFurthermore we must note that our currency is fully controlled by the party, which has the advantage of allowing us to use it and print it as we please, however should we go overboard with this, it could have devastating consequences, with §Rinflation§! skyrocketing and our economy collapsing...\n\nCurrent effects from §Rinflation§!: (Updates Monthly)\n Consumer Goods Factories factor: §Y[?KMT_eco_cons_visual]%§! [KMT_hyperinflation_scripted]"
 KMT_hyperinflation_scripted_no: "\n\nShould §Rinflation§! ever surpass §Y100%§!, further penalties will be added..."
 KMT_hyperinflation_scripted_yes: "\n\nAs §Rinflation§! has surpassed §Y100%§!, we have entered into a state of §thyperinflation§!:\nCurrent effects from §thyperinflation§!: (based on the effect from §Rinflation§!)\n Stability: §R[?KMT_eco_hyperinflation_var_visual]%§!\n Factory Output: §R[?KMT_eco_hyperinflation_var_visual]%§!\n Dockyard Output: §R[?KMT_eco_hyperinflation_var_visual]%§!\n Construction Speed: §R[?KMT_eco_hyperinflation_var_visual]%§!\n Repair Speed: §R[?KMT_eco_hyperinflation_var_visual]%§!"
