 KMT_stab-5_ws10_pp5_tt:0 "Modify §YLa Révolution Nationale du Kuomintang§! by\nStabilité : §R-5%§!\nSoutien à la guerre : §G10%§!"
 KMT_stab5_f-2_tt:0 "Modify §YLa Révolution Nationale du Kuomintang§! by\nStabilité : §G5%§!\nSoutien quotidien au fascisme : §R-0.02§!"
 KMT_stab-7.5_pp10_f3_c-1_tt:0 "Modify §YLa Révolution Nationale du Kuomintang§! by\nStabilité : §R-7.5%§!\nGain de pouvoir politique : §G10%§!\nSoutien quotidien au fascisme : §G+0.03§!\nSoutien quotidien au communisme : §R-0.01§!"
