 KMT_n1_f1_base-5_cap1.2_tt:0 "Modify §YLa Révolution Nationale du Kuomintang§! by\nBase d’efficacité de production : §R-5%§!\nCap d’efficacité de production : §G1.2%§!\nSoutien quotidien au fascisme : §G+0.01§!\nSoutien quotidien aux non-alignés : §G+0.01§!"
