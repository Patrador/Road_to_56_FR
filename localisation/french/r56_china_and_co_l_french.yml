 KMT_levy_taxes_on_the_upper_middle_class: "Levy Taxes on the Upper Class"
 KMT_pro_education_propaganda: "Pro Education Propaganda"
 KMT_pro_buisness_propaganda: "Pro Business Propaganda"
 KMT_the_national_catastrophe: "The National Catastrophe"
 KMT_the_national_catastrophe_desc: "A horrid thing has occurred! China has been abused by foreigners and hurt greatly. We must overcome!"
 KMT_deal_with_unrest: "Deal with Unrest"
 KMT_deal_with_unrest_desc: "It is time to deal with the Chinese Unrest. They have caused much damage to us and we must deal with this great danger to our new regime."
 KMT_crush_the_radical_nationalists: "Crush the Radical Nationalists"
 KMT_crush_the_radical_nationalists_desc: "The military must crush the radicals who oppose our regime. They must be dealt with and China saved from these degenerates."
 KMT_crush_the_nra: "Écraser la ANR"
 KMT_crush_the_nra_desc: "Des restes de l'ANR se cachent dans tout le pays pour combattre nos forces. Ils seront attirés dans la bataille, combattus et vaincus, ce qui mettra nos forces à l'abri de toute attaque."
 KMT_find_chiang_kai_shek: "Trouver Chiang Kai-Shek"
 KMT_find_chiang_kai_shek_desc: "La police trouvera Chiang Kai-Shek, le recherchera et veillera à ce qu'il soit tué, ce qui entraînera une forte diminution de la résistance en Chine."
 KMT_ideological_education: "Éducation idéologique"
 KMT_ideological_education_desc: "Le gouvernement réorganisé entamera un programme d'éducation idéologique en Chine, afin d'assurer notre domination pour de bon et de rendre notre régime populaire."
 KMT_strengthen_resource_extraction: "Augmenter l'extraction des ressources"
 KMT_strengthen_resource_extraction_desc: "Nos suzerains exigent que nous augmentions l'extraction des ressources sur nos terres, afin de garantir des richesses sans commune mesure."
 KMT_improve_the_negotiating_position: "Améliorer la position de négociation"
 KMT_improve_the_negotiating_position_desc: "Après avoir amélioré notre économie, il est maintenant temps d'améliorer notre position de négociation avec nos suzerains et de commencer à réaffirmer notre souveraineté."
 KMT_china_at_the_mercy_of_our_overlord: "La Chine à la merci de notre suzerain"
 KMT_china_at_the_mercy_of_our_overlord_desc: "Nous sommes à la merci de nos suzerains et nous nous en accommoderons. Il n'y a rien que nous puissions faire pour changer les choses, alors autant être loyaux."
 KMT_seek_industrial_investments: "Recherche d'investissements industriels"
 KMT_seek_industrial_investments_desc: "Comme nous sommes absolument loyaux envers nos suzerains, nous pouvons leur demander des investissements pour améliorer l'état lamentable de notre économie."
 KMT_for_better_or_worse_the_fate_of_china: "The Fate of China, for Better or Worse"
 KMT_for_better_or_worse_the_fate_of_china_desc: "It seems it is the fate of China to be subservient, we must accept this to build up and move on."
 KMT_winning_the_hearts_and_minds_of_the_people: "Winning the Hearts and Minds"
 KMT_winning_the_hearts_and_minds_of_the_people_desc: "It is time to work on winning the hearts and minds of the people of China. We will make sure that we are their true first priority."
 KMT_chinese_industry_in_the_shadow_of_the_overlord: "Chinese Industry beyond our Overlord"
 KMT_chinese_industry_in_the_shadow_of_the_overlord_desc: "To rebuild, we must build a great industry for China, making ourselves a great power beyond our overlords to perhaps eclipse them one day."
 KMT_a_beacon_of_ideology_in_the_middle_kingdom: "A Great Ideological Beacon"
 KMT_a_beacon_of_ideology_in_the_middle_kingdom_desc: "We have made China a great ideological beacon in Asia, becoming a great new symbol for the ideology we have now taken up."
 KMT_declare_the_peoples_republic: "Declare the People's Republic"
 KMT_declare_the_peoples_repulbic_desc: "We shall now declare a People's Republic, ensuring the greatness of Communism for the Future."
 KMT_rise_of_the_blueshirts: "Rise of the Blueshirts"
 KMT_rise_of_the_bleushirts_desc: "We have made great progress in collaborating with the blueshirts, we shall now bind them into the government to secure our rule."
 KMT_align_pla_remnants: "Align PLA Remnants"
 KMT_align_pla_remnants_desc: "PLA remnants will be aligned, securing their collaboration with our regime in the future."
 KMT_align_the_blueshirts_puppet: "Align the Blueshirts"
 KMT_align_the_blueshirts_puppet_desc: "the blueshirts will be aligned with our cause, bringing about great support from these fascist compatriots."
 KMT_victory_over_the_partisans: "Victory Over the Partisans"
 KMT_victory_over_the_partisans_desc: "We have done it, the partisans are mostly defeated, perhaps one day China will be safe..."
 KMT_the_armed_forces_of_the_chinese_state: "The Armed Forces of the Chinese State"
 KMT_the_armed_forces_of_the_chinese_state_desc: "We shall now reorganize our armed forces after the rout of the NRA, securing a new state for China."
 KMT_strengthen_the_high_command: "Rebuild the High Command"
 KMT_strengthen_the_high_command_desc: "The army rebuilds it's high command, so that we may defend ourselves."
 KMT_a_vast_army: "A Vast Army"
 KMT_a_vast_army_desc: "Our overlords demand we build up a vast army, capable of providing fodder for our overlords. China will soon be useful again."
 KMT_wjw_rule_secured: "The Collaborator Secured"
 KMT_wjw_rule_secured_desc: "Jing Wei has now made China nothing more than a puppet to China as he strengthens his grip on the country. Who knows what the future holds..."
 KMT_an_auxuliary_army: "An Auxiliary Army"
 KMT_an_auxuliary_army_desc: "Our overlords demand we form an auxiliary army, full of modern special forces and tanks to do specialized tasks."
 KMT_ycp_victory: "Victoire du YCP"
 KMT_ycp_victory_desc: "Le YCP a remporté une grande victoire, en battant le KMT à l'isoloir et en ouvrant une nouvelle ère pour la Chine."
 KMT_strengthen_national_character: "Renforcer le caractère national"
 KMT_strengthen_national_character_desc: "Le caractère national de la Chine a été endommagé par le KMT et détruit par les puissances étrangères qui abusent de notre nation. Nous devons mettre fin à cette horrible évolution"
 KMT_make_china_young_again: "Redonner à la Chine sa jeunesse"
 KMT_make_china_young_again_desc: "Il est temps de rendre à la Chine sa jeunesse, afin qu'elle puisse rivaliser avec les Européens et devenir une nation développée véritablement moderne."
 KMT_strengthen_the_constitution: "Renforcer la Constitution"
 KMT_strengthen_the_constitution_desc: "Après avoir beaucoup fait pour démocratiser la Chine, nous renforcerons la constitution de la Chine afin que nous puissions réellement devenir une démocratie libérale moderne."
 KMT_secularize_the_state: "Séculariser l'État"
 KMT_secularize_the_state_desc: "La Chine doit être sécularisée et libérée de l'influence malsaine des confucianistes qui retardent le développement de la Chine."
 KMT_secularization_of_the_state: "Séculariser l'État"
 KMT_secularization_of_the_state_desc: "La Chine doit être sécularisée et libérée de l'influence malsaine des confucianistes qui retardent le développement de la Chine."
 KMT_modernize_the_nation: "Moderniser la nation"
 KMT_modernize_the_nation_desc: "Il est nécessaire de moderniser la nation pour que la Chine devienne un paradis capitaliste, capable de surpasser toutes les nations européennes."
 KMT_a_china_capable_of_outdoing_europe: "La Chine surpassera l'Europe"
 KMT_a_china_capable_of_outdoing_europe_desc: "Nous avons beaucoup fait pour moderniser la Chine et, grâce à cela, elle dépassera bientôt les Européens."
 KMT_make_china_one_again: "Réunir la Chine à nouveau"
 KMT_make_china_one_again_desc: "La Chine est divisée en raison de son passé de seigneurs de la guerre, de fédéralistes et d'autres groupes qui divisent le pays."
 KMT_expand_reach_of_the_cental_government: "Élargir le champ d'action du gouvernement central"
 KMT_full_centralization_of_the_state: "Centralisation totale de l'État"
 KMT_full_centralization_of_the_state_desc: "La Chine sera désormais entièrement centralisée, tous les pouvoirs étant transférés au gouvernement central."
 KMT_a_unitary_han_state: "The Success of Nationalism"
 KMT_a_unitary_han_state_desc: "Our policy of centralizing China and making it one strong nation has been a great success!"
 KMT_vanquish_the_memory_of_the_seperatists: "Vanquish the Memory of the Separatists"
 KMT_vanquish_the_memory_of_the_seperatists_desc: "The Central Government will vanquish the memory of the separatists and warlords, having defeated them, their legacy will now be destroyed."
 KMT_extol_the_three_principles: "Extol the Three Principles"
 KMT_extol_the_three_principles_desc: "Our government still extols the Three Principles of the People and brings our people together around these key ideas that unite all of China!"
 KMT_the_success_of_democracy: "The Success of Democracy"
 KMT_the_success_of_democracy_desc: "Our implementation of democracy in China has been a great success, soon China will become the best democracy in the world."
 KMT_the_success_of_peoples_welfare: "The Success of People's Welfare"
 KMT_the_success_of_peoples_welfare_desc: "Our implementation of People's Welfare has brought about great prosperity to our nation. Let us relish this fact."
 KMT_a_strong_national_character: "A Strong National Character"
 KMT_a_strong_national_character_desc: "We have done it, we have built a strong national Character for China, uniting it in victory."
 KMT_expand_loyalist_support: "Expand Loyalist Support"
 KMT_expand_loyalist_support_desc: "Pour survivre, nous devons nous appuyer sur le soutien de nos fidèles, les enseignants, les hommes d'affaires et les banquiers qui sont alliés à notre régime."
 KMT_delve_into_factionalism: "S'intéresser au factionnalisme"
 KMT_delve_into_factionalism_desc: "Le factionnalisme assurera la sécurité du régime, en travaillant avec nos loyalistes et en renforçant notre régime."
 KMT_an_educated_china: "Une Chine éduquée"
 KMT_an_educated_china_desc: "Avec le soutien de nos loyalistes rassemblés, le gouvernement consolidera son pouvoir dans le régime."
 KMT_china_open_for_buisness: "La Chine ouverte aux affaires"
 KMT_china_open_for_buisness_desc: "Avec le soutien de nos loyalistes rassemblés, le gouvernement consolidera son pouvoir dans le régime."
 KMT_the_liberation_of_chinese_national_character: "Libéraliser le caractère national"
 KMT_the_liberation_of_chinese_national_character_desc: "L'État a travaillé dur pour réparer les dommages causés au caractère national chinois par les oppresseurs étrangers. La Chine sera véritablement libérée."
 KMT_expand_reach_of_the_cental_government_desc: "Nous avons fini d'étendre la portée du gouvernement central et d'asseoir notre pouvoir sur tous les seigneurs de la guerre et autres régionalistes."
 KMT_a_bigger_stronger_chiang: "Un Chiang plus grand et plus fort"
 KMT_a_bigger_stronger_chiang_desc: "Dai n'est qu'une version plus grande et plus forte de Chiang, avec toutes les forces et aucune des faiblesses du vieil homme."
 KMT_build_a_cult_of_personality: "Le sauveur de la Chine"
 KMT_build_a_cult_of_personality_desc: "Dai a sauvé la Chine des Chiangistes et, à ce titre, il doit être vénéré dans son nouveau rôle. Vive le dictateur !"
 KMT_showcase_lis_prowess: "Présenter les prouesses de Dai"
 KMT_showcase_lis_prowess_desc: "Les prouesses de Dai doivent être assurées, prouvant qu'il est meilleur que Chiang dans tous les domaines."
 KMT_showcase_chiangs_degeneracy: "La dégénérescence de Chiang exposée"
 KMT_showcase_chiangs_degeneracy_desc: "Les crimes de Chiang doivent être mis en évidence, afin de préparer sa mort, en achetant la loyauté de notre peuple."
 KMT_the_fate_of_all_his_cronies: "The Fate of all his Cronies"
 KMT_the_fate_of_all_his_cronies_desc: "Chiang has been punished, but his cronies have not been yet, it is time to deal with this, by purging them as well."
 KMT_cosolidate_power_over_the_nation: "Consolidate Power Over the Nation"
 KMT_cosolidate_power_over_the_nation_desc: "We must consolidate power over China, breaking the bonds of the KMT."
 KMT_hang_chiang_kai_shek: "Hang Chiang Kai Shek"
 KMT_hang_chiang_kai_shek_desc: "We can finally hang Chiang Kai Shek, for all he has done to our blueshirts. This must be repaid."
 KMT_purge_the_chiangists: "Purge the Chiangists"
 KMT_purge_the_chiangists_desc: "the Chiangists will be purged, allowing us to secure the state from them permanently."
 KMT_strengthen_lis_power: "Strengthen Dai's Power"
 KMT_strengthen_lis_power_desc: "It is time to strengthen Dai's power in our nation, ensuring that there is none to oppose him."
 KMT_asian_bloc: "Asian Bloc"
 KMT_asian_bloc_desc: "China has set out to create a new bloc in Asia, to secure our interests and those of our fellow Asian countries."
 KMT_claims_for_peace: "Claims for Peace"
 KMT_claims_for_peace_desc: "We have certain claims from the Soviets, we demand them to give them to us, in exchange for a lasting peace between the two of us."
 KMT_shared_interests_in_indochina: "Shared Interests in Indochina"
 KMT_shared_interests_in_indochina_desc: "Our diplomats must reach out to the French to secure our interests in Indochina without forcing the French into a war over Vietnam and the resources there."
 KMT_realpolitik: "Realpolitik"
 KMT_realpolitik_desc: "Our statesman must adopt a policy of realpolitik for China, doing the most practical thing to ensure expansion without war."
 KMT_great_commander: "Builder of the Realm"
 KMT_great_commander_desc: "Dai has proven that his is more than capable of making China a great nation, building a realm and a new China far larger than the old one under the perfidious Chiang"
 KMT_manchuria_for_economic_rights: "Manchuria for Economic Rights"
 KMT_manchuria_for_economic_rights_desc: "To reach a compromise, we offer to let the Japanese keep economic rights in Manchuria, thus getting us the land without forcing a war."
 KMT_blueshirts_everywhere_always: "Blueshirts everywhere, always"
 KMT_blueshirts_everywhere_always_desc: "The shadow state shall make sure there are Blueshirts everywhere, always, ensuring that we have full control over China."
 KMT_enforce_membership_for_generals: "Enforce Membership for Generals"
 KMT_enforce_membership_for_generals_desc: "It is finally time to enforce membership in the Blueshirts for all generals. This will enforce their loyalty"
 KMT_harsh_quotas: "Harsh Quotas"
 KMT_harsh_quotas_desc: "Our agents shall put up harsh quotas for the Chinese people, ensuring the long term survival of China."
 KMT_promote_the_militarists: "Promote the Militarists"
 KMT_promote_the_militarists_desc: "It is time to promote the militarists in our army, ensuring that we have full control over the army."
 KMT_blueshirts_in_every_group: "Blueshirts in every Group"
 KMT_blueshirts_in_every_group_desc: "We must make sure there are Blueshirts in every group, so that they will secure the control of the government."
 KMT_ready_the_clases_for_war: "Ready the Classes for War"
 KMT_ready_the_clases_for_war_desc: "The Classes must be readied for war, ensuring that China will be ready when the time comes."
 KMT_work_targets: "Work Targets"
 KMT_work_targets_desc: "Our agents establish work quotas for the Chinese people, ensuring that they are fully committed to working their ass off for the regime."
 KMT_blueshirts_overseers: "Blueshirt Overseers"
 KMT_blueshirts_overseers_desc: "the shadow state now watches over the Chinese people, ensuring that they are fully committed to their jobs."
 KMT_the_great_flight: "The Great Flight"
 KMT_the_great_flight_desc: "A great tragedy has occurred... we have been forced to flee from the mainland, it seems the communists won a victory. Yet soon we will come back."
 KMT_finalize_asset_evacuation: "Finalize Asset Evacuation"
 KMT_finalize_asset_evacuation_desc: "We have brought back many industrial assets to Taiwan. We will take these out and build up our industry with them."
 KMT_secure_foreign_aid: "Secure foreign Aid"
 KMT_secure_foreign_aid_desc: "Our diplomats work to secure foreign aid from allied major powers who support us. This will fix our industry and allow us to overtake [CUG.GetNameDef]"
 KMT_save_national_treasure: "Save National Treasure"
 KMT_save_national_treasure_desc: "We have saved much national treasure and will now display it to the people and army, giving them the motivation to fight and defend this from the communist swine."
 KMT_the_last_bastion: "The Last Bastion"
 KMT_the_last_bastion_desc: "We have become the last bastion of the true Chinese Government. We will save China from the swine in the mainland!"
 KMT_fortify_the_coast: "Fortify the Coast"
 KMT_fortify_the_coast_desc: "It is only a matter of time until [CUG.GetNameDef] overtakes us navally, therefore we must fortify the coast, ensuring our islands will never fall."
 KMT_protect_the_streight: "Protect the Straight"
 KMT_protect_the_streight_desc: "Our holdings in Hainan are at risk from an attack by land. It is necessary to fortify the straight to ensure that modern Chinese weapons will not break us."
 KMT_prepare_to_retake_the_homeland: "Prepare to Retake the Homeland"
 KMT_prepare_to_retake_the_homeland_desc: "It is time to prepare to retake the homeland, the mainland will be freed from the oppressors and the KMT brought back!"
 KMT_plan_the_reconquest: "Plan the Reconquest"
 KMT_plan_the_reconquest_desc: "We now begin to plan the reconquest of the mainland. Soon our men will secure our final victory through these meticulous plans. Operation hope will be a grand success!"
 KMT_march_forth: "March Forth"
 KMT_march_forth_desc: "We now march forth and retake the Homeland! It is but a matter of days until Nanjing and Beijing are free again."
 KMT_a_glorious_return: "A Glorious Return"
 KMT_a_glorious_return_desc: "We have done it! We have made a glorious return! China is free again!"
 KMT_build_up_cells_in_the_mainland: "Build up Cells in the Mainland"
 KMT_build_up_cells_in_the_mainland_desc: "A great effort will be invested to build up cells in the mainland, making them vulnerable to an attack from us."
 KMT_rebolshevize_the_NRA: "Rebolshevize the NRA"
 KMT_rebolshevize_the_NRA_desc: "It is necessary to rebolshevize the NRA, securing its unity and loyalty to the KMT."
 KMT_reconsider_army_doctrine: "Reconsider Army Doctrine"
 KMT_reconsider_army_doctrine_desc: "The army must reconsider its doctrine. We now lack the hordes of the mainland and have much different needs to address."
 KMT_porcupine_strategy: "Porcupine Strategy"
 KMT_porcupine_strategy_desc: "We have to focus on defending our homeland, thus, our forces will adopt the porcupine strategy, ensuring the permanent defense of our island."
 KMT_modern_arms: "Modern Arms"
 KMT_modern_arms_desc: "It is time to adopt a policy of modern arms, using tanks and similar technology to outgun the main government of China, allowing for daring offensives and great kill death ratios."
 KMT_urban_guerilla_warfare: "Urban Guerilla Warfare"
 KMT_urban_guerilla_warfare_desc: "Our people will be trained in the art of guerilla warfare, allowing us to defend our cities, no matter what happens."
 KMT_modernize_technology: "Modernize Technology"
 KMT_modernize_technology_desc: "We must modernize our technology, allowing us to outcompete the main government long term, ensuring our final victory."
 KMT_tanks_good_both_here_and_there: "Tanks, Good both Here and There"
 KMT_tanks_good_both_here_and_there_desc: "Tanks are good both on our islands and on the mainland. Our troops must work to dig deeper into them and make the best tanks in Asia."
 KMT_well_trained_infantry: "Well Trained Infantry"
 KMT_an_untakeable_island: "An Untakeable Island"
 KMT_an_untakeable_island_desc: "The army ensures our islands are untakeable, that the state will live forever, regardless of the fate of the mainland."
 KMT_a_modern_tank_army: "A Modern Tank Army"
 KMT_a_modern_tank_army_desc: "The high command will make sure we have a modern tank army, and that it will one day cross the straight and bring about a grand victory for the KMT."
 KMT_skilled_offensive_generals: "Skilled Offensive Generals"
 KMT_skilled_offensive_generals_desc: "We must ensure that our generals are skilled and capable of winning battles for us."
 KMT_accept_the_inevitable: "Accept the Inevitable"
 KMT_accept_the_inevitable_desc: "It is time to accept the inevitable, that we will never be able to return to the mainland. Let us prepare to declare independence."
 KMT_declare_independence: "Declare Independence"
 KMT_declare_independence_desc: "It is time, let us declare independence, the mainlanders to be damned! All hail the new regime!"
 KMT_a_national_congress_through_the_despair: "A National Congress through the Despair"
 KMT_a_national_congress_through_the_despair_desc: "The KMT must hold a national congress through the despair, we will make sure the KMT will hold fast and be strong through this trying time."
 KMT_permanent_marshal_law: "Permanent Marshal Law"
 KMT_permanent_marshal_law_desc: "With our state secured, Chiang declares martial law, China will be put under the permanent control of the Generalissimo. Dissent will not be tolerated."
 KMT_lift_the_veil: "Lift the Veil"
 KMT_lift_the_veil_desc: "The time has come to lift the veil of the martial law in our country. We must bring about the final victory of the three principles!"
 KMT_educate_the_people: "Educate the People"
 KMT_educate_the_people_desc: "The Chinese people are to be educated, teaching them modern information, and helping them learn and do science."
 KMT_restart_the_white_terror: "Restart the White Terror"
 KMT_restart_the_white_terror_desc: "The time has come to restart the white terror, consolidating the Generalissimo's power. The Separatists and Communists will be crushed!"
 KMT_seek_revenge_for_the_feb28_incident: "Seek Revenge for February 28th"
 KMT_seek_revenge_for_the_feb28_incident_desc: "Chiang seeks revenge for our people, who were attacked by separatists and communists after we retook the island. Such insolence will not be tolerated."
 KMT_purge_communists: "Purge Communists"
 KMT_purge_communists_desc: "It is of highest priority to purge communists in our island, these are nothing but national traitors and must go."
 KMT_deal_with_the_locals: "Deal with the Locals"
 KMT_deal_with_the_locals_desc: "Our troops deal with the locals who seek our overthrow. Separatism will not be tolerated!"
 KMT_punish_anti_state_activities: "Punish Anti-State Activities"
 KMT_punish_anti_state_activities_desc: "All activities that go against the state are to be punished, allowing for our regime to be permanently secured."
 KMT_deal_with_taiwanese_seperatists: "Deal with Taiwanese Separatists"
 KMT_deal_with_taiwanese_seperatists_desc: "The separatists must be dealt with permanently if we wish to survive long term. We will end them..."
 KMT_consolidate_KMT_rule: "Consolidate KMT rule"
 KMT_consolidate_KMT_rule_desc: "Chiang must consolidate the rule of the KMT, allowing for us to be safe and under a stable regime."
 KMT_hail_the_national_savior: "Hail the National Savior"
 KMT_hail_the_national_savior_desc: "All hail the National Savior, the man who has brought us over here and saved us! All Hail Chiang Kai Shek!"
 KMT_form_the_TGC: "Form the TGC"
 KMT_form_the_TGC_desc: "The KMT forms the Taiwan Garrison Command, allowing us to find and sniff out traitors so that none will betray us into the hands of the communists."
 KMT_limited_opposition: "Limited Opposition"
 KMT_limited_opposition_desc: "For stability's sake, we allow for limited opposition for Parties like the CDSP, who will support us in exchange and become nothing but puppets for us, legitimizing our regime."
 KMT_executive_rule: "Executive Rule"
 KMT_executive_rule_desc: "We shall implement Executive Rule, allowing us to do and not do as we please."
 KMT_mass_pervasive_monitoring: "Mass Pervasive Monitoring"
 KMT_mass_pervasive_monitoring_desc: "The TGC will implement Mass monitoring, allowing for us to see all betrayal before it happens. China will be secure!"
 KMT_sham_criminal_trials: "Sham Criminal Trials"
 KMT_sham_criminal_trials_desc: "The TGC will hold 'trials' for the national traitors, giving ourselves legitimacy, as well as slaughtering the traitors."
 KMT_suspend_basic_human_rights: "Suspend Basic Human Rights"
 KMT_suspend_basic_human_rights_desc: "The TGC will suspend the rights of traitors, as they do not deserve them and these rights obstruct justice! The TGC will have a firm hand."
 KMT_imbue_them_in_the_people: "Imbue them in the People"
 KMT_imbue_them_in_the_people_desc: "The people must learn to devote their lives to the virtues, this Chiang has begun to start more intense state propaganda to bring this about in them."
 KMT_influencing_the_people: "Influencing the People"
 KMT_blue_coup_tt: "The §8Blueshirts§! will stage a coup and attempt bring about their own vision for China within a month of the triggers being fufilled..."
 KMT_prop_done_tt: "All of the §YInfluencing the People§! decisions have been completed"
 KMT_party_bop_tt: "This effect will only happen so long as §YConsolidate Party Supremacy§! has not been completed."
 KMT_CKS_bop_tt: "This effect will only happen so long as §YDeclare Martial Law§! has not been completed."
 KMT_starting_tt: "The §2Kuomintang§! has secured a victory in central China and become the internationally recognized government of China, yet only time will tell if they will succeed or if they will die to enemies within or without..."
 KMT_beijing_tt: "The §8Blueshirts§! have been disbanded by Chiang"
 KMT_consolidate_chiangs_control: "Consolidate Chiang's Control"
 KMT_consolidate_chiangs_control_desc: "Chiang will consolidate his control over China, bringing about a bright and loyal future for our nation."
 KMT_well_trained_infantry_desc: "We need to train our infantry in depth, ensuring that it is capable of fighting and holding superior enemies and ensuring our survival."
 KMT_secure_mongolia_and_tuva: "Secure Mongolia and Tuva"
 KMT_secure_mongolia_and_tuva_desc: "The time has come to secure Mongolia and Tuva from the Soviets, ensuring the integrity of our new empire."
 KMT_undo_the_armur_annextion: "Undo the Amur Annexation"
 KMT_undo_the_armur_annextion_desc: "The Russians have stolen large amounts of our lands, it is our duty to undo this and retake them."
 KMT_restore_the_tributary_system: "Restore the Tributary System"
 KMT_restore_the_tributary_system_desc: "It is our divine right to restore the tributary system and ensure our dominance over Asia."
 KMT_the_empire_plan: "The Empire Plan"
 KMT_the_empire_plan_desc: "The time has come to embark on a new plan, one to build a great Chinese Empire."
 KMT_demand_manchuria: "Demand Manchuria"
 KMT_demand_manchuria_desc: "We now demand the return of Manchuria. We need to be allowed to take control over all of the Chinese State."
 KMT_expand_the_treaty: "Expand the Treaty"
 KMT_expand_the_treaty_desc: "We will expand our alliance beyond just our own country. This will greatly expand our alliance."
 KMT_declare_the_empire: "Declare the Empire"
 KMT_declare_the_empire_desc: "Our Plan has been a great success, the time has come to declare a new empire. All Hail China!"
 KMT_hegemony_over_indochina: "Hegemony over Indochina"
 KMT_hegemony_over_indochina_desc: "Dai Li demands the handing over of Indochina to us and secure our new imperial sphere."
 KMT_the_tianmen_square_coup: "The Beijing Coup"
 KMT_the_tianmen_square_coup_desc: "We have staged a coup in Beijing, allowing for us to take over control of the Chinese Government. All hail the Blueshirts!"
 KMT_brilliant_genius: "Cunning Mastermind"
 KMT_brilliant_genius_desc: "With his Coup and taking over of China, Dai has truly shown that he is a cunning mastermind and that none will be able to stop his ascent to power."
 KMT_they_will_know_fear: "Our Enemies Vanquished"
 KMT_they_will_know_fear_desc: "Fear will be brought to our enemies, ensuring that no foreign power will ever be able to do anything about us. They will be vanquished by our tanks and be destroyed in the field"
 KMT_leader_of_the_nation_and_the_people: "A Man of the People"
 KMT_leader_of_the_nation_and_the_people_desc: "Dai has shown time and time again, that he is not like the old elites, he is a man of the people and they must love him."
 KMT_seize_landholder_assets: "Seize Landholder Assets"
 KMT_seize_landholder_assets_desc: "We now seize the assets of landholders and such traitors, further strengthening the plan."
 KMT_bind_the_army_into_the_state: "Bind the Army into the State"
 KMT_bind_the_army_into_the_state_desc: "It was the Army that brought about our glorious revolution! let us all hail it in it's great deeds for our country."
 KMT_choosing_a_new_chairman: "Choosing a Chairman"
 KMT_choosing_a_new_chairman_desc: "Our Provisional Government shall convene again, seeking to establish a leader for the new China. While Li Lisan seeks to maintain his lead over the Party, some question if this is actually going to be possible given the Soviet disapproval of him."
 KMT_li_lisan: "Chairman Li"
 KMT_li_lisan_desc: "Li Lisan has done it! He, the master of the Chinese Revolution, has successfully consolidated his power. All hail the new Chairman!"
 KMT_chinese_five_year_plan: "A Chinese Five Year Plan"
 KMT_chinese_five_year_plan_desc: "The Soviets have had great success with their five year plan. We shall make one for ourselves too so that we may prosper."
 KMT_consolidate_control_over_industry: "Consolidate Control Over Industry"
 KMT_consolidate_control_over_industry_desc: "We shall consolidate control over the Chinese Industry, nationalizing large chunks of it for the good of our people."
 KMT_support_trade_unions: "Support Trade Unions"
 KMT_support_trade_unions_desc: "Trade Unions have been highly useful in our revolution. We shall thank them for their support by maintaining their independence."
 KMT_enforce_trade_union_compliance: "Enforce Trade Union Compliance"
 KMT_enforce_trade_union_compliance_desc: "While Trade unions have been highly useful for our Revolution for now, we have to prevent them from threatening our rule. We must enforce their obedience to our rule."
 KMT_build_up_the_red_army: "Build up the Red Army"
 KMT_build_up_the_red_army_desc: "Our new red army is in disarray after our chaotic revolution. We must do something about this. The time has come to invest in our troops and ensure their survival."
 KMT_a_great_purge: "A Cultural Revolution"
 KMT_a_great_purge_desc: "Our Regime is full of enemies, both within and without. We must deal with them swiftly."
 KMT_deal_with_the_beurgeois: "Deal with the Bourgeoisie"
 KMT_deal_with_the_beurgeois_desc: "It is necessary to deal with the Bourgeoisie fascists and capitalists, who have opposed us for so long. These Traitors to the working class will perish!"
 KMT_consolidate_power_over_the_state: "Consolidate Power over the State"
 KMT_consolidate_power_over_the_state_desc: "The Chairman Consolidates his power over the State, ensuring the defeat of our opposition and entrenching the Chairman's Rule."
 KMT_prepare_to_drive_out_foreign_influence: "Prepare to drive out foreign influence"
 KMT_a_new_kmt_thinktank:0 "A New KMT Think Tank"
 KMT_a_new_kmt_thinktank_desc:0 "We shall create a new Thinktank for our great party to spread what we believe to be proper thought, so that those who follow our ways shall prosper!"
 KMT_increase_military_r_and_d:0 "Augmenter la recherche militaire"
 KMT_increase_military_r_and_d_desc:0 "The military demands we Increase Military R&D now that Wei-Kuo is here to lead us in doing so. this will greatly improve our shots at modernizing our armed forces!"
 KMT_invite_eurofacist_scientists:0 "Invite Eurofascist Scientists"
 KMT_invite_eurofacist_scientists_desc:0 "To improve our military, Li takes inspiration from those that inspired our ideology, allowing us to import a few of their scientists so that they may lead us in developing great new weapons!"
 KMT_counter_asian_imperialism:0 "Prioritize Asian Imperialism"
 KMT_counter_asian_imperialism_desc:0 "While Asia has historically been the victim of imperialism ever since the fall of the Qing, the Japanese have taken it upon themselves to do these misdeeds as well! They must be stopped!"
 KMT_korean_liberation:0 "Demand Korean Liberation"
 KMT_korean_liberation_desc:0 "We finally demand Korean liberation and finally free this people from it's oppressors! Korea will be free!"
 KMT_cdsp_victory:0 "CDSP Victory"
 KMT_cdsp_victory_desc:0 "The China Democratic Socialist Party has won a great victory and ousted the KMT from their position of power, with Carsun Chiang leading them to this great victory."
 KMT_the_foundations_of_chinese_fedralism:0 "The Foundations of Chinese Federalism"
 KMT_the_foundations_of_chinese_fedralism_desc:0 "We shall lay out the foundations of Chinese Federalism and begin turning the country in such a direction, allowing for a better and more just form of governance."
 KMT_analyze_the_1922_constitution_attempt:0 "Analyze the 1922 Constitution Attempt"
 KMT_utilize_our_riches: "Utilize our Riches"
 KMT_utilize_our_riches_desc: "We shall now use our riches for ourselves finally, sponsoring many educational facilities and brining about a prosperous future!"
 KMT_analyze_the_1922_constitution_attempt_desc:0 "Carsun had already tried to implement a federal constitution in 1922. Carsun will revisit his work back then and use it to augment the current one."
 KMT_prepare_changes_to_the_kmt_constitution:0 "Prepare Changes to the KMT Constitution"
 KMT_prepare_changes_to_the_kmt_constitution_desc:0 "Carsun will prepare changes to the constitution based on the 1922 constitution attempt and other sources. Once the paperwork is done, the parliament simply has to pass these changes."
 KMT_strengthen_larger_minorities:0 "Strengthen Larger Minorities"
 KMT_strengthen_larger_minorities_desc:0 "We now work to implement our federalist principles and strengthen them especially where minorities are a major part of the population, allowing for the treatment of people according to their needs."
 KMT_tweak_province_borders:0 "Tweak Province Borders"
 KMT_tweak_province_borders_desc:0 "The time has come to tweak the borders of our provinces to better follow ethnic lines, allowing for a much more effective form of federalism and consistency with our implementation of the law."
 KMT_pass_the_changes:0 "Pass the Changes"
 KMT_pass_the_changes_desc:0 "We shall pass our new changes to the constitution, now that they are ready. Federalism shall truly reign supreme in China!"
 KMT_break_the_kmt_stranglehold:0 "Break the KMT stranglehold"
 KMT_break_the_kmt_stranglehold_desc:0 "We must work to break the stranglehold the KMT has on China and free the Chinese people from their grasp."
 KMT_showcase_chiangs_noncompliance:0 "Showcase Chiang's Noncompliance"
 KMT_showcase_chiangs_noncompliance_desc:0 "Chiang has done many things that go against our own constitution. The new regime will showcase this to the people and use it to discredit the KMT in their eyes."
 KMT_wang_jingweis_rise:0 "L'ascension de Wang Jingwei"
 KMT_wang_jingweis_rise_desc:0 "Avec la mort de Chiang, il est temps pour Wang Jing Wei de prendre les rênes de l'État ! Espérons qu'il nous conduira à la prospérité !"
 KMT_consolidate_the_new_regime:0 "Consolider le nouveau régime"
 KMT_consolidate_the_new_regime_desc:0 "Dans le chaos qui a suivi la mort de Chiang, nous devons agir rapidement et de manière décisive, afin d'assurer la sécurité de la Chine sous notre nouvel État."
 KMT_preempt_the_inevitable: "Prévenir l'inévitable"
 KMT_preempt_the_inevitable_desc:0 "Le Japon vient nous chercher et il est impossible que la Chine puisse gagner une telle guerre. Nous devons rechercher un rapprochement et une solution pacifique."
 KMT_the_taiwan_accords:0 "Les accords de Taïwan"
 KMT_the_taiwan_accords_desc: "Puisque le Japon a accepté de discuter, nous nous rencontrerons à Taïwan, où Wang proposera un accord nous permettant d'accéder à la technologie japonaise pour la copier, et nous permettant de rattraper notre retard technologique tout en leur cédant une partie de notre économie."
 KMT_savior_of_all_china:0 "Sauveur de toute la Chine"
 KMT_savior_of_all_china_desc:0 "Wang Jing Wei est devenu le sauveur de toute la Chine et a uni tout son peuple. Vive Wang Jing Wei !"
 KMT_buy_and_sell_japanese: "Acheter et vendre des produits japonais"
 KMT_buy_and_sell_japanese_desc: "Nous devons nous efforcer d'acheter et de vendre des produits japonais, ce qui nous permettra de les copier et d'accéder ainsi à leur technologie. Nous allons maintenant envoyer au Japon un accord visant à renforcer notre traité afin d'atteindre cet objectif."
 KMT_scientist_exchange_programmes: "Programmes d'échange de scientifiques"
 KMT_scientist_exchange_programmes_desc: "Nous lancerons des programmes d'échange entre nos scientifiques et les Japonais moyennant une petite somme d'argent. Cela nous permettra de copier rapidement leur technologie et de mieux connaître les progrès de notre jeu de rattrapage."
 KMT_resources_for_research: "Ressources pour la recherche"
 KMT_resources_for_research_desc: "cNos entreprises proposeront un accord commercial lucratif au Japon en échange d'une partie de leurs recherches. Cela nous permettra de les rattraper et de les dépasser plus rapidement."
 KMT_labor_for_expertise: "Le travail pour l'expertise"
 KMT_labor_for_expertise_desc: "Nos centres pour l'emploi proposent désormais aux Japonais un marché, en leur offrant notre main-d'œuvre en échange de leur expertise, ce qui contribue à stimuler notre économie à long terme."
 KMT_invite_japanese_investors: "Inviter des investisseurs japonais"
 KMT_invite_japanese_investors_desc: "Nous aurions tout à gagner à inviter des investisseurs japonais en Chine et à en tirer des avantages décisifs."
 KMT_the_dragon_swallows_the_sun: "Le dragon avale le soleil"
 KMT_the_dragon_swallows_the_sun_desc: "Nous avons réussi ! Nous avons dépassé le Japon, nous nous sommes placés au premier rang de ces partenariats et nous sommes devenus les maîtres de l'Asie."
 KMT_the_path_of_war: "Le chemin de la guerre"
 KMT_the_path_of_war_desc:0 "Une fois notre suprématie assurée, la Chine peut s'engager sur la voie de la guerre, cherchant à évincer les Japonais par la force militaire."
 KMT_lands_or_war: "Lands or War"
 KMT_lands_or_war_desc: "We now send Japan an ultimatum now that we are in a strong spot and demand they withdraw from our core lands."
 KMT_carte_blanche_in_manchuria: "Carte Blanche in Manchuria"
 KMT_carte_blanche_in_manchuria_desc: "We demand the Japanese uphold our claim in Manchuria and give us free reign there to pacify the regime and unite China."
 KMT_the_masters_of_asia: "The Masters of Asia"
 KMT_the_masters_of_asia_desc: "We and the Japanese are the masters of Asia. If we cooperate, and perhaps maybe in the future become allies, none can stop us."
 KMT_manchuria_for_continued_economic_influence: "Manchuria for continued economic influence"
 KMT_manchuria_for_continued_economic_influence_desc:0 "China requests the Japanese return Manchuria to us, in exchange for maintaining a part of the profits from that land. This will prevent war and ensure cooperation into the future."
 KMT_begin_reforming_the_nation: "Begin Reforming the Nation"
 KMT_begin_reforming_the_nation_desc: "We finally can begin reforming China and turning it into the social paradise that Jingwei seeks."
 KMT_align_the_blueshirts:0 "Align the Blueshirts"
 KMT_align_the_blueshirts_desc: "Jingwei has decided to align the Blueshirts in order to strengthen the regime and have a new force to help us should Japan betray."
 KMT_purge_suriviving_communists: "Purge Surviving Communists"
 KMT_purge_suriviving_communists_desc: "We are honor bound to purge the remaining communists and traitors and ensure their deaths. China must be freed from this scum!"
 KMT_the_true_enemies_of_china: "Les vrais ennemis de la Chine"
 KMT_the_true_enemies_of_china_desc: "China must work to deal with its true enemies. Not the Japanese or any foreigners, but the communists, who must be dealt with should China survive."
 KMT_china_above_all: "China above All"
 KMT_china_above_all_desc: "The time has come to make sure to put China first and ensure our supremacy over Japan! China is and will be number one!"
 KMT_the_path_of_peace: "The Path of Peace"
 KMT_the_path_of_peace_desc: "With our supremacy secured, we attempt to force the Japanese out of our lands sternly and peacefully, perhaps even opening up for future cooperation."
 KMT_lands_for_bases: "Lands for Bases"
 KMT_lands_for_bases_desc: "The state can offer a deal to the Japanese, they shall pull out of our lands in exchange for bases for their navy. We hope we may not have to use more persuasive means..."
 KMT_sun_yat_sens_true_heir: "Sun Yat-Sen's True Heir"
 KMT_sun_yat_sens_true_heir_desc:0 "While Chiang claimed to be Sun Yat-Sen's heir, this is false, he will prove to the people that it is none other than himself!"
 KMT_reshuffle_the_courts:0 "Reshuffle the Courts"
 KMT_reshuffle_the_courts_desc:0 "The regime will reshuffle the courts, putting many neutral and our own party members into them, breaking the control the KMT has over these institutions, to secure a future free from their hold."
 KMT_renew_the_beaurocracy:0 "Renew the Bureaucracy"
 KMT_renew_the_beaurocracy_desc:0 "The regime will work to renew the bureaucracy and it's bureaucrats and make sure to remove the KMT power in the institutions of the state. There will soon be no more KMT loyalists in these jobs."
 KMT_a_new_establishment:0 "A New Establishment"
 KMT_a_new_establishment_desc:0 "The regime can now work to build a new establishment in China, and become what the KMT once was and secure eternal power over all aspects of the Chinese State."
 KMT_true_free_democracy:0 "True Free Democracy"
 KMT_true_free_democracy_desc:0 "The regime will work to implement new measures to ensure that no party may ever take the same place in China as the KMT once was or ever debase our democratic system again."
 KMT_train_the_idealist_in_politics:0 "Train the Idealist in Politics"
 KMT_train_the_idealist_in_politics_desc:0 "Our professionals must work to train Carsun Chiang in the ways of politics, allowing him to become more and more competent and to deal with his unrealistic idealism."
 KMT_support_the_common_man:0 "Support the Common Man"
 KMT_support_the_common_man_desc:0 "It is of utmost priority that we support the Common man in China, ensuring that the everyday folk can indeed be supported and cared for."
 KMT_a_mixed_economy:0 "A Mixed Economy"
 KMT_a_mixed_economy_desc:0 "To support the common man, China begins to adopt a mixed economy, supporting business and prosperity and allowing the people to be cared for even if they lack the funds personally."
 KMT_social_welfare:0 "Social Welfare"
 KMT_social_welfare_desc:0 "As part of our mixed economy, the state will begin to implement a policy of Social Welfare. This will allow us to take care of our workers."
 KMT_public_health:0 "Public Health"
 KMT_public_health_desc:0 "The state will, as part of our welfare program, make sure to dole out public healthcare, allowing for the poor and our workers to be able to stay healthy, benefiting our economy in the long run."
 KMT_social_security:0 "Social Security"
 KMT_social_security_desc:0 "The state must work to implement more social security, allowing for workers who have lost their jobs in our rapid industrialization to still put bread on the table."
 KMT_reducing_income_equality:0 "Reducing Income Inequality"
 KMT_reducing_income_equality_desc:0 "We have done it! The people are now truly being cared for as the rich and poor are no longer so different. It seems income inequality may finally be reduced to a tolerable extent."
 KMT_socialize_the_railways:0 "Socialize the Railways"
 KMT_socialize_the_railways_desc:0 "It is time to socialize the Railways in all of China, allowing for people to come from one place to another cheaply and efficiently."
 KMT_socialize_the_mines:0 "Socialize the Mines"
 KMT_socialize_the_mines_desc:0 "It is time to socialize the Mines, allowing for us to profit off of them and ensure fair wages for those working them."
 KMT_equal_rights_for_all:0 "Equal Rights for All"
 KMT_equal_rights_for_all_desc:0 "We will ensure that all will have equal rights, man, woman or child. Only this will be truly just."
 KMT_a_victory_for_liberalism:0 "A Victory for Liberalism"
 KMT_a_victory_for_liberalism_desc:0 "Our victory in the elections has been a great success, allowing us to bring about liberalism to China! All hail this new change for our good."
 KMT_distribute_key_roles:0 "Distribute Key Roles"
 KMT_distribute_key_roles_desc:0 "As it seems Carsun is too incompetent to truly lead the nation, we must act decisively to ensure our party's survival and transfer his power over to the party as a whole."
 KMT_organizer_of_the_party:0 "Organizer of the Party"
 KMT_organizer_of_the_party_desc:0 "The work must be put in to help Carsun truly become the organizer of the party and become a great leader. Only a little is missing and he may be turned into a great leader."
 KMT_support_individual_liberties:0 "Support Individual Liberties"
 KMT_support_individual_liberties_desc:0 "Chang supports the liberty of the common individual man, ensuring that the rights of man be truly fulfilled."
 KMT_freedom_from_corruption:0 "Freedom from Corruption"
 KMT_freedom_from_corruption_desc:0 "Si la Chine veut réussir, nous devons purger la corruption du KMT de cette nation, afin que nous puissions tous être libres."
 KMT_a_state_for_the_people:0 "Un État pour les citoyens"
 KMT_a_state_for_the_people_desc:0 "Nous avons transformé la Chine en un pays pour l’homme ordinaire, permettant à notre peuple de devenir de véritables grands hommes, capables de diriger et de façonner notre démocratie."
 KMT_the_duty_to_vote:0 "Le devoir de voter"
 KMT_the_duty_to_vote_desc:0 "Il est clair qu’il est du devoir du peuple de voter, afin qu’ils sachent que leurs droits comportent certains devoirs et que ceux-ci doivent être remplis."
 KMT_fight_the_aristocracy:0 "Combattre l'aristocratie"
 KMT_fight_the_aristocracy_desc:0 "L'État combat l'ancienne aristocratie et soutient le paysan, montrant qui est le plus juste et le plus digne d'être appelé véritablement chinois."
 KMT_the_chinese_bill_of_rights:0 "La Déclaration des droits chinoise"
 KMT_the_chinese_bill_of_rights_desc:0 "Le moment est venu de mettre en place une nouvelle Déclaration des droits en Chine, calquée sur le système américain. Cela consacrera véritablement nos libertés et garantira ce qui est bon pour le peuple."
 KMT_make_use_of_his_education:0 "Mettre à profit son éducation"
 KMT_make_use_of_his_education_desc:0 "L’éducation de Carsun doit être promue et mise à profit, lui permettant d’occuper une place spéciale aux yeux du peuple."
 KMT_the_return_of_taiwan:0 "Le retour de Taïwan"
 KMT_the_return_of_taiwan_desc:0 "Nous devons exiger le retour de Taïwan, retrouver notre peuple et reprendre ce que l’impérialisme japonais nous a enlevé."
 KMT_reassert_the_mongolian_claim:0 "Réaffirmer la revendication sur la Mongolie"
 KMT_reassert_the_mongolian_claim_desc:0 "Le moment est venu de réaffirmer notre revendication sur la Mongolie, reprenant enfin une terre chinoise qui nous revient de droit à ses oppresseurs communistes !"
 KMT_anti_soviet_isolation_tactics:0 "Tactiques d’isolement anti-soviétiques"
 KMT_anti_soviet_isolation_tactics_desc:0 "Nous ferons tout notre possible pour isoler les Soviétiques de leurs alliés à l’est, les rendant vulnérables à toute attaque de notre part ou du Japon."
 KMT_indochinese_liberation:0 "Exiger la liberté indochinoise"
 KMT_indochinese_liberation_desc:0 "Nous exigerons que les Français se retirent des terres d’Indochine, permettant la naissance d’un État indochinois libre !"
 KMT_the_son:0 "Le fils"
 KMT_the_son_desc:0 "Il est temps de rapatrier Chiang Wei-Kuo, le deuxième fils de Chiang, d’Europe ! Il servira désormais la patrie et nous aidera à mettre à profit ses connaissances pour forger notre armée vers la grandeur !"
 KMT_the_true_enemy_desc:0 "Tandis que les Japonais sont une maladie de la peau, les bandits communistes sont une maladie du cœur. Pour sauver la Chine, nous devons d’abord la purifier de tous les traîtres."
 KMT_SHX_offer2_desc:0 "Le fief de Yan nous refuse l'accès militaire. Si nous le forçons à se soumettre, nous pouvons encercler les communistes et les écraser une fois pour toutes."
 KMT_preparations_to_fight_the_soviet_imperialists_desc:0 "Après leur quasi-destruction pendant la Longue Marche, les bandits communistes se cachent dans la région de Shaanxi. Nous devons attaquer avant qu'ils ne puissent récupérer !"
 KMT_strike_PRC2_desc:0 "Les bandits sont encore en train de se remettre de la Longue Marche. Nous devons frapper quand ils sont faibles !"
 KMT_ultimatum_to_the_warlords_desc:0 "Maintenant que nous avons détruit les bandits communistes, il est temps pour les seigneurs de la guerre de rencontrer l'épée. Ils ont volé le peuple pendant trop longtemps. Nous devons achever la Révolution Nationale !"
 KMT_sinkiang_issue_desc:0 "Le Sinkiang est une partie inaliénable de la Chine ; le gouverneur local s'est révélé être un séparatiste. Nous demandons leur soumission rapide et immédiate ; si cet ultimatum ne fonctionne pas, notre armée devrait suffire à les faire se rendre."
 KMT_the_foreign_imminent_threat_desc:0 "Bien que les communistes soient une menace sérieuse, le Japon peut anéantir la nation chinoise entière. Ils ne se contenteront pas de la Mandchourie. Un jour, ils essaieront de prendre le reste de la Chine aussi. Nous devons faire tout notre possible pour nous préparer à la tempête."
 KMT_mass_fortifications:0 "Fortification de Masse"
 KMT_mass_fortifications_desc:0 "Avec les Japonais sondant la zone autour de Pékin, leurs intentions deviennent claires. Nous devons fortifier nos frontières. Nous ne leur laisserons pas un pouce du sol sacré chinois !"
 KMT_coastal_fortifications_desc:0 "Compte tenu de leur maîtrise des mers, les Japonais lanceront sans doute des invasions côtières en cas de guerre. Nous devons nous préparer tant que nous le pouvons. Nous n'abandonnerons pas le Paris de l'Orient sans nous battre !"
 KMT_national_defense_propaganda_desc:0 "Pour nous défendre contre la menace japonaise, nous devons unifier le peuple chinois. Bien que nous détestions à la fois les bandits communistes et les seigneurs de guerre, chaque homme, femme et enfant doit être prêt à se battre et à mourir ensemble pour défendre la Chine."
 KMT_ultimatum_to_tibet_desc:0 "Le Tibet est essentiel à la défense et à l'expansion future de la Chine. Cependant, la région est indépendante du pouvoir chinois depuis la révolution de 1911. Nous devons réparer cette erreur."
 KMT_befriend_tibet_desc:0 "Le Tibet est essentiel pour la défense et l'expansion future de la Chine. Cependant, le Tibet a gagné son indépendance après la révolution de 1911. Nous devons nous allier avec le Dalaï Lama et sécuriser nos flancs."
 KMT_redraw_the_mcmahon_line_desc:0 "Le Tibet a accepté l'accord honteux de Simla, qui a redessiné sa frontière avec l'Inde. Nous devons faire en sorte que cette ligne soit redessinée en notre faveur."
 KMT_industrial_effort2:0 "Investir dans l'industrie"
 KMT_industrial_effort2_desc:0 "L'industrie chinoise a toujours été en retard sur celle de l'Occident et du Japon. Pour maintenir notre indépendance, nous devons augmenter notre production industrielle. Nous pouvons également autoriser les entreprises étrangères à investir dans notre industrie."
 KMT_refound_the_jiangman_aresenal:0 "Recréer l'arsenal de Jiangnan"
 KMT_refound_the_jiangman_aresenal_desc:0 "L'arsenal de Jiangnan a fourni à la dynastie Qing des équipements de pointe. Nous devrions emprunter ce nom pour créer un complexe militaro-industriel qui pourrait servir de noyau à notre industrie de l'armement en pleine expansion."
 KMT_expand_the_navy:0 "Agrandir la marine"
 KMT_expand_the_navy_desc:0 "Nous avons perdu depuis longtemps notre supériorité navale, qui a été brisée lors de la bataille du fleuve Yalu. Avec la marine japonaise qui menace notre commerce, nous devons essayer de défendre nos navires marchands en haute mer."
 KMT_the_big_rear_plan:0 "Le plan du Grand Arrière"
 KMT_the_big_rear_plan_desc:0 "Avec la guerre qui fait rage à l'est de la Chine, notre ouest reste relativement sûr. Nous devons essayer de développer ces régions reculées afin qu'elles puissent également contribuer au combat de la Chine."
 KMT_finish_the_big_rear_plan:0 "Finir le Plan du Grand Arrière"
 KMT_finish_the_big_rear_plan_desc:0 "Plus nous perdons de terres, plus nous devons nous engager et terminer le plan Big Rear"
 KMT_nationalize_electronics_company:0 "Nationaliser la compagnie électronique"
 KMT_nationalize_electronics_company_desc:0 "Alors que l'électricité n'a pas encore atteint les campagnes, nos scientifiques sont déjà occupés à fabriquer des produits électroniques indigènes pour les marchés de Shanghai et de Hong Kong. Nous devrions prendre le contrôle de Ch'eng-kung et l'utiliser pour la recherche d'État."
 KMT_adopt_gerrman_style_equipment:0 "Adopter un équipement de type allemand"
 KMT_adopt_gerrman_style_equipment_desc:0 "Bien que nous ayons le soutien de conseillers allemands tels que Von Falkenhausen et que nous disposions de quelques équipements allemands importés, nos modèles produits localement sont d'une qualité horrible. L'utilisation d'équipements allemands comme modèles dans notre processus de fabrication peut multiplier notre qualité par huit !"
 KMT_lure_them_in_strategy2:0 "Stratégie « Leurres et pièges »"
 KMT_lure_them_in_strategy2_desc:0 "Avec le vaste territoire et le terrain accidenté de notre nation, nous pouvons nous permettre de battre en retraite et d'attirer les envahisseurs sur nos champs de bataille choisis. Que les impérialistes essaient de nous pourchasser ! Ils trouveront une embuscade à chaque coin de rue et un piège à chaque pas !"
 KMT_airbase_expansion:0 "Extension de la base aérienne"
 KMT_airbase_expansion_desc:0 "Nous avons besoin de bases aériennes pour que nos avions puissent décoller et atterrir, sinon ils ne seront qu'un tas d'objets exposés dans un entrepôt."
 KMT_national_resources_commission2:0 "Commission nationale des ressources"
 KMT_national_resources_commission2_desc:0 "La Commission nationale des ressources (CNR) est un institut chargé de la prospection et de l'exploitation des ressources en Chine. Sa création permettra d'améliorer considérablement nos efforts pour obtenir des ressources naturelles."
 KMT_national_defense_council2:0 "Conseil de défense nationale"
 KMT_national_defense_council2_desc:0 "Avec les Japonais et les bandits communistes qui nuisent à notre nation, nous devons trouver un moyen d'organiser notre défense contre eux. Nous devrions également essayer d'importer des équipements modernes à l'étranger."
 KMT_expand_the_jiangman_shipyard_group:0 "Développer le groupe du chantier naval de Jiangnan"
 KMT_expand_the_jiangman_shipyard_group_desc:0 "Nous devons développer la capacité de l'arsenal de Jiangnan à construire des navires ; cela nous permettra de disposer d'une meilleure marine pour faire face aux menaces futures."
 KMT_revive_the_hanyang_arsenal:0 "Faire revivre l'arsenal de Hanyang"
 KMT_revive_the_hanyang_arsenal_desc:0 "L'arsenal de Hanyang était l'un des arsenaux les plus importants et les plus performants pendant le mouvement d'autosuffisance lancé par les fonctionnaires Qing. Nous pouvons le revitaliser afin de produire des équipements de pointe pour notre armée."
 KMT_reorganize_the_ROCAF:0 "Réorganiser le ROCAF"
 KMT_reorganize_the_ROCAF_desc:0 "Nous avons toujours négligé notre force aérienne. Si nous voulons être en mesure de faire un effort pour combattre dans les airs, la branche doit être sérieusement réformée."
 KMT_the_flying_tigers:0 "Les Flying Tigers"
 KMT_the_flying_tigers_desc:0 "Conscient de la justesse de notre cause, un groupe de pilotes américains s'est porté volontaire pour rejoindre en masse notre force aérienne. Nous devrions utiliser ces hommes bien entraînés comme noyau d'élite d'une force aérienne nouvelle et revitalisée."
 KMT_study_foreign_ship2:0 "Étudier la conception des navires étrangers"
 KMT_study_foreign_ship2_desc:0 "Nous sommes à la traîne des autres nations dans la conception des navires. Pour construire un jour une marine de premier ordre, nous devons apprendre ce qui rend leurs navires supérieurs."
 KMT_demand_taiwan2:0 "Demander Taïwan"
 KMT_demand_taiwan2_desc:0 "Le peuple de Taiwan doit être libéré de son dirigeant actuel et nous être rendu. Longtemps divisée, la nation doit s'unir."
 KMT_taiwan_fleet_hub2:0 "Centre de la flotte de Taïwan"
 KMT_taiwan_fleet_hub2_desc:0 "Les étrangers ont laissé derrière eux une grande quantité d'infrastructures à Taiwan. Nous devrions développer cette base pour transformer l'île entière en une base navale et un centre de production."
 KMT_break_the_first_island_chain:0 "Briser la première chaîne d'îles"
 KMT_break_the_first_island_chain_desc:0 "Si la Chine veut réaliser son plein potentiel, nous ne devons pas nous contenter de ce côté du Pacifique. Nous devons construire une flotte capable de passer devant Taïwan et le Japon."
 KMT_draw_the_nine_dash_line:0 "Tracer la ligne des neuf tirets"
 KMT_draw_the_nine_dash_line_desc:0 "La mer de Chine méridionale contient de nombreuses routes commerciales essentielles. Si nous revendiquons ce passage, nous pourrons alors progresser vers la domination de l'Asie du Sud-Est. Cependant, nous devons disposer d'une flotte capable de soutenir nos revendications et d'envoyer tout commerce hostile dans une tombe aqueuse."
 KMT_naval_equipment2:0 "Équipement naval"
 KMT_naval_equipment2_desc:0 "Une marine moderne a besoin d'équipements modernes."
 KMT_industrial_evacuations:0 "Évacuation des industries"
 KMT_industrial_evacuations_desc:0 "Nous devons évacuer notre industrie vers l’arrière-pays chinois. Cela permettra à la fois de sécuriser notre production et d’empêcher qu’elle ne tombe entre les mains des étrangers."
 KMT_break_the_second_island_chain:0 "Briser la deuxième chaîne d'îles"
 KMT_break_the_second_island_chain_desc:0 "Maintenant que nous disposons d'une flotte capable de mener le combat au-delà du Japon, nous devons construire une flotte capable de faire sentir la colère de la Chine à n'importe quelle nation du Pacifique. Nous rendrons Zheng He fier."
 KMT_mobilize_the_chinese_volk_in_the_face_of_death:0 "Mobilisation face à la mort"
 KMT_mobilize_the_chinese_volk_in_the_face_of_death_desc:0 "Alors que les Japonais l’emportent et que notre peuple se fait massacrer, nous devons nous mobiliser face à cette mort ! Nous résisterons et nous nous battrons jusqu’au dernier homme !"
 KMT_enforce_the_nine_dash_line:0 "Faire respecter la ligne des neuf traits"
 KMT_enforce_the_nine_dash_line_desc:0 "Il semble que l'affirmation de nos revendications sur la mer de Chine méridionale n'ait pas suffi. Nous devons poursuivre l'expansion de notre marine, afin de faire comprendre aux impérialistes la justesse de notre cause par la force !"
 KMT_modernize_army2:0 "Moderniser l'armée"
 KMT_modernize_army2_desc:0 "L'esprit et la compétence ne suffisent pas pour gagner une guerre. Nous avons également besoin d'un équipement moderne."
 KMT_retake_manchuria:0 "Reprendre la Mandchourie"
 KMT_retake_manchuria_desc:0 "Le Dongbei, appelé Mandchourie par les Occidentaux, est tombé aux mains des Japonais et de leurs marionnettes il y a quelques années seulement. Nous devons la reprendre !"
 KMT_fund_the_northeast_development_agency:0 "Création de l'Agence de développement du Nord-Est"
 KMT_fund_the_northeast_development_agency_desc:0 "Bien que les Japonais aient développé certaines parties de la Mandchourie, de vastes étendues de terre restent intactes. Nous devrions entreprendre un vaste effort pour faire entrer ces terres autrefois barbares dans le monde moderne."
 KMT_academia_sinica:0 "Académie Sinica"
 KMT_academia_sinica_desc:0 "Fondée en 1928, l'Academia Sinica supervise et coordonne la recherche scientifique, sociale et humaniste dans tous les instituts de recherche et universités parrainés par l'État de la République de Chine. Contrairement aux autres instituts de recherche parrainés par le gouvernement, l'Academia Sinica est directement responsable devant le président."
 KMT_expand_peking_university:0 "Agrandir l'Université de Pékin"
 KMT_expand_peking_university_desc:0 "L'université de Pékin est une institution de classe mondiale. Nous devrions lui accorder davantage de fonds et offrir des bourses aux jeunes talents afin de produire une génération de scientifiques et de dirigeants compétents."
 KMT_asylum_for_jews:0 "L'asile pour les juifs"
 KMT_asylum_for_jews_desc:0 "De nombreux Juifs ont commencé à s'installer à Shanghai après avoir été persécutés et tués en Europe. Nous devrions ouvrir nos frontières à tous les réfugiés juifs afin de pouvoir, à notre tour, profiter de leur expertise. Des ingénieurs juifs nous ont déjà apporté des modèles d'armes polonais et allemands. Que peuvent-ils faire d'autre pour leurs nouveaux protecteurs ?"
 KMT_military_science2:0 "Science Militaire"
 KMT_military_science_desc:0 "La science civile et la science militaire sont toutes deux essentielles à la force d'une nation. Un financement raisonnable des sciences rendra notre armée plus redoutable."
 KMT_the_guandi_rocket_system:0 "Le système de fusée Guandi"
 KMT_the_guandi_rocket_system_desc:0 "L'aube des roquettes dans la guerre est arrivée. Nous devons adopter ce nouveau système d'armes si nos armées veulent survivre sur le champ de bataille moderne. Que nos ennemis ressentent la rage du dieu de la guerre !"
 KMT_expand_peking_university2:0 "Éducation pour la nation"
 KMT_expand_peking_university2_desc:0 "Il ne suffit pas de permettre aux seules personnes suffisamment riches pour s'offrir une formation universitaire d'entrer dans les salles de cours. Nous devons nationaliser toutes les universités chinoises et fonder l'admission sur le mérite et non sur la richesse."
 KMT_brave_science:0 "Science courageuse"
 KMT_brave_science_desc:0 "Nos scientifiques ont eu un complexe d'infériorité, croyant qu'ils ne dépasseront jamais l'Occident, quoi qu'ils fassent. Nous devons lancer un programme de propagande pour restaurer le moral de nos scientifiques."
 KMT_nuclear_physics2:0 "Physique nucléaire"
 KMT_nuclear_physics2_desc:0 "Si les théories d'Einstein sont correctes, alors la division de l'atome pourrait produire une arme d'une puissance inouïe. Nous devrions approfondir cette possibilité."
 KMT_the_tianlong_jet_engine:0 "Le moteur à réaction de Tianlong"
 KMT_the_tianlong_jet_engine_desc:0 "Le développement de la technologie des jets mènera à notre suprématie dans les cieux. L'époque où le fantassin chinois pouvait être attaqué depuis le ciel serait enfin révolue. Notre force s'élèvera comme le dragon en vol."
 KMT_fighter_focus2:0 "Priorité aux chasseurs"
 KMT_fighter_focus2_desc:0 "La supériorité aérienne est notre première préoccupation dans le combat aérien et les chasseurs sont ceux qui font le travail."
 KMT_bomber_focus2:0 "Priorité aux bombardiers"
 KMT_bomber_focus2_desc:0 "Détruire les lignes d'approvisionnement et les usines de notre ennemi est la meilleure option dans une guerre aérienne. C'est pourquoi nous devrions nous en tenir aux bombardiers."
 KMT_cas_effort2:0 "Développement de l'appui aérien rapproché"
 KMT_cas_effort2_desc:0 "L'appui aérien rapproché est très bénéfique pour l'avancée de notre armée sur le terrain. Ces chasseurs CAS vont gagner la guerre pour nous."
 KMT_nav_effort2:0 "Développement de l'aéronavale"
 KMT_nav_effort2_desc:0 "Les bombardiers navals sont excellents dans la destruction des navires et des ports ennemis ; ils sont une partie inaliénable de la guerre navale."
 KMT_saco:0 "SACO"
 KMT_saco_desc:0 "L'Organisation coopérative sino-américaine vise à fournir un soutien en matière de renseignement à notre armée et à former des forces d'opérations spéciales."
 KMT_improve_the_burma_road:0 "Améliorer la route de Birmanie"
 KMT_improve_the_burma_road_desc:0 "Améliorer la route de Birmanie"
 KMT_industrialization_NW2:0 "Industrialisation locale : Nord-Ouest"
 KMT_industrialization_NW2_desc:0 "La région du Nord-Ouest peut sembler être une terre stérile, pour l'instant. Bientôt, elle deviendra l'une des zones les plus industrialisées."
 KMT_excavation_NW2:0 "Excavation du nord-ouest"
 KMT_excavation_NW2_desc:0 "Nous devons rechercher davantage de ressources dans notre pays pour devenir indépendants des ressources importées."
 KMT_industrialization_S2:0 "Industrialisation locale : Sud"
 KMT_industrialization_S2_desc:0 "Le Sud est peut-être l'une des régions les plus industrialisées, mais il peut être beaucoup plus amélioré."
 KMT_excavation_S2:0 "Plantation de caoutchouc"
 KMT_excavation_S2_desc:0 "Le climat du sud est très propice aux plantations de caoutchouc ; nous devrions en faire bon usage."
 KMT_excavation_NE2:0 "Prospection du nord-est"
 KMT_excavation_NE2_desc:0 "Les Japonais ont laissé de nombreux outils dans la région ; nous pouvons les utiliser pour découvrir de nouvelles ressources dans la région."
 KMT_ledo_road2:0 "Route de Ledo"
 KMT_ledo_road2_desc:0 "Les envahisseurs ont coupé la route de Birmanie ; nous devons construire une autre route depuis l'Inde pour le ravitaillement."
 KMT_dare_to_die_corps2:0 "Escadron suicide"
 KMT_dare_to_die_corps2_desc:0 "Si nous voulons gagner la guerre contre les envahisseurs, notre peuple doit être assez courageux pour ne pas craindre la mort, il doit être prêt à faire tout ce qu'il faut pour défendre notre nation."
 KMT_reuse_captured_weaponary2:0 "Réutilisation des armes capturées"
 KMT_reuse_captured_weaponary2_desc:0 "Pour mener une guerre d'usure à long terme, il est essentiel d'utiliser au mieux les équipements capturés au cours des combats afin de maintenir la puissance de nos armées."
 KMT_prepare_for_the_civil_war:0 "Se préparer à la guerre civile"
 KMT_prepare_for_the_civil_War_desc:0 "La nécessité de se préparer aux communistes se fait sentir, car ils pourraient aussi se préparer à nous."
 KMT_ultimatum_to_the_warlords_after_civil_war:0 "Unifier la Chine"
 KMT_ultimatum_to_the_warlords_after_civil_war_desc:0 "Maintenant que nous avons détruit les bandits communistes, il est temps pour les seigneurs de la guerre de rencontrer l'épée."
 KMT_offer_the_yangtze_partition:0 "Proposer la partition du Yangtze"
 KMT_offer_the_yangtze_partition_desc:0 "La guerre ne tourne pas en notre faveur, et nous sommes en train de la perdre lourdement. La [PRC.getAdjective] étant incapable de franchir nos lignes de défense sur le fleuve Yangtze, nous pouvons demander une solution diplomatique à cette guerre civile si nous sommes prêts à survivre et à épargner nos troupes épuisées."
 KMT_taiwan_bastion2:0 "Bastion Taïwanais"
 KMT_taiwan_bastion2_desc:0 "Il y a une chance que nous perdions cette guerre. Pour parer à cette éventualité, nous devons faire de Taïwan un bastion national où nous pouvons attendre et nous préparer à reprendre le continent."
 KMT_collaborate_with_collaborators:0 "Collaborer avec les collaborateurs"
 KMT_collaborate_with_collaborators_desc:0 "Les anciennes marionnettes japonaises sont toutes des traîtres, et tout le monde le sait. Mais, avec le départ des Japonais, ils peuvent servir de nouveaux maîtres."
 KMT_harsh_takeover_foc:0 "S'emparer du Hanjian"
 KMT_harsh_takeover_foc_desc:0 "Il n'y a pas besoin d'être poli avec les traîtres. Nous les arrêterons tous et mettrons leurs ressources à notre disposition."
 KMT_develop_taiwan:0 "Développer Taïwan"
 KMT_develop_taiwan_desc:0 "Taïwan a reçu beaucoup d'attention de la part des Japonais. Étant donné que la base économique taïwanaise est considérablement plus élevée que celle du reste de la Chine, il serait judicieux de la développer davantage afin qu'elle puisse servir de modèle pour la compétence de notre gouvernance."
 KMT_integrate_warlord_forces:0 "Intégrer les forces des seigneurs de guerre"
 KMT_integrate_warlord_forces_desc:0 "L'armée centrale et les forces des seigneurs de guerre constituent notre armée actuelle. Cependant, les forces des seigneurs de la guerre ne sont pas très obéissantes à nos ordres. Nous aurons une armée plus efficace si nous parvenons à gagner leur confiance."
 KMT_focus_on_the_central_army:0 "Focus sur l'armée centrale"
 KMT_focus_on_the_central_army_desc:0 "Les forces indisciplinées des seigneurs de guerre ne méritent pas notre attention. Leur seule utilité est de servir de chair à canon et d'appât pendant que notre armée centrale porte le coup à nos ennemis."
 KMT_increase_sino_german_cooperation2:0 "Accroître la coopération sino-allemande"
 KMT_increase_sino_german_cooperation2_desc:0 "Nous devrions coopérer davantage avec l'Allemagne. De cette façon, nous aurons un meilleur avantage sur nos ennemis."
 KMT_indiscrimatory_conscription_tt: "Modifie §YManque de soutien pour la conscription§! par :\n Facteur de population mobilisable §G+10 %§!\n Facteur d’attaque de l’armée §R−5 %§!\n Taux de récupération §R−5 %§!"
 KMT_unindiscrimatory_conscription_tt: "Modifier §YManque de soutien pour la conscription§! par :\n Facteur de population mobilisable §R−10 %§!\n Facteur d’attaque de l’armée §G+5 %§!\n Taux de récupération §G+5 %§!"
 KMT_special_military_pay_tt: "Modifier §YManque de soutien pour la conscription§! par :\n Facteur de population mobilisable §G+7,5 %§!\n Nombre prévu d’usines affectées aux biens de consommation §Y+5 %§!"
 KMT_unspecial_military_pay_tt: "Modifier §YManque de soutien pour la conscription§! par :\n Facteur de population mobilisable §R−7,5 %§!\n Nombre prévu d’usines affectées aux biens de consommation §Y−5 %§!"
 KMT_reducing_stuff: "Réduit déjà les méthodes de conscription"
 KMT_hunt_draft_dodgers_tt: "Modifier §YManque de soutien pour la conscription§! par: \n Facteur de population mobilisable §G+7,5 %§! \n Stabilité §R−10 %§!"
 KMT_unhunt_draft_dodgers_tt: "Modifier §YManque de soutien pour la conscription§! par :\n Facteur de population mobilisable §R−7,5 %§!\n Stabilité §G+10 %§!"
 KMT_special_military_pay: "Paie militaire spéciale"
 KMT_unspecial_military_pay: "Réduire la paie militaire spéciale"
 KMT_hunt_draft_dodgers: "Chasse aux déserteurs"
 KMT_unhunt_draft_dodgers: "Réduire la chasse aux déserteurs"
 KMT_indiscrimatory_conscription: "Conscription indiscriminée"
 KMT_unindiscrimatory_conscription: "Réduire la conscription indiscriminée"
 KMT_lacking_support_for_conscription: "Manque de soutien pour la conscription"
 KMT_lacking_support_for_conscription_desc: "Notre État manque de moyens pour appliquer la conscription à l’échelle nationale. De plus, de nombreux goulots d’étranglement empêchent la levée d’une grande armée, car en faire trop provoquerait une famine massive."
 KMT_the_kuomintang_natl_revolution_desc: "La Révolution nationale du Kuomintang a bien progressé vers son objectif final : l’unification du pays. Pourtant, ce mouvement politiquement fragmenté a peu à peu stagné et est enclin aux luttes internes. Ainsi, il reste incertain qu’il parvienne à réaliser son but ultime : l’unification de la Chine."
 KMT_corruption_tt: "Cela aggravera la §Ycorruption§! au sein du §2KMT§!..."
 KMT_tributary_tooltip_tt: "Terminer cette action obligera quiconque rejoindra une faction dirigée par vous à verser un tribut."
 KMT_unlock_more_focuses_tt: "Terminer cette action fera progresser le destin de la Chine et débloquera de nouvelles options..."
 KMT_the_long_catchup_game: "The Long Catchup Game"
 KMT_tlcg_tt: "Has unlocked more techs than Japan"
 KMT_natl_congress_tt:0 "§RThe Fate of China will be determined... Make sure you are prepared and your favored side has consolidated power in China.§!"
 KMT_nlm_fcm_tt: "The focuses §YDestroy the New Life Movement§! and §YRevive the New Life Movement§! are mutually exclusive"
 KMT_no_corruption_tt: "Completing this focus when [PRC.GetNameDef] does not exist will get their generals to join you, removing your corrupt army."
 KMT_xueliang_tt: "Xueliang is a strong advocate for a United Front against Japan...\n§tShould such a meeting go wrong this could have drastic consequences for Chiang§!"
 KMT_the_son_tt:0 "Create new General §YChiang Wei-Kuo§! and unlock his theorist"
 KMT_remove_all_fascism_and_gain_stab:0 "The Blueshirts will be destroyed, Removing all ticking Fascism Support, giving 20 percent Stability, and removing all buffs the Blueshirts have given"
 KMT_announce_results_tt:0 "§RYou must Announce the Election Results within 50 days of this focus or there will be consequences...§!"
 KMT_announce_results_via_button_tt: "§YElection Results§! can still be announced via the §YNational Elections§!"
 KMT_announce_results: "Announce the Election Results"
 KMT_elecions_in_a_year_tt:0 "§RYou Have Promised your People Elections within a Year... They expect and demand you fulfill this...§!"
 KMT_the_chinese_national_state_focus:0 "The Chinese National State"
 KMT_the_chinese_national_state_focus_desc:0 "With our triumph over the degenerates and communists in our Nation it is time to declare a new, pure state! Glory to the Chinese Nation and its State!"
 KMT_democratic_opposition3:0 "Democratic Opposition"
 KMT_democratic_opposition2:0 "Democratic Opposition"
 KMT_democratic_opposition:0 "Democratic Opposition"
 KMT_powerful_blueshirts2:0 "Powerful Blueshirts"
 KMT_powerful_blueshirts3:0 "Powerful Blueshirts"
 KMT_powerful_blueshirts4:0 "Expanded Blueshirt and Secret Police Activities"
 KMT_powerful_blueshirts4_no_lar:0 "Expanded Blueshirt and Secret Police Activities"
 KMT_powerful_blueshirts5:0 "A Regime in the Shadows"
 KMT_powerful_blueshirts5_no_lar:0 "A Regime in the Shadows"
 KMT_puppetmaster:0 "The Chinese Puppetmaster"
 KMT_an_oath_of_loyalty:0 "An Oath of Loyalty"
 KMT_depoliticized_army: "Depoliticized Army"
 KMT_depoliticized_army2: "Depoliticized Army"
 KMT_secularism: "Secularism"
 KMT_democracy_of_the_proletariat: "Democracy of the Proletariat"
 KMT_democracy_of_the_proletariat_desc: "The way of socialism and the workers is not that of a dictatorship like Stalin's, instead let us bring about democracy in our new China."
 KMT_democracy_of_the_proletariat2: "Democracy of the Proletariat"
 KMT_own_all_of_china_and_mongolia_and_tuva: "Owns and Controls all Chinese and Mongolian Cores along with Tuva"
 KMT_the_new_way: "The New Way"
 KMT_the_new_way2: "The New Way"
 KMT_the_new_way3: "The New Way"
 KMT_free_speech: "Freedom of Speech"
 KMT_independent_judiciary: "Independent Judiciary"
 KMT_science_funding2: "Academia Sinica"
 KMT_the_new_communist_woman:0 "The New Communist Woman"
 KMT_the_new_communist_woman_desc:0 "The political revolution brought freedom to millions of people in our Union, first among them the millions of women who are no longer confined to just being wives and mothers, but who can now also stand as fully equal in the workplace as well."
 KMT_expand_the_agitrop:0 "Expand the Agitprop"
 KMT_expand_the_agitrop_desc:0 "To reach millions of workers throughout our Union, we must speak their language. We must make our arguments simple and easily understandable, so that they remain in the memory of the common citizen. We should further expand our efforts in this area."
 KMT_positive_heroism:0 "Positive Heroism"
 KMT_positive_heroism_desc:1 "While all accomplishments by members of the working class are shared by all members of the working class, we can still point to individuals as examples that others should emulate."
 KMT_import_the_stakhanovite_movement:0 "Import the Stakhanovite Movement"
 SOV_revive_the_stakhanovite_movement_desc:0 "We have seen the effect the Stakhanovite Movement has had upon Russia, let us bring this to our own nation!"
 KMT_war_heroes:0 "War Heroes"
 KMT_war_heroes_desc:0 "Chinese have always been able and willing to perform deeds of extreme bravery in the cause of defeating any invader of the motherland. While we are united in our struggle against the enemy, we should not pretend that there aren't some soldiers in our military who have gone far beyond the call of duty."
 KMT_collectivist_propaganda:0 "Collectivist Propaganda"
 KMT_collectivist_propaganda_desc:1 "The many challenges facing us never face any citizen alone. All our struggles are shared struggles, consequently, all our achievements are shared achievements."
 KMT_socialist_emulation:0 "Émulation socialiste"
 KMT_socialist_emulation_desc:0 "Dans le système capitaliste, les travailleurs sont en rivalité les uns contre les autres afin de gagner chaque jour leur pain, tout pendant que les possédants profitent de leurs efforts pour accroître leur productivité individuelle. C'est un gâchis en plus d'être inhumain. Un système socialiste, lui, soutient chacun, lui permettant d'apprendre des meilleurs, de les imiter et d'exceller à son tour."
 KMT_socialist_realism:0 "Réalisme socialiste"
 KMT_socialist_realism_desc:1 "La route vers un avenir socialiste brillant est longue et souvent sinueuse. Certaines personnes pourraient même perdre espoir que cet objectif puisse un jour être atteint. Nous devons leur montrer exactement ce pour quoi elles travaillent, en promouvant un style artistique qui montre à quoi ressemblerait réellement la vie dans un pays socialiste."
 KMT_wang_ming: "Président Wang"
 KMT_wang_ming_desc: "Avec l’aide de Moscou, Wang Ming a remporté la lutte pour le pouvoir en Chine ! Gloire au grand vainqueur !"
 KMT_import_the_stalin_constituion: "Importer la Constitution de Staline"
 KMT_import_the_stalin_constituion_desc: "Nous avons vu le succès de la Constitution de Staline en Russie, nous l’adopterons donc en Chine !"
 KMT_secure_the_administration:0 "Sécuriser l’administration"
 KMT_secure_the_administration_desc:0 "Avec la récente révolution et le chaos de la lutte pour le pouvoir, nous devons nous interroger sur la loyauté des membres du parti. Il est impératif que nous sachions où se situe chaque membre du Politburo."
 KMT_accelerate_the_collectivization_process:0 "Accélérer le processus de collectivisation"
 KMT_accelerate_the_collectivization_process_desc:0 "Bien qu’il reste encore beaucoup de travail à faire, et que certaines régions l’aient mal géré, le processus de collectivisation des fermes en Chine doit être mené à bien et augmentera bientôt la production agricole."
 KMT_the_workers_dictatorship:0 "Dictature du prolétariat"
 KMT_the_workers_dictatorship_desc:0 "Tout le pouvoir dans notre Union doit finalement reposer sur les travailleurs. Nous ne pouvons pas nous permettre de nous diviser en factions et devons donc nous assurer que la volonté des travailleurs soit toujours reflétée dans les décisions du Politburo."
 KMT_centralization_and_discipline:0 "Centralisation et discipline"
 KMT_centralization_and_discipline_desc:0 "En ces temps d’incertitude, le peuple se tourne vers le Politburo pour obtenir stabilité et orientation. Nous devons veiller à ce que cet organe décisionnel soutienne et soit uni derrière les décisions du camarade Staline."
 KMT_chinese_war_economy:0 "Guerre économique chinoise"
 KMT_chinese_war_economy_desc:0 "Il est clair que les nations capitalistes et réactionnaires à nos frontières prévoient de frapper dans notre moment de faiblesse. Plus tôt nous adapterons notre économie à un régime de guerre, mieux ce sera."
 KMT_chen_duxiu: "Président Chen"
 KMT_chen_duxiu_desc: "Avec l’aide de Moscou, Chen Duxiu a remporté la lutte pour le pouvoir en Chine ! Gloire au grand vainqueur !"
 KMT_denounce_the_maoist_stalinist_line: "Dénoncer la ligne maoïste-stalinienne"
 KMT_denounce_the_maoist_stalinist_line_desc: "Mao et Staline, et leurs principes dictatoriaux, ont causé de grands dommages à notre nation. Cela doit être arrêté et leur idéologie détruite."
 KMT_assist_the_ordinary_soldier_desc: "Plutôt que de soutenir uniquement les officiers supérieurs, nous soutiendrons l’homme ordinaire, gagnant ainsi sa loyauté et sa confiance."
 KMT_rebuild_the_national_assembly:0 "Reconstruire l’Assemblée nationale"
 KMT_rebuild_the_national_assembly_desc:0 "Nous nous efforcerons de reconstruire l’assemblée nationale et de lui donner du pouvoir sur le président, pour garantir l’absence de corruption."
 KMT_found_the_legislative_yuan:0 "Fonder le Yuan législatif"
 KMT_found_the_legislative_yuan_desc:0 "Nous fonderons le Yuan législatif et veillerons à avoir une force modératrice de législation dans notre nation. Cela nous aidera à protéger la démocratie dans notre grande nation !"
 KMT_birth_of_the_control_yuan:0 "Naissance du Yuan de contrôle"
 KMT_birth_of_the_control_yuan_desc:0 "Notre nouveau gouvernement cherchera à créer une troisième force dans le pays : le Yuan de contrôle. Il fonctionnera comme une cour judiciaire pour s’assurer qu’aucun législateur ou président n’abuse de son pouvoir pour saper notre précieuse démocratie."
 KMT_supply_the_west:0 "Approvisionner la campagne de l’Ouest"
 KMT_supply_the_west_desc:0 "Une voie ferrée sera construite pour approvisionner la poursuite de la réclamation de l’Ouest ! Cela nous permettra de mener de nouvelles opérations militaires à grande échelle et de traiter les séparatistes."
 KMT_uphold_democratic_centralism:0 "Soutenir le centralisme démocratique"
 KMT_uphold_democratic_centralism_desc:0 "Le nouveau gouvernement maintient le centralisme démocratique de l’ancien KMT, s’assurant que nos décisions politiques NE soient pas contournées ou critiquées !"
 KMT_preempt_the_dissenters:0 "Prévenir les dissidents"
 KMT_preempt_the_dissenters_desc:0 "Il est urgent de prévenir les dissidents de gauche cherchant à renverser l’état de droit dans notre nation, en les emprisonnant avant qu’ils ne causent des problèmes. Vive la Révolution du Kuomintang et mort aux traîtres !"
 KMT_enshrine_kmt_power:0 "Consolider le pouvoir du KMT"
 KMT_enshrine_kmt_power_desc:0 "Nos bureaucrates travaillent jour et nuit pour consolider le pouvoir du Kuomintang. Cela ne sera pas arrêté et la Révolution sera assurée !"
 KMT_display_chaings_crimes:0 "Exposer les crimes de Chiang"
 KMT_display_chaings_crimes_desc:0 "L’État doit désormais montrer au peuple l’étendue réelle des crimes de Chiang. Espérons que cela contribuera à prouver la légitimité de notre nouveau gouvernement et à renforcer la confiance envers celui-ci."
 KMT_yet_honor_his_successes:0 "Mais honorer ses succès"
 KMT_yet_honor_his_successes_desc:0 "Bien que Chiang ait commis de nombreux actes atroces, nous ne nous concentrerons pas uniquement sur ceux-ci, mais montrerons également ses grands succès et les grandes choses qu’il a accomplies pour notre nation ! N’est-ce pas lui qui a lancé la Révolution du Kuomintang ?"
 KMT_the_right_men_in_the_right_places:0 "Les hommes qu’il faut aux bons endroits"
 KMT_the_right_men_in_the_right_places_desc:0 "Avec le grand succès de notre régime et l’autonomisation de nos alliés, nous avons désormais tous nos hommes à tous les postes de pouvoir. Le Parti exercera désormais un contrôle total sur la nation."
 KMT_all_glory_to_the_dang:0 "Gloire au Dang"
 KMT_all_glory_to_the_dang_desc:0 "Avec notre prise complète de tous les aspects de l’État, nous pouvons le dire de tout cœur ! Gloire au Kuomintang populaire et à sa grande et réussie Révolution !"
 KMT_the_anti_imperial_league:0 "La Ligue anti-impérialiste"
 KMT_the_anti_imperial_league_desc:0 "Alors que l’Asie est envahie par l’impérialisme, nous devrons la sauver de celui-ci : les occidentaux, les Soviétiques et les Japonais doivent tous être combattus !"
 KMT_the_blue_dictatorship:0 "La dictature bleue"
 KMT_the_blue_dictatorship_desc:0 "Avec la prise complète du pouvoir, nous contrôlons désormais toutes les parties de l’État, Chiang et les Chemises bleues règnent en maître et personne ne peut rien y changer !"
 KMT_the_slippery_slope_to_fascism:0 "La pente glissante vers le fascisme"
 KMT_the_slippery_slope_to_fascism_desc:0 "Alors que notre régime et les Chemises bleues dérivent de plus en plus vers le fascisme, nous allons l’embrasser, utilisant la nature de notre régime pour assurer le plein pouvoir pour nous-mêmes !"
 KMT_secure_the_new_state:0 "Sécuriser le nouvel État"
 KMT_secure_the_new_state_desc:0 "Il est temps de prendre le contrôle complet de la Chine par les Chemises bleues, Chiang les mènera à la gloire et anéantira toute résistance de quiconque oserait s’opposer à nous !"
 KMT_a_regime_in_the_shadows:0 "Un régime dans l’ombre"
 KMT_a_regime_in_the_shadows_desc:0 "We have created for ourselves a regime in the shadows, one where all is controlled by us! None shall hide from our gaze and go unpunished! None will oppose Chiang Kai Shek!"
 KMT_expand_secret_police_operations:0 "Expand Secret Police Operations"
 KMT_expand_secret_police_operations_desc:0 "The Blueshirts expand secret police operations to resist those who oppose our new rule over China! All dissent will be found and purged."
 KMT_free_china_movement:0 "Free China Movement"
 KMT_final_electoral_preparations:0 "Final Electoral Preparations"
 KMT_final_electoral_preparations_desc:0 "With the National Congress held, it is time for the last preparations for the elections to be made! Long live the future of the Revolution!"
 KMT_the_results:0 "The Results"
 KMT_the_results_desc:0 "It is now time to announce the Results of our elections! The People's voices will be heard and Democracy brought forth!"
 KMT_prepare_for_new_eletions:0 "Announce New Elections"
 KMT_prepare_for_new_eletions_desc:0 "The Party now announces new elections within a year! We have made this bold promise now, it is up to us to keep it..."
 KMT_hold_new_elections:0 "Hold the Promised Elections"
 KMT_hold_new_elections_desc:0 "With all in place, it is high time we fulfilled our promises. New elections will be held, and they will be held now."
 KMT_the_first_replublican_elections:0 "the First Republican Elections"
 KMT_the_first_replublican_elections_desc:0 "With all in place, it is time to fully take action, to bring China to a true place of democracy, holding the first real elections in China since the dawn of time, greater and better than any of the Xinhai revolution!"
 KMT_a_new_dawn:0 "A New Dawn"
 KMT_a_new_dawn_desc:0 "with power secured, we shall bring about a new dawn for China, the status quo will be broken and democracy shall be brought about in China!"
 KMT_the_silent_takeover:0 "The Silent Takeover"
 KMT_the_silent_takeover_desc:0 "Unbeknownst to our enemy, we have infiltrated every part of their camp during the past days, months, and years. Now without any visible change from outside we will bring about our plans for China's fate."
 KMT_the_status_quo:0 "The Status Quo"
 KMT_the_status_quo_desc:0 "Thinking that the National Congress would solve all of China's Problems has been a failure, we have made a grave mistake in doing so. China has now fallen into a state of status quo, where we will stagnate for the foreseeable future!"
 KMT_uneasy_status_quo:0 "Uneasy Status Quo"
 KMT_leftist_dissent:0 "Leftist Dissent"
 KMT_state_within_a_state:0 "the State Within the State"
 KMT_a_new_and_better_chiang:0 "A New and Better Chiang"
 KMT_a_new_and_better_chiang_desc:0 "Having shown the grave mistakes and the glories of Chiang, we shall coopt this, declaring ourselves the better, purer version of Chiang, capable of doing what he couldn't and resisting his evils."
 KMT_a_state_within_a_state:0 "A State Within the State"
 KMT_a_state_within_a_state_desc:0 "Le Kuomintang a pris le pouvoir sur l'ensemble de l'appareil d'État et s'en est servi pour créer un sous-État en son sein. Cela lui a permis de conserver le pouvoir sur le gouvernement central, quel que soit le titulaire du poste."
 KMT_limit_the_executive_yuan:0 "Limit the Executive Yuan"
 KMT_limit_the_executive_yuan_desc:0 "The new formed government limits the executive Yuan's Power, preventing the taking over of power by one person."
 KMT_empower_the_legislature:0 "Empower the Legislature"
 KMT_empower_the_legislature_desc:0 "The new formed government empowers the Legislature in the new state, allowing for a strong rule of law and enforcement of governance!"
 KMT_silence_rightist_legislators:0 "Silence Rightist Legislators"
 KMT_silence_rightist_legislators_desc:0 "We must act to silence rightist legislators who oppose our righteous rule of law! We will enforce our morals through the rule of law no matter what!"
 KMT_full_unity_of_action:0 "Full Unity of Action"
 KMT_full_unity_of_action_desc:0 "Our state will use our Leninist elements to insure that all opposition will work with us ensuring unity of action in all of our quests!"
 KMT_maintain_kmt_purity:0 "Maintain KMT Purity"
 KMT_maintain_kmt_purity_desc:0 "It is imperative to maintain purity in our party, making clear that we are not communists, rather we are democrats."
 KMT_purge_disloyal_generals:0 "Sideline Disloyal Generals"
 KMT_purge_disloyal_generals_desc:0 "The state shall purge all Generals dissenting against our new Leftist Regime! All will bow to the Glory of the new KMT!"
 KMT_dechiangification_of_the_army:0 "Dechiangification of the Army"
 KMT_dechiangification_of_the_army_desc:0 "We must act fast to purge the Chiangist influence in the Army, ensuring its neutrality and loyalty!"
 KMT_fully_bolshevise_the_army:0 "Fully Bolshevize the Army"
 KMT_fully_bolshevise_the_army_desc:0 "The time has come to fully Bolshevize the army according to our standards!"
 KMT_fuse_the_army_into_the_state:0 "Fuse the Army into the State"
 KMT_fuse_the_army_into_the_state_desc:0 "To secure our power, the Army will be fused into the State allowing for us to consolidate full control for our new socialist regime."
 KMT_the_economic_national_revolution:0 "The Economic National Revolution"
 KMT_the_economic_national_revolution_desc:0 "We will do a second economic Revolution in China, bringing about great things for our people and redistributing wealth!"
 KMT_moderate_the_revolution:0 "Moderate the Revolution"
 KMT_moderate_the_revolution_desc:0 "It is prudent to moderate our economic revolution to insure that our people do not revolt and cause issues."
 KMT_the_young_guard:0 "The Young Guard"
 KMT_the_young_guard_desc:0 "The people support the Young Guard of the KMT, the Leftists, now that they are back and legal. They have won the elections and may now have a shot of leading China into a new dawn."
 KMT_maintain_the_saction_against_communsim:0 "Maintain the Sanction Against Communism"
 KMT_maintain_the_saction_against_communsim_desc:0 "With the state being secured, we make sure to maintain our sanction against communism, making sure that this degeneracy is completely destroyed, allowing us to resist its disgusting influence over our people."
 KMT_in_the_shadow_of_chiang_kai_shek:0 "In the Shadow of Chiang Kai Shek"
 KMT_the_old_guard:0 "La vieille garde"
 KMT_the_old_guard_desc:0 "La vieille garde du Kuomintang a remporté la victoire, vive le Kuomintang et vive la République chinoise !"
 KMT_destroy_the_new_life_movement:0 "Destroy the New Life Movement"
 KMT_destroy_the_new_life_movement_desc:0 "With our power secured, we will destroy the vestiges of the new life movement, a fascist movement set in power by Chiang for his own good, against the will of the people. This must be stopped and destroyed."
 KMT_the_free_china_movement:0 "The Free China Movement"
 KMT_the_free_china_movement_desc:0 "The new government will create a new movement, greater and better than that old new life movement. The Free China movement will bring about greatness among our people and bring them great glory in the future."
 KMT_end_the_blueshirt_sharade:0 "End the Blueshirt Charade"
 KMT_end_the_blueshirt_sharade_desc:0 "The Blueshirts have been allowed to run rampant in China for far too long. We must put an end to these horrid troublemakers."
 KMT_a_suitable_president:0 "A Suitable President"
 KMT_a_suitable_president_desc:0 "With our victory in the elections, it is time to make Hu Shih officially the president, so that he may now lead China to victory!"
 KMT_president_of_all_china:0 "President of all China"
 KMT_chiangs_heir:0 "Chiang's Heir"
 KMT_commander_in_chief:0 "Commander in Chief"
 KMT_veangeful:0 "Vengeful"
 KMT_military_support:0 "Military Support"
 KMT_stack_the_high_command:0 "Stack the High Command"
 KMT_chaos_in_the_capital:0 "Chaos in the Capital"
 KMT_dissolved_democratic_institutions:0 "Dissolved Democratic Institutions"
 KMT_strengthen_democratic_institutions: "Strengthen Democratic Institutions"
 KMT_strengthen_democratic_institutions_desc: "For democracy to thrive in China, our institutions must be strengthened. Through them freedom will be secured."
 KMT_enabling_act:0 "Enabling Act"
 KMT_martial_law:0 "Martial Law"
 KMT_stacked_high_command:0 "Stacked High Command"
 KMT_increase_secret_police_authority:0 "Increase Secret Police Authority"
 KMT_increase_secret_police_authority_desc:0 "In order to help bring about our great reforms in our state, we must increase the authority of our secret police. They will help us fully take over the reigns of power and wipe out dissent."
 KMT_purge_the_blueshirt_members:0 "Defang the Blueshirts"
 KMT_purge_the_blueshirt_members_desc:0 "With our CC clique now having secured it's power, it is time to deal with the Blueshirts, who have attempted to rival us for so long. With Chiang's blessing, we shall bring this about, dealing with the Blueshirts and vanquishing them."
 KMT_chaings_right_hand_man:0 "Chiang's Right Hand"
 KMT_chiangs_right_hand_man_desc:0 "With Dai Li becoming ever more important in our regime, it is time to fully show him for who he is. He will become fully shown as the right hand of the Generalissimo, doing his bidding throughout the nation."
 KMT_loyalty_to_the_generalissimo:0 "Loyalty to the Generalissimo"
 KMT_loyalty_to_the_generalissimo_desc:0 "Dai Li will now swear loyalty to the Generalissimo, making him truly a formidable force capable of doing all the Generalissimo demands from him. None will resist Li, and thus, none will resist Chiang"
 KMT_the_diarchy:0 "The Diarchy"
 KMT_the_diarchy_desc:0 "With Dai and Chiang ever more becoming equals, it is time to consolidate their power as equals, with Chiang retaining power as the leading figure of the Nation but Dai running the interior of the state apparatus."
 KMT_disband_the_cc_clique:0 "Disband the CC Clique"
 KMT_disband_the_cc_clique_desc:0 "Having gained power over the state, we will disband the cc clique. These men have scorned us for so long. It is only right that we deal with them in this way."
 KMT_hunt_communists_in_the_street:0 "Hunt Down Communists in the Street"
 KMT_hunt_communists_in_the_street_desc:0 "Communists are a disgrace for our people. These Men have hurt us and betrayed us time and time again. We will give them what they have long had coming and slaughter them mercilessly!"
 KMT_violence_the_solution_to_opposition:0 "Violence, the Solution to Opposition"
 KMT_violence_the_solution_to_opposition_desc:0 "Violence has always been our preferred solution to opposition. We will use it to secure our rule and deal with ALL dissent!"
 KMT_gut_the_deep_state:0 "Gut the Deep State"
 KMT_gut_the_deep_state_desc:0 "The Blueshirts now gut the Deep state, destroying all resistance to our wielding of the organic state, allowing us to impose our will on the nation unshackled!"
 KMT_further_combat_illiteracy:0 "Further Combat Illiteracy"
 KMT_further_combat_illiteracy_desc:0 "The time has come to further combat illiteracy in China, according to Chiang's plans, allowing for an educated and industrious population."
 KMT_chiangs_right_hand_man:0 "The Generalissimo's Right Hand"
 KMT_chiangs_loyal_right_hand_man:0 "One in Being with the Generalissimo"
 KMT_ycp_bop: "Factionalism in the Young China Party"
 KMT_teachers: "Teachers"
 KMT_landlords_and_buinessmen: "Landlords and Businessmen"
 balanced_ycp: "Balanced YCP"
 KMT_teachers_gaining_influence: "Teachers Gaining Influence"
 KMT_teachers_influence_solidifying: "Teacher Influence Solidifying"
 KMT_teachers_supreme: "The Teachers Supreme"
 KMT_party_of_teachers: "Party of Teachers"
 KMT_landlords_rising: "Landlords and Businessmen Gaining Influence"
 KMT_landlords_solidifying: "Landlords and Businessmen Solidifying Influence"
 KMT_the_landlords_supreme: "The Landlords and Businessmen Supreme"
 KMT_party_of_landslords: "Party of Landlords and Businessmen"
 KMT_main_bop:0 "State of the Kuomintang National Revolution"
 KMT_main_bop_tt:0 "The state of the Kuomintang and its power struggle will eventually determine the fate of China and its leadership. \nIt is still to be seen who will secure China and win out in §YThe Next National Congress§!."
 KMT_party_beurocracy:0 "La bureaucratie du parti"
 KMT_chaing_kai_shek:0 "Chiang Kai Shek"
 chaing_party_balance:0 "La révolution de l'équilibre"
 chaing_gaining_influence:0 "The Chiangists gaining influence"
 chaing_influence_solidifying:0 "The Chiangist influence solidifying"
 chaing_supreme:0 "Chiang's Supremacy"
 chaing_dictatorship:0 "Chiang's Dictatorship"
 party_gaining_influence:0 "The Party gaining influence"
 party_influence_solidifying:0 "The Party influence solidifying"
 the_party_supreme:0 "The Party's Supremacy"
 the_party_dictatorship:0 "The Party Dictatorship"
 KMT_party_consolidation:0 "Party influence Consolidated"
 KMT_the_kuomintang_natl_revolution:0 "La révolution nationale du Kuomintang"
 KMT_the_cc_clique:0 "The Central Club Clique"
 KMT_organizer_of_the_clique:0 "Organizer of the Clique"
 KMT_centralize_power:0 "Centralize Power"
 KMT_CCP: "The Chinese Communist Party"
 KMT_neglecting_presidential_dutes:0 "Neglecting Presidential Duties"
 KMT_centralize_power_desc:0 "With our new regime established, we will centralize Power around our new Government, this will make our rule unstoppable and bring us great glory!"
