 MAN_puyis_circle: "La conspiration de l'empereur"
 MAN_puyis_circle_desc: "While Manchuria has been overrun by the Japanese and the Kwantung Army, and the emperor installed as a puppet monarchy by them, he is not fully loyal to his overlords.\nSome argue that he may perhaps have started his own conspiracy to overthrow the Kwantung army when the time is right and instate his own rule...\n\n £GFX_in_combat Army Percentage loyal to Puyi: [MAN_unit_percent]\n\nThe Japanese, however, are gathering suspicion of his plans and should they gain certainty of the conspiracy, then they may attempt to depose the Emperor by force...\n\n £GFX_counter_intelligence Japan is §R[?MAN.MAN_jap_hints]%§! certain of the Emperor's disloyalty"
 MAN_securing_manchuria: "La conspiration de l'empereur?"
 MAN_securing_manchuria_desc: "Au cours des dernières années, nous avons sécurisé le nord de la Chine pour nous, en utilisant l’armée du Kwantung. Nous avons ensuite placé l’empereur, Puyi, comme chef de l’État afin d’assurer la loyauté de la Mandchourie.\nCependant, ces derniers temps, nous avons entendu des rumeurs selon lesquelles Puyi comploterait contre nous. Alors que la plupart des Japonais écartent cela, certains membres de la hiérarchie militaire suggèrent que nous devrions enquêter et démettre Puyi, si cela s’avérait vrai…\n\n£GFX_counter_intelligence Notre hiérarchie militaire est §R[?MAN.MAN_jap_hints]%§! certaine de la déloyauté de l’empereur"
