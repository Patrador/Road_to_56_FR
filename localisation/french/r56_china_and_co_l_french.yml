 KMT_event.1.t:0 "L'orientation de l'ANR"
 KMT_event.1.desc:0 "Notre objectif n'a jamais été de contrôler uniquement ces petites terres. Nous sommes des nationalistes et, en tant que tels, nous cherchons à unir toute la Chine ! Cela nous amène à une question importante. Devons-nous nous concentrer sur les problèmes internes pour traiter d'abord avec les communistes et les seigneurs de la guerre, ou devons-nous nous préparer à faire face à la menace japonaise ?"
 KMT_event.1.a:0 "Nous devons nous concentrer sur le véritable ennemi, les communistes !"
 KMT_event.1.b:0 "Nous devons nous concentrer sur l'élimination de l'influence japonaise en Chine !"
 KMT_event.2.t:0 "La guerre civile du KMT"
 KMT_event.2.desc:0 "Au sein du Congrès national chinois, les Chiangistes et les politiciens pro-démocrates sont en profond désaccord. De ce fait, deux camps se sont formés et une guerre civile a éclaté entre eux. Cela nous amène à la question suivante. Qui reconnaissons-nous comme notre souverain légitime ?"
 KMT_event.2.a:0 "Nous ne reconnaissons personne et profitons de l'occasion pour nous échapper !"
 KMT_event.2.b:0 "Nous devons soutenir le généralissime"
 KMT_event.2.c:0 "La démocratie doit sauver la Chine !"
 KMT_event.2.d:0 "Nous nous contenterons de nous asseoir sur cette question et de nous ranger du côté des vainqueurs."
 KMT_event.3.t:0 "L'ARN purge nos unités !"
 KMT_event.3.desc:0 "Alors que nous luttions ensemble contre les Japonais, nos unités ont été embobinées et poignardées dans le dos par la ARN, ce qui a entraîné des pertes massives parmi nos troupes ! Cela a été fait dans le cadre de la purge nationaliste des communistes. Que devons-nous faire dans cette situation désastreuse ?"
 KMT_event.3.a:0 "Nous dénonçons le gouvernement nationaliste et nous coupons les ponts !"
 KMT_event.3.b:0 "Nous ne sommes pas en mesure de nous battre sans l'ANR à nos côtés."
 KMT_event.4.t:0 "Finalisation du projet de constitution"
 KMT_event.4.desc:0 "Le projet de constitution étant terminé, nous avons maintenant deux constitutions complètes devant nous. Nous devons choisir entre celle soutenue par les Chiangistes et celle soutenue par les Démocrates. Quelle constitution sera approuvée ?"
 KMT_event.4.a:0 "Nous soutiendrons Chiang."
 KMT_event.4.b:0 "Nous ne pouvons pas faire de choix. Abandonnez le projet !"
 KMT_event.4.c:0 "Nous soutiendrons les démocrates"
 KMT_event.5.t:0 "Le congrès national du KMT"
 KMT_event.5.desc:0 "Alors que le Congrès national et le destin de la nation sont sur le point d'être décidés, il est temps de choisir un camp."
 KMT_event.5.a:0 "Nous soutiendrons les Chiangistes"
 KMT_event.5.b:0 "Nous soutiendrons la bureaucratie du parti"
 KMT_event.6.t:0 "Exigences de Chiang"
 KMT_event.6.desc:0 "Au Congrès national, Chiang prend la parole en premier, pour le bien de toute la Chine. Selon lui, que doit faire le pays à présent ?"
 KMT_event.6.a:0 "Chiang exige le transfert total du pouvoir..."
 KMT_event.6.b:0 "Chiang ne formule aucune exigence, pour l'instant..."
 KMT_event.7.t:0 "Le parti cède"
 KMT_event.7.desc:0 "Le Parti a accepté les exigences de Chiang ! Il est désormais le seul détenteur du pouvoir en Chine ! Gloire à la révolution nationale de Chiang !"
 KMT_event.7.a:0 "Glorieux !"
 KMT_event.8.t:0 "La trahison du parti"
 KMT_event.8.desc:0 "Le Parti nous a trahis ! Il a résisté à Tchang qui, malgré lui, s'est proclamé dictateur de toute la Chine ! Cela a provoqué la révolte du Parti contre nous !"
 KMT_event.8.a:0 "Que les dieux nous aident !"
 KMT_event.9.t:0 "Les exigences du parti"
 KMT_event.9.desc:0 "Le Parti est entré en scène contre Chiang et a décidé d'exposer ses projets pour la Chine. Quels sont ces projets ?"
 KMT_event.9.a:0 "Le parti exige des élections libres"
 KMT_event.9.b:0 "Le parti n'a pas d'exigences, pour l'instant..."
 KMT_event.10.t:0 "Chiang se soumet"
 KMT_event.10.desc:0 "Chiang a décidé de se retirer et d'accepter des élections libres. Une nouvelle aube se lève sur la Chine !"
 KMT_event.10.a:0 "Glorieux !"
 KMT_event.11.t:0 "Révoltes de Chiang"
 KMT_event.11.desc:0 "Chiang a décidé qu'il devait prendre le pouvoir national, après l'avoir exigé, nous l'en avons empêché, mais il en a profité pour se révolter et nous combattre."
 KMT_event.11.a:0 "Que les dieux nous aident !"
 KMT_event.12.t:0 "Les résultats des élections"
 KMT_event.12.desc:0 "Nous avons annoncé les résultats des élections et après une course serrée, il est clair qu'un groupe de politiciens est arrivé en tête."
 KMT_event.12.a:0 "Le KMT a de nouveau gagné, sans surprise."
 KMT_event.12.b:0 "Carsun et son idéalisme ont gagné"
 KMT_event.12.c:0 "Les conservateurs du YCP l'ont emporté"
 KMT_event.13.t:0 "Le gouvernement chinois s'attaque à la Mongolie"
 KMT_event.13.desc:0 "Le gouvernement chinois cherche à déclarer la Mongolie d'un jour à l'autre ! Que faire face à ce front asiatique massif ?"
 KMT_event.13.a:0 "The Chinese must die."
 KMT_event.13.b:0 "We will agree to abandon Mongolia for peace."
 KMT_event.14.t: "China Demands Indochinese Liberation"
 KMT_event.14.desc: "After years of criticism of Imperialism in Asia, the Chinese have finally come to us and demanded the abolishment of the oppression of the peoples in Indochina. What do we do about this?"
 KMT_event.14.a: "We must fight for our Colonies!"
 KMT_event.14.b: "It is not worth fighting a Land war in Asia."
 KMT_event.15.t:0 "China Demands Korean Liberation"
 KMT_event.15.desc:0 "After years of criticism of our Imperialism, the Chinese have finally sent us an ultimatum to withdraw from Korea. What do we do about that?"
 KMT_event.15.a:0 "We will hold onto our hard earned lands"
 KMT_event.15.b:0 "We must grant them freedom"
 KMT_event.16.t:0 "La Chine nationalise nos actifs"
 KMT_event.16.desc:0 "Le KMT a nationalisé un grand nombre de nos actifs dans toute la Chine. Que faisons-nous à ce sujet ?"
 KMT_event.16.a:0 "It is fait accompli, there is nothing we can do."
 KMT_event.16.b:0 "We will hit them with a hefty embargo."
 KMT_event.17.t:0 "[PRC.GetNameDefCap] Leaves the United Front"
 KMT_event.17.desc:0 "In light of our execution of many a communist, including quite a few of the forces of [PRC.GetNameDef], [PRC.GetNameDef] has abandoned the United Front and denounced us, calling us traitors and butchers."
 KMT_event.17.a:0 "It is they who are traitors to the Nation!"
 KMT_event.18.t: "Le rameau d'olivier de Wang Jing Wei"
 KMT_event.18.desc: "Wang Jing Wei nous a fait une offre. Il nous a proposé de nous rencontrer à Taïwan pour discuter des termes d'un pacte économique et d'un accord pour nous."
 KMT_event.18.a: "Some Rapprochement may perhaps be possible"
 KMT_event.18.b: "We could never do such a thing"
 KMT_event.19.t: "The Taiwan Accords"
 KMT_event.19.desc: "China has finally made good on its promise to make a deal with us. They propose a research treaty by which they will give us a share of their economy in exchange for some help developing themselves. They additionally offer to increase this share through expansion of the treaty later."
 KMT_event.19.a: "De l'argent gratuit ? Pourquoi, bien sûr"
 KMT_event.19.b: "A Modern China? That would be our end."
 KMT_event.20.t: "China Seeks to invite Japanese Investors"
 KMT_event.20.desc: "China has proposed to renew our treaty and invite our investors. This would bring us great profits but boost their economy long term."
 KMT_event.20.a: "De l'argent gratuit ? Pourquoi, bien sûr"
 KMT_event.20.b: "We do not seek to help them in this way"
 KMT_event.21.t: "China Proposes a Scientist Exchange Program"
 KMT_event.21.desc: "China has proposed to renew our treaty and start a Scientist Exchange program. They have offered to pay to make this worth it."
 KMT_event.21.a: "De l'argent gratuit ? Pourquoi, bien sûr"
 KMT_event.21.b: "We do not seek to help them in this way"
 KMT_event.22.t: "China Seeks to Purchase Our Produce"
 KMT_event.22.desc: "China has proposed to renew our treaty and purchase vast amounts of our produce. This would bring us great profits but allow them to copy our technology."
 KMT_event.22.a: "De l'argent gratuit ? Pourquoi, bien sûr"
 KMT_event.22.b: "We do not seek to help them in this way"
 KMT_event.23.t: "China Seeks to Acquire Our Research"
 KMT_event.23.desc: "China has proposed to renew our treaty and give us a beneficial resource deal. This would help solve the resource issue but greatly help their technology."
 KMT_event.23.a: "Cheap Resources? Why, of Course"
 KMT_event.23.b: "We do not seek to help them in this way"
 KMT_event.24.t: "China Seeks to Acquire Our Expertise"
 KMT_event.24.desc: "China has proposed to renew our treaty and offer us laborers, who will probably give them some of our technological information but would be free factory manpower."
 KMT_event.24.a: "Free workers? Why, of Course"
 KMT_event.24.b: "We do not seek to help them in this way"
 KMT_event.25.t: "China Demands Land"
 KMT_event.25.desc: "China has demanded we pull out of every bit of land we own that is theirs. In exchange we will gain docking rights to ensure our naval edge. Or they will attack us with their technological edge. What do we do?"
 KMT_event.25.a: "We give in"
 KMT_event.25.b: "Our spirit will lead us to victory"
 KMT_event.26.t: "China Demands Land for Naval Bases"
 KMT_event.26.desc: "China has demanded we pull out of every bit of land we own that is theirs. Or they will attack us with their technological edge. What do we do?"
 KMT_event.26.a: "We give in"
 KMT_event.26.b: "Our spirit will lead us to victory"
 KMT_event.27.t: "China Demands Carte Blanche in Manchuria"
 KMT_event.27.desc: "China has demanded a Carte Blanche in Manchuria to take over the region without our involvement. What do we do about that?"
 KMT_event.27.a: "We give in"
 KMT_event.27.b: "We stand firm"
 KMT_event.28.t: "China Demands Carte Blanche in Manchuria for Maintaining Our Economic Influence"
 KMT_event.28.desc: "China has demanded a Carte Blanche in Manchuria to take over the region without our involvement. What do we do about that?"
 KMT_event.28.a: "We give in, after all they are paying us to do so"
 KMT_event.28.b: "We stand firm"
 KMT_event.29.t: "Japan Sells Us Out"
 KMT_event.29.desc: "China has made a deal with Japan to give us to them. What do we do about this?"
 KMT_event.29.a: "We give in, after all, Japan's wish is our command"
 KMT_event.29.b: "We must live on"
 KMT_event.30.t: "Assassin Strikes at Wang"
 KMT_event.30.desc: "Feeling that Jingwei was betraying the Chinese People by reaching out to Japan, an assassin has struck out at Wan Jingwei and attempted to kill him."
 KMT_event.30.a: "Luckily, he missed"
 KMT_event.30.b: "It seems the leader of the Kuomintang is dead. Again."
 KMT_event.31.t: "Zhang Xueliang invite Chiang à se rendre dans le Nord"
 KMT_event.31.desc: "Zhang Xueliang a invité Chiang à le rejoindre dans le nord pour planifier le sort de la Chine et de son armée. Que devons-nous faire ?"
 KMT_event.31.a: "Bien sûr, la Chine doit travailler ensemble."
 KMT_event.31.b: "Cela sent le piège à plein nez."
 KMT_event.32.t: "Zhang Xueliang tente d'enlever Chiang"
 KMT_event.32.desc: "Pour tenter d'unifier la Chine, Xueliang a décidé d'enlever Chiang afin de le forcer à négocier. Pour ce faire, il a monté une embuscade afin d'emmener Chiang en captivité."
 KMT_event.32.a: "Chiang s'est battu vaillamment, mais il a succombé à la supériorité numérique de l'ennemi."
 KMT_event.32.b: "Succombant au piège, Chiang accepte d'accompagner Xueliang et de s'entretenir avec les communistes."
 KMT_event.33.t: "Xueliang nous apporte Chiang"
 KMT_event.33.desc: "Xueliang a décidé de capturer Chiang et nous l'a amené pour le forcer à la table des négociations."
 KMT_event.33.a: "Une initiative louable, mais Chiang doit mourir."
 KMT_event.33.b: "Nous exigerons qu'il signe un accord de paix ou qu'il meure."
 KMT_event.34.t: "Mao lance un ultimatum à Chiang"
 KMT_event.34.desc: "Mao, à qui Chiang a été remis, lui a lancé un ultimatum. Il doit accepter la paix ou mourir. Qu'en penser ?"
 KMT_event.34.a: "Nous ne négocierons pas avec les traîtres"
 KMT_event.34.b: "Nous n'avons pas le choix. Nous négocions."
 KMT_event.35.t: "Jingwei s'est suicidé"
 KMT_event.35.desc: "Le Japon ayant rejeté notre offre de rencontre et s'étant montré ouvertement hostile à notre égard, Wang Jing Wei s'est suicidé, estimant que l'avenir de la Chine était sans espoir et étant lui-même le premier à être exécuté par les Japonais."
 KMT_event.35.a: "Yet, in tragedy, new hope arises"
 KMT_event.39.t: "[CHI.GetNameDef] Demands Hegemony Over Indochina"
 KMT_event.39.desc: "Today [CHI.GetNameDef] has announced to us that they demand that we transfer our colony in Indochina to them, for their own empire. While we are in no position to stop them from taking it this is an insult to us. What shall we do?"
 KMT_event.39.a: "We really have no choice here"
 KMT_event.39.b: "We will fight with honor"
 KMT_event.40.t:0 "The Chinese Government Strikes at Tuva"
 KMT_event.40.desc:0 "The Chinese Government is seeking to declare on Tuva any day now! What do we do about this massive Asian Front?"
 KMT_event.40.a:0 "The Chinese must die."
 KMT_event.40.b:0 "We will agree to abandon Tuva for peace."
 KMT_event.41.t:0 "The Chinese Empire Demands the Overturning of the Amur Annexations"
 KMT_event.41.desc:0 "The Chinese Government has stated that our annexation of the Amur regions was against international law and that these lands are Chinese. We however have settled many people there, who now live their own Russian lives. What shall we do about this ultimatum?"
 KMT_event.41.a:0 "Vladivostok is Russian"
 KMT_event.41.b:0 "We really have no means of fighting a land war in Asia"
 KMT_event.42.t:0 "The Chinese Demand Joint Rulership of Indochina"
 KMT_event.42.desc:0 "The Chinese Government has stated that Indochina is in their sphere of influence and that they are entitled to a share of its profits for not attacking it. This proposal seems quite reasonable, as it is a far away land."
 KMT_event.42.a:0 "We Reject Nonetheless"
 KMT_event.42.b:0 "Why would we not accept such a great deal?"
 KMT_event.43.t:0 "Les Chemises Bleues se soulèvent à Pékin"
 KMT_event.43.desc:0 "Les Chemises Bleues, après s'être brouillés avec nous, après nos tentatives de les dissoudre, n'ont jamais vraiment disparu... Aujourd'hui, ils se sont installés à Pékin et ont pris le contrôle de la ville. Elle est tombée. Les Chemises Bleues semblent être de retour et plus puissants que jamais."
 KMT_event.43.a: "Cela n'augure rien de bon..."
 KMT_event.44.t:0 "La déclaration et le coup d'État de Pékin"
 KMT_event.44.desc:0 "À Pékin, Dai Li a fait une proclamation, qualifiant Chiang d'imbécile et se déclarant le nouveau seigneur de la Chine. Simultanément, il a déclaré Beijing nouvelle capitale de la Chine et s'est emparé de la plus grande partie possible de l'appareil d'État. Enfin, ses troupes marchent maintenant sur Nanjing, pour s'emparer complètement de la Chine."
 KMT_event.44.a:0 "Lors de ce coup d'État, les troupes chiangistes ont fait défection et Chiang a été capturé."
 KMT_event.44.b:0 "the Chiangists stand strong, resisting this betrayal."
 KMT_event.45.t:0 "[FROM.GetNameDefCap] Declares Independence"
 KMT_event.45.desc:0 "After fleeing to our islands, the KMT has decided to abandon the concept of China and now has committed yet another act of treason and declared independence. What will we do about this?"
 KMT_event.45.a:0 "It is better to let these useless people and traitors go their own way."
 KMT_event.45.b:0 "We will end their disgusting existence"
 KMT_event.46.t:0 "[FROM.GetNameDefCap] Requests Economic Aid"
 KMT_event.46.desc:0 "After their exile to the islands, the KMT has begun to request foreign aid for their feeble and incompetent industry. What will we do about this?"
 KMT_event.46.a: "To send an advisor to help an ally would be in order"
 KMT_event.46.b:0 "We will not get involved in this issue"
 KMT_event.47.t:0 "The First National Congress Abroad"
 KMT_event.47.desc:0 "While the KMT has fallen far, we still hold a congress, and plot the future of our new realm. One day we will return. It is inevitable that Chiang will lead us to Victory and the reclamation of the homeland."
 KMT_event.47.a:0 "Through Despair, hope rises!"
 KMT_event.48.t:0 "Chiang s'adresse à la nation"
 KMT_event.48.desc:0 "Alors que Chiang commence à parler, un coup de feu part de la foule, l'un des communistes survivants tourne son arme vers lui, crie \"Vive le PCC\" et se tue, dans un suicide meurtrier. Après cet incident, le KMT se ressaisit et le fils de Chiang devient le nouveau président du KMT..."
 KMT_event.48.a:0 "Le président est mort, vive le nouveau président !"
 KMT_event.49.t:0 "Li Zongren rejoint le KMT à Nanjing"
 KMT_event.49.desc:0 "Voyant une chance d'être élu à la place de Chiang, Li Zongren est retourné à Nanjing pour prendre le contrôle de la nation et évincer définitivement Chiang."
 KMT_event.49.a:0 "Un nouveau despote ou une lueur d'espoir ?"
 KMT_event.50.t:0 "Une chance pour la présidence"
 KMT_event.50.desc:0 "Elections have come across China and Li Zongren sees a chance for winning them. Yet before doing so, he has consulted his wife, asking if he should go or not."
 KMT_event.50.a:0 "Why not? This will finally oust Chiang!"
 KMT_event.50.b:0 "The family has already suffered too much at Chiang's hands."
 KMT_event.51.t:0 "The KMT Centrists Nominate a Candidate"
 KMT_event.51.desc:0 "In the Struggle for nominating a united KMT candidate, the KMT centrists have brought forth their Candidate Today"
 KMT_event.51.a:0 "Let us win the Candidacy!"
 KMT_event.52.t:0 "The KMT Leftists Nominate a Candidate"
 KMT_event.52.desc:0 "In the Struggle for nominating a united KMT candidate, the KMT leftists have brought forth their Candidate Today"
 KMT_event.52.a:0 "Let us win the Candidacy!"
 KMT_event.52.b: "Yet as they did so, they were dissolved by the army and their candidate put under house arrest..."
 KMT_event.53.t:0 "The End of the Power Struggle"
 KMT_event.53.desc:0 "In the Struggle for nominating a united KMT candidate, the KMT has finally finished their meetings and discussions, nominating a great candidate to lead the nation into the future!"
 KMT_event.53.a:0 "Time to destroy the feeble opposition!"
 KMT_event.54.t:0 "The Leftists Abandon the KMT"
 KMT_event.54.desc:0 "After the outcome of the internal power struggle of the KMT has been such a disaster for them, the leftists in the KMT have abandoned us, flocking to the CDSP instead, seeking economic equality there."
 KMT_event.54.a:0 "Traitors!"
 KMT_event.55.t:0 "The Centrists Abandon the KMT"
 KMT_event.55.desc:0 "After the outcome of the internal power struggle of the KMT has been such a disaster for them, with the party turning towards the left, the centrists in the KMT have abandoned us, flocking to the YCP instead, seeking a united, strong China there."
 KMT_event.55.a:0 "Traitors!"
 KMT_event.56.t:0 "Chiang Himself Abandons the KMT"
 KMT_event.56.desc:0 "After the outcome of the internal power struggle of the KMT has been such a disaster for them, with the party turning towards the left, the Chiang Kai-Shek abandoned us, disavowing politics and denouncing the party that was once his."
 KMT_event.56.a:0 "Traitor!"
 KMT_event.60.t:0 "China Requests Independence"
 KMT_event.60.desc:0 "Having built themselves back up into a great beacon, the Chinese have requested independence again, while respecting our economic influence. What do we say about such an idea?"
 KMT_event.60.a:0 "This will help us reconcile"
 KMT_event.60.b: "We will grant them... nominal Independence"
 KMT_event.60.c: "This is out of the question"
 KMT_event.61.t:0 "China Offers Peace"
 KMT_event.61.desc:0 "We have seemingly lost the war against the Chinese, they have not only broken free from our rule but also pushed us out of their lands and now demand we pull our forces from their lands."
 KMT_event.61.a: "It is what it is... Alas, we have lost."
 KMT_event.61.b: "Nonetheless, we will fight to the last man."
 KMT_event.62.t:0 "Allegations of Corruption in the KMT"
 KMT_event.62.desc:0 "During our power struggle and with elections approaching, allegations of Corruption in the KMT, our ruling party, have surfaced. Many now call for a formal investigation committee to be created to investigate it. However this must be greenlighted by the KMT itself first..."
 KMT_event.62.a: "Surprisingly, the KMT allows this..."
 KMT_event.62.b: "As Expected, it has been blocked."
 KMT_event.63.t:0 "The Investigation Committee"
 KMT_event.63.desc:0 "With the committee established, it now prepares to investigate the corruption allegations, however certain people seek to bribe and influence the committee in order to use it for their own political benefit."
 KMT_event.63.a: "Despite all this, the committee remains neutral"
 KMT_event.63.b: "The committee agrees to pay 'extra attention' to Chiang's activities"
 KMT_event.63.c: "The committee agrees to watch out what may be going on in the party bureaucracy"
 KMT_event.63.d: "The committee agrees to look into suspicious leftist activities"
 KMT_event.64.t:0 "The Committee Verdict: A Guilty KMT"
 KMT_event.64.desc:0 "After much investigation, the Committee has come to the conclusion that the KMT as a whole is guilty of massive corruption. While the KMT still will be running for office, this is sure to reshuffle the cards and reduce their popularity and harm their reputation."
 KMT_event.64.a: "Perhaps we should have never allowed this investigation..."
 KMT_event.65.t:0 "The Committee Verdict: A Guilty Chiang"
 KMT_event.65.desc:0 "After much investigation and perhaps a bit of outside 'help', the committee has come to the conclusion that Chiang alone is guilty of corruption and that the KMT as a whole is fine. Chiang is fuming at this great setback and undermining of his influence."
 KMT_event.65.a: "Perfect, all goes according to plan"
 KMT_event.66.t:0 "The Committee Verdict: A Guilty Bureaucracy"
 KMT_event.66.desc:0 "After much investigation and perhaps a bit of 'help' from the inside of Chiang's pockets, the committee has come to the conclusion, that the party bureaucrats and the likes of Lin Sen alone are guilty of corruption and that the KMT as a whole is fine. These are, of course, fuming at this great setback and undermining of their influence."
 KMT_event.66.a: "Perfect, all goes according to plan"
 KMT_event.67.t:0 "The Committee Verdict: A Guilty Left"
 KMT_event.67.desc:0 "After much investigation and perhaps a bit of 'help' from the inside of Chiang's pockets, the committee has come to the conclusion, that the party leftists and the likes of Soong Qing Ling alone are guilty of corruption and that the KMT as a whole is fine. These are, of course, fuming at this great setback and undermining of their influence."
 KMT_event.67.a: "Perfect, all goes according to plan"
 KMT_event.67.b: "The Perfect excuse to ban them yet again!"
 KMT_event.70.t:0 "The Kuomintang Reaches out to us"
 KMT_event.70.desc:0 "With their new, more left wing government in charge, the KMT has reached out to us, attempting to secure our support of their government and our friendship and guidance."
 KMT_event.70.a: "Of course we will help a friend."
 KMT_event.70.b: "We will not waste our precious resources."
 KMT_event.71.t:0 "The Kuomintang Requests a Military Mission"
 KMT_event.71.desc:0 "With us helping their government, the KMT has now requested a military mission as well, to help guide their dated military and help it plan its offensives in a modern manner."
 KMT_event.71.a: "A great asset against fascism in Asia, send the men!"
 KMT_event.71.b: "We will not waste our precious resources."
 KMT_event.72.t:0 "The Kuomintang Suggests a Full Military Alliance"
 KMT_event.72.desc:0 "With us having helped both their government and army, the KMT has stated that it is obvious that their future lies in an alliance with us. They have furthermore pointed out that it would increase the effectiveness of our military cooperation and make a strong Eurasian bloc."
 KMT_event.72.a: "We welcome them with open arms!"
 KMT_event.72.b: "They are but a burden."
 KMT_event.73.t:0 "La lutte pour le pouvoir progresse"
 KMT_event.73.desc:0 "Au fur et à mesure que la lutte pour le pouvoir progresse, les candidats prononcent de grands discours devant le parti, tentant de consolider leur leadership sur celui-ci."
 KMT_event.73.a: "The results have been... interesting"
 KMT_event.74.t: "Le crépuscule de la tutelle"
 KMT_event.74.desc: "It is time, the final steps towards elections have begun as different groups in China vie for power. \nIn the §2KMT§!, various factions and cliques have used Chiang's eroded power to their advantage and caused the party to fall into a power struggle, which is no longer singlehandedly dominated by the Chiangists. This power struggle is set to determine the leader of the §2KMT§! post elections.\nMeanwhile, if given the opportunity and the legal status, the §8YCP§! and the §OCDSP§! also seek to outdo the §2KMT§! and become the new dominant political force in China... \nFinally the military dwells in the background and should they believe that things are not going well and that there is large scale fraud going on with the government refusing to announce the results after the elections completion, there lies a chance of a coup...\n\nIt seems only time can tell who will be the dominant force in China."
 KMT_event.74.a: "Let us toast to this new era!"
 KMT_event.75.t: "The Fate of the Election Results"
 KMT_event.75.desc: "While elections have been held, certain people are displeased with the results and are trying to prevent the announcing of them in order to maintain what little power they currently have."
 KMT_event.75.a: "Nonetheless, the people must know the truth."
 KMT_event.75.b: "At least for now they are successful."
 KMT_event.76.t: "China Requests a Barter Agreement"
 KMT_event.76.desc: "With the Handelsgesellschaft für Industrielle Produkte operating in China and selling them our weaponry, in order to bypass international law regarding weapons trading. China has now reached out, proposing to trade resources for Guns, in deals that will be worked out in detail once this treaty is signed..."
 KMT_event.76.a: "Business? Yes please!"
 KMT_event.76.b: "There is no need to antagonize the international community"
 KMT_event.77.t: "China Seeks to Purchase Blueprints"
 KMT_event.77.desc: "In order to modernize their outdated army, the Chinese have offered to increase our influence in their economy in exchange for some military blueprints, allowing them to enter into the modern age as a great power."
 KMT_event.77.a: "A wonderful deal!"
 KMT_event.77.b: "German Blueprints are for Germans only!"
 KMT_event.78.t: "China Seeks to Open a Military Exchange"
 KMT_event.78.desc: "In order to modernize their outdated army, the Chinese have offered to increase our influence in their economy in exchange for a military exchange. While nominally to both of our benefits, this will of course mostly help their military."
 KMT_event.78.a: "A wonderful deal!"
 KMT_event.78.b: "German Science is for Germans only!"
 KMT_event.79.t: "China Seeks to Acquire Military Experience"
 KMT_event.79.desc: "In order to modernize their outdated army, the Chinese have offered to increase our influence in their economy in exchange for a little experience."
 KMT_event.79.a: "A wonderful deal!"
 KMT_event.79.b: "German Experience is for Germans only!"
 KMT_event.80.t: "La Chine dissout l'HAPRO"
 KMT_event.80.desc: "Mécontents de notre emprise sur leur économie, les Chinois ont dissous l'HAPRO et pris leur part des bénéfices avant de partir, mettant ainsi fin à notre coopération et à notre accès à des ressources bon marché en Chine."
 KMT_event.80.a: "I guess it's fait accompli"
 KMT_event.80.b: "Damn You, Chiang!"
 GER_harpo_tt: "La Chine pourra acheter davantage de notre équipement, nous donnant de l’influence en Chine, simplifiant le commerce dans un premier temps, mais avec plus de possibilités disponibles à terme…"
 CHI_election_guide_tt: "Unlock a §YGUI§! in §Ydecisions§! noting the current state of the power struggle and party popularities, which the §2KMT§!, §8YCP§!, and §OCDSP§! buttons each opening a party unique submenu.\n\nDo not forget to announce the election results through the button in the top right corner, or a §gmilitary coup§! may take place..."
 KMT_SOV_cooperation: "Soviet military mission"
 KMT_SOV_cooperation2: "Soviet military mission"
 KMT_reach_out_to_moscow: "Reach out to Moscow"
 KMT_reach_out_to_moscow_desc: "Our diplomats have now been told to reach out to Moscow, as they are our socialist brothers and we can learn much from them, perhaps this will result in great future cooperation..."
 KMT_military_exchanges: "Military Exchanges"
 KMT_military_exchanges_desc: "With our tentative cooperation born, we will request a soviet military mission, greatly boosting the efficiency of our army and helping us become a dominant force in the future."
 KMT_full_military_alliance: "Full Military Alliance"
 KMT_full_military_alliance_desc: "We owe the Soviets so much. Therefore it would only be right to request a full military alliance with them, further strengthening the mission and forging a great Eurasian bloc!"
 KMT_moscow_nanjing: "Moscow and Nanjing are working together"
 KMT_scrifice_in_the_name_of_china: "Sacrifice in the Name of China"
 KMT_scrifice_in_the_name_of_china_desc: "Our People must learn to Sacrifice themselves for the greater good of China! China will be saved and our people will fight for it!"
 KMT_the_return_of_whampoa: "The Return of Whampoa"
 KMT_the_return_of_whampoa_desc: "Whampoa has finally consolidated full power over China! All Hail the NRA!"
 KMT_extol_china: "Extol China"
 KMT_full_military_politicization: "Full Military Politicization"
 KMT_full_military_politicization_desc: "The Whampoa army has now regained it's politicization, ensuring that it will dominate the future of China."
 KMT_help_generals_into_the_government: "Help Generals Into the Government"
 KMT_help_generals_into_the_government_desc: "Whampoa now begins to help its Generals into our Government, ensuring that the Whampoa clique will only be able to expand power."
 KMT_full_loyalty_to_the_generalissimo: "Full Loyalty to the Generalissimo"
 KMT_full_loyalty_to_the_generalissimo_desc: "The army has declared full loyalty to the generalissimo, securing the army under him."
 KMT_the_grand_goverment: "The Grand Government"
 KMT_the_grand_goverment_desc: "Whampoa will put a grand government of members of the entire Whampoa clique in power. Soon it will be able to dominate all of China."
 KMT_civilian_matters_in_civilian_hands: "Civilian Matters in Civilian hands"
 KMT_civilian_matters_in_civilian_hands_desc: "Even Whampoa recognizes that certain things are better left in civilian hands. Thus, a policy based on exactly that is to be enacted."
 KMT_arrest_key_oppositional_figures: "Arrest Key Oppositional Figures"
 KMT_arrest_key_oppositional_figures_desc: "The military police will arrest key oppositional figures, ending all opposition to the new military rule. Whampoa and the KMT must not be questioned."
 KMT_anti_conservative_censorship: "Anti Conservative Censorship"
 KMT_anti_conservative_censorship_desc: "The State will censor the democrats and conservatives in the KMT, all must bow to the Whampoa clique and its regime!"
 KMT_violence_when_necessarys: "Violence When Necessary"
 KMT_violence_when_necessarys_desc: "Nous estimons qu'il peut être nécessaire de recourir à la violence à certains moments. Ce principe que les Chemises Bleues nous ont donné sera utilisé avec succès pour sécuriser le régime."
 KMT_disband_the_cc_clique_wham: "Disband the CC Clique"
 KMT_disband_the_cc_clique_wham_desc: "The time has come to disband the CC clique and its opposition to us, destroying their pathetic uppity attitude."
 KMT_decrease_blueshirt_autonomy: "Decrease Blueshirt Autonomy"
 KMT_decrease_blueshirt_autonomy_desc: "We finally will decrease the Autonomy the Blueshirts have in the NRA and the Whampoa Clique, centralizing it and dealing with these degenerates."
 KMT_consolidate_military_power: "Consolidate Military Power"
 KMT_consolidate_military_power_desc: "We must consolidate military power in our nation, securing it for Whampoa and Whampoa alone."
 KMT_increase_military_quality_of_life: "Increase Military Quality of Life"
 KMT_increase_military_quality_of_life_desc: "The government has mandated to increase the quality of life for our soldiers to the point that it is most lucrative to fight for us, with soldiers loving us and willing to die for us."
 KMT_national_defense_fund: "National Defense Fund"
 KMT_national_defense_fund_desc: "Whampoa lacks sufficient funds... This will be fixed with our new project and fund to expand our army."
 KMT_high_pensions: "High Pensions"
 KMT_high_pensions_desc: "The Government mandates a high pension, so that our troops will be happy to fight for us and will be willing to live on even if hurt."
 KMT_a_martial_china: "A Martial State"
 KMT_a_martial_china_desc: "China has become a true military state, controlled by Whampoa and with no opposition."
 KMT_national_military_indoctrination: "National Military Indoctrination"
 KMT_national_military_indoctrination_desc: "The Nation will be indoctrinated in the lines of the military, securing full power over it for Whampoa."
 KMT_all_hail_the_nra: "All Hail the NRA"
 KMT_all_hail_the_nra_desc: "As all HAil the NRA, it secures its power over China and unites the control of it over the nation."
 KMT_a_military_to_be_proud_of_desc: "We will foster a sense of pride in our military, uniting the country around it. This will make it truly great."
 KMT_parade_on_tianmen_square: "Parade on Tiananmen Square"
 KMT_parade_on_tianmen_square_desc: "Soldiers parade on Tiananmen square, truly showing the prowess of our military."
 KMT_mandatory_work_quotas: "Mandatory Work Quotas"
 KMT_mandatory_work_quotas_desc: "The Blueshirts establish mandatory work quotas to ensure that we are producing more than our enemies."
 KMT_align_with_moscow: "Align with Moscow"
 KMT_economic_unity: "Economic Unity"
 KMT_economic_unity_desc: "We shall send the Russians and offer for closer economic cooperation, bringing about a strong future."
 KMT_military_unity_desc: "We shall send the Russians and offer for closer military cooperation, bringing about a mighty future."
 KMT_military_unity: "Military Unity"
 KMT_one_union_in_all_but_name: "One Union in All but Name"
 KMT_one_union_in_all_but_name_desc: "In recent times we have effectively become a part of the soviet union. Let us officialize this and get ourselves special legal status!"
