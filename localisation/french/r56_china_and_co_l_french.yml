 CHI_elections_CDSP_spec_button_tt: "Propagande idéaliste"
 CHI_elections_CDSP_spec_button_delayed: "Nous utiliserons notre idéalisme pour convaincre le peuple que nous sommes la véritable et juste option.\nLe §OCDSP§! gagne 1 soutien\nStabilité §G+3%§!\nChangement de popularité du Démocratique : §G+5%§!\nPouvoir politique §R-35§!"
 CHI_elections_KMT_spec_button_tt: "Manipuler les élections"
 CHI_elections_KMT_spec_button_delayed: "Afin d’assurer notre victoire, nous manipulerons les élections en utilisant de nombreuses petites astuces pour les faire pencher en notre faveur.\nLe §2KMT§! gagne 1 soutien\nStabilité §R-5%§!\nChangement de popularité du Démocratique : §R-5%§!\nPouvoir politique §G+25§!\nTant que le §2KMT§! est au pouvoir :\nGain de pouvoir politique §R-3%§!\nUsines de biens de consommation §Y3%§!"
 CHI_elections_YCP_spec_button_tt: "Propagande anti-§2KMT§!"
 CHI_elections_YCP_spec_button_delayed: "Nous montrerons au peuple que nous sommes une version meilleure et plus prospère que le §2KMT§!, poussant ainsi leurs électeurs à passer chez nous.\nLe §8YCP§! gagnera 1 soutien\nChangement de popularité du Non-aligné : §R-5%§!\nPouvoir politique §R-25§!"
